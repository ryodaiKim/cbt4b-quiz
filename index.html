<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBT 4連問</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans",
               "Yu Gothic", "Meiryo", Arial, sans-serif;
  background: #eef2f6;
  color: #1a202c;
  font-size: 15px;
  overflow: hidden;
}

.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }

/* Header */
.header {
  background: #1a3d6d;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  font-size: 14px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.15);
}
.header .spacer { flex: 1; }
.item-counter { font-weight: 500; }
.mark-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.mark-wrap input { cursor: pointer; }
.mark-wrap .flag { color: #f56565; }
.nav-btns { display: flex; align-items: center; gap: 4px; }
.hd-btn {
  background: transparent; color: #fff; border: 0;
  padding: 6px 10px; border-radius: 4px; cursor: pointer;
  font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.hd-btn:hover { background: rgba(255,255,255,0.12); }
.hd-btn .tri, .hd-btn .icon { font-size: 14px; }
.hd-btn .lbl { font-size: 12px; }
.nav-btn { flex-direction: column; gap: 0; padding: 4px 14px; }
.nav-btn .tri { font-size: 14px; }
.nav-btn .lbl { font-size: 11px; opacity: 0.9; }
.source-title { font-size: 12px; opacity: 0.75; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Layout */
.main-wrap { display: grid; grid-template-columns: 170px 1fr; height: 100%; overflow: hidden; }

.sidebar { background: #fff; border-right: 1px solid #cbd5e0; overflow-y: auto; display: flex; flex-direction: column; }
.sb-filter {
  position: sticky; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; gap: 3px;
  padding: 6px 6px 6px 6px;
  background: #f7fafc;
  border-bottom: 1px solid #cbd5e0;
}
.flt-btn {
  background: #fff;
  border: 1px solid #cbd5e0;
  color: #2d3748;
  padding: 3px 6px;
  border-radius: 3px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  flex: 1 1 auto;
  min-width: 36px;
}
.flt-btn:hover { background: #edf2f7; }
.flt-btn.active { background: #1a3d6d; color: #fff; border-color: #1a3d6d; }
.flt-btn.active[data-flt="learning"] { background: #c53030; border-color: #9b2c2c; }
.flt-btn.active[data-flt="reviewing"] { background: #d69e2e; border-color: #b7791f; }
.flt-btn.active[data-flt="mastered"] { background: #2f855a; border-color: #22543d; }
#sidebar-list { padding: 4px 0; flex: 1; }
.sb-empty { padding: 14px; color: #718096; font-size: 12px; text-align: center; }

.sb-row {
  display: grid;
  grid-template-columns: 30px 1fr 24px 18px;
  align-items: center;
  padding: 5px 8px;
  font-size: 14px;
  border-bottom: 1px solid #edf2f7;
  cursor: pointer;
  user-select: none;
}
.sb-row:hover { background: #f7fafc; }
.sb-row.active { background: #4a90d9; color: #fff; }
.sb-icon { font-weight: bold; text-align: center; font-size: 15px; }
.sb-icon.ok { color: #2f8f4a; }
.sb-icon.bad { color: #c53030; }
.sb-icon.none { color: #a0aec0; }
.sb-row.active .sb-icon.ok { color: #c6f6d5; }
.sb-row.active .sb-icon.bad { color: #feb2b2; }
.sb-row.active .sb-icon.none { color: #e2e8f0; }
.sb-num { font-weight: 500; }
.sb-pill {
  display: inline-block;
  width: 18px; height: 22px;
  border-radius: 4px;
  background: transparent;
  justify-self: end;
  border: 1px solid transparent;
}
.sb-pill.learning { background: #f56565; border-color: #c53030; }
.sb-pill.mastered { background: #48bb78; border-color: #2f855a; }
.sb-pill.reviewing { background: #f4c430; border-color: #d69e2e; }
.sb-note {
  color: #4a5568;
  font-size: 10px;
  font-weight: 700;
  justify-self: end;
}
.sb-row.active .sb-note { color: #fff; }
.sb-row.marked { box-shadow: inset 3px 0 0 #f6ad55; }

/* Main */
.content { overflow-y: auto; padding: 20px 40px 40px; }
.section-label { color: #4a5568; font-size: 12px; margin-bottom: 10px; letter-spacing: 0.02em; }
.question-text {
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 20px;
  white-space: pre-wrap;
  max-width: 900px;
}

.options-box {
  background: #fff;
  border: 2px solid #1a3d6d;
  border-radius: 6px;
  padding: 14px 22px;
  max-width: 900px;
}
.opt-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 6px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.5;
}
.opt-row:hover { background: #f7fafc; }
.opt-row.selected { background: #ebf4ff; }
.opt-row.correct { background: #c6f6d5 !important; }
.opt-row.wrong { background: #fed7d7 !important; }
.opt-control {
  width: 16px; height: 16px;
  border: 2px solid #4a5568;
  flex-shrink: 0;
  background: #fff;
}
.opt-control.radio { border-radius: 50%; }
.opt-control.check { border-radius: 3px; }
.opt-row.selected .opt-control { border-color: #1a3d6d; background: #1a3d6d; }
.opt-row.selected .opt-control.radio { box-shadow: inset 0 0 0 2px #fff; }
.opt-row.selected .opt-control.check { box-shadow: inset 0 0 0 2px #fff; }
.opt-label { flex: 1; }
.opt-label b { margin-right: 4px; }
.opt-key { color: #718096; font-size: 12px; margin-left: 6px; }

/* wrap rather than squeeze: four controls plus the hint do not fit on one
   line at tablet width. */
.submit-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px;
              align-items: center; max-width: 900px; }
.submit-row button { flex: 0 0 auto; }
#submit-btn {
  background: #a0aec0;
  color: #fff;
  border: 0;
  padding: 10px 40px;
  border-radius: 4px;
  font-size: 14px;
  cursor: not-allowed;
  font-weight: 500;
  font-family: inherit;
}
#submit-btn.active { background: #1a3d6d; cursor: pointer; }
#submit-btn.active:hover { background: #2c5282; }

.reset-btn {
  background: #fff;
  border: 1px solid #1a3d6d;
  color: #1a3d6d;
  padding: 10px 24px;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.reset-btn:hover { background: #ebf4ff; }

/* Step buttons beside Reset: same size as the other two, quieter border so
   Submit stays the obvious primary action. */
.step-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid #cbd5e0;
  color: #2d3748;
  padding: 10px 18px;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.step-btn:hover { background: #f7fafc; }
.step-btn .tri { font-size: 11px; opacity: 0.8; }

.multi-note { color: #c53030; font-size: 13px; }

.explanation-box {
  margin-top: 22px;
  padding: 16px 20px;
  background: #fff;
  border-radius: 6px;
  border-left: 4px solid #1a3d6d;
  max-width: 900px;
}
.verdict-row { margin-bottom: 10px; font-size: 14px; display: flex; gap: 12px; align-items: center; }
.verdict { font-weight: bold; padding: 2px 10px; border-radius: 3px; }
.verdict.correct { background: #c6f6d5; color: #22543d; }
.verdict.wrong { background: #fed7d7; color: #742a2a; }
.explanation-text { font-size: 14px; line-height: 1.8; color: #2d3748; white-space: pre-wrap; }

.status-buttons { display: flex; align-items: center; gap: 8px; margin-top: 18px; max-width: 900px; flex-wrap: wrap; }
.status-label { font-size: 13px; color: #4a5568; margin-right: 4px; }
.status-buttons button {
  background: #edf2f7; border: 1px solid #cbd5e0;
  padding: 6px 14px; border-radius: 4px; cursor: pointer;
  font-size: 13px; font-family: inherit;
}
.status-buttons button:hover { background: #e2e8f0; }
.status-buttons button.active[data-status="learning"] { background: #f56565; border-color: #9b2c2c; color: #fff; }
.status-buttons button.active[data-status="reviewing"] { background: #f4c430; border-color: #b7791f; color: #1a202c; }
.status-buttons button.active[data-status="mastered"] { background: #48bb78; border-color: #22543d; color: #fff; }
.status-buttons .clear-btn { margin-left: auto; font-size: 12px; color: #718096; }

.notes-panel {
  margin-top: 22px;
  max-width: 900px;
  background: #fff;
  border: 1px solid #cbd5e0;
  border-radius: 6px;
  padding: 14px;
}
.notes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.notes-header label {
  color: #2d3748;
  font-size: 13px;
  font-weight: 600;
}
.note-clear-btn {
  background: transparent;
  border: 0;
  color: #718096;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  padding: 4px 6px;
}
.note-clear-btn:hover { color: #c53030; text-decoration: underline; }
.note-text {
  width: 100%;
  min-height: 118px;
  resize: vertical;
  border: 1px solid #cbd5e0;
  border-radius: 4px;
  color: #1a202c;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  padding: 10px;
}
.note-text:focus,
.note-image-zone:focus {
  outline: 2px solid #4a90d9;
  outline-offset: 2px;
}
.note-image-zone {
  margin-top: 10px;
  min-height: 84px;
  border: 1px dashed #a0aec0;
  border-radius: 4px;
  background: #f7fafc;
  padding: 10px;
  cursor: text;
}
.note-image-zone.has-images { background: #fff; }
.note-empty,
.note-message {
  color: #718096;
  font-size: 13px;
  line-height: 1.4;
}
.note-message { margin-top: 8px; }
.note-message.error { color: #c53030; }
.note-images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.note-image {
  position: relative;
  margin: 0;
  border: 1px solid #cbd5e0;
  border-radius: 4px;
  overflow: hidden;
  background: #fff;
  cursor: zoom-in;
}
.note-image img {
  display: block;
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  background: #edf2f7;
}
.note-image-remove {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 50%;
  background: rgba(26, 32, 44, 0.78);
  color: #fff;
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
}
.note-image-remove:hover { background: #c53030; }
.note-image figcaption {
  padding: 6px 8px;
  color: #4a5568;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

body.preview-open { overflow: hidden; }
.note-preview {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(26, 32, 44, 0.78);
}
.note-preview[hidden] { display: none; }
.note-preview-frame {
  margin: 0;
  max-width: min(96vw, 1280px);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.note-preview-image {
  display: block;
  max-width: 100%;
  max-height: calc(92vh - 34px);
  object-fit: contain;
  border-radius: 4px;
  background: #fff;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
}
.note-preview-caption {
  min-height: 16px;
  color: #fff;
  font-size: 12px;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.note-preview-close {
  position: fixed;
  top: 16px;
  right: 18px;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  color: #1a202c;
  cursor: pointer;
  font-size: 24px;
  line-height: 1;
}
.note-preview-close:hover,
.note-preview-close:focus {
  background: #fff;
  outline: 2px solid #4a90d9;
  outline-offset: 2px;
}

/* Reference slide(s) shown with the explanation */
.q-slides { margin-top: 16px; padding-top: 12px; border-top: 1px dashed #cbd5e0; }
.q-slides-title { font-size: 12px; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
.q-slide {
  margin: 0 0 12px;
  max-width: 560px;
  border: 1px solid #cbd5e0;
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
  cursor: zoom-in;
}
.q-slide img { display: block; width: 100%; height: auto; background: #edf2f7; }
.q-slide figcaption { padding: 5px 8px; color: #4a5568; font-size: 11px; }

/* Stem image(s) shown with the question, before submitting */
.stem-images { margin: 0 0 18px; max-width: 900px; }
.stem-images .q-slides { margin-top: 0; padding-top: 0; border-top: none; }
.stem-images .q-slide { max-width: 620px; }

/* --- offline build --- */
/* Additions used only by the single-file offline build (build_static.py).
   The server build never loads this file. */

/* Viewer apps (PDF Expert, Documents, Safari itself) slide a toolbar in and
   out as you tap, resizing the web view under the page. --app-h is pinned by
   offline_shim.js to the smallest height seen in this orientation, so the
   layout is laid out once and does not reflow when the toolbar appears. */
.app { height: var(--app-h, 100vh); }

/* Nothing outside the two scrollers should ever move. */
html, body { overscroll-behavior: none; }
.content, .sidebar { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* Taps: no double-tap zoom, no grey flash, no selection callout on controls.
   Pinch-zoom and selecting the question text itself stay available. */
.opt-row, .sb-row, .hd-btn, .flt-btn, .deck-select, .mark-wrap,
.status-buttons button, .submit-row button, .prog-row button, .prog-file {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Home-screen (standalone) mode puts the header under the status bar. */
.header {
  padding-left: max(18px, env(safe-area-inset-left));
  padding-right: max(18px, env(safe-area-inset-right));
}
.content { padding-bottom: max(40px, env(safe-area-inset-bottom)); }

/* Fingers need more room than a trackpad does. */
@media (pointer: coarse) {
  .opt-row { padding: 14px 8px; }
  .sb-row { padding: 9px 8px; }
  .status-buttons button, .submit-row button { padding: 10px 16px; }
}

/* Header controls added by the offline shim.
   These two cost ~300px, which pushed the header past an iPad's 768px portrait
   width and dragged the whole layout wider than the screen. The deck picker
   already names the deck, so the source title is redundant here, and the
   select is allowed to shrink and ellipsize. */
#source-title { display: none; }

.deck-select {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 170px;
  text-overflow: ellipsis;
  padding: 4px 6px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 4px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 13px;
  font-family: inherit;
}
.deck-select option { color: #1a202c; }

/* Progress panel (export / import). */
.prog-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(15, 23, 42, 0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.prog-panel {
  background: #fff; border-radius: 8px;
  width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
  padding: 20px 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}
.prog-panel h2 { margin: 0 0 4px; font-size: 17px; }
.prog-panel p { margin: 6px 0; font-size: 13px; color: #4a5568; line-height: 1.6; }
.prog-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
.prog-row button, .prog-row label.prog-file {
  padding: 10px 16px; font-size: 14px; font-family: inherit;
  border: 1px solid #cbd5e0; border-radius: 4px;
  background: #f7fafc; color: #1a202c; cursor: pointer;
}
.prog-row button.primary { background: #1a3d6d; border-color: #1a3d6d; color: #fff; }
.prog-row button.danger { background: #fff; border-color: #fc8181; color: #c53030; }
.prog-file input { display: none; }
.prog-warn {
  margin: 10px 0 0; padding: 10px 12px; border-radius: 4px;
  background: #fffaf0; border: 1px solid #f6ad55; color: #7b341e;
  font-size: 13px; line-height: 1.6;
}
.prog-note { margin-top: 14px; font-size: 13px; }
.prog-note summary { cursor: pointer; color: #2b6cb0; }
.prog-note textarea {
  width: 100%; margin-top: 8px; height: 140px;
  font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  border: 1px solid #cbd5e0; border-radius: 4px; padding: 8px;
}
.prog-msg { margin-top: 10px; font-size: 13px; color: #2f855a; min-height: 18px; }
.prog-msg.err { color: #c53030; }

<body>
  <div class="app">
    <header class="header">
      <span id="item-counter" class="item-counter">Item: — of —</span>
      <label class="mark-wrap">
        <input type="checkbox" id="mark-checkbox">
        <span class="flag">&#9873;</span>
        <span>Mark</span>
      </label>
      <div class="nav-btns">
        <button class="hd-btn nav-btn" id="prev-btn" title="Previous (←)">
          <span class="tri">&#9664;</span>
          <span class="lbl">Previous</span>
        </button>
        <button class="hd-btn nav-btn" id="next-btn" title="Next (→)">
          <span class="tri">&#9654;</span>
          <span class="lbl">Next</span>
        </button>
      </div>
      <span class="spacer"></span>
      <button class="hd-btn" id="fs-btn" title="Full Screen (F)">
        <span class="icon">&#9974;</span>
        <span class="lbl">Full Screen</span>
      </button>
      <span id="source-title" class="source-title" title=""></span>
    </header>
    <div class="main-wrap">
      <aside class="sidebar" id="sidebar">
        <div class="sb-filter" id="sb-filter">
          <button class="flt-btn active" data-flt="all">All</button>
          <button class="flt-btn" data-flt="learning">Learning</button>
          <button class="flt-btn" data-flt="reviewing">Reviewing</button>
          <button class="flt-btn" data-flt="mastered">Mastered</button>
        </div>
        <div id="sidebar-list"></div>
      </aside>
      <main class="content">
        <div class="section-label" id="section-label"></div>
        <div class="question-text" id="question-text"></div>
        <div class="stem-images" id="stem-images" hidden></div>
        <div class="options-box">
          <div id="options-list"></div>
        </div>
        <div class="submit-row">
          <button id="submit-btn" disabled>Submit [C]</button>
          <button id="reset-btn" class="reset-btn" hidden>Reset [T]</button>
          <button id="prev-btn-inline" class="step-btn" title="Previous (←)">
            <span class="tri">&#9664;</span><span>Previous</span>
          </button>
          <button id="next-btn-inline" class="step-btn" title="Next (→)">
            <span>Next</span><span class="tri">&#9654;</span>
          </button>
          <span id="multi-note" class="multi-note"></span>
        </div>
        <div id="explanation-box" class="explanation-box" hidden></div>
        <div class="status-buttons" id="status-buttons">
          <span class="status-label">Status:</span>
          <button data-status="learning">Learning [L]</button>
          <button data-status="reviewing">Reviewing [R]</button>
          <button data-status="mastered">Mastered [G]</button>
          <button data-status="clear" class="clear-btn">Clear [X]</button>
        </div>
        <section class="notes-panel" id="notes-panel">
          <div class="notes-header">
            <label for="note-text">Notes</label>
            <button type="button" id="note-clear-btn" class="note-clear-btn" hidden>Clear</button>
          </div>
          <textarea id="note-text" class="note-text" rows="5" spellcheck="true"></textarea>
          <div id="note-image-zone" class="note-image-zone" tabindex="0" aria-label="Question note images">
            <div id="note-images" class="note-images"></div>
            <div id="note-empty" class="note-empty">Paste images here</div>
            <div id="note-message" class="note-message" hidden></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>window.__QUIZ_DATA__ = {"built":"2026-09-20T16:43:46+00:00","decks":[{"id":"D-1_血液造血器リンパ系","name":"D-1_血液造血器リンパ系.md","label":"D-1 血液造血器リンパ系","count":56,"sourceHash":"4f38c47aeb5e","questions":[{"number":1,"section":"D-1-S01　68歳男性・労作時息切れと易疲労感","question":"（1/4）68歳の男性．3か月前からの労作時息切れと易疲労感を主訴に来院した．眼瞼結膜は蒼白である．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"排尿時にしみますか．"},{"letter":"B","text":"最近，体重が減りましたか．"},{"letter":"C","text":"便が黒くなっていませんか．"},{"letter":"D","text":"鎮痛薬を飲んでいますか．"},{"letter":"E","text":"胸痛を伴うことはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．尿道・膀胱症状は今回の慢性貧血と息切れの初期評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：尿道・膀胱症状は今回の慢性貧血と息切れの初期評価では優先度が低い．この設問で選ぶ肢．\n- B：悪性疾患などの背景を確認．\n- C：消化管出血を疑う手がかり．\n- D：薬剤による消化管障害を確認．\n- E：貧血に伴う心筋虚血を評価．","images":[],"stem_images":[]},{"number":2,"section":"D-1-S01　68歳男性・労作時息切れと易疲労感","question":"（2/4）68歳の男性．3か月前からの労作時息切れと易疲労感を主訴に来院した．眼瞼結膜は蒼白である．1か月前から黒色の便が出ているという．認められる所見はどれか．","options":[{"letter":"A","text":"くも状血管腫"},{"letter":"B","text":"匙状爪と舌炎"},{"letter":"C","text":"眼球突出"},{"letter":"D","text":"心膜摩擦音"},{"letter":"E","text":"頸静脈の怒張"}],"answer":["B"],"multi":false,"explanation":"解説：鉄は爪・粘膜上皮の代謝にも使われるため，欠乏が長引くと爪が反り返る匙状爪（スプーンネイル）と舌乳頭の萎縮による舌炎が現れる．氷を好んで食べる異食症を伴うこともある．\n- A：くも状血管腫は慢性肝疾患のエストロゲン過剰を反映する所見．\n- B：鉄欠乏が慢性化したときの上皮症状で正しい．\n- C：眼球突出はBasedow病．\n- D：心膜摩擦音は急性心膜炎．\n- E：頸静脈怒張は右心系のうっ血を示す所見．","images":[],"stem_images":[]},{"number":3,"section":"D-1-S01　68歳男性・労作時息切れと易疲労感","question":"（3/4）68歳の男性．3か月前からの労作時息切れと易疲労感を主訴に来院した．眼瞼結膜は蒼白である．1か月前から黒色の便が出ているという．爪は反り返り，舌乳頭の萎縮を認める．血液検査でHb 7.2g/dL，MCV 72fLであった．次に行うべき検査はどれか．","options":[{"letter":"A","text":"骨髄穿刺"},{"letter":"B","text":"頭部MRI"},{"letter":"C","text":"上部消化管内視鏡"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"手指の関節エックス線撮影"}],"answer":["C"],"multi":false,"explanation":"解説：小球性低色素性貧血とタール便が揃えば，出血源の特定が次の課題になる．上部消化管内視鏡で潰瘍・腫瘍を確認し，陰性なら下部消化管内視鏡へ進む．出血源の検索を省いて鉄剤だけ出してはならない．\n- A：骨髄穿刺は造血そのものの異常を疑うときの検査で，出血源が明らかな本例では先行しない．\n- B：頭部MRIは神経症状がある場合の検査．\n- C：出血源の特定に直結し正しい．\n- D：呼吸機能検査は換気障害の評価で，貧血による息切れとは機序が違う．\n- E：関節エックス線は関節リウマチなどの評価．","images":[],"stem_images":[]},{"number":4,"section":"D-1-S01　68歳男性・労作時息切れと易疲労感","question":"（4/4）68歳の男性．3か月前からの労作時息切れと易疲労感を主訴に来院した．眼瞼結膜は蒼白である．1か月前から黒色の便が出ているという．爪は反り返り，舌乳頭の萎縮を認める．血液検査でHb 7.2g/dL，MCV 72fLであった．上部消化管内視鏡で胃角部に潰瘍と露出血管を認めた．予想される血液検査所見はどれか．","options":[{"letter":"A","text":"血清フェリチンの上昇"},{"letter":"B","text":"網赤血球の著明な増加"},{"letter":"C","text":"血清葉酸の低下"},{"letter":"D","text":"総鉄結合能の上昇"},{"letter":"E","text":"直接Coombs試験の陽性"}],"answer":["D"],"multi":false,"explanation":"解説：貯蔵鉄が尽きるとトランスフェリンが代償性に増え，総鉄結合能が上昇する一方で血清鉄とフェリチンは低下する．フェリチンは貯蔵鉄量を最もよく反映し，鉄欠乏の診断で最も鋭敏な指標になる．\n- A：フェリチンは貯蔵鉄の枯渇を反映して低下する．上昇は炎症や二次性貧血の向き．\n- B：網赤血球は鉄が足りず産生できないため増えない．鉄剤投与後に増加する．\n- C：葉酸低下は大球性貧血の原因で，MCV 72fLと矛盾する．\n- D：鉄欠乏に特徴的な変化で正しい．\n- E：Coombs試験陽性は自己免疫性溶血性貧血．","images":[],"stem_images":[]},{"number":5,"section":"D-1-S02　64歳女性・関節痛の経過中の貧血","question":"（1/4）64歳の女性．手指の関節痛で5年間通院している．最近の血液検査でHb 9.8g/dL，MCV 88fLと貧血を指摘された．月経は10年前に閉止している．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"遠くの文字が見えにくいですか．"},{"letter":"B","text":"関節の腫れは続いていますか．"},{"letter":"C","text":"腎臓の病気はありますか．"},{"letter":"D","text":"黒い便が出ていませんか．"},{"letter":"E","text":"痛み止めを常用していますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．屈折異常の問診は貧血の原因検索に乏しい．\n- A：屈折異常の問診は貧血の原因検索に乏しい．この設問で選ぶ肢．\n- B：慢性炎症の活動性を評価．\n- C：腎性貧血の背景を確認．\n- D：消化管からの慢性出血を確認．\n- E：消化管障害を起こす薬剤を確認．","images":[],"stem_images":[]},{"number":6,"section":"D-1-S02　64歳女性・関節痛の経過中の貧血","question":"（2/4）64歳の女性．手指の関節痛で5年間通院している．最近の血液検査でHb 9.8g/dL，MCV 88fLと貧血を指摘された．月経は10年前に閉止している．便潜血は陰性で，消化管内視鏡でも出血源を認めなかったという．認められる所見はどれか．","options":[{"letter":"A","text":"深部感覚の低下"},{"letter":"B","text":"頸部リンパ節のびまん性腫大"},{"letter":"C","text":"手指関節の腫脹と変形"},{"letter":"D","text":"腹部の拍動性腫瘤"},{"letter":"E","text":"甲状腺の圧痛"}],"answer":["C"],"multi":false,"explanation":"解説：5年に及ぶ手指関節の痛みでは関節リウマチが基礎にある可能性が高く，近位指節間関節と中手指節関節の対称性の腫脹，尺側偏位などの変形がみられる．この慢性炎症が貧血の背景になる．\n- A：深部感覚低下はビタミンB12欠乏や脊髄病変．\n- B：リンパ節腫大は悪性リンパ腫や感染症．\n- C：慢性の関節炎を裏づける所見で正しい．\n- D：拍動性腫瘤は腹部大動脈瘤．\n- E：甲状腺の圧痛は亜急性甲状腺炎．","images":[],"stem_images":[]},{"number":7,"section":"D-1-S02　64歳女性・関節痛の経過中の貧血","question":"（3/4）64歳の女性．手指の関節痛で5年間通院している．最近の血液検査でHb 9.8g/dL，MCV 88fLと貧血を指摘された．月経は10年前に閉止している．便潜血は陰性で，消化管内視鏡でも出血源を認めなかったという．手指の近位指節間関節に対称性の腫脹と変形を認める．貧血の鑑別に最も有用な検査はどれか．","options":[{"letter":"A","text":"血清アルブミン"},{"letter":"B","text":"血清フェリチン"},{"letter":"C","text":"血清ビリルビン"},{"letter":"D","text":"血清アミラーゼ"},{"letter":"E","text":"血清クレアチンキナーゼ"}],"answer":["B"],"multi":false,"explanation":"解説：血清鉄はどちらの病態でも低下するため鑑別にならない．フェリチンが低ければ鉄欠乏，正常〜高値なら慢性疾患に伴う二次性貧血を示す．総鉄結合能も鉄欠乏で上昇，二次性貧血で低下と逆に動く．\n- A：アルブミンは栄養状態と炎症の指標だが，鉄の動態は反映しない．\n- B：貯蔵鉄量を反映し，2つの病態を分ける決め手で正しい．\n- C：ビリルビンは溶血や肝胆道疾患の指標．\n- D：アミラーゼは膵疾患の指標．\n- E：クレアチンキナーゼは筋傷害の指標．","images":[],"stem_images":[]},{"number":8,"section":"D-1-S02　64歳女性・関節痛の経過中の貧血","question":"（4/4）64歳の女性．手指の関節痛で5年間通院している．最近の血液検査でHb 9.8g/dL，MCV 88fLと貧血を指摘された．月経は10年前に閉止している．便潜血は陰性で，消化管内視鏡でも出血源を認めなかったという．手指の近位指節間関節に対称性の腫脹と変形を認める．血清鉄は低値だが，血清フェリチンは高値であった．この貧血の機序はどれか．","options":[{"letter":"A","text":"赤血球膜の脆弱化"},{"letter":"B","text":"造血幹細胞の枯渇"},{"letter":"C","text":"内因子の欠如"},{"letter":"D","text":"網内系への鉄の囲い込み"},{"letter":"E","text":"腎からのエリスロポエチン欠乏"}],"answer":["D"],"multi":false,"explanation":"解説：慢性炎症では肝のヘプシジンが増え，腸管からの鉄吸収とマクロファージからの鉄放出を同時に止める．体内に鉄はあるのに赤芽球に届かず，血清鉄は低くフェリチンは高いという特徴的な組合せになる．\n- A：膜の脆弱化は遺伝性球状赤血球症などの溶血性貧血の機序．\n- B：幹細胞の枯渇は再生不良性貧血で，汎血球減少をきたす．\n- C：内因子欠如はビタミンB12欠乏で大球性貧血になる．\n- D：ヘプシジンを介した鉄の利用障害で正しい．\n- E：エリスロポエチン欠乏は腎性貧血の機序で，腎機能低下を伴う．","images":[],"stem_images":[]},{"number":9,"section":"D-1-S03　27歳男性・発熱と歯肉出血","question":"（1/4）27歳の男性．発熱と歯肉出血を主訴に来院した．2週間前から倦怠感があり，数日前から38℃台の発熱が続いているという．薬剤による血球減少を検討するための質問はどれか．","options":[{"letter":"A","text":"最近，新しい薬を飲みましたか．"},{"letter":"B","text":"便に血が混じりますか．"},{"letter":"C","text":"家族に血液の病気はありますか．"},{"letter":"D","text":"体重が減っていませんか．"},{"letter":"E","text":"肉や魚を食べていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：発熱と歯肉出血では好中球減少や血小板減少を疑い，血算を確認する．服薬開始時期を調べると薬剤性の造血障害を検討できるが，症状だけで汎血球減少とは断定できない．\n- A：薬剤性血球減少の可能性を検討するため，薬剤名と開始時期を確認する．\n- B：消化管の出血に関する情報．\n- C：遺伝的背景に関する情報．\n- D：悪性疾患の全身症状に関する情報．\n- E：栄養摂取に関する情報．","images":[],"stem_images":[]},{"number":10,"section":"D-1-S03　27歳男性・発熱と歯肉出血","question":"（2/4）27歳の男性．発熱と歯肉出血を主訴に来院した．2週間前から倦怠感があり，数日前から38℃台の発熱が続いているという．2か月前から抗甲状腺薬を内服しているという．眼瞼結膜は蒼白で，四肢に点状出血を認める．血液検査で予想される所見はどれか．","options":[{"letter":"A","text":"白血球の著明な増加"},{"letter":"B","text":"血小板のみの減少"},{"letter":"C","text":"赤血球の大小不同"},{"letter":"D","text":"汎血球減少"},{"letter":"E","text":"好酸球の著明な増加"}],"answer":["D"],"multi":false,"explanation":"解説：発熱に加え，結膜蒼白と点状出血から複数系統の血球減少を疑う．抗甲状腺薬による無顆粒球症だけでなく再生不良性貧血も鑑別し，血算で3系統の減少を確認する．\n- A：白血球増加は感染症や白血病の一部で，出血傾向の説明にならない．\n- B：血小板のみの減少では発熱と倦怠感を説明できない．\n- C：大小不同は貧血に伴う非特異的変化で，3系統の減少を示さない．\n- D：3つの症状をすべて説明でき正しい．\n- E：好酸球増加はアレルギー疾患や寄生虫症．","images":[],"stem_images":[]},{"number":11,"section":"D-1-S03　27歳男性・発熱と歯肉出血","question":"（3/4）27歳の男性．発熱と歯肉出血を主訴に来院した．2週間前から倦怠感があり，数日前から38℃台の発熱が続いているという．2か月前から抗甲状腺薬を内服しているという．眼瞼結膜は蒼白で，四肢に点状出血を認める．血液検査で白血球1200/μL（好中球180/μL），Hb 7.4g/dL，血小板1.8万/μL，網赤血球は0.2%と低値であった．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"頭部造影MRI"},{"letter":"B","text":"呼吸機能検査"},{"letter":"C","text":"上部消化管内視鏡"},{"letter":"D","text":"腹部血管造影"},{"letter":"E","text":"骨髄生検"}],"answer":["E"],"multi":false,"explanation":"解説：汎血球減少で網赤血球も低いのは骨髄の造血そのものが落ちているためで，骨髄が低形成（脂肪髄）か，芽球や異常細胞に置き換わっているかを組織で確かめる必要がある．穿刺だけでは細胞密度 を評価しきれない．\n- A：頭部MRIは中枢神経病変の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：内視鏡は消化管の出血源検索．\n- D：血管造影は血管病変や出血源の評価．\n- E：造血の場そのものを見る検査で正しい．","images":[],"stem_images":[]},{"number":12,"section":"D-1-S03　27歳男性・発熱と歯肉出血","question":"（4/4）27歳の男性．発熱と歯肉出血を主訴に来院した．2週間前から倦怠感があり，数日前から38℃台の発熱が続いているという．2か月前から抗甲状腺薬を内服しているという．眼瞼結膜は蒼白で，四肢に点状出血を認める．血液検査で白血球1200/μL（好中球180/μL），Hb 7.4g/dL，血小板1.8万/μL，網赤血球は0.2%と低値であった．骨髄生検で著明な低形成と脂肪髄化を認め，芽球の増加はなかった．同じ薬剤で好中球だけが消失する病態と本例を分けるのはどれか．","options":[{"letter":"A","text":"発熱の有無"},{"letter":"B","text":"咽頭痛の有無"},{"letter":"C","text":"赤血球と血小板も減ること"},{"letter":"D","text":"薬剤中止で改善しうること"},{"letter":"E","text":"感染症を起こしやすいこと"}],"answer":["C"],"multi":false,"explanation":"解説：無顆粒球症は顆粒球系のみが選択的に障害され，赤血球と血小板は保たれる．本例は3系統すべてが減り骨髄も低形成なので再生不良性貧血である．どの系統が落ちているかが両者を分ける唯一の決め手になる．\n- A：発熱はどちらでも好中球減少による感染として起こる．\n- B：咽頭痛も無顆粒球症の初発症状として有名だが，両者に共通しうる．\n- C：障害される系統の範囲そのもので，鑑別の決め手として正しい．\n- D：薬剤性であればどちらも中止で改善しうる．\n- E：好中球が減れば両者とも易感染性になる．","images":[],"stem_images":[]},{"number":13,"section":"D-1-S04　72歳女性・歩行のふらつきと倦怠感","question":"（1/4）72歳の女性．歩行時のふらつきと倦怠感を主訴に来院した．半年前から症状が進行し，眼瞼結膜は蒼白である．血液検査でHb 8.6g/dL，MCV 118fLであった．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"排尿の最後に痛みますか．"},{"letter":"B","text":"胃の手術を受けましたか．"},{"letter":"C","text":"抗てんかん薬を飲んでいますか．"},{"letter":"D","text":"肉や魚を長年避けていますか．"},{"letter":"E","text":"お酒を毎日多く飲みますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．膀胱刺激症状は大球性貧血と神経障害の鑑別では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：膀胱刺激症状は大球性貧血と神経障害の鑑別では優先度が低い．この設問で選ぶ肢．\n- B：ビタミンB12吸収障害の背景を確認．\n- C：葉酸代謝に影響する薬剤を確認．\n- D：ビタミンB12の摂取不足を確認．\n- E：飲酒や葉酸欠乏の可能性を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-1-S04　72歳女性・歩行のふらつきと倦怠感","question":"（2/4）72歳の女性．歩行時のふらつきと倦怠感を主訴に来院した．半年前から症状が進行し，眼瞼結膜は蒼白である．血液検査でHb 8.6g/dL，MCV 118fLであった．25年前に胃全摘術を受けているという．神経学的に予想される所見はどれか．","options":[{"letter":"A","text":"安静時振戦"},{"letter":"B","text":"眼振と構音障害"},{"letter":"C","text":"振動覚と位置覚の低下"},{"letter":"D","text":"一側上下肢の弛緩性麻痺"},{"letter":"E","text":"眼瞼下垂の日内変動"}],"answer":["C"],"multi":false,"explanation":"解説：ビタミンB12欠乏では脊髄後索と側索が障害される亜急性連合性脊髄変性症を起こす．後索障害で振動覚・位置覚が低下し，Romberg徴候が陽性となって歩行が不安定になる．末梢神経障害も合併する．\n- A：安静時振戦はParkinson病．\n- B：眼振と構音障害は小脳障害．\n- C：後索障害を反映し正しい．\n- D：一側上下肢の弛緩性麻痺は急性期の脳血管障害．\n- E：眼瞼下垂の日内変動は重症筋無力症．","images":[],"stem_images":[]},{"number":15,"section":"D-1-S04　72歳女性・歩行のふらつきと倦怠感","question":"（3/4）72歳の女性．歩行時のふらつきと倦怠感を主訴に来院した．半年前から症状が進行し，眼瞼結膜は蒼白である．血液検査でHb 8.6g/dL，MCV 118fLであった．25年前に胃全摘術を受けているという．両下肢の振動覚と位置覚が低下し，Romberg徴候が陽性である．末梢血塗抹標本で予想される所見はどれか．","options":[{"letter":"A","text":"破砕赤血球"},{"letter":"B","text":"標的赤血球"},{"letter":"C","text":"赤血球連銭形成"},{"letter":"D","text":"好中球の過分葉"},{"letter":"E","text":"涙滴赤血球"}],"answer":["D"],"multi":false,"explanation":"解説：DNA合成が障害されると核の成熟が細胞質に追いつかず，赤芽球は巨赤芽球となり，好中球は分葉が5つ以上に進む過分葉核好中球として現れる．大球性で楕円形の赤血球を伴う．\n- A：破砕赤血球は血栓性微小血管症や機械的溶血．\n- B：標的赤血球はサラセミアや肝疾患．\n- C：赤血球連銭形成は多発性骨髄腫などM蛋白血症．\n- D：核の成熟障害を反映し正しい．\n- E：涙滴赤血球は骨髄線維症．","images":[],"stem_images":[]},{"number":16,"section":"D-1-S04　72歳女性・歩行のふらつきと倦怠感","question":"（4/4）72歳の女性．歩行時のふらつきと倦怠感を主訴に来院した．半年前から症状が進行し，眼瞼結膜は蒼白である．血液検査でHb 8.6g/dL，MCV 118fLであった．25年前に胃全摘術を受けているという．両下肢の振動覚と位置覚が低下し，Romberg徴候が陽性である．末梢血で好中球の過分葉を認めた．同じ血球所見を示すが本例の神経症状を欠く病態の原因はどれか．","options":[{"letter":"A","text":"鉄の欠乏"},{"letter":"B","text":"エリスロポエチンの欠乏"},{"letter":"C","text":"内因子の欠如"},{"letter":"D","text":"第VIII因子の欠乏"},{"letter":"E","text":"葉酸の欠乏"}],"answer":["E"],"multi":false,"explanation":"解説：葉酸欠乏もDNA合成障害から同じ巨赤芽球性貧血をきたすが，ミエリン形成に関わらないため神経症状は出ない．B12欠乏に葉酸だけを投与すると貧血は改善しても神経障害が進むため，必ず両者を測ってから治療する．\n- A：鉄欠乏は小球性低色素性貧血で，MCVはむしろ低下する．\n- B：エリスロポエチン欠乏は腎性貧血で正球性．\n- C：内因子欠如はB12欠乏そのものの機序であり，神経症状を伴う側．\n- D：第VIII因子欠乏は血友病Aで出血傾向をきたす．\n- E：巨赤芽球性貧血をきたし神経症状を欠く点で正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-1-S05　32歳女性・下肢の点状出血","question":"（1/4）32歳の女性．両下腿の点状出血を主訴に来院した．1週間前に気づいたという．発熱はなく，全身状態は良好である．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"幼少期から近視ですか．"},{"letter":"B","text":"月経の出血量は増えましたか．"},{"letter":"C","text":"風邪をひいた後ですか．"},{"letter":"D","text":"最近，新しい薬を飲みましたか．"},{"letter":"E","text":"鼻や歯ぐきから出血しますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．幼少期からの近視の問診は出血傾向の評価では優先度が低い．\n- A：幼少期からの近視の問診は出血傾向の評価では優先度が低い．この設問で選ぶ肢．\n- B：出血の範囲と重症度を確認．\n- C：感染後の血小板減少を検討．\n- D：薬剤性血小板減少を検討．\n- E：粘膜出血の有無で出血傾向を評価．","images":[],"stem_images":[]},{"number":18,"section":"D-1-S05　32歳女性・下肢の点状出血","question":"（2/4）32歳の女性．両下腿の点状出血を主訴に来院した．1週間前に気づいたという．発熱はなく，全身状態は良好である．歯肉出血と鼻出血もあるが，関節や筋肉が腫れたことはないという．予想される検査所見はどれか．","options":[{"letter":"A","text":"APTTの単独延長"},{"letter":"B","text":"血小板数の減少"},{"letter":"C","text":"フィブリノゲンの低下"},{"letter":"D","text":"白血球数の著明な増加"},{"letter":"E","text":"破砕赤血球の出現"}],"answer":["B"],"multi":false,"explanation":"解説：点状出血と粘膜出血という一次止血障害のパターンで，深部出血がなく全身状態も良い．血小板数のみが減り，赤血球・白血球とPT・APTTは正常というのが免疫性血小板減少症の典型像である．\n- A：APTT単独延長は血友病など内因系凝固因子の欠乏で，深部出血が主体になる．\n- B：一次止血障害を最もよく説明し正しい．\n- C：フィブリノゲン低下は播種性血管内凝固で，基礎疾患と全身状態の悪化を伴う．\n- D：著明な白血球増加は白血病や重症感染症．\n- E：破砕赤血球は血栓性微小血管症で，溶血と臓器障害を伴う．","images":[],"stem_images":[]},{"number":19,"section":"D-1-S05　32歳女性・下肢の点状出血","question":"（3/4）32歳の女性．両下腿の点状出血を主訴に来院した．1週間前に気づいたという．発熱はなく，全身状態は良好である．歯肉出血と鼻出血もあるが，関節や筋肉が腫れたことはないという．血液検査で血小板1.2万/μL，白血球と赤血球は正常，PTとAPTTも正常であった．骨髄穿刺で予想される所見はどれか．","options":[{"letter":"A","text":"脂肪髄への置換"},{"letter":"B","text":"芽球の著明な増加"},{"letter":"C","text":"環状鉄芽球の増加"},{"letter":"D","text":"巨核球の増加"},{"letter":"E","text":"線維化による dry tap"}],"answer":["D"],"multi":false,"explanation":"解説：血小板が抗体で覆われ脾臓で破壊されるため，骨髄は代償性に血小板を作ろうとして巨核球はむしろ増える．産生が落ちているのではなく末梢で壊されていることを示す所見である．\n- A：脂肪髄化は再生不良性貧血で，3系統が減る．\n- B：芽球の増加は急性白血病．\n- C：環状鉄芽球は骨髄異形成症候群．\n- D：末梢での破壊亢進を反映し正しい．\n- E：線維化とdry tapは原発性骨髄線維症．","images":[],"stem_images":[]},{"number":20,"section":"D-1-S05　32歳女性・下肢の点状出血","question":"（4/4）32歳の女性．両下腿の点状出血を主訴に来院した．1週間前に気づいたという．発熱はなく，全身状態は良好である．歯肉出血と鼻出血もあるが，関節や筋肉が腫れたことはないという．血液検査で血小板1.2万/μL，白血球と赤血球は正常，PTとAPTTも正常であった．骨髄穿刺では巨核球が増加していた．行うべき検査はどれか．","options":[{"letter":"A","text":"ピロリ菌感染の有無"},{"letter":"B","text":"血清アミラーゼの測定"},{"letter":"C","text":"呼吸機能検査"},{"letter":"D","text":"骨密度の測定"},{"letter":"E","text":"末梢神経伝導速度の測定"}],"answer":["A"],"multi":false,"explanation":"解説：免疫性血小板減少症では Helicobacter pylori の関与が知られ，陽性例では除菌だけで血小板が回復することがある．陰性例や無効例では副腎皮質ステロイド，トロンボポエチン受容体作動薬，脾摘へ進む．\n- A：Helicobacter pylori の除菌という低侵襲の治療に直結し，日本では標準的に確認する．\n- B：アミラーゼは膵疾患の指標．\n- C：呼吸機能検査は換気障害の評価．\n- D：骨密度はステロイド長期投与時の管理には関わるが，診断時に優先されない．\n- E：末梢神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":21,"section":"D-1-S06　3歳男児・膝の腫脹","question":"（1/4）3歳の男児．右膝の腫脹と痛みを主訴に来院した．明らかな外傷はない．歩き始めた頃から，軽くぶつけただけで大きな青あざができやすかったという．遺伝性の出血傾向を評価するため，母親に尋ねる質問はどれか．","options":[{"letter":"A","text":"歯ぐきからも出血しますか．"},{"letter":"B","text":"母方に出血しやすい人はいますか．"},{"letter":"C","text":"最近，薬を飲みましたか．"},{"letter":"D","text":"発熱を伴っていますか．"},{"letter":"E","text":"けがの直後から腫れましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：外傷によらない関節内出血は凝固因子欠乏を強く示唆する．血友病AとBはいずれもX連鎖潜性遺伝で，保因者である母を介して男児に発症するため，母方の男性血縁者の出血歴が決定的な手がかりになる．\n- A：出血部位に関する情報．\n- B：遺伝形式に直結し有用．\n- C：薬剤への曝露に関する情報．\n- D：感染の合併に関する情報．\n- E：外傷との関係に関する情報．","images":[],"stem_images":[]},{"number":22,"section":"D-1-S06　3歳男児・膝の腫脹","question":"（2/4）3歳の男児．右膝の腫脹と痛みを主訴に来院した．明らかな外傷はない．歩き始めた頃から，軽くぶつけただけで大きな青あざができやすかったという．母方の叔父に出血しやすい人がいるという．予想される検査所見はどれか．","options":[{"letter":"A","text":"血小板数の減少"},{"letter":"B","text":"PTの単独延長"},{"letter":"C","text":"フィブリノゲンの低下"},{"letter":"D","text":"出血時間の延長"},{"letter":"E","text":"APTTの単独延長"}],"answer":["E"],"multi":false,"explanation":"解説：第VIII因子・第IX因子はいずれも内因系に属するため，欠乏するとAPTTだけが延び，外因系を見るPTは正常に保たれる．血小板は正常なので一次止血は働き，出血時間も延びない．\n- A：血小板減少なら点状出血が主体となり，深部出血にはなりにくい．\n- B：PT単独延長はビタミンK欠乏の初期や第VII因子欠乏．\n- C：フィブリノゲン低下は播種性血管内凝固や肝不全．\n- D：出血時間の延長は血小板数・機能の異常やvon Willebrand病．\n- E：内因系凝固因子の欠乏を反映し正しい．","images":[],"stem_images":[]},{"number":23,"section":"D-1-S06　3歳男児・膝の腫脹","question":"（3/4）3歳の男児．右膝の腫脹と痛みを主訴に来院した．明らかな外傷はない．歩き始めた頃から，軽くぶつけただけで大きな青あざができやすかったという．母方の叔父に出血しやすい人がいるという．血小板数は正常，PTも正常でAPTTのみが延長していた．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"骨髄穿刺"},{"letter":"B","text":"出血時間と血小板凝集能"},{"letter":"C","text":"血清フェリチン"},{"letter":"D","text":"凝固因子活性の測定"},{"letter":"E","text":"血管造影"}],"answer":["D"],"multi":false,"explanation":"解説：APTT単独延長の原因を第VIII因子欠乏（血友病A）か第IX因子欠乏（血友病B）かに絞るには，各因子の活性を直接測る．活性1%未満が重症，1〜5%が中等症，5〜40%が軽症と重症度分類にも用いる．\n- A：骨髄穿刺は血球産生の異常を疑うときの検査で，血小板数が正常な本例では不要．\n- B：出血時間と血小板凝集能は一次止血の評価で，APTT延長の原因は特定できない．\n- C：フェリチンは鉄代謝の指標．\n- D：欠乏因子とその程度を直接決めるため正しい．\n- E：血管造影は出血源の局在診断に用いるもので，凝固異常の診断にならない．","images":[],"stem_images":[]},{"number":24,"section":"D-1-S06　3歳男児・膝の腫脹","question":"（4/4）3歳の男児．右膝の腫脹と痛みを主訴に来院した．明らかな外傷はない．歩き始めた頃から，軽くぶつけただけで大きな青あざができやすかったという．母方の叔父に出血しやすい人がいるという．血小板数は正常，PTも正常でAPTTのみが延長していた．第VIII因子活性は2%であった．同じ出血傾向でもPTが先に延長する病態の原因はどれか．","options":[{"letter":"A","text":"血小板の破壊"},{"letter":"B","text":"造血幹細胞の枯渇"},{"letter":"C","text":"ビタミンKの欠乏"},{"letter":"D","text":"第VIII因子の欠乏"},{"letter":"E","text":"赤血球膜蛋白の異常"}],"answer":["C"],"multi":false,"explanation":"解説：ビタミンKは第II・VII・IX・X因子の合成に必要で，半減期が最も短い第VII因子から活性が落ちる．第VII因子は外因系のみに関わるため，まずPTが延び，欠乏が進んでからAPTTも延びる．\n- A：血小板の破壊は免疫性血小板減少症などで，PT・APTTは正常のまま．\n- B：幹細胞の枯渇は再生不良性貧血で汎血球減少をきたす．\n- C：外因系から先に障害される点で正しい．\n- D：第VIII因子欠乏は本例そのもので，APTTのみが延長する側．\n- E：赤血球膜蛋白の異常は遺伝性球状赤血球症で溶血をきたす．","images":[],"stem_images":[]},{"number":25,"section":"D-1-S07　58歳男性・敗血症治療中の出血傾向","question":"（1/4）58歳の男性．肺炎から敗血症をきたし集中治療室で治療中である．本日，点滴刺入部からの止血困難と皮膚の紫斑が出現した．診療記録や担当者から確認する内容で，優先度が最も低いのはどれか．","options":[{"letter":"A","text":"尿量は減っていますか．"},{"letter":"B","text":"意識に変化はありますか．"},{"letter":"C","text":"血圧は下がっていますか．"},{"letter":"D","text":"便や尿にも血が混じりますか．"},{"letter":"E","text":"以前から爪が厚くなっていますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性の爪病変は急な出血と臓器障害の評価では優先度が低い．\n- A：腎灌流や腎障害を評価．\n- B：脳機能と全身状態を評価．\n- C：循環不全の進行を評価．\n- D：出血部位の広がりを確認．\n- E：慢性の爪病変は急な出血と臓器障害の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":26,"section":"D-1-S07　58歳男性・敗血症治療中の出血傾向","question":"（2/4）58歳の男性．肺炎から敗血症をきたし集中治療室で治療中である．本日，点滴刺入部からの止血困難と皮膚の紫斑が出現した．尿量は減少し，血圧は昇圧薬を要する状態という．予想される検査所見はどれか．","options":[{"letter":"A","text":"APTTの単独延長"},{"letter":"B","text":"フィブリノゲンの低下"},{"letter":"C","text":"出血時間のみの延長"},{"letter":"D","text":"血小板数の著明な増加"},{"letter":"E","text":"白血球の芽球出現"}],"answer":["B"],"multi":false,"explanation":"解説：全身で凝固が活性化すると，血小板と凝固因子が微小血栓に消費されて枯渇する．フィブリノゲンは消費されて低下し，PT・APTTは延長し，血小板も減るという同時多発の異常が特徴になる．\n- A：APTT単独延長は血友病など単一因子の欠乏．\n- B：消費性凝固障害を反映し正しい．\n- C：出血時間のみの延長はvon Willebrand病や血小板機能異常．\n- D：血小板は消費されて減る．増加は本態性血小板血症や炎症の反応性変化．\n- E：芽球の出現は急性白血病．","images":[],"stem_images":[]},{"number":27,"section":"D-1-S07　58歳男性・敗血症治療中の出血傾向","question":"（3/4）58歳の男性．肺炎から敗血症をきたし集中治療室で治療中である．本日，点滴刺入部からの止血困難と皮膚の紫斑が出現した．尿量は減少し，血圧は昇圧薬を要する状態という．血小板3.2万/μL，PT-INR 1.8，フィブリノゲン95mg/dLであった．診断を裏づける検査はどれか．","options":[{"letter":"A","text":"血清フェリチン"},{"letter":"B","text":"骨髄
