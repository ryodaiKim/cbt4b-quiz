側に多発してくること"},{"letter":"E","text":"鼓膜が陥凹して液面ができること"}],"answer":["C"],"multi":false,"explanation":"解説：頸部の筋膜の間隙に沿って感染が下降し，深頸部膿瘍から縦隔炎に至ると致死率が高い．呼吸困難・胸痛・皮下気腫の出現に注意し，造影CTで広がりを確かめて外科的に処置する．\n- A：内リンパ水腫はMénière病の病態．\n- B：耳石の迷入は良性発作性頭位めまい症．\n- C：この疾患の最も重篤な進展で正しい．\n- D：鼻茸の多発は好酸球性副鼻腔炎．\n- E：鼓膜の陥凹と液面は滲出性中耳炎．","images":[],"stem_images":[]},{"number":33,"section":"D-14-S09　64歳男性・頸部の硬いしこり","question":"（1/4）64歳の男性．2か月前から右の首にしこりがあることに気づいたという．痛みはなく，次第に大きくなっている．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"寝汗や体重減少はありますか．"},{"letter":"B","text":"喫煙と飲酒の習慣はありますか．"},{"letter":"C","text":"ほかの場所もしこりがありますか．"},{"letter":"D","text":"幼少期に乗り物酔いをしましたか．"},{"letter":"E","text":"声のかすれや嚥下痛はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．過去の乗り物酔いは頸部腫瘤の原因検索では優先度が低い．\n- A：悪性疾患の全身症状を確認．\n- B：頭頸部癌の危険因子を確認．\n- C：局所性か全身性かを評価．\n- D：過去の乗り物酔いは頸部腫瘤の原因検索では優先度が低い．この設問で選ぶ肢．\n- E：原発巣を疑う症状を確認．","images":[],"stem_images":[]},{"number":34,"section":"D-14-S09　64歳男性・頸部の硬いしこり","question":"（2/4）64歳の男性．2か月前から右の首にしこりがあることに気づいたという．痛みはなく，次第に大きくなっている．喫煙は40本/日を40年間，毎晩の飲酒も続けているという．触診所見として予想されるのはどれか．","options":[{"letter":"A","text":"表面平滑で軟らかく可動性が良い"},{"letter":"B","text":"強い圧痛と熱感を伴い波動を触れる"},{"letter":"C","text":"拍動を触れ収縮期に雑音を聴取する"},{"letter":"D","text":"表面平滑で弾性軟の嚢胞状の腫瘤"},{"letter":"E","text":"硬く周囲との可動性に乏しい腫瘤"}],"answer":["E"],"multi":false,"explanation":"解説：転移したリンパ節は被膜を越えて周囲組織へ浸潤するため，石様に硬く可動性が失われる．圧痛を欠く点が反応性リンパ節炎と，可動性の乏しさが悪性リンパ腫と異なる．\n- A：軟らかく可動性が良いのは反応性リンパ節腫大．\n- B：圧痛と熱感，波動は化膿性リンパ節炎や膿瘍．\n- C：拍動と雑音は血管性病変や頸動脈小体腫瘍．\n- D：弾性軟の嚢胞状腫瘤は側頸嚢胞．\n- E：転移の性状として正しい．","images":[],"stem_images":[]},{"number":35,"section":"D-14-S09　64歳男性・頸部の硬いしこり","question":"（3/4）64歳の男性．2か月前から右の首にしこりがあることに気づいたという．痛みはなく，次第に大きくなっている．喫煙は40本/日を40年間，毎晩の飲酒も続けているという．右頸部に3cm大の硬く可動性に乏しい腫瘤を触知する．最初に行うべきなのはどれか．","options":[{"letter":"A","text":"直ちに腫瘤を全摘して生検する"},{"letter":"B","text":"上気道消化管の内視鏡による観察"},{"letter":"C","text":"骨シンチグラフィで全身を検索する"},{"letter":"D","text":"呼吸機能検査で換気を評価する"},{"letter":"E","text":"睡眠ポリグラフィを施行する"}],"answer":["B"],"multi":false,"explanation":"解説：原発巣の検索が先で，鼻咽腔・中咽頭・下咽頭・喉頭・口腔を内視鏡で丁寧に観察し，疑わしい部位から生検する．安易に頸部の腫瘤を摘出すると，術野の汚染で予後を悪くしうる．\n- A：原発巣を探さずに摘出するのは原則として避ける．\n- B：診断の手順として正しい．\n- C：骨シンチグラフィは骨転移の検索で，原発巣は分からない．\n- D：呼吸機能検査は換気障害の評価．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":36,"section":"D-14-S09　64歳男性・頸部の硬いしこり","question":"（4/4）64歳の男性．2か月前から右の首にしこりがあることに気づいたという．痛みはなく，次第に大きくなっている．喫煙は40本/日を40年間，毎晩の飲酒も続けているという．右頸部に3cm大の硬く可動性に乏しい腫瘤を触知する．内視鏡で下咽頭に腫瘍を認めた．この腫瘍の組織型として最も多いのはどれか．","options":[{"letter":"A","text":"腺癌"},{"letter":"B","text":"小細胞癌"},{"letter":"C","text":"悪性リンパ腫"},{"letter":"D","text":"悪性黒色腫"},{"letter":"E","text":"扁平上皮癌"}],"answer":["E"],"multi":false,"explanation":"解説：上気道消化管の粘膜は重層扁平上皮で覆われ，喫煙と飲酒による慢性刺激で扁平上皮癌が生じる．頭頸部癌の大半を占め，同じ危険因子を共有する食道癌の重複も多い．\n- A：腺癌は唾液腺や鼻副鼻腔で生じることがあるが主体ではない．\n- B：小細胞癌は肺に多い．\n- C：悪性リンパ腫はWaldeyer輪に生じうるが頻度は低い．\n- D：悪性黒色腫は粘膜にも生じるがまれ．\n- E：頭頸部癌の主要な組織型で正しい．","images":[],"stem_images":[]},{"number":37,"section":"D-14-S10　32歳女性・口内の痛い潰瘍と顎下部の腫れ","question":"（1/4）32歳の女性．3日前から口の中に痛い潰瘍ができ，食事がしみるという．同じことを年に数回繰り返している．反復する口腔潰瘍に伴う全身性疾患を検討する質問はどれか．","options":[{"letter":"A","text":"尖った歯が当たっていますか．"},{"letter":"B","text":"熱い物でやけどをしましたか．"},{"letter":"C","text":"合わない義歯を使っていますか．"},{"letter":"D","text":"口の同じ場所を噛みますか．"},{"letter":"E","text":"陰部潰瘍や眼症状はありますか．"}],"answer":["E"],"multi":false,"explanation":"解説：反復する口腔内アフタに外陰部潰瘍・ぶどう膜炎・結節性紅斑が加わればBehçet病を考える．単独のアフタ性口内炎は自然治癒するが，全身性疾患の部分症状であれば管理が大きく変わる．\n- A：局所の機械的刺激に関する情報．\n- B：局所の熱傷に関する情報．\n- C：義歯による刺激に関する情報．\n- D：反復する外傷に関する情報．\n- E：全身性疾患の除外に直結し有用．","images":[],"stem_images":[]},{"number":38,"section":"D-14-S10　32歳女性・口内の痛い潰瘍と顎下部の腫れ","question":"（2/4）32歳の女性．3日前から口の中に痛い潰瘍ができ，食事がしみるという．同じことを年に数回繰り返している．陰部の潰瘍も目の症状もないという．この潰瘍の所見として予想されるのはどれか．","options":[{"letter":"A","text":"辺縁が硬く無痛性の潰瘍"},{"letter":"B","text":"白苔と紅暈を伴う円形の潰瘍"},{"letter":"C","text":"表面が鶏冠状に隆起する病変"},{"letter":"D","text":"中央が臍窩状にくぼむ丘疹"},{"letter":"E","text":"集簇する小水疱が帯状に並ぶ"}],"answer":["B"],"multi":false,"explanation":"解説：類円形で境界明瞭，中心に白色の偽膜を伴い，周囲が発赤して紅暈を形成する．数個までの小型のものが多く，1〜2週で瘢痕を残さず治る．疲労やストレス，鉄・ビタミン欠乏が誘因になる．\n- A：辺縁が硬く無痛性の潰瘍は梅毒の硬性下疳．\n- B：この疾患の典型的な所見で正しい．\n- C：鶏冠状の隆起は尖圭コンジローマ．\n- D：中央が臍窩状にくぼむ丘疹は伝染性軟属腫．\n- E：帯状に並ぶ集簇性小水疱は帯状疱疹．","images":[],"stem_images":[]},{"number":39,"section":"D-14-S10　32歳女性・口内の痛い潰瘍と顎下部の腫れ","question":"（3/4）32歳の女性．3日前から口の中に痛い潰瘍ができ，食事がしみるという．同じことを年に数回繰り返している．陰部の潰瘍も目の症状もないという．経過中に食事のたびに右の顎の下が腫れて痛み，食後しばらくすると引くという症状が加わった．この症状が示すのはどれか．","options":[{"letter":"A","text":"唾液腺の導管が閉塞していること"},{"letter":"B","text":"顎関節の円板がずれていること"},{"letter":"C","text":"リンパ節に転移が生じたこと"},{"letter":"D","text":"甲状腺が炎症を起こしたこと"},{"letter":"E","text":"頸動脈に動脈瘤ができたこと"}],"answer":["A"],"multi":false,"explanation":"解説：食事の刺激で唾液が分泌されるのに導管が結石で塞がれているため，腺体が腫れて強く痛む（唾疝痛）．食後しばらくすると分泌が収まり腫脹も引く．顎下腺に最も多く生じる．\n- A：唾石症の機序として正しい．\n- B：顎関節症では開口時の雑音と疼痛が出る．\n- C：転移リンパ節は食事と無関係に持続して大きくなる．\n- D：甲状腺の炎症は前頸部の圧痛として現れる．\n- E：頸動脈の動脈瘤は拍動性の腫瘤として触れる．","images":[],"stem_images":[]},{"number":40,"section":"D-14-S10　32歳女性・口内の痛い潰瘍と顎下部の腫れ","question":"（4/4）32歳の女性．3日前から口の中に痛い潰瘍ができ，食事がしみるという．同じことを年に数回繰り返している．陰部の潰瘍も目の症状もないという．経過中に食事のたびに右の顎の下が腫れて痛み，食後しばらくすると引くという症状が加わった．診断のために行うべき検査はどれか．","options":[{"letter":"A","text":"純音聴力検査の施行"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"頸部超音波検査またはCT"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["C"],"multi":false,"explanation":"解説：超音波で導管の拡張と結石の音響陰影を確認し，CTで結石の位置と大きさを把握する．導管口に近い小さな結石は口内から摘出でき，深部や大きなものは腺体の摘出を検討する．\n- A：純音聴力検査は難聴の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：結石の局在の同定に直結し正しい．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]}],"seed":null},{"id":"D-15_精神系","name":"D-15_精神系.md","label":"D-15 精神系","count":20,"sourceHash":"108567a842f8","questions":[{"number":1,"section":"D-15-S01　78歳女性・物忘れと意欲の低下","question":"（1/4）78歳の女性．半年前から物忘れが増え，家事もしなくなったと家族が話す．本人は「年のせいだから」と言う．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"昔から辛い料理が好きですか．"},{"letter":"B","text":"いつからどのように進みましたか．"},{"letter":"C","text":"お金や薬の管理はできますか．"},{"letter":"D","text":"楽しめない気分が続きますか．"},{"letter":"E","text":"薬や飲酒量は変わりましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．以前からの食の嗜好だけでは今回の認知症状の鑑別に乏しい．\n- A：以前からの食の嗜好だけでは今回の認知症状の鑑別に乏しい．この設問で選ぶ肢．\n- B：経過から原因を絞る．\n- C：生活機能への影響を確認．\n- D：抑うつ症状を確認．\n- E：薬剤・物質の影響を検討．","images":[],"stem_images":[]},{"number":2,"section":"D-15-S01　78歳女性・物忘れと意欲の低下","question":"（2/4）78歳の女性．半年前から物忘れが増え，家事もしなくなったと家族が話す．本人は「年のせいだから」と言う．家族はいつからとは特定できず，少しずつ進んだという．認知機能検査での応答として予想されるのはどれか．","options":[{"letter":"A","text":"分からない質問に「分からない」と答える"},{"letter":"B","text":"質問に答えず黙り込むことが多い"},{"letter":"C","text":"覚えていなくても取り繕って答える"},{"letter":"D","text":"検査中に意識レベルが大きく動揺する"},{"letter":"E","text":"質問のたびに強い不安を訴える"}],"answer":["C"],"multi":false,"explanation":"解説：病識が乏しく，記憶の欠損を作話や言い訳で埋める取り繕い反応がみられる．うつ病による仮性認知症では本人が症状を強く訴え，「分からない」と投げ出すように答えることが多い．\n- A：「分からない」と答えるのは仮性認知症に特徴的．\n- B：黙り込む反応も抑うつを示唆する．\n- C：この疾患の典型的な応答で正しい．\n- D：意識レベルの動揺はせん妄．\n- E：強い不安の訴えも仮性認知症で目立つ．","images":[],"stem_images":[]},{"number":3,"section":"D-15-S01　78歳女性・物忘れと意欲の低下","question":"（3/4）78歳の女性．半年前から物忘れが増え，家事もしなくなったと家族が話す．本人は「年のせいだから」と言う．家族はいつからとは特定できず，少しずつ進んだという．検査中は覚えていなくても取り繕って答え，意識レベルは終始清明であった．治療可能な原因を除外するために行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査と睡眠ポリグラフ検査"},{"letter":"B","text":"骨シンチグラフィと骨密度測定"},{"letter":"C","text":"上部消化管内視鏡と腹部CT"},{"letter":"D","text":"甲状腺機能とビタミンB12と画像"},{"letter":"E","text":"下肢静脈超音波とDダイマー"}],"answer":["D"],"multi":false,"explanation":"解説：甲状腺機能低下症，ビタミンB12欠乏，慢性硬膜下血腫，正常圧水頭症は治療によって改善しうる．変性性と決めつける前に，血液検査と頭部画像でこれらを除外することが必須の手順になる．\n- A：呼吸機能検査と睡眠ポリグラフ検査は換気と睡眠の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：内視鏡と腹部CTは消化器疾患の評価．\n- D：可逆性の原因を網羅的に除外でき正しい．\n- E：下肢静脈超音波は深部静脈血栓症の検索．","images":[],"stem_images":[]},{"number":4,"section":"D-15-S01　78歳女性・物忘れと意欲の低下","question":"（4/4）78歳の女性．半年前から物忘れが増え，家事もしなくなったと家族が話す．本人は「年のせいだから」と言う．家族はいつからとは特定できず，少しずつ進んだという．検査中は覚えていなくても取り繕って答え，意識レベルは終始清明であった．甲状腺機能とビタミンB12は正常で，頭部MRIに血腫も水頭症もなかった．入院後に夜間だけ興奮し辻褄の合わないことを言い出した場合の病態はどれか．","options":[{"letter":"A","text":"病型が急に変わったこと"},{"letter":"B","text":"抑うつが急速に悪化したこと"},{"letter":"C","text":"甲状腺機能が急に低下したこと"},{"letter":"D","text":"統合失調症を新たに発症したこと"},{"letter":"E","text":"せん妄を合併して起きたこと"}],"answer":["E"],"multi":false,"explanation":"解説：認知症は基礎としてせん妄の最大の危険因子になる．入院・手術・感染・脱水・薬剤が引き金となり，急性発症で日内変動が大きく，意識レベルが動揺する点が基礎疾患の症状と区別される．\n- A：変性性の病型が数日で変わることはない．\n- B：抑うつの悪化では意識レベルは保たれる．\n- C：甲状腺機能は正常と確認済みで，数日で急変しない．\n- D：高齢での統合失調症の新規発症はまれである．\n- E：急性発症と日内変動から正しい．","images":[],"stem_images":[]},{"number":5,"section":"D-15-S02　21歳男性・奇異な言動と引きこもり","question":"（1/4）21歳の男性．半年前から大学に行かなくなり自室にこもるという．「盗聴されている」と言い，独り言も増えたと家族が話す．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"薬物や市販薬を使っていますか．"},{"letter":"B","text":"自分や誰かを傷つけそうですか．"},{"letter":"C","text":"子どもの頃に中耳炎がありましたか．"},{"letter":"D","text":"睡眠や学校生活はどうですか．"},{"letter":"E","text":"ほかの人には聞こえない声がありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．小児期の中耳炎は現在の精神症状の初期評価では優先度が低い．\n- A：物質誘発性症状を検討．\n- B：安全に関わる危険を評価．\n- C：小児期の中耳炎は現在の精神症状の初期評価では優先度が低い．この設問で選ぶ肢．\n- D：機能低下と気分症状を評価．\n- E：幻聴の有無と内容を確認．","images":[],"stem_images":[]},{"number":6,"section":"D-15-S02　21歳男性・奇異な言動と引きこもり","question":"（2/4）21歳の男性．半年前から大学に行かなくなり自室にこもるという．「盗聴されている」と言い，独り言も増えたと家族が話す．自分の行動を批評する複数の声が聞こえるという．この症状と同じ群に属するのはどれか．","options":[{"letter":"A","text":"感情の表出が乏しくなっていくこと"},{"letter":"B","text":"意欲が著しく低下すること"},{"letter":"C","text":"他人との交流を避けること"},{"letter":"D","text":"考えを誰かに吹き込まれる体験"},{"letter":"E","text":"会話の量が減っていくこと"}],"answer":["D"],"multi":false,"explanation":"解説：幻覚・妄想・思考伝播・させられ体験などは正常な機能に付加される陽性症状である．一方，感情の平板化・意欲低下・会話の貧困・社会的引きこもりは正常な機能が失われる陰性症状にあたる．\n- A：感情の平板化は陰性症状．\n- B：意欲低下も陰性症状．\n- C：社会的引きこもりも陰性症状．\n- D：陽性症状に属し正しい．\n- E：会話の貧困も陰性症状．","images":[],"stem_images":[]},{"number":7,"section":"D-15-S02　21歳男性・奇異な言動と引きこもり","question":"（3/4）21歳の男性．半年前から大学に行かなくなり自室にこもるという．「盗聴されている」と言い，独り言も増えたと家族が話す．自分の行動を批評する複数の声が聞こえるという．発熱やけいれんはなく，神経学的な異常も認めない．治療を始める前に必ず除外すべきなのはどれか．","options":[{"letter":"A","text":"睡眠時無呼吸症候群の有無"},{"letter":"B","text":"器質性疾患と薬物の影響"},{"letter":"C","text":"屈折異常による視力低下"},{"letter":"D","text":"骨密度の低下の有無"},{"letter":"E","text":"深部静脈血栓症の有無"}],"answer":["B"],"multi":false,"explanation":"解説：脳炎・自己免疫性脳症・てんかん・内分泌疾患・覚醒剤や大麻などの物質は同じ症状を起こしうる．血液検査・頭部画像・脳波・尿中薬物検査で器質性と物質性を除外してから診断する．\n- A：睡眠時無呼吸症候群はこの症状の原因にならない．\n- B：診断の前提として必須で正しい．\n- C：屈折異常は視力の問題で幻聴を説明しない．\n- D：骨密度は骨粗鬆症の評価．\n- E：深部静脈血栓症は静脈の血栓の問題．","images":[],"stem_images":[]},{"number":8,"section":"D-15-S02　21歳男性・奇異な言動と引きこもり","question":"（4/4）21歳の男性．半年前から大学に行かなくなり自室にこもるという．「盗聴されている」と言い，独り言も増えたと家族が話す．自分の行動を批評する複数の声が聞こえるという．血液検査・頭部MRI・脳波・尿中薬物検査に異常はなかった．抗精神病薬を開始した数日後に高熱と筋強剛，意識障害が出現した．考えるべき病態はどれか．","options":[{"letter":"A","text":"薬剤による肝障害の進行"},{"letter":"B","text":"感染症を新たに合併したこと"},{"letter":"C","text":"悪性症候群を発症したこと"},{"letter":"D","text":"抑うつが急速に悪化したこと"},{"letter":"E","text":"甲状腺機能が急に亢進したこと"}],"answer":["C"],"multi":false,"explanation":"解説：抗精神病薬の開始や増量に伴い，高熱・筋強剛・自律神経症状・意識障害とクレアチンキナーゼの著明な上昇をきたす．直ちに原因薬を中止し，全身管理とダントロレンの投与を行う．\n- A：薬剤性肝障害では肝逸脱酵素が上がるが筋強剛は伴わない．\n- B：感染症は鑑別に挙がるが，筋強剛とクレアチンキナーゼ上昇は説明しにくい．\n- C：薬剤との時間関係と症状の組合せから正しい．\n- D：抑うつの悪化では高熱や筋強剛は出ない．\n- E：甲状腺クリーゼでも高熱は出るが，筋強剛は典型的でない．","images":[],"stem_images":[]},{"number":9,"section":"D-15-S03　46歳男性・意欲低下と不眠","question":"（1/4）46歳の男性．2か月前から何をしても楽しめず，仕事に集中できないという．朝は特につらく，夜中に何度も目が覚める．自殺の危険を評価するため，直接尋ねる質問はどれか．","options":[{"letter":"A","text":"朝と夜で気分は変わりますか．"},{"letter":"B","text":"死にたいと思うことはありませんか．"},{"letter":"C","text":"食事はおいしく感じますか．"},{"letter":"D","text":"仕事の量は増えましたか．"},{"letter":"E","text":"寝つくまで時間がかかりますか．"}],"answer":["B"],"multi":false,"explanation":"解説：希死念慮の確認は必須で，具体的な計画や準備の有無まで踏み込んで尋ねる．尋ねることが自殺を誘発することはなく，むしろ話題にできたこと自体が本人の安心につながる．\n- A：日内変動に関する情報．\n- B：安全の確保に直結し有用．\n- C：食欲や快感の低下に関する情報．\n- D：生活上の負荷に関する情報．\n- E：睡眠障害に関する情報．","images":[],"stem_images":[]},{"number":10,"section":"D-15-S03　46歳男性・意欲低下と不眠","question":"（2/4）46歳の男性．2か月前から何をしても楽しめず，仕事に集中できないという．朝は特につらく，夜中に何度も目が覚める．「消えてしまいたい」と思うことがあるが，具体的な計画はないという．認められる症状として典型的なのはどれか．","options":[{"letter":"A","text":"夕方に向かって気分が重くなる"},{"letter":"B","text":"入眠だけが困難で朝はすっきり起きる"},{"letter":"C","text":"食欲が増して体重が増加する"},{"letter":"D","text":"早朝に覚醒し朝に最も気分が重い"},{"letter":"E","text":"睡眠時間が減っても疲れを感じない"}],"answer":["D"],"multi":false,"explanation":"解説：早朝覚醒と，朝に最も症状が重く夕方に向けて軽くなる日内変動が特徴的である．食欲低下と体重減少，自責感，思考制止も揃いやすく，これらが診断を支持する．\n- A：夕方に向けて悪化するのは非定型的な型でみられる．\n- B：入眠困難のみは不安障害や生活リズムの乱れで多い．\n- C：食欲増加と体重増加は非定型的な型の特徴．\n- D：この疾患に典型的で正しい．\n- E：睡眠欲求の減少は躁病エピソード．","images":[],"stem_images":[]},{"number":11,"section":"D-15-S03　46歳男性・意欲低下と不眠","question":"（3/4）46歳の男性．2か月前から何をしても楽しめず，仕事に集中できないという．朝は特につらく，夜中に何度も目が覚める．「消えてしまいたい」と思うことがあるが，具体的な計画はないという．早朝に覚醒し朝に最も気分が重いという．抗うつ薬を始める前に必ず確認すべきなのはどれか．","options":[{"letter":"A","text":"骨密度が低下していないか"},{"letter":"B","text":"屈折異常がないかどうか"},{"letter":"C","text":"過去に気分の高揚がないか"},{"letter":"D","text":"深部静脈血栓症の既往がないか"},{"letter":"E","text":"睡眠時無呼吸症候群がないか"}],"answer":["C"],"multi":false,"explanation":"解説：過去に躁または軽躁のエピソードがあれば双極性障害であり，抗うつ薬の単独投与は躁転や急速交代化を招く．本人が病的と自覚していないことが多いので，家族からの情報が重要になる．\n- A：骨密度は骨粗鬆症の評価．\n- B：屈折異常は視力の問題．\n- C：治療薬の選択を根本から変え正しい．\n- D：深部静脈血栓症の既往はこの治療選択を変えない．\n- E：睡眠時無呼吸症候群は不眠の鑑別には挙がるが，薬剤選択の分岐にはならない．","images":[],"stem_images":[]},{"number":12,"section":"D-15-S03　46歳男性・意欲低下と不眠","question":"（4/4）46歳の男性．2か月前から何をしても楽しめず，仕事に集中できないという．朝は特につらく，夜中に何度も目が覚める．「消えてしまいたい」と思うことがあるが，具体的な計画はないという．早朝に覚醒し朝に最も気分が重いという．過去に気分の高揚した時期はなく，抗うつ薬を開始した．患者と家族への説明として適切なのはどれか．","options":[{"letter":"A","text":"効果が出るまで数週間かかること"},{"letter":"B","text":"服用したその日から効果が出ること"},{"letter":"C","text":"効果が出たらすぐ中止してよいこと"},{"letter":"D","text":"副作用はまったく出ないこと"},{"letter":"E","text":"飲酒しても差し支えないこと"}],"answer":["A"],"multi":false,"explanation":"解説：効果の発現には通常2〜4週かかり，その間に自己判断で中止されやすい．寛解後も再発予防のため半年以上続ける必要があること，開始初期にかえって不安や焦燥が強まりうることも説明する．\n- A：服薬継続の支援に不可欠で正しい．\n- B：即効性はなく，期待させると中断につながる．\n- C：早期の中止は再発を招く．\n- D：消化器症状や性機能障害などの副作用は起こりうる．\n- E：飲酒は症状と副作用を悪化させるため控えるよう指導する．","images":[],"stem_images":[]},{"number":13,"section":"D-15-S04　32歳女性・多弁と睡眠欲求の減少","question":"（1/4）32歳の女性．2週間前から一日中しゃべり続け，次々と事業の計画を立てるという．3時間しか眠らないのに疲れないと本人は話す．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"多額の買い物や危険な行動はありますか．"},{"letter":"B","text":"薬やサプリを使っていますか．"},{"letter":"C","text":"家族にも同じような時期がありましたか．"},{"letter":"D","text":"以前から花粉でくしゃみが出ますか．"},{"letter":"E","text":"以前に落ち込んだ時期はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．季節性鼻炎は今回の気分・行動変化の評価では優先度が低い．\n- A：生活上の損失と安全を評価．\n- B：薬剤・物質による症状を検討．\n- C：気分障害の家族歴を確認．\n- D：季節性鼻炎は今回の気分・行動変化の評価では優先度が低い．この設問で選ぶ肢．\n- E：過去の気分エピソードを確認．","images":[],"stem_images":[]},{"number":14,"section":"D-15-S04　32歳女性・多弁と睡眠欲求の減少","question":"（2/4）32歳の女性．2週間前から一日中しゃべり続け，次々と事業の計画を立てるという．3時間しか眠らないのに疲れないと本人は話す．2年前に半年ほど落ち込んで休職した時期があったという．現在の状態で最も問題となる行動はどれか．","options":[{"letter":"A","text":"早朝に覚醒してしまうこと"},{"letter":"B","text":"他人との交流を避けること"},{"letter":"C","text":"高額な契約を重ねること"},{"letter":"D","text":"何をしても楽しめないこと"},{"letter":"E","text":"自分を責め続けてしまうこと"}],"answer":["C"],"multi":false,"explanation":"解説：判断力が低下し，浪費・無謀な投資・性的逸脱・危険な運転などで社会的信用や財産を失う．本人には病識がないため，家族と相談しながら入院も含めた保護的な対応を早期に検討する．\n- A：早朝覚醒は抑うつエピソードの症状．\n- B：社会的引きこもりも抑うつ側の症状．\n- C：この時期に最も現実的な被害をもたらし正しい．\n- D：興味・喜びの喪失は抑うつエピソード．\n- E：自責感も抑うつエピソードの症状．","images":[],"stem_images":[]},{"number":15,"section":"D-15-S04　32歳女性・多弁と睡眠欲求の減少","question":"（3/4）32歳の女性．2週間前から一日中しゃべり続け，次々と事業の計画を立てるという．3時間しか眠らないのに疲れないと本人は話す．2年前に半年ほど落ち込んで休職した時期があったという．すでに高額な契約を複数結んでいることが分かった．治療の中心となる薬剤はどれか．","options":[{"letter":"A","text":"抗うつ薬の単独投与"},{"letter":"B","text":"抗ヒスタミン薬の連日内服"},{"letter":"C","text":"甲状腺ホルモンの補充"},{"letter":"D","text":"気分安定薬による治療"},{"letter":"E","text":"抗菌薬の長期予防投与"}],"answer":["D"],"multi":false,"explanation":"解説：炭酸リチウムやバルプロ酸，一部の非定型抗精神病薬が気分の波を抑える．炭酸リチウムは治療域が狭いため血中濃度の測定が必須で，脱水や利尿薬の併用で中毒に至ることを説明する．\n- A：抗うつ薬の単独投与は躁転や急速交代化を招く．\n- B：抗ヒスタミン薬はアレルギー疾患の治療．\n- C：甲状腺ホルモンの補充は機能低下症の治療．\n- D：この疾患の中心的な治療で正しい．\n- E：抗菌薬は感染症の治療．","images":[],"stem_images":[]},{"number":16,"section":"D-15-S04　32歳女性・多弁と睡眠欲求の減少","question":"（4/4）32歳の女性．2週間前から一日中しゃべり続け，次々と事業の計画を立てるという．3時間しか眠らないのに疲れないと本人は話す．2年前に半年ほど落ち込んで休職した時期があったという．すでに高額な契約を複数結んでいることが分かった．炭酸リチウムを開始した．患者に説明すべき注意はどれか．","options":[{"letter":"A","text":"服用中は日光を完全に避けること"},{"letter":"B","text":"脱水や利尿薬の併用に注意すること"},{"letter":"C","text":"服用中は蛋白質を摂らないこと"},{"letter":"D","text":"効果が出たら自己判断で中止すること"},{"letter":"E","text":"服用中は運動を完全にやめること"}],"answer":["B"],"multi":false,"explanation":"解説：腎から排泄されるため，脱水・発熱・利尿薬・非ステロイド性抗炎症薬で血中濃度が上がり中毒に至る．振戦・嘔吐・意識障害が中毒の徴候で，定期的な血中濃度と腎機能の測定が要る．\n- A：日光の回避はポルフィリン症などの指導．\n- B：中毒の予防に直結し正しい．\n- C：蛋白制限は腎不全の食事療法．\n- D：自己判断の中止は再発を招く．\n- E：運動の完全中止は不要だが，発汗による脱水には注意する．","images":[],"stem_images":[]},{"number":17,"section":"D-15-S05　6歳男児・集団行動の困難","question":"（1/4）6歳の男児．小学校の担任から，授業中に席を立ち，友だちとのやりとりがかみ合わないと指摘されたという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"家庭でも同じ行動がありますか．"},{"letter":"B","text":"友だちとの会話や遊びはどうですか．"},{"letter":"C","text":"乳幼児期の発達はどうでしたか．"},{"letter":"D","text":"睡眠や聞こえに問題はありますか．"},{"letter":"E","text":"乳歯はどの順番で抜けましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．歯の交換順序は今回の行動評価では優先度が低い．\n- A：複数の場面での支障を確認．\n- B：社会的相互作用を評価．\n- C：発達歴を確認．\n- D：行動に影響する別の要因を検討．\n- E：歯の交換順序は今回の行動評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":18,"section":"D-15-S05　6歳男児・集団行動の困難","question":"（2/4）6歳の男児．小学校の担任から，授業中に席を立ち，友だちとのやりとりがかみ合わないと指摘されたという．1歳半健診で指さしが出ず，視線が合いにくいと言われたことがあるという．特定の電車の型式に強い関心を示し，並べ方を変えると激しく怒るという．この特性はどれか．","options":[{"letter":"A","text":"不注意が中心の特性である"},{"letter":"B","text":"多動と衝動性が中心の特性である"},{"letter":"C","text":"全般的な知的発達の遅れである"},{"letter":"D","text":"限定的で反復的な行動と興味"},{"letter":"E","text":"一過性の環境への反応である"}],"answer":["D"],"multi":false,"explanation":"解説：特定の対象への強い没頭，同一性へのこだわり，変化への強い抵抗，感覚の過敏や鈍麻は，社会的コミュニケーションの持続的な欠陥と並ぶ二本柱である．幼少期から一貫して認められる．\n- A：不注意は注意欠如・多動症の症状．\n- B：多動と衝動性も注意欠如・多動症の症状．\n- C：知的発達の遅れは知的能力障害で，別に評価する．\n- D：この特性の中核で正しい．\n- E：一過性の環境反応では乳幼児期からの一貫性を説明できない．","images":[],"stem_images":[]},{"number":19,"section":"D-15-S05　6歳男児・集団行動の困難","question":"（3/4）6歳の男児．小学校の担任から，授業中に席を立ち，友だちとのやりとりがかみ合わないと指摘されたという．1歳半健診で指さしが出ず，視線が合いにくいと言われたことがあるという．特定の電車の型式に強い関心を示し，並べ方を変えると激しく怒るという．授業中に席を立つという症状の評価で必要なのはどれか．","options":[{"letter":"A","text":"学校だけで起こるかを確かめる"},{"letter":"B","text":"複数の場面で確かめる"},{"letter":"C","text":"睡眠時無呼吸がないかを確かめる"},{"letter":"D","text":"屈折異常がないかを確かめる"},{"letter":"E","text":"骨密度が低くないかを確かめる"}],"answer":["B"],"multi":false,"explanation":"解説：注意欠如・多動症の診断には，症状が家庭と学校など複数の場面で認められ，発達水準に不釣り合いで，社会的・学業的な機能に支障をきたしていることが要る．単一の場面だけでは診断できない．\n- A：一つの場面だけなら環境要因の可能性が高い．\n- B：診断基準そのもので正しい．\n- C：睡眠障害は不注意の鑑別に挙がるが，まず場面の確認が先．\n- D：屈折異常は視力の問題．\n- E：骨密度は骨粗鬆症の評価．","images":[],"stem_images":[]},{"number":20,"section":"D-15-S05　6歳男児・集団行動の困難","question":"（4/4）6歳の男児．小学校の担任から，授業中に席を立ち，友だちとのやりとりがかみ合わないと指摘されたという．1歳半健診で指さしが出ず，視線が合いにくいと言われたことがあるという．特定の電車の型式に強い関心を示し，並べ方を変えると激しく怒るという．家庭でも落ち着かず離席が多いことが確認された．最初に行うべき支援はどれか．","options":[{"letter":"A","text":"直ちに中枢刺激薬を開始する"},{"letter":"B","text":"集団活動から完全に外すこと"},{"letter":"C","text":"家庭と学校での環境調整を行う"},{"letter":"D","text":"副腎皮質ステロイドを開始する"},{"letter":"E","text":"抗精神病薬を毎日内服させる"}],"answer":["C"],"multi":false,"explanation":"解説：座席の位置，刺激の少ない環境，視覚的な手がかり，短く具体的な指示，見通しを示す工夫といった環境調整と，本人と周囲への心理教育が支援の基礎になる．薬物療法はこれを補うものと位置づける．\n- A：薬物療法は環境調整を行ったうえで検討する．\n- B：集団から完全に外すのは社会性の発達を妨げる．\n- C：支援の基礎として正しい．\n- D：ステロイドはこの特性の治療ではない．\n- E：抗精神病薬は強い興奮や自傷が問題になる場合に限って検討する．","images":[],"stem_images":[]}],"seed":null},{"id":"E-2_感染症","name":"E-2_感染症.md","label":"E-2 感染症","count":60,"sourceHash":"59b32143cfc3","questions":[{"number":1,"section":"E-2-S01　26歳男性・咳のない発熱と咽頭痛","question":"（1/4）26歳の男性．昨日から39℃の発熱とのどの痛みがあり来院した．咽頭炎でウイルス性を支持する呼吸器症状を確認する質問はどれか．","options":[{"letter":"A","text":"飲み込むと痛いですか．"},{"letter":"B","text":"首の前が押すと痛みますか．"},{"letter":"C","text":"高熱が急に出ましたか．"},{"letter":"D","text":"咳は出ていますか．"},{"letter":"E","text":"発疹が出ていますか．"}],"answer":["D"],"multi":false,"explanation":"解説：咳の有無はCentor基準の項目のひとつで，咳がないことが細菌性咽頭炎を示唆する．咳や鼻汁が主体ならウイルス性で抗菌薬は不要となり，この一点が処方の判断を直接分ける．\n- A：多くの咽頭炎に共通する嚥下痛に関する情報．\n- B：前頸部リンパ節症状に関する情報．\n- C：発熱の経過に関する情報．\n- D：抗菌薬の要否を分け有用．\n- E：ウイルス・細菌の双方で起こる皮疹に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"E-2-S01　26歳男性・咳のない発熱と咽頭痛","question":"（2/4）26歳の男性．昨日から39℃の発熱とのどの痛みがあり来院した．咳も鼻水もまったく出ていないという．食事を飲み込むときに強く痛むという．認められる所見はどれか．","options":[{"letter":"A","text":"耳後部リンパ節の無痛性の腫脹"},{"letter":"B","text":"扁桃の白苔と前頸部リンパ節の圧痛"},{"letter":"C","text":" め，聴診では所見に乏しいのに画像では気管支肺炎様やすりガラス状の陰影が目立つ．この乖離が細菌性肺炎との重要な違いになる．\n- A：画像所見は明らかなことが多い．\n- C：著明なラ音と軽微な陰影という組合せは典型的でない．\n- D：片側の呼吸音消失は気胸や無気肺．\n- E：両側の胸膜摩擦音は胸膜炎．\n- B：この疾患に特徴的な乖離で正しい．","images":[],"stem_images":[]},{"number":15,"section":"E-2-S04　21歳男性・頑固な乾いた咳","question":"（3/4）21歳の男性．3週間前から乾いた咳が続き，市販薬でも改善しないという．微熱と倦怠感を伴う．同じサークルの学生数人が同様の咳をしているという．聴診では明らかな異常を認めないが，胸部エックス線写真で右下肺野にすりガラス状の陰影を認める．白血球数は正常範囲であった．有効な抗菌薬はどれか．","options":[{"letter":"A","text":"マクロライド系の抗菌薬"},{"letter":"B","text":"セフェム系の抗菌薬"},{"letter":"C","text":"ペニシリン系の抗菌薬"},{"letter":"D","text":"カルバペネム系の抗菌薬"},{"letter":"E","text":"グリコペプチド系の抗菌薬"}],"answer":["A"],"multi":false,"explanation":"解説：この病原体は細胞壁をもたないため，細胞壁合成を阻害するβラクタム系がまったく効かない．蛋白合成を阻害するマクロライドやテトラサイクリン，キノロン系を選ぶ必要がある．\n- B：セフェム系はβラクタム系で無効．\n- C：ペニシリン系もβラクタム系で無効．\n- D：カルバペネム系もβラクタム系で無効．\n- E：グリコペプチド系も細胞壁合成を阻害するため無効．\n- A：作用機序が合致し正しい．","images":[],"stem_images":[]},{"number":16,"section":"E-2-S04　21歳男性・頑固な乾いた咳","question":"（4/4）21歳の男性．3週間前から乾いた咳が続き，市販薬でも改善しないという．微熱と倦怠感を伴う．同じサークルの学生数人が同様の咳をしているという．聴診では明らかな異常を認めないが，胸部エックス線写真で右下肺野にすりガラス状の陰影を認める．白血球数は正常範囲であった．マクロライドで軽快した．この感染に伴って上昇しうる血液所見はどれか．","options":[{"letter":"A","text":"血清フェリチンの著明な低下"},{"letter":"B","text":"網赤血球の著明な減少"},{"letter":"C","text":"血清アルブミンの著明な上昇"},{"letter":"D","text":"直接ビリルビンの著明な上昇"},{"letter":"E","text":"寒冷凝集素価の上昇"}],"answer":["E"],"multi":false,"explanation":"解説：赤血球膜のI抗原に対する寒冷凝集素が産生され，力価が上昇する．まれに寒冷凝集素による溶血をきたす．皮疹や中枢神経症状といった肺外合併症も知られている．\n- A：フェリチンは炎症で上昇する方向．\n- B：網赤血球の減少はこの感染の特徴ではない．\n- C：アルブミンは炎症で低下する方向．\n- D：直接ビリルビンの上昇は閉塞性黄疸．\n- E：この感染に伴う所見として正しい．","images":[],"stem_images":[]},{"number":17,"section":"E-2-S05　58歳男性・高熱と意識の混濁と下痢","question":"（1/4）58歳の男性．3日前から39℃台の発熱があり，本日は反応が鈍く下痢も伴うという．咳も出る．家族に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"飲食中にむせたことはありますか．"},{"letter":"B","text":"最近，海外へ行きましたか．"},{"letter":"C","text":"排便で肛門が痛みますか．"},{"letter":"D","text":"免疫を抑える薬を使いますか．"},{"letter":"E","text":"温泉や入浴施設を利用しましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．肛門局所症状は今回の肺症状を伴う重症感染の緊急 濃度の高いニューキノロン系やマクロライド系を選ぶ．四類感染症として直ちに保健所へ届け出る．\n- B：ペニシリン系は細胞内へ移行せず無効．\n- C：セフェム系も同様に無効．\n- D：カルバペネム系も細胞内移行が乏しい．\n- E：グリコペプチド系はグラム陽性菌用で無効．\n- A：細胞内移行性から正しい．","images":[],"stem_images":[]},{"number":21,"section":"E-2-S06　42歳男性・労作時呼吸困難と乾いた咳","question":"（1/4）42歳の男性．1か月前から階段で息が切れ，乾いた咳が続くという．体重が8kg減った．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"仕事で粉じんを吸いますか．"},{"letter":"B","text":"免疫を抑える病気や薬はありますか．"},{"letter":"C","text":"結核患者と接触しましたか．"},{"letter":"D","text":"幼少期に中耳炎がありましたか．"},{"letter":"E","text":"発熱や寝汗はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．小児期の中耳炎は現在の呼吸症状の初期評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：非感染性肺疾患との鑑別に有用．\n- B：日和見感染の背景を確認．\n- C：結核への曝露を確認．\n- D：小児期の中耳炎は現在の呼吸症状の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：慢性感染の全身症状を確認．","images":[],"stem_images":[]},{"number":22,"section":"E-2-S06　42歳男性・労作時呼吸困難と乾いた咳","question":"（2/4）42歳の男性．1か月前から階段で息が切れ，乾いた咳が続くという．体重が8kg減った．口の中に白い苔のようなものが付き，半年前に帯状疱疹にかかったという．胸部の画像所見として予想されるのはどれか．","options":[{"letter":"A","text":"右上肺野の空洞を伴う浸潤影"},{"letter":"B","text":"片側の肺紋理消失と虚脱"},{"letter":"C","text":"気管支の不可逆的な拡張像"},{"letter":"D","text":"心拡大と両肺門部の蝶形陰影"},{"letter":"E","text":"両側びまん性のすりガラス影"}],"answer":["E"],"multi":false,"explanation":"解説：肺胞腔に病原体と滲出物が広がるため，両側の肺門周囲から末梢へびまん性のすりガラス影が広がる．低酸素血症の程度に比べて聴診所見が乏しいのも特徴である．\n- A：空洞を伴う上肺野の浸潤影は肺結核．\n- B：肺紋理消失と虚脱は気胸．\n- C：気管支の不可逆的拡張は気管支拡張症．\n- D：心拡大と蝶形陰影は心原性肺水腫．\n- E：この肺炎の典型的な画像所見で正しい．","images":[],"stem_images":[]},{"number":23,"section":"E-2-S06　42歳男性・労作時呼吸困難と乾いた咳","question":"（3/4）42歳の男性．1か月前から階段で息が切れ，乾いた咳が続くという．体重が8kg減った．口の中に白い苔のようなものが付き，半年前に帯状疱疹にかかったという．胸部CTで両側びまん性のすりガラス影を認め，SpO2は88%であった．血清β-D-グルカンとLDHが上昇している．第一選択の治療はどれか．","options":[{"letter":"A","text":"抗結核薬の4剤併用療法"},{"letter":"B","text":"マクロライド系の抗菌薬"},{"letter":"C","text":"ST合剤の投与"},{"letter":"D","text":"グリコペプチド系の抗菌薬"},{"letter":"E","text":"カルバペネム系の抗菌薬"}],"answer":["C"],"multi":false,"explanation":"解説：ST合剤が第一選択で，低酸素血症が強い症例では副腎皮質ステロイドを併用すると予後が改善する．皮疹・高カリウム血症・骨髄抑制といった副作用に注意しながら投与する．\n- A：抗結核薬は肺結核の治療．\n- B：マクロライドはマイコプラズマやレジオネラに用いる．\n- C：この病原体に対する標準治療で正しい．\n- D：グリコペプチド系はグラム陽性菌用．\n- E：カルバペネム系も本病原体には無効．","images":[],"stem_images":[]},{"number":24,"section":"E-2-S06　42歳男性・労作時呼吸困難と乾いた咳","question":"（4/4）42歳の男性．1か月前から階段で息が切れ，乾いた咳が続くという．体重が8kg減った．口の中に白い苔のようなものが付き，半年前に帯状疱疹にかかったという．胸部CTで両側びまん性のすりガラス影を認め，SpO2は88%であった．血清β-D-グルカンとLDHが上昇している．背景として最も考えるべき疾患はどれか．","options":[{"letter":"A","text":"気管支喘息の重症化"},{"letter":"B","text":"HIV感染症の進行"},{"letter":"C","text":"慢性閉塞性肺疾患の増悪"},{"letter":"D","text":"特発性肺線維症の急性増悪"},{"letter":"E","text":"心不全の増悪"}],"answer":["B"],"multi":false,"explanation":"解説：口腔カンジダ症，若年での帯状疱疹，原因不明の体重減少はいずれも細胞性免疫低下の指標疾患である．この肺炎はAIDSの指標疾患のひとつでもあり，直ちに抗体検査を行う根拠になる．\n- A：気管支喘息では呼気性喘鳴が主体で体重減少は伴わない．\n- B：免疫低下の指標が揃っており正しい．\n- C：COPDは長期喫煙歴を背景に緩徐に進む．\n- D：特発性肺線維症では捻髪音とばち指を伴う．\n- E：心不全では起坐呼吸と湿性ラ音が前景に立つ．","images":[],"stem_images":[]},{"number":25,"section":"E-2-S07　29歳男性・体重減少と口腔の白苔","question":"（1/4）29歳の男性．半年で体重が10kg減り，下痢も続いているという．口の中に白い苔のようなものが付いている．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から花粉で鼻水が出ますか．"},{"letter":"B","text":"飲み込むと胸が痛みますか．"},{"letter":"C","text":"性交渉の状況を伺えますか．"},{"letter":"D","text":"注射針を共用したことはありますか．"},{"letter":"E","text":"免疫を抑える薬を使いますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．季節性鼻炎は今回の免疫低下を疑う症状の評価では優先度が低い．\n- A：季節性鼻炎は今回の免疫低下を疑う症状の評価では優先度が低い．この設問で選ぶ肢．\n- B：食道病変への広がりを確認．\n- C：HIVなどへの曝露を確認．\n- D：血液を介する感染機会を確認．\n- E：医原性免疫低下を検討．","images":[],"stem_images":[]},{"number":26,"section":"E-2-S07　29歳男性・体重減少と口腔の白苔","question":"（2/4）29歳の男性．半年で体重が10kg減り，下痢も続いているという．口の中に白い苔のようなものが付いている．複数のパートナーとコンドームを使わない性交渉があったという．最初に行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"C","text":"HIV抗原抗体のスクリーニング"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["C"],"multi":false,"explanation":"解説：抗原と抗体を同時に検出する検査でスクリーニングし，陽性なら確認検査で確定する．検査前には結果の意味と守秘について説明し，本人の同意を得たうえで実施する．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：診断への最短経路で正しい．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":27,"section":"E-2-S07　29歳男性・体重減少と口腔の白苔","question":"（3/4）29歳の男性．半年で体重が10kg減り，下痢も続いているという．口の中に白い苔のようなものが付いている．複数のパートナーとコンドームを使わない性交渉があったという．スクリーニングと確認検査でHIV感染が確定した．病期の判定に必要な検査はどれか．","options":[{"letter":"A","text":"血清フェリチンの測定"},{"letter":"B","text":"骨密度と骨代謝マーカーの測定"},{"letter":"C","text":"呼気中一酸化窒素濃度"},{"letter":"D","text":"血清アミラーゼの測定"},{"letter":"E","text":"CD4陽性リンパ球数の測定"}],"answer":["E"],"multi":false,"explanation":"解説：CD4陽性リンパ球数が免疫低下の程度を示し，200/μL未満では日和見感染の危険が高まる．ウイルス量と併せて治療効果の判定にも用い，指標疾患の有無でAIDSかどうかを判定する．\n- A：フェリチンは炎症と鉄代謝の指標．\n- B：骨密度は骨粗鬆症の評価．\n- C：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- D：アミラーゼは膵疾患の指標．\n- E：病期の判定に不可欠で正しい．","images":[],"stem_images":[]},{"number":28,"section":"E-2-S07　29歳男性・体重減少と口腔の白苔","question":"（4/4）29歳の男性．半年で体重が10kg減り，下痢も続いているという．口の中に白い苔のようなものが付いている．複数のパートナーとコンドームを使わない性交渉があったという．スクリーニングと確認検査でHIV感染が確定した．CD4陽性リンパ球数は120/μLであった．併せて必ず検索すべきなのはどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカー"},{"letter":"B","text":"呼気中一酸化窒素濃度"},{"letter":"C","text":"睡眠時無呼吸低呼吸指数"},{"letter":"D","text":"梅毒・B型肝炎・クラミジアなど"},{"letter":"E","text":"屈折検査と矯正視力の測定"}],"answer":["D"],"multi":false,"explanation":"解説：性行為で感染する疾患は重複することが多く，梅毒・B型肝炎・C型肝炎・淋菌・クラミジアを同時に検索する．結核や日和見感染の評価，パートナーへの検査の勧奨も併せて進める．\n- A：骨密度は骨粗鬆症の評価．\n- B：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- C：無呼吸低呼吸指数は睡眠時無呼吸症候群の評価．\n- D：重複感染の検索として必須で正しい．\n- E：屈折検査は視力の評価．","images":[],"stem_images":[]},{"number":29,"section":"E-2-S08　34歳女性・冬季の嘔吐と下痢","question":"（1/4）34歳の女性．昨夜から激しい嘔吐が始まり，今朝から水様の下痢も加わったという．12月である．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"尿量が減っていませんか．"},{"letter":"B","text":"数年前から胸やけがありますか．"},{"letter":"C","text":"発症前に何を食べましたか．"},{"letter":"D","text":"最近，抗菌薬を使いましたか．"},{"letter":"E","text":"周囲に同じ症状の人はいますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性胸やけは今回の急性胃腸炎症状の初期評価では優先度が低い．\n- A：脱水の程度を確認．\n- B：慢性胸やけは今回の急性胃腸炎症状の初期評価では優先度が低い．この設問で選ぶ肢．\n- C：共通食と食中毒を検討．\n- D：抗菌薬関連腸炎を検討．\n- E：集団発生を確認．","images":[],"stem_images":[]},{"number":30,"section":"E-2-S08　34歳女性・冬季の嘔吐と下痢","question":"（2/4）34歳の女性．昨夜から激しい嘔吐が始まり，今朝から水様の下痢も加わったという．12月である．同居の家族3人も同じ症状で，2日前に一緒に生カキを食べたという．最も適切な治療はどれか．","options":[{"letter":"A","text":"抗菌薬を直ちに全身投与する"},{"letter":"B","text":"抗ウイルス薬を直ちに投与する"},{"letter":"C","text":"腸管運動を止める止痢薬を用いる"},{"letter":"D","text":"経口補水液による水分と電解質の補給"},{"letter":"E","text":"副腎皮質ステロイドを全身投与する"}],"answer":["D"],"multi":false,"explanation":"解説：この感染症に特異的な治療薬はなく，脱水の補正が治療の中心になる．嘔吐が強く経口摂取できない場合や高度脱水では輸液を行い，小児と高齢者はとくに注意深く観察する．\n- A：ウイルス感染であり抗菌薬は無効．\n- B：この病原体に有効な抗ウイルス薬はない．\n- C：止痢薬は病原体の排出を妨げる．\n- D：治療の中心で正しい．\n- E：ステロイドはこの病態の治療ではない．","images":[],"stem_images":[]},{"number":31,"section":"E-2-S08　34歳女性・冬季の嘔吐と下痢","question":"（3/4）34歳の女性．昨夜から激しい嘔吐が始まり，今朝から水様の下痢も加わったという．12月である．同居の家族3人も同じ症状で，2日前に一緒に生カキを食べたという．補液で症状は改善に向かい，発熱もほとんどなかった．吐物や便の処理について正しいのはどれか．","options":[{"letter":"A","text":"アルコール消毒で十分に不活化できる"},{"letter":"B","text":"乾燥させてから掃除機で吸い取る"},{"letter":"C","text":"次亜塩素酸ナトリウムで消毒する"},{"letter":"D","text":"熱湯をかけずに水拭きすればよい"},{"letter":"E","text":"手袋を使わず素手で速やかに拭く"}],"answer":["C"],"multi":false,"explanation":"解説：この病原体はエンベロープをもたないためアルコールが効きにくい．次亜塩素酸ナトリウムによる消毒か85℃以上90秒以上の加熱で不活化する．手袋とマスクを着け，飛散させずに処理する．\n- A：アルコールでは十分に不活化できない．\n- B：乾燥させると飛散して空気中に広がる．\n- C：有効な消毒法で正しい．\n- D：水拭きだけでは不活化できない．\n- E：素手での処理は自身の感染と拡大を招く．","images":[],"stem_images":[]},{"number":32,"section":"E-2-S08　34歳女性・冬季の嘔吐と下痢","question":"（4/4）34歳の女性．昨夜から激しい嘔吐が始まり，今朝から水様の下痢も加わったという．12月である．同居の家族3人も同じ症状で，2日前に一緒に生カキを食べたという．補液で症状は改善に向かい，発熱もほとんどなかった．吐物は次亜塩素酸ナトリウムで処理した．この患者が調理従事者であった場合の対応はどれか．","options":[{"letter":"A","text":"症状が消えた翌日から調理に戻れる"},{"letter":"B","text":"解熱すれば直ちに調理に戻れる"},{"letter":"C","text":"手洗いをすれば症状中でも調理できる"},{"letter":"D","text":"家族が回復すれば調理に戻れる"},{"letter":"E","text":"症状消失後も一定期間は調理を控える"}],"answer":["E"],"multi":false,"explanation":"解説：症状が消えた後も1〜2週にわたって便中に病原体が排出され続けるため，調理従事者では食中毒の原因になりうる．職場の規定に従って復帰時期を決め，手洗いを徹底させる．\n- A：症状消失直後はまだ排出が続いている．\n- B：発熱の有無は排出の有無と関係しない．\n- C：症状がある間の調理は論外である．\n- D：家族の回復は本人の排出とは無関係．\n- E：排出期間を踏まえた対応で正しい．","images":[],"stem_images":[]},{"number":33,"section":"E-2-S09　78歳男性・抗菌薬投与後の水様下痢","question":"（1/4）78歳の男性．肺炎で2週間入院し抗菌薬を投与されていた．5日前から1日8回の水様下痢が続き，発熱もあるという．抗菌薬関連腸炎の評価に必要な薬剤歴を確認する質問はどれか．","options":[{"letter":"A","text":"生ものを食べましたか．"},{"letter":"B","text":"家族も下痢をしていますか．"},{"letter":"C","text":"海外旅行をしましたか．"},{"letter":"D","text":"便に血が混じりますか．"},{"letter":"E","text":"抗菌薬は何を何日使いましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：広域抗菌薬による腸内細菌叢の攪乱がこの腸炎の前提条件になる．薬剤の種類と投与期間，終了からの日数を確かめることで，原因薬剤の中止という最初の治療判断につながる．\n- A：食中毒への曝露に関する情報．\n- B：共通曝露や人からの感染に関する情報．\n- C：渡航関連感染に関する情報．\n- D：便の性状に関する情報．\n- E：原因の特定と中止の判断に直結し有用．","images":[],"stem_images":[]},{"number":34,"section":"E-2-S09　78歳男性・抗菌薬投与後の水様下痢","question":"（2/4）78歳の男性．肺炎で2週間入院し抗菌薬を投与されていた．5日前から1日8回の水様下痢が続き，発熱もあるという．広域のセフェム系を10日間使い，3日前に終了したという．行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"便中の毒素とGDH抗原の検査"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["B"],"multi":false,"explanation":"解説：グルタミン酸デヒドロゲナーゼ抗原で菌の存在を，毒素検査で病原性を確かめる．抗原陽性で毒素陰性の場合は核酸増幅法で判定する．内視鏡では特徴的な偽膜が観察される．\n- A：骨シンチグラフィは骨病変の検索．\n- B：診断に直結し正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：上部消化管内視鏡では大腸の病変は見えない．","images":[],"stem_images":[]},{"number":35,"section":"E-2-S09　78歳男性・抗菌薬投与後の水様下痢","question":"（3/4）78歳の男性．肺炎で2週間入院し抗菌薬を投与されていた．5日前から1日8回の水様下痢が続き，発熱もあるという．広域のセフェム系を10日間使い，3日前に終了したという．便中のGDH抗原と毒素がともに陽性であった．最も適切な治療はどれか．","options":[{"letter":"A","text":"広域抗菌薬をさらに追加する"},{"letter":"B","text":"止痢薬で腸管運動を止める"},{"letter":"C","text":"バンコマイシンの経口投与"},{"letter":"D","text":"抗ウイルス薬の全身投与"},{"letter":"E","text":"副腎皮質ステロイドの全身投与"}],"answer":["C"],"multi":false,"explanation":"解説：バンコマイシンは経口投与すると腸管からほとんど吸収されず腸管内で高濃度を保つため，この腸炎に有効である．フィダキソマイシンも選択肢で，再発例では便微生物叢移植も検討される．\n- A：広域抗菌薬の追加は腸内細菌叢をさらに乱す．\n- B：止痢薬は毒素を腸内に留め中毒性巨大結腸症を招く．\n- C：標準治療で正しい．\n- D：細菌感染であり抗ウイルス薬は無効．\n- E：ステロイドはこの病態の治療ではない．","images":[],"stem_images":[]},{"number":36,"section":"E-2-S09　78歳男性・抗菌薬投与後の水様下痢","question":"（4/4）78歳の男性．肺炎で2週間入院し抗菌薬を投与されていた．5日前から1日8回の水様下痢が続き，発熱もあるという．広域のセフェム系を10日間使い，3日前に終了したという．便中のGDH抗原と毒素がともに陽性で，内視鏡では大腸に黄白色の偽膜を認めた．病室での感染対策として正しいのはどれか．","options":[{"letter":"A","text":"速乾性アルコール製剤のみで十分である"},{"letter":"B","text":"空気感染への対策を優先して行う"},{"letter":"C","text":"標準予防策だけで対応できる"},{"letter":"D","text":"血液媒介感染への注意を優先する"},{"letter":"E","text":"石けんと流水での手洗いを徹底する"}],"answer":["E"],"multi":false,"explanation":"解説：この菌は芽胞を形成し，アルコールでは不活化されない．石けんと流水で物理的に洗い流すことが要る．接触感染予防策として個室管理，手袋とガウン，環境は次亜塩素酸ナトリウムで清拭する．\n- A：芽胞にアルコールは無効である．\n- B：空気感染はしない．\n- C：接触感染予防策の追加が必要である．\n- D：血液媒介感染はB型肝炎やHIV感染症で問題になる．\n- E：芽胞への対応として正しい．","images":[],"stem_images":[]},{"number":37,"section":"E-2-S10　6歳女児・血性下痢と乏尿","question":"（1/4）6歳の女児．4日前から強い腹痛と下痢があり，2日前から便に血が混じるという．発熱は軽い．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"乳歯は何本抜けましたか．"},{"letter":"B","text":"周囲に同じ症状の人はいますか．"},{"letter":"C","text":"発症前に何を食べましたか．"},{"letter":"D","text":"尿の量が減っていませんか．"},{"letter":"E","text":"顔色が悪くなりましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．歯の生え替わりは血性下痢の初期評価では優先度が低い．\n- A：歯の生え替わりは血性下痢の初期評価では優先度が低い．この設問で選ぶ肢．\n- B：集団発生を確認．\n- C：腸管感染への曝露を確認．\n- D：腎障害の合併を評価．\n- E：溶血性貧血などの合併を検討．","images":[],"stem_images":[]},{"number":38,"section":"E-2-S10　6歳女児・血性下痢と乏尿","question":"（2/4）6歳の女児．4日前から強い腹痛と下痢があり，2日前から便に血が混じるという．発熱は軽い．1週間前に焼肉店で加熱の不十分な肉を食べたという．注意すべき薬剤はどれか．","options":[{"letter":"A","text":"経口補水液による水分の補給"},{"letter":"B","text":"腸管運動を止める止痢薬の投与"},{"letter":"C","text":"アセトアミノフェンによる解熱"},{"letter":"D","text":"電解質を含む輸液の投与"},{"letter":"E","text":"整腸薬による腸内環境の調整"}],"answer":["B"],"multi":false,"explanation":"解説：止痢薬は毒素を含む腸内容の排泄を妨げ，毒素の吸収を増やして合併症の危険を高める．抗菌薬も菌体崩壊による毒素放出を増やす懸念があり，使用は慎重に判断する．\n- A：脱水の補正は治療の中心で問題ない．\n- B：合併症の危険を高め避けるべきで正しい．\n- C：解熱にアセトアミノフェンを用いるのは問題ない．\n- D：輸液も脱水と電解質異常の補正に必要．\n- E：整腸薬は有害性が乏しい．","images":[],"stem_images":[]},{"number":39,"section":"E-2-S10　6歳女児・血性下痢と乏尿","question":"（3/4）6歳の女児．4日前から強い腹痛と下痢があり，2日前から便に血が混じるという．発熱は軽い．1週間前に焼肉店で加熱の不十分な肉を食べたという．本日から尿量が減り，顔色も悪いという．Hb 7.8g/dL，血小板3.2万/μL，血清クレアチニン1.8mg/dLであった．末梢血で予想される所見はどれか．","options":[{"letter":"A","text":"好中球の過分葉の出現"},{"letter":"B","text":"赤血球連銭形成の出現"},{"letter":"C","text":"破砕赤血球の出現"},{"letter":"D","text":"標的赤血球の増加"},{"letter":"E","text":"環状鉄芽球の増加"}],"answer":["C"],"multi":false,"explanation":"解説：毒素が血管内皮を傷害して微小血栓が生じ，そこを通る赤血球が機械的に壊される．溶血性貧血・血小板減少・急性腎障害の三徴が揃うのが溶血性尿毒症症候群である．\n- A：好中球の過分葉は巨赤芽球性貧血．\n- B：赤血球連銭形成はM蛋白血症．\n- C：微小血管障害性溶血を示し正しい．\n- D：標的赤血球はサラセミアや肝疾患．\n- E：環状鉄芽球は骨髄異形成症候群．","images":[],"stem_images":[]},{"number":40,"section":"E-2-S10　6歳女児・血性下痢と乏尿","question":"（4/4）6歳の女児．4日前から強い腹痛と下痢があり，2日前から便に血が混じるという．発熱は軽い．1週間前に焼肉店で加熱の不十分な肉を食べたという．本日から尿量が減り，顔色も悪いという．Hb 7.8g/dL，血小板3.2万/μL，血清クレアチニン1.8mg/dLであった．末梢血に破砕赤血球を認めた．この合併症の原因はどれか．","options":[{"letter":"A","text":"菌体が血流に入って増殖したこと"},{"letter":"B","text":"自己抗体が赤血球を破壊したこと"},{"letter":"C","text":"補体が過剰に活性化したこと"},{"letter":"D","text":"志賀毒素が血管内皮を傷害したこと"},{"letter":"E","text":"骨髄で血球の産生が止まったこと"}],"answer":["D"],"multi":false,"explanation":"解説：産生された志賀毒素が腸管から吸収され，腎糸球体をはじめとする血管内皮のグロボトリアオシルセラミド受容体に結合して細胞を傷害する．小児での発症が多く，予後を左右する．\n- A：菌体そのものの血流侵入は主な機序ではない．\n- B：自己抗体による破壊は自己免疫性溶血性貧血．\n- C：補体の過剰活性化は非典型溶血性尿毒症症候群の機序．\n- D：この合併症の機序として正しい．\n- E：骨髄での産生停止は再生不良性貧血．","images":[],"stem_images":[]},{"number":41,"section":"E-2-S11　28歳男性・下痢の3週後に生じた脱力","question":"（1/4）28歳の男性．3日前から両足に力が入らず，本日は階段を昇れないという．しびれも伴う．筋力低下に先行する消化管感染を確認する質問はどれか．","options":[{"letter":"A","text":"咳や鼻水が先にありましたか．"},{"letter":"B","text":"数週間以内に下痢をしましたか．"},{"letter":"C","text":"最近，予防接種を受けましたか．"},{"letter":"D","text":"家族に神経の病気はありますか．"},{"letter":"E","text":"新しい薬を飲みましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：先行感染から1〜3週後に発症するという時間関係がこの疾患の骨格である．とくに加熱不十分な鶏肉による腸炎が先行した型は軸索障害が主体で重症化しやすく，予後の見通しにも関わる．\n- A：先行する呼吸器感染に関する情報．\n- B：発症機序に直結し有用．\n- C：先行する接種歴に関する情報．\n- D：遺伝的背景に関する情報．\n- E：薬剤への曝露に関する情報．","images":[],"stem_images":[]},{"number":42,"section":"E-2-S11　28歳男性・下痢の3週後に生じた脱力","question":"（2/4）28歳の男性．3日前から両足に力が入らず，本日は階段を昇れないという．しびれも伴う．3週間前に鶏肉を食べた後，発熱と血性下痢が5日続いたという．認められる所見はどれか．","options":[{"letter":"A","text":"両側のBabinski徴候の陽性"},{"letter":"B","text":"一側だけの痙性の片麻痺"},{"letter":"C","text":"歯車様の筋強剛の出現"},{"letter":"D","text":"腱反射の左右対称な消失"},{"letter":"E","text":"具体的な人物の幻視の出現"}],"answer":["D"],"multi":false,"explanation":"解説：末梢神経の髄鞘や軸索が免疫学的に障害され，反射弓が絶たれるため腱反射が早期から対称性に失われる．麻痺は弛緩性で下肢から上行し，錐体路徴候は陰性となる．\n- A：Babinski徴候は錐体路障害を示し，末梢神経障害では陰性．\n- B：一側の痙性片麻痺は脳血管障害．\n- C：歯車様筋強剛はParkinson病．\n- D：末梢神経障害を反映し正しい．\n- E：具体的な幻視はLewy小体型認知症．","images":[],"stem_images":[]},{"number":43,"section":"E-2-S11　28歳男性・下痢の3週後に生じた脱力","question":"（3/4）28歳の男性．3日前から両足に力が入らず，本日は階段を昇れないという．しびれも伴う．3週間前に鶏肉を食べた後，発熱と血性下痢が5日続いたという．四肢の腱反射は対称性に消失し，Babinski徴候は陰性である．髄液検査で予想される所見はどれか．","options":[{"letter":"A","text":"多核球優位の著明な細胞増多"},{"letter":"B","text":"糖の著明な低下と蛋白の著増"},{"letter":"C","text":"墨汁染色での莢膜酵母の検出"},{"letter":"D","text":"キサントクロミーの出現"},{"letter":"E","text":"細胞数は正常で蛋白のみ高値"}],"answer":["E"],"multi":false,"explanation":"解説：神経根の炎症により蛋白が漏出する一方で細胞数はほとんど増えない．この蛋白細胞解離は発症から1週ほどで明らかになるため，早期に陰性でも診断を否定する根拠にはならない．\n- A：多核球優位の細胞増多は細菌性髄膜炎．\n- B：糖低下と蛋白著増は結核性や真菌性の髄膜炎．\n- C：墨汁染色での莢膜酵母はクリプトコックス髄膜炎．\n- D：キサントクロミーはくも膜下出血の亜急性期．\n- E：この疾患に特徴的で正しい．","images":[],"stem_images":[]},{"number":44,"section":"E-2-S11　28歳男性・下痢の3週後に生じた脱力","question":"（4/4）28歳の男性．3日前から両足に力が入らず，本日は階段を昇れないという．しびれも伴う．3週間前に鶏肉を食べた後，発熱と血性下痢が5日続いたという．四肢の腱反射は対称性に消失し，Babinski徴候は陰性である．髄液は細胞数4/μL，蛋白112mg/dLであった．この自己免疫反応が起こる機序はどれか．","options":[{"letter":"A","text":"菌体が神経に直接侵入したこと"},{"letter":"B","text":"毒素が神経を直接壊したこと"},{"letter":"C","text":"菌体と神経の糖鎖が似ていること"},{"letter":"D","text":"神経が虚血に陥ったこと"},{"letter":"E","text":"髄鞘が加齢で薄くなったこと"}],"answer":["C"],"multi":false,"explanation":"解説：菌体表面のリポオリゴ糖が末梢神経のガングリオシドと似た糖鎖構造をもつため，菌に対して作られた抗体が自己の神経を攻撃する．この分子相同性が発症の中心的な機序である．\n- A：菌が神経へ直接侵入するわけではない．\n- B：毒素による直接傷害でもない．\n- C：分子相同性という機序で正しい．\n- D：虚血性の神経障害は血管炎などで起こる．\n- E：加齢による髄鞘の変化では急性の麻痺は説明できない．","images":[],"stem_images":[]},{"number":45,"section":"E-2-S12　70歳男性・術後の原因不明の発熱","question":"（1/4）70歳の男性．消化管手術後の栄養管理のため中心静脈カテーテルを10日間留置している．昨日から39℃の発熱があるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から膝が朝にこわばりますか．"},{"letter":"B","text":"点滴中に悪寒が出ますか．"},{"letter":"C","text":"挿入部に痛みや赤みはありますか．"},{"letter":"D","text":"咳や排尿痛はありますか．"},{"letter":"E","text":"腹痛や創部の痛みは増えましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性関節症状は今回の術後高熱の感染源検索では優先度が低い．\n- A：慢性関節症状は今回の術後高熱の感染源検索では優先度が低い．この設問で選ぶ肢．\n- B：カテーテル関連血流感染を検討．\n- C：局所感染の徴候を確認．\n- D：別の感染源を検索．\n- E：術後腹腔内・創感染を検討．","images":[],"stem_images":[]},{"number":46,"section":"E-2-S12　70歳男性・術後の原因不明の発熱","question":"（2/4）70歳の男性．消化管手術後の栄養管理のため中心静脈カテーテルを10日間留置している．昨日から39℃の発熱があるという．咳も排尿時痛もなく，創部にも異常はないという．行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"カテーテルと末梢から血液培養"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：カテーテル内腔と末梢静脈から同時に血液を採り，2セット以上を培養に出す．カテーテル側から先に，かつ多量の菌が検出されればカテーテルが感染源であることを裏づけられる．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：感染源の同定に直結し正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":47,"section":"E-2-S12　70歳男性・術後の原因不明の発熱","question":"（3/4）70歳の男性．消化管手術後の栄養管理のため中心静脈カテーテルを10日間留置している．昨日から39℃の発熱があるという．咳も排尿時痛もなく，創部にも異常はないという．呼吸数24/分，収縮期血圧96mmHg，意識はやや混濁している．この所見が示す状態はどれか．","options":[{"letter":"A","text":"単なる術後の吸収熱である"},{"letter":"B","text":"心不全が増悪したこと"},{"letter":"C","text":"敗血症を疑うべき状態である"},{"letter":"D","text":"脱水だけで説明できる状態"},{"letter":"E","text":"薬剤性の発熱である"}],"answer":["C"],"multi":false,"explanation":"解説：呼吸数22回以上，収縮期血圧100mmHg以下，意識変容のうち2項目以上を満たすと重症化の危険が高い．感染を疑う患者でこれらが揃えば敗血症として扱い，直ちに治療を開始する．\n- A：吸収熱では循環と意識の変化は説明できない．\n- B：心不全ではうっ血所見が前景に立つ．\n- C：臓器障害を伴う感染として正しい．\n- D：脱水のみでは意識変容までは通常説明しにくい．\n- E：薬剤熱では全身状態が比較的保たれる．","images":[],"stem_images":[]},{"number":48,"section":"E-2-S12　70歳男性・術後の原因不明の発熱","question":"（4/4）70歳の男性．消化管手術後の栄養管理のため中心静脈カテーテルを10日間留置している．昨日から39℃の発熱があるという．咳も排尿時痛もなく，創部にも異常はないという．呼吸数24/分，収縮期血圧96mmHg，意識はやや混濁している．血液培養からカンジダが検出された．必ず行うべきなのはどれか．","options":[{"letter":"A","text":"骨密度の測定を行う"},{"letter":"B","text":"呼吸機能検査を行う"},{"letter":"C","text":"睡眠ポリグラフィを行う"},{"letter":"D","text":"屈折検査と矯正視力を測る"},{"letter":"E","text":"眼科で眼内炎の有無を確認する"}],"answer":["E"],"multi":false,"explanation":"解説：カンジダ血症では血行性に眼内へ播種して眼内炎を起こし，放置すれば失明に至る．自覚症状が乏しいことも多いため，全例で眼底検査を行い，同時にカテーテルを抜去する．\n- A：骨密度は骨粗鬆症の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：屈折検査は視力の評価で，眼内炎の検出にはならない．\n- E：失明を防ぐために必須で正しい．","images":[],"stem_images":[]},{"number":49,"section":"E-2-S13　8歳男児・両側耳下腺の腫脹","question":"（1/4）8歳の男児．2日前から両方の耳の下が腫れて痛み，38℃の発熱があるという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"頭痛や嘔吐はありますか．"},{"letter":"B","text":"聞こえに変化はありますか．"},{"letter":"C","text":"乳歯は何本生え替わりましたか．"},{"letter":"D","text":"同じ症状の子と接しましたか．"},{"letter":"E","text":"おたふくかぜの接種を受けましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．歯の交換数は急な両側耳下部腫脹の評価では優先度が低い．\n- A：髄膜炎の合併を検討．\n- B：聴覚障害の合併を確認．\n- C：歯の交換数は急な両側耳下部腫脹の評価では優先度が低い．この設問で選ぶ肢．\n- D：感染への曝露を確認．\n- E：予防接種歴を確認．","images":[],"stem_images":[]},{"number":50,"section":"E-2-S13　8歳男児・両側耳下腺の腫脹","question":"（2/4）8歳の男児．2日前から両方の耳の下が腫れて痛み，38℃の発熱があるという．予防接種は受けていないという．2週間前に同級生が同じ症状で休んでいたという．注意すべき合併症はどれか．","options":[{"letter":"A","text":"心臓の弁に疣腫ができること"},{"letter":"B","text":"無菌性髄膜炎と片側性の難聴"},{"letter":"C","text":"腎糸球体に免疫複合体が沈着"},{"letter":"D","text":"冠動脈に瘤が形成されること"},{"letter":"E","text":"肝に多発性の膿瘍ができること"}],"answer":["B"],"multi":false,"explanation":"解説：無菌性髄膜炎は数%に起こり多くは後遺症を残さないが，難聴は片側性で高度かつ不可逆なことが多い．思春期以降では精巣炎や卵巣炎，膵炎も起こりうる．\n- A：弁の疣腫は感染性心内膜炎．\n- B：この疾患の代表的な合併症で正しい．\n- C：免疫複合体の沈着は溶連菌感染後急性糸球体腎炎．\n- D：冠動脈瘤は川崎病．\n- E：肝膿瘍は細菌感染による．","images":[],"stem_images":[]},{"number":51,"section":"E-2-S13　8歳男児・両側耳下腺の腫脹","question":"（3/4）8歳の男児．2日前から両方の耳の下が腫れて痛み，38℃の発熱があるという．予防接種は受けていないという．2週間前に同級生が同じ症状で休んでいたという．両側の耳下腺が有痛性に腫脹し，耳垂が持ち上がっている．登校について正しいのはどれか．","options":[{"letter":"A","text":"解熱すれば翌日から登校できる"},{"letter":"B","text":"発症から3日経てば登校できる"},{"letter":"C","text":"腫脹が出た日から登校してよい"},{"letter":"D","text":"腫脹発現後5日かつ全身状態良好まで休む"},{"letter":"E","text":"家族に発症者がいなければ登校できる"}],"answer":["D"],"multi":false,"explanation":"解説：学校保健安全法で，耳下腺・顎下腺・舌下腺の腫脹が現れてから5日を経過し，かつ全身状態が良好になるまで出席停止と定められている．解熱の有無だけでは判断しない．\n- A：解熱しても腫脹から5日を経ていなければ感染力が残る．\n- B：日数の基準が異なる．\n- C：腫脹の時期が最も感染力の強い時期にあたる．\n- D：法令上の基準として正しい．\n- E：家族の発症状況は本人の感染性と無関係．","images":[],"stem_images":[]},{"number":52,"section":"E-2-S13　8歳男児・両側耳下腺の腫脹","question":"（4/4）8歳の男児．2日前から両方の耳の下が腫れて痛み，38℃の発熱があるという．予防接種は受けていないという．2週間前に同級生が同じ症状で休んでいたという．両側の耳下腺が有痛性に腫脹し，耳垂が持ち上がっている．腫脹発現後5日を経て全身状態も良好となり登校を許可した．治癒後に「右耳の聞こえが悪い」と訴えた場合の特徴はどれか．","options":[{"letter":"A","text":"両側性で治療により回復する"},{"letter":"B","text":"伝音難聴で鼓膜切開により改善する"},{"letter":"C","text":"一側性の高度感音難聴で不可逆"},{"letter":"D","text":"低音域だけが変動して悪化する"},{"letter":"E","text":"4000Hz付近が谷状に低下する"}],"answer":["C"],"multi":false,"explanation":"解説：内耳が直接障害されるため，多くは一側性で高度の感音難聴となり回復しない．小児期の片側難聴は気づかれにくいので，罹患後は聴力検査で確かめることが勧められる．\n- A：両側性ではなく，回復もしにくい．\n- B：伝音難聴ではなく感音難聴である．\n- C：この合併症の特徴として正しい．\n- D：低音域の変動する難聴はMénière病．\n- E：4000Hz付近の谷は騒音性難聴．","images":[],"stem_images":[]},{"number":53,"section":"E-2-S14　52歳男性・急速に広がる下腿の発赤と激痛","question":"（1/4）52歳の男性．昨日から右の下腿が赤く腫れて激しく痛むという．糖尿病で通院中である．軟部組織病変の進行速度を評価する質問はどれか．","options":[{"letter":"A","text":"直前に皮膚をけがしましたか．"},{"letter":"B","text":"赤みは何時間で広がりましたか．"},{"letter":"C","text":"血糖値はどのくらいですか．"},{"letter":"D","text":"足にしびれはありますか．"},{"letter":"E","text":"以前も同じ感染がありましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：時間単位で範囲が広がるなら筋膜に沿って壊死が進む病態を疑う．蜂窩織炎は日単位で緩やかに広がるため，進行の速さが緊急手術の要否を分ける最初の手がかりになる．\n- A：感染の侵入門戸に関する情報．\n- B：緊急度の判定に直結し有用．\n- C：基礎疾患の管理に関する情報．\n- D：感覚障害に関する情報．\n- E：再発歴に関する情報．","images":[],"stem_images":[]},{"number":54,"section":"E-2-S14　52歳男性・急速に広がる下腿の発赤と激痛","question":"（2/4）52歳の男性．昨日から右の下腿が赤く腫れて激しく痛むという．糖尿病で通院中である．赤みは半日で膝まで広がり，解熱鎮痛薬では痛みが和らがないという．最も危険を示す所見はどれか．","options":[{"letter":"A","text":"皮膚所見に不釣り合いな激痛"},{"letter":"B","text":"皮膚の軽度の発赤のみ"},{"letter":"C","text":"局所の軽い熱感のみ"},{"letter":"D","text":"圧痛が境界明瞭であること"},{"letter":"E","text":"周囲のリンパ節の軽度腫脹"}],"answer":["A"],"multi":false,"explanation":"解説：見た目の発赤の範囲を越えて強い痛みがあるのは，深部の筋膜で壊死が進んでいることを示す．皮下の握雪感，血性水疱，皮膚の知覚低下，全身状態の急激な悪化も危険な徴候になる．\n- A：深部の壊死を示唆し最も危険で正しい．\n- B：軽度の発赤のみなら表在性の炎症にとどまる．\n- C：軽い熱感のみも同様である．\n- D：境界明瞭な圧痛は限局した炎症を示す．\n- E：軽度のリンパ節腫脹は局所感染でも起こる．","images":[],"stem_images":[]},{"number":55,"section":"E-2-S14　52歳男性・急速に広がる下腿の発赤と激痛","question":"（3/4）52歳の男性．昨日から右の下腿が赤く腫れて激しく痛むという．糖尿病で通院中である．赤みは半日で膝まで広がったという．発赤の範囲を越えて激痛があり，皮下に握雪感を触れる．体温39.2℃，血圧84/50mmHg．最も適切な対応はどれか．","options":[{"letter":"A","text":"抗菌薬の内服で外来経過観察とする"},{"letter":"B","text":"冷罨法で腫れが引くのを待つ"},{"letter":"C","text":"緊急手術によるデブリードマン"},{"letter":"D","text":"副腎皮質ステロイドのみを投与"},{"letter":"E","text":"翌日の再診を指示して帰宅させる"}],"answer":["C"],"multi":false,"explanation":"解説：抗菌薬だけでは血流の途絶した壊死組織に届かない．試験切開で診断を確かめ，健常組織に達するまで広範に切除する．時間単位で進行するため，手術の遅れが直接死亡率を上げる．\n- A：外来での内服治療では対応できない．\n- B：冷罨法は時間の浪費になる．\n- C：救命に直結する治療で正しい．\n- D：ステロイド単独では感染が悪化する．\n- E：帰宅させれば数時間で致死的になりうる．","images":[],"stem_images":[]},{"number":56,"section":"E-2-S14　52歳男性・急速に広がる下腿の発赤と激痛","question":"（4/4）52歳の男性．昨日から右の下腿が赤く腫れて激しく痛むという．糖尿病で通院中である．赤みは半日で膝まで広がったという．発赤の範囲を越えて激痛があり，皮下に握雪感を触れる．体温39.2℃，血圧84/50mmHg．術中の検体からA群溶血性レンサ球菌が検出された．全身に紅斑が広がり多臓器障害をきたす病態はどれか．","options":[{"letter":"A","text":"アナフィラキシーショック"},{"letter":"B","text":"トキシックショック症候群"},{"letter":"C","text":"心原性ショックの併発"},{"letter":"D","text":"出血性ショックの併発"},{"letter":"E","text":"神経原性ショックの併発"}],"answer":["B"],"multi":false,"explanation":"解説：菌が産生する外毒素がスーパー抗原として働き，大量のサイトカインを放出させる．発熱・びまん性の紅斑・低血圧・多臓器障害が揃い，回復期には手掌と足底の落屑をみる．\n- A：アナフィラキシーは抗原曝露直後に起こり，膨疹と気道狭窄を伴う．\n- B：スーパー抗原による病態で正しい．\n- C：心原性ショックでは心機能の低下が前景に立つ．\n- D：出血性ショックでは明らかな出血源がある．\n- E：神経原性ショックは徐脈と温かい四肢を伴う．","images":[],"stem_images":[]},{"number":57,"section":"E-2-S15　45歳女性・急な高熱と全身の倦怠感","question":"（1/4）45歳の女性．昨日の夕方から突然39℃の発熱があり，頭痛と全身の筋肉痛，強い倦怠感が続くという．1月である．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"咳や咽頭痛はありますか．"},{"letter":"B","text":"周囲に同じ症状の人はいますか．"},{"letter":"C","text":"息苦しさはありますか．"},{"letter":"D","text":"以前から排便で肛門が痛みますか．"},{"letter":"E","text":"心肺の持病や妊娠はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性肛門痛は今回の急な高熱・筋肉痛の初期評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：呼吸器感染の症状を確認．\n- B：流行と曝露を確認．\n- C：下気道病変と重症度を評価．\n- D：慢性肛門痛は今回の急な高熱・筋肉痛の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：重症化の背景を確認．","images":[],"stem_images":[]},{"number":58,"section":"E-2-S15　45歳女性・急な高熱と全身の倦怠感","question":"（2/4）45歳の女性．昨日の夕方から突然39℃の発熱があり，頭痛と全身の筋肉痛，強い倦怠感が続くという．1月である．職場で同じ症状の人が数人いるという．鑑別に役立つ症状はどれか．","options":[{"letter":"A","text":"咳が出ていること"},{"letter":"B","text":"鼻水が出ていること"},{"letter":"C","text":"においや味が分からないこと"},{"letter":"D","text":"のどが痛むこと"},{"letter":"E","text":"頭が痛むこと"}],"answer":["C"],"multi":false,"explanation":"解説：嗅覚と味覚の障害はCOVID-19でより特徴的にみられる．ただし変異株により頻度は変わり，この症状の有無だけでは確定も除外もできないため，最終的には検査で判定する．\n- A：咳はどちらでもみられる．\n- B：鼻汁も両者に共通する．\n- C：鑑別の一助となり正しい．\n- D：咽頭痛も両者に共通する．\n- E：頭痛も両者に共通する．","images":[],"stem_images":[]},{"number":59,"section":"E-2-S15　45歳女性・急な高熱と全身の倦怠感","question":"（3/4）45歳の女性．昨日の夕方から突然39℃の発熱があり，頭痛と全身の筋肉痛，強い倦怠感が続くという．1月である．職場で同じ症状の人が数人いるという．においと味は分かるという．体温39.2℃，SpO2 97%で，呼吸音に異常はない．確定診断のために行うべきなのはどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"抗原検査または核酸増幅検査"}],"answer":["E"],"multi":false,"explanation":"解説：鼻咽頭ぬぐい液などの検体で抗原または核酸を検出する．抗原検査は迅速だが発症早期には偽陰性があり，核酸増幅検査は感度が高い．流行状況と症状を踏まえて解釈する．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：内視鏡は消化管疾患の評価．\n- E：病原体の同定に直結し正しい．","images":[],"stem_images":[]},{"number":60,"section":"E-2-S15　45歳女性・急な高熱と全身の倦怠感","question":"（4/4）45歳の女性．昨日の夕方から突然39℃の発熱があり，頭痛と全身の筋肉痛，強い倦怠感が続くという．1月である．職場で同じ症状の人が数人いるという．においと味は分かるという．抗原検査でインフルエンザが陽性であった．発症から20時間が経過している．最も適切な対応はどれか．","options":[{"letter":"A","text":"抗菌薬の内服を直ちに開始する"},{"letter":"B","text":"副腎皮質ステロイドを全身投与する"},{"letter":"C","text":"抗ウイルス薬の投与を開始する"},{"letter":"D","text":"経過観察のみで再診を指示する"},{"letter":"E","text":"気管支拡張薬の吸入を開始する"}],"answer":["C"],"multi":false,"explanation":"解説：発症48時間以内であれば抗ウイルス薬で有熱期間を短縮でき，重症化の危険が高い人では合併症も減らせる．解熱にはアセトアミノフェンを選び，小児と未成年の異常行動にも注意を促す．\n- A：抗菌薬はウイルスに無効で，二次性細菌性肺炎を合併したときに用いる．\n- B：ステロイドの定型的な投与は推奨されない．\n- C：治療の窓の内にあり正しい．\n- D：治療可能な時間内であり経過観察は機会損失になる．\n- E：気管支拡張薬は気道狭窄の治療．","images":[],"stem_images":[]}],"seed":null},{"id":"E-3_腫瘍","name":"E-3_腫瘍.md","label":"E-3 腫瘍","count":64,"sourceHash":"adb2a87f145f","questions":[{"number":1,"section":"E-3-S01　58歳男性・朝に強い頭痛と嘔吐","question":"（1/4）58歳の男性．1か月前から頭痛が続き，とくに起床時に強いという．最近は吐き気も伴う．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"日ごとに頭痛が強くなっていますか．"},{"letter":"B","text":"子どもの頃に乗り物酔いをしましたか．"},{"letter":"C","text":"手足の動かしにくさはありますか．"},{"letter":"D","text":"けいれんが起きたことはありますか．"},{"letter":"E","text":"癌の治療を受けたことがありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．小児期の乗り物酔いは新たな進行性頭痛の評価では優先度が低い．\n- A：進行性の頭蓋内病変を検討．\n- B：小児期の乗り物酔いは新たな進行性頭痛の評価では優先度が低い．この設問で選ぶ肢．\n- C：局所神経症状を確認．\n- D：大脳皮質への影響を確認．\n- E：転移性病変の背景を確認．","images":[],"stem_images":[]},{"number":2,"section":"E-3-S01　58歳男性・朝に強い頭痛と嘔吐","question":"（2/4）58歳の男性．1か月前から頭痛が続き，とくに起床時に強いという．最近は吐き気も伴う．頭痛は日を追うごとに強くなっているという．認められる所見はどれか．","options":[{"letter":"A","text":"頸部前屈での強い抵抗の出現"},{"letter":"B","text":"手指に安静時の粗大な振戦"},{"letter":"C","text":"眼底のうっ血乳頭の出現"},{"letter":"D","text":"両側耳下腺の有痛性の腫脹"},{"letter":"E","text":"前頸部の甲状腺のびまん性腫大"}],"answer":["C"],"multi":false,"explanation":"解説：頭蓋内圧が高い状態が続くと視神経乳頭が腫脹して境界が不明瞭になり，静脈の怒張と出血を伴う．眼底鏡で確認でき，頭蓋内圧亢進を非侵襲的に示す所見として重要である．\n- A：頸部前屈での抵抗は髄膜刺激徴候．\n- B：安静時の粗大な振戦はParkinson病．\n- C：頭蓋内圧亢進を示し正しい．\n- D：耳下腺の有痛性腫脹は流行性耳下腺炎．\n- E：甲状腺のびまん性腫大はBasedow病．","images":[],"stem_images":[]},{"number":3,"section":"E-3-S01　58歳男性・朝に強い頭痛と嘔吐","question":"（3/4）58歳の男性．1か月前から頭痛が続き，とくに起床時に強いという．最近は吐き気も伴う．頭痛は日を追うごとに強くなっているという．眼底にうっ血乳頭を認め，左手の細かい動作がぎこちなくなってきたという．最も適切な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"終夜睡眠ポリグラフィの施行"},{"letter":"C","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"D","text":"造影MRIによる頭部の精査"},{"letter":"E","text":"上部消化管内視鏡と生検の施行"}],"answer":["D"],"multi":false,"explanation":"解説：腫瘍の局在・数・造影のされ方・周囲の浮腫を評価する．病変が多発していれば転移を強く疑い，胸部を中心に原発巣を探すという次の方針が定まる．\n- A：骨シンチグラフィは骨病変の検索．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：呼吸機能検査は換気障害の評価．\n- D：病変の評価に直結し正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":4,"section":"E-3-S01　58歳男性・朝に強い頭痛と嘔吐","question":"（4/4）58歳の男性．1か月前から頭痛が続き，とくに起床時に強いという．最近は吐き気も伴う．頭痛は日を追うごとに強くなっているという．眼底にうっ血乳頭を認め，左手の細かい動作がぎこちなくなってきたという．造影MRIで右前頭葉に3cmのリング状に濃染する病変と，左頭頂葉にも1cmの病変を認めた．次に行うべきなのはどれか．","options":[{"letter":"A","text":"直ちに腰椎穿刺で髄液を採取する"},{"letter":"B","text":"胸部CTなどで原発巣を検索する"},{"letter":"C","text":"抗菌薬の全身にわたる長期投与"},{"letter":"D","text":"抗てんかん薬のみで経過をみる"},{"letter":"E","text":"直ちに副腎皮質ステロイドを中止"}],"answer":["B"],"multi":false,"explanation":"解説：多発する造影病変はまず転移を考える．肺・乳腺・大腸・腎・悪性黒色腫が多い原発巣なので，胸腹部CTと身体診察で系統的に探す．原発巣の組織型が治療方針を決める．\n- A：頭蓋内圧が高い状態での腰椎穿刺は脳ヘルニアを招く．\n- B：診断の手順として正しい．\n- C：抗菌薬は感染症の治療で，脳膿瘍を疑う所見は乏しい．\n- D：抗てんかん薬は発作の対応で原因検索の代わりにならない．\n- E：ステロイドは浮腫の軽減に有用で，中止する理由がない．","images":[],"stem_images":[]},{"number":5,"section":"E-3-S02　72歳男性・顔の治らない皮疹","question":"（1/4）72歳の男性．半年前から右の頬に黒いできものがあり，少しずつ大きくなっているという．長年の農作業で日焼けしてきた．皮膚病変の形態が時間とともに変化しているかを確認する質問はどれか．","options":[{"letter":"A","text":"出血やかさぶたがありますか．"},{"letter":"B","text":"大きさや色は変化していますか．"},{"letter":"C","text":"同じ場所をこすっていますか．"},{"letter":"D","text":"痛みやかゆみはありますか．"},{"letter":"E","text":"家族に皮膚癌の人はいますか．"}],"answer":["B"],"multi":false,"explanation":"解説：短期間での増大と色調の変化は悪性を示唆する．色素性病変では非対称性・辺縁不整・色調不均一・径6mm超・変化という五つの視点で評価し，該当すれば生検に進む．\n- A：表面の変化に関する情報．\n- B：悪性の可能性を評価でき有用．\n- C：機械的刺激に関する情報．\n- D：随伴症状に関する情報．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":6,"section":"E-3-S02　72歳男性・顔の治らない皮疹","question":"（2/4）72歳の男性．半年前から右の頬に黒いできものがあり，少しずつ大きくなっているという．長年の農作業で日焼けしてきた．半年で径5mmから12mmへ大きくなったという．皮疹は光沢のある黒色結節で，辺縁が堤防状に隆起し中央がくぼんでいる．最も考えられるのはどれか．","options":[{"letter":"A","text":"有棘細胞癌である"},{"letter":"B","text":"悪性黒色腫である"},{"letter":"C","text":"脂漏性角化症である"},{"letter":"D","text":"基底細胞癌である"},{"letter":"E","text":"色素性母斑である"}],"answer":["D"],"multi":false,"explanation":"解説：光沢のある黒色の結節で，辺縁が真珠様に堤防状隆起し中央が潰瘍化するのが典型像である．顔面の中央部に好発し，局所で浸潤するが転移はまれで，完全切除により治癒が期待できる．\n- A：有棘細胞癌は角化を伴い，潰瘍と易出血性が目立つ．\n- B：悪性黒色腫は色調が不均一で辺縁が不整．\n- C：脂漏性角化症は疣状で表面がざらつき，増大しても良性．\n- D：形態に合致し正しい．\n- E：色素性母斑は均一な色調で急速には増大しない．","images":[],"stem_images":[]},{"number":7,"section":"E-3-S02　72歳男性・顔の治らない皮疹","question":"（3/4）72歳の男性．半年前から右の頬に黒いできものがあり，少しずつ大きくなっているという．長年の農作業で日焼けしてきた．半年で径5mmから12mmへ大きくなったという．皮疹は光沢のある黒色結節で，辺縁が堤防状に隆起し中央がくぼんでいる．この腫瘍の特徴はどれか．","options":[{"letter":"A","text":"早期から血行性に転移する"},{"letter":"B","text":"早期からリンパ行性に転移する"},{"letter":"C","text":"転移はまれで局所浸潤が主体"},{"letter":"D","text":"自然に消退することが多い"},{"letter":"E","text":"放射線にまったく反応しない"}],"answer":["C"],"multi":false,"explanation":"解説：局所で破壊的に浸潤するが遠隔転移はきわめてまれである．完全に切除できれば治癒するので，整容面を考えながらも十分な切除縁を確保することが治療の要点になる．\n- A：血行性転移はまれである．\n- B：リンパ行性転移もまれである．\n- C：この腫瘍の生物学的特徴で正しい．\n- D：自然消退は期待できない．\n- E：放射線治療も選択肢のひとつになる．","images":[],"stem_images":[]},{"number":8,"section":"E-3-S02　72歳男性・顔の治らない皮疹","question":"（4/4）72歳の男性．半年前から右の頬に黒いできものがあり，少しずつ大きくなっているという．長年の農作業で日焼けしてきた．半年で径5mmから12mmへ大きくなったという．皮疹は光沢のある黒色結節で，辺縁が堤防状に隆起し中央がくぼんでいる．足底に色調が不均一で辺縁の不整な黒色斑がある場合に疑う疾患の生検法はどれか．","options":[{"letter":"A","text":"病変の一部だけを切り取る生検"},{"letter":"B","text":"病変を含めて全切除する生検"},{"letter":"C","text":"擦過して細胞診のみを行う"},{"letter":"D","text":"穿刺吸引による細胞診を行う"},{"letter":"E","text":"生検は行わず経過観察とする"}],"answer":["B"],"multi":false,"explanation":"解説：悪性黒色腫は腫瘍の厚さが予後と治療方針を決めるため，最も厚い部分を含めて全体を採取する切除生検が原則になる．部分生検では厚さを正しく評価できない．\n- A：部分生検では腫瘍の厚さを過小評価しうる．\n- B：厚さの正確な評価につながり正しい．\n- C：擦過細胞診では深達度が分からない．\n- D：穿刺吸引細胞診も深達度の評価に向かない．\n- E：疑った時点で組織診断が必要である．","images":[],"stem_images":[]},{"number":9,"section":"E-3-S03　16歳男子・膝の痛みと腫脹","question":"（1/4）16歳の男子．3か月前から右膝の上が痛み，最近は腫れも目立つという．部活動は続けている．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から近視ですか．"},{"letter":"B","text":"夜間や安静時も痛みますか．"},{"letter":"C","text":"けがをしたことはありますか．"},{"letter":"D","text":"発熱や体重減少はありますか．"},{"letter":"E","text":"腫れは大きくなっていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．屈折異常は骨・関節病変の初期評価では優先度が低い．\n- A：屈折異常は骨・関節病変の初期評価では優先度が低い．この設問で選ぶ肢．\n- B：腫瘍性病変などの警告徴候を確認．\n- C：外傷との鑑別に有用．\n- D：感染・腫瘍の全身症状を確認．\n- E：病変の進行を確認．","images":[],"stem_images":[]},{"number":10,"section":"E-3-S03　16歳男子・膝の痛みと腫脹","question":"（2/4）16歳の男子．3か月前から右膝の上が痛み，最近は腫れも目立つという．部活動は続けている．夜間にも痛みで目が覚めるという．単純エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"境界明瞭な打ち抜き像の多発"},{"letter":"B","text":"関節裂隙の狭小化と骨棘の形成"},{"letter":"C","text":"骨膜の反応性挙上と日光様スピクラ"},{"letter":"D","text":"骨端線の早期の閉鎖の所見"},{"letter":"E","text":"びまん性の骨の脱灰の所見"}],"answer":["C"],"multi":false,"explanation":"解説：腫瘍が皮質を破って外へ出ると骨膜が押し上げられ，その辺縁が三角形の陰影として残る．これがCodman三角で，骨膜から垂直に伸びる骨形成が日光様のスピクラとして描出される．\n- A：打ち抜き像の多発は多発性骨髄腫．\n- B：関節裂隙の狭小化と骨棘は変形性関節症．\n- C：この腫瘍に特徴的で正しい．\n- D：骨端線の早期閉鎖は内分泌疾患や外傷後．\n- E：びまん性の脱灰は骨粗鬆症や不動性骨萎縮．","images":[],"stem_images":[]},{"number":11,"section":"E-3-S03　16歳男子・膝の痛みと腫脹","question":"（3/4）16歳の男子．3か月前から右膝の上が痛み，最近は腫れも目立つという．部活動は続けている．夜間にも痛みで目が覚めるという．単純エックス線写真で大腿骨遠位にCodman三角と日光様スピクラを認めた．血清アルカリホスファターゼが高値である．最初に転移を検索すべき臓器はどれか．","options":[{"letter":"A","text":"脳である"},{"letter":"B","text":"肝臓である"},{"letter":"C","text":"骨髄である"},{"letter":"D","text":"腎臓である"},{"letter":"E","text":"肺である"}],"answer":["E"],"multi":false,"explanation":"解説：この腫瘍は血行性に転移し，最初にたどり着くのが肺である．診断時に胸部CTで肺転移の有無を必ず確認し，術前化学療法・患肢温存手術・術後化学療法という治療計画を立てる．\n- A：脳転移は頻度が低い．\n- B：肝転移も主要な転移先ではない．\n- C：骨髄への浸潤はEwing肉腫や白血病で問題になる．\n- D：腎転移も頻度が低い．\n- E：血行性転移の第一の標的で正しい．","images":[],"stem_images":[]},{"number":12,"section":"E-3-S03　16歳男子・膝の痛みと腫脹","question":"（4/4）16歳の男子．3か月前から右膝の上が痛み，最近は腫れも目立つという．部活動は続けている．夜間にも痛みで目が覚めるという．単純エックス線写真で大腿骨遠位にCodman三角と日光様スピクラを認めた．血清アルカリホスファターゼが高値である．高齢者で腰痛と造骨性の骨病変を認めた場合に疑う原発巣はどれか．","options":[{"letter":"A","text":"前立腺である"},{"letter":"B","text":"甲状腺である"},{"letter":"C","text":"腎臓である"},{"letter":"D","text":"肺である"},{"letter":"E","text":"大腸である"}],"answer":["A"],"multi":false,"explanation":"解説：骨転移の多くは溶骨性だが，前立腺癌は造骨性の転移を作るのが特徴である．腰椎や骨盤に多く，血清PSAとアルカリホスファターゼの上昇を伴う．直腸診とPSAで原発巣を探す．\n- A：造骨性転移の代表で正しい．\n- B：甲状腺癌の骨転移は溶骨性が多い．\n- C：腎癌の骨転移も溶骨性である．\n- D：肺癌の骨転移も溶骨性が主体．\n- E：大腸癌は骨転移自体がまれである．","images":[],"stem_images":[]},{"number":13,"section":"E-3-S04　68歳男性・血痰と体重減少","question":"（1/4）68歳の男性．2か月前から咳が続き，血の混じった痰が出るという．体重が6kg減った．肺の悪性疾患の危険因子を定量的に確認する質問はどれか．","options":[{"letter":"A","text":"家族に肺癌の人はいますか．"},{"letter":"B","text":"喫煙の量と年数を教えてください．"},{"letter":"C","text":"石綿を扱う仕事をしましたか．"},{"letter":"D","text":"結核になったことがありますか．"},{"letter":"E","text":"いつから血痰がありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：一日本数と年数を掛けた喫煙指数が大きいほど危険が高く，とくに扁平上皮癌と小細胞癌との関連が強い．組織型の推定と禁煙指導の両方につながる有用な情報になる．\n- A：家族歴に関する情報．\n- B：危険度の評価と組織型の推定に直結し有用．\n- C：職業性曝露に関する情報．\n- D：感染性病変の既往に関する情報．\n- E：症状の経過に関する情報．","images":[],"stem_images":[]},{"number":14,"section":"E-3-S04　68歳男性・血痰と体重減少","question":"（2/4）68歳の男性．2か月前から咳が続き，血の混じった痰が出るという．体重が6kg減った．喫煙は40本を45年間続けているという．胸部CTで右肺門部に3cmの腫瘤を認めた．喫煙と関連が強い組織型はどれか．","options":[{"letter":"A","text":"腺癌が最も関連が強い"},{"letter":"B","text":"大細胞癌が最も関連が強い"},{"letter":"C","text":"扁平上皮癌と小細胞癌"},{"letter":"D","text":"カルチノイドが最も関連が強い"},{"letter":"E","text":"悪性中皮腫が最も関連が強い"}],"answer":["C"],"multi":false,"explanation":"解説：いずれも中枢の肺門部に発生しやすく喫煙との関連が強い．扁平上皮癌は空洞を作りやすく，小細胞癌は増殖が速く早期から転移するため，病期と治療方針がまったく異なる．\n- A：腺癌は末梢に多く，非喫煙者にも生じる．\n- B：大細胞癌の頻度は低い．\n- D：カルチノイドは喫煙との関連が乏しい．\n- E：悪性中皮腫はアスベスト曝露と関連する．\n- C：この組合せが正しい．","images":[],"stem_images":[]},{"number":15,"section":"E-3-S04　68歳男性・血痰と体重減少","question":"（3/4）68歳の男性．2か月前から咳が続き，血の混じった痰が出るという．体重が6kg減った．喫煙は40本を45年間続けているという．胸部CTで右肺門部に3cmの腫瘤を認めた．気管支鏡下生検で小細胞癌と診断された．血清ナトリウムが118mEq/Lと低下していた．この機序はどれか．","options":[{"letter":"A","text":"副腎皮質ホルモンの過剰な分泌"},{"letter":"B","text":"副甲状腺ホルモン関連蛋白の産生"},{"letter":"C","text":"抗利尿ホルモンの異所性の産生"},{"letter":"D","text":"カテコラミンの異所性の産生"},{"letter":"E","text":"成長ホルモンの異所性の産生"}],"answer":["C"],"multi":false,"explanation":"解説：腫瘍が抗利尿ホルモンを産生し続けると，血漿浸透圧が低いのに尿が濃縮され，体液量は保たれたまま低ナトリウム血症となる．水制限と原疾患の治療で対応する．\n- A：副腎皮質刺激ホルモンの異所性産生ではCushing症候群となる．\n- B：副甲状腺ホルモン関連蛋白は高カルシウム血症を起こし，扁平上皮癌に多い．\n- C：この腫瘍の代表的な腫瘍随伴症候群で正しい．\n- D：カテコラミンの異所性産生はまれである．\n- E：成長ホルモンの異所性産生もまれである．","images":[],"stem_images":[]},{"number":16,"section":"E-3-S04　68歳男性・血痰と体重減少","question":"（4/4）68歳の男性．2か月前から咳が続き，血の混じった痰が出るという．体重が6kg減った．喫煙は40本を45年間続けているという．胸部CTで右肺門部に3cmの腫瘤を認めた．気管支鏡下生検で小細胞癌と診断された．血清ナトリウムが118mEq/Lと低下していた．この組織型の治療方針として正しいのはどれか．","options":[{"letter":"A","text":"手術が第一選択となることが多い"},{"letter":"B","text":"化学療法と放射線治療が中心となる"},{"letter":"C","text":"経過観察が選択されることが多い"},{"letter":"D","text":"抗菌薬の投与が中心となる"},{"letter":"E","text":"免疫抑制薬の投与が中心となる"}],"answer":["B"],"multi":false,"explanation":"解説：増殖が速く診断時には既に転移していることが多いため，手術の適応はごく限られる．一方で化学療法と放射線治療への感受性が高く，限局型では同時併用が標準になる．\n- A：診断時に切除可能な例はごく少数にとどまる．\n- B：この組織型の標準的な治療で正しい．\n- C：進行が速く経過観察は許されない．\n- D：抗菌薬は感染症の治療．\n- E：免疫抑制薬は自己免疫疾患の治療．","images":[],"stem_images":[]},{"number":17,"section":"E-3-S05　64歳男性・つかえ感と体重減少","question":"（1/4）64歳の男性．3か月前から食事のときに胸がつかえる感じがあり，体重が7kg減ったという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"たばこを吸っていますか．"},{"letter":"B","text":"以前から排便時に肛門が痛みますか．"},{"letter":"C","text":"症状は徐々に悪化していますか．"},{"letter":"D","text":"固形物と水のどちらがつかえますか．"},{"letter":"E","text":"飲酒で顔が赤くなりますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．肛門局所症状は嚥下困難の原因検索では優先度が低い．\n- A：食道・頭頸部癌の危険因子を確認．\n- B：肛門局所症状は嚥下困難の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：狭窄の進行を確認．\n- D：機械的狭窄と運動障害を鑑別．\n- E：飲酒関連の食道癌リスクを検討．","images":[],"stem_images":[]},{"number":18,"section":"E-3-S05　64歳男性・つかえ感と体重減少","question":"（2/4）64歳の男性．3か月前から食事のときに胸がつかえる感じがあり，体重が7kg減ったという．若い頃から飲酒で顔が赤くなり，喫煙も40年続けているという．つかえ感の進み方として予想されるのはどれか．","options":[{"letter":"A","text":"液体だけがつかえ固形物は通る"},{"letter":"B","text":"固形物からつかえ次第に流動物も"},{"letter":"C","text":"つかえ感が日によって大きく変動する"},{"letter":"D","text":"食後2時間ほどしてから出てくる"},{"letter":"E","text":"前かがみになると強くなってくる"}],"answer":["B"],"multi":false,"explanation":"解説：内腔が狭くなるにつれ，まず固形物が通りにくくなり，進行すると粥状のもの，最後は水分も通らなくなる．この一方向の進行が，変動する機能性の通過障害との違いになる．\n- A：液体から先につかえるのは食道アカラシアなどの運動異常．\n- B：器質的狭窄の進行として正しい．\n- C：日による変動は機能性の通過障害を示唆する．\n- D：食後しばらくしての症状は胃排出の問題．\n- E：前かがみでの増悪は胃食道逆流症．","images":[],"stem_images":[]},{"number":19,"section":"E-3-S05　64歳男性・つかえ感と体重減少","question":"（3/4）64歳の男性．3か月前から食事のときに胸がつかえる感じがあり，体重が7kg減ったという．若い頃から飲酒で顔が赤くなり，喫煙も40年続けているという．つかえ感は固形物から始まり，今は粥状のものも通りにくいという．上部消化管内視鏡で予想される所見はどれか．","options":[{"letter":"A","text":"胃角部に周堤を伴う潰瘍がある"},{"letter":"B","text":"十二指腸球部に白苔を伴う潰瘍"},{"letter":"C","text":"食道下部に縦走するびらんの連なり"},{"letter":"D","text":"胸部中部食道のヨード不染の病変"},{"letter":"E","text":"噴門部が開かず食道が拡張している"}],"answer":["D"],"multi":false,"explanation":"解説：正常な扁平上皮はグリコーゲンを含みヨードで褐色に染まるが，腫瘍細胞はグリコーゲンを失うため染まらない．胸部中部食道に好発し，この不染帯が早期病変の発見に有効である．\n- A：周堤を伴う潰瘍は進行胃癌．\n- B：白苔を伴う十二指腸潰瘍は消化性潰瘍．\n- C：食道下部の縦走びらんは逆流性食道炎．\n- D：この疾患の好発部位と所見で正しい．\n- E：噴門が開かず食道が拡張するのは食道アカラシア．","images":[],"stem_images":[]},{"number":20,"section":"E-3-S05　64歳男性・つかえ感と体重減少","question":"（4/4）64歳の男性．3か月前から食事のときに胸がつかえる感じがあり，体重が7kg減ったという．若い頃から飲酒で顔が赤くなり，喫煙も40年続けているという．つかえ感は固形物から始まり，今は粥状のものも通りにくいという．内視鏡で胸部中部食道にヨード不染帯を伴う病変を認めた．最も多い組織型はどれか．","options":[{"letter":"A","text":"腺癌が最も多い"},{"letter":"B","text":"小細胞癌が最も多い"},{"letter":"C","text":"悪性リンパ腫が最も多い"},{"letter":"D","text":"悪性黒色腫が最も多い"},{"letter":"E","text":"扁平上皮癌が最も多い"}],"answer":["E"],"multi":false,"explanation":"解説：本邦の食道癌の9割以上は扁平上皮癌で，喫煙と飲酒が主な危険因子になる．欧米ではBarrett食道を背景とする下部食道の腺癌が増えており，危険因子も肥満と胃食道逆流症で異なる．\n- A：腺癌はBarrett食道を背景に下部食道で増えているが本邦では少数．\n- B：小細胞癌は食道ではまれ．\n- C：悪性リンパ腫も食道原発はまれ．\n- D：悪性黒色腫の食道原発は極めてまれ．\n- E：本邦での頻度から正しい．","images":[],"stem_images":[]},{"number":21,"section":"E-3-S06　66歳男性・心窩部痛と黒色便","question":"（1/4）66歳の男性．2か月前から心窩部が重く痛み，最近は黒い便が出るという．体重も5kg減った．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"吐血したことはありますか．"},{"letter":"B","text":"数年前から排尿の勢いが弱いですか．"},{"letter":"C","text":"ピロリ菌を指摘されましたか．"},{"letter":"D","text":"めまいや動悸はありますか．"},{"letter":"E","text":"痛み止めを飲んでいますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性排尿障害は今回の消化管出血の初期評価では優先度が低い．\n- A：上部消化管出血の症状を確認．\n- B：慢性排尿障害は今回の消化管出血の初期評価では優先度が低い．この設問で選ぶ肢．\n- C：胃疾患の背景を確認．\n- D：出血性貧血の影響を評価．\n- E：消化性潰瘍と出血の誘因を検討．","images":[],"stem_images":[]},{"number":22,"section":"E-3-S06　66歳男性・心窩部痛と黒色便","question":"（2/4）66歳の男性．2か月前から心窩部が重く痛み，最近は黒い便が出るという．体重も5kg減った．20年前にピロリ菌を指摘されたが除菌はしていないという．左鎖骨上窩にリンパ節を触知した．このリンパ節はどれか．","options":[{"letter":"A","text":"Virchowリンパ節である"},{"letter":"B","text":"Krukenberg腫瘍である"},{"letter":"C","text":"Schnitzler転移である"},{"letter":"D","text":"臍への転移結節である"},{"letter":"E","text":"Blumer棚である"}],"answer":["A"],"multi":false,"explanation":"解説：胸管を介して左鎖骨上窩のリンパ節へ転移するのがVirchowリンパ節である．触知されれば遠隔転移であり，切除の適応がなくなるため，触診で必ず確かめるべき所見になる．\n- A：この転移形式で正しい．\n- B：Krukenberg腫瘍は卵巣への転移．\n- C：Schnitzler転移はDouglas窩への播種．\n- D：臍への転移結節をSister Mary Joseph結節という．\n- E：Blumer棚は直腸指診で触れるDouglas窩の播種．","images":[],"stem_images":[]},{"number":23,"section":"E-3-S06　66歳男性・心窩部痛と黒色便","question":"（3/4）66歳の男性．2か月前から心窩部が重く痛み，最近は黒い便が出るという．体重も5kg減った．20年前にピロリ菌を指摘されたが除菌はしていないという．左鎖骨上窩にリンパ節を触知した．上部消化管内視鏡で胃角部に周堤を伴う不整な潰瘍を認めた．生検で低分化腺癌と診断された．左鎖骨上窩リンパ節の生検でも同じ腺癌の転移を確認した．この所見が意味するのはどれか．","options":[{"letter":"A","text":"内視鏡治療で根治が期待できる"},{"letter":"B","text":"遠隔転移を伴う進行胃癌である"},{"letter":"C","text":"早期胃癌にとどまっている"},{"letter":"D","text":"良性の潰瘍と考えてよい"},{"letter":"E","text":"経過観察で問題ない状態である"}],"answer":["B"],"multi":false,"explanation":"解説：生検で確認した左鎖骨上窩リンパ節転移は，領域リンパ節を越える遠隔転移に当たる．全身治療を中心に方針を検討する．触れるだけで転移と断定したり，症状緩和を含む手術を一律に否定したりしない．\n- A：遠隔転移があり内視鏡治療の適応はない．\n- B：鎖骨上窩リンパ節への転移はM1であり，遠隔転移に分類する．\n- C：周堤を伴う潰瘍と遠隔転移は進行癌を示す．\n- D：生検で腺癌と確定している．\n- E：進行癌であり経過観察は許されない．","images":[],"stem_images":[]},{"number":24,"section":"E-3-S06　66歳男性・心窩部痛と黒色便","question":"（4/4）66歳の男性．2か月前から心窩部が重く痛み，最近は黒い便が出るという．体重も5kg減った．20年前にピロリ菌を指摘されたが除菌はしていないという．左鎖骨上窩にリンパ節を触知した．上部消化管内視鏡で胃角部に周堤を伴う不整な潰瘍を認め，生検で低分化腺癌と診断された．左鎖骨上窩リンパ節の生検でも同じ腺癌の転移を確認した．この癌が卵巣へ転移した場合の呼称はどれか．","options":[{"letter":"A","text":"Virchowリンパ節である"},{"letter":"B","text":"Schnitzler転移である"},{"letter":"C","text":"Krukenberg腫瘍である"},{"letter":"D","text":"臍への転移結節である"},{"letter":"E","text":"Blumer棚である"}],"answer":["C"],"multi":false,"explanation":"解説：印環細胞癌などが両側卵巣へ転移したものをKrukenberg腫瘍という．若年女性の卵巣腫瘍では原発性か転移性かを必ず考え，胃をはじめとする消化管の検索を行う必要がある．\n- A：Virchowリンパ節は左鎖骨上窩への転移．\n- B：Schnitzler転移はDouglas窩への播種．\n- C：卵巣への転移の呼称として正しい．\n- D：臍への転移結節をSister Mary Joseph結節という．\n- E：Blumer棚はDouglas窩の播種を直腸指診で触れるもの．","images":[],"stem_images":[]},{"number":25,"section":"E-3-S07　62歳男性・便通の変化と血便","question":"（1/4）62歳の男性．3か月前から便が細くなり，便秘と下痢を繰り返すという．最近は便に血が混じる．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から胸やけだけがありますか．"},{"letter":"B","text":"以前に大腸の検査を受けましたか．"},{"letter":"C","text":"排便時に肛門が痛みますか．"},{"letter":"D","text":"家族に大腸癌の人はいますか．"},{"letter":"E","text":"体重が減っていませんか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性胸やけは下部消化管症状の原因検索では優先度が低い．\n- A：慢性胸やけは下部消化管症状の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：既往病変と検査歴を確認．\n- C：肛門疾患との鑑別に有用．\n- D：家族性の危険因子を確認．\n- E：悪性疾患の全身症状を確認．","images":[],"stem_images":[]},{"number":26,"section":"E-3-S07　62歳男性・便通の変化と血便","question":"（2/4）62歳の男性．3か月前から便が細くなり，便秘と下痢を繰り返すという．最近は便に血が混じる．父が58歳で大腸癌と診断されたという．便柱の狭小化から推定される病変の部位はどれか．","options":[{"letter":"A","text":"上行結腸である"},{"letter":"B","text":"盲腸である"},{"letter":"C","text":"回腸末端である"},{"letter":"D","text":"十二指腸である"},{"letter":"E","text":"S状結腸や直腸である"}],"answer":["E"],"multi":false,"explanation":"解説：左側は内腔が細く便も固形化しているため，狭窄すると便柱の狭小化・便秘と下痢の交代・血便が早く出る．右側は内腔が広く便も液状なので，慢性の出血による鉄欠乏性貧血で気づかれる．\n- A：上行結腸の病変は貧血で気づかれやすい．\n- B：盲腸も同様に狭窄症状が出にくい．\n- C：回腸末端の病変はCrohn病などを考える部位．\n- D：十二指腸の病変では上腹部症状が主体になる．\n- E：症状の組合せに合致し正しい．","images":[],"stem_images":[]},{"number":27,"section":"E-3-S07　62歳男性・便通の変化と血便","question":"（3/4）62歳の男性．3か月前から便が細くなり，便秘と下痢を繰り返すという．最近は便に血が混じる．父が58歳で大腸癌と診断されたという．大腸内視鏡でS状結腸に全周性の狭窄を伴う腫瘍を認め，生検で高分化腺癌と診断された．治療前に測定すべき腫瘍マーカーはどれか．","options":[{"letter":"A","text":"AFPを測定する"},{"letter":"B","text":"PSAを測定する"},{"letter":"C","text":"CA125を測定する"},{"letter":"D","text":"CEAを測定する"},{"letter":"E","text":"カルシトニンを測定する"}],"answer":["D"],"multi":false,"explanation":"解説：診断時の値を基準として記録し，術後の推移で再発を早期に捉える．診断そのものには使えないが，治療効果の判定と経過観察の指標として有用で，術前に必ず測っておく．\n- A：AFPは肝細胞癌や胚細胞腫瘍．\n- B：PSAは前立腺癌．\n- C：CA125は卵巣癌．\n- D：この癌の代表的なマーカーで正しい．\n- E：カルシトニンは甲状腺髄様癌．","images":[],"stem_images":[]},{"number":28,"section":"E-3-S07　62歳男性・便通の変化と血便","question":"（4/4）62歳の男性．3か月前から便が細くなり，便秘と下痢を繰り返すという．最近は便に血が混じる．父が58歳で大腸癌と診断されたという．大腸内視鏡でS状結腸に全周性の狭窄を伴う腫瘍を認め，生検で高分化腺癌と診断された．CEAは28ng/mLと高値であった．最も多い遠隔転移先はどれか．","options":[{"letter":"A","text":"脳である"},{"letter":"B","text":"骨である"},{"letter":"C","text":"肝臓である"},{"letter":"D","text":"皮膚である"},{"letter":"E","text":"腎臓である"}],"answer":["C"],"multi":false,"explanation":"解説：門脈系を介して血流が肝へ向かうため，肝転移が最も多い．次いで肺に多く，これらは切除により長期生存が期待できる場合があるので，診断時に胸腹部CTで必ず評価する．\n- A：脳転移は頻度が低い．\n- B：骨転移も比較的まれである．\n- C：血流の経路から必然で正しい．\n- D：皮膚転移はまれである．\n- E：腎転移もまれである．","images":[],"stem_images":[]},{"number":29,"section":"E-3-S08　70歳女性・無痛性の黄疸","question":"（1/4）70歳の女性．2週間前から白目と皮膚が黄色くなり，かゆみも出てきたという．腹痛はまったくない．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"薬やサプリを使っていますか．"},{"letter":"B","text":"尿が濃くなりましたか．"},{"letter":"C","text":"便が白っぽくなりましたか．"},{"letter":"D","text":"以前からくしゃみで尿が漏れますか．"},{"letter":"E","text":"最近，体重が減りましたか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性腹圧性尿失禁は黄疸の原因検索では優先度が低い．\n- A：薬剤性胆汁うっ滞を検討．\n- B：抱合型ビリルビンの尿中排泄を検討．\n- C：胆汁排泄障害を確認．\n- D：慢性腹圧性尿失禁は黄疸の原因検索では優先度が低い．この設問で選ぶ肢．\n- E：悪性疾患を疑う全身症状を確認．","images":[],"stem_images":[]},{"number":30,"section":"E-3-S08　70歳女性・無痛性の黄疸","question":"（2/4）70歳の女性．2週間前から白目と皮膚が黄色くなり，かゆみも出てきたという．腹痛はまったくない．3か月で6kg減り，便は灰白色になったという．腹部触診で予想される所見はどれか．","options":[{"letter":"A","text":"無痛性に腫大した胆嚢を触れる"},{"letter":"B","text":"腹壁全体の板状硬と反跳痛"},{"letter":"C","text":"左下腹部の限局した強い圧痛"},{"letter":"D","text":"臍周囲の拍動性の腫瘤の触知"},{"letter":"E","text":"右下腹部の圧痛と反跳痛の出現"}],"answer":["A"],"multi":false,"explanation":"解説：総胆管が緩やかに閉塞すると胆嚢が伸展して腫大し，炎症がないため無痛性に触れる．胆石による閉塞では胆嚢壁が線維化していて腫大しにくく，この差が良悪の鑑別に用いられる．\n- A：Courvoisier徴候にあたり正しい．\n- B：板状硬と反跳痛は汎発性腹膜炎．\n- C：左下腹部の限局した圧痛は大腸憩室炎．\n- D：拍動性腫瘤は腹部大動脈瘤．\n- E：右下腹部の圧痛と反跳痛は急性虫垂炎．","images":[],"stem_images":[]},{"number":31,"section":"E-3-S08　70歳女性・無痛性の黄疸","question":"（3/4）70歳の女性．2週間前から白目と皮膚が黄色くなり，かゆみも出てきたという．腹痛はまったくない．3か月で6kg減り，便は灰白色になったという．右季肋部に無痛性の腫大した胆嚢を触知する．総ビリルビン12.4mg/dL（直接9.8mg/dL）であった．測定すべき腫瘍マーカーはどれか．","options":[{"letter":"A","text":"AFPを測定する"},{"letter":"B","text":"PSAを測定する"},{"letter":"C","text":"カルシトニンを測定する"},{"letter":"D","text":"CA125を測定する"},{"letter":"E","text":"CA19-9を測定する"}],"answer":["E"],"multi":false,"explanation":"解説：膵胆道系の腫瘍で上昇しやすく，治療効果と再発の判定にも用いる．ただしLewis式血液型陰性者では産生されないため，値が上がらないことが腫瘍の否定にはならない点に注意する．\n- A：AFPは肝細胞癌や胚細胞腫瘍．\n- B：PSAは前立腺癌．\n- C：カルシトニンは甲状腺髄様癌．\n- D：CA125は卵巣癌．\n- E：膵胆道系のマーカーとして正しい．","images":[],"stem_images":[]},{"number":32,"section":"E-3-S08　70歳女性・無痛性の黄疸","question":"（4/4）70歳の女性．2週間前から白目と皮膚が黄色くなり，かゆみも出てきたという．腹痛はまったくない．3か月で6kg減り，便は灰白色になったという．右季肋部に無痛性の腫大した胆嚢を触知する．総ビリルビン12.4mg/dL（直接9.8mg/dL）でCA19-9も高値であった．この患者で先行しうる全身症状はどれか．","options":[{"letter":"A","text":"甲状腺機能が急に亢進すること"},{"letter":"B","text":"糖尿病の新規発症や急な悪化"},{"letter":"C","text":"骨密度が急速に低下すること"},{"letter":"D","text":"角膜に点状の混濁が生じること"},{"letter":"E","text":"尿路に結石が多発してくること"}],"answer":["B"],"multi":false,"explanation":"解説：膵癌では診断の数か月から数年前に耐糖能が悪化することがあり，高齢での糖尿病の新規発症や既存の糖尿病の急な増悪は膵の精査を考える契機になる．背部痛と体重減少も伴う．\n- A：甲状腺機能亢進はこの疾患と関連しない．\n- B：膵癌に先行しうる所見で正しい．\n- C：骨密度の低下はこの疾患の先行症状ではない．\n- D：角膜の点状混濁はウイルス性結膜炎の後遺．\n- E：尿路結石は代謝異常や尿路の停滞で起こる．","images":[],"stem_images":[]},{"number":33,"section":"E-3-S09　68歳男性・肝硬変経過中の腫瘤","question":"（1/4）68歳の男性．C型肝炎による肝硬変で10年通院している．定期の腹部超音波で肝に2cmの腫瘤を指摘された．自覚症状はない．肝腫瘤の出現時期や増大速度を把握する質問はどれか．","options":[{"letter":"A","text":"肝炎の治療を受けましたか．"},{"letter":"B","text":"最近，体重が減りましたか．"},{"letter":"C","text":"家族に肝臓癌の人はいますか．"},{"letter":"D","text":"お酒はどのくらい飲みますか．"},{"letter":"E","text":"前回の検査はいつ受けましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：前回の画像で見えていなかった病変が短期間で出現したのか，以前からあって増大したのかで意味が変わる．肝硬変では半年ごとの超音波と腫瘍マーカーによる監視が推奨されている．\n- A：肝炎の治療歴に関する情報．\n- B：全身症状に関する情報．\n- C：家族歴に関する情報．\n- D：肝障害の背景に関する情報．\n- E：病変の経過を把握でき有用．","images":[],"stem_images":[]},{"number":34,"section":"E-3-S09　68歳男性・肝硬変経過中の腫瘤","question":"（2/4）68歳の男性．C型肝炎による肝硬変で10年通院している．定期の腹部超音波で肝に2cmの腫瘤を指摘された．自覚症状はない．半年前の超音波では指摘がなかったという．測定すべき腫瘍マーカーはどれか．","options":[{"letter":"A","text":"PSAとカルシトニンを測定する"},{"letter":"B","text":"CA125とCEAを測定する"},{"letter":"C","text":"CA19-9のみを測定する"},{"letter":"D","text":"AFPとPIVKA-IIを測定する"},{"letter":"E","text":"カルシトニンのみを測定する"}],"answer":["D"],"multi":false,"explanation":"解説：AFPは胎児期の蛋白で，肝細胞癌のほか胚細胞腫瘍でも上昇する．PIVKA-IIはビタミンK欠乏や拮抗薬でも上がるが，両者を組み合わせることで検出率が高まり，経過の指標にもなる．\n- A：PSAは前立腺癌，カルシトニンは甲状腺髄様癌．\n- B：CA125は卵巣癌，CEAは消化器癌．\n- C：CA19-9は膵胆道系のマーカー．\n- D：この癌の代表的な組合せで正しい．\n- E：カルシトニンは甲状腺髄様癌．","images":[],"stem_images":[]},{"number":35,"section":"E-3-S09　68歳男性・肝硬変経過中の腫瘤","question":"（3/4）68歳の男性．C型肝炎による肝硬変で10年通院している．定期の腹部超音波で肝に2cmの腫瘤を指摘された．自覚症状はない．半年前の超音波では指摘がなかったという．AFPとPIVKA-IIがともに上昇していた．造影CTで予想される所見はどれか．","options":[{"letter":"A","text":"動脈相で濃染し門脈相で洗い出される"},{"letter":"B","text":"全相を通じて造影されない病変となる"},{"letter":"C","text":"門脈相でのみ強く濃染してくる病変"},{"letter":"D","text":"辺縁だけがリング状に濃染する多発病変"},{"letter":"E","text":"石灰化のみで造影効果を欠く病変"}],"answer":["A"],"multi":false,"explanation":"解説：腫瘍は肝動脈からの血流に依存するため動脈優位相で強く濃染し，門脈相から平衡相では周囲の肝実質より低吸収となる．この二相性の造影パターンが診断の決め手になる．\n- A：この癌の典型的な造影パターンで正しい．\n- B：造影されない病変は嚢胞など．\n- C：門脈相でのみ濃染するのは典型像ではない．\n- D：辺縁がリング状に濃染する多発病変は転移性肝癌．\n- E：石灰化のみの病変は陳旧性の変化．","images":[],"stem_images":[]},{"number":36,"section":"E-3-S09　68歳男性・肝硬変経過中の腫瘤","question":"（4/4）68歳の男性．C型肝炎による肝硬変で10年通院している．定期の腹部超音波で肝に2cmの腫瘤を指摘された．自覚症状はない．半年前の超音波では指摘がなかったという．AFPとPIVKA-IIがともに上昇し，造影CTで動脈相に濃染し門脈相で洗い出される病変を認めた．別の患者で肝に多発性のリング状濃染病変を認めた場合に探すべきなのはどれか．","options":[{"letter":"A","text":"甲状腺の腫瘍を探す"},{"letter":"B","text":"副腎の腫瘍を探す"},{"letter":"C","text":"消化管などの原発巣を探す"},{"letter":"D","text":"下垂体の腫瘍を探す"},{"letter":"E","text":"副甲状腺の腫瘍を探す"}],"answer":["C"],"multi":false,"explanation":"解説：多発する転移性肝癌では大腸癌が最も多く，次いで胃癌・膵癌・肺癌・乳癌が原発になる．門脈を介して肝へ流れ込む消化管を中心に，内視鏡と全身のCTで原発巣を検索する．\n- A：甲状腺癌の肝転移はまれ．\n- B：副腎腫瘍の肝転移も頻度が低い．\n- C：血流の経路から最も多く正しい．\n- D：下垂体腫瘍は遠隔転移をきたさない．\n- E：副甲状腺腫瘍も転移はまれ．","images":[],"stem_images":[]},{"number":37,"section":"E-3-S10　64歳男性・無症候性の血尿","question":"（1/4）64歳の男性．3日前に尿が赤くなったが痛みはまったくなく，翌日には元に戻ったという．喫煙は40年続けている．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から食後に胸やけがしますか．"},{"letter":"B","text":"血尿は以前にもありましたか．"},{"letter":"C","text":"抗凝固薬を飲んでいますか．"},{"letter":"D","text":"喫煙量と年数を教えてください．"},{"letter":"E","text":"染料などを扱う仕事をしましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性胸やけは無痛性血尿の原因検索では優先度が低い．\n- A：慢性胸やけは無痛性血尿の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：反復性を確認．\n- C：出血に影響する薬剤を確認．\n- D：尿路上皮癌の危険因子を確認．\n- E：職業性曝露を確認．","images":[],"stem_images":[]},{"number":38,"section":"E-3-S10　64歳男性・無症候性の血尿","question":"（2/4）64歳の男性．3日前に尿が赤くなったが痛みはまったくなく，翌日には元に戻ったという．喫煙は40年続けている．血尿は一度だけで今は正常だという．行うべき検査の組合せはどれか．","options":[{"letter":"A","text":"腹部単純写真と便潜血検査"},{"letter":"B","text":"呼吸機能検査と胸部単純写真"},{"letter":"C","text":"骨シンチグラフィと骨密度測定"},{"letter":"D","text":"睡眠ポリグラフィと脳波検査"},{"letter":"E","text":"膀胱鏡と尿細胞診とCTウログラフィ"}],"answer":["E"],"multi":false,"explanation":"解説：膀胱鏡で膀胱内を直接観察し，尿細胞診で高悪性度の病変を拾い，CTウログラフィで腎盂と尿管まで評価する．尿路上皮は連続しているので，一か所で見つかっても全体を調べる必要がある．\n- A：腹部単純写真と便潜血は消化管の評価．\n- B：呼吸機能検査と胸部写真は呼吸器の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：睡眠ポリグラフィと脳波は睡眠と中枢神経の評価．\n- E：尿路全体を評価でき正しい．","images":[],"stem_images":[]},{"number":39,"section":"E-3-S10　64歳男性・無症候性の血尿","question":"（3/4）64歳の男性．3日前に尿が赤くなったが痛みはまったくなく，翌日には元に戻ったという．喫煙は40年続けている．血尿は一度だけで今は正常だという．膀胱鏡で膀胱三角部に乳頭状の腫瘍を認め，尿細胞診も陽性であった．この腫瘍の最も重要な危険因子はどれか．","options":[{"letter":"A","text":"過度の飲酒である"},{"letter":"B","text":"過度の日光曝露である"},{"letter":"C","text":"喫煙である"},{"letter":"D","text":"動物性脂肪の過剰摂取である"},{"letter":"E","text":"運動不足である"}],"answer":["C"],"multi":false,"explanation":"解説：発癌物質が腎で濾過されて尿中に濃縮され，尿路上皮に長く接触する．喫煙者では危険が数倍に高まり，禁煙により再発率も下がるため，診断時の禁煙指導は治療の一部といえる．\n- A：飲酒は食道癌や肝癌との関連が強い．\n- B：日光曝露は皮膚癌の危険因子．\n- C：この癌の最大の危険因子で正しい．\n- D：動物性脂肪は大腸癌との関連が指摘される．\n- E：運動不足は大腸癌などの危険因子だが主因ではない．","images":[],"stem_images":[]},{"number":40,"section":"E-3-S10　64歳男性・無症候性の血尿","question":"（4/4）64歳の男性．3日前に尿が赤くなったが痛みはまったくなく，翌日には元に戻ったという．喫煙は40年続けている．血尿は一度だけで今は正常だという．膀胱鏡で膀胱三角部に乳頭状の腫瘍を認め，尿細胞診も陽性であった．経尿道的切除で筋層非浸潤癌と診断された．治療後の方針として正しいのはどれか．","options":[{"letter":"A","text":"以後の検査は必要なくなる"},{"letter":"B","text":"5年後に一度だけ確認すればよい"},{"letter":"C","text":"症状が出たときだけ受診すればよい"},{"letter":"D","text":"定期的な膀胱鏡で再発を監視する"},{"letter":"E","text":"反対側の腎を予防的に摘出する"}],"answer":["D"],"multi":false,"explanation":"解説：尿路上皮は全体が同じ発癌刺激を受けているため，膀胱内の別の場所や上部尿路に新たな病変が出やすい．一定の間隔で膀胱鏡と尿細胞診を続け，再発を早期に見つけて治療する．\n- A：再発率が高く検査の中止は危険である．\n- B：5年後の一度では再発を見逃す．\n- C：無症候性の再発が多く症状待ちでは遅い．\n- D：この癌の標準的な経過観察で正しい．\n- E：予防的腎摘は適応がない．","images":[],"stem_images":[]},{"number":41,"section":"E-3-S11　72歳男性・排尿困難と腰痛","question":"（1/4）72歳の男性．半年前から尿の勢いが弱く，最近は腰も痛むという．健診で血液検査の異常も指摘された．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"脚の力が落ちていませんか．"},{"letter":"B","text":"健診で指摘された数値は何ですか．"},{"letter":"C","text":"安静時にも腰痛が続きますか．"},{"letter":"D","text":"子どもの頃に鼻血が出ましたか．"},{"letter":"E","text":"体重が減っていませんか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．過去の鼻出血は今回の排尿障害・腰痛の評価では優先度が低い．\n- A：脊髄圧迫の症状を確認．\n- B：検査異常の内容を特定．\n- C：骨転移などの警告徴候を確認．\n- D：過去の鼻出血は今回の排尿障害・腰痛の評価では優先度が低い．この設問で選ぶ肢．\n- E：悪性疾患の全身症状を確認．","images":[],"stem_images":[]},{"number":42,"section":"E-3-S11　72歳男性・排尿困難と腰痛","question":"（2/4）72歳の男性．半年前から尿の勢いが弱く，最近は腰も痛むという．健診で血液検査の異常も指摘された．腰痛は安静にしても続き，夜間に強いという．直腸診で予想される所見はどれか．","options":[{"letter":"A","text":"弾性硬で表面が平滑な腫大"},{"letter":"B","text":"強い熱感と圧痛を伴う腫大"},{"letter":"C","text":"前立腺がまったく触れない状態"},{"letter":"D","text":"直腸粘膜に潰瘍を伴う硬結"},{"letter":"E","text":"石様に硬く表面が結節状の腫大"}],"answer":["E"],"multi":false,"explanation":"解説：癌は辺縁領域から発生するため直腸診で触れやすく，周囲へ浸潤すると石様硬で表面が不整になる．弾性硬で平滑なら良性の肥大を考えるが，所見だけでは否定できずPSAが必要になる．\n- A：弾性硬で平滑な腫大は前立腺肥大症．\n- B：熱感と圧痛を伴う腫大は急性前立腺炎．\n- C：高齢男性で前立腺が触れないことはない．\n- D：直腸粘膜の潰瘍を伴う硬結は直腸の病変．\n- E：この癌の触診所見として正しい．","images":[],"stem_images":[]},{"number":43,"section":"E-3-S11　72歳男性・排尿困難と腰痛","question":"（3/4）72歳の男性．半年前から尿の勢いが弱く，最近は腰も痛むという．健診で血液検査の異常も指摘された．腰痛は安静にしても続き，夜間に強いという．直腸診で石様硬・結節状の腫大を認め，PSAは86ng/mLと著明高値であった．骨シンチグラフィで予想される所見はどれか．","options":[{"letter":"A","text":"腰椎や骨盤に多発する集積亢進"},{"letter":"B","text":"全身に集積の欠損が多発する"},{"letter":"C","text":"長管骨の骨幹部にのみ集積する"},{"letter":"D","text":"頭蓋骨に打ち抜き像として写る"},{"letter":"E","text":"骨には集積をまったく認めない"}],"answer":["A"],"multi":false,"explanation":"解説：この癌の骨転移は造骨性で，骨形成が盛んな部位に薬剤が集積するため多発性の集積亢進として描出される．腰椎・骨盤・肋骨に多く，血清アルカリホスファターゼも上昇する．\n- A：造骨性転移を反映し正しい．\n- B：集積の欠損として写るのは溶骨性病変で，多発性骨髄腫など．\n- C：骨幹部のみへの集積は限定的な病変．\n- D：打ち抜き像は単純エックス線での多発性骨髄腫の所見．\n- E：PSAが著明高値で骨痛もあり，集積がないとは考えにくい．","images":[],"stem_images":[]},{"number":44,"section":"E-3-S11　72歳男性・排尿困難と腰痛","question":"（4/4）72歳の男性．半年前から尿の勢いが弱く，最近は腰も痛むという．健診で血液検査の異常も指摘された．腰痛は安静にしても続き，夜間に強いという．直腸診で石様硬・結節状の腫大を認め，PSAは86ng/mLと著明高値であった．骨シンチグラフィで腰椎と骨盤に多発性の集積亢進を認めた．最も適切な治療はどれか．","options":[{"letter":"A","text":"直ちに前立腺の全摘出術を行う"},{"letter":"B","text":"抗菌薬の全身にわたる長期投与"},{"letter":"C","text":"経過観察のみで治療は行わない"},{"letter":"D","text":"アンドロゲン除去療法を開始する"},{"letter":"E","text":"副腎皮質ステロイドの連日内服"}],"answer":["D"],"multi":false,"explanation":"解説：この癌の増殖はアンドロゲンに依存するため，性腺刺激ホルモン放出ホルモン作動薬や拮抗薬，抗アンドロゲン薬で男性ホルモンを遮断すると，転移があっても高率に反応する．\n- A：遠隔転移があり局所の全摘出では制御できない．\n- B：抗菌薬は感染症の治療．\n- C：骨転移があり無治療は許されない．\n- D：転移例の標準治療で正しい．\n- E：ステロイドは去勢抵抗性となった段階で併用されることがある．","images":[],"stem_images":[]},{"number":45,"section":"E-3-S12　28歳男性・無痛性の陰嚢内腫瘤","question":"（1/4）28歳の男性．2か月前から右の陰嚢が硬く腫れてきたが，痛みはまったくないという．精巣腫瘍の背景となる小児期の治療歴を確認する質問はどれか．","options":[{"letter":"A","text":"陰嚢をぶつけましたか．"},{"letter":"B","text":"排尿時の痛みはありますか．"},{"letter":"C","text":"立つと大きくなりますか．"},{"letter":"D","text":"最近，発熱がありましたか．"},{"letter":"E","text":"幼少期に精巣の手術をしましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：停留精巣はこの腫瘍の明らかな危険因子で，固定術を受けた後も危険は残り，対側の精巣でも発症率が上がる．無痛性の硬い精巣腫大という所見と合わせて診断確率を大きく変える．\n- A：外傷に関する情報．\n- B：尿路感染に関する情報．\n- C：体位による変化に関する情報．\n- D：感染症状に関する情報．\n- E：危険因子を直接問い有用．","images":[],"stem_images":[]},{"number":46,"section":"E-3-S12　28歳男性・無痛性の陰嚢内腫瘤","question":"（2/4）28歳の男性．2か月前から右の陰嚢が硬く腫れてきたが，痛みはまったくないという．幼少期に右の停留精巣で手術を受けたという．鑑別のために行う診察はどれか．","options":[{"letter":"A","text":"陰嚢に光を当てて透過するか見る"},{"letter":"B","text":"足底を擦って母趾の動きをみる"},{"letter":"C","text":"頸部を前屈させて抵抗をみる"},{"letter":"D","text":"上方を注視させ続けて眼瞼をみる"},{"letter":"E","text":"足関節を背屈させて腓腹部をみる"}],"answer":["A"],"multi":false,"explanation":"解説：陰嚢水腫では内容が液体なので光が透けるが，充実性の腫瘍では透過しない．簡便で外来でもできる手技であり，精巣上体炎との区別には圧痛の有無と発熱も併せて評価する．\n- A：充実性か嚢胞性かを分け正しい．\n- B：足底の擦過はBabinski徴候の診察．\n- C：頸部前屈は髄膜刺激徴候の診察．\n- D：上方注視の持続は重症筋無力症の疲労試験．\n- E：足関節背屈はHomans徴候の診察．","images":[],"stem_images":[]},{"number":47,"section":"E-3-S12　28歳男性・無痛性の陰嚢内腫瘤","question":"（3/4）28歳の男性．2か月前から右の陰嚢が硬く腫れてきたが，痛みはまったくないという．幼少期に右の停留精巣で手術を受けたという．陰嚢に光を当てても透過せず，圧痛も発熱もない．超音波で右精巣内に充実性腫瘤を認めた．行ってはならないのはどれか．","options":[{"letter":"A","text":"血清AFPとhCGの測定"},{"letter":"B","text":"胸腹部の造影CTの撮影"},{"letter":"C","text":"血清LDHの測定の実施"},{"letter":"D","text":"経陰嚢での針生検の施行"},{"letter":"E","text":"高位精巣摘除術の施行"}],"answer":["D"],"multi":false,"explanation":"解説：陰嚢を経由した生検は本来の鼠径リンパ流と異なる経路に腫瘍を散布し，予後を悪化させる．診断と治療を兼ねて鼠径部から精索を高位で処理して精巣ごと摘出するのが原則になる．\n- A：腫瘍マーカーの測定は必須である．\n- B：造影CTは病期診断に必要．\n- C：LDHも腫瘍量の指標として測定する．\n- D：腫瘍の散布を招き禁忌で正しい．\n- E：高位精巣摘除術が診断と治療の標準．","images":[],"stem_images":[]},{"number":48,"section":"E-3-S12　28歳男性・無痛性の陰嚢内腫瘤","question":"（4/4）28歳の男性．2か月前から右の陰嚢が硬く腫れてきたが，痛みはまったくないという．幼少期に右の停留精巣で手術を受けたという．陰嚢に光を当てても透過せず，圧痛も発熱もない．超音波で右精巣内に充実性腫瘤を認め，高位精巣摘除術を予定している．治療前に説明すべきことはどれか．","options":[{"letter":"A","text":"精子の凍結保存を検討すること"},{"letter":"B","text":"生涯にわたり運動を禁止すること"},{"letter":"C","text":"水分摂取を厳しく制限すること"},{"letter":"D","text":"蛋白質の摂取を完全にやめること"},{"letter":"E","text":"直射日光をまったく避けること"}],"answer":["A"],"multi":false,"explanation":"解説：化学療法や放射線治療により造精機能が損なわれるため，治療開始前に精子の凍結保存という選択肢を提示する．若年男性に多い腫瘍なので，妊孕性の温存は治療計画の一部になる．\n- A：妊孕性温存の機会を保証し正しい．\n- B：運動の生涯禁止は根拠がない．\n- C：水分制限はこの治療と無関係．\n- D：蛋白制限は栄養状態を損なう．\n- E：日光の回避もこの治療と関係しない．","images":[],"stem_images":[]},{"number":49,"section":"E-3-S13　38歳女性・性交後の出血","question":"（1/4）38歳の女性．3か月前から性交のあとに少量の出血があり，おりものも増えたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から近視ですか．"},{"letter":"B","text":"最終月経はいつでしたか．"},{"letter":"C","text":"性交時痛や下腹部痛はありますか．"},{"letter":"D","text":"子宮頸がん検診を受けていますか．"},{"letter":"E","text":"出血量や回数は増えていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．屈折異常は性器出血の初期鑑別では優先度が低い．\n- A：屈折異常は性器出血の初期鑑別では優先度が低い．この設問で選ぶ肢．\n- B：妊娠関連出血を検討．\n- C：炎症などの合併症状を確認．\n- D：検診歴と過去の異常を確認．\n- E：症状の推移を評価．","images":[],"stem_images":[]},{"number":50,"section":"E-3-S13　38歳女性・性交後の出血","question":"（2/4）38歳の女性．3か月前から性交のあとに少量の出血があり，おりものも増えたという．検診は5年以上受けていないという．発熱や腹痛はなく，月経周期は規則的だという．最初に行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"終夜睡眠ポリグラフィの施行"},{"letter":"C","tex
