熱と全身の発疹","question":"（2/4）5歳の男児．4日前から38℃台の発熱，咳，鼻汁，眼の充血が続き，本日いったん下がった熱が再び上がって全身に発疹が出たという．予防接種は受けていないという．口腔内で予想される所見はどれか．","options":[{"letter":"A","text":"舌の乳頭が赤く隆起する"},{"letter":"B","text":"軟口蓋に点状出血がみられる"},{"letter":"C","text":"扁桃に白い苔が厚く付着する"},{"letter":"D","text":"口角にびらんと亀裂ができる"},{"letter":"E","text":"頬粘膜に白色の小斑点がある"}],"answer":["E"],"multi":false,"explanation":"解説：臼歯に面した頬粘膜に，紅暈を伴う白色の小斑点が出る．発疹に1〜2日先行して現れ，発疹が出ると消えるため，この時期にしか見られない診断的価値の高い所見である．\n- A：苺舌は溶連菌感染症や川崎病．\n- B：軟口蓋の点状出血は溶連菌性咽頭炎や伝染性単核球症．\n- C：扁桃の白苔は細菌性扁桃炎や伝染性単核球症．\n- D：口角のびらんと亀裂は口角炎で，栄養障害やカンジダ症．\n- E：この疾患に特異的な粘膜疹で正しい．","images":[],"stem_images":[]},{"number":19,"section":"D-3-S05　5歳男児・発熱と全身の発疹","question":"（3/4）5歳の男児．4日前から38℃台の発熱，咳，鼻汁，眼の充血が続き，本日いったん下がった熱が再び上がって全身に発疹が出たという．予防接種は受けていないという．頬粘膜に白色の小斑点を認める．発疹は耳の後ろから始まり顔面と体幹へ広がり，一部は融合している．必要な感染対策はどれか．","options":[{"letter":"A","text":"標準予防策のみでよい"},{"letter":"B","text":"空気感染に対する隔離"},{"letter":"C","text":"接触感染の予防のみでよい"},{"letter":"D","text":"血液を介する感染への注意"},{"letter":"E","text":"食品を介する感染への注意"}],"answer":["B"],"multi":false,"explanation":"解説：この疾患は空気感染し，感染力がきわめて強い．陰圧個室での管理と，対応する医療者の抗体保有の確認が要る．発疹出現の前後4日間ほどが感染力の強い時期にあたる．\n- A：標準予防策だけでは飛沫核の拡散を防げない．\n- B：感染経路に見合った対策で正しい．\n- C：接触感染対策だけでは不十分．\n- D：血液媒介感染はB型肝炎やHIV感染症で問題になる．\n- E：食品媒介感染はノロウイルスや腸管出血性大腸菌．","images":[],"stem_images":[]},{"number":20,"section":"D-3-S05　5歳男児・発熱と全身の発疹","question":"（4/4）5歳の男児．4日前から38℃台の発熱，咳，鼻汁，眼の充血が続き，本日いったん下がった熱が再び上がって全身に発疹が出たという．予防接種は受けていないという．頬粘膜に白色の小斑点を認める．発疹は耳の後ろから始まり顔面と体幹へ広がり，一部は融合している．この疾患の二大死因はどれか．","options":[{"letter":"A","text":"肺炎と脳炎"},{"letter":"B","text":"消化管出血と腸閉塞"},{"letter":"C","text":"心筋炎と心内膜炎"},{"letter":"D","text":"急性腎不全と尿毒症"},{"letter":"E","text":"肝不全と肝性脳症"}],"answer":["A"],"multi":false,"explanation":"解説：一過性の細胞性免疫低下により細菌性肺炎を合併しやすく，これが最多の死因になる．急性脳炎は約1000人に1人に起こり，数年後に亜急性硬化性全脳炎を発症することもある．\n- A：この疾患の代表的な致死的合併症で正しい．\n- B：消化管出血と腸閉塞は腸重積や消化性潰瘍．\n- C：心筋炎はウイルス感染で起こりうるが，本疾患の二大死因ではない．\n- D：急性腎不全と尿毒症は溶血性尿毒症症候群など．\n- E：肝不全と肝性脳症は劇症肝炎．","images":[],"stem_images":[]},{"number":21,"section":"D-3-S06　6歳女児・かゆみを伴う全身の水疱","question":"（1/4）6歳の女児．昨日から37℃台の発熱があり，本日から体幹を中心に赤い発疹が出て強くかゆがるという．一部は水ぶくれになっている．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"園で同じ症状の子はいますか．"},{"letter":"B","text":"水痘ワクチンを受けましたか．"},{"letter":"C","text":"免疫を抑える治療はありますか．"},{"letter":"D","text":"歯の生え替わりは順調ですか．"},{"letter":"E","text":"水分や食事はとれますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．歯の発育は急な水疱性皮疹の初期評価では優先度が低い．\n- A：感染の機会を確認．\n- B：感染の可能性と重症化背景を評価．\n- C：重症化リスクを確認．\n- D：歯の発育は急な水疱性皮疹の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：全身状態と脱水を評価．","images":[],"stem_images":[]},{"number":22,"section":"D-3-S06　6歳女児・かゆみを伴う全身の水疱","question":"（2/4）6歳の女児．昨日から37℃台の発熱があり，本日から体幹を中心に赤い発疹が出て強くかゆがるという．一部は水ぶくれになっている．同じ保育園で数人が同様の症状だという．皮疹の特徴として正しいのはどれか．","options":[{"letter":"A","text":"新旧の皮疹が同時に混在する"},{"letter":"B","text":"皮疹が体の片側だけに出る"},{"letter":"C","text":"手掌と足底だけに限局する"},{"letter":"D","text":"頬から始まり四肢へ広がる"},{"letter":"E","text":"耳後部から始まり融合する"}],"answer":["A"],"multi":false,"explanation":"解説：紅斑・丘疹・水疱・膿疱・痂皮が同時に混じって存在するのがこの疾患の最大の特徴である．皮疹は体幹に多く，頭皮や口腔粘膜にも出る．すべてが痂皮化するまで感染力が続く．\n- A：この疾患に特徴的な皮疹の混在で正しい．\n- B：片側に限局するのは帯状疱疹．\n- C：手掌と足底の皮疹は第2期梅毒や手足口病．\n- D：頬から始まるのは伝染性紅斑．\n- E：耳後部から始まり融合するのは麻疹．","images":[],"stem_images":[]},{"number":23,"section":"D-3-S06　6歳女児・かゆみを伴う全身の水疱","question":"（3/4）6歳の女児．昨日から37℃台の発熱があり，本日から体幹を中心に赤い発疹が出て強くかゆがるという．一部は水ぶくれになっている．同じ保育園で数人が同様の症状だという．体幹と頭皮に紅斑・丘疹・水疱・痂皮が混在している．登園の可否について正しいのはどれか．","options":[{"letter":"A","text":"解熱すれば翌日から登園できる"},{"letter":"B","text":"発疹が出た日から3日で登園できる"},{"letter":"C","text":"発疹が痂皮化しきるまで休む"},{"letter":"D","text":"水疱が出た時点で登園してよい"},{"letter":"E","text":"家族に発症者がいなければ登園できる"}],"answer":["C"],"multi":false,"explanation":"解説：学校保健安全法ではすべての発疹が痂皮化するまで出席停止と定められている．痂皮になれば感染性が失われるためで，解熱の有無や発症からの日数では判断しない．\n- A：解熱しても痂皮化していなければ感染力が残る．\n- B：日数で一律に決める基準ではない．\n- C：法令上の基準として正しい．\n- D：水疱の段階が最も感染力の強い時期にあたる．\n- E：家族の発症状況は本人の感染性と無関係．","images":[],"stem_images":[]},{"number":24,"section":"D-3-S06　6歳女児・かゆみを伴う全身の水疱","question":"（4/4）6歳の女児．昨日から37℃台の発熱があり，本日から体幹を中心に赤い発疹が出て強くかゆがるという．一部は水ぶくれになっている．同じ保育園で数人が同様の症状だという．体幹と頭皮に紅斑・丘疹・水疱・痂皮が混在し，口腔粘膜にも小さなびらんを認める．治癒後にこのウイルスが潜伏する部位はどれか．","options":[{"letter":"A","text":"唾液腺の導管上皮"},{"letter":"B","text":"骨髄の造血幹細胞"},{"letter":"C","text":"肝細胞の核内"},{"letter":"D","text":"末梢血のBリンパ球"},{"letter":"E","text":"脊髄後根神経節"}],"answer":["E"],"multi":false,"explanation":"解説：初感染後にウイルスは知覚神経節に潜伏し，加齢・疲労・免疫抑制で再活性化して支配領域の皮膚に帯状疱疹を起こす．したがって帯状疱疹は初感染ではなく再活性化である．\n- A：唾液腺に潜伏するのはサイトメガロウイルスなど．\n- B：骨髄の造血幹細胞に潜伏するウイルスは想定されない．\n- C：肝細胞の核内に持続するのはB型肝炎ウイルス．\n- D：Bリンパ球に潜伏するのはEBウイルス．\n- E：帯状疱疹の発症機序を説明し正しい．","images":[],"stem_images":[]},{"number":25,"section":"D-3-S07　8歳女児・頬の紅斑","question":"（1/4）8歳の女児．2日前から両方の頬が赤くなり，本日は腕と太ももにも網目状の赤みが出てきたという．発熱はほとんどない．皮疹に先行する感染症状を保護者に確認する質問はどれか．","options":[{"letter":"A","text":"家族にも今，発疹がありますか．"},{"letter":"B","text":"1週間ほど前に微熱や風邪症状がありましたか．"},{"letter":"C","text":"最近，新しい薬を飲みましたか．"},{"letter":"D","text":"発疹が出てからかゆいですか．"},{"letter":"E","text":"発疹は日光で濃くなりますか．"}],"answer":["B"],"multi":false,"explanation":"解説：この疾患では発疹が出る1週間ほど前に微熱や感冒様症状があり，その時期こそが感染力の強い時期にあたる．発疹が出た時点では既にウイルスは排出されていないため，登園を制限する必要がない．\n- A：現在の接触状況に関する情報．\n- B：感染時期の推定と登園の可否に直結し有用．\n- C：薬剤への曝露に関する情報．\n- D：皮疹の随伴症状に関する情報．\n- E：皮疹の増悪因子に関する情報．","images":[],"stem_images":[]},{"number":26,"section":"D-3-S07　8歳女児・頬の紅斑","question":"（2/4）8歳の女児．2日前から両方の頬が赤くなり，本日は腕と太ももにも網目状の赤みが出てきたという．発熱はほとんどない．1週間前に微熱と鼻汁があったという．認められる所見はどれか．","options":[{"letter":"A","text":"耳後部と後頸部のリンパ節腫脹"},{"letter":"B","text":"頬粘膜の白色の小斑点"},{"letter":"C","text":"両頬の境界明瞭な紅斑"},{"letter":"D","text":"紅斑上に集簇する小水疱"},{"letter":"E","text":"環状に広がる鱗屑性紅斑"}],"answer":["C"],"multi":false,"explanation":"解説：両頬に平手打ち様の境界明瞭な紅斑が出て，遅れて四肢にレース状・網目状の紅斑が広がる．日光や入浴で再燃を繰り返すことがあるが，これは再感染ではない．\n- A：耳後部と後頸部のリンパ節腫脹は風疹に特徴的．\n- B：頬粘膜の白色小斑点は麻疹のKoplik斑．\n- C：この疾患の典型的な皮疹で正しい．\n- D：紅斑上の集簇性小水疱は帯状疱疹．\n- E：環状の鱗屑性紅斑は体部白癬．","images":[],"stem_images":[]},{"number":27,"section":"D-3-S07　8歳女児・頬の紅斑","question":"（3/4）8歳の女児．2日前から両方の頬が赤くなり，本日は腕と太ももにも網目状の赤みが出てきたという．発熱はほとんどない．1週間前に微熱と鼻汁があったという．両頬に境界明瞭な紅斑を認め，四肢にレース状の紅斑が広がっている．同居家族への説明で最も重要なのはどれか．","options":[{"letter":"A","text":"家族全員に抗ウイルス薬が要る"},{"letter":"B","text":"患児は痂皮化まで登校できない"},{"letter":"C","text":"全員が陰圧個室での管理を要する"},{"letter":"D","text":"家族全員にワクチンを接種する"},{"letter":"E","text":"妊婦との接触は胎児に影響しうる"}],"answer":["E"],"multi":false,"explanation":"解説：この病原体は胎児の赤芽球に感染して高度の貧血を起こし，胎児水腫や流死産に至ることがある．妊婦が濃厚接触した場合は抗体検査と胎児超音波での経過観察が必要になる．\n- A：健常児では対症療法のみでよく，抗ウイルス薬は存在しない．\n- B：発疹出現時には感染力がなく，登校を制限しない．\n- C：陰圧個室が要るのは麻疹や水痘．\n- D：この疾患に対するワクチンはない．\n- E：最も重大な影響であり正しい．","images":[],"stem_images":[]},{"number":28,"section":"D-3-S07　8歳女児・頬の紅斑","question":"（4/4）8歳の女児．2日前から両方の頬が赤くなり，本日は腕と太ももにも網目状の赤みが出てきたという．発熱はほとんどない．1週間前に微熱と鼻汁があったという．両頬に境界明瞭な紅斑を認め，四肢にレース状の紅斑が広がっている．同じく小児に発疹をきたし，耳後部と後頸部のリンパ節腫脹を伴い妊婦への感染が問題になるのはどれか．","options":[{"letter":"A","text":"伝染性軟属腫"},{"letter":"B","text":"手足口病"},{"letter":"C","text":"突発性発疹"},{"letter":"D","text":"風疹"},{"letter":"E","text":"帯状疱疹"}],"answer":["D"],"multi":false,"explanation":"解説：風疹は淡い紅斑が顔から全身に広がり3日ほどで消える．耳後部・後頸部・後頭部のリンパ節腫脹が特徴的で，妊娠初期の感染は白内障・心奇形・難聴を三徴とする先天性風疹症候群を起こす．\n- A：伝染性軟属腫は中央が臍窩状にくぼむ丘疹で，発熱もリンパ節腫脹も伴わない．\n- B：手足口病は手掌・足底・口腔の水疱性発疹．\n- C：突発性発疹は高熱が3日続いた後の解熱とともに体幹に発疹が出る．\n- D：リンパ節腫脹と胎児への影響の両方が当てはまり正しい．\n- E：帯状疱疹は片側性・帯状の集簇性小水疱．","images":[],"stem_images":[]},{"number":29,"section":"D-3-S08　24歳女性・口唇の繰り返す小水疱","question":"（1/4）24歳の女性．口唇の縁にピリピリした違和感の後，小さな水ぶくれが数個集まって出たという．同じことを年に数回繰り返している．局所での再発性を確認するための質問はどれか．","options":[{"letter":"A","text":"毎回同じ場所に出ますか．"},{"letter":"B","text":"水疱の前に痛みがありますか．"},{"letter":"C","text":"今回は日焼けをしましたか．"},{"letter":"D","text":"何日ほどでかさぶたになりますか．"},{"letter":"E","text":"飲み込みにくさはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：同じ神経節に潜伏したウイルスが再活性化するため，皮疹はほぼ同じ部位に繰り返し出る．この再発部位の一致が，接触皮膚炎や固定薬疹との鑑別を含めて診断の大きな手がかりになる．\n- A：再活性化という機序を直接示し有用．\n- B：前駆症状に関する情報．\n- C：再発の誘因に関する情報．\n- D：一回の経過に関する情報．\n- E：病変の広がりに関する情報．","images":[],"stem_images":[]},{"number":30,"section":"D-3-S08　24歳女性・口唇の繰り返す小水疱","question":"（2/4）24歳の女性．口唇の縁にピリピリした違和感の後，小さな水ぶくれが数個集まって出たという．同じことを年に数回繰り返している．毎回ほぼ同じ場所に出るという．再発の誘因として典型的なのはどれか．","options":[{"letter":"A","text":"脂肪の多い食事をとること"},{"letter":"B","text":"就寝前に水分を多くとること"},{"letter":"C","text":"冷たい飲み物を飲むこと"},{"letter":"D","text":"室内で長時間過ごすこと"},{"letter":"E","text":"発熱や強い日焼けをすること"}],"answer":["E"],"multi":false,"explanation":"解説：発熱・紫外線・月経・疲労・ストレス・免疫抑制が再活性化の引き金になる．発熱に伴って出ることから「熱の華」とも呼ばれ，誘因を避けることが再発予防の基本になる．\n- A：脂肪の多い食事は胆石発作や膵炎の誘因．\n- B：就寝前の水分摂取は夜間頻尿に関わる．\n- C：冷たい飲み物は知覚過敏や機能性消化管障害の誘因．\n- D：室内で過ごすことはむしろ紫外線曝露を減らす．\n- E：代表的な再活性化の誘因で正しい．","images":[],"stem_images":[]},{"number":31,"section":"D-3-S08　24歳女性・口唇の繰り返す小水疱","question":"（3/4）24歳の女性．口唇の縁にピリピリした違和感の後，小さな水ぶくれが数個集まって出たという．同じことを年に数回繰り返している．毎回ほぼ同じ場所に出るという．今回は海水浴で日焼けした翌日に出現した．治療として適切なのはどれか．","options":[{"letter":"A","text":"抗菌薬の全身投与を行う"},{"letter":"B","text":"抗真菌薬の外用を続ける"},{"letter":"C","text":"副腎皮質ステロイドを外用する"},{"letter":"D","text":"抗ウイルス薬を早期から用いる"},{"letter":"E","text":"抗ヒスタミン薬の内服のみとする"}],"answer":["D"],"multi":false,"explanation":"解説：前駆症状の段階で抗ウイルス薬を始めると，皮疹の期間が短くなる．再発が頻回な例では発症時に自分で服用する方式や，抑制療法としての連日内服も選択肢になる．\n- A：抗菌薬は細菌感染の治療で，二次感染がなければ不要．\n- B：抗真菌薬は真菌症の治療．\n- C：ステロイド外用はウイルスの増殖を助長しうる．\n- D：発症早期の投与が有効で正しい．\n- E：抗ヒスタミン薬は症状を抑えるだけで原因に作用しない．","images":[],"stem_images":[]},{"number":32,"section":"D-3-S08　24歳女性・口唇の繰り返す小水疱","question":"（4/4）24歳の女性．口唇の縁にピリピリした違和感の後，小さな水ぶくれが数個集まって出たという．同じことを年に数回繰り返している．毎回ほぼ同じ場所に出るという．今回は海水浴で日焼けした翌日に出現し，口唇の縁に径2mmほどの小水疱が5個ほど集まっている．同じウイルスがアトピー性皮膚炎の患者の顔面に広範に播種した病態はどれか．","options":[{"letter":"A","text":"ブドウ球菌性熱傷様皮膚症候群"},{"letter":"B","text":"カポジ水痘様発疹症"},{"letter":"C","text":"伝染性膿痂疹"},{"letter":"D","text":"中毒性表皮壊死症"},{"letter":"E","text":"尋常性乾癬"}],"answer":["B"],"multi":false,"explanation":"解説：バリア機能の壊れた皮膚に単純ヘルペスウイルスが広く播種し，高熱とともに顔面を中心に多数の小水疱とびらんが出る．全身管理と抗ウイルス薬の全身投与を要する緊急性の高い病態である．\n- A：ブドウ球菌性熱傷様皮膚症候群は毒素による表皮剝離で，水疱は集簇しない．\n- B：単純ヘルペスの播種による病態で正しい．\n- C：伝染性膿痂疹は細菌感染で，蜜色の痂皮を伴う．\n- D：中毒性表皮壊死症は薬剤性の広範な表皮壊死．\n- E：尋常性乾癬は銀白色の鱗屑を伴う慢性の紅斑局面．","images":[],"stem_images":[]},{"number":33,"section":"D-3-S09　22歳男性・外陰部の隆起性病変","question":"（1/4）22歳の男性．3か月前から陰茎に小さな盛り上がりが増えてきたという．痛みやかゆみはない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"相手にも病変がありますか．"},{"letter":"B","text":"性交渉の状況を伺えますか．"},{"letter":"C","text":"以前も同じ病変が出ましたか．"},{"letter":"D","text":"免疫を抑える治療はありますか．"},{"letter":"E","text":"歩くと膝が痛みますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．膝の機械的な痛みは局所病変の評価では優先度が低い．\n- A：接触者の感染を検討．\n- B：感染への曝露を確認．\n- C：再発性を確認．\n- D：難治化の背景を確認．\n- E：膝の機械的な痛みは局所病変の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":34,"section":"D-3-S09　22歳男性・外陰部の隆起性病変","question":"（2/4）22歳の男性．3か月前から陰茎に小さな盛り上がりが増えてきたという．痛みやかゆみはない．半年前から新しいパートナーがおり，コンドームは使っていないという．認められる所見はどれか．","options":[{"letter":"A","text":"鶏冠状に隆起する乳頭腫状の病変"},{"letter":"B","text":"中央が陥凹した無痛性の硬い潰瘍"},{"letter":"C","text":"紅斑上に集簇する有痛性の小水疱"},{"letter":"D","text":"蜜色の痂皮に覆われたびらん"},{"letter":"E","text":"銀白色の鱗屑を伴う境界明瞭な局面"}],"answer":["A"],"multi":false,"explanation":"解説：表面が細かく分葉して鶏冠状・カリフラワー状に盛り上がるのがこの病変の形態である．ヒトパピローマウイルス6型・11型が原因で，悪性化することはまれだが再発しやすい．\n- A：この疾患の典型的な形態で正しい．\n- B：無痛性の硬い潰瘍は梅毒の硬性下疳．\n- C：有痛性の集簇性小水疱は性器ヘルペス．\n- D：蜜色の痂皮は伝染性膿痂疹．\n- E：銀白色の鱗屑を伴う局面は尋常性乾癬．","images":[],"stem_images":[]},{"number":35,"section":"D-3-S09　22歳男性・外陰部の隆起性病変","question":"（3/4）22歳の男性．3か月前から陰茎に小さな盛り上がりが増えてきたという．痛みやかゆみはない．半年前から新しいパートナーがおり，コンドームは使っていないという．陰茎に鶏冠状の乳頭腫状病変を多発性に認める．併せて行うべきなのはどれか．","options":[{"letter":"A","text":"骨密度の測定を行う"},{"letter":"B","text":"他の性感染症の検査を行う"},{"letter":"C","text":"呼吸機能検査を行う"},{"letter":"D","text":"骨シンチグラフィを行う"},{"letter":"E","text":"頸動脈の超音波検査を行う"}],"answer":["B"],"multi":false,"explanation":"解説：性感染症は重複することが多いため，梅毒血清反応・HIV抗体・クラミジアと淋菌の核酸増幅検査を併せて行う．パートナーの検査と治療も同時に進めないと再感染を繰り返す．\n- A：骨密度は骨粗鬆症の評価．\n- B：重複感染の検索として必須で正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：骨シンチグラフィは骨病変の検索．\n- E：頸動脈超音波は動脈硬化の評価．","images":[],"stem_images":[]},{"number":36,"section":"D-3-S09　22歳男性・外陰部の隆起性病変","question":"（4/4）22歳の男性．3か月前から陰茎に小さな盛り上がりが増えてきたという．痛みやかゆみはない．半年前から新しいパートナーがおり，コンドームは使っていないという．陰茎に鶏冠状の乳頭腫状病変を多発性に認め，梅毒血清反応とHIV抗体はいずれも陰性であった．小児の体幹によくみられ，中央が臍窩状にくぼむ常色の丘疹をつくるのはどれか．","options":[{"letter":"A","text":"尋常性疣贅"},{"letter":"B","text":"脂漏性角化症"},{"letter":"C","text":"尋常性痤瘡"},{"letter":"D","text":"伝染性軟属腫"},{"letter":"E","text":"稗粒腫"}],"answer":["D"],"multi":false,"explanation":"解説：ポックスウイルスによる表皮の増殖で，直径数mmの光沢のある常色丘疹の中央が臍のようにくぼむ．圧出すると白色の粥状物が出る．プールなどでの接触で広がり，多くは自然に消える．\n- A：尋常性疣贅は表面が粗く角化した硬い丘疹．\n- B：脂漏性角化症は高齢者の褐色で疣状の隆起．\n- C：尋常性痤瘡は毛包に一致した面皰と炎症性丘疹．\n- D：形態と好発年齢の両方が当てはまり正しい．\n- E：稗粒腫は角質を含む白色の小さな嚢腫．","images":[],"stem_images":[]}],"seed":null},{"id":"D-4_運動器系","name":"D-4_運動器系.md","label":"D-4 運動器系","count":28,"sourceHash":"045771ee2443","questions":[{"number":1,"section":"D-4-S01　24歳男性・転落後の下肢麻痺","question":"（1/4）24歳の男性．工事現場で3mの高さから転落し救急搬送された．両下肢がまったく動かず，感覚もないという．意識は清明である．神経障害の高位を推定するために確認する情報はどれか．","options":[{"letter":"A","text":"感覚が鈍くなる境目の高さ"},{"letter":"B","text":"下肢の腱反射が消失しているか"},{"letter":"C","text":"尿意を感じて排尿できるか"},{"letter":"D","text":"会陰部の感覚が残っているか"},{"letter":"E","text":"肛門括約筋を随意に収縮できるか"}],"answer":["A"],"multi":false,"explanation":"解説：感覚障害の上縁が損傷高位を示し，運動麻痺の範囲・腱反射・肛門周囲の感覚と併せて神経学的高位を決める．高位が呼吸筋支配に及ぶかどうかが，その場の生命管理を左右する．\n- A：損傷高位の決定に直結し有用．\n- B：脊髄ショックの徴候に関する情報．\n- C：膀胱機能に関する情報．\n- D：仙髄領域の温存に関する情報．\n- E：仙髄運動機能に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-4-S01　24歳男性・転落後の下肢麻痺","question":"（2/4）24歳の男性．工事現場で3mの高さから転落し救急搬送された．両下肢がまったく動かず，感覚もないという．意識は清明である．感覚は乳頭の高さから下で消失していた．受傷直後に予想される所見はどれか．","options":[{"letter":"A","text":"両下肢の腱反射が亢進する"},{"letter":"B","text":"両下肢にBabinski徴候が出る"},{"letter":"C","text":"両下肢は弛緩し腱反射が消失する"},{"letter":"D","text":"両下肢に歯車様の筋強剛が出る"},{"letter":"E","text":"両下肢に安静時の振戦が現れる"}],"answer":["C"],"multi":false,"explanation":"解説：受傷直後は脊髄ショックの時期で，損傷高位以下のすべての脊髄機能が一時的に停止する．弛緩性麻帯と腱反射消失を示し，数日から数週かけて痙性麻痺と反射亢進へ移行する．\n- A：腱反射の亢進は脊髄ショックを脱した後に現れる．\n- B：Babinski徴候も回復期に陽性化する．\n- C：受傷直後の状態として正しい．\n- D：歯車様筋強剛はParkinson病の錐体外路症状．\n- E：安静時振戦もParkinson病の所見．","images":[],"stem_images":[]},{"number":3,"section":"D-4-S01　24歳男性・転落後の下肢麻痺","question":"（3/4）24歳の男性．工事現場で3mの高さから転落し救急搬送された．両下肢がまったく動かず，感覚もないという．意識は清明である．感覚は乳頭の高さから下で消失していた．両下肢は弛緩し腱反射は消失している．脈拍48/分，血圧78/44mmHg．四肢は温かく乾いている．この循環動態の機序はどれか．","options":[{"letter":"A","text":"出血による循環血液量の減少"},{"letter":"B","text":"心筋の収縮力が急激に落ちたため"},{"letter":"C","text":"心嚢液貯留による拡張の障害"},{"letter":"D","text":"肺動脈が血栓で閉塞したため"},{"letter":"E","text":"交感神経の遮断による血管拡張"}],"answer":["E"],"multi":false,"explanation":"解説：高位胸髄損傷では交感神経の下行路が障害され，血管拡張と徐脈を伴う神経原性ショックを起こしうる．出血性ショックを先に除外する．腱反射消失を示す脊髄ショックとは異なる概念である．\n- A：出血性ショックでは頻脈となり四肢は冷たく湿る．\n- B：心原性ショックでも頻脈と末梢冷感を伴う．\n- C：心タンポナーデでは頸静脈怒張と奇脈を伴う．\n- D：肺血栓塞栓症では呼吸困難と低酸素血症が前景に立つ．\n- E：徐脈と温かい四肢を説明でき正しい．","images":[],"stem_images":[]},{"number":4,"section":"D-4-S01　24歳男性・転落後の下肢麻痺","question":"（4/4）24歳の男性．工事現場で3mの高さから転落し救急搬送された．両下肢がまったく動かず，感覚もないという．意識は清明である．感覚は乳頭の高さから下で消失していた．両下肢は弛緩し腱反射は消失している．脈拍48/分，血圧78/44mmHg．四肢は温かく乾いている．第3〜4胸椎に脱臼骨折を認めた．急性期に最も注意すべき合併症はどれか．","options":[{"letter":"A","text":"関節の急速な拘縮が進むこと"},{"letter":"B","text":"尿閉と膀胱の過伸展が起こること"},{"letter":"C","text":"骨密度が急速に低下すること"},{"letter":"D","text":"筋力が徐々に落ちていくこと"},{"letter":"E","text":"下肢の深部静脈に血栓ができること"}],"answer":["B"],"multi":false,"explanation":"解説：仙髄の排尿中枢との連絡が絶たれるため尿がまったく出せなくなる．放置すると膀胱が過伸展して不可逆的な機能障害と水腎症を招くので，早期の導尿と持続的な排尿管理が要る．\n- A：拘縮は数週以降に問題となり，急性期の緊急課題ではない．\n- B：急性期に直ちに対処すべき障害で正しい．\n- C：不動性骨萎縮も慢性期の問題．\n- D：損傷高位以下の筋力低下は受傷時点で完成している．\n- E：深部静脈血栓症も重要だが，受傷直後より数日以降に問題になる．","images":[],"stem_images":[]},{"number":5,"section":"D-4-S02　79歳女性・転倒後の股関節痛","question":"（1/4）79歳の女性．自宅の廊下でつまずいて転倒し，右の股関節が痛くて立てないという．意識は清明で，ほかに外傷はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"転ぶ前に意識が遠のきましたか．"},{"letter":"B","text":"普段は一人で歩けていますか．"},{"letter":"C","text":"春になると鼻水が出ますか．"},{"letter":"D","text":"以前に骨折したことがありますか．"},{"letter":"E","text":"血を固まりにくくする薬を飲みますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．季節性鼻炎は今回の転倒・骨折評価では優先度が低い．\n- A：失神が転倒原因か確認．\n- B：受傷前の機能を確認．\n- C：季節性鼻炎は今回の転倒・骨折評価では優先度が低い．この設問で選ぶ肢．\n- D：骨脆弱性の背景を確認．\n- E：出血と処置のリスクを確認．","images":[],"stem_images":[]},{"number":6,"section":"D-4-S02　79歳女性・転倒後の股関節痛","question":"（2/4）79歳の女性．自宅の廊下でつまずいて転倒し，右の股関節が痛くて立てないという．意識は清明で，ほかに外傷はない．3年前に手首を骨折したことがあるという．認められる所見はどれか．","options":[{"letter":"A","text":"右下肢が延長し内旋する"},{"letter":"B","text":"右下肢が短縮し外旋する"},{"letter":"C","text":"右膝に強い熱感と発赤が出る"},{"letter":"D","text":"右足背動脈が触知できない"},{"letter":"E","text":"右下肢の腱反射が亢進する"}],"answer":["B"],"multi":false,"explanation":"解説：骨折部で連続性が絶たれ，腸腰筋と外旋筋群の牽引により患肢は短縮して外旋位をとる．自動的な下肢挙上ができず，踵を叩くと股関節に痛みが響く．\n- A：延長と内旋は後方脱臼とは逆の所見で，典型的ではない．\n- B：大腿骨近位部骨折の典型的な肢位で正しい．\n- C：熱感と発赤は化膿性関節炎や結晶性関節炎．\n- D：足背動脈の触知不能は動脈損傷や閉塞性動脈硬化症．\n- E：腱反射の亢進は錐体路障害．","images":[],"stem_images":[]},{"number":7,"section":"D-4-S02　79歳女性・転倒後の股関節痛","question":"（3/4）79歳の女性．自宅の廊下でつまずいて転倒し，右の股関節が痛くて立てないという．意識は清明で，ほかに外傷はない．3年前に手首を骨折したことがあるという．右下肢は短縮し外旋位をとる．エックス線写真で右大腿骨頸部に骨折線を認めた．方針として最も適切なのはどれか．","options":[{"letter":"A","text":"3か月の床上安静で保存的に治す"},{"letter":"B","text":"牽引のみで6週間経過をみる"},{"letter":"C","text":"早期に手術を行い離床を進める"},{"letter":"D","text":"装具をつけて外来で経過をみる"},{"letter":"E","text":"鎮痛薬のみで自然癒合を待つ"}],"answer":["C"],"multi":false,"explanation":"解説：高齢者の長期臥床は肺炎・褥瘡・深部静脈血栓症・認知機能低下を招き，生命予後を著しく悪化させる．できるだけ早く手術して痛みを取り，翌日から荷重と歩行練習を始めるのが原則である．\n- A：長期床上安静は合併症を招き，現在では選択されない．\n- B：牽引のみでは癒合が得られず臥床期間も長くなる．\n- C：早期手術と早期離床が標準で正しい．\n- D：装具では骨折部を安定させられない．\n- E：自然癒合を待つ方針は偽関節と長期臥床を招く．","images":[],"stem_images":[]},{"number":8,"section":"D-4-S02　79歳女性・転倒後の股関節痛","question":"（4/4）79歳の女性．自宅の廊下でつまずいて転倒し，右の股関節が痛くて立てないという．意識は清明で，ほかに外傷はない．3年前に手首を骨折したことがあるという．右下肢は短縮し外旋位をとる．エックス線写真で右大腿骨頸部に骨折線を認めた．手術後に二次骨折を防ぐために行うべきなのはどれか．","options":[{"letter":"A","text":"骨密度を測り薬物治療を始める"},{"letter":"B","text":"蛋白質の摂取を厳しく制限する"},{"letter":"C","text":"水分摂取を1日500mLに制限する"},{"letter":"D","text":"日光をまったく浴びないようにする"},{"letter":"E","text":"転倒予防のため終日臥床とする"}],"answer":["A"],"multi":false,"explanation":"解説：脆弱性骨折を起こした時点で薬物治療の適応があり，骨密度と骨代謝マーカーを測ってビスホスホネートや抗RANKL抗体を開始する．カルシウムとビタミンDの補充，転倒予防も併せて行う．\n- A：次の骨折を防ぐ標準的な対応で正しい．\n- B：蛋白制限はむしろ筋肉量と骨質を落とす．\n- C：厳しい水分制限は脱水と腎機能障害を招く．\n- D：日光はビタミンD産生に必要で，避けるのは逆効果．\n- E：終日臥床は骨密度をさらに下げ，合併症も増やす．","images":[],"stem_images":[]},{"number":9,"section":"D-4-S03　38歳男性・腰痛と下肢への放散痛","question":"（1/4）38歳の男性．1週間前に重い荷物を持ち上げてから腰が痛み，右の太もも裏からふくらはぎへ痛みが走るという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"咳やくしゃみで痛みが増しますか．"},{"letter":"B","text":"足首を持ち上げにくいですか．"},{"letter":"C","text":"発熱や体重減少はありますか．"},{"letter":"D","text":"尿が出にくくなりましたか．"},{"letter":"E","text":"以前から乗り物酔いをしますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．乗り物酔いの既往は放散痛の評価では優先度が低い．\n- A：神経根刺激による増悪を確認．\n- B：運動麻痺の有無を確認．\n- C：感染や腫瘍の警告徴候を確認．\n- D：馬尾障害の警告徴候を確認．\n- E：乗り物酔いの既往は放散痛の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":10,"section":"D-4-S03　38歳男性・腰痛と下肢への放散痛","question":"（2/4）38歳の男性．1週間前に重い荷物を持ち上げてから腰が痛み，右の太もも裏からふくらはぎへ痛みが走るという．咳やくしゃみで痛みが強まるという．診察で行うべき手技はどれか．","options":[{"letter":"A","text":"仰臥位で下肢を伸ばしたまま挙上する"},{"letter":"B","text":"足関節を背屈させて腓腹部の痛みをみる"},{"letter":"C","text":"頸部を前屈させて抵抗をみる"},{"letter":"D","text":"上方を注視させ続けて眼瞼をみる"},{"letter":"E","text":"足底を擦って母趾の動きをみる"}],"answer":["A"],"multi":false,"explanation":"解説：下肢伸展挙上試験では，坐骨神経が伸展されて神経根が牽引され，70度未満の挙上で放散痛が誘発されれば陽性となる．L4/5・L5/S1 の病変を反映する簡便な診察法である．\n- A：神経根の牽引を利用した診察で正しい．\n- B：足関節背屈はHomans徴候の診察で，深部静脈血栓症の評価．\n- C：頸部前屈は髄膜刺激徴候の診察．\n- D：上方注視の持続は重症筋無力症の疲労試験．\n- E：足底の擦過はBabinski徴候の診察．","images":[],"stem_images":[]},{"number":11,"section":"D-4-S03　38歳男性・腰痛と下肢への放散痛","question":"（3/4）38歳の男性．1週間前に重い荷物を持ち上げてから腰が痛み，右の太もも裏からふくらはぎへ痛みが走るという．咳やくしゃみで痛みが強まるという．右の下肢伸展挙上試験が40度で陽性である．足趾の背屈力がやや低下し，右足背の感覚が鈍い．膀胱直腸障害はない．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに緊急手術を行う"},{"letter":"B","text":"全身への抗菌薬投与を始める"},{"letter":"C","text":"保存療法で経過をみる"},{"letter":"D","text":"副腎皮質ステロイドを大量に用いる"},{"letter":"E","text":"患肢を長期にギプス固定する"}],"answer":["C"],"multi":false,"explanation":"解説：突出した髄核は時間とともに縮小し，多くは数週から数か月で軽快する．鎮痛薬と生活指導，必要に応じて神経根ブロックを行い，日常生活は可能な範囲で続けるほうが経過がよい．\n- A：緊急手術は膀胱直腸障害や急速に進む麻痺がある場合に限る．\n- B：抗菌薬は感染症の治療で，本例には適応がない．\n- C：自然経過が良好であり正しい．\n- D：ステロイド大量投与は標準的な治療ではない．\n- E：長期固定はむしろ筋力低下と回復の遅れを招く．","images":[],"stem_images":[]},{"number":12,"section":"D-4-S03　38歳男性・腰痛と下肢への放散痛","question":"（4/4）38歳の男性．1週間前に重い荷物を持ち上げてから腰が痛み，右の太もも裏からふくらはぎへ痛みが走るという．咳やくしゃみで痛みが強まるという．右の下肢伸展挙上試験が40度で陽性である．足趾の背屈力がやや低下し，右足背の感覚が鈍い．膀胱直腸障害はない．直ちに手術を考慮すべき所見はどれか．","options":[{"letter":"A","text":"痛みが夜間に強くなること"},{"letter":"B","text":"会陰部の感覚が鈍く尿が出ないこと"},{"letter":"C","text":"下肢伸展挙上試験が30度で陽性になること"},{"letter":"D","text":"腰の前屈で痛みが増強すること"},{"letter":"E","text":"痛みが2週間以上続いていること"}],"answer":["B"],"multi":false,"explanation":"解説：会陰部の感覚障害と排尿障害は馬尾症候群を示し，放置すると不可逆的な障害を残す．両下肢の麻痺と併せて緊急手術の適応になる．進行する運動麻痺も同様に待てない所見である．\n- A：夜間痛は腫瘍や感染も示唆するが，それ自体は緊急手術の根拠にならない．\n- B：馬尾症候群を示し緊急手術の適応で正しい．\n- C：挙上角度が小さいのは重症度を示すが，手術の絶対適応ではない．\n- D：前屈での増強はこの疾患に一般的な所見．\n- E：数週の経過は保存療法の範囲内である．","images":[],"stem_images":[]},{"number":13,"section":"D-4-S04　72歳男性・歩くと出る下肢のしびれ","question":"（1/4）72歳の男性．半年前から歩いていると両脚がしびれて重くなり，休むと歩けるようになるという．次第に歩ける距離が短くなった．神経性と血管性の間欠性跛行を鑑別する質問はどれか．","options":[{"letter":"A","text":"痛みは休息で軽くなりますか．"},{"letter":"B","text":"何mほど歩くと症状が出ますか．"},{"letter":"C","text":"前かがみになると楽になりますか．"},{"letter":"D","text":"左右のどちらが強いですか．"},{"letter":"E","text":"いつから歩きにくくなりましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：前屈や坐位で脊柱管が広がり症状が軽くなるのがこの疾患の特徴である．自転車なら長く漕げる，買い物カートを押すと歩けるといった訴えも同じ機序で，血管性の跛行との区別に直結する．\n- A：両者に共通する休息反応に関する情報．\n- B：歩行能力に関する情報．\n- C：姿勢依存性を確かめるもので有用．\n- D：左右差に関する情報．\n- E：発症時期に関する情報．","images":[],"stem_images":[]},{"number":14,"section":"D-4-S04　72歳男性・歩くと出る下肢のしびれ","question":"（2/4）72歳の男性．半年前から歩いていると両脚がしびれて重くなり，休むと歩けるようになるという．次第に歩ける距離が短くなった．前かがみになると症状が軽くなり，自転車なら長く漕げるという．認められる所見はどれか．","options":[{"letter":"A","text":"足背動脈の拍動が触れない"},{"letter":"B","text":"足関節上腕血圧比が0.6と低い"},{"letter":"C","text":"患肢の皮膚が冷たく体毛が薄い"},{"letter":"D","text":"足背動脈の拍動は良好に触れる"},{"letter":"E","text":"下肢に強い熱感と発赤を認める"}],"answer":["D"],"multi":false,"explanation":"解説：症状の原因は神経の圧迫であって血流ではないため，末梢動脈の拍動は保たれ足関節上腕血圧比も正常である．この一点が閉塞性動脈硬化症による血管性間欠跛行との決定的な差になる．\n- A：拍動の消失は閉塞性動脈硬化症．\n- B：足関節上腕血圧比の低下も動脈狭窄を示す．\n- C：皮膚の冷感と脱毛は慢性の動脈血流低下の所見．\n- D：神経性であることを裏づけ正しい．\n- E：熱感と発赤は感染症や結晶性関節炎．","images":[],"stem_images":[]},{"number":15,"section":"D-4-S04　72歳男性・歩くと出る下肢のしびれ","question":"（3/4）72歳の男性．半年前から歩いていると両脚がしびれて重くなり，休むと歩けるようになるという．次第に歩ける距離が短くなった．前かがみになると症状が軽くなり，自転車なら長く漕げるという．両側の足背動脈は良好に触知でき，足関節上腕血圧比は1.05であった．診断に最も有用な検査はどれか．","options":[{"letter":"A","text":"下肢の静脈超音波検査"},{"letter":"B","text":"腰椎のMRI撮影"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"呼吸機能検査の施行"},{"letter":"E","text":"頸動脈の超音波検査"}],"answer":["B"],"multi":false,"explanation":"解説：MRIで脊柱管の前後径，黄色靱帯の肥厚，椎間板の膨隆，馬尾の圧迫像を確認する．立位や後屈で症状が出るため，必要に応じて機能撮影や脊髄造影で動的な狭窄を評価する．\n- A：下肢静脈超音波は深部静脈血栓症の検索．\n- B：圧迫の部位と程度を直接示し正しい．\n- C：骨シンチグラフィは骨転移や炎症の検索．\n- D：呼吸機能検査は換気障害の評価．\n- E：頸動脈超音波は動脈硬化の評価．","images":[],"stem_images":[]},{"number":16,"section":"D-4-S04　72歳男性・歩くと出る下肢のしびれ","question":"（4/4）72歳の男性．半年前から歩いていると両脚がしびれて重くなり，休むと歩けるようになるという．次第に歩ける距離が短くなった．前かがみになると症状が軽くなり，自転車なら長く漕げるという．両側の足背動脈は良好に触知でき，足関節上腕血圧比は1.05であった．腰椎MRIでL4/5に高度の脊柱管狭窄を認めた．症状が姿勢で変わる理由はどれか．","options":[{"letter":"A","text":"前屈で下肢の動脈血流が増えるため"},{"letter":"B","text":"前屈で腹腔内圧が下がるため"},{"letter":"C","text":"前屈で椎間板への荷重が消えるため"},{"letter":"D","text":"前屈で脊柱管の断面積が広がるため"},{"letter":"E","text":"前屈で下肢の筋の酸素消費が減るため"}],"answer":["D"],"multi":false,"explanation":"解説：後屈すると黄色靱帯がたわんで脊柱管に突出し，椎間板も後方へ膨隆して馬尾が圧迫される．前屈ではこれが解けて断面積が広がり，馬尾への圧が下がって症状が軽くなる．\n- A：動脈血流は姿勢でほとんど変わらず，本例では血流自体が保たれている．\n- B：腹腔内圧の変化は馬尾の圧迫と直接関係しない．\n- C：前屈では椎間板前方への荷重はむしろ増える．\n- D：姿勢依存性の機序として正しい．\n- E：下肢の筋の酸素消費が問題になるのは血管性の跛行．","images":[],"stem_images":[]},{"number":17,"section":"D-4-S05　70歳女性・膝の痛みと歩行困難","question":"（1/4）70歳の女性．2年前から右膝が痛み，最近は階段の昇り降りがつらいという．肥満があり，体重は若い頃より12kg増えた．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"朝のこわばりは長く続きますか．"},{"letter":"B","text":"冷たい物で歯がしみますか．"},{"letter":"C","text":"以前，膝をけがしましたか．"},{"letter":"D","text":"歩き始めに痛みますか．"},{"letter":"E","text":"膝が急に腫れたり熱くなりますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．歯の知覚過敏は慢性膝痛の評価では優先度が低い．\n- A：炎症性関節炎との鑑別に有用．\n- B：歯の知覚過敏は慢性膝痛の評価では優先度が低い．この設問で選ぶ肢．\n- C：二次性関節障害の背景を確認．\n- D：荷重と痛みの関係を確認．\n- E：急性炎症の合併を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-4-S05　70歳女性・膝の痛みと歩行困難","question":"（2/4）70歳の女性．2年前から右膝が痛み，最近は階段の昇り降りがつらいという．肥満があり，体重は若い頃より12kg増えた．朝のこわばりは10分ほどで消え，動き始めに痛みが強いという．認められる所見はどれか．","options":[{"letter":"A","text":"手指の近位指節間関節が腫れる"},{"letter":"B","text":"膝関節に強い熱感と発赤が出る"},{"letter":"C","text":"膝に高度の腫脹と拍動痛が出る"},{"letter":"D","text":"膝関節の内反変形と軋轢音"},{"letter":"E","text":"両側のアキレス腱反射が消失する"}],"answer":["D"],"multi":false,"explanation":"解説：日本人では内側大腿脛骨関節から軟骨が摩耗するため，脛骨が内側へ傾いてO脚（内反変形）になる．関節を動かすとザラザラした軋轢音を触れ，関節裂隙の内側に圧痛がある．炎症は軽度である．\n- A：近位指節間関節の対称性の腫脹は関節リウマチ．\n- B：強い熱感と発赤は化膿性関節炎や結晶性関節炎．\n- C：高度の腫脹と拍動痛も急性の炎症を示す．\n- D：変性による力学的変化を反映し正しい．\n- E：アキレス腱反射の消失は末梢神経障害．","images":[],"stem_images":[]},{"number":19,"section":"D-4-S05　70歳女性・膝の痛みと歩行困難","question":"（3/4）70歳の女性．2年前から右膝が痛み，最近は階段の昇り降りがつらいという．肥満があり，体重は若い頃より12kg増えた．朝のこわばりは10分ほどで消え，動き始めに痛みが強いという．右膝に内反変形と軋轢音を認め，熱感はない．エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"骨端線の早期の閉鎖"},{"letter":"B","text":"境界明瞭な打ち抜き像の多発"},{"letter":"C","text":"関節裂隙の狭小化と骨棘"},{"letter":"D","text":"骨膜反応による層状陰影"},{"letter":"E","text":"関節面のびまん性の脱灰"}],"answer":["C"],"multi":false,"explanation":"解説：軟骨が摩耗して関節裂隙が狭くなり，辺縁に骨棘が形成され，軟骨下骨が硬化して骨嚢胞ができる．立位での撮影が荷重の影響を反映するため，臥位より狭小化を正しく評価できる．\n- A：骨端線の早期の閉鎖は内分泌疾患や外傷後．\n- B：打ち抜き像の多発は多発性骨髄腫．\n- C：変性関節症の典型像で正しい．\n- D：層状の骨膜反応は骨髄炎やEwing肉腫．\n- E：びまん性の脱灰は関節リウマチや不動性骨萎縮．","images":[],"stem_images":[]},{"number":20,"section":"D-4-S05　70歳女性・膝の痛みと歩行困難","question":"（4/4）70歳の女性．2年前から右膝が痛み，最近は階段の昇り降りがつらいという．肥満があり，体重は若い頃より12kg増えた．朝のこわばりは10分ほどで消え，動き始めに痛みが強いという．右膝に内反変形と軋轢音を認め，熱感はない．エックス線写真で内側の関節裂隙狭小化と骨棘を認めた．最初に勧めるべきなのはどれか．","options":[{"letter":"A","text":"減量と大腿四頭筋の訓練"},{"letter":"B","text":"直ちに人工関節置換術を行う"},{"letter":"C","text":"膝関節を装具で完全に固定する"},{"letter":"D","text":"副腎皮質ステロイドの連日内服"},{"letter":"E","text":"終日の床上安静を続ける"}],"answer":["A"],"multi":false,"explanation":"解説：体重を減らすと膝への荷重が直接減り，大腿四頭筋を鍛えると関節の安定性が増して痛みが軽くなる．運動療法と減量が保存療法の柱で，薬物や注射はこれを補うものと位置づける．\n- A：原因に直接働きかける保存療法の基本で正しい．\n- B：人工関節置換術は保存療法が無効な進行例に検討する．\n- C：完全固定は筋力低下と拘縮を招く．\n- D：ステロイドの連日内服は副作用が大きく標準治療ではない．\n- E：床上安静は筋力をさらに落とし症状を悪化させる．","images":[],"stem_images":[]},{"number":21,"section":"D-4-S06　58歳男性・発熱と膝の激痛","question":"（1/4）58歳の男性．昨日から右膝が激しく痛み，腫れて曲げられないという．38.5℃の発熱を伴う．関節内への感染経路を検討するための質問はどれか．","options":[{"letter":"A","text":"膝に注射や処置を受けましたか．"},{"letter":"B","text":"同じ関節が以前も腫れましたか．"},{"letter":"C","text":"お酒を多く飲みましたか．"},{"letter":"D","text":"家族に痛風の人はいますか．"},{"letter":"E","text":"朝にほかの関節もこわばりますか．"}],"answer":["A"],"multi":false,"explanation":"解説：関節穿刺や注射，手術，外傷は細菌の直接的な侵入門戸になる．糖尿病・ステロイド使用・関節リウマチ・人工関節の存在も危険因子で，これらの有無が感染の可能性を大きく左右する．\n- A：侵入門戸と危険因子を確かめ有用．\n- B：反復性に関する情報．\n- C：結晶誘発性関節炎の誘因に関する情報．\n- D：家族歴に関する情報．\n- E：多関節炎に関する情報．","images":[],"stem_images":[]},{"number":22,"section":"D-4-S06　58歳男性・発熱と膝の激痛","question":"（2/4）58歳の男性．昨日から右膝が激しく痛み，腫れて曲げられないという．38.5℃の発熱を伴う．3日前に近医で右膝に注射を受けたという．糖尿病で通院中である．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"頸動脈の超音波検査"},{"letter":"D","text":"関節穿刺と関節液の検査"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：関節液の外観・細胞数・分画・結晶・Gram染色・培養が診断の中核になる．抗菌薬を始める前に採取することが重要で，数日で軟骨が不可逆的に破壊されるため検査を遅らせてはならない．\n- A：骨シンチグラフィは骨病変の検索で，緊急の鑑別にならない．\n- B：呼吸機能検査は換気障害の評価．\n- C：頸動脈超音波は動脈硬化の評価．\n- D：診断と起因菌同定を同時に行え正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":23,"section":"D-4-S06　58歳男性・発熱と膝の激痛","question":"（3/4）58歳の男性．昨日から右膝が激しく痛み，腫れて曲げられないという．38.5℃の発熱を伴う．3日前に近医で右膝に注射を受けたという．糖尿病で通院中である．関節穿刺で混濁した黄色の関節液が引け，白血球6.8万/μLで多核球が92%を占め，結晶は認めなかった．最も適切な治療はどれか．","options":[{"letter":"A","text":"経過観察のうえ再検する"},{"letter":"B","text":"鎮痛薬の内服のみ行う"},{"letter":"C","text":"関節腔内にステロイドを注入する"},{"letter":"D","text":"尿酸降下薬の投与を始める"},{"letter":"E","text":"関節の洗浄ドレナージと抗菌薬"}],"answer":["E"],"multi":false,"explanation":"解説：好中球由来の酵素が数日で軟骨を融解するため，膿を洗い流して菌量を減らし，同時に全身への抗菌薬投与を始める．関節液のGram染色と培養の結果に応じて抗菌薬を絞り込む．\n- A：経過観察している間に関節が破壊される．\n- B：鎮痛薬だけでは感染は制御できない．\n- C：関節腔内へのステロイド注入は感染を悪化させる．\n- D：尿酸降下薬は痛風の慢性期治療で，本例には無効．\n- E：洗浄と抗菌薬の併用が標準で正しい．","images":[],"stem_images":[]},{"number":24,"section":"D-4-S06　58歳男性・発熱と膝の激痛","question":"（4/4）58歳の男性．昨日から右膝が激しく痛み，腫れて曲げられないという．38.5℃の発熱を伴う．3日前に近医で右膝に注射を受けたという．糖尿病で通院中である．関節穿刺で混濁した黄色の関節液が引け，白血球6.8万/μLで多核球が92%を占め，結晶は認めなかった．結晶性の関節炎であればみられたはずの所見はどれか．","options":[{"letter":"A","text":"関節液の白血球が正常範囲となる"},{"letter":"B","text":"関節液の培養が陽性となる"},{"letter":"C","text":"偏光顕微鏡で複屈折性の結晶を認める"},{"letter":"D","text":"関節液が透明で粘稠性が高い"},{"letter":"E","text":"関節液に破砕赤血球が出現する"}],"answer":["C"],"multi":false,"explanation":"解説：偏光顕微鏡で針状・負の複屈折なら尿酸塩（痛風），棒状・正の複屈折ならピロリン酸カルシウム（偽痛風）である．結晶性でも白血球は数万に達するため，細胞数だけでは感染と区別できない．\n- A：結晶性関節炎でも白血球は著明に増える．\n- B：培養陽性は細菌感染を示す所見．\n- C：結晶性関節炎を確定する所見で正しい．\n- D：透明で粘稠な関節液は非炎症性の変形性関節症．\n- E：破砕赤血球は血栓性微小血管症の末梢血所見で，関節液の評価項目ではない．","images":[],"stem_images":[]},{"number":25,"section":"D-4-S07　52歳男性・夜間に始まった足趾の激痛","question":"（1/4）52歳の男性．昨夜，就寝中に右の足の親指の付け根が激しく痛み，目が覚めたという．腫れて赤くなり，靴下が触れるだけで痛い．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"足に傷や発熱はありますか．"},{"letter":"B","text":"最近の飲酒量はどうですか．"},{"letter":"C","text":"利尿薬を飲んでいますか．"},{"letter":"D","text":"同じ痛みを繰り返していますか．"},{"letter":"E","text":"以前から遠くの文字が見えにくいですか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．屈折異常は急性関節炎の初期評価では優先度が低い．\n- A：感染性関節炎との鑑別に有用．\n- B：発作の誘因を確認．\n- C：尿酸値に影響する薬剤を確認．\n- D：反復する結晶誘発性関節炎を検討．\n- E：屈折異常は急性関節炎の初期評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":26,"section":"D-4-S07　52歳男性・夜間に始まった足趾の激痛","question":"（2/4）52歳の男性．昨夜，就寝中に右の足の親指の付け根が激しく痛み，目が覚めたという．腫れて赤くなり，靴下が触れるだけで痛い．毎晩ビールを1L飲むという．認められる所見はどれか．","options":[{"letter":"A","text":"左右対称に多関節が腫れる"},{"letter":"B","text":"手指の遠位指節間関節が変形する"},{"letter":"C","text":"第1中足趾節関節の発赤と腫脹"},{"letter":"D","text":"膝関節の内反変形と軋轢音"},{"letter":"E","text":"仙腸関節の圧痛と可動域制限"}],"answer":["C"],"multi":false,"explanation":"解説：体温が低く尿酸塩が析出しやすい足の第1中足趾節関節が最も多い発症部位で，単関節に急性の発赤・熱感・腫脹・激痛が出る．足関節や膝にも起こり，数日から2週で自然に軽快する．\n- A：左右対称の多関節炎は関節リウマチ．\n- B：遠位指節間関節の変形はHeberden結節で変形性関節症．\n- C：この疾患の好発部位と所見で正しい．\n- D：内反変形と軋轢音は変形性膝関節症．\n- E：仙腸関節の圧痛は強直性脊椎炎．","images":[],"stem_images":[]},{"number":27,"section":"D-4-S07　52歳男性・夜間に始まった足趾の激痛","question":"（3/4）52歳の男性．昨夜，就寝中に右の足の親指の付け根が激しく痛み，目が覚めたという．腫れて赤くなり，靴下が触れるだけで痛い．毎晩ビールを1L飲むという．右第1中足趾節関節に発赤・熱感・腫脹を認める．体温37.2℃．血清尿酸値は6.2mg/dLであった．この結果の解釈として正しいのはどれか．","options":[{"letter":"A","text":"正常値なのでこの疾患は否定できる"},{"letter":"B","text":"高値でないので感染症と考える"},{"letter":"C","text":"測定誤差なので再検する必要がある"},{"letter":"D","text":"この値なら結晶は析出しない"},{"letter":"E","text":"発作中は正常値でも矛盾しない"}],"answer":["E"],"multi":false,"explanation":"解説：発作時には尿酸塩が関節内に沈着し，炎症性サイトカインの作用で尿酸の腎排泄も増えるため，血清尿酸値はしばしば正常まで下がる．診断は臨床像と関節液の結晶所見で行い，尿酸値は発作が落ち着いてから測り直す．\n- A：正常値でも否定できないことがこの疾患の要点．\n- B：尿酸値が高くないことは感染症の根拠にならない．\n- C：測定誤差ではなく，病態として起こる現象である．\n- D：関節内では既に析出しており，血清値とは乖離する．\n- E：診断の落とし穴として正しい．","images":[],"stem_images":[]},{"number":28,"section":"D-4-S07　52歳男性・夜間に始まった足趾の激痛","question":"（4/4）52歳の男性．昨夜，就寝中に右の足の親指の付け根が激しく痛み，目が覚めたという．腫れて赤くなり，靴下が触れるだけで痛い．毎晩ビールを1L飲むという．右第1中足趾節関節に発赤・熱感・腫脹を認める．体温37.2℃．血清尿酸値は6.2mg/dLであった．関節液の偏光顕微鏡で針状の結晶を認めた．高齢者の膝に起こる類似疾患の結晶はどれか．","options":[{"letter":"A","text":"針状で負の複屈折を示す結晶"},{"letter":"B","text":"コレステロールの板状結晶"},{"letter":"C","text":"シュウ酸カルシウムの結晶"},{"letter":"D","text":"棒状で正の複屈折を示す結晶"},{"letter":"E","text":"リン酸アンモニウムマグネシウム"}],"answer":["D"],"multi":false,"explanation":"解説：偽痛風ではピロリン酸カルシウム二水和物が沈着し，棒状・短冊状で弱い正の複屈折を示す．膝や手関節に多く，エックス線で関節軟骨の線状石灰化（軟骨石灰化症）を伴う．\n- A：針状・負の複屈折は尿酸塩で，本例そのもの．\n- B：コレステロール結晶は慢性の関節液貯留でみられる．\n- C：シュウ酸カルシウムは尿路結石の成分．\n- D：偽痛風の結晶として正しい．\n- E：リン酸アンモニウムマグネシウムは感染性尿路結石の成分．","images":[],"stem_images":[]}],"seed":null},{"id":"D-5_循環器系","name":"D-5_循環器系.md","label":"D-5 循環器系","count":84,"sourceHash":"44a0ed5ab8ea","questions":[{"number":1,"section":"D-5-S01　72歳男性・夜間の呼吸困難","question":"（1/4）72歳の男性．夜間の呼吸困難を主訴に救急外来を受診した．3日前から平地歩行でも息切れを自覚していた．高血圧で内服治療中である．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"片脚が急に腫れましたか．"},{"letter":"B","text":"数年前から耳鳴りがありますか．"},{"letter":"C","text":"横になると息苦しいですか．"},{"letter":"D","text":"胸の痛みを伴いますか．"},{"letter":"E","text":"発熱や痰はありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性耳鳴りは今回の呼吸困難の緊急評価では優先度が低い．\n- A：静脈血栓塞栓症を検討．\n- B：慢性耳鳴りは今回の呼吸困難の緊急評価では優先度が低い．この設問で選ぶ肢．\n- C：起坐呼吸から肺うっ血を検討．\n- D：急性冠症候群などを検討．\n- E：呼吸器感染症を検討．","images":[],"stem_images":[]},{"number":2,"section":"D-5-S01　72歳男性・夜間の呼吸困難","question":"（2/4）72歳の男性．夜間の呼吸困難を主訴に救急外来を受診した．3日前から平地歩行でも息切れを自覚していた．高血圧で内服治療中である．横になると息苦しく，上体を起こすと楽になるという．認められる所見はどれか．","options":[{"letter":"A","text":"胸骨左縁の心膜摩擦音"},{"letter":"B","text":"腹部の拍動性腫瘤"},{"letter":"C","text":"連続性心雑音"},{"letter":"D","text":"両下肺野の湿性ラ音"},{"letter":"E","text":"吸気時の血圧低下"}],"answer":["D"],"multi":false,"explanation":"解説：起坐呼吸を伴う左心不全では肺うっ血により両側下肺野に断続性ラ音を聴取しうる．音の細かさは病期や部位によって異なり，III音や画像所見と合わせて評価する．\n- A：心膜摩擦音は急性心膜炎の所見で，肺うっ血では聴かれない．\n- B：拍動性腫瘤は腹部大動脈瘤の所見．\n- C：連続性雑音は動脈管開存など短絡性疾患のもの．\n- D：肺うっ血を反映する両側湿性ラ音が正しい．\n- E：奇脈は心タンポナーデや重症喘息の所見．","images":[],"stem_images":[]},{"number":3,"section":"D-5-S01　72歳男性・夜間の呼吸困難","question":"（3/4）72歳の男性．夜間の呼吸困難を主訴に救急外来を受診した．3日前から平地歩行でも息切れを自覚していた．高血圧で内服治療中である．横になると息苦しく，上体を起こすと楽になるという．脈拍108/分，整．血圧162/94mmHg．呼吸数28/分．SpO2 90%（room air）．両下肺野に湿性ラ音を聴取し，頸静脈の怒張を認める．まず行うべき検査はどれか．","options":[{"letter":"A","text":"胸部エックス線撮影"},{"letter":"B","text":"上部消化管内視鏡検査"},{"letter":"C","text":"頭部MRI"},{"letter":"D","text":"骨シンチグラフィ"},{"letter":"E","text":"下肢静脈超音波検査"}],"answer":["A"],"multi":false,"explanation":"解説：急性心不全を疑う呼吸困難ではまず胸部エックス線写真で心拡大・肺うっ血・胸水を確認する．簡便・迅速で治療方針に直結し，同時に心電図とBNP，心エコーを組み合わせる．\n- A：肺うっ血と心拡大を一度に評価でき，初期対応として最優先．\n- B：消化管出血を疑う所見がなく適応にならない．\n- C：神経学的異常がなく本例では不要．\n- D：骨転移の検索であり主訴と無関係．\n- E：深部静脈血栓症の検索だが，片側下肢腫脹がなく優先されない．","images":[],"stem_images":[]},{"number":4,"section":"D-5-S01　72歳男性・夜間の呼吸困難","question":"（4/4）72歳の男性．夜間の呼吸困難を主訴に救急外来を受診した．3日前から平地歩行でも息切れを自覚していた．高血圧で内服治療中である．横になると息苦しく，上体を起こすと楽になるという．脈拍108/分，整．血圧162/94mmHg．呼吸数28/分．SpO2 90%（room air）．両下肺野に湿性ラ音を聴取し，頸静脈の怒張を認める．胸部エックス線写真で心陰影の拡大と両肺門部を中心とする浸潤影を認める．この患者の病態はどれか．","options":[{"letter":"A","text":"肺静脈圧の上昇"},{"letter":"B","text":"門脈圧の上昇"},{"letter":"C","text":"気道抵抗の上昇"},{"letter":"D","text":"血漿膠質浸透圧の上昇"},{"letter":"E","text":"頭蓋内圧の上昇"}],"answer":["A"],"multi":false,"explanation":"解説：左室のポンプ失調で左房圧が上がり，肺静脈圧・肺毛細血管楔入圧が上昇して血漿が肺間質から肺胞へ漏れる．これが肺うっ血・心原性肺水腫の本態で，肺門部中心の蝶形陰影として写る．\n- A：左心不全の血行動態そのもので正しい．\n- B：門脈圧亢進は肝硬変の病態で腹水・食道静脈瘤をきたす．\n- C：気道抵抗上昇は気管支喘息やCOPDで，呼気性喘鳴を伴う．\n- D：心不全では膠質浸透圧はむしろ変化せず，静水圧上昇が主因．\n- E：頭蓋内圧亢進では頭痛・嘔吐・うっ血乳頭をきたす．","images":[],"stem_images":[]},{"number":5,"section":"D-5-S02　78歳男性・下腿浮腫と体重増加","question":"（1/4）78歳の男性．両下腿のむくみを主訴に来院した．1か月で体重が4kg増加した．10年前から高血圧と心筋梗塞の既往がある．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から小さい字が見えにくいですか．"},{"letter":"B","text":"動くと息切れがしますか．"},{"letter":"C","text":"塩辛い物を多く食べますか．"},{"letter":"D","text":"最近，薬が変わりましたか．"},{"letter":"E","text":"尿が減ったり泡立ったりしますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性の近見困難は浮腫の原因検索では優先度が低い．\n- A：慢性の近見困難は浮腫の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：心原性浮腫を検討．\n- C：体液貯留の誘因を確認．\n- D：薬剤性浮腫や治療中断を検討．\n- E：腎疾患の可能性を確認．","images":[],"stem_images":[]},{"number":6,"section":"D-5-S02　78歳男性・下腿浮腫と体重増加","question":"（2/4）78歳の男性．両下腿のむくみを主訴に来院した．1か月で体重が4kg増加した．10年前から高血圧と心筋梗塞の既往がある．平地を100m歩くと息切れがして立ち止まるという．認められる所見はどれか．","options":[{"letter":"A","text":"甲状腺のびまん性腫大"},{"letter":"B","text":"肝頸静脈逆流の陽性"},{"letter":"C","text":"頬部の蝶形紅斑"},{"letter":"D","text":"膝蓋腱反射の消失"},{"letter":"E","text":"腸雑音の金属音"}],"answer":["B"],"multi":false,"explanation":"解説：体液貯留が右心系に及ぶと中心静脈圧が上がり，坐位45度での頸静脈怒張と，右季肋部圧迫で頸静脈が更に怒張する肝頸静脈逆流が陽性となる．圧痕性の下腿浮腫と肝腫大も伴う．\n- A：甲状腺腫大はBasedow病や橋本病の所見．\n- B：右心系のうっ血を直接示す所見で正しい．\n- C：蝶形紅斑は全身性エリテマトーデス．\n- D：腱反射消失は末梢神経障害や甲状腺機能低下症．\n- E：金属性腸雑音は腸閉塞の所見．","images":[],"stem_images":[]},{"number":7,"section":"D-5-S02　78歳男性・下腿浮腫と体重増加","question":"（3/4）78歳の男性．両下腿のむくみを主訴に来院した．1か月で体重が4kg増加した．10年前から高血圧と心筋梗塞の既往がある．平地を100m歩くと息切れがして立ち止まるという．坐位で頸静脈怒張を認め，肝頸静脈逆流が陽性である．両下腿に圧痕性浮腫を認める．重症度と治療方針の決定に最も有用な検査はどれか．","options":[{"letter":"A","text":"24時間食道pHモニタリング"},{"letter":"B","text":"腹部単純エックス線撮影"},{"letter":"C","text":"上部消化管造影"},{"letter":"D","text":"心エコー検査"},{"letter":"E","text":"頸動脈超音波検査"}],"answer":["D"],"multi":false,"explanation":"解説：心エコーで左室駆出率，弁膜症，壁運動異常を評価する．日本循環器学会2025年版ではHFrEFをLVEF 40%以下，HFmrEFを41〜49%，HFpEFを50%以上に分類し，治療選択に用いる．\n- A：胃食道逆流症の検査で心不全の評価にならない．\n- B：腹部単純写真は腸閉塞や結石の評価用．\n- C：上部消化管造影は食道・胃の形態評価．\n- D：駆出率と原因心疾患を一度に評価でき最も有用．\n- E：頸動脈超音波は動脈硬化の評価で，心機能は測れない．","images":[],"stem_images":[]},{"number":8,"section":"D-5-S02　78歳男性・下腿浮腫と体重増加","question":"（4/4）78歳の男性．両下腿のむくみを主訴に来院した．1か月で体重が4kg増加した．10年前から高血圧と心筋梗塞の既往がある．平地を100m歩くと息切れがして立ち止まるという．坐位で頸静脈怒張を認め，肝頸静脈逆流が陽性である．両下腿に圧痕性浮腫を認める．心エコー検査で左室駆出率は30%であった．長期予後の改善が期待できる薬剤はどれか．","options":[{"letter":"A","text":"β遮断薬"},{"letter":"B","text":"ジギタリス"},{"letter":"C","text":"抗コリン薬"},{"letter":"D","text":"非ステロイド性抗炎症薬"},{"letter":"E","text":"Ca拮抗薬"}],"answer":["A"],"multi":false,"explanation":"解説：左室駆出率の低下した心不全（HFrEF）では，β遮断薬・ACE阻害薬/ARB/ARNI・ミネラルコルチコイド受容体拮抗薬・SGLT2阻害薬の4剤が生命予後を改善する．少量から漸増する．\n- A：交感神経の慢性的な過剰活性化を抑え，予後を改善する．\n- B：ジギタリスは症状と入院を減らすが生命予後は改善しない．\n- C：抗コリン薬はCOPDの気管支拡張薬で心不全の適応はない．\n- D：NSAIDsは腎血流を減らし体液貯留を悪化させるため避ける．\n- E：ジヒドロピリジン系以外のCa拮抗薬は陰性変力作用でHFrEFに禁忌．","images":[],"stem_images":[]},{"number":9,"section":"D-5-S03　63歳男性・突然の前胸部絞扼感","question":"（1/4）63歳の男性．突然の前胸部絞扼感を主訴に救急搬送された．発症は30分前で，痛みは持続している．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"息苦しさや失神はありますか．"},{"letter":"B","text":"痛みは腕や顎にも広がりますか．"},{"letter":"C","text":"数年前から胸やけがありますか．"},{"letter":"D","text":"喫煙や糖尿病はありますか．"},{"letter":"E","text":"痛みは背中へ移動しますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．慢性の胸やけの詳細は，今回の持続性急性胸痛の危険徴候と性状の確認より優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：重症度と循環への影響を確認．\n- B：虚血性胸痛の性状を確認．\n- C：慢性の胸やけの詳細は，今回の持続性急性胸痛の危険徴候と性状の確認より優先度が低い．この設問で選ぶ肢．\n- D：冠危険因子を確認．\n- E：大動脈病変を検討．","images":[],"stem_images":[]},{"number":10,"section":"D-5-S03　63歳男性・突然の前胸部絞扼感","question":"（2/4）63歳の男性．突然の前胸部絞扼感を主訴に救急搬送された．発症は30分前で，痛みは持続している．喫煙は20本/日を40年間，2型糖尿病で通院中という．認められる所見はどれか．","options":[{"letter":"A","text":"冷汗と顔面蒼白"},{"letter":"B","text":"項部硬直とKernig徴候"},{"letter":"C","text":"眼球突出"},{"letter":"D","text":"腹部の板状硬"},{"letter":"E","text":"甲状腺の圧痛"}],"answer":["A"],"multi":false,"explanation":"解説：急性心筋梗塞では強い痛みと心拍出量低下により交感神経が過剰に活性化し，冷汗・顔面蒼白・悪心を伴う．「冷汗を伴う胸痛」は虚血性心疾患を強く示唆する組合せである．\n- A：交感神経緊張を反映する所見で正しい．\n- B：項部硬直は髄膜刺激徴候で，くも膜下出血や髄膜炎．\n- C：眼球突出はBasedow病の所見．\n- D：板状硬は消化管穿孔による汎発性腹膜炎．\n- E：甲状腺の圧痛は亜急性甲状腺炎．","images":[],"stem_images":[]},{"number":11,"section":"D-5-S03　63歳男性・突然の前胸部絞扼感","question":"（3/4）63歳の男性．突然の前胸部絞扼感を主訴に救急搬送された．発症は30分前で，痛みは持続している．喫煙は20本/日を40年間，2型糖尿病で通院中という．体温36.2℃．脈拍104/分，整．血圧78/52mmHg．冷汗と顔面蒼白を認め，四肢末梢は冷たい．まず行うべき検査はどれか．","options":[{"letter":"A","text":"腹部超音波検査"},{"letter":"B","text":"上部消化管内視鏡検査"},{"letter":"C","text":"呼吸機能検査"},{"letter":"D","text":"頭部単純CT"},{"letter":"E","text":"12誘導心電図"}],"answer":["E"],"multi":false,"explanation":"解説：胸痛の初療では到着後10分以内の12誘導心電図が鉄則である．ST上昇があれば再灌流療法へ直行でき，収縮期血圧78mmHgと末梢冷感は心原性ショック（Killip IV）を示す．\n- A：腹部超音波は腹痛や腹部大動脈瘤を疑う場合の検査．\n- B：内視鏡は消化管出血を疑う場合で，本例では遅らせる理由にならない．\n- C：呼吸機能検査は慢性の閉塞性・拘束性障害の評価用で緊急性がない．\n- D：頭部CTは意識障害や神経脱落症状がある場合．\n- E：数分で施行でき，治療方針を直接決めるため最優先．","images":[],"stem_images":[]},{"number":12,"section":"D-5-S03　63歳男性・突然の前胸部絞扼感","question":"（4/4）63歳の男性．突然の前胸部絞扼感を主訴に救急搬送された．発症は30分前で，痛みは持続している．喫煙は20本/日を40年間，2型糖尿病で通院中という．体温36.2℃．脈拍104/分，整．血圧78/52mmHg．冷汗と顔面蒼白を認め，四肢末梢は冷たい．12誘導心電図でII，III，aVF誘導にST上昇を認めた．処置の準備中に意識を消失し，モニタ心電図が無秩序で不規則な波形となり脈が触れない．直ちに行うべきなのはどれか．","options":[{"letter":"A","text":"硝酸薬の舌下投与"},{"letter":"B","text":"直流除細動"},{"letter":"C","text":"アトロピンの静注"},{"letter":"D","text":"経皮的ペーシング"},{"letter":"E","text":"利尿薬の静注"}],"answer":["B"],"multi":false,"explanation":"解説：脈が触れず心電図が無秩序な細動波を示すのは心室細動で，救命は電気的除細動の速さで決まる．胸骨圧迫を続けながら直ちに非同期ショックを行い，その後に再灌流療法へ進む．\n- A：硝酸薬は下壁梗塞・低血圧では禁忌に近く，心停止には無効．\n- B：心室細動に対する唯一の根治的処置で正しい．\n- C：アトロピンは徐脈性不整脈に使う薬で心室細動には無効．\n- D：脈のある重症徐脈に検討する処置で，心室細動や無脈性電気活動の標準治療ではない．\n- E：利尿薬はうっ血に対する薬で，心停止の蘇生には用いない．","images":[],"stem_images":[]},{"number":13,"section":"D-5-S04　65歳男性・坂道での前胸部圧迫感","question":"（1/4）65歳の男性．坂道を登るときの前胸部の圧迫感を主訴に来院した．3か月前から自覚している．労作で誘発された胸痛の持続時間を確認する質問はどれか．","options":[{"letter":"A","text":"胸のどこが痛みますか．"},{"letter":"B","text":"痛みは腕や顎へ広がりますか．"},{"letter":"C","text":"胸痛のとき冷汗が出ますか．"},{"letter":"D","text":"立ち止まると何分で治まりますか．"},{"letter":"E","text":"家族に心臓病の人はいますか．"}],"answer":["D"],"multi":false,"explanation":"解説：労作性狭心症は労作で誘発され，安静で数分以内に軽快するのが特徴である．持続時間を尋ねることで，20分以上続く急性冠症候群や，数秒で消える筋骨格痛と切り分けられる．\n- A：痛みの部位に関する情報．\n- B：放散痛に関する情報．\n- C：随伴症状に関する情報．\n- D：労作との関係と持続時間が病型を決めるため有用．\n- E：危険因子に関する情報．","images":[],"stem_images":[]},{"number":14,"section":"D-5-S04　65歳男性・坂道での前胸部圧迫感","question":"（2/4）65歳の男性．坂道を登るときの前胸部の圧迫感を主訴に来院した．3か月前から自覚している．立ち止まると3分ほどで治まり，再び歩くと同じ症状が出るという．来院時の安静時12誘導心電図で予想される所見はどれか．","options":[{"letter":"A","text":"広範な誘導でのST上昇"},{"letter":"B","text":"洞調律で異常なし"},{"letter":"C","text":"鋸歯状のF波"},{"letter":"D","text":"PQ時間の進行性延長"},{"letter":"E","text":"デルタ波"}],"answer":["B"],"multi":false,"explanation":"解説：労作性狭心症は冠動脈の固定狭窄による需要虚血で，虚血は労作時にだけ生じる．したがって安静時心電図は正常なことが多く，正常所見は狭心症を否定する根拠にならない．\n- A：広範なST上昇は急性心膜炎，領域性のST上昇は貫壁性虚血で，本例の安静時には出ない．\n- B：非発作時の心電図が正常でも労作性狭心症は否定できない．\n- C：鋸歯状F波は心房粗動．\n- D：PQ時間の漸増はWenckebach型II度房室ブロック．\n- E：デルタ波はWPW症候群の副伝導路を示す．","images":[],"stem_images":[]},{"number":15,"section":"D-5-S04　65歳男性・坂道での前胸部圧迫感","question":"（3/4）65歳の男性．坂道を登るときの前胸部の圧迫感を主訴に来院した．3か月前から自覚している．立ち止まると3分ほどで治まり，再び歩くと同じ症状が出るという．来院時の安静時12誘導心電図は洞調律で明らかな異常を認めない．次に行うべき検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡検査"},{"letter":"B","text":"頭部MRA"},{"letter":"C","text":"運動負荷心電図"},{"letter":"D","text":"腹部造影CT"},{"letter":"E","text":"睡眠ポリグラフィ"}],"answer":["C"],"multi":false,"explanation":"解説：安静時心電図が正常でも狭心症は否定できないため，症状を再現する運動負荷心電図で虚血を誘発する．水平型または下降型に1mm以上のST低下が出れば有意で，冠動脈CTや心筋シンチも選択肢になる．\n- A：内視鏡は胃食道由来の胸痛を疑うときの検査で，労作関連性と合わない．\n- B：頭部MRAは脳血管の評価で本例と無関係．\n- C：労作時の虚血を再現でき，この段階で最も適切．\n- D：腹部造影CTは腹部臓器・大血管の評価用．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":16,"section":"D-5-S04　65歳男性・坂道での前胸部圧迫感","question":"（4/4）65歳の男性．坂道を登るときの前胸部の圧迫感を主訴に来院した．3か月前から自覚している．立ち止まると3分ほどで治まり，再び歩くと同じ症状が出るという．来院時の安静時12誘導心電図は洞調律で明らかな異常を認めない．運動負荷心電図でV4〜V6誘導に水平型の2mmのST低下を認めた．この患者の胸痛の成因はどれか．","options":[{"letter":"A","text":"冠動脈の一過性攣縮"},{"letter":"B","text":"心膜腔への液体貯留"},{"letter":"C","text":"大動脈内膜の裂孔形成"},{"letter":"D","text":"肺動脈の血栓塞栓"},{"letter":"E","text":"冠血流予備能の低下"}],"answer":["E"],"multi":false,"explanation":"解説：動脈硬化性の固定狭窄があると安静時の血流は保たれるが，労作で心筋酸素需要が増したときに血流を増やせない．この冠血流予備能の低下が需要虚血を生み，心内膜下虚血としてST低下で現れる．\n- A：一過性攣縮は冠攣縮性狭心症の機序で，安静時発作とST上昇が典型．\n- B：心膜液貯留は心タンポナーデをきたし，労作性の絞扼感にはならない．\n- C：内膜裂孔は大動脈解離で，突然発症の激痛となる．\n- D：肺血栓塞栓症は呼吸困難と低酸素血症が主体．\n- E：固定狭窄による需要虚血の本態で正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-5-S05　48歳男性・早朝安静時の胸痛","question":"（1/4）48歳の男性．胸痛を主訴に来院した．2週間前から症状があり，本日も明け方に出現した．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から歩くと膝が痛みますか．"},{"letter":"B","text":"一回の痛みは何分続きますか．"},{"letter":"C","text":"動悸や失神を伴いますか．"},{"letter":"D","text":"飲酒した翌朝に多いですか．"},{"letter":"E","text":"運動中にも痛みますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性膝痛は今回の胸痛の鑑別では優先度が低い．\n- A：慢性膝痛は今回の胸痛の鑑別では優先度が低い．この設問で選ぶ肢．\n- B：発作の時間経過を確認．\n- C：不整脈と重症度を評価．\n- D：冠攣縮の誘因を検討．\n- E：労作との関係を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-5-S05　48歳男性・早朝安静時の胸痛","question":"（2/4）48歳の男性．胸痛を主訴に来院した．2週間前から症状があり，本日も明け方に出現した．飲酒した日の翌朝に出やすく，喫煙は30本/日を28年間という．発作時に予想される心電図所見はどれか．","options":[{"letter":"A","text":"広範な誘導での平低T波"},{"letter":"B","text":"鋸歯状のF波"},{"letter":"C","text":"完全右脚ブロック"},{"letter":"D","text":"電気的交互脈"},{"letter":"E","text":"一過性のST上昇"}],"answer":["E"],"multi":false,"explanation":"解説：冠攣縮では太い心外膜側冠動脈が一時的に完全閉塞し，貫壁性虚血となるため発作時にST上昇をきたす．攣縮が解けると心電図は完全に正常化するのが労作性狭心症のST低下との違いである．\n- A：平低T波は非特異的変化で，発作時の典型像ではない．\n- B：F波は心房粗動．\n- C：右脚ブロックは肺血栓塞栓症や心房中隔欠損症などで見るが攣縮とは無関係．\n- D：電気的交互脈は心嚢液貯留・心タンポナーデ．\n- E：貫壁性虚血を反映する一過性ST上昇が正しい．","images":[],"stem_images":[]},{"number":19,"section":"D-5-S05　48歳男性・早朝安静時の胸痛","question":"（3/4）48歳の男性．胸痛を主訴に来院した．2週間前から症状があり，本日も明け方に出現した．飲酒した日の翌朝に出やすく，喫煙は30本/日を28年間という．外来で記録した発作時心電図でII，III，aVF誘導に一過性のST上昇を認め，発作消失後に正常化した．確定診断に有用な検査はどれか．","options":[{"letter":"A","text":"心筋生検"},{"letter":"B","text":"ホルター心電図"},{"letter":"C","text":"アセチルコリン負荷試験"},{"letter":"D","text":"経食道心エコー検査"},{"letter":"E","text":"運動負荷心筋シンチグラフィ"}],"answer":["C"],"multi":false,"explanation":"解説：冠動脈造影下でアセチルコリンまたはエルゴノビンを冠注し，攣縮と胸痛・心電図変化の再現をみる誘発試験が確定診断になる．発作が捉えられていれば臨床的に診断してよい．\n- A：心筋生検は心筋炎や心アミロイドーシスの診断手段．\n- B：ホルター心電図は発作の記録には有用だが，攣縮の証明にはならない．\n- C：薬物誘発試験で攣縮を直接証明でき，確定診断に最も有用．\n- D：経食道心エコーは疣腫・左心耳血栓・弁膜症の評価．\n- E：運動負荷は労作性狭心症向けで，攣縮はむしろ運動で誘発されにくい．","images":[],"stem_images":[]},{"number":20,"section":"D-5-S05　48歳男性・早朝安静時の胸痛","question":"（4/4）48歳の男性．胸痛を主訴に来院した．2週間前から症状があり，本日も明け方に出現した．飲酒した日の翌朝に出やすく，喫煙は30本/日を28年間という．外来で記録した発作時心電図でII，III，aVF誘導に一過性のST上昇を認め，発作消失後に正常化した．冠動脈造影でアセチルコリン負荷により右冠動脈に一過性の高度狭窄と胸痛の再現を認めた．発作予防に最も適切なのはどれか．","options":[{"letter":"A","text":"ジギタリス"},{"letter":"B","text":"β遮断薬"},{"letter":"C","text":"ループ利尿薬"},{"letter":"D","text":"Ca拮抗薬"},{"letter":"E","text":"抗コリン薬"}],"answer":["D"],"multi":false,"explanation":"解説：Ca拮抗薬が第一選択で，冠動脈平滑筋への Ca 流入を抑えて攣縮を防ぐ．長時間作用型硝酸薬を併用し，最大の危険因子である喫煙の完全な中止を指導する．\n- A：ジギタリスは心不全や心房細動のレートコントロール薬．\n- B：β遮断薬はβ2受容体遮断でα作用が相対的に優位となり攣縮を悪化させうるため避ける．\n- C：ループ利尿薬はうっ血の解除に用いる薬．\n- D：冠攣縮の予防に最も有効で正しい．\n- E：抗コリン薬は気管支拡張や徐脈の治療に用いる．","images":[],"stem_images":[]},{"number":21,"section":"D-5-S06　76歳女性・繰り返す失神","question":"（1/4）76歳の女性．繰り返す失神を主訴に来院した．この1か月で3回，前触れなく倒れ，数十秒で意識が戻ったという．けいれんや失禁はなく，発作は立位でも坐位でも起こるという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"若い頃から白髪がありますか．"},{"letter":"B","text":"倒れる直前に動悸がありますか．"},{"letter":"C","text":"心臓や血圧の薬を飲みますか．"},{"letter":"D","text":"若くして突然死した親族はいますか．"},{"letter":"E","text":"気分不良や冷汗が先に出ますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．白髪の出現時期は失神の原因検索に役立たない．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：白髪の出現時期は失神の原因検索に役立たない．この設問で選ぶ肢．\n- B：不整脈性失神を検討．\n- C：薬剤性徐脈や低血圧を検討．\n- D：遺伝性の心疾患を検討．\n- E：反射性失神の前駆症状を確認．","images":[],"stem_images":[]},{"number":22,"section":"D-5-S06　76歳女性・繰り返す失神","question":"（2/4）76歳の女性．繰り返す失神を主訴に来院した．この1か月で3回，前触れなく倒れ，数十秒で意識が戻ったという．けいれんや失禁はなく，発作は立位でも坐位でも起こるという．高血圧と頻脈に対しβ遮断薬を内服しているという．認められる所見はどれか．","options":[{"letter":"A","text":"吸気時の奇脈"},{"letter":"B","text":"頸静脈の大砲A波"},{"letter":"C","text":"心尖部の拡張期ランブル"},{"letter":"D","text":"連続性心雑音"},{"letter":"E","text":"下腿の圧痕性浮腫"}],"answer":["B"],"multi":false,"explanation":"解説：房室伝導が完全に途絶えると心房と心室が独立に収縮し，閉じた三尖弁に心房が収縮をぶつける拍が生じる．これが頸静脈に間欠的な大きな波（大砲A波）として現れ，房室解離の身体所見となる．\n- A：奇脈は心タンポナーデや重症喘息の所見．\n- B：房室解離を反映する所見で正しい．\n- C：拡張期ランブルは僧帽弁狭窄症．\n- D：連続性雑音は動脈管開存など．\n- E：圧痕性浮腫は右心不全や低アルブミン血症の所見で，失神の説明にならない．","images":[],"stem_images":[]},{"number":23,"section":"D-5-S06　76歳女性・繰り返す失神","question":"（3/4）76歳の女性．繰り返す失神を主訴に来院した．この1か月で3回，前触れなく倒れ，数十秒で意識が戻ったという．けいれんや失禁はなく，発作は立位でも坐位でも起こるという．高血圧と頻脈に対しβ遮断薬を内服しているという．脈拍38/分，整．血圧136/70mmHg．頸静脈に間欠的な大きな拍動を認める．診断の確定に最も有用な検査はどれか．","options":[{"letter":"A","text":"心臓カテーテル検査"},{"letter":"B","text":"頭部MRI"},{"letter":"C","text":"脳波検査"},{"letter":"D","text":"立位負荷試験"},{"letter":"E","text":"12誘導心電図"}],"answer":["E"],"multi":false,"explanation":"解説：徐脈と房室解離を疑う所見が揃っており，12誘導心電図でP波とQRS波の関係を見れば診断できる．発作性の場合はHolter心電図や植込み型ループレコーダで発作時波形を捉える．\n- A：心臓カテーテル検査は冠動脈や血行動態の評価で，まず行う検査ではない．\n- B：頭部MRIは脳血管障害を疑う場合で，神経学的異常を欠く本例では優先度が低い．\n- C：脳波はてんかんの評価だが，けいれんも失禁もなく徐脈が明らかである．\n- D：立位負荷試験は起立性低血圧の評価用．\n- E：徐脈の機序を直接示し最も有用．","images":[],"stem_images":[]},{"number":24,"section":"D-5-S06　76歳女性・繰り返す失神","question":"（4/4）76歳の女性．繰り返す失神を主訴に来院した．この1か月で3回，前触れなく倒れ，数十秒で意識が戻ったという．けいれんや失禁はなく，発作は立位でも坐位でも起こるという．高血圧と頻脈に対しβ遮断薬を内服しているという．脈拍38/分，整．血圧136/70mmHg．頸静脈に間欠的な大きな拍動を認める．12誘導心電図でP波とQRS波が互いに無関係に出現し，心室の調律は38/分であった．β遮断薬を中止しても改善しない．最も適切な治療はどれか．","options":[{"letter":"A","text":"経過観察"},{"letter":"B","text":"抗不安薬の投与"},{"letter":"C","text":"β遮断薬の増量"},{"letter":"D","text":"ペースメーカ植込み"},{"letter":"E","text":"弾性ストッキングの着用"}],"answer":["D"],"multi":false,"explanation":"解説：症状を伴う完全房室ブロック（III度房室ブロック）は恒久的ペースメーカ植込みの絶対適応である．可逆性の原因を除いても徐脈が続くなら，失神による外傷や突然死を防ぐため速やかに適応を判断する．\n- A：失神を繰り返しており経過観察は許されない．\n- B：不安による過換気ではなく，薬物療法では解決しない．\n- C：β遮断薬は房室伝導をさらに抑え悪化させる．\n- D：症候性完全房室ブロックの標準治療で正しい．\n- E：弾性ストッキングは起立性低血圧や静脈還流不全に用いる．","images":[],"stem_images":[]},{"number":25,"section":"D-5-S07　70歳男性・動悸と脈の不整","question":"（1/4）70歳の男性．動悸を主訴に来院した．2週間前から持続し，脈が不規則であることに気づいたという．高血圧で通院中である．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"息切れや胸痛はありますか．"},{"letter":"B","text":"以前から足の爪が厚いですか．"},{"letter":"C","text":"暑がりや体重減少はありますか．"},{"letter":"D","text":"動悸は急に始まりましたか．"},{"letter":"E","text":"飲酒量が増えていませんか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性の爪病変は不整脈の初期評価では優先度が低い．\n- A：循環への影響を評価．\n- B：慢性の爪病変は不整脈の初期評価では優先度が低い．この設問で選ぶ肢．\n- C：甲状腺機能亢進を検討．\n- D：発症様式と持続時間を確認．\n- E：不整脈の誘因を確認．","images":[],"stem_images":[]},{"number":26,"section":"D-5-S07　70歳男性・動悸と脈の不整","question":"（2/4）70歳の男性．動悸を主訴に来院した．2週間前から持続し，脈が不規則であることに気づいたという．高血圧で通院中である．動悸は2週間絶えず続いており，止まったことはないという．認められる所見はどれか．","options":[{"letter":"A","text":"規則正しい頻脈"},{"letter":"B","text":"心尖拍動の左下方への偏位"},{"letter":"C","text":"脈拍数が心拍数より少ない"},{"letter":"D","text":"頸静脈の大砲A波"},{"letter":"E","text":"呼吸性の脈拍変動"}],"answer":["C"],"multi":false,"explanation":"解説：心房細動では心室応答が不規則で，拡張期が極端に短い拍は十分な心拍出量を生まず橈骨動脈まで届かない．心尖で数えた心拍数より橈骨動脈の脈拍数が少なくなる現象を脈拍欠損（pulse deficit）という．\n- A：規則正しい頻脈は発作性上室頻拍や洞性頻脈．\n- B：心尖拍動の左下方への偏位は左室拡大を示す所見で，不整脈に特異的でない．\n- C：絶対性不整脈に特徴的な所見で正しい．\n- D：大砲A波は完全房室ブロックなど房室解離を伴う病態．\n- E：呼吸性変動は健常若年者の洞性不整脈．","images":[],"stem_images":[]},{"number":27,"section":"D-5-S07　70歳男性・動悸と脈の不整","question":"（3/4）70歳の男性．動悸を主訴に来院した．2週間前から持続し，脈が不規則であることに気づいたという．高血圧で通院中である．動悸は2週間絶えず続いており，止まったことはないという．脈拍はおよそ110/分で全く不規則であり，心尖部で数えた心拍数は128/分である．12誘導心電図でP波は認められず，基線は細かく揺れ，RR間隔は不規則であった．合併症の予防のために評価すべきなのはどれか．","options":[{"letter":"A","text":"尿中カテコラミン"},{"letter":"B","text":"CHADS2スコア"},{"letter":"C","text":"Fontaine分類"},{"letter":"D","text":"血清アミラーゼ"},{"letter":"E","text":"骨密度"}],"answer":["B"],"multi":false,"explanation":"解説：心房細動の最大の脅威は左房内血栓による心原性脳塞栓である．心不全・高血圧・75歳以上・糖尿病・脳卒中既往からなるCHADS2スコアなどで塞栓リスクを層別化し，抗凝固療法の適応を決める．\n- A：尿中カテコラミンは褐色細胞腫の検査．\n- B：塞栓リスクの層別化に用い，治療方針を直接決めるため正しい．\n- C：Fontaine分類は閉塞性動脈硬化症の重症度分類．\n- D：血清アミラーゼは膵炎・耳下腺炎の指標．\n- E：骨密度は骨粗鬆症の評価で，本例と関連しない．","images":[],"stem_images":[]},{"number":28,"section":"D-5-S07　70歳男性・動悸と脈の不整","question":"（4/4）70歳の男性．動悸を主訴に来院した．2週間前から持続し，脈が不規則であることに気づいたという．高血圧で通院中である．動悸は2週間絶えず続いており，止まったことはないという．脈拍はおよそ110/分で全く不規則であり，心尖部で数えた心拍数は128/分である．12誘導心電図でP波は認められず，基線は細かく揺れ，RR間隔は不規則であった．同じ不整脈でも心電図が規則的な鋸歯状波を示す場合に考えられるのはどれか．","options":[{"letter":"A","text":"心房粗動"},{"letter":"B","text":"心室細動"},{"letter":"C","text":"洞不全症候群"},{"letter":"D","text":"WPW症候群"},{"letter":"E","text":"心室期外収縮"}],"answer":["A"],"multi":false,"explanation":"解説：心房粗動は心房内の規則的なリエントリーにより約300/分の鋸歯状F波を生じ，II・III・aVF誘導で明瞭となる．房室伝導比が一定なら整脈，変動すれば不整脈となり，塞栓リスクは心房細動に準じる．\n- A：規則的な鋸歯状波を示す心房性頻拍性不整脈で正しい．\n- B：心室細動は無秩序で脈が触れず，直ちに心停止となる．\n- C：洞不全症候群は徐脈・洞停止が主体でF波は出ない．\n- D：WPW症候群はデルタ波と短いPQ時間が特徴．\n- E：心室期外収縮は幅広いQRSが単発で先行して現れる．","images":[],"stem_images":[]},{"number":29,"section":"D-5-S08　24歳女性・突然始まり突然止まる動悸","question":"（1/4）24歳の女性．動悸を主訴に来院した．半年前から月に数回，安静時にも突然強い動悸が始まるという．基礎疾患はない．発作の停止様式を明らかにするための質問はどれか．","options":[{"letter":"A","text":"発作中に脈は規則的ですか．"},{"letter":"B","text":"発作の前に何をしていましたか．"},{"letter":"C","text":"動悸はどのように止まりますか．"},{"letter":"D","text":"発作中に胸痛がありますか．"},{"letter":"E","text":"家族に不整脈の人はいますか．"}],"answer":["C"],"multi":false,"explanation":"解説：突然始まり突然止まるという発作の様式は発作性上室頻拍に特徴的である．さらに息こらえや冷水での顔面浸水など迷走神経刺激で停止するなら，房室結節を回路に含むリエントリー性頻拍が強く疑われる．\n- A：発作中の調律に関する情報．\n- B：誘因に関する情報．\n- C：停止様式は不整脈の機序を直接示し有用．\n- D：随伴症状に関する情報．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":30,"section":"D-5-S08　24歳女性・突然始まり突然止まる動悸","question":"（2/4）24歳の女性．動悸を主訴に来院した．半年前から月に数回，安静時にも突然強い動悸が始まるという．基礎疾患はない．発作は数分から1時間続き，息をこらえると急に止まることがあるという．発作中に予想される所見はどれか．","options":[{"letter":"A","text":"全く不規則な頻脈"},{"letter":"B","text":"徐脈と血圧上昇"},{"letter":"C","text":"呼気性喘鳴"},{"letter":"D","text":"規則正しい頻脈"},{"letter":"E","text":"吸気時の頸静脈怒張"}],"answer":["D"],"multi":false,"explanation":"解説：房室結節リエントリー性頻拍では160〜200/分程度の規則正しい頻拍となり，QRS幅は狭い．Valsalva手技や頸動脈洞マッサージで房室結節の伝導が抑えられると，回路が途切れて発作は突然停止する．\n- A：全く不規則な頻脈は心房細動．\n- B：徐脈は本例の頻拍発作と矛盾する．\n- C：呼気性喘鳴は気管支喘息の所見．\n- D：リエントリー性頻拍に特徴的で正しい．\n- E：吸気時に頸静脈怒張が増すKussmaul徴候は収縮性心膜炎や右室梗塞．","images":[],"stem_images":[]},{"number":31,"section":"D-5-S08　24歳女性・突然始まり突然止まる動悸","question":"（3/4）24歳の女性．動悸を主訴に来院した．半年前から月に数回，安静時にも突然強い動悸が始まるという．基礎疾患はない．発作は数分から1時間続き，息をこらえると急に止まることがあるという．本日の発作中に受診し，脈拍184/分，整．血圧110/72mmHg．意識は清明である．12誘導心電図はQRS幅の狭い規則正しい頻拍で，P波は明瞭でない．まず行うべきなのはどれか．","options":[{"letter":"A","text":"直流除細動"},{"letter":"B","text":"迷走神経刺激手技"},{"letter":"C","text":"心臓カテーテル検査"},{"letter":"D","text":"中心静脈カテーテル挿入"},{"letter":"E","text":"心膜穿刺"}],"answer":["B"],"multi":false,"explanation":"解説：血行動態が安定した narrow QRS の規則的頻拍では，まずValsalva手技や息こらえなどの迷走神経刺激を行う．無効ならATP（アデノシン）急速静注に進み，血行動態が破綻していれば同期下カルディオバージョンを選ぶ．\n- A：意識清明で血圧も保たれており，電気的除細動を先行させる状況ではない．\n- B：非侵襲的で即座に試みられ，有効率も高く正しい．\n- C：カテーテル検査は根治的アブレーションを見据えた後日の検査．\n- D：中心静脈路の確保は本例の頻拍停止に直接寄与しない．\n- E：心膜穿刺は心タンポナーデの処置．","images":[],"stem_images":[]},{"number":32,"section":"D-5-S08　24歳女性・突然始まり突然止まる動悸","question":"（4/4）24歳の女性．動悸を主訴に来院した．半年前から月に数回，安静時にも突然強い動悸が始まるという．基礎疾患はない．発作は数分から1時間続き，息をこらえると急に止まることがあるという．本日の発作中に受診し，脈拍184/分，整．血圧110/72mmHg．意識は清明である．12誘導心電図はQRS幅の狭い規則正しい頻拍で，P波は明瞭でない．Valsalva手技で洞調律に復した．この頻拍の成因はどれか．","options":[{"letter":"A","text":"心房内の異所性自動能亢進"},{"letter":"B","text":"洞結節の機能低下"},{"letter":"C","text":"房室結節におけるリエントリー"},{"letter":"D","text":"心室筋の撃発活動"},{"letter":"E","text":"副伝導路の完全離断"}],"answer":["C"],"multi":false,"explanation":"解説：房室結節内の速伝導路と遅伝導路という伝導速度の異なる2経路が回路をつくり，期外収縮を契機に旋回が始まる．回路が房室結節を通るため迷走神経刺激やATPで停止し，カテーテルアブレーションで根治できる．\n- A：異所性自動能による心房頻拍は迷走神経刺激で止まりにくい．\n- B：洞結節機能低下は洞不全症候群で徐脈をきたす．\n- C：発作性上室頻拍の最も多い機序で正しい．\n- D：撃発活動はQT延長に伴う torsades de pointes などの機序．\n- E：副伝導路が存在するのがWPW症候群で，離断は治療の結果であって成因ではない．","images":[],"stem_images":[]},{"number":33,"section":"D-5-S09　68歳男性・心筋梗塞後の動悸","question":"（1/4）68歳の男性．動悸を主訴に来院した．5年前に心筋梗塞で入院し，以後通院している．1か月前から動悸を自覚し，ときに数秒の眼前暗黒感を伴うという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から歯に物が挟まりますか．"},{"letter":"B","text":"動悸は脈が飛ぶ感じですか．"},{"letter":"C","text":"現在どの薬を飲んでいますか．"},{"letter":"D","text":"胸痛を伴うことはありますか．"},{"letter":"E","text":"意識を失ったことはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性の歯の局所症状は動悸の緊急評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：慢性の歯の局所症状は動悸の緊急評価では優先度が低い．この設問で選ぶ肢．\n- B：期外収縮を含む症状の性状を確認．\n- C：催不整脈作用や治療状況を確認．\n- D：心筋虚血の合併を検討．\n- E：重症不整脈の危険を評価．","images":[],"stem_images":[]},{"number":34,"section":"D-5-S09　68歳男性・心筋梗塞後の動悸","question":"（2/4）68歳の男性．動悸を主訴に来院した．5年前に心筋梗塞で入院し，以後通院している．1か月前から動悸を自覚し，ときに数秒の眼前暗黒感を伴うという．速い動悸が30秒ほど続くことが週に数回あるという．この患者の心電図所見として考えられるのはどれか．","options":[{"letter":"A","text":"鋸歯状のF波"},{"letter":"B","text":"幅広いQRS波の連発"},{"letter":"C","text":"PQ時間の進行性延長"},{"letter":"D","text":"基線の細かい揺れ"},{"letter":"E","text":"全誘導でのST上昇"}],"answer":["B"],"multi":false,"explanation":"解説：陳旧性心筋梗塞の瘢痕辺縁はリエントリー回路になりやすく，持続時間30秒未満の非持続性心室頻拍を生じる．心室起源のため興奮は心筋を伝わって広がり，QRS幅0.12秒以上の幅広い波形が連続する．\n- A：鋸歯状F波は心房粗動．\n- B：心室起源の頻拍を反映し正しい．\n- C：PQ時間の漸増はWenckebach型II度房室ブロック．\n- D：細かい基線の揺れ（f波）は心房細動．\n- E：全誘導のST上昇は急性心膜炎．","images":[],"stem_images":[]},{"number":35,"section":"D-5-S09　68歳男性・心筋梗塞後の動悸","question":"（3/4）68歳の男性．動悸を主訴に来院した．5年前に心筋梗塞で入院し，以後通院している．1か月前から動悸を自覚し，ときに数秒の眼前暗黒感を伴うという．速い動悸が30秒ほど続くことが週に数回あるという．外来の12誘導心電図は洞調律で，幅広いQRS波が単発で散発している．発作の記録に最も適した検査はどれか．","options":[{"letter":"A","text":"心臓カテーテル検査"},{"letter":"B","text":"胸部造影CT"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"Holter心電図"}],"answer":["E"],"multi":false,"explanation":"解説：症状が発作性で外来の短時間記録では捉えられないため，24時間以上の連続記録で発作時波形と頻度・持続時間を確認する．稀な発作には携帯型心電計や植込み型ループレコーダを用いる．\n- A：カテーテル検査は虚血や血行動態の評価で，発作の記録には向かない．\n- B：胸部造影CTは肺血栓塞栓症や大動脈解離の評価用．\n- C：骨シンチグラフィは骨転移の検索．\n- D：呼吸機能検査は換気障害の評価．\n- E：日常生活中の発作を連続して記録でき最も適切．","images":[],"stem_images":[]},{"number":36,"section":"D-5-S09　68歳男性・心筋梗塞後の動悸","question":"（4/4）68歳の男性．動悸を主訴に来院した．5年前に心筋梗塞で入院し，以後通院している．1か月前から動悸を自覚し，ときに数秒の眼前暗黒感を伴うという．速い動悸が30秒ほど続くことが週に数回あるという．外来の12誘導心電図は洞調律で，幅広いQRS波が単発で散発している．Holter心電図で幅広いQRS波が160/分で20秒間連続する発作を記録した．診断の決め手となる所見はどれか．","options":[{"letter":"A","text":"房室解離"},{"letter":"B","text":"デルタ波"},{"letter":"C","text":"電気的交互脈"},{"letter":"D","text":"鋸歯状波"},{"letter":"E","text":"陰性U波"}],"answer":["A"],"multi":false,"explanation":"解説：幅広いQRS頻拍を心室頻拍と確定づけるのは，心房と心室が独立に動いていることを示す房室解離である．洞性P波が頻拍と無関係に出現し，捕捉収縮や融合収縮が混じれば診断はほぼ確実となる．\n- A：心室起源であることを直接示す所見で正しい．\n- B：デルタ波はWPW症候群で，変行伝導による上室頻拍との鑑別で問題になる．\n- C：電気的交互脈は心嚢液貯留．\n- D：鋸歯状波は心房粗動のF波．\n- E：陰性U波は虚血や高血圧で見られる非特異的所見．","images":[],"stem_images":[]},{"number":37,"section":"D-5-S10　32歳女性・健診で心雑音","question":"（1/4）32歳の女性．健康診断で心雑音を指摘され来院した．自覚症状はない．心雑音が以前から存在したかを確認する質問はどれか．","options":[{"letter":"A","text":"以前から雑音を指摘されましたか．"},{"letter":"B","text":"運動すると息が切れますか．"},{"letter":"C","text":"胸痛や失神はありますか．"},{"letter":"D","text":"動悸は不規則に感じますか．"},{"letter":"E","text":"最近，発熱が続いていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：指摘された時期は雑音の原因を絞る最大の手がかりである．小児期から続く雑音は先天性心疾患を，成人になって新たに現れた雑音は弁膜症や感染性心内膜炎を示唆する．\n- A：経過の長さが先天性か後天性かを分けるため有用．\n- B：労作耐容能に関する情報．\n- C：重症度に関する情報．\n- D：不整脈症状に関する情報．\n- E：感染の徴候に関する情報．","images":[],"stem_images":[]},{"number":38,"section":"D-5-S10　32歳女性・健診で心雑音","question":"（2/4）32歳の女性．健康診断で心雑音を指摘され来院した．自覚症状はない．学童期の健診でも雑音を指摘されたが，精査は受けていないという．胸骨左縁第2肋間に収縮期駆出性雑音を聴取する．同時に認められる可能性が高いのはどれか．","options":[{"letter":"A","text":"拡張期の灌水様雑音"},{"letter":"B","text":"II音の固定性分裂"},{"letter":"C","text":"心尖部の opening snap"},{"letter":"D","text":"胸骨右縁の連続性雑音"},{"letter":"E","text":"前傾で増強する摩擦音"}],"answer":["B"],"multi":false,"explanation":"解説：心房中隔欠損症では左房から右房への短絡で右室の駆出時間が延び，肺動脈弁の閉鎖が常に遅れる．そのためII音の分裂幅が呼吸で変動せず固定する．雑音自体は相対的肺動脈弁狭窄によるものである．\n- A：拡張期灌水様雑音は大動脈弁閉鎖不全症．\n- B：心房中隔欠損症に特異性が高く正しい．\n- C：opening snap は僧帽弁狭窄症．\n- D：連続性雑音は動脈管開存で，第2肋間胸骨左縁に聴取する．\n- E：前傾で増強する摩擦音は急性心膜炎．","images":[],"stem_images":[]},{"number":39,"section":"D-5-S10　32歳女性・健診で心雑音","question":"（3/4）32歳の女性．健康診断で心雑音を指摘され来院した．自覚症状はない．学童期の健診でも雑音を指摘されたが，精査は受けていないという．胸骨左縁第2肋間に収縮期駆出性雑音を聴取し，II音は呼吸によらず分裂している．12誘導心電図で不完全右脚ブロックを認める．診断の確定に最も有用な検査はどれか．","options":[{"letter":"A","text":"運動負荷心電図"},{"letter":"B","text":"冠動脈造影"},{"letter":"C","text":"心エコー検査"},{"letter":"D","text":"心筋生検"},{"letter":"E","text":"心臓MRIによる遅延造影"}],"answer":["C"],"multi":false,"explanation":"解説：心エコーで中隔の欠損孔と右房・右室の拡大を描出し，カラードプラで短絡血流を直接確認する．コントラストエコーや経食道心エコーを併用すれば，欠損孔の位置と大きさ，肺体血流比まで評価できる．\n- A：運動負荷心電図は虚血の誘発を目的とする検査．\n- B：冠動脈造影は冠動脈狭窄の評価用．\n- C：短絡と右心系の容量負荷を非侵襲的に確認でき最も有用．\n- D：心筋生検は心筋炎や浸潤性心筋疾患の診断手段．\n- E：遅延造影は心筋線維化の評価で，短絡の証明には向かない．","images":[],"stem_images":[]},{"number":40,"section":"D-5-S10　32歳女性・健診で心雑音","question":"（4/4）32歳の女性．健康診断で心雑音を指摘され来院した．自覚症状はない．学童期の健診でも雑音を指摘されたが，精査は受けていないという．胸骨左縁第2肋間に収縮期駆出性雑音を聴取し，II音は呼吸によらず分裂している．12誘導心電図で不完全右脚ブロックを認める．心エコー検査で心房中隔に短絡血流を認め，右房と右室が拡大していた．この患者の血行動態はどれか．","options":[{"letter":"A","text":"右室の容量負荷"},{"letter":"B","text":"左室の圧負荷"},{"letter":"C","text":"冠血流予備能の低下"},{"letter":"D","text":"体循環への右左短絡"},{"letter":"E","text":"肺静脈圧の上昇"}],"answer":["A"],"multi":false,"explanation":"解説：心房中隔欠損症では左房から右房へ血液が流れ込み，右房・右室・肺動脈の血流量が増える．この容量負荷が右心系の拡大と相対的肺動脈弁狭窄による雑音を生み，長期には肺高血圧をきたす．\n- A：左右短絡による右心系の容量負荷が本態で正しい．\n- B：左室の圧負荷は大動脈弁狭窄症や高血圧症．\n- C：冠血流予備能の低下は労作性狭心症の機序．\n- D：右左短絡は肺高血圧が進んで短絡が逆転したEisenmenger症候群の状態で，チアノーゼを伴う．\n- E：肺静脈圧上昇は左心不全や僧帽弁狭窄症の病態．","images":[],"stem_images":[]},{"number":41,"section":"D-5-S11　58歳女性・労作時息切れと動悸","question":"（1/4）58歳の女性．労作時の息切れを主訴に来院した．1年前から階段で息切れを自覚し，最近は動悸も伴うという．以前から心雑音を指摘されていたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から乗り物酔いをしますか．"},{"letter":"B","text":"動悸は不規則に感じますか．"},{"letter":"C","text":"子どもの頃に発熱と関節痛がありましたか．"},{"letter":"D","text":"横になると息苦しいですか．"},{"letter":"E","text":"胸部に放射線治療を受けましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．乗り物酔いの既往は心雑音と息切れの評価では優先度が低い．\n- A：乗り物酔いの既往は心雑音と息切れの評価では優先度が低い．この設問で選ぶ肢．\n- B：不整脈の合併を検討．\n- C：リウマチ熱の既往を検討．\n- D：肺うっ血の症状を確認．\n- E：弁障害を含む晩期心障害を検討．","images":[],"stem_images":[]},{"number":42,"section":"D-5-S11　58歳女性・労作時息切れと動悸","question":"（2/4）58歳の女性．労作時の息切れを主訴に来院した．1年前から階段で息切れを自覚し，最近は動悸も伴うという．以前から心雑音を指摘されていたという．幼少期に扁桃炎を繰り返し，関節痛と発熱で寝込んだことがあるという．認められる所見はどれか．","options":[{"letter":"A","text":"頸部に放散する収縮期雑音"},{"letter":"B","text":"心尖部の拡張期ランブル"},{"letter":"C","text":"胸骨左縁の全収縮期雑音"},{"letter":"D","text":"胸骨右縁の連続性雑音"},{"letter":"E","text":"心膜摩擦音"}],"answer":["B"],"multi":false,"explanation":"解説：僧帽弁狭窄症では狭い弁口を通る拡張期の左房→左室血流が低調性の心尖部拡張期ランブルとなる．硬化した弁が勢いよく閉じるためI音が亢進し，開放時にはII音に続くopening snapを伴う．\n- A：頸部放散する収縮期雑音は大動脈弁狭窄症．\n- B：僧帽弁狭窄症に特徴的で正しい．\n- C：胸骨左縁第4肋間の全収縮期雑音は心室中隔欠損症．\n- D：連続性雑音は動脈管開存．\n- E：心膜摩擦音は急性心膜炎．","images":[],"stem_images":[]},{"number":43,"section":"D-5-S11　58歳女性・労作時息切れと動悸","question":"（3/4）58歳の女性．労作時の息切れを主訴に来院した．1年前から階段で息切れを自覚し，最近は動悸も伴うという．以前から心雑音を指摘されていたという．幼少期に扁桃炎を繰り返し，関節痛と発熱で寝込んだことがあるという．心尖部にI音の亢進と拡張期ランブルを聴取する．脈拍は96/分で不整である．12誘導心電図で予想される所見はどれか．","options":[{"letter":"A","text":"デルタ波"},{"letter":"B","text":"完全房室ブロック"},{"letter":"C","text":"P波の消失とRR間隔の不整"},{"letter":"D","text":"幅広いQRS波の連続した出現"},{"letter":"E","text":"全誘導でのST上昇"}],"answer":["C"],"multi":false,"explanation":"解説：僧帽弁狭窄症では左房圧上昇と左房拡大が進み，心房細動を高率に合併する．心房収縮が失われて左室充満がさらに減るため症状が悪化し，左房内血栓による全身性塞栓症の危険が跳ね上がる．\n- A：デルタ波はWPW症候群．\n- B：完全房室ブロックは徐脈をきたし，本例の頻脈・不整と合わない．\n- C：左房負荷から生じる心房細動の所見で正しい．\n- D：幅広いQRSの連発は心室頻拍で，器質的心筋障害を背景とする．\n- E：全誘導のST上昇は急性心膜炎．","images":[],"stem_images":[]},{"number":44,"section":"D-5-S11　58歳女性・労作時息切れと動悸","question":"（4/4）58歳の女性．労作時の息切れを主訴に来院した．1年前から階段で息切れを自覚し，最近は動悸も伴うという．以前から心雑音を指摘されていたという．幼少期に扁桃炎を繰り返し，関節痛と発熱で寝込んだことがあるという．心尖部にI音の亢進と拡張期ランブルを聴取する．脈拍は96/分で不整である．12誘導心電図でP波は消失しRR間隔は不規則であった．心エコー検査で左房の著明な拡大を認める．最も注意すべき合併症はどれか．","options":[{"letter":"A","text":"心タンポナーデ"},{"letter":"B","text":"深部静脈血栓症"},{"letter":"C","text":"消化管穿孔"},{"letter":"D","text":"心原性脳塞栓症"},{"letter":"E","text":"気胸"}],"answer":["D"],"multi":false,"explanation":"解説：拡大した左房に心房細動が加わると左心耳に血流のうっ滞が生じ，血栓が形成される．これが遊離して脳動脈を閉塞するのが心原性脳塞栓症で，突然発症の重篤な梗塞となるため抗凝固療法が必須となる．\n- A：心タンポナーデは心嚢液の急速な貯留で生じ，本例の病態から直接は導かれない．\n- B：深部静脈血栓症は静脈系の血栓で，左房内血栓とは別の機序．\n- C：消化管穿孔は潰瘍や憩室炎の合併症．\n- D：左房内血栓に由来する動脈塞栓で最も警戒すべき合併症．\n- E：気胸は肺実質・胸膜の病変によるもの．","images":[],"stem_images":[]},{"number":45,"section":"D-5-S12　74歳男性・労作時の失神","question":"（1/4）74歳の男性．失神を主訴に来院した．3か月前から坂道を登ると眼前が暗くなり，1週間前に歩行中に倒れたという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から遠くの字が見えにくいですか．"},{"letter":"B","text":"息切れも増えていますか．"},{"letter":"C","text":"胸痛を伴いますか．"},{"letter":"D","text":"血圧の薬を飲んでいますか．"},{"letter":"E","text":"倒れる前に動悸がありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．屈折異常は失神の原因検索では優先度が低い．\n- A：屈折異常は失神の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：心機能と労作耐容能を評価．\n- C：心筋虚血や流出路狭窄を検討．\n- D：薬剤性低血圧を検討．\n- E：不整脈性失神を検討．","images":[],"stem_images":[]},{"number":46,"section":"D-5-S12　74歳男性・労作時の失神","question":"（2/4）74歳の男性．失神を主訴に来院した．3か月前から坂道を登ると眼前が暗くなり，1週間前に歩行中に倒れたという．坂道では前胸部の圧迫感も伴い，平地でも息切れするようになったという．認められる所見はどれか．","options":[{"letter":"A","text":"II音の固定性分裂"},{"letter":"B","text":"頸部に放散する収縮期雑音"},{"letter":"C","text":"心尖部の拡張期ランブル"},{"letter":"D","text":"大腿動脈の拍動増強"},{"letter":"E","text":"前傾で増強する摩擦音"}],"answer":["B"],"multi":false,"explanation":"解説：大動脈弁狭窄症では狭い弁口を通る駆出血流が胸骨右縁第2肋間を最強点とする収縮期駆出性雑音を生み，頸動脈へ放散する．駆出が遅く弱いため頸動脈の立ち上がりは鈍り，遅脈・小脈となる．\n- A：II音の固定性分裂は心房中隔欠損症．\n- B：大動脈弁狭窄症に特徴的で正しい．\n- C：拡張期ランブルは僧帽弁狭窄症．\n- D：大腿動脈の拍動増強（速脈・大脈）は大動脈弁閉鎖不全症の所見で，狭窄症とは逆になる．\n- E：前傾で増強する摩擦音は急性心膜炎．","images":[],"stem_images":[]},{"number":47,"section":"D-5-S12　74歳男性・労作時の失神","question":"（3/4）74歳の男性．失神を主訴に来院した．3か月前から坂道を登ると眼前が暗くなり，1週間前に歩行中に倒れたという．坂道では前胸部の圧迫感も伴い，平地でも息切れするようになったという．胸骨右縁第2肋間を最強点とする収縮期駆出性雑音を聴取し，頸部に放散する．頸動脈の立ち上がりは遅く弱い．重症度の評価に最も有用な検査はどれか．","options":[{"letter":"A","text":"心エコー検査"},{"letter":"B","text":"頭部MRI"},{"letter":"C","text":"脳波検査"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"腹部超音波検査"}],"answer":["A"],"multi":false,"explanation":"解説：心エコーで弁口面積と経弁圧較差，最大血流速度を測れば重症度が定量できる．左室肥大と駆出率も同時に評価でき，弁置換術や経カテーテル大動脈弁留置術の適応判断の基礎になる．\n- A：重症度の定量と手術適応の判断を一度に行え最も有用．\n- B：頭部MRIは脳血管障害を疑う場合の検査．\n- C：脳波はてんかんの評価で，労作時に限って起こる失神には合わない．\n- D：呼吸機能検査は換気障害の評価．\n- E：腹部超音波は腹部臓器の評価．","images":[],"stem_images":[]},{"number":48,"section":"D-5-S12　74歳男性・労作時の失神","question":"（4/4）74歳の男性．失神を主訴に来院した．3か月前から坂道を登ると眼前が暗くなり，1週間前に歩行中に倒れたという．坂道では前胸部の圧迫感も伴い，平地でも息切れするようになったという．胸骨右縁第2肋間を最強点とする収縮期駆出性雑音を聴取し，頸部に放散する．頸動脈の立ち上がりは遅く弱い．心エコー検査で大動脈弁口面積0.7cm2，最大血流速度4.5m/秒であった．最も適切な治療はどれか．","options":[{"letter":"A","text":"経過観察"},{"letter":"B","text":"大動脈弁置換術"},{"letter":"C","text":"硝酸薬の増量"},{"letter":"D","text":"弾性ストッキング"},{"letter":"E","text":"利尿薬の単独投与"}],"answer":["B"],"multi":false,"explanation":"解説：症状のある重症大動脈弁狭窄症は内科治療では予後が改善せず，弁置換術または経カテーテル大動脈弁留置術が適応となる．症状出現後の平均余命は数年と短く，速やかな介入が必要である．\n- A：症状が出た時点で予後は急激に悪化するため経過観察は不適切．\n- B：症候性重症例の標準治療で正しい．\n- C：硝酸薬は前負荷を落として心拍出量をさらに減らし，失神を助長しうる．\n- D：弾性ストッキングは静脈還流不全や起立性低血圧に用いる．\n- E：利尿薬も前負荷を減らし，固定した狭窄では血圧低下を招く危険がある．","images":[],"stem_images":[]},{"number":49,"section":"D-5-S13　19歳男性・運動中の失神","question":"（1/4）19歳の男性．失神を主訴に来院した．大学のサッカー部の練習中に突然倒れ，まもなく意識が戻ったという．普段から強い運動の後に動悸を感じることがあった．遺伝性心疾患による突然死の危険を評価する質問はどれか．","options":[{"letter":"A","text":"倒れる前に動悸がありましたか．"},{"letter":"B","text":"運動前に水分をとりましたか．"},{"letter":"C","text":"最近，風邪をひきましたか．"},{"letter":"D","text":"今まで心雑音を指摘されましたか．"},{"letter":"E","text":"若くして突然死した親族はいますか．"}],"answer":["E"],"multi":false,"explanation":"解説：若年者の運動中失神では肥大型心筋症や遺伝性不整脈による突然死を第一に考える．これらの多くは常染色体顕性遺伝を示すため，家族の若年突然死歴の有無が診断確率を最も大きく動かす．\n- A：本人の発作症状に関する情報．\n- B：脱水の誘因に関する情報．\n- C：感染後の心障害に関する情報．\n- D：本人の診察歴に関する情報．\n- E：遺伝性の致死性心疾患を示唆し有用．","images":[],"stem_images":[]},{"number":50,"section":"D-5-S13　19歳男性・運動中の失神","question":"（2/4）19歳の男性．失神を主訴に来院した．大学のサッカー部の練習中に突然倒れ，まもなく意識が戻ったという．普段から強い運動の後に動悸を感じることがあった．父方の叔父が30歳代で突然死しているという．認められる所見はどれか．","options":[{"letter":"A","text":"II音の固定性分裂"},{"letter":"B","text":"胸骨右縁の連続性雑音"},{"letter":"C","text":"心尖部の拡張期ランブル"},{"letter":"D","text":"立位で増強する収縮期雑音"},{"letter":"E","text":"前傾で増強する摩擦音"}],"answer":["D"],"multi":false,"explanation":"解説：閉塞性肥大型心筋症の左室流出路狭窄は左室容積が減ると悪化する．立位やValsalva手技で静脈還流が減ると雑音が増強し，蹲踞や握力負荷で容積が増えると減弱するという，他の収縮期雑音と逆の動きを示す．\n- A：II音の固定性分裂は心房中隔欠損症．\n- B：連続性雑音は動脈管開存．\n- C：拡張期ランブルは僧帽弁狭窄症．\n- D：負荷による雑音強度の変化が診断的で正しい．\n- E：前傾で増強する摩擦音は急性心膜炎．","images":[],"stem_images":[]},{"number":51,"section":"D-5-S13　19歳男性・運動中の失神","question":"（3/4）19歳の男性．失神を主訴に来院した．大学のサッカー部の練習中に突然倒れ，まもなく意識が戻ったという．普段から強い運動の後に動悸を感じることがあった．父方の叔父が30歳代で突然死しているという．胸骨左縁第4肋間に収縮期雑音を聴取し，立位で増強する．12誘導心電図で左室高電位と胸部誘導の深い陰性T波を認める．次に行うべき検査はどれか．","options":[{"letter":"A","text":"冠動脈造影"},{"letter":"B","text":"上部消化管内視鏡検査"},{"letter":"C","text":"心エコー検査"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"腹部単純エックス線撮影"}],"answer":["C"],"multi":false,"explanation":"解説：心エコーで心室中隔の非対称性肥厚，僧帽弁前尖の収縮期前方運動，左室流出路の圧較差を確認する．非侵襲的で家族のスクリーニングにも使えるため，この段階で最も適切な検査である．\n- A：冠動脈造影は冠動脈狭窄の評価で，19歳の本例では可能性が低い．\n- B：内視鏡は消化管疾患の検査．\n- C：肥厚の形態と流出路狭窄を一度に評価でき正しい．\n- D：呼吸機能検査は換気障害の評価．\n- E：腹部単純写真は腸閉塞や結石の評価用．","images":[],"stem_images":[]},{"number":52,"section":"D-5-S13　19歳男性・運動中の失神","question":"（4/4）19歳の男性．失神を主訴に来院した．大学のサッカー部の練習中に突然倒れ，まもなく意識が戻ったという．普段から強い運動の後に動悸を感じることがあった．父方の叔父が30歳代で突然死しているという．胸骨左縁第4肋間に収縮期雑音を聴取し，立位で増強する．12誘導心電図で左室高電位と胸部誘導の深い陰性T波を認める．心エコー検査で心室中隔が22mmと非対称性に肥厚し，左室流出路に圧較差を認めた．この患者への指導として適切なのはどれか．","options":[{"letter":"A","text":"毎日の全力疾走を勧める"},{"letter":"B","text":"競技スポーツを制限する"},{"letter":"C","text":"水分摂取を厳しく制限する"},{"letter":"D","text":"高強度の筋力訓練を勧める"},{"letter":"E","text":"硝酸薬を常時携帯させる"}],"answer":["B"],"multi":false,"explanation":"解説：肥大型心筋症は若年者の運動関連突然死の主要因で，競技レベルの激しい運動は致死性不整脈の引き金になる．競技スポーツの制限に加え，失神歴や家族歴などの高リスク例では植込み型除細動器を検討する．\n- A：激しい運動は突然死の危険を高め，最も避けるべき行動．\n- B：突然死予防の基本で正しい．\n- C：脱水は左室容積を減らして流出路狭窄を悪化させるため，水分制限は逆効果．\n- D：高強度の筋力訓練も同様に負荷が大きく推奨されない．\n- E：硝酸薬は前負荷を減らして流出路狭窄を増悪させるため禁忌に近い．","images":[],"stem_images":[]},{"number":53,"section":"D-5-S14　28歳男性・感冒様症状後の胸痛","question":"（1/4）28歳の男性．胸痛を主訴に来院した．1週間前から発熱と咽頭痛があり，2日前から前胸部の鈍痛と全身倦怠感が出現したという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"前かがみになると楽ですか．"},{"letter":"B","text":"動悸や失神を伴いますか．"},{"letter":"C","text":"動くと息切れがしますか．"},{"letter":"D","text":"以前から足の爪が変形していますか．"},{"letter":"E","text":"深呼吸で痛みが増しますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性爪病変は今回の胸痛の初期評価では優先度が低い．\n- A：心膜由来の痛みを検討．\n- B：不整脈の合併を評価．\n- C：心機能低下を検討．\n- D：慢性爪病変は今回の胸痛の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：胸膜・心膜由来の痛みを検討．","images":[],"stem_images":[]},{"number":54,"section":"D-5-S14　28歳男性・感冒様症状後の胸痛","question":"（2/4）28歳の男性．胸痛を主訴に来院した．1週間前から発熱と咽頭痛があり，2日前から前胸部の鈍痛と全身倦怠感が出現したという．昨日から少し動いただけで息が切れるという．最も上昇している可能性が高い検査値はどれか．","options":[{"letter":"A","text":"血清アミラーゼ"},{"letter":"B","text":"血中アンモニア"},{"letter":"C","text":"血清リパーゼ"},{"letter":"D","text":"血清尿酸"},{"letter":"E","text":"心筋トロポニンT"}],"answer":["E"],"multi":false,"explanation":"解説：急性心筋炎では心筋細胞の壊死により心筋トロポニンやCK-MBが上昇する．冠動脈に有意狭窄がないのにトロポニンが上がる点が急性心筋梗塞との重要な違いで，BNPも心機能低下に応じて上昇する．\n- A：血清アミラーゼは急性膵炎や耳下腺炎で上昇する．\n- B：アンモニアは肝性脳症で上昇する．\n- C：リパーゼも膵疾患の指標．\n- D：尿酸は痛風や腫瘍崩壊症候群で上昇する．\n- E：心筋傷害を直接反映し正しい．","images":[],"stem_images":[]},{"number":55,"section":"D-5-S14　28歳男性・感冒様症状後の胸痛","question":"（3/4）28歳の男性．胸痛を主訴に来院した．1週間前から発熱と咽頭痛があり，2日前から前胸部の鈍痛と全身倦怠感が出現したという．昨日から少し動いただけで息が切れるという．体温37.8℃．脈拍112/分，整．血圧104/68mmHg．心筋トロポニンTが著明に高値で，12誘導心電図では広範な誘導に軽度のST上昇を認める．次に行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィ"},{"letter":"B","text":"上部消化管内視鏡検査"},{"letter":"C","text":"心エコー検査"},{"letter":"D","text":"頭部単純CT"},{"letter":"E","text":"下肢静脈超音波検査"}],"answer":["C"],"multi":false,"explanation":"解説：心エコーでびまん性の壁運動低下と駆出率の低下，心嚢液貯留を確認し，同時に壁運動異常が特定の冠動脈支配領域に一致しないことを示して急性心筋梗塞と区別する．\n- A：骨シンチグラフィは骨転移の検索．\n- B：内視鏡は消化管疾患の評価．\n- C：心機能低下の程度を評価でき，虚血との鑑別にも有用で正しい．\n- D：頭部CTは意識障害や神経脱落症状がある場合．\n- E：下肢静脈超音波は深部静脈血栓症の検索．","images":[],"stem_images":[]},{"number":56,"section":"D-5-S14　28歳男性・感冒様症状後の胸痛","question":"（4/4）28歳の男性．胸痛を主訴に来院した．1週間前から発熱と咽頭痛があり，2日前から前胸部の鈍痛と全身倦怠感が出現したという．昨日から少し動いただけで息が切れるという．体温37.8℃．脈拍112/分，整．血圧104/68mmHg．心筋トロポニンTが著明に高値で，12誘導心電図では広範な誘導に軽度のST上昇を認める．心エコー検査でびまん性の壁運動低下を認め，左室駆出率は32%であった．緊急冠動脈造影で有意狭窄はなかった．この疾患の最も多い原因はどれか．","options":[{"letter":"A","text":"ウイルス感染"},{"letter":"B","text":"冠動脈の粥状硬化"},{"letter":"C","text":"大動脈内膜の亀裂"},{"letter":"D","text":"心房内の血栓形成"},{"letter":"E","text":"甲状腺ホルモンの過剰"}],"answer":["A"],"multi":false,"explanation":"解説：急性心筋炎の原因の大半はウイルス感染で，コクサッキーB群などのエンテロウイルスやパルボウイルスB19，アデノウイルスが代表である．先行感染から数日〜2週で発症し，劇症型では補助循環を要する．\n- A：最も頻度の高い原因で正しい．\n- B：粥状硬化は急性心筋梗塞の機序だが，本例は冠動脈に有意狭窄がない．\n- C：内膜亀裂は大動脈解離の機序．\n- D：心房内血栓は心原性脳塞栓の原因で，心筋の炎症は起こさない．\n- E：甲状腺ホルモン過剰は頻脈や心房細動をきたすが，トロポニン上昇は説明できない．","images":[],"stem_images":[]},{"number":57,"section":"D-5-S15　55歳男性・2週続く発熱","question":"（1/4）55歳の男性．発熱を主訴に来院した．2週間前から37〜38℃の熱が続き，倦怠感と食欲低下を伴うという．抗菌薬を処方されたが改善しなかった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"海外渡航や動物との接触はありますか．"},{"letter":"B","text":"心臓の弁の病気はありますか．"},{"letter":"C","text":"薬の名前と服用日数を教えてください．"},{"letter":"D","text":"最近，歯科治療を受けましたか．"},{"letter":"E","text":"子どもの頃に乗り物酔いをしましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．遠い過去の乗り物酔いは持続性発熱の評価では優先度が低い．\n- A：別の感染源や曝露を検討．\n- B：心内膜感染の背景を確認．\n- C：先行治療と薬剤熱を検討．\n- D：菌血症の侵入門戸を検討．\n- E：遠い過去の乗り物酔いは持続性発熱の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":58,"section":"D-5-S15　55歳男性・2週続く発熱","question":"（2/4）55歳の男性．発熱を主訴に来院した．2週間前から37〜38℃の熱が続き，倦怠感と食欲低下を伴うという．抗菌薬を処方されたが改善しなかった．3週間前に抜歯を受けたという．認められる所見はどれか．","options":[{"letter":"A","text":"前傾で増強する摩擦音"},{"letter":"B","text":"手指の圧痛を伴う紅斑"},{"letter":"C","text":"II音の固定性分裂"},{"letter":"D","text":"頸静脈の大砲A波"},{"letter":"E","text":"腹部の拍動性腫瘤"}],"answer":["B"],"multi":false,"explanation":"解説：感染性心内膜炎では疣腫由来の微小塞栓と免疫複合体沈着により多彩な末梢徴候が出る．手指・足趾の有痛性のOsler結節，手掌・足底の無痛性Janeway斑，眼底のRoth斑，爪下線状出血が代表である．\n- A：前傾で増強する摩擦音は急性心膜炎．\n- B：Osler結節に相当する所見で正しい．\n- C：II音の固定性分裂は心房中隔欠損症．\n- D：大砲A波は完全房室ブロック．\n- E：拍動性腫瘤は腹部大動脈瘤．","images":[],"stem_images":[]},{"number":59,"section":"D-5-S15　55歳男性・2週続く発熱","question":"（3/4）55歳の男性．発熱を主訴に来院した．2週間前から37〜38℃の熱が続き，倦怠感と食欲低下を伴うという．抗菌薬を処方されたが改善しなかった．3週間前に抜歯を受けたという．体温38.2℃．心尖部に以前は指摘されなかった収縮期雑音を聴取する．手指に圧痛を伴う小結節を認める．最初に行うべき検査はどれか．","options":[{"letter":"A","text":"骨髄穿刺"},{"letter":"B","text":"上部消化管内視鏡検査"},{"letter":"C","text":"頭部MRI"},{"letter":"D","text":"血液培養"},{"letter":"E","text":"呼吸機能検査"}],"answer":["D"],"multi":false,"explanation":"解説：抗菌薬投与前に時間と部位を変えて2〜3セットの血液培養を採取するのが原則である．起因菌の同定は診断基準の柱であると同時に，長期の抗菌薬治療の選択を決めるため最優先で行う．\n- A：骨髄穿刺は血液疾患を疑うときの検査．\n- B：内視鏡は消化管疾患の評価．\n- C：頭部MRIは塞栓性脳梗塞の評価には有用だが，起因菌の同定にはならない．\n- D：診断と治療の両方を規定するため最初に行うべき検査で正しい．\n- E：呼吸機能検査は換気障害の評価．","images":[],"stem_images":[]},{"number":60,"section":"D-5-S15　55歳男性・2週続く発熱","question":"（4/4）55歳の男性．発熱を主訴に来院した．2週間前から37〜38℃の熱が続き，倦怠感と食欲低下を伴うという．抗菌薬を処方されたが改善しなかった．3週間前に抜歯を受けたという．体温38.2℃．心尖部に以前は指摘されなかった収縮期雑音を聴取する．手指に圧痛を伴う小結節を認める．血液培養からレンサ球菌が検出された．診断の確定に最も有用な検査はどれか．","options":[{"letter":"A","text":"冠動脈造影"},{"letter":"B","text":"経食道心エコー検査"},{"letter":"C","text":"運動負荷心電図"},{"letter":"D","text":"心筋生検"},{"letter":"E","text":"腹部造影CT"}],"answer":["B"],"multi":false,"explanation":"解説：経食道心エコーは食道から心臓を至近距離で描出でき，経胸壁心エコーより小さな疣腫や弁輪部膿瘍，人工弁の病変をはるかに高い感度で検出する．疣腫の証明は診断基準の大項目である．\n- A：冠動脈造影は冠動脈狭窄の評価．\n- B：疣腫を直接描出でき，診断確定に最も有用で正しい．\n- C：運動負荷心電図は虚血の誘発が目的で，発熱患者には適さない．\n- D：心筋生検は心筋炎や浸潤性疾患の診断手段．\n- E：腹部造影CTは塞栓性の脾梗塞などの評価には役立つが，弁の病変は写らない．","images":[],"stem_images":[]},{"number":61,"section":"D-5-S16　62歳男性・突然の背部への激痛","question":"（1/4）62歳の男性．突然の胸背部痛を主訴に救急搬送された．発症は1時間前で，仕事中に突然始まったという．高血圧を指摘されていたが未治療であった．大血管に沿う痛みの移動を確認する質問はどれか．","options":[{"letter":"A","text":"痛みは息を吸うと増しますか．"},{"letter":"B","text":"前かがみで楽になりますか．"},{"letter":"C","text":"痛みの場所は移動しますか．"},{"letter":"D","text":"冷汗や吐き気を伴いますか．"},{"letter":"E","text":"歩いたときにも痛みましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：突然発症で最初から最強となり，背中から腰へ移動する引き裂かれるような痛みは大動脈解離に特徴的である．解離が末梢へ進展するにつれ痛みの部位が移るという時間経過が，急性心筋梗塞との重要な違いになる．\n- A：呼吸との関係に関する情報．\n- B：体位との関係に関する情報．\n- C：痛みの移動は解離の進展を反映し有用．\n- D：随伴症状に関する情報．\n- E：労作との関係に関する情報．","images":[],"stem_images":[]},{"number":62,"section":"D-5-S16　62歳男性・突然の背部への激痛","question":"（2/4）62歳の男性．突然の胸背部痛を主訴に救急搬送された．発症は1時間前で，仕事中に突然始まったという．高血圧を指摘されていたが未治療であった．痛みは前胸部に始まり，次第に肩甲骨の間から腰へ移動したという．認められる所見はどれか．","options":[{"letter":"A","text":"心尖部の拡張期ランブル"},{"letter":"B","text":"腸雑音の金属音"},{"letter":"C","text":"II音の固定性分裂"},{"letter":"D","text":"前傾で増強する摩擦音"},{"letter":"E","text":"左右上肢の血圧差"}],"answer":["E"],"multi":false,"explanation":"解説：解離腔が腕頭動脈や左鎖骨下動脈の起始部に及ぶと，その側の血流が減り左右の上肢血圧に20mmHg以上の差が生じる．同時に脈拍の左右差や，大動脈弁輪への進展による拡張期雑音も手がかりになる．\n- A：拡張期ランブルは僧帽弁狭窄症．\n- B：金属性腸雑音は腸閉塞．\n- C：II音の固定性分裂は心房中隔欠損症．\n- D：前傾で増強する摩擦音は急性心膜炎．\n- E：分枝の灌流障害を反映する所見で正しい．","images":[],"stem_images":[]},{"number":63,"section":"D-5-S16　62歳男性・突然の背部への激痛","question":"（3/4）62歳の男性．突然の胸背部痛を主訴に救急搬送された．発症は1時間前で，仕事中に突然始まったという．高血圧を指摘されていたが未治療であった．痛みは前胸部に始まり，次第に肩甲骨の間から腰へ移動したという．血圧は右上肢186/98mmHg，左上肢142/80mmHg．胸部エックス線写真で上縦隔陰影の拡大を認める．次に行うべき検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡検査"},{"letter":"B","text":"骨シンチグラフィ"},{"letter":"C","text":"呼吸機能検査"},{"letter":"D","text":"胸腹部造影CT"},{"letter":"E","text":"下肢静脈超音波検査"}],"answer":["D"],"multi":false,"explanation":"解説：造影CTは内膜フラップと真腔・偽腔を描出し，解離の範囲・上行大動脈への進展・分枝の灌流障害・心嚢液貯留までを一度に評価できる．病型分類が治療方針を直接決めるため必須の検査である．\n- A：内視鏡は消化管疾患の検査で，本例では時間の浪費になる．\n- B：骨シンチグラフィは骨転移の検索．\n- C：呼吸機能検査は換気障害の評価．\n- D：診断と病型分類を一度に行え最も適切．\n- E：下肢静脈超音波は深部静脈血栓症の検索．","images":[],"stem_images":[]},{"number":64,"section":"D-5-S16　62歳男性・突然の背部への激痛","question":"（4/4）62歳の男性．突然の胸背部痛を主訴に救急搬送された．発症は1時間前で，仕事中に突然始まったという．高血圧を指摘されていたが未治療であった．痛みは前胸部に始まり，次第に肩甲骨の間から腰へ移動したという．血圧は右上肢186/98mmHg，左上肢142/80mmHg．胸部エックス線写真で上縦隔陰影の拡大を認める．胸腹部造影CTで上行大動脈から腹部大動脈に及ぶ内膜フラップを認めた．最も適切な対応はどれか．","options":[{"letter":"A","text":"緊急手術"},{"letter":"B","text":"血栓溶解療法"},{"letter":"C","text":"抗血小板薬の投与"},{"letter":"D","text":"経過観察"},{"letter":"E","text":"昇圧薬の投与"}],"answer":["A"],"multi":false,"explanation":"解説：上行大動脈に解離が及ぶStanford A型は，心タンポナーデ・大動脈弁閉鎖不全・冠動脈閉塞により時間単位で死亡率が上がるため緊急手術の適応である．B型は降圧・鎮痛による保存的治療が基本となる．\n- A：A型解離の標準治療で正しい．\n- B：血栓溶解薬は解離腔からの出血を助長し禁忌．急性心筋梗塞と誤って投与しないことが要点．\n- C：抗血小板薬も出血を助長し，解離の治療にはならない．\n- D：放置すれば致死的で経過観察は許されない．\n- E：昇圧は解離をさらに進展させるため逆で，収縮期血圧100〜120mmHgへの降圧が必要．","images":[],"stem_images":[]},{"number":65,"section":"D-5-S17　71歳男性・健診の腹部超音波で異常","question":"（1/4）71歳の男性．健康診断の腹部超音波検査で腹部大動脈の拡大を指摘され来院した．自覚症状はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"腹痛や背中の痛みはありますか．"},{"letter":"B","text":"以前の検査でも拡大していましたか．"},{"letter":"C","text":"家族に大動脈の病気がありますか．"},{"letter":"D","text":"以前から花粉で鼻水が出ますか．"},{"letter":"E","text":"たばこを吸っていますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．季節性鼻炎は大動脈拡大の評価では優先度が低い．\n- A：症候性病変を見逃さない．\n- B：拡大の経過を確認．\n- C：家族性の背景を確認．\n- D：季節性鼻炎は大動脈拡大の評価では優先度が低い．この設問で選ぶ肢．\n- E：大動脈瘤の危険因子を確認．","images":[],"stem_images":[]},{"number":66,"section":"D-5-S17　71歳男性・健診の腹部超音波で異常","question":"（2/4）71歳の男性．健康診断の腹部超音波検査で腹部大動脈の拡大を指摘され来院した．自覚症状はない．喫煙は30本/日を45年間続けており，高血圧で内服中という．腹部の触診所見として予想されるのはどれか．","options":[{"letter":"A","text":"呼吸性に上下する腫瘤"},{"letter":"B","text":"拍動が拡張性に触れる腫瘤"},{"letter":"C","text":"圧痛を伴う板状硬"},{"letter":"D","text":"表面平滑で可動性のある腫瘤"},{"letter":"E","text":"波動を触れる腫瘤"}],"answer":["B"],"multi":false,"explanation":"解説：拡張した大動脈は，両手の指を腫瘤の両側に置くと指が左右に押し広げられる拡張性拍動として触れる．健常者でも痩せていれば大動脈の拍動は伝わるが，その場合は指が同じ方向へ持ち上がるだけである．\n- A：呼吸性に上下する腫瘤は肝・脾・腎など横隔膜の動きに従う臓器の所見．\n- B：拡張性拍動が拡大した大動脈に特徴的で正しい．\n- C：板状硬は消化管穿孔による汎発性腹膜炎．\n- D：表面平滑で可動性のある腫瘤は腸間膜嚢腫や卵巣腫瘍など可動性のある病変．\n- E：波動は腹水や膿瘍など液体貯留を示す所見．","images":[],"stem_images":[]},{"number":67,"section":"D-5-S17　71歳男性・健診の腹部超音波で異常","question":"（3/4）71歳の男性．健康診断の腹部超音波検査で腹部大動脈の拡大を指摘され来院した．自覚症状はない．喫煙は30本/日を45年間続けており，高血圧で内服中という．臍のやや左上に拡張性の拍動性腫瘤を触知する．圧痛はない．治療方針の決定に最も必要な情報はどれか．","options":[{"letter":"A","text":"腹部の圧痛の程度"},{"letter":"B","text":"便潜血"},{"letter":"C","text":"血圧の左右差"},{"letter":"D","text":"腫瘤の可動性"},{"letter":"E","text":"瘤の最大短径"}],"answer":["E"],"multi":false,"explanation":"解説：破裂の危険は径とともに急上昇するため，最大短径が5〜5.5cm以上，または半年で5mm以上の拡大が待機的手術の目安になる．それ未満では画像による定期的な経過観察と，禁煙・降圧による危険因子の管理を行う．\n- A：圧痛は切迫破裂の徴候として重要だが，無症候例の手術適応そのものは決めない．\n- B：便潜血は消化管出血のスクリーニングで，本例の方針とは無関係．\n- C：血圧の左右差は大動脈解離で分枝の灌流障害を疑うときの所見．\n- D：可動性は腫瘍性病変の性状を推し量る所見で，血管の拡大には当てはまらない．\n- E：手術適応を直接規定し最も必要な情報で正しい．","images":[],"stem_images":[]},{"number":68,"section":"D-5-S17　71歳男性・健診の腹部超音波で異常","question":"（4/4）71歳の男性．健康診断の腹部超音波検査で腹部大動脈の拡大を指摘され来院した．自覚症状はない．喫煙は30本/日を45年間続けており，高血圧で内服中という．臍のやや左上に拡張性の拍動性腫瘤を触知する．圧痛はない．造影CTで最大短径42mmの紡錘状拡大を認め，待機的な経過観察となった．その3年後に突然の腹痛とショックで搬送された場合，起こっている病態はどれか．","options":[{"letter":"A","text":"腸管の絞扼"},{"letter":"B","text":"動脈瘤の破裂"},{"letter":"C","text":"胆管の閉塞"},{"letter":"D","text":"膵管の狭窄"},{"letter":"E","text":"尿管の結石嵌頓"}],"answer":["B"],"multi":false,"explanation":"解説：突然の腹痛・腰背部痛，拍動性腫瘤，ショックの三徴は腹部大動脈瘤の破裂を示す．後腹膜腔に出血が留まる間だけ血圧が保たれるため，疑った時点で輸血と緊急手術の準備を並行して進める．\n- A：腸管絞扼では嘔吐と腸雑音の変化が前景に立ち，拍動性腫瘤は説明できない．\n- B：拡大した動脈瘤の既往と突然のショックから最も考えられ正しい．\n- C：胆管閉塞では黄疸と発熱を伴う．\n- D：膵管狭窄では膵炎症状と血清膵酵素の上昇をきたす．\n- E：尿管結石では側腹部の疝痛と血尿をきたすが，ショックには至りにくい．","images":[],"stem_images":[]},{"number":69,"section":"D-5-S18　68歳男性・歩くとふくらはぎが痛む","question":"（1/4）68歳の男性．歩行時の下肢の痛みを主訴に来院した．半年前から症状があり，次第に歩ける距離が短くなったという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"喫煙や糖尿病はありますか．"},{"letter":"B","text":"前かがみになると楽ですか．"},{"letter":"C","text":"立ち止まると痛みが治まりますか．"},{"letter":"D","text":"足先が冷たく感じますか．"},{"letter":"E","text":"冷たい物で歯がしみますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．知覚過敏は間欠性下肢痛の評価では優先度が低い．\n- A：動脈硬化の危険因子を確認．\n- B：神経性跛行との鑑別に有用．\n- C：運動と症状の関係を確認．\n- D：末梢循環不全を検討．\n- E：知覚過敏は間欠性下肢痛の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":70,"section":"D-5-S18　68歳男性・歩くとふくらはぎが痛む","question":"（2/4）68歳の男性．歩行時の下肢の痛みを主訴に来院した．半年前から症状があり，次第に歩ける距離が短くなったという．200mほど歩くと右のふくらはぎが痛み，立ち止まると3分ほどで治まって再び歩けるという．認められる所見はどれか．","options":[{"letter":"A","text":"膝蓋腱反射の亢進"},{"letter":"B","text":"下腿の圧痕性浮腫"},{"letter":"C","text":"足の把握痛と発赤"},{"letter":"D","text":"足背動脈の拍動減弱"},{"letter":"E","text":"大腿四頭筋の線維束攣縮"}],"answer":["D"],"multi":false,"explanation":"解説：下肢動脈の狭窄では病変より末梢の拍動が弱くなり，足背動脈・後脛骨動脈で触知しにくくなる．皮膚は冷たく，体毛が薄く，爪は肥厚し，進行すると安静時痛や潰瘍・壊死に至る．\n- A：腱反射亢進は上位運動ニューロン障害の所見．\n- B：圧痕性浮腫は静脈還流不全や心不全・低アルブミン血症．\n- C：把握痛と発赤は深部静脈血栓症や蜂窩織炎．\n- D：動脈血流低下を直接示す所見で正しい．\n- E：線維束攣縮は筋萎縮性側索硬化症など下位運動ニューロン障害．","images":[],"stem_images":[]},{"number":71,"section":"D-5-S18　68歳男性・歩くとふくらはぎが痛む","question":"（3/4）68歳の男性．歩行時の下肢の痛みを主訴に来院した．半年前から症状があり，次第に歩ける距離が短くなったという．200mほど歩くと右のふくらはぎが痛み，立ち止まると3分ほどで治まって再び歩けるという．右の足背動脈と後脛骨動脈の拍動は触知できない．まず行うべき検査はどれか．","options":[{"letter":"A","text":"腰椎MRI"},{"letter":"B","text":"神経伝導速度"},{"letter":"C","text":"足関節上腕血圧比"},{"letter":"D","text":"骨シンチグラフィ"},{"letter":"E","text":"呼吸機能検査"}],"answer":["C"],"multi":false,"explanation":"解説：足関節と上腕の収縮期血圧の比（ABI）は簡便で非侵襲的な下肢動脈のスクリーニングである．0.9以下で動脈狭窄を示し，重症度の把握と治療効果の判定にも用いる．\n- A：腰椎MRIは腰部脊柱管狭窄症を疑うときの検査で，動脈拍動が触れない本例では先行しない．\n- B：神経伝導速度は末梢神経障害の評価．\n- C：簡便で診断価値が高く最初に行うべき検査で正しい．\n- D：骨シンチグラフィは骨病変の検索．\n- E：呼吸機能検査は換気障害の評価．","images":[],"stem_images":[]},{"number":72,"section":"D-5-S18　68歳男性・歩くとふくらはぎが痛む","question":"（4/4）68歳の男性．歩行時の下肢の痛みを主訴に来院した．半年前から症状があり，次第に歩ける距離が短くなったという．200mほど歩くと右のふくらはぎが痛み，立ち止まると3分ほどで治まって再び歩けるという．右の足背動脈と後脛骨動脈の拍動は触知できない．右の足関節上腕血圧比は0.62であった．前かがみで症状が軽快する別の疾患との鑑別点はどれか．","options":[{"letter":"A","text":"症状が下肢に出ること"},{"letter":"B","text":"加齢とともに増えること"},{"letter":"C","text":"歩行で症状が出ること"},{"letter":"D","text":"喫煙が危険因子であること"},{"letter":"E","text":"末梢動脈の拍動が減弱すること"}],"answer":["E"],"multi":false,"explanation":"解説：前傾姿勢で軽快するのは腰部脊柱管狭窄症の神経性間欠跛行で，馬尾の圧迫が姿勢で変わるために起こる．末梢動脈の拍動は保たれABIも正常なので，拍動の触知とABIが両者を分ける決め手になる
