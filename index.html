t":"呼吸機能検査の施行"},{"letter":"D","text":"子宮頸部の細胞診の実施"},{"letter":"E","text":"上部消化管内視鏡と生検の施行"}],"answer":["D"],"multi":false,"explanation":"解説：扁平円柱上皮境界を含めて擦過し，異型細胞の有無を調べる．異常があればコルポスコピーで病変を拡大観察し，最も疑わしい部位から狙って組織診を行うという段階を踏む．\n- A：骨シンチグラフィは骨病変の検索．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：呼吸機能検査は換気障害の評価．\n- D：診断の第一段階として正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":51,"section":"E-3-S13　38歳女性・性交後の出血","question":"（3/4）38歳の女性．3か月前から性交のあとに少量の出血があり，おりものも増えたという．検診は5年以上受けていないという．子宮頸部細胞診で高度扁平上皮内病変が疑われ，狙い組織診で浸潤癌と診断された．この癌の原因はどれか．","options":[{"letter":"A","text":"Epstein-Barrウイルスの感染"},{"letter":"B","text":"B型肝炎ウイルスの持続感染"},{"letter":"C","text":"ピロリ菌の持続的な感染"},{"letter":"D","text":"サイトメガロウイルスの感染"},{"letter":"E","text":"高リスク型HPVの持続感染"}],"answer":["E"],"multi":false,"explanation":"解説：16型や18型などの高リスク型が持続感染すると，ウイルス蛋白が宿主の癌抑制遺伝子産物を不活化して発癌に至る．性交渉で感染し，多くは自然排除されるが一部が持続する．\n- A：Epstein-Barrウイルスは伝染性単核球症やBurkittリンパ腫と関連．\n- B：B型肝炎ウイルスは肝細胞癌と関連．\n- C：ピロリ菌の持続感染は胃癌と関連．\n- D：サイトメガロウイルスは先天感染や日和見感染で問題になる．\n- E：この癌の原因として正しい．","images":[],"stem_images":[]},{"number":52,"section":"E-3-S13　38歳女性・性交後の出血","question":"（4/4）38歳の女性．3か月前から性交のあとに少量の出血があり，おりものも増えたという．検診は5年以上受けていないという．子宮頸部細胞診で高度扁平上皮内病変が疑われ，コルポスコピー下の狙い組織診で浸潤癌と診断された．HPVの型別検査では16型が陽性であった．この癌の一次予防として有効なのはどれか．","options":[{"letter":"A","text":"定期的な細胞診の受診である"},{"letter":"B","text":"抗菌薬の予防的な長期内服である"},{"letter":"C","text":"抗ウイルス薬の予防的な内服である"},{"letter":"D","text":"HPVワクチンの接種である"},{"letter":"E","text":"骨盤内の定期的な画像検査である"}],"answer":["D"],"multi":false,"explanation":"解説：性交渉を経験する前の接種で，高リスク型の感染そのものを防げる．検診は既にできた病変を早期に見つける二次予防にあたり，ワクチンと検診の両輪で発症と死亡を減らせる．\n- A：細胞診は二次予防にあたる．\n- B：抗菌薬はウイルス感染を防げない．\n- C：この感染に対する予防内服薬はない．\n- D：唯一の一次予防手段で正しい．\n- E：画像検査も早期発見の手段にとどまる．","images":[],"stem_images":[]},{"number":53,"section":"E-3-S14　58歳女性・閉経後の不正出血","question":"（1/4）58歳の女性．3年前に閉経したが，1か月前から少量の性器出血が続くという．身長155cm，体重78kg．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"タモキシフェンを使っていますか．"},{"letter":"B","text":"妊娠・出産の経験はありますか．"},{"letter":"C","text":"血が尿や便に混じることはありますか．"},{"letter":"D","text":"子どもの頃に中耳炎がありましたか．"},{"letter":"E","text":"女性ホルモンの治療を受けていますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．小児期の中耳炎は閉経後出血の原因検索では優先度が低い．\n- A：内膜病変に関連する薬剤を確認．\n- B：子宮内膜癌の背景を評価．\n- C：出血部位を確認．\n- D：小児期の中耳炎は閉経後出血の原因検索では優先度が低い．この設問で選ぶ肢．\n- E：外因性ホルモンの影響を確認．","images":[],"stem_images":[]},{"number":54,"section":"E-3-S14　58歳女性・閉経後の不正出血","question":"（2/4）58歳の女性．3年前に閉経したが，1か月前から少量の性器出血が続くという．身長155cm，体重78kg．出産歴はなく，乳癌でタモキシフェンを5年間内服したという．最初に行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"上部消化管内視鏡と生検の施行"},{"letter":"E","text":"子宮内膜の細胞診と組織診"}],"answer":["E"],"multi":false,"explanation":"解説：閉経後の不正出血はまずこの癌を疑う．経腟超音波で内膜の厚みを測り，内膜細胞診と組織診で確定する．子宮頸部細胞診だけでは内膜の病変を拾えないので別に行う必要がある．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：内視鏡は消化管疾患の評価．\n- E：診断に直結し正しい．","images":[],"stem_images":[]},{"number":55,"section":"E-3-S14　58歳女性・閉経後の不正出血","question":"（3/4）58歳の女性．3年前に閉経したが，1か月前から少量の性器出血が続くという．身長155cm，体重78kg．出産歴はなく，乳癌でタモキシフェンを5年間内服したという．経腟超音波で子宮内膜が18mmと肥厚し，内膜組織診で類内膜癌と診断された．この癌の背景にある機序はどれか．","options":[{"letter":"A","text":"エストロゲンの持続的な刺激"},{"letter":"B","text":"高リスク型HPVの持続感染"},{"letter":"C","text":"ピロリ菌の持続的な感染"},{"letter":"D","text":"紫外線への長期にわたる曝露"},{"letter":"E","text":"アスベストへの長期の曝露"}],"answer":["A"],"multi":false,"explanation":"解説：プロゲステロンによる拮抗を欠いたままエストロゲンが内膜を刺激し続けると，内膜増殖症を経て癌化する．肥満では脂肪組織でエストロゲンが産生されるため危険がさらに高まる．\n- A：この癌の主要な発生機序で正しい．\n- B：高リスク型HPVは子宮頸癌の原因．\n- C：ピロリ菌の持続感染は胃癌と関連．\n- D：紫外線曝露は皮膚癌の危険因子．\n- E：アスベスト曝露は悪性中皮腫と関連．","images":[],"stem_images":[]},{"number":56,"section":"E-3-S14　58歳女性・閉経後の不正出血","question":"（4/4）58歳の女性．3年前に閉経したが，1か月前から少量の性器出血が続くという．身長155cm，体重78kg．出産歴はなく，乳癌でタモキシフェンを5年間内服したという．経腟超音波で子宮内膜が18mmと肥厚し，内膜組織診で類内膜癌と診断された．同じ骨盤内で無症状のまま進行し腹水で気づかれることが多い癌はどれか．","options":[{"letter":"A","text":"子宮頸癌である"},{"letter":"B","text":"卵巣癌である"},{"letter":"C","text":"腟癌である"},{"letter":"D","text":"外陰癌である"},{"letter":"E","text":"尿道癌である"}],"answer":["B"],"multi":false,"explanation":"解説：卵巣は骨盤の深部にあり早期には症状が出にくいため，腹部膨満や腹水で発見されることが多い．有効な検診法が確立しておらず，診断時には既に腹膜播種を伴う進行例が大半を占める．\n- A：子宮頸癌は不正出血や帯下で比較的早く気づかれる．\n- B：発見の遅れやすさから正しい．\n- C：腟癌は出血や帯下で気づかれる．\n- D：外陰癌は掻痒や腫瘤として自覚しやすい．\n- E：尿道癌は排尿症状や出血で気づかれる．","images":[],"stem_images":[]},{"number":57,"section":"E-3-S15　52歳女性・頸部前面の腫瘤","question":"（1/4）52歳の女性．半年前から前頸部にしこりがあることに気づいたという．痛みはなく，嚥下時に上下に動く．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"家族に甲状腺癌の人はいますか．"},{"letter":"B","text":"声のかすれはありますか．"},{"letter":"C","text":"しこりが急に大きくなりましたか．"},{"letter":"D","text":"首に放射線治療を受けましたか．"},{"letter":"E","text":"以前から排便時に肛門が痛みますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．肛門局所症状は前頸部腫瘤の初期評価では優先度が低い．\n- A：家族性疾患を検討．\n- B：周囲組織への影響を確認．\n- C：増大速度を評価．\n- D：甲状腺癌の危険因子を確認．\n- E：肛門局所症状は前頸部腫瘤の初期評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":58,"section":"E-3-S15　52歳女性・頸部前面の腫瘤","question":"（2/4）52歳の女性．半年前から前頸部にしこりがあることに気づいたという．痛みはなく，嚥下時に上下に動く．放射線を受けた既往はないという．最初に行うべき検査はどれか．","options":[{"letter":"A","text":"頸部超音波検査の施行"},{"letter":"B","text":"骨シンチグラフィによる全身検索"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"呼吸機能検査の施行"},{"letter":"E","text":"上部消化管内視鏡と生検の施行"}],"answer":["A"],"multi":false,"explanation":"解説：結節の大きさ・境界・内部エコー・微細な石灰化・血流と，頸部リンパ節の腫大を同時に評価できる．悪性を疑う所見があれば超音波ガイド下の穿刺吸引細胞診に進む．\n- A：非侵襲的で情報量が多く正しい．\n- B：骨シンチグラフィは骨病変の検索．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：呼吸機能検査は換気障害の評価．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":59,"section":"E-3-S15　52歳女性・頸部前面の腫瘤","question":"（3/4）52歳の女性．半年前から前頸部にしこりがあることに気づいたという．痛みはなく，嚥下時に上下に動く．放射線を受けた既往はないという．超音波で甲状腺右葉に境界不明瞭で微細石灰化を伴う15mmの結節を認め，穿刺吸引細胞診で乳頭癌と診断された．この癌の特徴はどれか．","options":[{"letter":"A","text":"早期から血行性に肺へ転移する"},{"letter":"B","text":"診断後数か月で急速に増大する"},{"letter":"C","text":"カルシトニンが著明に上昇する"},{"letter":"D","text":"リンパ節転移が多いが予後は良い"},{"letter":"E","text":"有効な治療法がまったくない"}],"answer":["D"],"multi":false,"explanation":"解説：頸部リンパ節への転移が高率にみられるが，それでも長期予後は良好である．手術が治療の中心で，進行例では放射性ヨウ素内用療法と甲状腺刺激ホルモン抑制療法を組み合わせる．\n- A：血行性転移は濾胞癌でより目立つ．\n- B：急速な増大は未分化癌の特徴．\n- C：カルシトニンの上昇は髄様癌．\n- D：この癌の特徴として正しい．\n- E：手術を中心に有効な治療がある．","images":[],"stem_images":[]},{"number":60,"section":"E-3-S15　52歳女性・頸部前面の腫瘤","question":"（4/4）52歳の女性．半年前から前頸部にしこりがあることに気づいたという．痛みはなく，嚥下時に上下に動く．放射線を受けた既往はないという．超音波で甲状腺右葉に境界不明瞭で微細石灰化を伴う15mmの結節を認め，穿刺吸引細胞診で乳頭癌と診断された．血清カルシトニンとCEAが上昇し，家族にも同様の患者がいる場合に疑う組織型はどれか．","options":[{"letter":"A","text":"濾胞癌である"},{"letter":"B","text":"未分化癌である"},{"letter":"C","text":"甲状腺の悪性リンパ腫"},{"letter":"D","text":"乳頭癌の別の亜型である"},{"letter":"E","text":"髄様癌である"}],"answer":["E"],"multi":false,"explanation":"解説：傍濾胞細胞（C細胞）由来でカルシトニンとCEAを産生する．約3割は遺伝性で多発性内分泌腫瘍症2型の一部として現れ，褐色細胞腫や副甲状腺機能亢進症を合併するため血縁者の検索も要る．\n- A：濾胞癌はカルシトニンを産生しない．\n- B：未分化癌は急速に増大し予後が極めて悪い．\n- C：悪性リンパ腫は橋本病を背景に生じることがある．\n- D：乳頭癌の亜型もカルシトニンは産生しない．\n- E：マーカーと家族歴に合致し正しい．","images":[],"stem_images":[]},{"number":61,"section":"E-3-S16　62歳男性・治らない舌のただれ","question":"（1/4）62歳の男性．1か月以上前から舌の脇にただれがあり治らないという．喫煙と飲酒を長く続けている．口腔粘膜病変の持続期間を明らかにする質問はどれか．","options":[{"letter":"A","text":"ただれは何週間続いていますか．"},{"letter":"B","text":"舌を噛む癖はありますか．"},{"letter":"C","text":"尖った歯が当たりますか．"},{"letter":"D","text":"熱い食物でやけどをしましたか．"},{"letter":"E","text":"飲酒量はどのくらいですか．"}],"answer":["A"],"multi":false,"explanation":"解説：アフタ性口内炎は1〜2週で治るので，2週以上治らない潰瘍は悪性を疑って生検する．喫煙と飲酒という危険因子が揃っていれば，経過観察ではなく組織診断へ進む根拠になる．\n- A：生検の適応を決め有用．\n- B：反復する局所外傷に関する情報．\n- C：機械的刺激に関する情報．\n- D：熱傷に関する情報．\n- E：危険因子に関する情報．","images":[],"stem_images":[]},{"number":62,"section":"E-3-S16　62歳男性・治らない舌のただれ","question":"（2/4）62歳の男性．1か月以上前から舌の脇にただれがあり治らないという．喫煙と飲酒を長く続けている．ただれは6週間治らないという．最も適切な対応はどれか．","options":[{"letter":"A","text":"含嗽薬でさらに2か月経過をみる"},{"letter":"B","text":"抗菌薬の内服で経過をみる"},{"letter":"C","text":"抗ウイルス薬の投与を開始する"},{"letter":"D","text":"病変部の生検を行う"},{"letter":"E","text":"副腎皮質ステロイドの軟膏を塗る"}],"answer":["D"],"multi":false,"explanation":"解説：2週以上治らない口腔内の潰瘍は生検の絶対適応である．舌側縁は舌癌の好発部位であり，歯による慢性の刺激も発生に関わる．診断の遅れが予後を大きく左右する．\n- A：さらに経過をみることは診断の遅れになる．\n- B：抗菌薬は細菌感染の治療．\n- C：抗ウイルス薬はヘルペス感染の治療．\n- D：組織診断への唯一の道で正しい．\n- E：ステロイド軟膏は炎症性の潰瘍に用いる．","images":[],"stem_images":[]},{"number":63,"section":"E-3-S16　62歳男性・治らない舌のただれ","question":"（3/4）62歳の男性．1か月以上前から舌の脇にただれがあり治らないという．喫煙と飲酒を長く続けている．ただれは6週間治らないという．病変は右舌側縁にあり，径15mmの硬結を伴う潰瘍であった．生検で扁平上皮癌と診断された．同時に検索すべきなのはどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカーの推移"},{"letter":"B","text":"終夜睡眠ポリグラフィでの無呼吸"},{"letter":"C","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"D","text":"屈折検査と矯正視力の詳細な測定"},{"letter":"E","text":"食道など上気道消化管の重複癌"}],"answer":["E"],"multi":false,"explanation":"解説：喫煙と飲酒により上気道消化管の粘膜全体が同じ発癌刺激を受けているため，別の部位に同時性あるいは異時性の癌が生じやすい．内視鏡で食道・咽頭・喉頭を系統的に観察する．\n- A：骨密度は骨粗鬆症の評価．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：呼吸機能検査は換気障害の評価．\n- D：屈折検査は視力の評価．\n- E：領域性発癌の考え方に基づき正しい．","images":[],"stem_images":[]},{"number":64,"section":"E-3-S16　62歳男性・治らない舌のただれ","question":"（4/4）62歳の男性．1か月以上前から舌の脇にただれがあり治らないという．喫煙と飲酒を長く続けている．ただれは6週間治らないという．病変は右舌側縁にあり，径15mmの硬結を伴う潰瘍であった．生検で扁平上皮癌と診断され，内視鏡で重複癌はなかった．同じ危険因子をもつ部位のうち，早期から嗄声が出るため比較的早く発見されるのはどれか．","options":[{"letter":"A","text":"上咽頭の癌である"},{"letter":"B","text":"中咽頭の癌である"},{"letter":"C","text":"下咽頭の癌である"},{"letter":"D","text":"声門の癌である"},{"letter":"E","text":"頸部食道の癌である"}],"answer":["D"],"multi":false,"explanation":"解説：声帯そのものに生じるため，ごく小さいうちから嗄声をきたす．リンパ流に乏しく転移も遅いので予後が良い．一方で下咽頭癌は症状が乏しく，頸部リンパ節腫大で初めて気づかれやすい．\n- A：上咽頭癌は鼻閉や滲出性中耳炎で気づかれる．\n- B：中咽頭癌は咽頭痛や頸部腫瘤で気づかれることが多い．\n- C：下咽頭癌は症状に乏しく発見が遅れやすい．\n- D：早期から症状が出る点で正しい．\n- E：頸部食道癌も嚥下障害が出るまで気づかれにくい．","images":[],"stem_images":[]}],"seed":null},{"id":"E-4_免疫アレルギー","name":"E-4_免疫アレルギー.md","label":"E-4 免疫アレルギー","count":48,"sourceHash":"aef24dfde15e","questions":[{"number":1,"section":"E-4-S01　24歳男性・食後の全身の膨疹と呼吸困難","question":"（1/4）24歳の男性．20分前に友人宅で食事をした直後から全身にみみず腫れが出て，息苦しくなったという．救急搬送された．原因となる食物と曝露時刻を確認する質問はどれか．","options":[{"letter":"A","text":"以前にじんましんが出ましたか．"},{"letter":"B","text":"何をどれだけ前に食べましたか．"},{"letter":"C","text":"喘息の治療をしていますか．"},{"letter":"D","text":"食後に運動をしましたか．"},{"letter":"E","text":"薬を新しく飲みましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：抗原への曝露から発症までの時間が数分から30分以内であることが，この病態を疑う根拠になる．原因食物の特定は再曝露の回避という長期の管理にも直結する．\n- A：アレルギー歴に関する情報．\n- B：診断と再発予防の両方を左右し有用．\n- C：重症化の背景に関する情報．\n- D：反応を増強する補助因子に関する情報．\n- E：食物以外の原因候補に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"E-4-S01　24歳男性・食後の全身の膨疹と呼吸困難","question":"（2/4）24歳の男性．20分前に友人宅で食事をした直後から全身にみみず腫れが出て，息苦しくなったという．救急搬送された．そばを食べた直後から症状が出たという．直ちに行うべき処置はどれか．","options":[{"letter":"A","text":"抗ヒスタミン薬の内服のみ行う"},{"letter":"B","text":"副腎皮質ステロイドの内服のみ"},{"letter":"C","text":"アドレナリンの筋肉内注射"},{"letter":"D","text":"気管支拡張薬の吸入のみ行う"},{"letter":"E","text":"経過をみて症状の推移を観察する"}],"answer":["C"],"multi":false,"explanation":"解説：大腿部の外側広筋にアドレナリンを筋注することが唯一の第一選択で，投与の遅れが死亡と直結する．血管収縮・気管支拡張・肥満細胞からの遊離抑制を同時にもたらす．\n- A：抗ヒスタミン薬は皮膚症状の補助にとどまる．\n- B：ステロイドは効果発現が遅く二相性反応の予防用．\n- C：唯一の第一選択で正しい．\n- D：気管支拡張薬は喘鳴の補助的な対応．\n- E：経過観察している間に循環虚脱に至りうる．","images":[],"stem_images":[]},{"number":3,"section":"E-4-S01　24歳男性・食後の全身の膨疹と呼吸困難","question":"（3/4）24歳の男性．20分前に友人宅で食事をした直後から全身にみみず腫れが出て，息苦しくなったという．救急搬送された．そばを食べた直後から症状が出たという．アドレナリンの筋注で症状は速やかに改善し，血圧も回復した．次に必要な対応はどれか．","options":[{"letter":"A","text":"直ちに帰宅させて翌日に再診"},{"letter":"B","text":"数時間の経過観察を行う"},{"letter":"C","text":"直ちに抗菌薬の投与を始める"},{"letter":"D","text":"抗ウイルス薬の投与を始める"},{"letter":"E","text":"直ちに免疫療法を開始する"}],"answer":["B"],"multi":false,"explanation":"解説：初回の症状が改善した数時間後に再び症状が出る二相性反応が一定の頻度で起こる．改善しても数時間は院内で観察し，必要に応じてステロイドと抗ヒスタミン薬を併用する．\n- A：二相性反応の危険があり即時帰宅は不適切．\n- B：標準的な対応で正しい．\n- C：抗菌薬は感染症の治療．\n- D：抗ウイルス薬もこの病態に無効．\n- E：免疫療法は安定期に専門施設で検討する．","images":[],"stem_images":[]},{"number":4,"section":"E-4-S01　24歳男性・食後の全身の膨疹と呼吸困難","question":"（4/4）24歳の男性．20分前に友人宅で食事をした直後から全身にみみず腫れが出て，息苦しくなったという．救急搬送された．そばを食べた直後から症状が出たという．アドレナリンの筋注で症状は速やかに改善し，血圧も回復した．数時間の観察後に退院となった．退院時の指導として最も重要なのはどれか．","options":[{"letter":"A","text":"水分摂取を1日500mLに制限する"},{"letter":"B","text":"終日の床上安静を続けること"},{"letter":"C","text":"蛋白質の摂取を厳しく制限する"},{"letter":"D","text":"直射日光をまったく避けること"},{"letter":"E","text":"原因食物の回避と自己注射薬の携帯"}],"answer":["E"],"multi":false,"explanation":"解説：原因食物の完全な除去と，加工食品の表示確認を指導する．アドレナリン自己注射薬を処方して使用法を実演し，家族や学校・職場とも情報を共有しておくことが再発時の救命につながる．\n- A：水分制限はこの病態と無関係．\n- B：床上安静も必要ない．\n- C：蛋白制限は腎不全の食事療法．\n- D：日光の回避は光線過敏症などの指導．\n- E：再曝露時の救命に直結し正しい．","images":[],"stem_images":[]},{"number":5,"section":"E-4-S02　52歳女性・手指の腫れと痛み","question":"（1/4）52歳の女性．半年前から両手の指が腫れて痛み，朝は握りにくいという．炎症性関節症を示唆する朝の症状を評価する質問はどれか．","options":[{"letter":"A","text":"痛みは左右どちらが強いですか．"},{"letter":"B","text":"手を使うと痛みますか．"},{"letter":"C","text":"朝のこわばりはどのくらい続きますか．"},{"letter":"D","text":"夜間にしびれますか．"},{"letter":"E","text":"けがをしたことはありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：1時間以上続く朝のこわばりは滑膜の炎症を示し，30分以内で動き出すと消える変形性関節症とは区別できる．持続時間が病型を分ける最も実用的な問診項目になる．\n- A：左右差に関する情報．\n- B：機械的負荷との関係に関する情報．\n- C：炎症性か変性かを分け有用．\n- D：神経圧迫症状に関する情報．\n- E：外傷に関する情報．","images":[],"stem_images":[]},{"number":6,"section":"E-4-S02　52歳女性・手指の腫れと痛み","question":"（2/4）52歳の女性．半年前から両手の指が腫れて痛み，朝は握りにくいという．朝のこわばりは2時間ほど続き，握力も落ちてきたという．侵されやすい関節はどれか．","options":[{"letter":"A","text":"遠位指節間関節が対称性に腫れる"},{"letter":"B","text":"母趾の中足趾節関節のみが腫れる"},{"letter":"C","text":"片側の膝関節だけが急に腫れる"},{"letter":"D","text":"近位指節間関節と中手指節関節"},{"letter":"E","text":"脊椎と仙腸関節が中心に侵される"}],"answer":["D"],"multi":false,"explanation":"解説：近位指節間関節・中手指節関節・手関節が左右対称に侵され，遠位指節間関節は侵されない．これが遠位指節間関節にHeberden結節をつくる変形性関節症との決定的な違いになる．\n- A：遠位指節間関節の変形は変形性関節症のHeberden結節．\n- B：母趾の中足趾節関節の急性単関節炎は痛風．\n- C：片側膝関節の急な腫脹は化膿性関節炎や結晶性関節炎．\n- D：この疾患の分布として正しい．\n- E：脊椎と仙腸関節が中心なのは強直性脊椎炎．","images":[],"stem_images":[]},{"number":7,"section":"E-4-S02　52歳女性・手指の腫れと痛み","question":"（3/4）52歳の女性．半年前から両手の指が腫れて痛み，朝は握りにくいという．朝のこわばりは2時間ほど続くという．近位指節間関節と中手指節関節に対称性の腫脹と圧痛を認め，遠位指節間関節は侵されていない．診断に最も特異度の高い検査はどれか．","options":[{"letter":"A","text":"抗核抗体の測定"},{"letter":"B","text":"抗CCP抗体の測定"},{"letter":"C","text":"血清尿酸値の測定"},{"letter":"D","text":"抗ミトコンドリア抗体"},{"letter":"E","text":"抗アセチルコリン受容体抗体"}],"answer":["B"],"multi":false,"explanation":"解説：リウマトイド因子は他の膠原病や健常高齢者でも陽性になるが，抗CCP抗体は特異度が高く発症前から陽性になりうる．早期診断と，関節破壊が進みやすい症例の予測にも用いる．\n- A：抗核抗体は全身性エリテマトーデスなどで陽性となり特異度が低い．\n- B：この疾患に特異度が高く正しい．\n- C：血清尿酸値は痛風の評価．\n- D：抗ミトコンドリア抗体は原発性胆汁性胆管炎．\n- E：抗アセチルコリン受容体抗体は重症筋無力症．","images":[],"stem_images":[]},{"number":8,"section":"E-4-S02　52歳女性・手指の腫れと痛み","question":"（4/4）52歳の女性．半年前から両手の指が腫れて痛み，朝は握りにくいという．朝のこわばりは2時間ほど続くという．近位指節間関節と中手指節関節に対称性の腫脹と圧痛を認め，遠位指節間関節は侵されていない．抗CCP抗体が高値であった．治療方針として正しいのはどれか．","options":[{"letter":"A","text":"早期からメトトレキサートを開始"},{"letter":"B","text":"痛みが強いときだけ鎮痛薬を使う"},{"letter":"C","text":"関節の変形が出るまで経過をみる"},{"letter":"D","text":"尿酸降下薬を長期に内服させる"},{"letter":"E","text":"抗菌薬を長期に予防投与する"}],"answer":["A"],"multi":false,"explanation":"解説：発症から数年以内に関節破壊が急速に進むため，診断がついた時点で抗リウマチ薬を開始する．メトトレキサートが中心で，効果不十分なら生物学的製剤やJAK阻害薬を加える．\n- A：関節破壊を防ぐ標準戦略で正しい．\n- B：鎮痛薬だけでは関節破壊は止められない．\n- C：変形が出てからでは不可逆である．\n- D：尿酸降下薬は痛風の治療．\n- E：抗菌薬は感染症の治療．","images":[],"stem_images":[]},{"number":9,"section":"E-4-S03　26歳女性・頬の紅斑と発熱と関節痛","question":"（1/4）26歳の女性．2か月前から微熱と手指の関節痛が続き，最近は頬に赤みが出てきたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"幼少期から近視ですか．"},{"letter":"B","text":"最近，新しい薬を飲みましたか．"},{"letter":"C","text":"日光で皮疹が悪化しますか．"},{"letter":"D","text":"尿が泡立つことはありますか．"},{"letter":"E","text":"口内炎や脱毛はありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性幼少期からの近視は今回の全身炎症症状の評価では優先度が低い．\n- A：慢性幼少期からの近視は今回の全身炎症症状の評価では優先度が低い．この設問で選ぶ肢．\n- B：薬剤関連の自己免疫症状を検討．\n- C：光線過敏を確認．\n- D：腎障害を疑う症状を確認．\n- E：粘膜・皮膚症状の広がりを確認．","images":[],"stem_images":[]},{"number":10,"section":"E-4-S03　26歳女性・頬の紅斑と発熱と関節痛","question":"（2/4）26歳の女性．2か月前から微熱と手指の関節痛が続き，最近は頬に赤みが出てきたという．屋外に出た日に皮疹が悪化するという．口の中にも痛くない潰瘍ができる．予想される検査所見はどれか．","options":[{"letter":"A","text":"抗CCP抗体の著明な高値"},{"letter":"B","text":"抗ミトコンドリア抗体の陽性"},{"letter":"C","text":"抗核抗体陽性と血清補体の低下"},{"letter":"D","text":"血清尿酸値の著明な上昇"},{"letter":"E","text":"抗アセチルコリン受容体抗体の陽性"}],"answer":["C"],"multi":false,"explanation":"解説：抗核抗体は感度が高く，ほぼ全例で陽性となる．免疫複合体が補体を消費するためC3・C4・CH50が低下し，抗DNA抗体価とともに疾患活動性の指標として経過観察に用いられる．\n- A：抗CCP抗体は関節リウマチに特異的．\n- B：抗ミトコンドリア抗体は原発性胆汁性胆管炎．\n- C：この疾患の典型的な組合せで正しい．\n- D：尿酸値の上昇は痛風．\n- E：抗アセチルコリン受容体抗体は重症筋無力症．","images":[],"stem_images":[]},{"number":11,"section":"E-4-S03　26歳女性・頬の紅斑と発熱と関節痛","question":"（3/4）26歳の女性．2か月前から微熱と手指の関節痛が続き，最近は頬に赤みが出てきたという．屋外に出た日に皮疹が悪化するという．口の中にも痛くない潰瘍ができる．抗核抗体が高力価で陽性，C3とC4が低下していた．臓器病変の評価として最も重要なのはどれか．","options":[{"letter":"A","text":"骨密度の測定の実施"},{"letter":"B","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"尿蛋白と尿沈渣の評価"},{"letter":"E","text":"屈折検査と矯正視力の詳細な測定"}],"answer":["D"],"multi":false,"explanation":"解説：腎病変の有無と程度が予後を最も大きく左右する．尿蛋白と尿沈渣で糸球体腎炎を拾い，異常があれば腎生検で病型を決めて治療強度を判断する．中枢神経病変も予後因子になる．\n- A：骨密度はステロイド長期投与時の管理項目．\n- B：呼吸機能検査は間質性肺病変の評価には有用だが，腎ほど予後を規定しない．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：予後を規定する臓器の評価で正しい．\n- E：屈折検査は視力の評価．","images":[],"stem_images":[]},{"number":12,"section":"E-4-S03　26歳女性・頬の紅斑と発熱と関節痛","question":"（4/4）26歳の女性．2か月前から微熱と手指の関節痛が続き，最近は頬に赤みが出てきたという．屋外に出た日に皮疹が悪化するという．口の中にも痛くない潰瘍ができる．抗核抗体が高力価で陽性，C3とC4が低下していた．尿蛋白2.8g/日で尿沈渣に赤血球円柱を認めた．過去に2回の流産歴があり，今回の検査で抗カルジオリピン抗体が陽性であった場合に警戒すべきなのはどれか．","options":[{"letter":"A","text":"動静脈の血栓症が起こること"},{"letter":"B","text":"骨密度が急速に低下すること"},{"letter":"C","text":"甲状腺機能が急に亢進すること"},{"letter":"D","text":"尿路に結石が形成されること"},{"letter":"E","text":"角膜に点状の混濁が生じること"}],"answer":["A"],"multi":false,"explanation":"解説：抗リン脂質抗体症候群では動脈にも静脈にも血栓が生じ，脳梗塞・深部静脈血栓症・肺血栓塞栓症をきたす．習慣流産や子宮内胎児死亡の原因にもなり，妊娠時は抗凝固療法を要する．\n- A：この病態の中心的な合併症で正しい．\n- B：骨密度低下はステロイド長期投与の合併症．\n- C：甲状腺機能亢進はこの抗体と直接関連しない．\n- D：尿路結石は高カルシウム血症や代謝異常で起こる．\n- E：角膜の点状混濁はウイルス性結膜炎の後遺．","images":[],"stem_images":[]},{"number":13,"section":"E-4-S04　58歳女性・目と口の乾燥","question":"（1/4）58歳の女性．2年前から目がゴロゴロし，口が乾いてパンが飲み込みにくいという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"乾いた咳や息切れはありますか．"},{"letter":"B","text":"昔から足の爪が巻いていますか．"},{"letter":"C","text":"関節痛や腫れはありますか．"},{"letter":"D","text":"耳の下が腫れることはありますか．"},{"letter":"E","text":"口が乾く薬を飲んでいますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性の巻き爪は乾燥症状の原因検索では優先度が低い．\n- A：呼吸器病変の合併を確認．\n- B：慢性の巻き爪は乾燥症状の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：膠原病の合併を検討．\n- D：唾液腺病変を確認．\n- E：抗コリン作用などを確認．","images":[],"stem_images":[]},{"number":14,"section":"E-4-S04　58歳女性・目と口の乾燥","question":"（2/4）58歳の女性．2年前から目がゴロゴロし，口が乾いてパンが飲み込みにくいという．関節の痛みや腫れはまったくなく，皮疹もないという．涙液分泌の評価に用いる検査はどれか．","options":[{"letter":"A","text":"Schirmer試験の施行"},{"letter":"B","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"骨シンチグラフィによる全身検索"},{"letter":"E","text":"上部消化管内視鏡と生検の施行"}],"answer":["A"],"multi":false,"explanation":"解説：濾紙を下眼瞼に挟んで5分間の濡れた長さを測り，5mm以下なら涙液分泌の低下と判定する．ローズベンガルやフルオレセインによる角結膜上皮の染色も併せて評価する．\n- A：涙液分泌を直接測り正しい．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：骨シンチグラフィは骨病変の検索．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":15,"section":"E-4-S04　58歳女性・目と口の乾燥","question":"（3/4）58歳の女性．2年前から目がゴロゴロし，口が乾いてパンが飲み込みにくいという．関節の痛みや腫れはまったくなく，皮疹もないという．Schirmer試験は両眼とも3mmで，唾液腺の腫大も認めた．予想される自己抗体はどれか．","options":[{"letter":"A","text":"抗CCP抗体の著明な高値"},{"letter":"B","text":"抗トポイソメラーゼI抗体の陽性"},{"letter":"C","text":"抗SS-A抗体と抗SS-B抗体の陽性"},{"letter":"D","text":"抗アセチルコリン受容体抗体の陽性"},{"letter":"E","text":"抗ミトコンドリア抗体の著明な高値"}],"answer":["C"],"multi":false,"explanation":"解説：抗SS-A抗体は感度が高く，抗SS-B抗体はより特異的である．抗SS-A抗体は胎盤を通過して新生児ループスや先天性房室ブロックを起こすため，妊娠可能な女性では重要な情報になる．\n- A：抗CCP抗体は関節リウマチに特異的．\n- B：抗トポイソメラーゼI抗体は全身性硬化症．\n- C：この疾患に特徴的で正しい．\n- D：抗アセチルコリン受容体抗体は重症筋無力症．\n- E：抗ミトコンドリア抗体は原発性胆汁性胆管炎．","images":[],"stem_images":[]},{"number":16,"section":"E-4-S04　58歳女性・目と口の乾燥","question":"（4/4）58歳の女性．2年前から目がゴロゴロし，口が乾いてパンが飲み込みにくいという．関節の痛みや腫れはまったくなく，皮疹もないという．Schirmer試験は両眼とも3mmで唾液腺の腫大も認め，抗SS-A抗体と抗SS-B抗体がともに陽性であった．長期経過で警戒すべき合併症はどれか．","options":[{"letter":"A","text":"冠動脈に瘤が形成されること"},{"letter":"B","text":"悪性リンパ腫を発症すること"},{"letter":"C","text":"尿路に結石が形成されること"},{"letter":"D","text":"角膜が円錐状に突出すること"},{"letter":"E","text":"骨端線が早期に閉鎖すること"}],"answer":["B"],"multi":false,"explanation":"解説：唾液腺などに持続するリンパ球浸潤を背景に，健常者より高い頻度で悪性リンパ腫を発症する．唾液腺の持続的な腫脹，紫斑，補体低下，単クローン性免疫グロブリンは危険因子になる．\n- A：冠動脈瘤は川崎病．\n- B：この疾患の長期合併症として正しい．\n- C：尿路結石は代謝異常や尿路の停滞で起こる．\n- D：角膜の円錐状突出は円錐角膜．\n- E：骨端線の早期閉鎖は内分泌疾患や外傷後．","images":[],"stem_images":[]},{"number":17,"section":"E-4-S05　46歳女性・手指の色調変化と皮膚の硬化","question":"（1/4）46歳の女性．5年前から寒いと手指が白くなり，最近は指の皮膚が硬くなってきたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"指先に傷や潰瘍はありますか．"},{"letter":"B","text":"白から紫，赤へと変わりますか．"},{"letter":"C","text":"息切れや乾いた咳はありますか．"},{"letter":"D","text":"子どもの頃に乗り物酔いをしましたか．"},{"letter":"E","text":"飲み込みにくさや胸やけはありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．小児期の乗り物酔いは現在の皮膚・血管症状の評価では優先度が低い．\n- A：末梢虚血の重症度を評価．\n- B：Raynaud現象の経過を確認．\n- C：肺病変の合併を確認．\n- D：小児期の乗り物酔いは現在の皮膚・血管症状の評価では優先度が低い．この設問で選ぶ肢．\n- E：食道病変の合併を確認．","images":[],"stem_images":[]},{"number":18,"section":"E-4-S05　46歳女性・手指の色調変化と皮膚の硬化","question":"（2/4）46歳の女性．5年前から寒いと手指が白くなり，最近は指の皮膚が硬くなってきたという．寒いと指が白くなり，次に紫，最後に赤くなるという．認められる所見はどれか．","options":[{"letter":"A","text":"遠位指節間関節の対称性の腫脹"},{"letter":"B","text":"母趾の中足趾節関節の発赤と腫脹"},{"letter":"C","text":"仙腸関節の圧痛と可動域の制限"},{"letter":"D","text":"片側の膝関節だけの急な腫脹"},{"letter":"E","text":"指の皮膚硬化と爪郭部の毛細血管異常"}],"answer":["E"],"multi":false,"explanation":"解説：手指から近位へ皮膚硬化が進み，指が細く尖って仮面様顔貌となる．爪郭部の毛細血管顕微鏡では拡張した毛細血管と脱落がみられ，早期診断と病型分類の手がかりになる．\n- A：遠位指節間関節の腫脹は変形性関節症．\n- B：母趾の中足趾節関節の発赤は痛風．\n- C：仙腸関節の圧痛は強直性脊椎炎．\n- D：片側膝関節の急な腫脹は化膿性関節炎．\n- E：この疾患に特徴的で正しい．","images":[],"stem_images":[]},{"number":19,"section":"E-4-S05　46歳女性・手指の色調変化と皮膚の硬化","question":"（3/4）46歳の女性．5年前から寒いと手指が白くなり，最近は指の皮膚が硬くなってきたという．寒いと指が白くなり，次に紫，最後に赤くなるという．手指の皮膚硬化と爪郭部の毛細血管異常を認める．併せて評価すべき臓器病変はどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカーの推移"},{"letter":"B","text":"終夜睡眠ポリグラフィでの無呼吸"},{"letter":"C","text":"間質性肺病変と肺高血圧"},{"letter":"D","text":"屈折検査と矯正視力の詳細な測定"},{"letter":"E","text":"骨シンチグラフィによる全身検索"}],"answer":["C"],"multi":false,"explanation":"解説：間質性肺炎と肺動脈性肺高血圧がこの疾患の主要な死因である．高分解能CTと呼吸機能検査，心エコーによる推定肺動脈収縮期圧の評価を定期的に行い，早期に治療介入する．\n- A：骨密度は骨粗鬆症の評価．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：予後を規定する臓器病変で正しい．\n- D：屈折検査は視力の評価．\n- E：骨シンチグラフィは骨病変の検索．","images":[],"stem_images":[]},{"number":20,"section":"E-4-S05　46歳女性・手指の色調変化と皮膚の硬化","question":"（4/4）46歳の女性．5年前から寒いと手指が白くなり，最近は指の皮膚が硬くなってきたという．寒いと指が白くなり，次に紫，最後に赤くなるという．手指の皮膚硬化と爪郭部の毛細血管異常を認める．高分解能CTで軽度の間質性肺病変を認めた．急激な血圧上昇と腎機能低下をきたす合併症の治療はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの大量投与"},{"letter":"B","text":"アンジオテンシン変換酵素阻害薬"},{"letter":"C","text":"抗菌薬の長期にわたる予防投与"},{"letter":"D","text":"抗ヒスタミン薬の連日にわたる内服"},{"letter":"E","text":"気管支拡張薬の毎日の吸入"}],"answer":["B"],"multi":false,"explanation":"解説：強皮症腎クリーゼではレニン・アンジオテンシン系の過剰な活性化により悪性高血圧と急速な腎機能低下が起こる．アンジオテンシン変換酵素阻害薬が特異的に有効で，ステロイド大量投与は誘因になる．\n- A：ステロイドの大量投与はむしろ腎クリーゼを誘発する．\n- B：特異的に有効で正しい．\n- C：抗菌薬は感染症の治療．\n- D：抗ヒスタミン薬はアレルギー疾患の治療．\n- E：気管支拡張薬は気道狭窄の治療．","images":[],"stem_images":[]},{"number":21,"section":"E-4-S06　54歳女性・近位筋の脱力と皮疹","question":"（1/4）54歳の女性．3か月前から階段を昇るのがつらく，髪を洗うときに腕が上がらないという．まぶたに赤紫色の皮疹も出てきた．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"肩や太ももの力が落ちていますか．"},{"letter":"B","text":"飲み込みにくさはありますか．"},{"letter":"C","text":"息切れや乾いた咳はありますか．"},{"letter":"D","text":"体重減少や不正出血はありますか．"},{"letter":"E","text":"以前から近くの字が見えにくいですか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性近見困難は筋炎を疑う症状の初期評価では優先度が低い．\n- A：近位筋優位の分布を確認．\n- B：嚥下筋障害を確認．\n- C：間質性肺疾患を検討．\n- D：悪性疾患を疑う症状を確認．\n- E：慢性近見困難は筋炎を疑う症状の初期評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":22,"section":"E-4-S06　54歳女性・近位筋の脱力と皮疹","question":"（2/4）54歳の女性．3か月前から階段を昇るのがつらく，髪を洗うときに腕が上がらないという．まぶたに赤紫色の皮疹も出てきた．筋力低下は体幹に近い部分に強いという．予想される血液検査所見はどれか．","options":[{"letter":"A","text":"血清尿酸値の著明な上昇"},{"letter":"B","text":"抗ミトコンドリア抗体の陽性"},{"letter":"C","text":"血清補体の著明な低下"},{"letter":"D","text":"クレアチンキナーゼの著明な上昇"},{"letter":"E","text":"抗CCP抗体の著明な高値"}],"answer":["D"],"multi":false,"explanation":"解説：筋線維の破壊により筋由来の酵素が血中へ漏れ出る．クレアチンキナーゼ・アルドラーゼ・ASTとLDHが上昇し，値は疾患活動性と治療効果の指標としても用いられる．\n- A：尿酸値の上昇は痛風．\n- B：抗ミトコンドリア抗体は原発性胆汁性胆管炎．\n- C：補体の著明な低下は全身性エリテマトーデス．\n- D：筋傷害を反映し正しい．\n- E：抗CCP抗体は関節リウマチ．","images":[],"stem_images":[]},{"number":23,"section":"E-4-S06　54歳女性・近位筋の脱力と皮疹","question":"（3/4）54歳の女性．3か月前から階段を昇るのがつらく，髪を洗うときに腕が上がらないという．まぶたに赤紫色の皮疹も出てきた．筋力低下は体幹に近い部分に強いという．クレアチンキナーゼは2860IU/Lであった．手指の関節背面に紫紅色の角化性丘疹を認める．必ず行うべき検索はどれか．","options":[{"letter":"A","text":"悪性腫瘍の全身検索"},{"letter":"B","text":"骨密度と骨代謝マーカーの推移"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"屈折検査と矯正視力の詳細な測定"},{"letter":"E","text":"尿路結石の有無の画像評価"}],"answer":["A"],"multi":false,"explanation":"解説：皮膚筋炎では悪性腫瘍の合併率が高く，とくに発症前後1年に多い．胸腹部CT，上下部消化管内視鏡，婦人科的検索，腫瘍マーカーで系統的に探し，治療後も定期的に追跡する．\n- A：合併率の高さから必須で正しい．\n- B：骨密度はステロイド長期投与時の管理項目．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：屈折検査は視力の評価．\n- E：尿路結石の検索はこの疾患と関連しない．","images":[],"stem_images":[]},{"number":24,"section":"E-4-S06　54歳女性・近位筋の脱力と皮疹","question":"（4/4）54歳の女性．3か月前から階段を昇るのがつらく，髪を洗うときに腕が上がらないという．まぶたに赤紫色の皮疹も出てきた．筋力低下は体幹に近い部分に強いという．クレアチンキナーゼは2860IU/Lであった．手指の関節背面に紫紅色の角化性丘疹を認める．予後を最も左右する臓器病変はどれか．","options":[{"letter":"A","text":"腎糸球体に免疫複合体が沈着すること"},{"letter":"B","text":"心臓の弁に疣腫が形成されること"},{"letter":"C","text":"急速に進行する間質性肺炎"},{"letter":"D","text":"尿路に結石が多発すること"},{"letter":"E","text":"角膜に点状の混濁が生じること"}],"answer":["C"],"multi":false,"explanation":"解説：抗ARS抗体や抗MDA5抗体を伴う症例では，急速進行性の間質性肺炎により短期間で呼吸不全に至ることがある．診断時に高分解能CTで評価し，強力な免疫抑制療法を早期に始める．\n- A：免疫複合体の沈着は全身性エリテマトーデスのループス腎炎．\n- B：弁の疣腫は感染性心内膜炎．\n- C：この疾患の主要な死因で正しい．\n- D：尿路結石はこの疾患と関連しない．\n- E：角膜の点状混濁はウイルス性結膜炎の後遺．","images":[],"stem_images":[]},{"number":25,"section":"E-4-S07　72歳女性・側頭部の頭痛","question":"（1/4）72歳の女性．1か月前から右のこめかみが痛み，鎮痛薬でも治まらないという．肩と腰の重だるさもある．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"噛み続けると顎がだるくなりますか．"},{"letter":"B","text":"急に見えにくくなりませんか．"},{"letter":"C","text":"朝，肩や腰がこわばりますか．"},{"letter":"D","text":"数年前から足の爪が厚いですか．"},{"letter":"E","text":"髪をとかすと頭皮が痛みますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性爪病変は新たな側頭部痛の緊急評価では優先度が低い．\n- A：顎跛行を確認．\n- B：虚血性視力障害の危険を評価．\n- C：リウマチ性多発筋痛症の合併を検討．\n- D：慢性爪病変は新たな側頭部痛の緊急評価では優先度が低い．この設問で選ぶ肢．\n- E：頭皮の圧痛を確認．","images":[],"stem_images":[]},{"number":26,"section":"E-4-S07　72歳女性・側頭部の頭痛","question":"（2/4）72歳の女性．1か月前から右のこめかみが痛み，鎮痛薬でも治まらないという．肩と腰の重だるさもある．物を噛んでいると顎がだるくなるという．認められる所見はどれか．","options":[{"letter":"A","text":"遠位指節間関節の対称性の腫脹"},{"letter":"B","text":"上肢の血圧に明らかな左右差"},{"letter":"C","text":"右側頭動脈の圧痛と拍動の減弱"},{"letter":"D","text":"手指の皮膚硬化と爪郭部の異常"},{"letter":"E","text":"母趾の中足趾節関節の発赤"}],"answer":["C"],"multi":false,"explanation":"解説：炎症を起こした側頭動脈は索状に硬く触れ，圧痛を伴い拍動が弱くなる．頭皮の圧痛も伴う．赤沈とCRPの著明な上昇があれば，臨床診断としてほぼ確実になる．\n- A：遠位指節間関節の腫脹は変形性関節症．\n- B：上肢血圧の左右差は高安動脈炎や大動脈解離．\n- C：この疾患に特徴的で正しい．\n- D：皮膚硬化と爪郭部の異常は全身性硬化症．\n- E：母趾の中足趾節関節の発赤は痛風．","images":[],"stem_images":[]},{"number":27,"section":"E-4-S07　72歳女性・側頭部の頭痛","question":"（3/4）72歳の女性．1か月前から右のこめかみが痛み，鎮痛薬でも治まらないという．肩と腰の重だるさもある．物を噛んでいると顎がだるくなるという．右側頭動脈に圧痛と拍動の減弱を認め，赤沈は1時間値110mmと著明に亢進していた．最も適切な対応はどれか．","options":[{"letter":"A","text":"側頭動脈生検の結果を待って治療"},{"letter":"B","text":"鎮痛薬を増量して経過をみる"},{"letter":"C","text":"抗菌薬を長期にわたり予防投与"},{"letter":"D","text":"尿酸降下薬の投与を直ちに開始"},{"letter":"E","text":"直ちに副腎皮質ステロイドを開始"}],"answer":["E"],"multi":false,"explanation":"解説：眼動脈の虚血による視力障害は一度起これば回復しないため，生検の結果を待たずにステロイドを開始する．生検はステロイド開始後1〜2週以内であれば診断価値が保たれる．\n- A：待っている間に失明しうる．\n- B：鎮痛薬では血管炎は制御できない．\n- C：抗菌薬は感染症の治療．\n- D：尿酸降下薬は痛風の治療．\n- E：失明の予防に直結し正しい．","images":[],"stem_images":[]},{"number":28,"section":"E-4-S07　72歳女性・側頭部の頭痛","question":"（4/4）72歳の女性．1か月前から右のこめかみが痛み，鎮痛薬でも治まらないという．肩と腰の重だるさもある．物を噛んでいると顎がだるくなるという．右側頭動脈に圧痛と拍動の減弱を認め，赤沈は1時間値110mmと著明に亢進していた．ステロイドで頭痛は速やかに消えた．肩と腰の重だるさについて考えるべき病態はどれか．","options":[{"letter":"A","text":"リウマチ性多発筋痛症の合併"},{"letter":"B","text":"変形性脊椎症による神経の圧迫"},{"letter":"C","text":"筋線維の破壊による筋炎の合併"},{"letter":"D","text":"骨粗鬆症による椎体の圧迫骨折"},{"letter":"E","text":"末梢神経障害による感覚の低下"}],"answer":["A"],"multi":false,"explanation":"解説：肩や腰帯の朝のこわばりと痛みを主体とし，この疾患の約半数に合併する．筋力低下とクレアチンキナーゼ上昇を伴わない点が筋炎との違いで，少量のステロイドが著効する．\n- A：合併頻度が高く症状も合致し正しい．\n- B：変形性脊椎症では局所の痛みと神経症状が主体．\n- C：筋炎ではクレアチンキナーゼが上昇し筋力低下を伴う．\n- D：圧迫骨折では体動時の限局した強い痛みが出る．\n- E：末梢神経障害はしびれと感覚低下が前景に立つ．","images":[],"stem_images":[]},{"number":29,"section":"E-4-S08　24歳女性・微熱と脈の左右差","question":"（1/4）24歳の女性．半年前から微熱と全身のだるさが続き，最近はめまいと立ちくらみもあるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"腕を使うとだるくなりますか．"},{"letter":"B","text":"胸痛や息切れはありますか．"},{"letter":"C","text":"失神や視力低下はありますか．"},{"letter":"D","text":"左右の脈や血圧に差がありますか．"},{"letter":"E","text":"以前から排便時に肛門が痛みますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性肛門痛は今回の血管症状の初期評価では優先度が低い．\n- A：上肢虚血を疑う症状を確認．\n- B：心血管系への影響を確認．\n- C：脳・眼への血流低下を検討．\n- D：大血管病変の手がかりを確認．\n- E：慢性肛門痛は今回の血管症状の初期評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":30,"section":"E-4-S08　24歳女性・微熱と脈の左右差","question":"（2/4）24歳の女性．半年前から微熱と全身のだるさが続き，最近はめまいと立ちくらみもあるという．左腕がだるく，脈も触れにくいという．認められる所見はどれか．","options":[{"letter":"A","text":"手指の皮膚硬化と爪郭部の異常"},{"letter":"B","text":"上肢の血圧の左右差と血管雑音"},{"letter":"C","text":"遠位指節間関節の対称性の腫脹"},{"letter":"D","text":"母趾の中足趾節関節の発赤と腫脹"},{"letter":"E","text":"まぶたの赤紫色の皮疹と筋力低下"}],"answer":["B"],"multi":false,"explanation":"解説：狭窄した側の血圧が低くなり，聴診では狭窄部に収縮期の血管雑音を聴取する．左右の上肢血圧を必ず両側で測り，頸部や腹部でも雑音を確かめることが診断の第一歩になる．\n- A：皮膚硬化と爪郭部の異常は全身性硬化症．\n- B：この疾患に特徴的で正しい．\n- C：遠位指節間関節の腫脹は変形性関節症．\n- D：母趾の中足趾節関節の発赤は痛風．\n- E：まぶたの皮疹と筋力低下は皮膚筋炎．","images":[],"stem_images":[]},{"number":31,"section":"E-4-S08　24歳女性・微熱と脈の左右差","question":"（3/4）24歳の女性．半年前から微熱と全身のだるさが続き，最近はめまいと立ちくらみもあるという．左腕がだるく，脈も触れにくいという．右上肢136/82mmHg，左上肢92/60mmHgで，左鎖骨上窩に収縮期の血管雑音を聴取する．赤沈は1時間値82mmと亢進していた．診断に最も有用な検査はどれか．","options":[{"letter":"A","text":"終夜睡眠ポリグラフィの施行"},{"letter":"B","text":"骨密度と骨代謝マーカーの推移"},{"letter":"C","text":"上部消化管内視鏡と生検の施行"},{"letter":"D","text":"造影CTまたはMRアンギオグラフィ"},{"letter":"E","text":"屈折検査と矯正視力の詳細な測定"}],"answer":["D"],"multi":false,"explanation":"解説：大動脈とその主要分枝の壁の肥厚，狭窄，拡張，閉塞を描出する．PETでは炎症の活動性も評価でき，治療効果の判定に用いられる．若年女性では被曝を考えてMRアンギオグラフィが好まれる．\n- A：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- B：骨密度は骨粗鬆症の評価．\n- C：内視鏡は消化管疾患の評価．\n- D：血管病変を直接描出でき正しい．\n- E：屈折検査は視力の評価．","images":[],"stem_images":[]},{"number":32,"section":"E-4-S08　24歳女性・微熱と脈の左右差","question":"（4/4）24歳の女性．半年前から微熱と全身のだるさが続き，最近はめまいと立ちくらみもあるという．左腕がだるく，脈も触れにくいという．右上肢136/82mmHg，左上肢92/60mmHgで，左鎖骨上窩に収縮期の血管雑音を聴取する．赤沈は1時間値82mmと亢進していた．MRアンギオグラフィで左鎖骨下動脈の高度狭窄を認めた．血圧の管理で注意すべきなのはどれか．","options":[{"letter":"A","text":"狭窄のない側の血圧で評価する"},{"letter":"B","text":"両腕の平均値で評価するとよい"},{"letter":"C","text":"狭窄のある側の血圧で評価する"},{"letter":"D","text":"血圧の測定は行わなくてよい"},{"letter":"E","text":"下肢の血圧だけで評価すればよい"}],"answer":["A"],"multi":false,"explanation":"解説：狭窄側の血圧は実際より低く出るため，これで判断すると降圧が不十分になり臓器障害が進む．四肢すべてを測って最も高い値を中枢の血圧とみなし，治療の目標を設定する．\n- A：正しい評価法である．\n- B：平均値では狭窄の影響が残る．\n- C：狭窄側では過小評価となり危険．\n- D：血圧管理は臓器保護に不可欠である．\n- E：下肢も病変があれば同様に過小評価となりうる．","images":[],"stem_images":[]},{"number":33,"section":"E-4-S09　48歳男性・発熱と体重減少と手足のしびれ","question":"（1/4）48歳の男性．3か月前から発熱が続き，体重が9kg減った．最近は右手首が下がって物を落とすようになったという．末梢神経症状の分布と出現順序を確認する質問はどれか．","options":[{"letter":"A","text":"しびれは一回に何分続きますか．"},{"letter":"B","text":"夜間に痛みが増えますか．"},{"letter":"C","text":"動かすと痛みが増しますか．"},{"letter":"D","text":"しびれはどの場所から順に出ましたか．"},{"letter":"E","text":"家族に同じ症状の人はいますか．"}],"answer":["D"],"multi":false,"explanation":"解説：複数の末梢神経が時間差をもってばらばらに侵される多発単神経炎は血管炎を強く示唆する．左右非対称に，ある神経の支配領域から別の神経へと飛び石状に広がるのが特徴になる．\n- A：一回の持続時間に関する情報．\n- B：時間帯による変化に関する情報．\n- C：体動との関係に関する情報．\n- D：異なる末梢神経領域が順次侵されるかを確認する．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":34,"section":"E-4-S09　48歳男性・発熱と体重減少と手足のしびれ","question":"（2/4）48歳の男性．3か月前から発熱が続き，体重が9kg減った．最近は右手首が下がって物を落とすようになったという．2か月前には左の足首が上がりにくくなり，順に別の神経が侵されているという．考えられる病態はどれか．","options":[{"letter":"A","text":"左右対称に遠位から進む末梢神経障害"},{"letter":"B","text":"上位運動ニューロンの選択的な障害"},{"letter":"C","text":"神経筋接合部の伝達が障害されること"},{"letter":"D","text":"栄養血管の炎症による多発単神経炎"},{"letter":"E","text":"脊髄後索と側索が同時に侵されること"}],"answer":["D"],"multi":false,"explanation":"解説：中型の筋性動脈に壊死性の血管炎が起こり，末梢神経を養う栄養血管が閉塞して神経が虚血に陥る．一本ずつ時間差で侵されるため，左右非対称で飛び石状の分布になる．\n- A：左右対称に遠位から進むのは糖尿病性などの多発ニューロパチー．\n- B：上位運動ニューロンの障害では痙性麻痺と腱反射亢進をきたす．\n- C：神経筋接合部の障害は重症筋無力症で易疲労性が特徴．\n- D：この疾患の機序として正しい．\n- E：後索と側索の同時障害はビタミンB12欠乏．","images":[],"stem_images":[]},{"number":35,"section":"E-4-S09　48歳男性・発熱と体重減少と手足のしびれ","question":"（3/4）48歳の男性．3か月前から発熱が続き，体重が9kg減った．最近は右手首が下がって物を落とすようになったという．2か月前には左の足首が上がりにくくなり，順に別の神経が侵されているという．下腿に網状の紫紅色斑と潰瘍を認め，血圧は172/104mmHgであった．MPO-ANCAとPR3-ANCAはいずれも陰性である．診断のために行うべきなのはどれか．","options":[{"letter":"A","text":"抗CCP抗体の測定を行う"},{"letter":"B","text":"骨密度と骨代謝マーカーの推移"},{"letter":"C","text":"終夜睡眠ポリグラフィの施行"},{"letter":"D","text":"屈折検査と矯正視力の詳細な測定"},{"letter":"E","text":"罹患組織の生検と血管造影"}],"answer":["E"],"multi":false,"explanation":"解説：抗好中球細胞質抗体が陰性であることがこの疾患の特徴で，診断は病理と画像に依存する．神経・筋・皮膚の生検で壊死性血管炎を証明し，腹部血管造影で微小動脈瘤を描出する．\n- A：抗CCP抗体は関節リウマチに特異的．\n- B：骨密度は骨粗鬆症の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：屈折検査は視力の評価．\n- E：診断の根拠となり正しい．","images":[],"stem_images":[]},{"number":36,"section":"E-4-S09　48歳男性・発熱と体重減少と手足のしびれ","question":"（4/4）48歳の男性．3か月前から発熱が続き，体重が9kg減った．最近は右手首が下がって物を落とすようになったという．2か月前には左の足首が上がりにくくなり，順に別の神経が侵されているという．下腿に網状の紫紅色斑と潰瘍を認め，血圧は172/104mmHgであった．MPO-ANCAとPR3-ANCAはいずれも陰性である．腓腹神経生検で中型動脈の壊死性血管炎を認めた．背景として検索すべき感染症はどれか．","options":[{"letter":"A","text":"B型肝炎ウイルスの持続感染"},{"letter":"B","text":"マイコプラズマの既往感染"},{"letter":"C","text":"ノロウイルスの既往感染"},{"letter":"D","text":"カンピロバクターの既往感染"},{"letter":"E","text":"水痘帯状疱疹ウイルスの再活性化"}],"answer":["A"],"multi":false,"explanation":"解説：一部の症例ではB型肝炎ウイルスの持続感染が背景にあり，免疫複合体が血管壁に沈着して炎症を起こす．この場合は抗ウイルス療法と血漿交換を組み合わせた治療が選択される．\n- A：この疾患との関連が知られており正しい．\n- B：マイコプラズマは非定型肺炎の起因菌．\n- C：ノロウイルスは急性胃腸炎の起因ウイルス．\n- D：カンピロバクターはGuillain-Barré症候群の先行感染．\n- E：水痘帯状疱疹ウイルスの再活性化は帯状疱疹．","images":[],"stem_images":[]},{"number":37,"section":"E-4-S10　62歳男性・血痰と急速に進む腎機能低下","question":"（1/4）62歳の男性．1か月前から微熱と倦怠感があり，2週間前から血の混じった痰が出るという．健診で尿潜血も指摘された．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"最近，新しい薬を飲みましたか．"},{"letter":"B","text":"尿量が減っていませんか．"},{"letter":"C","text":"子どもの頃に乗り物酔いをしましたか．"},{"letter":"D","text":"喘息の既往はありますか．"},{"letter":"E","text":"鼻づまりや鼻血は続いていますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．過去の乗り物酔いは肺腎症状の原因検索では優先度が低い．\n- A：薬剤関連の血管炎を検討．\n- B：腎障害の進行を確認．\n- C：過去の乗り物酔いは肺腎症状の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：血管炎の病型を検討．\n- E：上気道病変の合併を確認．","images":[],"stem_images":[]},{"number":38,"section":"E-4-S10　62歳男性・血痰と急速に進む腎機能低下","question":"（2/4）62歳の男性．1か月前から微熱と倦怠感があり，2週間前から血の混じった痰が出るという．健診で尿潜血も指摘された．上気道の症状はまったくないという．血清クレアチニンは0.9mg/dLから2.6mg/dLへ上昇していた．尿沈渣で予想される所見はどれか．","options":[{"letter":"A","text":"六角形の結晶が多数みられる"},{"letter":"B","text":"白血球円柱と多数の細菌をみる"},{"letter":"C","text":"卵円形脂肪体が多数出現する"},{"letter":"D","text":"扁平上皮細胞のみが増加する"},{"letter":"E","text":"変形赤血球と赤血球円柱をみる"}],"answer":["E"],"multi":false,"explanation":"解説：糸球体で毛細血管が壊死して赤血球が漏れ出るため，変形赤血球と赤血球円柱がみられる．数週から数か月で腎機能が急速に低下する急速進行性腎炎症候群の典型像である．\n- A：六角形の結晶はシスチン尿症．\n- B：白血球円柱と細菌は腎盂腎炎．\n- C：卵円形脂肪体はネフローゼ症候群．\n- D：扁平上皮細胞の増加は検体の汚染．\n- E：糸球体性の血尿を示し正しい．","images":[],"stem_images":[]},{"number":39,"section":"E-4-S10　62歳男性・血痰と急速に進む腎機能低下","question":"（3/4）62歳の男性．1か月前から微熱と倦怠感があり，2週間前から血の混じった痰が出るという．健診で尿潜血も指摘された．上気道の症状はまったくないという．血清クレアチニンは0.9mg/dLから2.6mg/dLへ上昇していた．尿沈渣に変形赤血球と赤血球円柱を認める．測定すべき自己抗体はどれか．","options":[{"letter":"A","text":"抗CCP抗体を測定する"},{"letter":"B","text":"抗ミトコンドリア抗体を測定"},{"letter":"C","text":"抗好中球細胞質抗体を測定"},{"letter":"D","text":"抗アセチルコリン受容体抗体"},{"letter":"E","text":"抗SS-A抗体と抗SS-B抗体"}],"answer":["C"],"multi":false,"explanation":"解説：ミエロペルオキシダーゼに対する抗体は顕微鏡的多発血管炎に，プロテイナーゼ3に対する抗体は多発血管炎性肉芽腫症に多い．肺胞出血と急速進行性腎炎の組合せは肺腎症候群と呼ばれる．\n- A：抗CCP抗体は関節リウマチに特異的．\n- B：抗ミトコンドリア抗体は原発性胆汁性胆管炎．\n- C：この疾患群の診断に直結し正しい．\n- D：抗アセチルコリン受容体抗体は重症筋無力症．\n- E：抗SS-A抗体と抗SS-B抗体はSjögren症候群．","images":[],"stem_images":[]},{"number":40,"section":"E-4-S10　62歳男性・血痰と急速に進む腎機能低下","question":"（4/4）62歳の男性．1か月前から微熱と倦怠感があり，2週間前から血の混じった痰が出るという．健診で尿潜血も指摘された．上気道の症状はまったくないという．血清クレアチニンは0.9mg/dLから2.6mg/dLへ上昇していた．尿沈渣に変形赤血球と赤血球円柱を認める．MPO-ANCAが高値であった．同じ小型血管の血管炎で，小児の下肢に紫斑と腹痛，関節痛をきたすのはどれか．","options":[{"letter":"A","text":"巨細胞性動脈炎"},{"letter":"B","text":"高安動脈炎"},{"letter":"C","text":"結節性多発動脈炎"},{"letter":"D","text":"川崎病"},{"letter":"E","text":"IgA血管炎"}],"answer":["E"],"multi":false,"explanation":"解説：IgAを含む免疫複合体が小型血管に沈着し，下肢に左右対称の触知可能な紫斑，腹痛，関節痛，腎炎をきたす．小児に多く上気道感染が先行する．腎炎の程度が長期予後を決める．\n- A：巨細胞性動脈炎は高齢者の大型血管の血管炎．\n- B：高安動脈炎は若年女性の大動脈とその分枝の炎症．\n- C：結節性多発動脈炎は中型動脈でANCAは陰性．\n- D：川崎病は乳幼児の中型動脈の血管炎で冠動脈瘤をきたす．\n- E：小児の紫斑と腹痛の組合せに合致し正しい．","images":[],"stem_images":[]},{"number":41,"section":"E-4-S11　分娩中の胎児心拍モニタリング","question":"（1/4）32歳の初産婦．妊娠39週で陣痛が始まり入院した．分娩監視装置を装着して経過をみている．胎児の状態を心拍数波形から評価する項目はどれか．","options":[{"letter":"A","text":"子宮収縮の強さと持続時間"},{"letter":"B","text":"母体血圧の推移と脈拍数"},{"letter":"C","text":"胎児推定体重と羊水量"},{"letter":"D","text":"子宮口開大と児頭の下降度"},{"letter":"E","text":"胎児心拍数の基線と一過性変動"}],"answer":["E"],"multi":false,"explanation":"解説：基線とその細変動，一過性頻脈，一過性徐脈の有無と型を子宮収縮との時間関係で読む．この四つの要素の組合せが胎児の酸素化の状態を推定する連続的な手段になる．\n- A：子宮収縮の評価に関する情報．\n- B：母体の循環に関する情報．\n- C：胎児発育と羊水に関する情報．\n- D：分娩の進行に関する情報．\n- E：胎児の状態を直接評価し有用．","images":[],"stem_images":[]},{"number":42,"section":"E-4-S11　分娩中の胎児心拍モニタリング","question":"（2/4）32歳の初産婦．妊娠39週で陣痛が始まり入院した．分娩監視装置を装着して経過をみている．子宮収縮のピークから遅れて胎児心拍が緩やかに低下し，収縮が終わってから戻るパターンが繰り返し現れた．このパターンが示すのはどれか．","options":[{"letter":"A","text":"臍帯が一時的に圧迫されたこと"},{"letter":"B","text":"児頭が骨盤内で圧迫されたこと"},{"letter":"C","text":"胎盤を介したガス交換の障害"},{"letter":"D","text":"胎児が活発に動いていること"},{"letter":"E","text":"母体が体位を変えたこと"}],"answer":["C"],"multi":false,"explanation":"解説：遅発一過性徐脈は子宮収縮により胎盤の血流が減り，胎児が低酸素に傾いていることを示す．基線細変動の減少を伴えばより重篤で，繰り返し出現するなら介入が必要になる．\n- A：臍帯圧迫では変動一過性徐脈という不規則な形をとる．\n- B：児頭圧迫では収縮と同期した早発一過性徐脈となる．\n- C：この波形の意味として正しい．\n- D：胎動では一過性頻脈が現れる．\n- E：体位変換だけでこの波形は出ない．","images":[],"stem_images":[]},{"number":43,"section":"E-4-S11　分娩中の胎児心拍モニタリング","question":"（3/4）32歳の初産婦．妊娠39週で陣痛が始まり入院した．分娩監視装置を装着して経過をみている．子宮収縮のピークから遅れて胎児心拍が緩やかに低下し，収縮が終わってから戻るパターンが繰り返し現れた．基線細変動も減少している．母体SpO2は90%（room air），血圧88/52mmHgである．まず行うべき処置はどれか．","options":[{"letter":"A","text":"直ちに帝王切開の準備だけを行う"},{"letter":"B","text":"子宮収縮薬を増量して分娩を進める"},{"letter":"C","text":"母体の体位変換と酸素投与，輸液"},{"letter":"D","text":"母体に鎮痛薬を投与して様子をみる"},{"letter":"E","text":"分娩監視装置を外して経過をみる"}],"answer":["C"],"multi":false,"explanation":"解説：本例は母体にも低酸素血症と低血圧があり，左側臥位への体位変換，酸素投与，輸液を行う．子宮収縮薬を使用中なら中止し，急速遂娩にも備える．酸素化が正常な母体への一律の酸素投与とは区別する．\n- A：まず保存的な子宮内蘇生を試みるのが順序である．\n- B：収縮薬の増量は胎盤血流をさらに減らす．\n- C：子宮内蘇生の基本で正しい．\n- D：鎮痛薬では胎児の低酸素は改善しない．\n- E：監視を外すのは最も危険な選択である．","images":[],"stem_images":[]},{"number":44,"section":"E-4-S11　分娩中の胎児心拍モニタリング","question":"（4/4）32歳の初産婦．妊娠39週で陣痛が始まり入院した．分娩監視装置を装着して経過をみている．子宮収縮のピークから遅れて胎児心拍が緩やかに低下し，収縮が終わってから戻るパターンが繰り返し現れた．基線細変動も減少している．母体SpO2は90%（room air），血圧88/52mmHgである．体位変換・酸素投与・輸液で母体の低酸素血症と低血圧は改善したが，胎児心拍異常は改善しない．子宮口は5cm開大である．最も適切な対応はどれか．","options":[{"letter":"A","text":"経過をみて自然分娩を待つ"},{"letter":"B","text":"帝王切開による急速遂娩"},{"letter":"C","text":"子宮収縮薬でさらに促進する"},{"letter":"D","text":"母体に抗菌薬を投与して待つ"},{"letter":"E","text":"分娩監視装置を外して安静とする"}],"answer":["B"],"multi":false,"explanation":"解説：子宮内蘇生で改善しない胎児機能不全では，児を速やかに娩出させることが唯一の解決になる．子宮口が全開大していなければ帝王切開を選び，全開大で条件が整えば器械分娩も考える．\n- A：待っている間に不可逆的な低酸素性脳症に至りうる．\n- B：この状況での標準的な対応で正しい．\n- C：収縮薬の追加は胎児の状態を悪化させる．\n- D：抗菌薬は感染症の治療で本例に無効．\n- E：監視を外すことは許されない．","images":[],"stem_images":[]},{"number":45,"section":"E-4-S12　34歳女性・抗菌薬開始後の発疹と発熱","question":"（1/4）34歳の女性．10日前から扁桃炎で抗菌薬を内服していた．3日前から全身に赤い発疹が出て，38℃台の発熱も伴うという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"口や眼がただれていませんか．"},{"letter":"B","text":"ほかの薬やサプリも使っていますか．"},{"letter":"C","text":"皮膚が痛んだり水疱が出ますか．"},{"letter":"D","text":"数年前から遠くの字が見えにくいですか．"},{"letter":"E","text":"服薬開始から何日後に出ましたか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性屈折異常は今回の急性薬疹の評価では優先度が低い．\n- A：重症薬疹の粘膜病変を確認．\n- B：併用薬を含め原因を検討．\n- C：表皮障害の徴候を確認．\n- D：慢性屈折異常は今回の急性薬疹の評価では優先度が低い．この設問で選ぶ肢．\n- E：薬剤と発症の時間関係を確認．","images":[],"stem_images":[]},{"number":46,"section":"E-4-S12　34歳女性・抗菌薬開始後の発疹と発熱","question":"（2/4）34歳の女性．10日前から扁桃炎で抗菌薬を内服していた．3日前から全身に赤い発疹が出て，38℃台の発熱も伴うという．発疹は服用開始から7日目に出たという．重症化を示す所見はどれか．","options":[{"letter":"A","text":"発疹が体幹のみに限られること"},{"letter":"B","text":"皮疹に軽度の掻痒を伴うこと"},{"letter":"C","text":"口唇や眼の粘膜のびらんと水疱"},{"letter":"D","text":"発疹が数日で自然に消えること"},{"letter":"E","text":"皮疹の色調が均一であること"}],"answer":["C"],"multi":false,"explanation":"解説：口唇・眼・外陰部の粘膜疹，水疱と表皮剝離，高熱，Nikolsky現象は重症薬疹を示す．Stevens-Johnson症候群や中毒性表皮壊死症では失明や敗血症に至るため，直ちに専門施設へ送る．\n- A：体幹に限局する軽度の皮疹は通常型の薬疹．\n- B：軽度の掻痒のみなら重症度は低い．\n- C：重症型を示す所見で正しい．\n- D：自然消退は軽症を示唆する．\n- E：色調が均一な紅斑は通常型の薬疹．","images":[],"stem_images":[]},{"number":47,"section":"E-4-S12　34歳女性・抗菌薬開始後の発疹と発熱","question":"（3/4）34歳の女性．10日前から扁桃炎で抗菌薬を内服していた．3日前から全身に赤い発疹が出て，38℃台の発熱も伴うという．発疹は服用開始から7日目に出たという．口唇と眼球結膜にびらんを認め，体表の15%に水疱と表皮剝離がある．最も重要な対応はどれか．","options":[{"letter":"A","text":"被疑薬を中止し全身管理を行う"},{"letter":"B","text":"同じ抗菌薬を増量して継続する"},{"letter":"C","text":"抗ヒスタミン薬の内服のみ行う"},{"letter":"D","text":"鎮痛薬を追加して経過をみる"},{"letter":"E","text":"別の抗菌薬に変えて外来で経過観察"}],"answer":["A"],"multi":false,"explanation":"解説：原因薬剤の中止が最優先で，熱傷に準じた輸液・保温・感染対策・栄養管理を行う．眼科と協力して眼合併症を防ぎ，重症例では副腎皮質ステロイドや免疫グロブリン大量療法を検討する．\n- A：治療の起点として正しい．\n- B：継続すれば病態が急速に悪化する．\n- C：抗ヒスタミン薬では重症薬疹に対応できない．\n- D：鎮痛薬だけでは進行を止められない．\n- E：外来管理では対応できない重症度である．","images":[],"stem_images":[]},{"number":48,"section":"E-4-S12　34歳女性・抗菌薬開始後の発疹と発熱","question":"（4/4）34歳の女性．10日前から扁桃炎で抗菌薬を内服していた．3日前から全身に赤い発疹が出て，38℃台の発熱も伴うという．発疹は服用開始から7日目に出たという．口唇と眼球結膜にびらんを認め，体表の15%に水疱と表皮剝離がある．回復後に患者へ伝えるべきことはどれか．","options":[{"letter":"A","text":"同じ薬を少量なら使ってよいこと"},{"letter":"B","text":"時間が経てば同じ薬を使えること"},{"letter":"C","text":"原因薬と同系統の薬を生涯避けること"},{"letter":"D","text":"抗菌薬全般を生涯使えないこと"},{"letter":"E","text":"検査で安全性を確かめれば再投与可能"}],"answer":["C"],"multi":false,"explanation":"解説：再投与ではより重篤な反応が短時間で起こる．原因薬と交差反応する同系統の薬剤も避け，薬剤名を記載したカードを携帯させて，受診のたびに医療者へ伝えるよう指導する．\n- A：少量でも重篤な反応が起こりうる．\n- B：時間の経過で感作が消えるわけではない．\n- C：再発を防ぐ指導として正しい．\n- D：系統の異なる抗菌薬は使用できる．\n- E：重症薬疹では再投与試験も禁忌である．","images":[],"stem_images":[]}],"seed":null},{"id":"E-7_成長と発達","name":"E-7_成長と発達.md","label":"E-7 成長と発達","count":48,"sourceHash":"0585835b5230","questions":[{"number":1,"section":"E-7-S01　出生直後に啼泣が弱い児","question":"（1/4）在胎39週で経腟分娩となった児．出生直後の啼泣が弱く，四肢はだらりとしている．出生直後に蘇生の必要性を判断する評価はどれか．","options":[{"letter":"A","text":"出生体重と身長の正確な計測"},{"letter":"B","text":"児の血液型と母体との適合"},{"letter":"C","text":"胎盤の重量と臍帯血管の本数"},{"letter":"D","text":"正期産か・呼吸啼泣・筋緊張は良好か"},{"letter":"E","text":"母体の分娩所要時間の記録"}],"answer":["D"],"multi":false,"explanation":"解説：正期産か，呼吸・啼泣は良好か，筋緊張は良好かを確認する．本児は啼泣と筋緊張が不良であり，保温・体位調整・乾燥・刺激などの初期処置へ進み，呼吸と心拍数を再評価する．\n- A：成長の評価に関する情報．\n- B：溶血リスクに関する情報．\n- C：胎盤・臍帯の形態に関する情報．\n- D：正期産か，呼吸・啼泣と筋緊張が良好かを確認し，異常があれば初期処置へ進む．\n- E：分娩の経過に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"E-7-S01　出生直後に啼泣が弱い児","question":"（2/4）在胎39週で経腟分娩となった児．出生直後の啼泣が弱く，四肢はだらりとしている．早産ではないが啼泣が弱く筋緊張も低下している．初期処置後も無呼吸が続き，心拍数は80/分である．この時点で次に行うのはどれか．","options":[{"letter":"A","text":"直ちに胸骨圧迫を開始する"},{"letter":"B","text":"直ちにアドレナリンを投与する"},{"letter":"C","text":"直ちに人工呼吸を開始する"},{"letter":"D","text":"直ちに炭酸水素ナトリウムを投与"},{"letter":"E","text":"直ちにブドウ糖液を輸注する"}],"answer":["C"],"multi":false,"explanation":"解説：初期処置後も無呼吸または心拍数100/分未満なら，陽圧換気を開始する．胸郭が動く有効な換気を確保し，心拍数で反応を評価する．有効な換気後も60/分未満なら胸骨圧迫を加える．\n- A：胸骨圧迫は有効な換気の後に検討する．\n- B：アドレナリンは換気と胸骨圧迫でも改善しない場合の手段．\n- C：新生児蘇生の中心で正しい．\n- D：炭酸水素ナトリウムの投与は推奨されない．\n- E：ブドウ糖は低血糖が確認された場合に用いる．","images":[],"stem_images":[]},{"number":3,"section":"E-7-S01　出生直後に啼泣が弱い児","question":"（3/4）在胎39週で経腟分娩となった児．出生直後の啼泣が弱く，四肢はだらりとしている．早産ではないが啼泣が弱く筋緊張も低下している．初期処置後も無呼吸が続き，心拍数は80/分である．人工呼吸を開始したところ心拍数と呼吸が改善した．生後1分の状態は心拍数90/分，呼吸は弱く不規則，四肢は弛緩したまま，カテーテル刺激に顔をしかめ，体幹は淡紅色で四肢はチアノーゼであった．Apgarスコアの合計点はどれか．","options":[{"letter":"A","text":"2点"},{"letter":"B","text":"4点"},{"letter":"C","text":"6点"},{"letter":"D","text":"8点"},{"letter":"E","text":"10点"}],"answer":["B"],"multi":false,"explanation":"解説：心拍数1点，呼吸1点，筋緊張0点，反射1点，皮膚色1点で合計4点．Apgarスコアは出生後の状態の記録であり，点数だけで低酸素の原因や個人の神経学的予後を確定しない．\n- A：2点となるには複数の項目がさらに0点でなければならない．\n- B：各項目を数えた合計で正しい．\n- C：6点となるにはいずれかの項目が2点でなければならない．\n- D：8点は正常に近い状態．\n- E：10点は全項目が2点の完全に正常な状態．","images":[],"stem_images":[]},{"number":4,"section":"E-7-S01　出生直後に啼泣が弱い児","question":"（4/4）在胎39週で経腟分娩となった児．出生直後の啼泣が弱く，四肢はだらりとしている．早産ではないが啼泣が弱く筋緊張も低下している．初期処置後も無呼吸が続き，心拍数は80/分である．人工呼吸を開始したところ心拍数と呼吸が改善した．生後1分の状態は心拍数90/分，呼吸は弱く不規則，四肢は弛緩したまま，カテーテル刺激に顔をしかめ，体幹は淡紅色で四肢はチアノーゼであった．Apgarスコアは4点と判定した．5分後の再評価が重要な理由はどれか．","options":[{"letter":"A","text":"出生体重の推定に用いるため"},{"letter":"B","text":"母体の予後を推定するため"},{"letter":"C","text":"分娩様式を決定するため"},{"letter":"D","text":"授乳開始の時期を決めるため"},{"letter":"E","text":"蘇生への反応と状態の推移をみるため"}],"answer":["E"],"multi":false,"explanation":"解説：5分値では出生後の適応と蘇生への反応を再評価する．5分値が7点未満なら5分ごとに20分まで記録する．低値の持続は追加評価を要するが，個人の長期神経学的予後をスコアだけで断定しない．\n- A：出生体重はスコアと関係しない．\n- B：母体の予後の指標ではない．\n- C：分娩は既に終了しており様式の決定には使わない．\n- D：授乳の時期はこのスコアで決めない．\n- E：再評価で出生後の状態と蘇生への反応を記録する．","images":[],"stem_images":[]},{"number":5,"section":"E-7-S02　在胎30週・出生体重1200gの児","question":"（1/4）在胎30週，出生体重1200gで出生した児．生後まもなく多呼吸と呻吟が出現し，陥没呼吸も認める．在胎週数と出生体重による分類として正しいのはどれか．","options":[{"letter":"A","text":"正期産児で低出生体重児である"},{"letter":"B","text":"早産児で極低出生体重児である"},{"letter":"C","text":"正期産児で正常出生体重児である"},{"letter":"D","text":"過期産児で低出生体重児である"},{"letter":"E","text":"早産児で超低出生体重児である"}],"answer":["B"],"multi":false,"explanation":"解説：在胎37週未満が早産児，出生体重1500g未満が極低出生体重児，1000g未満が超低出生体重児である．在胎30週で1200gなので早産児かつ極低出生体重児にあたる．\n- A：在胎30週は正期産ではない．\n- B：定義に合致し正しい．\n- C：正期産でも正常出生体重でもない．\n- D：過期産は在胎42週以降を指す．\n- E：1000g未満ではないので超低出生体重児ではない．","images":[],"stem_images":[]},{"number":6,"section":"E-7-S02　在胎30週・出生体重1200gの児","question":"（2/4）在胎30週，出生体重1200gで出生した児．生後まもなく多呼吸と呻吟が出現し，陥没呼吸も認める．早産児かつ極低出生体重児である．胸部エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"片側の肺紋理消失と虚脱"},{"letter":"B","text":"心拡大と両肺門部の蝶形陰影"},{"letter":"C","text":"右上肺野の空洞を伴う浸潤影"},{"letter":"D","text":"気管支の不可逆的な拡張像"},{"letter":"E","text":"網状顆粒状陰影と気管支透亮像"}],"answer":["E"],"multi":false,"explanation":"解説：サーファクタントの不足で肺胞が広がらず虚脱するため，含気の乏しいすりガラス状の陰影に空気の入った気管支が黒く抜けて見える．重症例では心陰影と横隔膜の境界が消える．\n- A：肺紋理消失と虚脱は気胸．\n- B：心拡大と蝶形陰影は心原性肺水腫．\n- C：空洞を伴う浸潤影は肺結核．\n- D：気管支の不可逆的拡張は気管支拡張症．\n- E：この疾患の典型的な画像所見で正しい．","images":[],"stem_images":[]},{"number":7,"section":"E-7-S02　在胎30週・出生体重1200gの児","question":"（3/4）在胎30週，出生体重1200gで出生した児．生後まもなく多呼吸と呻吟が出現し，陥没呼吸も認める．早産児かつ極低出生体重児である．胸部エックス線写真で網状顆粒状陰影と気管支透亮像を認めた．最も適切な治療はどれか．","options":[{"letter":"A","text":"抗菌薬の全身にわたる長期投与"},{"letter":"B","text":"人工サーファクタントの気管内投与"},{"letter":"C","text":"副腎皮質ステロイドの大量全身投与"},{"letter":"D","text":"気管支拡張薬の反復した吸入"},{"letter":"E","text":"抗ウイルス薬の全身にわたる投与"}],"answer":["B"],"multi":false,"explanation":"解説：不足している物質を気管内から直接補充することで，肺胞の表面張力が下がって虚脱が防がれ，酸素化が速やかに改善する．持続陽圧呼吸や人工換気による呼吸補助を併用する．\n- A：抗菌薬は感染症の治療．\n- B：病態に直接対応し正しい．\n- C：ステロイドは母体への出生前投与が予防に有効だが，出生後の大量投与は標準ではない．\n- D：気管支拡張薬は気道狭窄の治療．\n- E：抗ウイルス薬はウイルス感染の治療．","images":[],"stem_images":[]},{"number":8,"section":"E-7-S02　在胎30週・出生体重1200gの児","question":"（4/4）在胎30週，出生体重1200gで出生した児．生後まもなく多呼吸と呻吟が出現し，陥没呼吸も認める．早産児かつ極低出生体重児である．胸部エックス線写真で網状顆粒状陰影と気管支透亮像を認め，人工サーファクタントを気管内に投与したところ酸素化が改善した．この病態を出生前に予防する方法はどれか．","options":[{"letter":"A","text":"母体への副腎皮質ステロイド投与"},{"letter":"B","text":"母体への抗菌薬の長期にわたる投与"},{"letter":"C","text":"母体への鉄剤の静脈内での投与"},{"letter":"D","text":"母体への免疫グロブリンの投与"},{"letter":"E","text":"母体への気管支拡張薬の吸入投与"}],"answer":["A"],"multi":false,"explanation":"解説：早産が予想される妊娠週数の母体にベタメタゾンなどを投与すると，胎児のサーファクタント産生が促される．呼吸窮迫症候群だけでなく脳室内出血や壊死性腸炎の頻度も下げられる．\n- A：出生前ステロイド投与として正しい．\n- B：抗菌薬は絨毛膜羊膜炎の治療で用いる．\n- C：鉄剤は母体の貧血治療．\n- D：免疫グロブリンはこの予防には用いない．\n- E：気管支拡張薬は母体の喘息治療に用いる．","images":[],"stem_images":[]},{"number":9,"section":"E-7-S03　生後4日の児・皮膚の黄染","question":"（1/4）生後4日の男児．皮膚と眼球結膜の黄染を指摘された．在胎38週，出生体重3100gで経過は順調だったという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"父親は近視の眼鏡をかけていますか．"},{"letter":"B","text":"黄疸は生後いつ出ましたか．"},{"letter":"C","text":"きょうだいも黄疸の治療を受けましたか．"},{"letter":"D","text":"母乳やミルクは飲めていますか．"},{"letter":"E","text":"便と尿はどのような色ですか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．父親の屈折異常は新生児黄疸の原因検索では優先度が低い．\n- A：父親の屈折異常は新生児黄疸の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：早発性かどうかを確認．\n- C：溶血などの背景を検討．\n- D：摂取不足と脱水を評価．\n- E：胆汁うっ滞の徴候を確認．","images":[],"stem_images":[]},{"number":10,"section":"E-7-S03　生後4日の児・皮膚の黄染","question":"（2/4）生後4日の男児．皮膚と眼球結膜の黄染を指摘された．在胎38週，出生体重3100gで経過は順調だったという．黄疸は生後3日目から出たという．測定すべき検査値はどれか．","options":[{"letter":"A","text":"血清アミラーゼとリパーゼの測定"},{"letter":"B","text":"血清尿酸値の正確な測定"},{"letter":"C","text":"血清総ビリルビンと直接ビリルビン"},{"letter":"D","text":"血清クレアチンキナーゼの測定"},{"letter":"E","text":"骨密度と骨代謝マーカーの推移"}],"answer":["C"],"multi":false,"explanation":"解説：総ビリルビンの値と日齢から光線療法や交換輸血の適応を判断する．直接ビリルビンが優位であれば胆道閉鎖症など胆汁うっ滞性疾患を考え，まったく別の検索へ進むことになる．\n- A：アミラーゼとリパーゼは膵疾患の指標．\n- B：尿酸値は痛風や腫瘍崩壊症候群の指標．\n- C：治療適応と病型の両方を決め正しい．\n- D：クレアチンキナーゼは筋傷害の指標．\n- E：骨密度は骨粗鬆症の評価．","images":[],"stem_images":[]},{"number":11,"section":"E-7-S03　生後4日の児・皮膚の黄染","question":"（3/4）生後4日の男児．皮膚と眼球結膜の黄染を指摘された．在胎38週，出生体重3100gで経過は順調だったという．黄疸は生後3日目から出たという．生後96時間の血清総ビリルビンは24.0mg/dL，直接ビリルビン0.6mg/dLで，母児の血液型は一致していた．在胎週数・時間齢・危険因子に基づく光線療法の基準を超え，交換輸血の基準には達していない．最も適切な治療はどれか．","options":[{"letter":"A","text":"直ちに交換輸血を実施する"},{"letter":"B","text":"光線療法を開始して経過をみる"},{"letter":"C","text":"抗菌薬の全身にわたる投与"},{"letter":"D","text":"副腎皮質ステロイドの全身投与"},{"letter":"E","text":"経過観察のみで治療は行わない"}],"answer":["B"],"multi":false,"explanation":"解説：青色光により間接ビリルビンが水溶性の異性体に変わり，胆汁と尿から排泄されやすくなる．眼を保護し脱水に注意しながら行い，値がさらに上昇して基準を超えれば交換輸血に進む．\n- A：交換輸血はより高い基準を超えた場合や急速な上昇時に行う．\n- B：提示された時間齢と危険因子に基づく治療基準を超えており，光線療法の適応となる．\n- C：抗菌薬は感染症の治療．\n- D：ステロイドはこの病態の治療ではない．\n- E：光線療法の基準を超えており，無治療での観察だけでは不適切．","images":[],"stem_images":[]},{"number":12,"section":"E-7-S03　生後4日の児・皮膚の黄染","question":"（4/4）生後4日の男児．皮膚と眼球結膜の黄染を指摘された．在胎38週，出生体重3100gで経過は順調だったという．黄疸は生後3日目から出たという．生後96時間の血清総ビリルビンは24.0mg/dL，直接ビリルビン0.6mg/dLで，母児の血液型は一致していた．在胎週数・時間齢・危険因子に基づく光線療法の基準を超え，交換輸血の基準には達していない．光線療法で黄疸は改善した．治療せずに放置した場合に起こる病態はどれか．","options":[{"letter":"A","text":"肝臓に線維化が進んで硬変に至る"},{"letter":"B","text":"腎糸球体に免疫複合体が沈着する"},{"letter":"C","text":"間接ビリルビンが大脳基底核に沈着"},{"letter":"D","text":"骨髄で血球の産生が完全に止まる"},{"letter":"E","text":"肺胞が虚脱して呼吸不全に至る"}],"answer":["C"],"multi":false,"explanation":"解説：血液脳関門を通過した間接ビリルビンが淡蒼球などの大脳基底核に沈着し，急性期には筋緊張異常と哺乳不良，後遺症としてアテトーゼ型脳性麻痺・難聴・上方注視麻痺を残す．\n- A：肝硬変は慢性の肝疾患の帰結．\n- B：免疫複合体の沈着は糸球体腎炎．\n- C：核黄疸の機序として正しい．\n- D：骨髄での産生停止は再生不良性貧血．\n- E：肺胞の虚脱は呼吸窮迫症候群．","images":[],"stem_images":[]},{"number":13,"section":"E-7-S04　1歳6か月児・発熱時のけいれん","question":"（1/4）1歳6か月の女児．39℃の発熱に続いて全身が硬直しガクガクと震え，3分で治まったという．現在は機嫌よく水分もとれている．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"けいれんは何分続きましたか．"},{"letter":"B","text":"乳歯はどの順番で生えましたか．"},{"letter":"C","text":"一日以内に繰り返しましたか．"},{"letter":"D","text":"動きに左右差はありましたか．"},{"letter":"E","text":"熱がないときも起きましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．歯の萌出順序は発熱時けいれんの病型判断では優先度が低い．\n- A：発作の持続時間を確認．\n- B：歯の萌出順序は発熱時けいれんの病型判断では優先度が低い．この設問で選ぶ肢．\n- C：同一発熱機会での反復を確認．\n- D：焦点性の徴候を確認．\n- E：非発熱性発作との鑑別に有用．","images":[],"stem_images":[]},{"number":14,"section":"E-7-S04　1歳6か月児・発熱時のけいれん","question":"（2/4）1歳6か月の女児．39℃の発熱に続いて全身が硬直しガクガクと震え，3分で治まったという．現在は機嫌よく水分もとれている．けいれんは全身性で左右差はなく，本日1回だけだという．この発作の型はどれか．","options":[{"letter":"A","text":"複雑型でありさらに精査を要する"},{"letter":"B","text":"てんかん発作の初発と考えられる"},{"letter":"C","text":"単純型の熱性けいれんにあたる"},{"letter":"D","text":"髄膜炎による症候性の発作である"},{"letter":"E","text":"代謝異常による症候性の発作である"}],"answer":["C"],"multi":false,"explanation":"解説：生後6か月から5歳の児で，38℃以上の発熱に伴い，15分未満の全身性発作が24時間以内に1回だけ起こり，中枢神経感染症や代謝異常によらないものが単純型にあたる．\n- A：15分未満・全身性・単回なので複雑型にあたらない．\n- B：発熱に伴う単回の発作でてんかんとは診断しない．\n- C：定義に合致し正しい．\n- D：髄膜炎では発作後の意識障害や髄膜刺激徴候が続く．\n- E：代謝異常でも発作後の回復は不良なことが多い．","images":[],"stem_images":[]},{"number":15,"section":"E-7-S04　1歳6か月児・発熱時のけいれん","question":"（3/4）1歳6か月の女児．39℃の発熱に続いて全身が硬直しガクガクと震え，3分で治まったという．現在は機嫌よく水分もとれている．けいれんは全身性で左右差はなく，本日1回だけだという．意識は清明で項部硬直も大泉門の膨隆もない．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに腰椎穿刺を実施する"},{"letter":"B","text":"直ちに頭部CTを撮影する"},{"letter":"C","text":"抗てんかん薬の連日内服を始める"},{"letter":"D","text":"発熱の原因を探し経過をみる"},{"letter":"E","text":"直ちに脳波検査を実施する"}],"answer":["D"],"multi":false,"explanation":"解説：単純型で意識が清明であれば，発熱の原因となる感染症を診断して対応し，家族に再発の可能性と対処法を説明する．髄膜炎を疑う所見がなければ腰椎穿刺も画像も脳波も必要ない．\n- A：髄膜刺激徴候も意識障害もなく適応にならない．\n- B：頭部CTは外傷や局在徴候がある場合に検討する．\n- C：単純型に抗てんかん薬の連日内服は不要．\n- D：標準的な対応で正しい．\n- E：脳波は複雑型や反復例で検討する．","images":[],"stem_images":[]},{"number":16,"section":"E-7-S04　1歳6か月児・発熱時のけいれん","question":"（4/4）1歳6か月の女児．39℃の発熱に続いて全身が硬直しガクガクと震え，3分で治まったという．現在は機嫌よく水分もとれている．けいれんは全身性で左右差はなく，本日1回だけだという．意識は清明で項部硬直も大泉門の膨隆もなく，発熱の原因は上気道炎と判断された．保護者への説明として正しいのはどれか．","options":[{"letter":"A","text":"将来てんかんになる確率が非常に高い"},{"letter":"B","text":"解熱薬で発作を確実に予防できる"},{"letter":"C","text":"発作中は口に物を入れて舌を守る"},{"letter":"D","text":"知能の発達に影響が残る"},{"letter":"E","text":"多くは学童期までに起こらなくなる"}],"answer":["E"],"multi":false,"explanation":"解説：大半は5〜6歳までに自然に起こらなくなり，知能や発達への影響もない．てんかんへの移行は数%にとどまる．発作時は横向きに寝かせて観察し，口に物を入れないよう具体的に伝える．\n- A：てんかんへの移行は少数にとどまる．\n- B：解熱薬で発作を予防できるという根拠はない．\n- C：口に物を入れると窒息や外傷を招く．\n- D：知能の発達への影響は通常残らない．\n- E：自然経過として正しい．","images":[],"stem_images":[]},{"number":17,"section":"E-7-S05　2歳児・発達の遅れと姿勢の異常","question":"（1/4）2歳の男児．首のすわりが6か月，お座りが1歳2か月と遅く，まだ歩けないという．足が突っ張るのが気になると母が話す．非進行性の運動障害と進行性疾患を区別する質問はどれか．","options":[{"letter":"A","text":"出生時の体重は何gでしたか．"},{"letter":"B","text":"家族にも成長の遅い人はいますか．"},{"letter":"C","text":"できていたことが失われましたか．"},{"letter":"D","text":"食事に時間がかかりますか．"},{"letter":"E","text":"睡眠中にいびきをかきますか．"}],"answer":["C"],"multi":false,"explanation":"解説：いったん獲得した能力が失われていく退行があれば，進行性の変性疾患や代謝疾患を考える．非進行性の脳病変によるものとは根本的に異なるため，この一点が鑑別の分岐になる．\n- A：出生時の状態に関する情報．\n- B：遺伝的背景に関する情報．\n- C：進行性か非進行性かを分け有用．\n- D：摂食機能に関する情報．\n- E：睡眠時の呼吸に関する情報．","images":[],"stem_images":[]},{"number":18,"section":"E-7-S05　2歳児・発達の遅れと姿勢の異常","question":"（2/4）2歳の男児．首のすわりが6か月，お座りが1歳2か月と遅く，まだ歩けないという．足が突っ張るのが気になると母が話す．できていたことが失われたことはなく，ゆっくりだが発達は進んでいるという．認められる所見はどれか．","options":[{"letter":"A","text":"筋萎縮と線維束攣縮の出現"},{"letter":"B","text":"手袋靴下型の感覚障害の出現"},{"letter":"C","text":"腱反射の左右対称な消失"},{"letter":"D","text":"下肢の腱反射亢進と尖足"},{"letter":"E","text":"眼瞼下垂の明らかな日内変動"}],"answer":["D"],"multi":false,"explanation":"解説：錐体路が障害されるため筋緊張が亢進し，腱反射が亢進して足関節クローヌスやBabinski徴候が出る．下肢優位のことが多く，尖足やはさみ肢位をとって歩行の獲得が遅れる．\n- A：筋萎縮と線維束攣縮は下位運動ニューロン障害．\n- B：手袋靴下型の感覚障害は多発ニューロパチー．\n- C：腱反射の対称性消失もGuillain-Barré症候群など末梢の障害．\n- D：錐体路障害を反映し正しい．\n- E：眼瞼下垂の日内変動は重症筋無力症．","images":[],"stem_images":[]},{"number":19,"section":"E-7-S05　2歳児・発達の遅れと姿勢の異常","question":"（3/4）2歳の男児．首のすわりが6か月，お座りが1歳2か月と遅く，まだ歩けないという．足が突っ張るのが気になると母が話す．できていたことが失われたことはなく，ゆっくりだが発達は進んでいるという．下肢の腱反射は亢進し尖足位をとる．在胎28週の早産で出生し，新生児期に脳室内出血があったという．この病態はどれか．","options":[{"letter":"A","text":"進行性の変性疾患による退行"},{"letter":"B","text":"非進行性の脳病変による運動障害"},{"letter":"C","text":"末梢神経の脱髄による筋力低下"},{"letter":"D","text":"神経筋接合部の伝達の障害"},{"letter":"E","text":"筋線維そのものの変性による障害"}],"answer":["B"],"multi":false,"explanation":"解説：受胎から新生児期までに生じた非進行性の脳病変により，運動と姿勢の異常が永続する．病変自体は進行しないが，成長に伴い拘縮や側弯などの二次障害が加わるため長期の支援が要る．\n- A：退行がなく進行性の変性疾患は否定的．\n- B：定義に合致し正しい．\n- C：末梢神経の脱髄では腱反射が消失する．\n- D：神経筋接合部の障害は易疲労性が特徴．\n- E：筋原性疾患では腱反射が低下する．","images":[],"stem_images":[]},{"number":20,"section":"E-7-S05　2歳児・発達の遅れと姿勢の異常","question":"（4/4）2歳の男児．首のすわりが6か月，お座りが1歳2か月と遅く，まだ歩けないという．足が突っ張るのが気になると母が話す．できていたことが失われたことはなく，ゆっくりだが発達は進んでいるという．下肢の腱反射は亢進し尖足位をとる．在胎28週の早産で出生し，新生児期に脳室内出血があったという．併せて評価すべき合併症はどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカー"},{"letter":"B","text":"終夜睡眠ポリグラフィでの無呼吸"},{"letter":"C","text":"知的障害やてんかんの合併"},{"letter":"D","text":"呼気中一酸化窒素濃度の測定"},{"letter":"E","text":"血清アミラーゼとリパーゼの測定"}],"answer":["C"],"multi":false,"explanation":"解説：脳病変の広がりに応じて運動以外の障害も合併する．知的障害・てんかん・視覚障害・聴覚障害・摂食嚥下障害を系統的に評価し，多職種で療育と生活支援の計画を立てる．\n- A：骨密度は不動による二次障害として関わるが，優先度は低い．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：合併しやすい障害の評価で正しい．\n- D：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- E：アミラーゼとリパーゼは膵疾患の指標．","images":[],"stem_images":[]},{"number":21,"section":"E-7-S06　生後6か月児・繰り返す頭部の前屈","question":"（1/4）生後6か月の女児．2週間前から，座らせると首をカクンと前に倒す動きが数秒おきに何度も繰り返されるという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"動きを動画で撮っていますか．"},{"letter":"B","text":"腕や脚も同時に動きますか．"},{"letter":"C","text":"できていたことが減りましたか．"},{"letter":"D","text":"父親は近視の眼鏡をかけていますか．"},{"letter":"E","text":"起きた直後にまとまって出ますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．父親の屈折異常は乳児発作の初期評価では優先度が低い．\n- A：発作の性状を直接評価．\n- B：発作の分布を確認．\n- C：発達の退行を確認．\n- D：父親の屈折異常は乳児発作の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：発作の群発性と時刻を確認．","images":[],"stem_images":[]},{"number":22,"section":"E-7-S06　生後6か月児・繰り返す頭部の前屈","question":"（2/4）生後6か月の女児．2週間前から，座らせると首をカクンと前に倒す動きが数秒おきに何度も繰り返されるという．以前できていた追視とあやし笑いが消えたという．行うべき検査はどれか．","options":[{"letter":"A","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"B","text":"終夜睡眠ポリグラフィの施行"},{"letter":"C","text":"骨シンチグラフィによる全身検索"},{"letter":"D","text":"上部消化管内視鏡と生検の施行"},{"letter":"E","text":"脳波検査と頭部MRIの撮影"}],"answer":["E"],"multi":false,"explanation":"解説：脳波で高振幅徐波と多焦点性棘波が無秩序に混在するヒプスアリスミアを確認する．頭部MRIでは結節性硬化症や皮質形成異常など，背景にある器質的病変を探す．\n- A：呼吸機能検査は換気障害の評価．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：診断と原因検索を同時に行え正しい．","images":[],"stem_images":[]},{"number":23,"section":"E-7-S06　生後6か月児・繰り返す頭部の前屈","question":"（3/4）生後6か月の女児．2週間前から，座らせると首をカクンと前に倒す動きが数秒おきに何度も繰り返されるという．以前できていた追視とあやし笑いが消えたという．脳波で高振幅徐波と多焦点性棘波が無秩序に混在していた．この脳波所見はどれか．","options":[{"letter":"A","text":"三相波と呼ばれる所見である"},{"letter":"B","text":"周期性同期性放電である"},{"letter":"C","text":"ヒプスアリスミアである"},{"letter":"D","text":"3Hz棘徐波複合である"},{"letter":"E","text":"全般性の徐波化のみである"}],"answer":["C"],"multi":false,"explanation":"解説：高振幅の徐波に多焦点性の棘波が無秩序に混じり，左右同期性も失われた脳波所見をヒプスアリスミアという．発作と発達の停止・退行と併せて，この症候群の三徴を構成する．\n- A：三相波は肝性脳症など代謝性脳症．\n- B：周期性同期性放電は亜急性硬化性全脳炎やCreutzfeldt-Jakob病．\n- C：この症候群に特徴的で正しい．\n- D：3Hz棘徐波複合は欠神発作．\n- E：全般性の徐波化のみは非特異的な所見．","images":[],"stem_images":[]},{"number":24,"section":"E-7-S06　生後6か月児・繰り返す頭部の前屈","question":"（4/4）生後6か月の女児．2週間前から，座らせると首をカクンと前に倒す動きが数秒おきに何度も繰り返されるという．以前できていた追視とあやし笑いが消えたという．脳波で高振幅徐波と多焦点性棘波が無秩序に混在するヒプスアリスミアを認めた．早期に治療を始める理由はどれか．","options":[{"letter":"A","text":"治療により身長の伸びが改善するため"},{"letter":"B","text":"治療により骨密度が上がるため"},{"letter":"C","text":"治療により難聴が回復するため"},{"letter":"D","text":"治療の遅れが予後を悪化させるため"},{"letter":"E","text":"治療により視力が回復するため"}],"answer":["D"],"multi":false,"explanation":"解説：発作が続く期間が長いほど精神運動発達の予後が悪くなるため，診断がついたら速やかにACTH療法やビガバトリンを開始する．背景に結節性硬化症があれば早期にビガバトリンを選ぶ．\n- A：身長の伸びはこの治療の目的ではない．\n- B：むしろACTH療法は骨密度を下げうる．\n- C：難聴の回復は治療目的にならない．\n- D：早期治療の根拠として正しい．\n- E：視力の回復も治療目的ではない．","images":[],"stem_images":[]},{"number":25,"section":"E-7-S07　2歳児・夜間の犬吠様の咳","question":"（1/4）2歳の男児．昨日から鼻水と微熱があり，今夜になって犬が吠えるような咳と声のかすれが出てきたという．流涎を伴う重い上気道病変を見逃さないための質問はどれか．","options":[{"letter":"A","text":"咳は夜に強くなりますか．"},{"letter":"B","text":"唾が飲み込めず涎が出ますか．"},{"letter":"C","text":"周囲に風邪の子はいますか．"},{"letter":"D","text":"以前にも同じ咳が出ましたか．"},{"letter":"E","text":"犬のような咳が出ますか．"}],"answer":["B"],"multi":false,"explanation":"解説：嚥下困難と流涎，起坐位を好む姿勢は急性喉頭蓋炎を示唆し，窒息の危険がある緊急事態になる．犬吠様咳嗽と嗄声が主体で嚥下が保たれていれば声門下の浮腫を考えることになる．\n- A：日内変動に関する情報．\n- B：緊急度の高い疾患の除外に直結し有用．\n- C：感染への曝露に関する情報．\n- D：反復性に関する情報．\n- E：クループの咳の性状に関する情報．","images":[],"stem_images":[]},{"number":26,"section":"E-7-S07　2歳児・夜間の犬吠様の咳","question":"（2/4）2歳の男児．昨日から鼻水と微熱があり，今夜になって犬が吠えるような咳と声のかすれが出てきたという．唾は問題なく飲み込め，涎も出ていないという．認められる所見はどれか．","options":[{"letter":"A","text":"呼気時の連続性の高調な喘鳴"},{"letter":"B","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"C","text":"吸気時の狭窄性の喘鳴"},{"letter":"D","text":"患側の呼吸音減弱と打診での鼓音"},{"letter":"E","text":"病変部に限局した気管支呼吸音"}],"answer":["C"],"multi":false,"explanation":"解説：声門下という胸郭外の気道が狭くなるため，吸気時に胸腔内が陰圧になると気道がさらに狭まり，吸気性の喘鳴が生じる．安静時にも聴かれるようなら中等症以上と判断する．\n- A：呼気性の喘鳴は胸郭内の末梢気道の狭窄で，気管支喘息．\n- B：吸気終末の捻髪音は間質性肺炎．\n- C：胸郭外気道の狭窄を反映し正しい．\n- D：呼吸音減弱と打診鼓音は気胸．\n- E：限局した気管支呼吸音は肺炎による実質化．","images":[],"stem_images":[]},{"number":27,"section":"E-7-S07　2歳児・夜間の犬吠様の咳","question":"（3/4）2歳の男児．昨日から鼻水と微熱があり，今夜になって犬が吠えるような咳と声のかすれが出てきたという．唾は問題なく飲み込め，涎も出ていないという．安静時にも吸気性の喘鳴を認め，軽度の陥没呼吸がある．最も適切な治療はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの全身投与"},{"letter":"B","text":"抗菌薬の内服を長期にわたり継続"},{"letter":"C","text":"抗ウイルス薬の全身にわたる投与"},{"letter":"D","text":"鎮咳薬のみで経過をみて帰宅させる"},{"letter":"E","text":"抗ヒスタミン薬の連日にわたる内服"}],"answer":["A"],"multi":false,"explanation":"解説：デキサメタゾンの全身投与が声門下の浮腫を軽減し，重症度と入院率を下げる．中等症以上ではアドレナリンの吸入を併用し，効果の持続が短いため数時間の経過観察を行う．\n- A：この疾患の標準治療で正しい．\n- B：多くはウイルス性で抗菌薬は無効．\n- C：この病態に有効な抗ウイルス薬はない．\n- D：鎮咳薬だけでは気道の浮腫は改善しない．\n- E：抗ヒスタミン薬はアレルギー疾患の治療．","images":[],"stem_images":[]},{"number":28,"section":"E-7-S07　2歳児・夜間の犬吠様の咳","question":"（4/4）2歳の男児．昨日から鼻水と微熱があり，今夜になって犬が吠えるような咳と声のかすれが出てきたという．唾は問題なく飲み込め，涎も出ていないという．安静時にも吸気性の喘鳴を認め，軽度の陥没呼吸がある．デキサメタゾンの全身投与で症状は改善した．頸部正面のエックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"喉頭蓋の著明な腫大の像"},{"letter":"B","text":"気管が一側へ大きく偏位する像"},{"letter":"C","text":"声門下が先細りになる像"},{"letter":"D","text":"頸部の軟部組織に空気が入る像"},{"letter":"E","text":"頸椎の前方に膿瘍を思わせる像"}],"answer":["C"],"multi":false,"explanation":"解説：声門下の浮腫により気道が左右対称に先細りとなり，尖塔のように見える．これがsteeple signである．ただし典型的な症状があれば画像は必須ではなく，児を刺激しないことが優先される．\n- A：喉頭蓋の腫大は急性喉頭蓋炎の側面像でみられる．\n- B：気管の偏位は緊張性気胸や縦隔腫瘤．\n- C：この疾患の画像所見として正しい．\n- D：頸部軟部組織の空気は気道損傷や縦隔気腫．\n- E：頸椎前方の膿瘍像は咽後膿瘍．","images":[],"stem_images":[]},{"number":29,"section":"E-7-S08　10か月児・間欠的な啼泣と嘔吐","question":"（1/4）10か月の男児．3時間前から突然激しく泣き，しばらくすると泣きやむことを繰り返すという．嘔吐も2回あった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"便に血や粘液が混じりますか．"},{"letter":"B","text":"泣く時と静かな時が交互ですか．"},{"letter":"C","text":"吐いた物は緑色ですか．"},{"letter":"D","text":"乳歯はどの順番で生えましたか．"},{"letter":"E","text":"ぐったりする時間はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．歯の萌出順序は急な腹部症状の緊急評価では優先度が低い．\n- A：腸管の虚血・粘膜障害を検討．\n- B：間欠性の腹痛を検討．\n- C：胆汁性嘔吐から腸閉塞を検討．\n- D：歯の萌出順序は急な腹部症状の緊急評価では優先度が低い．この設問で選ぶ肢．\n- E：全身状態と重症度を評価．","images":[],"stem_images":[]},{"number":30,"section":"E-7-S08　10か月児・間欠的な啼泣と嘔吐","question":"（2/4）10か月の男児．3時間前から突然激しく泣き，しばらくすると泣きやむことを繰り返すという．嘔吐も2回あった．泣くのは数分ごとで，その間は少しぐったりしているが機嫌は戻るという．認められる所見はどれか．","options":[{"letter":"A","text":"右上腹部のソーセージ様の腫瘤"},{"letter":"B","text":"左下腹部の限局した強い圧痛"},{"letter":"C","text":"臍周囲に触れる拍動性の腫瘤"},{"letter":"D","text":"右季肋部の吸気で止まる圧痛"},{"letter":"E","text":"腹壁全体の板状硬と反跳痛"}],"answer":["A"],"multi":false,"explanation":"解説：回腸が盲腸へ引き込まれて重なるため，右上腹部に細長い腫瘤として触れる．右下腹部は空虚に感じられ，進行すると粘液に血液の混じったイチゴゼリー様の便が出る．\n- A：この疾患に特徴的で正しい．\n- B：左下腹部の限局した圧痛は大腸憩室炎．\n- C：拍動性腫瘤は腹部大動脈瘤．\n- D：吸気で止まる右季肋部の圧痛は急性胆嚢炎．\n- E：板状硬と反跳痛は汎発性腹膜炎．","images":[],"stem_images":[]},{"number":31,"section":"E-7-S08　10か月児・間欠的な啼泣と嘔吐","question":"（3/4）10か月の男児．3時間前から突然激しく泣き，しばらくすると泣きやむことを繰り返すという．嘔吐も2回あった．泣くのは数分ごとで，その間は少しぐったりしているが機嫌は戻るという．右上腹部にソーセージ様の腫瘤を触知する．腹部超音波検査で予想される所見はどれか．","options":[{"letter":"A","text":"幽門筋の著明な肥厚と延長"},{"letter":"B","text":"同心円状のtarget sign"},{"letter":"C","text":"胆嚢の腫大と壁の著明な肥厚"},{"letter":"D","text":"腎盂と腎杯の著明な拡張"},{"letter":"E","text":"肝に多発する低エコー病変"}],"answer":["B"],"multi":false,"explanation":"解説：重積した腸管を短軸で見ると，腸管壁が同心円状に重なった標的のような像が描出される．長軸では偽腎徴候となる．診断がつけば速やかに非観血的整復へ進む．\n- A：幽門筋の肥厚は肥厚性幽門狭窄症．\n- B：この疾患の典型的な超音波所見で正しい．\n- C：胆嚢の腫大と壁肥厚は急性胆嚢炎．\n- D：腎盂腎杯の拡張は水腎症．\n- E：肝の多発低エコー病変は転移や膿瘍．","images":[],"stem_images":[]},{"number":32,"section":"E-7-S08　10か月児・間欠的な啼泣と嘔吐","question":"（4/4）10か月の男児．3時間前から突然激しく泣き，しばらくすると泣きやむことを繰り返すという．嘔吐も2回あった．泣くのは数分ごとで，その間は少しぐったりしているが機嫌は戻るという．右上腹部にソーセージ様の腫瘤を触知し，超音波でtarget signを認めた．生後4週の男児が噴水状に嘔吐する場合の電解質異常はどれか．","options":[{"letter":"A","text":"高クロール性の代謝性アシドーシス"},{"letter":"B","text":"高カリウム性の代謝性アシドーシス"},{"letter":"C","text":"低クロール性アルカローシス"},{"letter":"D","text":"高ナトリウム性の代謝性アシドーシス"},{"letter":"E","text":"低カルシウム性の代謝性アルカローシス"}],"answer":["C"],"multi":false,"explanation":"解説：肥厚性幽門狭窄症では胃液だけが大量に失われるため，塩酸と一緒に水素イオンとクロールが抜けて低クロール性の代謝性アルカローシスとなる．嘔吐は胆汁を含まない．\n- A：高クロール性アシドーシスは下痢や尿細管性アシドーシス．\n- B：高カリウム性アシドーシスは腎不全．\n- C：胃液喪失の帰結として正しい．\n- D：高ナトリウム性アシドーシスはこの病態と合わない．\n- E：低カルシウム血症はこの病態の主要な異常ではない．","images":[],"stem_images":[]},{"number":33,"section":"E-7-S09　生後1か月児・黄疸と灰白色便","question":"（1/4）生後1か月の女児．1か月健診で皮膚の黄染を指摘された．在胎39週，出生体重3000gで経過は順調だったという．胆汁が腸管へ排泄されているかを評価する質問はどれか．","options":[{"letter":"A","text":"便の色はどうなっていますか．"},{"letter":"B","text":"母乳とミルクのどちらですか．"},{"letter":"C","text":"一日に何回飲んでいますか．"},{"letter":"D","text":"体重は増えていますか．"},{"letter":"E","text":"きょうだいも黄疸がありましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：胆汁が腸管へ流れないと便のステルコビリンが失われて灰白色からクリーム色になる．母子健康手帳の便カラーカードで比べることで，生後早期に胆汁うっ滞性疾患を拾い上げられる．\n- A：胆汁うっ滞の有無を直接示し有用．\n- B：哺乳の種類に関する情報．\n- C：哺乳の頻度に関する情報．\n- D：発育に関する情報．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":34,"section":"E-7-S09　生後1か月児・黄疸と灰白色便","question":"（2/4）生後1か月の女児．1か月健診で皮膚の黄染を指摘された．在胎39週，出生体重3000gで経過は順調だったという．便はクリーム色で，尿は濃い黄色だという．測定すべき検査値はどれか．","options":[{"letter":"A","text":"血清尿酸値の正確な測定"},{"letter":"B","text":"血清クレアチンキナーゼの測定"},{"letter":"C","text":"直接ビリルビンの分画の測定"},{"letter":"D","text":"血清アミラーゼとリパーゼの測定"},{"letter":"E","text":"骨密度と骨代謝マーカーの推移"}],"answer":["C"],"multi":false,"explanation":"解説：生理的黄疸は間接ビリルビン優位だが，胆汁の流出が妨げられると直接ビリルビンが優位に上がる．総ビリルビンだけを見ると見逃すため，遷延する黄疸では必ず分画を測る．\n- A：尿酸値は痛風や腫瘍崩壊症候群の指標．\n- B：クレアチンキナーゼは筋傷害の指標．\n- C：病型の決定に直結し正しい．\n- D：アミラーゼとリパーゼは膵疾患の指標．\n- E：骨密度は骨粗鬆症の評価．","images":[],"stem_images":[]},{"number":35,"section":"E-7-S09　生後1か月児・黄疸と灰白色便","question":"（3/4）生後1か月の女児．1か月健診で皮膚の黄染を指摘された．在胎39週，出生体重3000gで経過は順調だったという．便はクリーム色で，尿は濃い黄色だという．総ビリルビン9.8mg/dL，直接ビリルビン6.4mg/dLであった．最も考えられる疾患はどれか．","options":[{"letter":"A","text":"生理的黄疸が遷延したもの"},{"letter":"B","text":"母乳性黄疸が続いているもの"},{"letter":"C","text":"血液型不適合による溶血"},{"letter":"D","text":"胆道が閉塞している疾患"},{"letter":"E","text":"甲状腺機能低下によるもの"}],"answer":["D"],"multi":false,"explanation":"解説：直接ビリルビン優位の遷延性黄疸と灰白色便は胆汁の流出障害を示す．胆道閉鎖症は進行性に肝硬変へ至るため，超音波・胆道シンチ・術中胆道造影で速やかに確認する．\n- A：生理的黄疸は間接ビリルビン優位で1週前後に軽快する．\n- B：母乳性黄疸も間接ビリルビン優位である．\n- C：血液型不適合による溶血も間接ビリルビン優位．\n- D：所見の組合せに合致し正しい．\n- E：甲状腺機能低下症の黄疸も間接ビリルビン優位．","images":[],"stem_images":[]},{"number":36,"section":"E-7-S09　生後1か月児・黄疸と灰白色便","question":"（4/4）生後1か月の女児．1か月健診で皮膚の黄染を指摘された．在胎39週，出生体重3000gで経過は順調だったという．便はクリーム色で，尿は濃い黄色だという．総ビリルビン9.8mg/dL，直接ビリルビン6.4mg/dLであった．診断の確定を急ぐ理由はどれか．","options":[{"letter":"A","text":"生後60日以内の手術が要る"},{"letter":"B","text":"生後1年以内なら手術の時期は問わない"},{"letter":"C","text":"自然に軽快するので経過観察でよい"},{"letter":"D","text":"薬物療法だけで治癒が期待できる"},{"letter":"E","text":"成長を待ってから手術する方がよい"}],"answer":["A"],"multi":false,"explanation":"解説：日齢が進むほど肝の線維化が進み，葛西手術による胆汁排泄の成功率が下がる．生後60日を超えると予後が明らかに悪化するため，健診での便色の確認と速やかな紹介が決定的になる．\n- A：早期手術の根拠として正しい．\n- B：時期を問わないという考えは誤りで，遅れるほど予後が悪い．\n- C：放置すれば肝硬変から肝不全に至る．\n- D：薬物だけでは胆汁の流出を回復できない．\n- E：待つほど線維化が進み不利になる．","images":[],"stem_images":[]},{"number":37,"section":"E-7-S10　4歳児・朝の顔のむくみ","question":"（1/4）4歳の男児．3日前から朝起きたときにまぶたが腫れ，尿が泡立つという．体重も2kg増えた．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"尿の色は赤くありませんか．"},{"letter":"B","text":"尿量が減っていませんか．"},{"letter":"C","text":"乳歯は何本生え替わりましたか．"},{"letter":"D","text":"最近，のどや皮膚の感染はありましたか．"},{"letter":"E","text":"腹痛や発熱はありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．歯の交換数は急な浮腫の原因検索では優先度が低い．\n- A：血尿を伴う腎炎との鑑別に有用．\n- B：腎障害と体液貯留を評価．\n- C：歯の交換数は急な浮腫の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：先行感染を確認．\n- E：腹膜炎などの合併症を検討．","images":[],"stem_images":[]},{"number":38,"section":"E-7-S10　4歳児・朝の顔のむくみ","question":"（2/4）4歳の男児．3日前から朝起きたときにまぶたが腫れ，尿が泡立つという．体重も2kg増えた．尿が赤くなったことはないという．予想される検査所見の組合せはどれか．","options":[{"letter":"A","text":"高度蛋白尿と血清アルブミン高値"},{"letter":"B","text":"血尿主体で蛋白尿はごく軽度"},{"letter":"C","text":"高度蛋白尿と低アルブミン血症"},{"letter":"D","text":"尿蛋白は陰性で血清アルブミン低値"},{"letter":"E","text":"血清総コレステロールの著明な低下"}],"answer":["C"],"multi":false,"explanation":"解説：1日あたり体表面積で補正した高度の蛋白尿と，血清アルブミン2.5g/dL以下が診断の必須項目になる．肝でのリポ蛋白合成が代償性に増えるため総コレステロールは上昇する．\n- A：アルブミンは尿へ失われて低下する．
