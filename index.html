く．胎盤の位置を画像で確認するまで，内診と経腟の器具操作は避けるのが原則である．\n- A：経腟超音波は慎重に行えば安全で，診断に有用．\n- B：大量出血を誘発する危険があり正しい．\n- C：胎児心拍モニタリングは非侵襲的で必要．\n- D：血算と凝固の評価は輸血の準備に必要．\n- E：静脈路の確保は出血に備えた基本の対応．","images":[],"stem_images":[]},{"number":27,"section":"D-10-S07　36歳女性・妊娠31週の無痛性出血","question":"（3/4）36歳の女性．妊娠31週．本日，突然に鮮紅色の性器出血があり来院した．腹痛はまったくないという．2回の帝王切開の既往があるという．経腟超音波で胎盤が内子宮口を完全に覆っていた．子宮は軟らかく圧痛はなく，胎児心拍は良好である．最も適切な管理はどれか．","options":[{"letter":"A","text":"直ちに経腟分娩を誘発する"},{"letter":"B","text":"外来で経過をみて次回健診まで待つ"},{"letter":"C","text":"内診で子宮口の開大度を繰り返し確認"},{"letter":"D","text":"子宮収縮薬で陣痛を起こさせる"},{"letter":"E","text":"入院管理とし帝王切開を準備する"}],"answer":["E"],"multi":false,"explanation":"解説：経腟分娩は不可能で，出血の再発に備えて入院のうえ輸血の準備と安静を保つ．胎児の成熟を待ちながら，出血が持続・増悪すれば週数にかかわらず帝王切開に踏み切る．\n- A：胎盤が先進しており経腟分娩は禁忌．\n- B：大量出血の危険があり外来管理は許されない．\n- C：内診の反復は出血を誘発する．\n- D：陣痛を起こせば胎盤剝離と大量出血を招く．\n- E：標準的な管理で正しい．","images":[],"stem_images":[]},{"number":28,"section":"D-10-S07　36歳女性・妊娠31週の無痛性出血","question":"（4/4）36歳の女性．妊娠31週．本日，突然に鮮紅色の性器出血があり来院した．腹痛はまったくないという．2回の帝王切開の既往があるという．経腟超音波で胎盤が内子宮口を完全に覆っていた．子宮は軟らかく圧痛はなく，胎児心拍は良好である．入院のうえ帝王切開を準備した．手術時に最も警戒すべき合併症はどれか．","options":[{"letter":"A","text":"胎盤が子宮筋層へ入り込み剝がれない"},{"letter":"B","text":"羊水が過少となり胎児が圧迫される"},{"letter":"C","text":"臍帯が胎児の頸部に巻きつくこと"},{"letter":"D","text":"子宮が分娩後に急速に縮小すること"},{"letter":"E","text":"胎児が骨盤位のまま娩出されること"}],"answer":["A"],"multi":false,"explanation":"解説：既往帝王切開に前置胎盤が重なると，脱落膜の欠損部で絨毛が筋層へ侵入する癒着胎盤の危険が高い．用手剝離を試みると大量出血となるため，術前診断と子宮摘出を含む準備が要る．\n- A：この組合せで最も警戒すべき合併症で正しい．\n- B：羊水過少は別の要因で起こり，本例の主な危険ではない．\n- C：臍帯巻絡は頻度が高いが多くは問題にならない．\n- D：分娩後の子宮収縮は正常な過程で，むしろ収縮しないことが問題になる．\n- E：骨盤位は帝王切開で対応できる．","images":[],"stem_images":[]},{"number":29,"section":"D-10-S08　32歳女性・分娩の遷延","question":"（1/4）32歳の女性．妊娠40週．8時間前から陣痛が始まり，子宮口は6cmまで開大したが，その後4時間変化がないという．初産である．分娩の進行に関わる娩出力を評価する項目はどれか．","options":[{"letter":"A","text":"児頭の回旋が正常か"},{"letter":"B","text":"陣痛の強さと間隔が十分か"},{"letter":"C","text":"骨盤の形態と広さはどうか"},{"letter":"D","text":"胎児の推定体重はどの程度か"},{"letter":"E","text":"子宮頸管に瘢痕はないか"}],"answer":["B"],"multi":false,"explanation":"解説：分娩の進行には娩出力・産道・娩出物が関わる．娩出力は陣痛の強さ・持続時間・間隔から評価する．子宮口の開大度だけで微弱陣痛と断定せず，胎児の状態と通過障害も確認する．\n- A：娩出物の位置に関する情報．\n- B：三要素の第一を評価し有用．\n- C：骨産道に関する情報．\n- D：娩出物の大きさに関する情報．\n- E：軟産道に関する情報．","images":[],"stem_images":[]},{"number":30,"section":"D-10-S08　32歳女性・分娩の遷延","question":"（2/4）32歳の女性．妊娠40週．8時間前から陣痛が始まり，子宮口は6cmまで開大したが，その後4時間変化がないという．初産である．陣痛は15分おきで持続20秒と弱いという．この状態はどれか．","options":[{"letter":"A","text":"産道の異常による通過障害"},{"letter":"B","text":"胎児の回旋の異常"},{"letter":"C","text":"胎児の推定体重の過大"},{"letter":"D","text":"娩出力が不十分な状態"},{"letter":"E","text":"臍帯が下垂している状態"}],"answer":["D"],"multi":false,"explanation":"解説：陣痛の間隔が長く持続も短いのは微弱陣痛で，娩出力の不足にあたる．原発性と続発性があり，まず産道と胎児側の異常を除外してから陣痛促進の適応を判断する．\n- A：産道の異常は骨盤の狭小や軟産道の強靱による．\n- B：回旋異常は児頭の向きの問題で，陣痛の強さとは別．\n- C：胎児の過大は娩出物側の問題．\n- D：陣痛の性状に合致し正しい．\n- E：臍帯下垂は胎児心拍の異常をきたす緊急事態．","images":[],"stem_images":[]},{"number":31,"section":"D-10-S08　32歳女性・分娩の遷延","question":"（3/4）32歳の女性．妊娠40週．8時間前から陣痛が始まり，子宮口は6cmまで開大したが，その後4時間変化がないという．初産である．陣痛は15分おきで持続20秒と弱いという．超音波で胎児推定体重は3000gで骨盤の大きさも十分であり，胎児心拍は良好である．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに緊急帝王切開を行う"},{"letter":"B","text":"子宮収縮抑制薬を投与する"},{"letter":"C","text":"分娩を中止し帰宅させる"},{"letter":"D","text":"胎児心拍を見ながら陣痛を促進する"},{"letter":"E","text":"内診をせずに数日経過をみる"}],"answer":["D"],"multi":false,"explanation":"解説：産道と娩出物に問題がなく胎児の状態も良ければ，オキシトシンなどで陣痛を強める．過強陣痛と胎児機能不全に注意しながら，分娩監視装置で連続的に胎児心拍を観察する．\n- A：この段階で帝王切開を選ぶ根拠はない．\n- B：収縮抑制薬は早産の管理に用いるもので，本例とは逆．\n- C：陣痛が始まっており帰宅は不適切．\n- D：三要素の評価に基づく標準的な対応で正しい．\n- E：分娩中の経過観察を数日続けることはできない．","images":[],"stem_images":[]},{"number":32,"section":"D-10-S08　32歳女性・分娩の遷延","question":"（4/4）32歳の女性．妊娠40週．8時間前から陣痛が始まり，子宮口は6cmまで開大したが，その後4時間変化がないという．初産である．陣痛は15分おきで持続20秒と弱いという．超音波で胎児推定体重は3000gで骨盤の大きさも十分であり，胎児心拍は良好である．陣痛促進により経腟分娩となったが，胎盤娩出後に多量の出血が続き子宮が柔らかく触れる．直ちに行うべきなのはどれか．","options":[{"letter":"A","text":"子宮収縮薬と子宮底のマッサージ"},{"letter":"B","text":"子宮収縮抑制薬の静脈内投与"},{"letter":"C","text":"利尿薬を投与して除水する"},{"letter":"D","text":"抗菌薬を長期に予防投与する"},{"letter":"E","text":"副腎皮質ステロイドを投与する"}],"answer":["A"],"multi":false,"explanation":"解説：分娩後の大量出血で最も多いのは弛緩出血である．子宮が収縮しないため胎盤剝離面の血管が閉じない．子宮底の輪状マッサージと子宮収縮薬で収縮を促し，並行して輸液と輸血を行う．\n- A：出血の機序に直接対応し正しい．\n- B：収縮抑制薬は出血を悪化させる．\n- C：利尿薬は循環血漿量をさらに減らす．\n- D：抗菌薬は感染症の治療で，急性出血には無効．\n- E：ステロイドはこの病態の治療ではない．","images":[],"stem_images":[]}],"seed":null},{"id":"D-12_内分泌栄養代謝系","name":"D-12_内分泌栄養代謝系.md","label":"D-12 内分泌栄養代謝系","count":44,"sourceHash":"84c8e270d8fb","questions":[{"number":1,"section":"D-12-S01　48歳男性・手足と顔貌の変化","question":"（1/4）48歳の男性．半年前から指輪がきつくなり，靴のサイズも大きくなったという．頭痛と発汗も増えた．顔貌の経年的変化を確認するための質問はどれか．","options":[{"letter":"A","text":"視野の端が見えにくいですか．"},{"letter":"B","text":"昔の写真と顔つきが違いますか．"},{"letter":"C","text":"いびきが強くなりましたか．"},{"letter":"D","text":"手にしびれがありますか．"},{"letter":"E","text":"血糖が高いと言われましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：この疾患は数年から十数年かけて緩徐に進むため，本人も家族も変化に気づきにくい．古い写真と見比べることで眉弓部の膨隆や下顎の突出といった変化が客観的に確認でき，発症時期の推定にもなる．\n- A：視交叉への影響に関する情報．\n- B：緩徐な変化を可視化でき有用．\n- C：上気道への影響に関する情報．\n- D：末梢神経圧迫に関する情報．\n- E：代謝への影響に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-12-S01　48歳男性・手足と顔貌の変化","question":"（2/4）48歳の男性．半年前から指輪がきつくなり，靴のサイズも大きくなったという．頭痛と発汗も増えた．10年前の写真と比べると下顎が前に出て鼻も大きくなっているという．認められる所見はどれか．","options":[{"letter":"A","text":"両耳側の視野が欠けている"},{"letter":"B","text":"甲状腺のびまん性の圧痛"},{"letter":"C","text":"手指の近位指節間関節の変形"},{"letter":"D","text":"両下肢の腱反射の全般的消失"},{"letter":"E","text":"皮膚に赤紫色の線条が多発する"}],"answer":["A"],"multi":false,"explanation":"解説：下垂体の腫瘍が上方の視交叉を圧迫すると，鼻側網膜から来る線維が障害されて両耳側半盲となる．視野障害は自覚しにくいので，対座法や視野検査で積極的に確かめる必要がある．\n- A：下垂体腫瘍による圧迫を示し正しい．\n- B：甲状腺のびまん性の圧痛は亜急性甲状腺炎．\n- C：近位指節間関節の変形は関節リウマチ．\n- D：腱反射の全般的消失は末梢神経障害．\n- E：赤紫色の皮膚線条はCushing症候群．","images":[],"stem_images":[]},{"number":3,"section":"D-12-S01　48歳男性・手足と顔貌の変化","question":"（3/4）48歳の男性．半年前から指輪がきつくなり，靴のサイズも大きくなったという．頭痛と発汗も増えた．10年前の写真と比べると下顎が前に出て鼻も大きくなっているという．対座法で両耳側の視野欠損を認め，血圧158/94mmHg，空腹時血糖142mg/dLであった．診断に最も有用な検査はどれか．","options":[{"letter":"A","text":"デキサメタゾン抑制試験の施行"},{"letter":"B","text":"75g経口ブドウ糖負荷での成長ホルモン"},{"letter":"C","text":"アルドステロン・レニン活性比"},{"letter":"D","text":"血漿メタネフリン分画の測定"},{"letter":"E","text":"TSH受容体抗体の測定"}],"answer":["B"],"multi":false,"explanation":"解説：健常者ではブドウ糖負荷で成長ホルモンが抑制されるが，自律性に分泌する腺腫があると抑制されない．IGF-1の年齢基準値を超える高値と併せ，下垂体MRIで腫瘍を確認する．\n- A：デキサメタゾン抑制試験はCushing症候群の検査．\n- B：自律性分泌を直接証明でき正しい．\n- C：アルドステロン・レニン活性比は原発性アルドステロン症．\n- D：メタネフリン分画は褐色細胞腫．\n- E：TSH受容体抗体はBasedow病．","images":[],"stem_images":[]},{"number":4,"section":"D-12-S01　48歳男性・手足と顔貌の変化","question":"（4/4）48歳の男性．半年前から指輪がきつくなり，靴のサイズも大きくなったという．頭痛と発汗も増えた．10年前の写真と比べると下顎が前に出て鼻も大きくなっているという．対座法で両耳側の視野欠損を認め，血圧158/94mmHg，空腹時血糖142mg/dLであった．ブドウ糖負荷で成長ホルモンは抑制されなかった．血糖が上がる機序はどれか．","options":[{"letter":"A","text":"インスリンの分泌が完全に枯渇する"},{"letter":"B","text":"腸管からの糖吸収が亢進する"},{"letter":"C","text":"成長ホルモンによるインスリン抵抗性"},{"letter":"D","text":"腎での糖再吸収が低下する"},{"letter":"E","text":"自己抗体がβ細胞を破壊する"}],"answer":["C"],"multi":false,"explanation":"解説：成長ホルモンは脂肪分解を促し，肝と筋でのインスリンの作用を妨げる．その結果インスリン抵抗性が生じて耐糖能が悪化する．同じ機序でCushing症候群でも高血糖をきたす．\n- A：インスリンの枯渇は1型糖尿病の機序．\n- B：腸管からの糖吸収亢進はこの疾患の機序ではない．\n- C：抗インスリン作用によるもので正しい．\n- D：腎での糖再吸収低下はむしろ血糖を下げる．\n- E：自己抗体によるβ細胞破壊は1型糖尿病．","images":[],"stem_images":[]},{"number":5,"section":"D-12-S02　42歳女性・中心性肥満と皮膚の変化","question":"（1/4）42歳の女性．1年前から顔が丸くなり体幹に脂肪がついたという．腹部に赤紫色の線が現れ，階段を昇るのがつらくなった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から近視ですか．"},{"letter":"B","text":"月経の間隔は変わりましたか．"},{"letter":"C","text":"血圧や血糖が高くなりましたか．"},{"letter":"D","text":"あざができやすくなりましたか．"},{"letter":"E","text":"ステロイドを使っていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性の近視は今回の皮膚・筋力変化の原因検索では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：慢性の近視は今回の皮膚・筋力変化の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：性腺機能への影響を確認．\n- C：代謝・循環への影響を確認．\n- D：皮膚脆弱性を確認．\n- E：医原性のコルチゾール作用を検討．","images":[],"stem_images":[]},{"number":6,"section":"D-12-S02　42歳女性・中心性肥満と皮膚の変化","question":"（2/4）42歳の女性．1年前から顔が丸くなり体幹に脂肪がついたという．腹部に赤紫色の線が現れ，階段を昇るのがつらくなった．ステロイドの使用歴はまったくないという．診断のためにまず行うべき検査はどれか．","options":[{"letter":"A","text":"75g経口ブドウ糖負荷での成長ホルモン"},{"letter":"B","text":"アルドステロン・レニン活性比の算出"},{"letter":"C","text":"血漿メタネフリン分画の測定"},{"letter":"D","text":"一晩少量デキサメタゾン抑制試験"},{"letter":"E","text":"TSH受容体抗体の測定"}],"answer":["D"],"multi":false,"explanation":"解説：夜間に少量のデキサメタゾンを内服させ，翌朝のコルチゾールが抑制されるかを見る．自律性に分泌している場合は抑制されない．深夜唾液中コルチゾールや尿中遊離コルチゾールも用いる．\n- A：ブドウ糖負荷での成長ホルモンは先端巨大症の検査．\n- B：アルドステロン・レニン活性比は原発性アルドステロン症．\n- C：メタネフリン分画は褐色細胞腫．\n- D：スクリーニングとして標準的で正しい．\n- E：TSH受容体抗体はBasedow病．","images":[],"stem_images":[]},{"number":7,"section":"D-12-S02　42歳女性・中心性肥満と皮膚の変化","question":"（3/4）42歳の女性．1年前から顔が丸くなり体幹に脂肪がついたという．腹部に赤紫色の線が現れ，階段を昇るのがつらくなった．ステロイドの使用歴はまったくないという．一晩少量デキサメタゾン抑制試験でコルチゾールは抑制されなかった．次に測定すべきなのはどれか．","options":[{"letter":"A","text":"血漿ACTHの濃度"},{"letter":"B","text":"血清カルシウムの値"},{"letter":"C","text":"血清アミラーゼの値"},{"letter":"D","text":"血中アンモニアの値"},{"letter":"E","text":"血清クレアチンキナーゼ"}],"answer":["A"],"multi":false,"explanation":"解説：ACTHが抑制されず正常〜高値なら下垂体腺腫や異所性ACTH産生腫瘍によるACTH依存性で，低値なら副腎の腫瘍によるACTH非依存性である．この分岐で画像検索の対象が変わる．\n- A：病型の分岐を決め正しい．\n- B：カルシウムは副甲状腺疾患の評価．\n- C：アミラーゼは膵疾患の指標．\n- D：アンモニアは肝性脳症の指標．\n- E：クレアチンキナーゼは筋傷害の指標．","images":[],"stem_images":[]},{"number":8,"section":"D-12-S02　42歳女性・中心性肥満と皮膚の変化","question":"（4/4）42歳の女性．1年前から顔が丸くなり体幹に脂肪がついたという．腹部に赤紫色の線が現れ，階段を昇るのがつらくなった．ステロイドの使用歴はまったくないという．一晩少量デキサメタゾン抑制試験でコルチゾールは抑制されなかった．血漿ACTHは高値で，大量デキサメタゾンでは抑制された．病変の部位はどれか．","options":[{"letter":"A","text":"副腎皮質の腺腫"},{"letter":"B","text":"肺の小細胞癌"},{"letter":"C","text":"下垂体前葉の腺腫"},{"letter":"D","text":"甲状腺の濾胞腺腫"},{"letter":"E","text":"膵の内分泌腫瘍"}],"answer":["C"],"multi":false,"explanation":"解説：下垂体腺腫は負のフィードバックへの感受性が残っているため，大量のデキサメタゾンでは抑制される．異所性ACTH産生腫瘍では大量でも抑制されず，この差が両者を分ける鍵になる．\n- A：副腎腺腫ではACTHは抑制されて低値になる．\n- B：肺小細胞癌は異所性ACTH産生腫瘍の代表で，大量でも抑制されない．\n- C：ACTH高値かつ大量で抑制という所見に合致し正しい．\n- D：甲状腺の濾胞腺腫はACTHを産生しない．\n- E：膵内分泌腫瘍も異所性産生の場合は抑制されない．","images":[],"stem_images":[]},{"number":9,"section":"D-12-S03　32歳女性・動悸と体重減少","question":"（1/4）32歳の女性．3か月前から動悸がして手が震え，食べているのに体重が6kg減ったという．汗をかきやすく暑がりになった．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"甲状腺の薬を飲んでいますか．"},{"letter":"B","text":"首の痛みや発熱はありますか．"},{"letter":"C","text":"最近，出産しましたか．"},{"letter":"D","text":"首や眼に変化はありますか．"},{"letter":"E","text":"子どもの頃に鼻血が出ましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．小児期の鼻出血は今回の代謝亢進症状の評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：外因性ホルモン過剰を検討．\n- B：炎症性甲状腺疾患を検討．\n- C：産後の甲状腺機能異常を検討．\n- D：甲状腺の腫大や眼症状を確認．\n- E：小児期の鼻出血は今回の代謝亢進症状の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":10,"section":"D-12-S03　32歳女性・動悸と体重減少","question":"（2/4）32歳の女性．3か月前から動悸がして手が震え，食べているのに体重が6kg減ったという．汗をかきやすく暑がりになった．首が全体に腫れ，目が出てきたと言われるという．予想されるホルモン所見はどれか．","options":[{"letter":"A","text":"TSHもFT4もともに低値である"},{"letter":"B","text":"TSH低値でFT4高値である"},{"letter":"C","text":"TSH高値でFT4低値である"},{"letter":"D","text":"TSHもFT4もともに高値である"},{"letter":"E","text":"TSHもFT4も正常範囲である"}],"answer":["B"],"multi":false,"explanation":"解説：甲状腺から過剰に分泌されたホルモンが下垂体を抑えるため，TSHは感度よく低下する．TSHとFT4の組合せが逆向きなら原発性甲状腺疾患で，同じ向きなら下垂体性を考えることになる．\n- A：両者が低値なのは中枢性甲状腺機能低下症．\n- B：原発性の機能亢進として正しい．\n- C：TSH高値でFT4低値は原発性甲状腺機能低下症．\n- D：両者が高値なのはTSH産生腫瘍など．\n- E：明らかな症状がある以上，正常とは考えにくい．","images":[],"stem_images":[]},{"number":11,"section":"D-12-S03　32歳女性・動悸と体重減少","question":"（3/4）32歳の女性．3か月前から動悸がして手が震え，食べているのに体重が6kg減ったという．汗をかきやすく暑がりになった．首が全体に腫れ，目が出てきたと言われるという．脈拍118/分，TSH 0.01μIU/mL未満，FT4 4.2ng/dLであった．診断を確定する検査はどれか．","options":[{"letter":"A","text":"デキサメタゾン抑制試験の施行"},{"letter":"B","text":"血漿メタネフリン分画の測定"},{"letter":"C","text":"アルドステロン・レニン活性比"},{"letter":"D","text":"TSH受容体抗体の測定"},{"letter":"E","text":"75g経口ブドウ糖負荷試験"}],"answer":["D"],"multi":false,"explanation":"解説：TSH受容体に対する自己抗体が受容体を刺激し続けることが病因で，この抗体の陽性が診断を確定する．無痛性甲状腺炎や亜急性甲状腺炎との鑑別にもこの抗体と摂取率検査が使われる．\n- A：デキサメタゾン抑制試験はCushing症候群の検査．\n- B：メタネフリン分画は褐色細胞腫．\n- C：アルドステロン・レニン活性比は原発性アルドステロン症．\n- D：病因を直接示し正しい．\n- E：ブドウ糖負荷試験は糖代謝と成長ホルモンの評価．","images":[],"stem_images":[]},{"number":12,"section":"D-12-S03　32歳女性・動悸と体重減少","question":"（4/4）32歳の女性．3か月前から動悸がして手が震え，食べているのに体重が6kg減ったという．汗をかきやすく暑がりになった．首が全体に腫れ，目が出てきたと言われるという．脈拍118/分，TSH 0.01μIU/mL未満，FT4 4.2ng/dLであった．TSH受容体抗体が陽性で，抗甲状腺薬を開始した．患者に必ず説明すべき副作用はどれか．","options":[{"letter":"A","text":"服用中は日光を完全に避けること"},{"letter":"B","text":"発熱と咽頭痛が出たら直ちに受診"},{"letter":"C","text":"服用中は水分を強く制限すること"},{"letter":"D","text":"服用中は運動を完全にやめること"},{"letter":"E","text":"服用中は蛋白質を摂らないこと"}],"answer":["B"],"multi":false,"explanation":"解説：抗甲状腺薬は無顆粒球症を起こしうる．投与開始から2か月以内に多く，発熱と咽頭痛が唯一の初発症状のことがある．直ちに中止して白血球分画を確認しないと致死的な感染に至る．\n- A：日光の回避はポルフィリン症などの指導．\n- B：致死的な副作用の早期発見に直結し正しい．\n- C：水分制限はこの治療と関係しない．\n- D：運動の完全中止は不要で，頻脈が落ち着くまで過度な運動を控える程度でよい．\n- E：蛋白制限は腎不全の食事療法．","images":[],"stem_images":[]},{"number":13,"section":"D-12-S04　56歳女性・寒がりと動作の緩慢","question":"（1/4）56歳の女性．1年前から寒がりになり，体重が5kg増えたという．便秘がちで声もかすれてきた．甲状腺機能低下を起こす治療歴を確認する質問はどれか．","options":[{"letter":"A","text":"家族に甲状腺の病気はありますか．"},{"letter":"B","text":"海藻を毎日多く食べますか．"},{"letter":"C","text":"最近，出産しましたか．"},{"letter":"D","text":"首が痛くなったことはありますか．"},{"letter":"E","text":"首の手術や照射を受けましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：甲状腺の手術や頸部への放射線照射，放射性ヨウ素治療は機能低下の明らかな原因になる．自己免疫性の慢性甲状腺炎が最も多いが，まず医原性の原因を確かめることで診断が早く定まる．\n- A：家族歴に関する情報．\n- B：ヨウ素摂取に関する情報．\n- C：産後の変化に関する情報．\n- D：炎症性病変に関する情報．\n- E：明らかな原因を除外でき有用．","images":[],"stem_images":[]},{"number":14,"section":"D-12-S04　56歳女性・寒がりと動作の緩慢","question":"（2/4）56歳の女性．1年前から寒がりになり，体重が5kg増えたという．便秘がちで声もかすれてきた．首の手術も放射線治療も受けていないという．認められる所見はどれか．","options":[{"letter":"A","text":"眼球突出と眼瞼の後退"},{"letter":"B","text":"皮膚の湿潤と手指の細かい振戦"},{"letter":"C","text":"アキレス腱反射の弛緩相の遅延"},{"letter":"D","text":"腹部の赤紫色の皮膚線条"},{"letter":"E","text":"両耳側の視野の欠損"}],"answer":["C"],"multi":false,"explanation":"解説：腱反射の収縮相は保たれるのに弛緩相が緩慢になる特徴的な所見で，代謝の低下を反映する．皮膚は乾燥して粗く，圧痕を残さない粘液水腫性の浮腫を伴う．\n- A：眼球突出と眼瞼後退は甲状腺機能亢進症．\n- B：皮膚の湿潤と細かい振戦も機能亢進の所見．\n- C：この疾患に特徴的で正しい．\n- D：赤紫色の皮膚線条はCushing症候群．\n- E：両耳側半盲は下垂体腫瘍による視交叉の圧迫．","images":[],"stem_images":[]},{"number":15,"section":"D-12-S04　56歳女性・寒がりと動作の緩慢","question":"（3/4）56歳の女性．1年前から寒がりになり，体重が5kg増えたという．便秘がちで声もかすれてきた．首の手術も放射線治療も受けていないという．アキレス腱反射の弛緩相が遅延している．TSH 28μIU/mL，FT4 0.5ng/dLであった．最も考えられる原因はどれか．","options":[{"letter":"A","text":"下垂体前葉の機能が落ちていること"},{"letter":"B","text":"ヨウ素の摂取が極端に不足したこと"},{"letter":"C","text":"甲状腺への自己免疫性の慢性炎症"},{"letter":"D","text":"甲状腺ホルモンの受容体の異常"},{"letter":"E","text":"甲状腺にTSH産生腫瘍があること"}],"answer":["C"],"multi":false,"explanation":"解説：TSHが高くFT4が低いのは原発性の機能低下で，本邦での最多の原因は慢性甲状腺炎である．抗サイログロブリン抗体と抗甲状腺ペルオキシダーゼ抗体の陽性，超音波での内部エコーの不均一で診断を支持する．\n- A：下垂体性ではTSHも低値〜正常にとどまる．\n- B：本邦はヨウ素の摂取が多く，欠乏はまれである．\n- C：原発性の最多の原因で正しい．\n- D：受容体異常はきわめてまれで，甲状腺ホルモンは高値になる．\n- E：TSH産生腫瘍ではFT4が高値になる．","images":[],"stem_images":[]},{"number":16,"section":"D-12-S04　56歳女性・寒がりと動作の緩慢","question":"（4/4）56歳の女性．1年前から寒がりになり，体重が5kg増えたという．便秘がちで声もかすれてきた．首の手術も放射線治療も受けていないという．アキレス腱反射の弛緩相が遅延している．TSH 28μIU/mL，FT4 0.5ng/dLであった．抗甲状腺ペルオキシダーゼ抗体が陽性であった．同じホルモン異常が新生児期にあった場合の対応はどれか．","options":[{"letter":"A","text":"学童期まで経過を観察する"},{"letter":"B","text":"成長を待ってから手術を行う"},{"letter":"C","text":"食事療法のみで様子をみる"},{"letter":"D","text":"速やかにホルモン補充を始める"},{"letter":"E","text":"抗甲状腺薬の投与を開始する"}],"answer":["D"],"multi":false,"explanation":"解説：先天性甲状腺機能低下症は新生児マススクリーニングで拾い上げ，生後早期にホルモン補充を始めれば知能障害と成長障害を防げる．発見と治療の遅れが不可逆的な神経発達の障害を残す．\n- A：経過観察している間に不可逆的な障害が生じる．\n- B：手術の適応ではない．\n- C：食事療法では補えない．\n- D：早期治療が予後を決め正しい．\n- E：抗甲状腺薬は機能亢進の治療で，本例とは逆．","images":[],"stem_images":[]},{"number":17,"section":"D-12-S05　14歳男子・急な口渇と体重減少","question":"（1/4）14歳の男子．3週間前から喉が渇いて水を大量に飲み，夜も何度もトイレに起きるという．食べているのに体重が5kg減った．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"腹痛や嘔吐はありますか．"},{"letter":"B","text":"一日に水をどれだけ飲みますか．"},{"letter":"C","text":"呼吸が深く速くなりましたか．"},{"letter":"D","text":"以前から近視ですか．"},{"letter":"E","text":"発熱や感染症状はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性の近視は急な代謝失調の緊急評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：ケトアシドーシスを疑う症状を確認．\n- B：口渇と水分出納の程度を確認．\n- C：代謝性アシドーシスの徴候を確認．\n- D：慢性の近視は急な代謝失調の緊急評価では優先度が低い．この設問で選ぶ肢．\n- E：急性増悪の誘因を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-12-S05　14歳男子・急な口渇と体重減少","question":"（2/4）14歳の男子．3週間前から喉が渇いて水を大量に飲み，夜も何度もトイレに起きるという．食べているのに体重が5kg減った．症状は3週間で急速に進んだという．来院時に腹痛と嘔吐があり，意識はやや混濁している．認められる所見はどれか．","options":[{"letter":"A","text":"湿った皮膚と手指の細かい振戦"},{"letter":"B","text":"アキレス腱反射の弛緩相の遅延"},{"letter":"C","text":"腹部の赤紫色の皮膚線条"},{"letter":"D","text":"両耳側の視野の欠損"},{"letter":"E","text":"深く速い呼吸と果実様の口臭"}],"answer":["E"],"multi":false,"explanation":"解説：ケトン体の蓄積による代謝性アシドーシスを呼吸で代償しようとして，深く大きい呼吸（Kussmaul呼吸）が出る．呼気にはアセトンによる果実様の臭いが混じり，著明な脱水を伴う．\n- A：湿った皮膚と細かい振戦は甲状腺機能亢進症．\n- B：腱反射の弛緩相遅延は甲状腺機能低下症．\n- C：赤紫色の皮膚線条はCushing症候群．\n- D：両耳側半盲は下垂体腫瘍．\n- E：ケトアシドーシスを反映し正しい．","images":[],"stem_images":[]},{"number":19,"section":"D-12-S05　14歳男子・急な口渇と体重減少","question":"（3/4）14歳の男子．3週間前から喉が渇いて水を大量に飲み，夜も何度もトイレに起きるという．食べているのに体重が5kg減った．症状は3週間で急速に進んだという．来院時に腹痛と嘔吐があり，意識はやや混濁している．深く速い呼吸と果実様の口臭を認める．血糖482mg/dL，尿ケトン体3+，動脈血pH 7.12であった．治療で最も注意すべき電解質はどれか．","options":[{"letter":"A","text":"カルシウム"},{"letter":"B","text":"カリウム"},{"letter":"C","text":"マグネシウム"},{"letter":"D","text":"リン"},{"letter":"E","text":"塩素"}],"answer":["B"],"multi":false,"explanation":"解説：アシドーシスで細胞外へ出ていたカリウムが，インスリン投与とアシドーシスの補正により急速に細胞内へ戻る．治療前の値が正常でも体内総量は枯渇しており，補充を怠ると致死的な低カリウム血症になる．\n- A：カルシウムの変動はこの病態の主要な問題ではない．\n- B：治療に伴い急変し最も注意を要する．\n- C：マグネシウムも低下しうるが，緊急度はカリウムに劣る．\n- D：リンも低下するが同様に緊急度は低い．\n- E：塩素は補液の組成に応じて変化する程度．","images":[],"stem_images":[]},{"number":20,"section":"D-12-S05　14歳男子・急な口渇と体重減少","question":"（4/4）14歳の男子．3週間前から喉が渇いて水を大量に飲み，夜も何度もトイレに起きるという．食べているのに体重が5kg減った．症状は3週間で急速に進んだという．来院時に腹痛と嘔吐があり，意識はやや混濁している．深く速い呼吸と果実様の口臭を認める．血糖482mg/dL，尿ケトン体3+，動脈血pH 7.12であった．この患者の基礎にある病態はどれか．","options":[{"letter":"A","text":"肝での糖新生が単独で亢進すること"},{"letter":"B","text":"腸管からの糖吸収が亢進すること"},{"letter":"C","text":"自己免疫機序によるβ細胞の破壊"},{"letter":"D","text":"インスリン受容体の後天的な消失"},{"letter":"E","text":"腎での糖再吸収が亢進すること"}],"answer":["C"],"multi":false,"explanation":"解説：膵島に対する自己免疫反応でβ細胞が破壊され，インスリンが絶対的に欠乏する．抗GAD抗体などの膵島関連自己抗体が陽性となり，生涯にわたるインスリン補充が必要になる．\n- A：糖新生の亢進は結果であって一次的な原因ではない．\n- B：腸管からの糖吸収亢進はこの病態の機序ではない．\n- C：この病型の本質で正しい．\n- D：受容体の後天的消失は極めてまれな病態．\n- E：腎での糖再吸収亢進はむしろ血糖を上げる方向だが主因ではない．","images":[],"stem_images":[]},{"number":21,"section":"D-12-S06　58歳男性・健診で血糖高値","question":"（1/4）58歳の男性．健康診断の同一採血で空腹時血糖148mg/dL，HbA1c 7.8%と指摘され来院した．自覚症状はない．身長170cm，体重84kg．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"食事や運動の習慣はどうですか．"},{"letter":"B","text":"ステロイドを使っていますか．"},{"letter":"C","text":"幼少期に中耳炎がありましたか．"},{"letter":"D","text":"家族に糖尿病の人はいますか．"},{"letter":"E","text":"体重はどう変わりましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．小児期の中耳炎は現在の高血糖の原因検索では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：生活習慣と治療方針を評価．\n- B：薬剤性高血糖を検討．\n- C：小児期の中耳炎は現在の高血糖の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：遺伝的背景を確認．\n- E：肥満や急な体重減少を評価．","images":[],"stem_images":[]},{"number":22,"section":"D-12-S06　58歳男性・健診で血糖高値","question":"（2/4）58歳の男性．健康診断の同一採血で空腹時血糖148mg/dL，HbA1c 7.8%と指摘され来院した．自覚症状はない．身長170cm，体重84kg．父と姉が糖尿病で治療中だという．この検査結果の解釈として正しいのはどれか．","options":[{"letter":"A","text":"同一採血の両値で糖尿病と診断できる"},{"letter":"B","text":"尿糖陽性が診断の必須条件である"},{"letter":"C","text":"自覚症状がないため診断できない"},{"letter":"D","text":"別日の再検査を行うまで診断できない"},{"letter":"E","text":"家族歴だけで糖尿病と診断できる"}],"answer":["A"],"multi":false,"explanation":"解説：同一採血で空腹時血糖126mg/dL以上とHbA1c 6.5%以上を満たしており，この時点で糖尿病と診断できる．無症状でも再検査は診断の必須条件ではない．\n- A：血糖とHbA1cの両方が糖尿病型であり正しい．\n- B：尿糖は診断の必須条件ではない．\n- C：同一採血で両基準を満たせば無症状でも診断できる．\n- D：本例は既に両基準を満たしており，再検査を必須としない．\n- E：家族歴は危険因子で，単独の診断根拠ではない．","images":[],"stem_images":[]},{"number":23,"section":"D-12-S06　58歳男性・健診で血糖高値","question":"（3/4）58歳の男性．健康診断の同一採血で空腹時血糖148mg/dL，HbA1c 7.8%と指摘され来院した．自覚症状はない．身長170cm，体重84kg．父と姉が糖尿病で治療中だという．再検査でも空腹時血糖152mg/dL，HbA1c 7.9%であった．ケトン体は陰性で膵島関連自己抗体も陰性である．薬物療法の有無にかかわらず治療の基礎となるのはどれか．","options":[{"letter":"A","text":"直ちにインスリン頻回注射を導入"},{"letter":"B","text":"副腎皮質ステロイドの内服を開始"},{"letter":"C","text":"食事療法と運動療法を開始する"},{"letter":"D","text":"抗甲状腺薬の内服を開始する"},{"letter":"E","text":"抗菌薬の長期予防的な投与"}],"answer":["C"],"multi":false,"explanation":"解説：食事と運動による体重・生活習慣の改善は治療の基礎である．薬物療法の開始時期は血糖値，合併症，個別の目標などで判断し，一律に数か月待つ必要はない．\n- A：ケトーシスもなく，直ちにインスリンを要する状態ではない．\n- B：ステロイドは血糖をむしろ上げる．\n- C：治療の基礎として正しい．\n- D：抗甲状腺薬は甲状腺機能亢進症の治療．\n- E：抗菌薬は感染症の治療．","images":[],"stem_images":[]},{"number":24,"section":"D-12-S06　58歳男性・健診で血糖高値","question":"（4/4）58歳の男性．健康診断の同一採血で空腹時血糖148mg/dL，HbA1c 7.8%と指摘され来院した．自覚症状はない．身長170cm，体重84kg．父と姉が糖尿病で治療中だという．再検査でも空腹時血糖152mg/dL，HbA1c 7.9%であった．ケトン体は陰性で膵島関連自己抗体も陰性である．3か月の食事運動療法でHbA1cは7.4%にとどまった．次に加える薬剤として一般的なのはどれか．","options":[{"letter":"A","text":"抗甲状腺薬の内服"},{"letter":"B","text":"メトホルミンの内服"},{"letter":"C","text":"副腎皮質ステロイドの内服"},{"letter":"D","text":"甲状腺ホルモンの補充"},{"letter":"E","text":"抗ヒスタミン薬の内服"}],"answer":["B"],"multi":false,"explanation":"解説：肝での糖新生を抑えインスリン抵抗性を改善する薬剤で，体重を増やさず低血糖も起こしにくい．腎機能低下例や造影剤使用時の乳酸アシドーシスに注意しながら用いる．\n- A：抗甲状腺薬は甲状腺機能亢進症の治療．\n- B：この病型の基本薬として正しい．\n- C：ステロイドは血糖を悪化させる．\n- D：甲状腺ホルモンの補充は機能低下症の治療．\n- E：抗ヒスタミン薬はアレルギー疾患の治療．","images":[],"stem_images":[]},{"number":25,"section":"D-12-S07　76歳男性・意識の混濁と著明な脱水","question":"（1/4）76歳の男性．3日前から発熱と食欲低下があり，本日は反応が鈍く自力で座れないという．2型糖尿病で通院中である．脱水の進行を把握するため，家族に尋ねる質問はどれか．","options":[{"letter":"A","text":"普段の血糖値はどのくらいですか．"},{"letter":"B","text":"咳や排尿痛がありますか．"},{"letter":"C","text":"この3日でどれだけ飲めましたか．"},{"letter":"D","text":"最後に薬を飲んだのはいつですか．"},{"letter":"E","text":"最近，胸痛はありましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：高血糖による浸透圧利尿で大量の水が失われるが，高齢者は口渇を感じにくく自分で水を飲めないため脱水が極端に進む．飲水量の把握が病態の重症度と補液量の見積もりを決める．\n- A：糖尿病の管理状態に関する情報．\n- B：感染の誘因に関する情報．\n- C：脱水の程度を推し量れ有用．\n- D：治療中断に関する情報．\n- E：心血管イベントに関する情報．","images":[],"stem_images":[]},{"number":26,"section":"D-12-S07　76歳男性・意識の混濁と著明な脱水","question":"（2/4）76歳の男性．3日前から発熱と食欲低下があり，本日は反応が鈍く自力で座れないという．2型糖尿病で通院中である．この3日はほとんど水を飲めていないという．血糖780mg/dL，尿ケトン体±，動脈血pH 7.36であった．この病態はどれか．","options":[{"letter":"A","text":"ケトアシドーシスが進行した状態"},{"letter":"B","text":"低血糖による中枢神経症状"},{"letter":"C","text":"乳酸アシドーシスをきたした状態"},{"letter":"D","text":"著明な高浸透圧による意識障害"},{"letter":"E","text":"高カリウム血症による意識障害"}],"answer":["D"],"multi":false,"explanation":"解説：インスリンの作用がわずかに残っているため脂肪分解が強く進まず，ケトーシスとアシドーシスは軽い．一方で血糖が著しく高く血漿浸透圧が上がり，脳細胞の脱水により意識障害をきたす．\n- A：pHが保たれケトン体も軽度で，ケトアシドーシスとは言えない．\n- B：血糖が著明に高く低血糖ではない．\n- C：乳酸アシドーシスではpHが低下する．\n- D：所見の組合せに合致し正しい．\n- E：カリウム異常だけでこの病像は説明できない．","images":[],"stem_images":[]},{"number":27,"section":"D-12-S07　76歳男性・意識の混濁と著明な脱水","question":"（3/4）76歳の男性．3日前から発熱と食欲低下があり，本日は反応が鈍く自力で座れないという．2型糖尿病で通院中である．この3日はほとんど水を飲めていないという．血糖780mg/dL，尿ケトン体±，動脈血pH 7.36であった．血清ナトリウム152mEq/L，血漿浸透圧352mOsm/kgである．補液の際に注意すべきなのはどれか．","options":[{"letter":"A","text":"血糖を1時間以内に正常化させる"},{"letter":"B","text":"補液は行わず経過を観察する"},{"letter":"C","text":"高張食塩水を急速に投与する"},{"letter":"D","text":"水分摂取を厳しく制限する"},{"letter":"E","text":"血漿浸透圧を急に下げすぎない"}],"answer":["E"],"multi":false,"explanation":"解説：高浸透圧に適応している脳細胞に低張液を急速に入れると，水が細胞内へ移動して脳浮腫を起こす．生理食塩水から始めて浸透圧をゆるやかに下げ，血糖の低下速度も緩やかに保つ．\n- A：急速な血糖低下は浸透圧の急変を招き危険．\n- B：著明な脱水があり補液は必須．\n- C：既に高ナトリウム血症であり高張液は禁忌．\n- D：水分制限は脱水を悪化させる．\n- E：脳浮腫の予防として正しい．","images":[],"stem_images":[]},{"number":28,"section":"D-12-S07　76歳男性・意識の混濁と著明な脱水","question":"（4/4）76歳の男性．3日前から発熱と食欲低下があり，本日は反応が鈍く自力で座れないという．2型糖尿病で通院中である．この3日はほとんど水を飲めていないという．血糖780mg/dL，尿ケトン体±，動脈血pH 7.36であった．血清ナトリウム152mEq/L，血漿浸透圧352mOsm/kgである．補液とインスリンを開始した．同時に必ず行うべきなのはどれか．","options":[{"letter":"A","text":"誘因となった感染症の検索と治療"},{"letter":"B","text":"抗甲状腺薬の投与を開始する"},{"letter":"C","text":"副腎皮質ステロイドの大量投与"},{"letter":"D","text":"抗ヒスタミン薬の連日投与"},{"letter":"E","text":"骨密度の測定と骨粗鬆症治療"}],"answer":["A"],"multi":false,"explanation":"解説：肺炎や尿路感染などの感染症が発症の引き金になっていることが多く，それを制御しないと高血糖が改善しない．脳血管障害，心筋梗塞，薬剤（ステロイド・利尿薬）の関与も併せて探す．\n- A：誘因の除去が病態の改善に不可欠で正しい．\n- B：抗甲状腺薬は甲状腺機能亢進症の治療．\n- C：ステロイドは血糖をさらに上げる．\n- D：抗ヒスタミン薬はアレルギー疾患の治療．\n- E：骨密度の評価は急性期の課題ではない．","images":[],"stem_images":[]},{"number":29,"section":"D-12-S08　64歳男性・糖尿病の合併症検索","question":"（1/4）64歳の男性．18年前から2型糖尿病で通院している．HbA1cは8%台で推移してきた．合併症の評価のために受診した．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"泡立つ尿やむくみはありますか．"},{"letter":"B","text":"幼少期に乗り物酔いをしましたか．"},{"letter":"C","text":"足のしびれや感覚低下はありますか．"},{"letter":"D","text":"歩くと胸や脚が痛みますか．"},{"letter":"E","text":"眼底検査を受けていますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．小児期の乗り物酔いは糖尿病合併症の評価では優先度が低い．\n- A：腎障害を疑う症状を確認．\n- B：小児期の乗り物酔いは糖尿病合併症の評価では優先度が低い．この設問で選ぶ肢．\n- C：末梢神経障害を確認．\n- D：大血管障害を疑う症状を確認．\n- E：網膜症の評価歴を確認．","images":[],"stem_images":[]},{"number":30,"section":"D-12-S08　64歳男性・糖尿病の合併症検索","question":"（2/4）64歳の男性．18年前から2型糖尿病で通院している．HbA1cは8%台で推移してきた．合併症の評価のために受診した．両足趾の先がしびれ，砂の上を歩く感じがするという．感覚障害の分布として予想されるのはどれか．","options":[{"letter":"A","text":"一側の上下肢に限局する"},{"letter":"B","text":"顔面の片側に限局する"},{"letter":"C","text":"帯状に一つの皮膚分節に限局"},{"letter":"D","text":"体幹の一定の高さから下に及ぶ"},{"letter":"E","text":"両足趾から左右対称に上行する"}],"answer":["E"],"multi":false,"explanation":"解説：軸索の長い神経から障害されるため，最も遠位の足趾から始まり対称性に上行する．下腿まで及ぶ頃に指先にも出て，手袋靴下型の分布をとる．これが長さ依存性の多発ニューロパチーの特徴である．\n- A：一側の上下肢の障害は脳血管障害．\n- B：顔面片側の感覚障害は三叉神経の病変．\n- C：一つの皮膚分節に限局するのは神経根や帯状疱疹．\n- D：一定の高さから下の障害は脊髄病変．\n- E：長さ依存性の分布として正しい．","images":[],"stem_images":[]},{"number":31,"section":"D-12-S08　64歳男性・糖尿病の合併症検索","question":"（3/4）64歳の男性．18年前から2型糖尿病で通院している．HbA1cは8%台で推移してきた．合併症の評価のために受診した．両足趾の先がしびれ，砂の上を歩く感じがするという．両側のアキレス腱反射は消失し，振動覚も低下している．自覚症状がなくても定期的に行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"散瞳下の眼底検査の施行"}],"answer":["E"],"multi":false,"explanation":"解説：網膜症は増殖期に至るまでほとんど自覚症状がなく，気づいたときには硝子体出血や牽引性網膜剝離で視力を失っていることがある．無症状のうちに定期的な眼底検査で拾い上げる必要がある．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査で，合併はするが三大合併症ではない．\n- D：内視鏡は消化管疾患の評価．\n- E：無症候性の進行を捉え正しい．","images":[],"stem_images":[]},{"number":32,"section":"D-12-S08　64歳男性・糖尿病の合併症検索","question":"（4/4）64歳の男性．18年前から2型糖尿病で通院している．HbA1cは8%台で推移してきた．合併症の評価のために受診した．両足趾の先がしびれ，砂の上を歩く感じがするという．両側のアキレス腱反射は消失し，振動覚も低下している．眼底検査で新生血管を認め，尿中アルブミンは380mg/gCrであった．これら三つの合併症に共通する基盤はどれか．","options":[{"letter":"A","text":"大血管の粥状硬化の進行"},{"letter":"B","text":"自己抗体による組織の破壊"},{"letter":"C","text":"高血糖による細小血管の障害"},{"letter":"D","text":"血管の炎症性の壁在浸潤"},{"letter":"E","text":"脂質の血管内膜への沈着"}],"answer":["C"],"multi":false,"explanation":"解説：持続する高血糖がポリオール経路の亢進や終末糖化産物の蓄積を介して毛細血管の基底膜を肥厚させ，内皮を傷害する．網膜・腎糸球体・末梢神経の栄養血管が同じ機序で侵される．\n- A：大血管障害は心筋梗塞や脳梗塞，末梢動脈疾患の基盤で，三大合併症とは別枠．\n- B：自己抗体による破壊は1型糖尿病の発症機序．\n- C：三大合併症に共通する基盤で正しい．\n- D：血管壁への炎症細胞浸潤は血管炎の機序．\n- E：内膜への脂質沈着は動脈硬化の機序．","images":[],"stem_images":[]},{"number":33,"section":"D-12-S09　54歳男性・足趾の激痛と健診異常","question":"（1/4）54歳の男性．昨夜から右足の親指の付け根が激しく痛む．健診でLDLコレステロール186mg/dL，尿酸9.2mg/dLと指摘されていた．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"発熱や足の傷はありますか．"},{"letter":"B","text":"最近の飲酒量は増えましたか．"},{"letter":"C","text":"同じ痛みを繰り返していますか．"},{"letter":"D","text":"以前からいびきをかきますか．"},{"letter":"E","text":"尿酸の薬を開始・変更しましたか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性いびきは今回の急性関節痛の鑑別では優先度が低い．\n- A：感染性関節炎との鑑別に有用．\n- B：発作の誘因を確認．\n- C：反復性の結晶誘発性関節炎を検討．\n- D：慢性いびきは今回の急性関節痛の鑑別では優先度が低い．この設問で選ぶ肢．\n- E：尿酸変動に伴う発作を検討．","images":[],"stem_images":[]},{"number":34,"section":"D-12-S09　54歳男性・足趾の激痛と健診異常","question":"（2/4）54歳の男性．昨夜から右足の親指の付け根が激しく痛む．健診でLDLコレステロール186mg/dL，尿酸9.2mg/dLと指摘されていた．尿酸の薬はまだ飲んでいないという．発作時の治療として適切なのはどれか．","options":[{"letter":"A","text":"直ちに尿酸降下薬を開始する"},{"letter":"B","text":"抗菌薬の全身投与を開始する"},{"letter":"C","text":"非ステロイド性抗炎症薬を用いる"},{"letter":"D","text":"甲状腺ホルモンの補充を行う"},{"letter":"E","text":"抗ヒスタミン薬を連日内服する"}],"answer":["C"],"multi":false,"explanation":"解説：発作時はまず炎症を抑える．非ステロイド性抗炎症薬，コルヒチン，副腎皮質ステロイドのいずれかを選ぶ．尿酸降下薬は発作が落ち着いてから，少量から慎重に開始する．\n- A：発作中の新規開始は症状を悪化させる．\n- B：抗菌薬は感染性関節炎の治療．\n- C：発作時の標準治療で正しい．\n- D：甲状腺ホルモンの補充は機能低下症の治療．\n- E：抗ヒスタミン薬はアレルギー疾患の治療．","images":[],"stem_images":[]},{"number":35,"section":"D-12-S09　54歳男性・足趾の激痛と健診異常","question":"（3/4）54歳の男性．昨夜から右足の親指の付け根が激しく痛む．健診でLDLコレステロール186mg/dL，尿酸9.2mg/dLと指摘されていた．尿酸の薬はまだ飲んでいないという．非ステロイド性抗炎症薬で疼痛は軽快した．アキレス腱が両側とも肥厚し，肘の伸側に黄色の結節を認める．考えるべき病態はどれか．","options":[{"letter":"A","text":"二次性の高コレステロール血症"},{"letter":"B","text":"甲状腺機能低下に伴う脂質異常"},{"letter":"C","text":"ネフローゼ症候群による脂質異常"},{"letter":"D","text":"薬剤性の脂質異常症"},{"letter":"E","text":"家族性高コレステロール血症"}],"answer":["E"],"multi":false,"explanation":"解説：腱黄色腫とアキレス腱の肥厚，高LDL血症，若年発症の冠動脈疾患の家族歴が三徴である．LDL受容体の機能異常により幼少期から高LDLが続き，早発性の動脈硬化をきたす．\n- A：二次性では腱黄色腫はまれである．\n- B：甲状腺機能低下症でもLDLは上がるが，腱黄色腫は特徴的でない．\n- C：ネフローゼでも脂質異常は出るが，蛋白尿と低アルブミン血症を伴う．\n- D：薬剤性でも腱黄色腫は形成されない．\n- E：腱黄色腫という所見に合致し正しい．","images":[],"stem_images":[]},{"number":36,"section":"D-12-S09　54歳男性・足趾の激痛と健診異常","question":"（4/4）54歳の男性．昨夜から右足の親指の付け根が激しく痛む．健診でLDLコレステロール186mg/dL，尿酸9.2mg/dLと指摘されていた．尿酸の薬はまだ飲んでいないという．非ステロイド性抗炎症薬で疼痛は軽快した．アキレス腱が両側とも肥厚し，肘の伸側に黄色の結節を認める．父は48歳で心筋梗塞を起こしたという．併せて行うべき対応はどれか．","options":[{"letter":"A","text":"血縁者にも脂質の検査を勧める"},{"letter":"B","text":"水分摂取を1日500mLに制限する"},{"letter":"C","text":"抗菌薬を長期に予防投与する"},{"letter":"D","text":"副腎皮質ステロイドを連日内服"},{"letter":"E","text":"直射日光をまったく避けさせる"}],"answer":["A"],"multi":false,"explanation":"解説：常染色体顕性遺伝であり，血縁者の半数が同じ状態にある．家族を調べて早期に治療を始めることで，若年での心血管イベントを防げる．本人にはスタチンによる強力なLDL低下を行う．\n- A：家族への介入につながり正しい．\n- B：水分制限はむしろ尿酸の排泄に不利．\n- C：抗菌薬は感染症の治療．\n- D：ステロイドの連日内服は脂質と血糖を悪化させる．\n- E：日光の回避はこの病態と無関係．","images":[],"stem_images":[]},{"number":37,"section":"D-12-S10　46歳女性・治療抵抗性の高血圧と低カリウム","question":"（1/4）46歳の女性．3年前から高血圧で治療中だが，3剤を用いても血圧が下がらないという．健診で血清カリウム3.0mEq/Lと指摘された．薬剤による低カリウム血症や血圧上昇を検討する質問はどれか．","options":[{"letter":"A","text":"塩辛い物をよく食べますか．"},{"letter":"B","text":"夜にいびきをかきますか．"},{"letter":"C","text":"家族にも高血圧がありますか．"},{"letter":"D","text":"発作的に動悸や発汗がありますか．"},{"letter":"E","text":"利尿薬や甘草を使っていませんか．"}],"answer":["E"],"multi":false,"explanation":"解説：サイアザイド系利尿薬は低カリウム血症の最も多い薬剤性の原因であり，甘草を含む漢方薬も偽性アルドステロン症を起こす．これらを除外しないと内分泌検査の結果が正しく解釈できない．\n- A：塩分摂取に関する情報．\n- B：睡眠時無呼吸に関する情報．\n- C：家族歴に関する情報．\n- D：カテコラミン過剰に関する情報．\n- E：検査の解釈を左右し有用．","images":[],"stem_images":[]},{"number":38,"section":"D-12-S10　46歳女性・治療抵抗性の高血圧と低カリウム","question":"（2/4）46歳の女性．3年前から高血圧で治療中だが，3剤を用いても血圧が下がらないという．健診で血清カリウム3.0mEq/Lと指摘された．利尿薬も甘草を含む薬も使っていないという．次に行うべき検査はどれか．","options":[{"letter":"A","text":"デキサメタゾン抑制試験の施行"},{"letter":"B","text":"75g経口ブドウ糖負荷試験"},{"letter":"C","text":"アルドステロン・レニン活性比"},{"letter":"D","text":"TSH受容体抗体の測定"},{"letter":"E","text":"抗GAD抗体の測定"}],"answer":["C"],"multi":false,"explanation":"解説：アルドステロンが自律的に過剰分泌されるとナトリウムが貯留して血圧が上がり，カリウムが尿へ捨てられる．レニンは負のフィードバックで抑制されるため，この比が高値になる．\n- A：デキサメタゾン抑制試験はCushing症候群の検査．\n- B：ブドウ糖負荷試験は糖代謝と成長ホルモンの評価．\n- C：この病態のスクリーニングとして正しい．\n- D：TSH受容体抗体はBasedow病．\n- E：抗GAD抗体は1型糖尿病．","images":[],"stem_images":[]},{"number":39,"section":"D-12-S10　46歳女性・治療抵抗性の高血圧と低カリウム","question":"（3/4）46歳の女性．3年前から高血圧で治療中だが，3剤を用いても血圧が下がらないという．健診で血清カリウム3.0mEq/Lと指摘された．利尿薬も甘草を含む薬も使っていないという．アルドステロン・レニン活性比が高値で，負荷試験でも抑制されなかった．副腎CTで左副腎に15mmの腫瘤を認めた．手術適応の判断に必要な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"副腎静脈サンプリング"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：画像で見える腫瘤が機能しているとは限らず，対側の過形成が原因のこともある．左右の副腎静脈から採血してアルドステロンの分泌を比較し，片側性なら摘出，両側性なら薬物療法を選ぶ．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：病側の決定に不可欠で正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":40,"section":"D-12-S10　46歳女性・治療抵抗性の高血圧と低カリウム","question":"（4/4）46歳の女性．3年前から高血圧で治療中だが，3剤を用いても血圧が下がらないという．健診で血清カリウム3.0mEq/Lと指摘された．利尿薬も甘草を含む薬も使っていないという．アルドステロン・レニン活性比が高値で，負荷試験でも抑制されなかった．副腎CTで左副腎に15mmの腫瘤を認めた．副腎静脈サンプリングで両側性と判明した場合の治療はどれか．","options":[{"letter":"A","text":"左副腎を摘出する"},{"letter":"B","text":"両側の副腎を摘出する"},{"letter":"C","text":"ミネラルコルチコイド受容体拮抗薬"},{"letter":"D","text":"抗甲状腺薬の内服を開始する"},{"letter":"E","text":"副腎皮質ステロイドの補充"}],"answer":["C"],"multi":false,"explanation":"解説：両側性では手術の適応がなく，スピロノラクトンやエプレレノンでアルドステロンの作用を受容体で遮断する．血圧とカリウムの両方が改善し，臓器障害の進行も抑えられる．\n- A：両側性であれば片側摘出では改善しない．\n- B：両側副腎摘出は副腎不全を招き，生涯のホルモン補充が必要になる．\n- C：両側性に対する標準治療で正しい．\n- D：抗甲状腺薬は甲状腺機能亢進症の治療．\n- E：ステロイドの補充は副腎不全の治療で，本例とは逆．","images":[],"stem_images":[]},{"number":41,"section":"D-12-S11　38歳男性・発作性の頭痛と動悸","question":"（1/4）38歳の男性．半年前から突然の激しい頭痛と動悸，大量の発汗が起こり，20分ほどで治まることを繰り返すという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"発作中の血圧はどうですか．"},{"letter":"B","text":"家族に内分泌の腫瘍はありますか．"},{"letter":"C","text":"排便で肛門が痛みますか．"},{"letter":"D","text":"空腹時に症状が出ますか．"},{"letter":"E","text":"薬やサプリを使っていますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．肛門局所症状は発作性の頭痛・動悸の原因検索では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：血圧と症状の関連を確認．\n- B：遺伝性腫瘍の背景を確認．\n- C：肛門局所症状は発作性の頭痛・動悸の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：低血糖発作との鑑別に有用．\n- E：交感神経刺激物などの関与を確認．","images":[],"stem_images":[]},{"number":42,"section":"D-12-S11　38歳男性・発作性の頭痛と動悸","question":"（2/4）38歳の男性．半年前から突然の激しい頭痛と動悸，大量の発汗が起こり，20分ほどで治まることを繰り返すという．発作時に家庭血圧計で210/120mmHgを記録したことがあるという．診断のために測定すべきなのはどれか．","options":[{"letter":"A","text":"アルドステロン・レニン活性比"},{"letter":"B","text":"デキサメタゾン抑制試験の結果"},{"letter":"C","text":"TSH受容体抗体の値"},{"letter":"D","text":"血漿と尿中のメタネフリン分画"},{"letter":"E","text":"抗GAD抗体の値"}],"answer":["D"],"multi":false,"explanation":"解説：カテコラミンそのものは半減期が短く変動が大きいため，代謝産物であるメタネフリンとノルメタネフリンを測るほうが感度と特異度が高い．24時間蓄尿での測定も用いられる．\n- A：アルドステロン・レニン活性比は原発性アルドステロン症．\n- B：デキサメタゾン抑制試験はCushing症候群．\n- C：TSH受容体抗体はBasedow病．\n- D：この疾患の診断に最も適し正しい．\n- E：抗GAD抗体は1型糖尿病．","images":[],"stem_images":[]},{"number":43,"section":"D-12-S11　38歳男性・発作性の頭痛と動悸","question":"（3/4）38歳の男性．半年前から突然の激しい頭痛と動悸，大量の発汗が起こり，20分ほどで治まることを繰り返すという．発作時に家庭血圧計で210/120mmHgを記録したことがあるという．血漿メタネフリンとノルメタネフリンがともに著明高値であった．腫瘍の局在を確かめる検査はどれか．","options":[{"letter":"A","text":"睡眠ポリグラフィの施行"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"上部消化管内視鏡の施行"},{"letter":"D","text":"骨密度の測定の実施"},{"letter":"E","text":"腹部CTとMIBGシンチグラフィ"}],"answer":["E"],"multi":false,"explanation":"解説：多くは副腎髄質に発生するが，傍神経節などの副腎外に生じることもある．CTやMRIで形態を見たうえで，カテコラミン産生組織に集積するMIBGシンチグラフィで機能的な局在と多発の有無を確かめる．\n- A：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- B：呼吸機能検査は換気障害の評価．\n- C：内視鏡は消化管疾患の評価．\n- D：骨密度は骨粗鬆症の評価．\n- E：形態と機能の両面から局在を決め正しい．","images":[],"stem_images":[]},{"number":44,"section":"D-12-S11　38歳男性・発作性の頭痛と動悸","question":"（4/4）38歳の男性．半年前から突然の激しい頭痛と動悸，大量の発汗が起こり，20分ほどで治まることを繰り返すという．発作時に家庭血圧計で210/120mmHgを記録したことがあるという．血漿メタネフリンとノルメタネフリンがともに著明高値であった．腹部CTで右副腎に4cmの腫瘤を認め，手術が決まった．術前の薬物療法で正しいのはどれか．","options":[{"letter":"A","text":"β遮断薬を先に十分量投与する"},{"letter":"B","text":"降圧薬は使わず手術に臨む"},{"letter":"C","text":"利尿薬のみで血圧を管理する"},{"letter":"D","text":"α遮断薬を先に開始し十分に準備"},{"letter":"E","text":"副腎皮質ステロイドを先に投与"}],"answer":["D"],"multi":false,"explanation":"解説：α遮断薬で血管を拡張させ，縮小していた循環血漿量を戻してから，頻脈が問題になればβ遮断薬を加える．順序を逆にするとα作用が相対的に強まり，血圧が危険なほど上昇する．\n- A：β遮断薬を先に使うと血管収縮が優位となり高血圧クリーゼを招く．\n- B：無準備の手術は術中の血圧急変で致命的になりうる．\n- C：利尿薬は循環血漿量をさらに減らし危険．\n- D：術前準備の原則として正しい．\n- E：ステロイドの先行投与はこの疾患の準備にならない．","images":[],"stem_images":[]}],"seed":null},{"id":"D-13_眼視覚系","name":"D-13_眼視覚系.md","label":"D-13 眼視覚系","count":20,"sourceHash":"2c479470018e","questions":[{"number":1,"section":"D-13-S01　14歳男子・黒板が見えにくい","question":"（1/4）14歳の男子．半年前から教室の後ろの席だと黒板の字が読めないという．目を細めると少し見えるようになる．遠見と近見の視力の違いを確認する質問はどれか．","options":[{"letter":"A","text":"手元の本は問題なく読めますか．"},{"letter":"B","text":"片眼ずつで見え方が違いますか．"},{"letter":"C","text":"物が二重に見えますか．"},{"letter":"D","text":"夕方になると疲れますか．"},{"letter":"E","text":"家族にも眼鏡の人がいますか．"}],"answer":["A"],"multi":false,"explanation":"解説：遠くが見えず近くが見えるなら屈折の異常を，遠近ともに見えないなら中間透光体や網膜・視神経の病変を考える．遠見と近見の差を確かめることが，屈折異常とそれ以外を分ける第一歩になる．\n- A：病態の座を絞れ有用．\n- B：左右差に関する情報．\n- C：複視に関する情報．\n- D：眼精疲労に関する情報．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-13-S01　14歳男子・黒板が見えにくい","question":"（2/4）14歳の男子．半年前から教室の後ろの席だと黒板の字が読めないという．目を細めると少し見えるようになる．手元の教科書は問題なく読めるという．行うべき検査はどれか．","options":[{"letter":"A","text":"隅角検査による隅角の評価"},{"letter":"B","text":"散瞳下での眼底の精査"},{"letter":"C","text":"涙液分泌量の測定"},{"letter":"D","text":"屈折検査と矯正視力の測定"},{"letter":"E","text":"眼球突出度の測定"}],"answer":["D"],"multi":false,"explanation":"解説：裸眼視力だけでは病態が分からない．レンズで矯正して視力が出れば屈折異常と確定でき，矯正しても視力が出なければ中間透光体や網膜・視神経の病変を疑って精査に進む．\n- A：隅角検査は緑内障の病型分類．\n- B：散瞳下眼底検査は網膜病変の評価で，矯正視力の確認が先．\n- C：涙液分泌量の測定はドライアイの評価．\n- D：屈折異常の確認に直結し正しい．\n- E：眼球突出度の測定は甲状腺眼症の評価．","images":[],"stem_images":[]},{"number":3,"section":"D-13-S01　14歳男子・黒板が見えにくい","question":"（3/4）14歳の男子．半年前から教室の後ろの席だと黒板の字が読めないという．目を細めると少し見えるようになる．手元の教科書は問題なく読めるという．屈折検査を行ったところ，凹レンズによる矯正で両眼とも視力1.2が得られた．この状態はどれか．","options":[{"letter":"A","text":"水晶体の調節力が落ちている"},{"letter":"B","text":"角膜の表面が不規則になっている"},{"letter":"C","text":"網膜の後方で像を結んでいる"},{"letter":"D","text":"硝子体が混濁している"},{"letter":"E","text":"網膜の前方で像を結んでいる"}],"answer":["E"],"multi":false,"explanation":"解説：眼軸が長いか屈折力が強すぎると，平行光線が網膜より手前で焦点を結ぶ．凹レンズで光を発散させると焦点が後方へ移り網膜上で結像する．学童期に眼軸の伸長とともに進行する．\n- A：調節力の低下は老視で，中高年に起こる．\n- B：角膜表面の不整は不正乱視．\n- C：網膜の後方で結像するのは遠視で，凸レンズで矯正する．\n- D：硝子体混濁では矯正しても視力が出ない．\n- E：凹レンズで矯正できることと合致し正しい．","images":[],"stem_images":[]},{"number":4,"section":"D-13-S01　14歳男子・黒板が見えにくい","question":"（4/4）14歳の男子．半年前から教室の後ろの席だと黒板の字が読めないという．目を細めると少し見えるようになる．手元の教科書は問題なく読めるという．屈折検査を行ったところ，凹レンズによる矯正で両眼とも視力1.2が得られた．眼底にも異常はなかった．逆に網膜の後方で結像する状態の小児で問題になるのはどれか．","options":[{"letter":"A","text":"調節性の内斜視をきたすこと"},{"letter":"B","text":"網膜が剝がれやすくなること"},{"letter":"C","text":"眼圧が急激に上がること"},{"letter":"D","text":"角膜が円錐状に突出すること"},{"letter":"E","text":"水晶体が脱臼しやすくなること"}],"answer":["A"],"multi":false,"explanation":"解説：遠視では網膜上に像を結ぶため常に調節を働かせる必要があり，調節に伴う輻湊が過剰になって内斜視をきたす．適切な凸レンズ眼鏡で調節の負担を減らすと斜視も改善する．\n- A：遠視に伴う代表的な問題で正しい．\n- B：網膜剝離の危険が高いのは強度近視．\n- C：眼圧の急上昇は閉塞隅角緑内障の発作．\n- D：角膜の円錐状突出は円錐角膜．\n- E：水晶体の脱臼はMarfan症候群などでみられる．","images":[],"stem_images":[]},{"number":5,"section":"D-13-S02　22歳男性・両眼の充血と眼脂","question":"（1/4）22歳の男性．3日前から右眼が赤くなり，涙とめやにが出るという．本日は左眼にも同じ症状が出た．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"眼痛や視力低下はありますか．"},{"letter":"B","text":"家族に老眼の人はいますか．"},{"letter":"C","text":"周囲に同じ症状の人はいますか．"},{"letter":"D","text":"コンタクトレンズを使いますか．"},{"letter":"E","text":"強いかゆみがありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．家族の老眼は急な充血と眼脂の原因検索では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：角膜炎などの警告徴候を確認．\n- B：家族の老眼は急な充血と眼脂の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：感染への曝露を確認．\n- D：角膜感染の危険因子を確認．\n- E：アレルギー性病変を検討．","images":[],"stem_images":[]},{"number":6,"section":"D-13-S02　22歳男性・両眼の充血と眼脂","question":"（2/4）22歳の男性．3日前から右眼が赤くなり，涙とめやにが出るという．本日は左眼にも同じ症状が出た．同じ職場で数人が同様の症状だという．認められる所見はどれか．","options":[{"letter":"A","text":"眼脂が黄色く膿性で量が多い"},{"letter":"B","text":"眼圧が著明に上昇している"},{"letter":"C","text":"耳前リンパ節の腫脹と圧痛"},{"letter":"D","text":"水晶体が全体に白く混濁する"},{"letter":"E","text":"角膜が円錐状に突出している"}],"answer":["C"],"multi":false,"explanation":"解説：ウイルスが所属リンパ節に達するため耳の前のリンパ節が腫れて圧痛を伴う．結膜の濾胞形成と漿液性の眼脂，強い充血とともに，細菌性やアレルギー性との鑑別点になる．\n- A：膿性で多量の眼脂は細菌性結膜炎．\n- B：眼圧の著明な上昇は緑内障発作．\n- C：ウイルス性を示唆し正しい．\n- D：水晶体の白色混濁は白内障．\n- E：角膜の円錐状突出は円錐角膜．","images":[],"stem_images":[]},{"number":7,"section":"D-13-S02　22歳男性・両眼の充血と眼脂","question":"（3/4）22歳の男性．3日前から右眼が赤くなり，涙とめやにが出るという．本日は左眼にも同じ症状が出た．同じ職場で数人が同様の症状だという．耳前リンパ節の腫脹と圧痛を認め，結膜に濾胞形成がある．最も重要な指導はどれか．","options":[{"letter":"A","text":"眼帯を常時着けて過ごすこと"},{"letter":"B","text":"抗菌薬の点眼を長期に続けること"},{"letter":"C","text":"温罨法を1日に何度も行うこと"},{"letter":"D","text":"手指衛生とタオルを共用しないこと"},{"letter":"E","text":"コンタクトレンズをすぐ再開すること"}],"answer":["D"],"multi":false,"explanation":"解説：接触感染で広がり感染力が非常に強い．手洗いの徹底，タオル・洗面用具の専用化，眼を触らないこと，学校保健安全法に基づく出席停止，医療機関での器具の消毒が対策の柱になる．\n- A：眼帯は分泌物がこもり症状を悪化させうる．\n- B：抗菌薬はウイルスに無効で，二次感染の予防に限って用いる．\n- C：温罨法は麦粒腫や霰粒腫の対応．\n- D：拡大防止に直結し正しい．\n- E：コンタクトレンズは治癒まで中止する．","images":[],"stem_images":[]},{"number":8,"section":"D-13-S02　22歳男性・両眼の充血と眼脂","question":"（4/4）22歳の男性．3日前から右眼が赤くなり，涙とめやにが出るという．本日は左眼にも同じ症状が出た．同じ職場で数人が同様の症状だという．耳前リンパ節の腫脹と圧痛を認め，結膜に濾胞形成がある．手指衛生とタオルの専用化を指導した．発症から2週後に視力低下とまぶしさを訴えた場合に考えるべきなのはどれか．","options":[{"letter":"A","text":"水晶体が急速に混濁したこと"},{"letter":"B","text":"角膜に点状の混濁が生じたこと"},{"letter":"C","text":"網膜中心動脈が閉塞したこと"},{"letter":"D","text":"視神経に炎症が起きたこと"},{"letter":"E","text":"硝子体に出血が生じたこと"}],"answer":["B"],"multi":false,"explanation":"解説：結膜炎の消退期に角膜上皮下へ細胞浸潤が起こり，点状の混濁が残って霧視と羞明をきたす．数か月続くことがあり，程度によっては副腎皮質ステロイドの点眼を用いる．\n- A：水晶体の急速な混濁はこの経過では起こらない．\n- B：この疾患の代表的な合併症で正しい．\n- C：網膜中心動脈閉塞は突然の高度視力低下をきたす．\n- D：視神経炎は眼球運動時痛と中心暗点を伴う．\n- E：硝子体出血では飛蚊症と急な視力低下が出る．","images":[],"stem_images":[]},{"number":9,"section":"D-13-S03　74歳女性・かすんで見える","question":"（1/4）74歳の女性．2年前から両眼がかすんで見えるようになり，晴れた日の屋外がまぶしくて歩きにくいという．痛みはない．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"どのくらいの期間で進みましたか．"},{"letter":"B","text":"春になると鼻水が出ますか．"},{"letter":"C","text":"視野が欠けたり物がゆがみますか．"},{"letter":"D","text":"糖尿病やステロイド使用はありますか．"},{"letter":"E","text":"片眼ずつでもかすみますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．鼻炎の季節性は進行性のかすみ目の初期評価では優先度が低い．\n- A：視力低下の経過を確認．\n- B：鼻炎の季節性は進行性のかすみ目の初期評価では優先度が低い．この設問で選ぶ肢．\n- C：網膜・視神経疾患を検討．\n- D：白内障などの背景を確認．\n- E：左右差と単眼性の症状を確認．","images":[],"stem_images":[]},{"number":10,"section":"D-13-S03　74歳女性・かすんで見える","question":"（2/4）74歳の女性．2年前から両眼がかすんで見えるようになり，晴れた日の屋外がまぶしくて歩きにくいという．痛みはない．見えにくさは2年かけて少しずつ進んだという．認められる所見はどれか．","options":[{"letter":"A","text":"眼圧が著明に上昇している"},{"letter":"B","text":"眼底に新生血管を多数認める"},{"letter":"C","text":"徹照法で瞳孔内に黒い影が見える"},{"letter":"D","text":"耳前リンパ節が腫脹し圧痛がある"},{"letter":"E","text":"結膜に濾胞が多数形成されている"}],"answer":["C"],"multi":false,"explanation":"解説：細隙灯顕微鏡で眼底からの反射光を利用すると，混濁した部分が光を遮って黒い影として浮かび上がる．皮質の楔状混濁や後嚢下の混濁など，部位により見え方の訴えが変わる．\n- A：眼圧の著明な上昇は緑内障発作．\n- B：眼底の新生血管は増殖糖尿病網膜症や網膜静脈閉塞症．\n- C：中間透光体の混濁を示し正しい．\n- D：耳前リンパ節の腫脹はウイルス性結膜炎．\n- E：結膜の濾胞形成もウイルス性結膜炎．","images":[],"stem_images":[]},{"number":11,"section":"D-13-S03　74歳女性・かすんで見える","question":"（3/4）74歳の女性．2年前から両眼がかすんで見えるようになり，晴れた日の屋外がまぶしくて歩きにくいという．痛みはない．見えにくさは2年かけて少しずつ進んだという．徹照法で瞳孔内に黒い影を認める．矯正視力は右0.4，左0.3であった．眼圧と眼底に異常はない．最も適切な治療はどれか．","options":[{"letter":"A","text":"抗菌薬の点眼を長期に続ける"},{"letter":"B","text":"眼圧を下げる点眼薬を開始する"},{"letter":"C","text":"副腎皮質ステロイドの全身投与"},{"letter":"D","text":"混濁した組織を除き眼内レンズを入れる"},{"letter":"E","text":"抗ウイルス薬の全身投与を行う"}],"answer":["D"],"multi":false,"explanation":"解説：混濁した水晶体を超音波で乳化吸引し，眼内レンズを挿入する．点眼薬では進行を遅らせる効果しか期待できず，日常生活にどれだけ支障があるかが手術の適応を決める．\n- A：抗菌薬の点眼は細菌感染の治療．\n- B：眼圧下降薬は緑内障の治療．\n- C：ステロイドの全身投与はむしろ白内障を進める．\n- D：根本的な治療で正しい．\n- E：抗ウイルス薬はウイルス感染の治療．","images":[],"stem_images":[]},{"number":12,"section":"D-13-S03　74歳女性・かすんで見える","question":"（4/4）74歳の女性．2年前から両眼がかすんで見えるようになり，晴れた日の屋外がまぶしくて歩きにくいという．痛みはない．見えにくさは2年かけて少しずつ進んだという．徹照法で瞳孔内に黒い影を認める．矯正視力は右0.4，左0.3であった．眼圧と眼底に異常はない．手術を行うことになった．加齢以外にこの混濁を早める要因はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの長期使用"},{"letter":"B","text":"抗ヒスタミン薬の長期使用"},{"letter":"C","text":"プロトンポンプ阻害薬の内服"},{"letter":"D","text":"経口避妊薬の長期の使用"},{"letter":"E","text":"抗凝固薬の長期の内服"}],"answer":["A"],"multi":false,"explanation":"解説：ステロイドの全身投与や点眼を長期に続けると，後嚢下に特徴的な混濁が生じる．糖尿病，アトピー性皮膚炎，紫外線曝露，外傷，喫煙も危険因子として知られている．\n- A：薬剤性の代表として正しい．\n- B：抗ヒスタミン薬は緑内障発作の誘因にはなるが，混濁は起こさない．\n- C：プロトンポンプ阻害薬はこの病変と関連しない．\n- D：経口避妊薬は血栓症の危険を高めるが混濁とは無関係．\n- E：抗凝固薬は出血の危険を高めるだけである．","images":[],"stem_images":[]},{"number":13,"section":"D-13-S04　62歳男性・眼痛と頭痛と嘔吐","question":"（1/4）62歳の男性．昨夜から右眼の奥が激しく痛み，強い頭痛と嘔吐があるという．救急外来を受診した．急な眼圧上昇に伴う視覚症状を確認する質問はどれか．","options":[{"letter":"A","text":"光が走って見えますか．"},{"letter":"B","text":"物の線がゆがんで見えますか．"},{"letter":"C","text":"電灯の周りに虹の輪が見えますか．"},{"letter":"D","text":"視野に幕がかかった感じですか．"},{"letter":"E","text":"黒い点が飛んで見えますか．"}],"answer":["C"],"multi":false,"explanation":"解説：角膜浮腫により光が散乱すると光源の周囲に虹色の輪が見える．頭痛と嘔吐だけでは頭蓋内疾患や急性腹症と紛らわしいが，この視覚症状と眼痛が揃えば眼科的な緊急事態を疑える．\n- A：光視症に関する情報．\n- B：変視症に関する情報．\n- C：眼科的緊急を示唆し有用．\n- D：視野欠損に関する情報．\n- E：飛蚊症に関する情報．","images":[],"stem_images":[]},{"number":14,"section":"D-13-S04　62歳男性・眼痛と頭痛と嘔吐","question":"（2/4）62歳の男性．昨夜から右眼の奥が激しく痛み，強い頭痛と嘔吐があるという．救急外来を受診した．電灯の周りに虹の輪が見えるという．認められる所見はどれか．","options":[{"letter":"A","text":"耳前リンパ節の腫脹と圧痛"},{"letter":"B","text":"右眼の毛様充血と硬い眼球"},{"letter":"C","text":"徹照法で瞳孔内に黒い影"},{"letter":"D","text":"結膜に濾胞が多数形成される"},{"letter":"E","text":"眼底に軟性白斑が散在する"}],"answer":["B"],"multi":false,"explanation":"解説：房水の流出が遮られて眼圧が急上昇するため，角膜周囲が濃く充血し，眼球を触れると硬く感じられる．瞳孔は中等度に散大して対光反射が消失し，角膜は浮腫でびまん性に濁る．\n- A：耳前リンパ節の腫脹はウイルス性結膜炎．\n- B：眼圧上昇を反映し正しい．\n- C：徹照での黒い影は白内障．\n- D：結膜の濾胞形成はウイルス性結膜炎．\n- E：眼底の軟性白斑は増殖前糖尿病網膜症や高血圧性網膜症．","images":[],"stem_images":[]},{"number":15,"section":"D-13-S04　62歳男性・眼痛と頭痛と嘔吐","question":"（3/4）62歳の男性．昨夜から右眼の奥が激しく痛み，強い頭痛と嘔吐があるという．救急外来を受診した．電灯の周りに虹の輪が見えるという．右眼に毛様充血を認め，眼球は硬く触れる．瞳孔は中等度に散大し対光反射は消失している．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"頭部単純CTの撮影"},{"letter":"B","text":"上部消化管内視鏡の施行"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"眼圧の測定と隅角の観察"},{"letter":"E","text":"骨シンチグラフィの撮影"}],"answer":["D"],"multi":false,"explanation":"解説：眼圧を測って著明な上昇を確認し，隅角鏡で隅角が閉塞しているかを見る．病型が分かれば直ちに眼圧下降を始められる．診断と治療開始までの時間が視機能の予後を決める．\n- A：頭痛と嘔吐から頭蓋内疾患も鑑別に挙がるが，眼所見が明らかで眼圧測定が先．\n- B：内視鏡は消化管疾患の評価．\n- C：呼吸機能検査は換気障害の評価．\n- D：診断と治療方針の決定に直結し正しい．\n- E：骨シンチグラフィは骨病変の検索．","images":[],"stem_images":[]},{"number":16,"section":"D-13-S04　62歳男性・眼痛と頭痛と嘔吐","question":"（4/4）62歳の男性．昨夜から右眼の奥が激しく痛み，強い頭痛と嘔吐があるという．救急外来を受診した．電灯の周りに虹の輪が見えるという．右眼に毛様充血を認め，眼球は硬く触れる．瞳孔は中等度に散大し対光反射は消失している．眼圧は58mmHgで隅角は閉塞していた．この患者に禁忌となる薬剤はどれか．","options":[{"letter":"A","text":"浸透圧利尿薬の点滴"},{"letter":"B","text":"縮瞳薬の点眼"},{"letter":"C","text":"炭酸脱水酵素阻害薬"},{"letter":"D","text":"β遮断薬の点眼"},{"letter":"E","text":"抗コリン作用のある薬剤"}],"answer":["E"],"multi":false,"explanation":"解説：抗コリン薬は瞳孔を散大させて周辺虹彩を隅角に押しつけ，閉塞をさらに悪化させる．抗ヒスタミン薬や三環系抗うつ薬，一部の鎮痙薬にも同じ作用があり，発作を誘発しうる．\n- A：浸透圧利尿薬は硝子体の容積を減らし眼圧を下げる治療薬．\n- B：縮瞳薬は虹彩を引いて隅角を開き，発作の治療に用いる．\n- C：炭酸脱水酵素阻害薬は房水産生を抑えて眼圧を下げる．\n- D：β遮断薬の点眼も房水産生を抑える治療薬．\n- E：隅角閉塞を悪化させ禁忌で正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-13-S05　58歳男性・糖尿病経過中の視力低下","question":"（1/4）58歳の男性．16年前から2型糖尿病で通院している．1週間前から右眼に黒い浮遊物が見えるようになり，視力も落ちてきたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"最後の眼底検査はいつですか．"},{"letter":"B","text":"幼少期に色覚検査を受けましたか．"},{"letter":"C","text":"視野に幕がかかる感じはありますか．"},{"letter":"D","text":"光が走って見えますか．"},{"letter":"E","text":"眼をぶつけたことはありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．小児期の色覚検査歴は新たな飛蚊症・視力低下の緊急評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：網膜病変の評価歴を確認．\n- B：小児期の色覚検査歴は新たな飛蚊症・視力低下の緊急評価では優先度が低い．この設問で選ぶ肢．\n- C：網膜剝離を疑う症状を確認．\n- D：網膜牽引による症状を確認．\n- E：外傷性の硝子体・網膜病変を検討．","images":[],"stem_images":[]},{"number":18,"section":"D-13-S05　58歳男性・糖尿病経過中の視力低下","question":"（2/4）58歳の男性．16年前から2型糖尿病で通院している．1週間前から右眼に黒い浮遊物が見えるようになり，視力も落ちてきたという．眼底検査は5年前を最後に受けていないという．最も考えられる病態はどれか．","options":[{"letter":"A","text":"水晶体が急速に混濁したこと"},{"letter":"B","text":"角膜に点状の混濁が生じたこと"},{"letter":"C","text":"新生血管が破綻し硝子体へ出血"},{"letter":"D","text":"隅角が閉塞し眼圧が急上昇した"},{"letter":"E","text":"涙液の分泌が急に減ったこと"}],"answer":["C"],"multi":false,"explanation":"解説：虚血に陥った網膜が血管内皮増殖因子を出し，脆い新生血管が硝子体側へ伸びる．これが破れると硝子体出血となり，飛蚊症と急な視力低下をきたす．牽引性網膜剝離にも進みうる．\n- A：白内障は緩徐に進み，飛蚊症は伴わない．\n- B：角膜の点状混濁はウイルス性結膜炎の後遺．\n- C：増殖期の代表的な合併症で正しい．\n- D：隅角閉塞では激しい眼痛と充血を伴う．\n- E：涙液分泌の低下はドライアイで，飛蚊症は起こさない．","images":[],"stem_images":[]},{"number":19,"section":"D-13-S05　58歳男性・糖尿病経過中の視力低下","question":"（3/4）58歳の男性．16年前から2型糖尿病で通院している．1週間前から右眼に黒い浮遊物が見えるようになり，視力も落ちてきたという．眼底検査は5年前を最後に受けていないという．散瞳下の眼底検査で網膜に新生血管と硝子体出血を認めた．左眼の眼底に軟性白斑が散在するがまだ新生血管はない．左眼の病期はどれか．","options":[{"letter":"A","text":"まだ網膜症を発症していない"},{"letter":"B","text":"単純網膜症の段階である"},{"letter":"C","text":"増殖前網膜症の段階である"},{"letter":"D","text":"増殖網膜症の段階である"},{"letter":"E","text":"網膜剝離をきたしている"}],"answer":["C"],"multi":false,"explanation":"解説：軟性白斑は神経線維層の虚血による梗塞を示し，新生血管が出る一歩手前の段階を意味する．この時期に汎網膜光凝固を行えば増殖期への進行を抑えられるため，病期の判定が治療につながる．\n- A：軟性白斑がある以上，網膜症は発症している．\n- B：単純期は毛細血管瘤・点状出血・硬性白斑にとどまる．\n- C：軟性白斑が示す段階として正しい．\n- D：増殖期は新生血管の出現をもって診断する．\n- E：網膜剝離では視野欠損や変視症を訴える．","images":[],"stem_images":[]},{"number":20,"section":"D-13-S05　58歳男性・糖尿病経過中の視力低下","question":"（4/4）58歳の男性．16年前から2型糖尿病で通院している．1週間前から右眼に黒い浮遊物が見えるようになり，視力も落ちてきたという．眼底検査は5年前を最後に受けていないという．散瞳下の眼底検査で右眼に新生血管と硝子体出血，左眼に軟性白斑を認めた．瞼縁に無痛性で硬い小結節も認める．この瞼の病変はどれか．","options":[{"letter":"A","text":"麦粒腫による急性の化膿"},{"letter":"B","text":"結膜の濾胞形成による隆起"},{"letter":"C","text":"眼窩脂肪の脱出による膨隆"},{"letter":"D","text":"涙腺の腫大による隆起"},{"letter":"E","text":"瞼板腺の慢性肉芽腫性炎症"}],"answer":["E"],"multi":false,"explanation":"解説：霰粒腫は瞼板腺の分泌物が貯留して慢性の肉芽腫性炎症をつくる．無痛性で硬い結節として触れ，発赤や熱感を欠く．急性の化膿性炎症で強い疼痛と発赤を伴う麦粒腫とは対照的である．\n- A：麦粒腫は有痛性で発赤・熱感を伴う．\n- B：結膜の濾胞形成は結膜側にみられる小隆起．\n- C：眼窩脂肪の脱出は上眼瞼の柔らかい膨隆．\n- D：涙腺の腫大は外上方の腫脹として現れる．\n- E：無痛性で硬い結節に合致し正しい．","images":[],"stem_images":[]}],"seed":null},{"id":"D-14_耳鼻咽喉口腔系","name":"D-14_耳鼻咽喉口腔系.md","label":"D-14 耳鼻咽喉口腔系","count":40,"sourceHash":"11ab62069362","questions":[{"number":1,"section":"D-14-S01　3歳男児・夜間の耳痛と発熱","question":"（1/4）3歳の男児．昨夜から右耳を押さえて激しく泣き，38.5℃の発熱があるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"耳だれは出ていますか．"},{"letter":"B","text":"乳歯は何本抜けましたか．"},{"letter":"C","text":"水分はとれていますか．"},{"letter":"D","text":"先に鼻水や咳がありましたか．"},{"letter":"E","text":"耳の後ろが腫れていますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．歯の交換数は発熱を伴う急な耳痛の評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：鼓膜穿孔などを検討．\n- B：歯の交換数は発熱を伴う急な耳痛の評価では優先度が低い．この設問で選ぶ肢．\n- C：全身状態と脱水を評価．\n- D：上気道感染の先行を確認．\n- E：乳様突起炎の徴候を確認．","images":[],"stem_images":[]},{"number":2,"section":"D-14-S01　3歳男児・夜間の耳痛と発熱","question":"（2/4）3歳の男児．昨夜から右耳を押さえて激しく泣き，38.5℃の発熱があるという．4日前から鼻水と咳が続き，保育園でも同様の症状の児が多いという．鼓膜所見として予想されるのはどれか．","options":[{"letter":"A","text":"鼓膜が陥凹し液面を見る"},{"letter":"B","text":"上鼓室に痂皮が付着している"},{"letter":"C","text":"鼓膜が発赤し膨隆している"},{"letter":"D","text":"鼓膜に石灰化した白斑がある"},{"letter":"E","text":"鼓膜は正常で光錐も保たれる"}],"answer":["C"],"multi":false,"explanation":"解説：中耳腔に貯留した膿が鼓膜を外側へ押し出すため，発赤と膨隆を認め光錐は消失する．圧が高まると鼓膜が自壊して耳漏が出るとともに疼痛は軽くなる．\n- A：陥凹と液面は滲出性中耳炎．\n- B：上鼓室の痂皮は真珠腫性中耳炎．\n- C：急性の炎症を反映し正しい．\n- D：石灰化した白斑は鼓膜硬化症で既往の炎症の痕．\n- E：明らかな耳痛と発熱があり正常とは考えにくい．","images":[],"stem_images":[]},{"number":3,"section":"D-14-S01　3歳男児・夜間の耳痛と発熱","question":"（3/4）3歳の男児．昨夜から右耳を押さえて激しく泣き，38.5℃の発熱があるという．4日前から鼻水と咳が続いていたという．右鼓膜は発赤し膨隆して光錐が消失している．治療後に疼痛と発熱は消えたが，1か月後の再診で難聴を指摘された．このときの鼓膜所見はどれか．","options":[{"letter":"A","text":"鼓膜が発赤し強く膨隆している"},{"letter":"B","text":"鼓膜が陥凹し液体の貯留を認める"},{"letter":"C","text":"鼓膜に大きな穿孔を認める"},{"letter":"D","text":"上鼓室に悪臭を伴う痂皮がある"},{"letter":"E","text":"鼓膜は完全に正常化している"}],"answer":["B"],"multi":false,"explanation":"解説：急性期の炎症が治まっても中耳腔に滲出液が残ることがあり，痛みも発熱もないまま伝音難聴だけが続く．鼓膜は陥凹し琥珀色に見え，液面や気泡を透見できる．\n- A：発赤と膨隆は急性期の所見で，疼痛を伴う．\n- B：滲出性中耳炎の所見として正しい．\n- C：大きな穿孔は慢性中耳炎や外傷．\n- D：悪臭を伴う痂皮は真珠腫性中耳炎．\n- E：難聴がある以上，正常化しているとは考えにくい．","images":[],"stem_images":[]},{"number":4,"section":"D-14-S01　3歳男児・夜間の耳痛と発熱","question":"（4/4）3歳の男児．昨夜から右耳を押さえて激しく泣き，38.5℃の発熱があるという．4日前から鼻水と咳が続いていたという．右鼓膜は発赤し膨隆して光錐が消失している．1か月後の再診で鼓膜の陥凹と液体貯留を認め，難聴があった．鼓膜は琥珀色で気泡を透見する．放置した場合に最も警戒すべき病態はどれか．","options":[{"letter":"A","text":"外耳道に真菌が繁殖すること"},{"letter":"B","text":"耳垢が硬く詰まってしまうこと"},{"letter":"C","text":"鼓膜が石灰化して白くなること"},{"letter":"D","text":"上皮が中耳に入り骨を破壊すること"},{"letter":"E","text":"耳管が完全に閉鎖してしまうこと"}],"answer":["D"],"multi":false,"explanation":"解説：鼓膜の陥凹が続くと角化扁平上皮が中耳腔へ入り込んで増殖し，周囲の骨を溶かしていく．難聴・めまい・顔面神経麻痺・頭蓋内合併症に至るため，手術による摘出が必要になる．\n- A：外耳道真菌症は外耳道の問題で骨破壊はしない．\n- B：耳垢栓塞は伝音難聴をきたすが除去で解決する．\n- C：鼓膜の石灰化は既往炎症の痕で進行性ではない．\n- D：この経過で最も警戒すべき病態で正しい．\n- E：耳管の機能不全は滲出性中耳炎の原因だが，骨破壊はきたさない．","images":[],"stem_images":[]},{"number":5,"section":"D-14-S02　54歳男性・突然の片側難聴","question":"（1/4）54歳の男性．今朝起きたら右耳がまったく聞こえず，耳鳴りもするという．めまいは軽い．治療時期の判断に必要な難聴の発症時刻を確認する質問はどれか．","options":[{"letter":"A","text":"大きな音を聞きましたか．"},{"letter":"B","text":"耳だれは出ていますか．"},{"letter":"C","text":"いつから聞こえませんか．"},{"letter":"D","text":"聞こえが変動しますか．"},{"letter":"E","text":"手足の麻痺がありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：この疾患は治療開始が早いほど聴力の回復が良く，発症から2週を過ぎると予後が悪化する．発症時期を分単位で特定できるほど典型的で，同時に治療の緊急度を決める情報にもなる．\n- A：音響外傷に関する情報．\n- B：外耳・中耳病変に関する情報．\n- C：予後と緊急度を規定し有用．\n- D：聴力変動に関する情報．\n- E：中枢性病変に関する情報．","images":[],"stem_images":[]},{"number":6,"section":"D-14-S02　54歳男性・突然の片側難聴","question":"（2/4）54歳の男性．今朝起きたら右耳がまったく聞こえず，耳鳴りもするという．めまいは軽い．今朝目が覚めた時点で既に聞こえなかったという．行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"純音聴力検査の施行"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["B"],"multi":false,"explanation":"解説：気導と骨導の閾値を測り，感音難聴か伝音難聴かを判定して程度を定量する．同時に音叉を用いたRinne試験とWeber試験でも確認し，治療効果の判定の基準値としても使う．\n- A：骨シンチグラフィは骨病変の検索．\n- B：病型の判定と重症度の定量に直結し正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：内視鏡は消化管疾患の評価．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":7,"section":"D-14-S02　54歳男性・突然の片側難聴","question":"（3/4）54歳の男性．今朝起きたら右耳がまったく聞こえず，耳鳴りもするという．めまいは軽い．今朝目が覚めた時点で既に聞こえなかったという．純音聴力検査で右に高度の感音難聴を認め，鼓膜は正常で耳垢もない．次に行うべきなのはどれか．","options":[{"letter":"A","text":"経過をみて1か月後に再検する"},{"letter":"B","text":"抗菌薬の内服を長期に続ける"},{"letter":"C","text":"副腎皮質ステロイドを速やかに投与"},{"letter":"D","text":"抗ヒスタミン薬の連日内服"},{"letter":"E","text":"鼓膜切開で貯留液を排出する"}],"answer":["C"],"multi":false,"explanation":"解説：内耳の浮腫と炎症を抑える目的で，発症後できるだけ早く全身投与を始める．安静と生活指導を併せ，聴力を経時的に追う．小脳橋角部腫瘍の除外のため頭部MRIも行う．\n- A：時間の経過が予後を悪化させ，経過観察は不適切．\n- B：抗菌薬は細菌感染の治療で，本例には無効．\n- C：早期投与が予後を左右し正しい．\n- D：抗ヒスタミン薬はアレルギー疾患の治療．\n- E：鼓膜切開は滲出性中耳炎の処置で，鼓膜が正常な本例には適応がない．","images":[],"stem_images":[]},{"number":8,"section":"D-14-S02　54歳男性・突然の片側難聴","question":"（4/4）54歳の男性．今朝起きたら右耳がまったく聞こえず，耳鳴りもするという．めまいは軽い．今朝目が覚めた時点で既に聞こえなかったという．純音聴力検査で右に高度の感音難聴を認め，鼓膜は正常で耳垢もない．頭部MRIでも聴神経に腫瘍はなかった．工場で30年間，防音具なしで働いてきたという場合に予想される聴力像はどれか．","options":[{"letter":"A","text":"低音域だけが左右差なく低下する"},{"letter":"B","text":"両側の4000Hz付近が谷状に低下"},{"letter":"C","text":"一側の全周波数が高度に低下する"},{"letter":"D","text":"気導のみ低下し骨導は正常となる"},{"letter":"E","text":"聴力検査で異常を認めない"}],"answer":["B"],"multi":false,"explanation":"解説：騒音性難聴では蝸牛の基底回転が障害され，4000Hz付近に限局した谷（c5 dip）が両側性に現れる．初期は会話音域が保たれ自覚しにくいので，定期的な聴力検査での早期発見が要る．\n- A：低音域優位の変動する難聴はMénière病．\n- B：騒音性難聴の特徴的な聴力像で正しい．\n- C：一側の高度感音難聴は突発性難聴や聴神経腫瘍．\n- D：気導のみの低下は伝音難聴で，外耳や中耳の問題．\n- E：長期の騒音曝露があれば何らかの変化が現れる．","images":[],"stem_images":[]},{"number":9,"section":"D-14-S03　62歳女性・寝返りで起こるめまい","question":"（1/4）62歳の女性．3日前から寝返りを打つとぐるぐる回るめまいが起こるという．吐き気を伴う．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から鼻がかゆいですか．"},{"letter":"B","text":"一回のめまいは何秒続きますか．"},{"letter":"C","text":"耳鳴りや聞こえの変化はありますか．"},{"letter":"D","text":"どの向きに頭を動かすと起こりますか．"},{"letter":"E","text":"ろれつや手足の動きは普段どおりですか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性鼻炎症状は頭位性めまいの初期鑑別では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：慢性鼻炎症状は頭位性めまいの初期鑑別では優先度が低い．この設問で選ぶ肢．\n- B：持続時間から病型を絞る．\n- C：蝸牛症状を伴う疾患を検討．\n- D：誘発頭位を確認．\n- E：中枢性病変の警告徴候を確認．","images":[],"stem_images":[]},{"number":10,"section":"D-14-S03　62歳女性・寝返りで起こるめまい","question":"（2/4）62歳の女性．3日前から寝返りを打つとぐるぐる回るめまいが起こるという．吐き気を伴う．めまいは30秒ほどで治まり，じっとしていれば起こらないという．難聴や耳鳴りはない．行うべき診察はどれか．","options":[{"letter":"A","text":"上方を注視させ続けて眼瞼をみる"},{"letter":"B","text":"足底を擦って母趾の動きをみる"},{"letter":"C","text":"頸部を前屈させて抵抗をみる"},{"letter":"D","text":"足関節を背屈させて腓腹部をみる"},{"letter":"E","text":"頭位を変換させて眼振をみる"}],"answer":["E"],"multi":false,"explanation":"解説：坐位から一側へ頭を回して素早く仰臥位にすると，数秒の潜時をおいて回旋性の眼振が出現し数十秒で減衰する．繰り返すと弱くなる疲労現象も特徴で，これが耳石によることを示す．\n- A：上方注視の持続は重症筋無力症の疲労試験．\n- B：足底の擦過はBabinski徴候の診察．\n- C：頸部前屈は髄膜刺激徴候の診察．\n- D：足関節背屈はHomans徴候の診察．\n- E：診断を直接確かめ正しい．","images":[],"stem_images":[]},{"number":11,"section":"D-14-S03　62歳女性・寝返りで起こるめまい","question":"（3/4）62歳の女性．3日前から寝返りを打つとぐるぐる回るめまいが起こるという．吐き気を伴う．めまいは30秒ほどで治まり，じっとしていれば起こらないという．難聴や耳鳴りはない．頭位変換により潜時を伴う回旋性眼振が誘発され，数十秒で減衰した．最も適切な治療はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの全身投与"},{"letter":"B","text":"抗菌薬を長期に続ける"},{"letter":"C","text":"耳石を移動させる理学療法"},{"letter":"D","text":"鼓膜切開による貯留液の排出"},{"letter":"E","text":"利尿薬と生活指導を中心とする"}],"answer":["C"],"multi":false,"explanation":"解説：Epley法などで頭位を順に変えて，半規管に迷入した耳石を耳石器へ戻す．その場で症状が消えることも多く，自宅でできる運動も指導する．薬物は補助にとどまる．\n- A：ステロイドの全身投与は突発性難聴や前庭神経炎で検討する．\n- B：抗菌薬は細菌感染の治療．\n- C：病態に直接対応する治療で正しい．\n- D：鼓膜切開は滲出性中耳炎の処置．\n- E：利尿薬と生活指導はMénière病の管理．","images":[],"stem_images":[]},{"number":12,"section":"D-14-S03　62歳女性・寝返りで起こるめまい","question":"（4/4）62歳の女性．3日前から寝返りを打つとぐるぐる回るめまいが起こるという．吐き気を伴う．めまいは30秒ほどで治まり，じっとしていれば起こらないという．難聴や耳鳴りはない．頭位変換により潜時を伴う回旋性眼振が誘発され，数十秒で減衰した．仮にめまいが20分から数時間続き，そのたびに難聴と耳閉感を伴う場合の病態はどれか．","options":[{"letter":"A","text":"半規管に耳石が迷入したこと"},{"letter":"B","text":"内リンパが過剰に貯留したこと"},{"letter":"C","text":"前庭神経に炎症が起きたこと"},{"letter":"D","text":"小脳に梗塞が生じたこと"},{"letter":"E","text":"起立時に血圧が下がること"}],"answer":["B"],"multi":false,"explanation":"解説：内リンパ水腫により，めまい発作と変動する低音障害型の感音難聴・耳鳴・耳閉感が反復する．発作を繰り返すと難聴が固定していく．塩分制限と利尿薬，ストレス管理が治療の柱になる．\n- A：耳石の迷入は数十秒のめまいで，難聴を伴わない．\n- B：症状の組合せに合致し正しい．\n- C：前庭神経の炎症では数日持続するめまいが出るが，難聴は伴わない．\n- D：小脳梗塞では体幹失調や構音障害などの中枢徴候を伴う．\n- E：起立性低血圧では回転性でない立ちくらみが起こる．","images":[],"stem_images":[]},{"number":13,"section":"D-14-S04　46歳男性・繰り返す鼻出血","question":"（1/4）46歳の男性．30分前から右の鼻から出血が続き，止まらないため来院した．この1か月で3回目だという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"血がのどへ流れ続けていますか．"},{"letter":"B","text":"血を固まりにくくする薬を飲みますか．"},{"letter":"C","text":"歯ぐきや皮膚にも出血がありますか．"},{"letter":"D","text":"鼻をぶつけたり触ったりしましたか．"},{"letter":"E","text":"以前から乗り物酔いをしますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．乗り物酔いは鼻出血の原因と重症度の評価では優先度が低い．\n- A：出血量と後方出血を評価．\n- B：薬剤による出血傾向を確認．\n- C：全身の出血傾向を確認．\n- D：局所の出血契機を確認．\n- E：乗り物酔いは鼻出血の原因と重症度の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":14,"section":"D-14-S04　46歳男性・繰り返す鼻出血","question":"（2/4）46歳の男性．30分前から右の鼻から出血が続き，止まらないため来院した．この1か月で3回目だという．抗血栓薬は飲んでおらず，血液の病気の指摘もないという．まず行うべき処置はどれか．","options":[{"letter":"A","text":"坐位で前傾させ小鼻を圧迫する"},{"letter":"B","text":"仰臥位にして首の後ろを叩く"},{"letter":"C","text":"直ちに上顎動脈を塞栓する"},{"letter":"D","text":"直ちに全身麻酔下で止血する"},{"letter":"E","text":"頭を後ろに反らせて安静にする"}],"answer":["A"],"multi":false,"explanation":"解説：出血の9割は鼻中隔前下部からで，小鼻を指でつまんで10分以上続けて圧迫すれば多くは止まる．坐位でやや前傾させるのは血液の嚥下と誤嚥を防ぐためである．\n- A：基本手技として正しい．\n- B：仰臥位は血液を飲み込ませ，首を叩くことに止血効果はない．\n- C：塞栓術は保存的に止血できない後方出血で検討する．\n- D：全身麻酔下の止血も最終手段である．\n- E：頭を後屈させると血液が咽頭へ流れ込む．","images":[],"stem_images":[]},{"number":15,"section":"D-14-S04　46歳男性・繰り返す鼻出血","question":"（3/4）46歳の男性．30分前から右の鼻から出血が続き，止まらないため来院した．この1か月で3回目だという．抗血栓薬は飲んでおらず，血液の病気の指摘もないという．小鼻を15分圧迫したが止血しない．鼻鏡で前方に出血点を確認できず，咽頭へ血液が流れ込んでいる．考えられるのはどれか．","options":[{"letter":"A","text":"鼻中隔前部の出血"},{"letter":"B","text":"副鼻腔に膿が貯留したこと"},{"letter":"C","text":"鼻の後方からの出血"},{"letter":"D","text":"鼻粘膜が乾燥しただけのこと"},{"letter":"E","text":"涙嚢から逆流していること"}],"answer":["C"],"multi":false,"explanation":"解説：蝶口蓋動脈など後方からの出血は圧迫が届かず，血液が後鼻孔から咽頭へ流れる．高齢者や高血圧例に多く，大量出血になりうるため耳鼻科で後鼻腔タンポンや内視鏡下の止血を行う．\n- A：鼻中隔前部からの出血なら鼻鏡で出血点が見え，圧迫で止まる．\n- B：副鼻腔の膿貯留は副鼻腔炎で，出血の原因にならない．\n- C：所見に合致し正しい．\n- D：粘膜の乾燥だけでは持続する出血を説明できない．\n- E：涙嚢からの逆流は涙道の問題で出血源にならない．","images":[],"stem_images":[]},{"number":16,"section":"D-14-S04　46歳男性・繰り返す鼻出血","question":"（4/4）46歳の男性．30分前から右の鼻から出血が続き，止まらないため来院した．この1か月で3回目だという．抗血栓薬は飲んでおらず，血液の病気の指摘もないという．小鼻を15分圧迫したが止血しない．鼻鏡で前方に出血点を確認できず，咽頭へ血液が流れ込んでいる．止血後に併せて評価すべきなのはどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカー"},{"letter":"B","text":"呼気中一酸化窒素濃度"},{"letter":"C","text":"睡眠時の無呼吸低呼吸指数"},{"letter":"D","text":"血圧と血算・凝固機能"},{"letter":"E","text":"屈折検査と矯正視力"}],"answer":["D"],"multi":false,"explanation":"解説：高血圧は反復と難治化の大きな要因であり，貧血の程度と凝固異常の有無も再出血の危険と輸血の必要性を左右する．反復例では腫瘍性病変の除外のため鼻内視鏡と画像も検討する．\n- A：骨密度は骨粗鬆症の評価．\n- B：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- C：無呼吸低呼吸指数は睡眠時無呼吸症候群の評価．\n- D：再出血の危険因子を網羅でき正しい．\n- E：屈折検査は視力の評価．","images":[],"stem_images":[]},{"number":17,"section":"D-14-S05　38歳男性・鼻閉と頬部の重い痛み","question":"（1/4）38歳の男性．2週間前に風邪をひき，いったん軽快したが5日前から黄色い鼻汁と右頬の重い痛みが出てきたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"眼の周りが腫れたり見えにくいですか．"},{"letter":"B","text":"発熱や強い頭痛はありますか．"},{"letter":"C","text":"爪が厚くなっていますか．"},{"letter":"D","text":"歯痛や歯科治療はありましたか．"},{"letter":"E","text":"これまでどんな薬を使いましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．爪の局所病変は今回の副鼻腔症状の評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：眼窩への炎症波及を評価．\n- B：全身・頭蓋内への影響を評価．\n- C：爪の局所病変は今回の副鼻腔症状の評価では優先度が低い．この設問で選ぶ肢．\n- D：歯性の感染源を検討．\n- E：既治療と反応を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-14-S05　38歳男性・鼻閉と頬部の重い痛み","question":"（2/4）38歳の男性．2週間前に風邪をひき，いったん軽快したが5日前から黄色い鼻汁と右頬の重い痛みが出てきたという．症状は一度良くなってから再び悪化したという．認められる所見はどれか．","options":[{"letter":"A","text":"鼻粘膜が蒼白に浮腫状となる"},{"letter":"B","text":"前屈で増強する頬部の圧痛"},{"letter":"C","text":"鼻中隔前下部からの出血"},{"letter":"D","text":"喉頭蓋が著明に腫脹する"},{"letter":"E","text":"口蓋垂が健側へ偏位する"}],"answer":["B"],"multi":false,"explanation":"解説：副鼻腔に貯留した分泌物が前屈で洞内圧を高めるため，頭を下げると痛みが強まる．病側の頬部や前額部に圧痛と叩打痛を認め，後鼻漏と嗅覚の低下を伴うことが多い．\n- A：蒼白浮腫状の鼻粘膜はアレルギー性鼻炎．\n- B：この疾患に特徴的で正しい．\n- C：鼻中隔前下部からの出血は鼻出血．\n- D：喉頭蓋の腫脹は急性喉頭蓋炎．\n- E：口蓋垂の偏位は扁桃周囲膿瘍．","images":[],"stem_images":[]},{"number":19,"section":"D-14-S05　38歳男性・鼻閉と頬部の重い痛み","question":"（3/4）38歳の男性．2週間前に風邪をひき，いったん軽快したが5日前から黄色い鼻汁と右頬の重い痛みが出てきたという．症状は一度良くなってから再び悪化したという．前屈で増強する右頬部の圧痛を認め，体温37.8℃である．最も適切な治療はどれか．","options":[{"letter":"A","text":"抗ウイルス薬の全身投与を行う"},{"letter":"B","text":"直ちに内視鏡下の手術を行う"},{"letter":"C","text":"抗ヒスタミン薬の連日内服のみ"},{"letter":"D","text":"抗菌薬の投与と鼻処置を行う"},{"letter":"E","text":"副腎皮質ステロイドの大量全身投与"}],"answer":["D"],"multi":false,"explanation":"解説：二峰性の経過と局所所見から細菌性を考え，アモキシシリンなどの抗菌薬を投与する．同時に鼻腔の清掃とネブライザー，去痰薬で排泄を促す．改善しなければ画像評価と耳鼻科での処置に進む．\n- A：抗ウイルス薬はこの病態に無効．\n- B：手術は保存的治療に抵抗する慢性例で検討する．\n- C：抗ヒスタミン薬はアレルギー性鼻炎の治療．\n- D：標準的な治療で正しい．\n- E：ステロイドの大量全身投与は好酸球性の病型で用途があるが，急性細菌性の第一選択ではない．","images":[],"stem_images":[]},{"number":20,"section":"D-14-S05　38歳男性・鼻閉と頬部の重い痛み","question":"（4/4）38歳の男性．2週間前に風邪をひき，いったん軽快したが5日前から黄色い鼻汁と右頬の重い痛みが出てきたという．症状は一度良くなってから再び悪化したという．前屈で増強する右頬部の圧痛を認め，体温37.8℃である．抗菌薬で改善した．仮にこの患者が気管支喘息を合併し，両側の鼻茸と強い嗅覚障害を繰り返す場合に増加している細胞はどれか．","options":[{"letter":"A","text":"好中球"},{"letter":"B","text":"好塩基球"},{"letter":"C","text":"形質細胞"},{"letter":"D","text":"単球"},{"letter":"E","text":"好酸球"}],"answer":["E"],"multi":false,"explanation":"解説：好酸球性副鼻腔炎では鼻茸と粘稠なニカワ状の鼻汁に好酸球が多数浸潤し，気管支喘息やアスピリン不耐症を高率に合併する．嗅覚障害が強く再発しやすく，ステロイドが奏効する．\n- A：好中球は急性細菌性の炎症で主体となる．\n- B：好塩基球は即時型アレルギーで働くが，組織で主体にはならない．\n- C：形質細胞は抗体産生を担う細胞．\n- D：単球は組織でマクロファージとなる．\n- E：この病型の本態で正しい．","images":[],"stem_images":[]},{"number":21,"section":"D-14-S06　24歳女性・春先のくしゃみと鼻水","question":"（1/4）24歳の女性．3月に入ってから発作的なくしゃみと水のような鼻水，鼻づまりが続くという．目もかゆい．鼻症状の季節性を確認するための質問はどれか．","options":[{"letter":"A","text":"毎年同じ時期に出ますか．"},{"letter":"B","text":"家の掃除で悪化しますか．"},{"letter":"C","text":"動物に触ると悪化しますか．"},{"letter":"D","text":"鼻水に粘りや色がありますか．"},{"letter":"E","text":"においが分かりにくいですか．"}],"answer":["A"],"multi":false,"explanation":"解説：症状が毎年同じ季節に現れるなら花粉が抗原で，一年中続くならダニやハウスダストを考える．抗原の推定は特異的IgEの検査項目の選択と，抗原回避の具体的な指導に直結する．\n- A：抗原の推定に直結し有用．\n- B：室内抗原への曝露に関する情報．\n- C：動物由来抗原に関する情報．\n- D：鼻汁の性状に関する情報．\n- E：嗅覚障害に関する情報．","images":[],"stem_images":[]},{"number":22,"section":"D-14-S06　24歳女性・春先のくしゃみと鼻水","question":"（2/4）24歳の女性．3月に入ってから発作的なくしゃみと水のような鼻水，鼻づまりが続くという．目もかゆい．3年前から毎年2月下旬から4月にかけて同じ症状が出るという．鼻鏡で予想される所見はどれか．","options":[{"letter":"A","text":"鼻中隔前下部の血管の怒張と痂皮"},{"letter":"B","text":"鼻腔に膿性の分泌物が貯留する"},{"letter":"C","text":"鼻粘膜が蒼白で浮腫状となる"},{"letter":"D","text":"鼻腔内に易出血性の腫瘤がある"},{"letter":"E","text":"鼻粘膜が乾燥し萎縮している"}],"answer":["C"],"multi":false,"explanation":"解説：I型アレルギー反応で血管透過性が亢進して粘膜が浮腫状になり，貧血様に蒼白を呈する．水様性の分泌物を伴い，鼻汁を染色すると好酸球が多数みられる．\n- A：血管怒張と痂皮は鼻出血を繰り返す場合の所見．\n- B：膿性分泌物の貯留は細菌性副鼻腔炎．\n- C：この疾患に特徴的で正しい．\n- D：易出血性の腫瘤は腫瘍性病変．\n- E：粘膜の乾燥と萎縮は萎縮性鼻炎．","images":[],"stem_images":[]},{"number":23,"section":"D-14-S06　24歳女性・春先のくしゃみと鼻水","question":"（3/4）24歳の女性．3月に入ってから発作的なくしゃみと水のような鼻水，鼻づまりが続くという．目もかゆい．3年前から毎年2月下旬から4月にかけて同じ症状が出るという．鼻粘膜は蒼白で浮腫状であった．抗原の確定に有用な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"血清特異的IgEの測定"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：疑わしい抗原に対する特異的IgE抗体を測り，症状の季節性と一致するかを確かめる．皮膚テストも併用でき，抗原が特定できれば回避指導と舌下免疫療法の適応判断につながる．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は喘息の合併評価には有用だが，抗原の確定はできない．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：抗原の同定に直結し正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":24,"section":"D-14-S06　24歳女性・春先のくしゃみと鼻水","question":"（4/4）24歳の女性．3月に入ってから発作的なくしゃみと水のような鼻水，鼻づまりが続くという．目もかゆい．3年前から毎年2月下旬から4月にかけて同じ症状が出るという．鼻粘膜は蒼白で浮腫状であった．血清特異的IgEでスギが強陽性であった．抗原に対する免疫反応を長期的に変える治療はどれか．","options":[{"letter":"A","text":"抗ヒスタミン薬の連日内服"},{"letter":"B","text":"点鼻用の副腎皮質ステロイド"},{"letter":"C","text":"抗ロイコトリエン薬の内服"},{"letter":"D","text":"血管収縮薬の点鼻を続ける"},{"letter":"E","text":"抗原を用いた舌下免疫療法"}],"answer":["E"],"multi":false,"explanation":"解説：アレルゲン免疫療法は原因抗原を継続投与し，抗原に対する免疫反応を変える治療である．舌下法のほか皮下法もあり，長期寛解が期待できるが全員の根治を保証するものではない．\n- A：抗ヒスタミン薬は症状を抑える対症療法．\n- B：点鼻ステロイドも炎症を抑える対症療法．\n- C：抗ロイコトリエン薬は鼻閉に有効だが対症療法．\n- D：血管収縮薬の連用は薬剤性鼻炎を招く．\n- E：抗原特異的な免疫寛容を目指す治療であり，効果には個人差がある．","images":[],"stem_images":[]},{"number":25,"section":"D-14-S07　58歳男性・急速に進む咽頭痛と嚥下困難","question":"（1/4）58歳の男性．今朝からのどが痛み，昼には唾も飲み込めないほどになったという．声がこもり，前かがみに座っている．上気道症状の進行速度を把握する質問はどれか．","options":[{"letter":"A","text":"以前も同じ症状がありましたか．"},{"letter":"B","text":"首を触ると痛みますか．"},{"letter":"C","text":"たばこを吸っていますか．"},{"letter":"D","text":"声をよく使う仕事ですか．"},{"letter":"E","text":"症状は何時間で進みましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：数時間で急速に進む咽頭痛と嚥下困難は気道閉塞の切迫を示す．含み声・流涎・起坐呼吸が揃えば分単位で悪化しうるため，進行の速さの把握が気道確保の準備の判断を決める．\n- A：再発歴に関する情報．\n- B：局所の圧痛に関する情報．\n- C：慢性病変の危険因子に関する情報．\n- D：声の使用歴に関する情報．\n- E：緊急度の判定に直結し有用．","images":[],"stem_images":[]},{"number":26,"section":"D-14-S07　58歳男性・急速に進む咽頭痛と嚥下困難","question":"（2/4）58歳の男性．今朝からのどが痛み，昼には唾も飲み込めないほどになったという．声がこもり，前かがみに座っている．症状は半日で急速に進んだという．口腔内を見ると咽頭の発赤は軽度であった．この所見の意味はどれか．","options":[{"letter":"A","text":"症状が軽いことを示している"},{"letter":"B","text":"病変が口腔の外にあることを示す"},{"le
