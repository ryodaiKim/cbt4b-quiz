謝異常は血管石灰化と骨折の危険を高める．\n- A：アミラーゼとリパーゼは膵疾患の指標．\n- B：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- C：クレアチンキナーゼは筋傷害の指標．\n- D：アンモニアは肝性脳症の指標．\n- E：慢性腎臓病に伴う骨・ミネラル代謝異常の評価で正しい．","images":[],"stem_images":[]},{"number":8,"section":"D-8-S02　66歳男性・健診で腎機能低下","question":"（4/4）66歳の男性．健康診断で血清クレアチニン1.9mg/dL，eGFR 29mL/分/1.73m2と指摘され来院した．自覚症状はない．20年前から高血圧で治療中だが，通院は不規則だったという．Hb 9.4g/dLで正球性正色素性であった．血清リン5.8mg/dL，副甲状腺ホルモンは高値であった．進行抑制のために最も重要なのはどれか．","options":[{"letter":"A","text":"血圧と蛋白尿の厳格な管理"},{"letter":"B","text":"蛋白質の摂取を大幅に増やす"},{"letter":"C","text":"水分摂取を1日500mLに制限"},{"letter":"D","text":"抗菌薬の長期予防的な投与"},{"letter":"E","text":"副腎皮質ステロイドの連日内服"}],"answer":["A"],"multi":false,"explanation":"解説：血圧を下げ蛋白尿を減らすことが腎機能の低下速度を最も確実に緩める．レニンアンジオテンシン系阻害薬とSGLT2阻害薬を用い，蛋白と塩分の適正化，禁煙，腎毒性薬剤の回避も併せて行う．\n- A：進行抑制の中心で正しい．\n- B：過剰な蛋白摂取は糸球体過剰濾過を招き進行を早める．\n- C：脱水は腎前性の悪化を招く．\n- D：抗菌薬の長期投与は適応がない．\n- E：ステロイドは糸球体腎炎の一部に用いるもので，本例の標準治療ではない．","images":[],"stem_images":[]},{"number":9,"section":"D-8-S03　78歳女性・食欲低下と意識の混濁","question":"（1/4）78歳の女性．1週間前から食欲がなく，本日は受け答えがぼんやりしているという．血清ナトリウム112mEq/Lであった．薬剤に関連する低ナトリウム血症を検討する家族への質問はどれか．","options":[{"letter":"A","text":"一日に水を何L飲みますか．"},{"letter":"B","text":"嘔吐や下痢がありますか．"},{"letter":"C","text":"食事の量は減りましたか．"},{"letter":"D","text":"足がむくんでいますか．"},{"letter":"E","text":"利尿薬や向精神薬を飲んでいますか．"}],"answer":["E"],"multi":false,"explanation":"解説：サイアザイド系利尿薬，選択的セロトニン再取り込み阻害薬，抗てんかん薬は低ナトリウム血症の頻度の高い薬剤性の原因である．中止で改善しうるため最初に確かめる．\n- A：水分摂取に関する情報．\n- B：体液喪失に関する情報．\n- C：溶質摂取に関する情報．\n- D：体液貯留に関する情報．\n- E：是正可能な原因を拾え有用．","images":[],"stem_images":[]},{"number":10,"section":"D-8-S03　78歳女性・食欲低下と意識の混濁","question":"（2/4）78歳の女性．1週間前から食欲がなく，本日は受け答えがぼんやりしているという．血清ナトリウム112mEq/Lであった．内服薬はなく，下痢も嘔吐もないという．次に評価すべきなのはどれか．","options":[{"letter":"A","text":"関節の腫脹と変形の有無"},{"letter":"B","text":"細胞外液量が減少しているか"},{"letter":"C","text":"甲状腺の圧痛の有無"},{"letter":"D","text":"足背動脈の拍動の有無"},{"letter":"E","text":"膝蓋腱反射の左右差"}],"answer":["B"],"multi":false,"explanation":"解説：低ナトリウム血症はまず体液量で分類する．皮膚ツルゴール・腋窩の乾燥・起立性低血圧があれば減少，浮腫や頸静脈怒張があれば増加，どちらでもなければ正常として鑑別を進める．\n- A：関節の腫脹と変形は関節リウマチの評価．\n- B：鑑別の出発点で正しい．\n- C：甲状腺の圧痛は亜急性甲状腺炎．\n- D：足背動脈の拍動は末梢動脈疾患の評価．\n- E：腱反射の左右差は神経学的局在の評価．","images":[],"stem_images":[]},{"number":11,"section":"D-8-S03　78歳女性・食欲低下と意識の混濁","question":"（3/4）78歳の女性．1週間前から食欲がなく，本日は受け答えがぼんやりしているという．血清ナトリウム112mEq/Lであった．内服薬はなく，下痢も嘔吐もないという．浮腫はなく皮膚のツルゴールも保たれ，体液量は正常と判断された．予想される検査所見はどれか．","options":[{"letter":"A","text":"尿浸透圧が低く尿中Naも低値"},{"letter":"B","text":"尿浸透圧が低く尿中Naは高値"},{"letter":"C","text":"尿浸透圧が高く尿中Naも高値"},{"letter":"D","text":"尿浸透圧が高く尿中Naは低値"},{"letter":"E","text":"尿検査に異常を認めない"}],"answer":["C"],"multi":false,"explanation":"解説：抗利尿ホルモンが不適切に分泌されると，血漿浸透圧が低いのに尿を濃縮し続け，体液量が保たれているためナトリウムの排泄も抑制されない．胸部画像で肺癌などの原因検索も行う．\n- A：尿浸透圧が低いのは水中毒や適切な希釈反応．\n- B：この組合せは低浸透圧尿であり，抗利尿ホルモンの作用と矛盾する．\n- C：抗利尿ホルモンの不適切分泌を反映し正しい．\n- D：尿中Na低値は体液量減少への反応で，脱水を示す．\n- E：明らかな低ナトリウム血症がある以上，尿所見に反映される．","images":[],"stem_images":[]},{"number":12,"section":"D-8-S03　78歳女性・食欲低下と意識の混濁","question":"（4/4）78歳の女性．1週間前から食欲がなく，本日は受け答えがぼんやりしているという．血清ナトリウム112mEq/Lであった．内服薬はなく，下痢も嘔吐もないという．浮腫はなく皮膚のツルゴールも保たれ，体液量は正常と判断された．尿浸透圧580mOsm/kg，尿中Na 62mEq/Lであった．補正を急ぎすぎた場合に起こる病態はどれか．","options":[{"letter":"A","text":"浸透圧性の脱髄症候群"},{"letter":"B","text":"急激な脳浮腫の進行"},{"letter":"C","text":"横紋筋融解による腎不全"},{"letter":"D","text":"悪性症候群の発症"},{"letter":"E","text":"低血糖による意識障害"}],"answer":["A"],"multi":false,"explanation":"解説：慢性の低ナトリウム血症では脳細胞が浸透圧物質を排出して適応しているため，急速に補正すると細胞が脱水して橋を中心に脱髄をきたす．1日8〜10mEq/L以内の緩徐な補正にとどめる．\n- A：急速補正の代表的な合併症で正しい．\n- B：脳浮腫は低ナトリウム血症そのものや過剰な低張輸液で起こる．\n- C：横紋筋融解は挫滅や薬剤，けいれんが誘因．\n- D：悪性症候群は抗精神病薬に関連する．\n- E：低血糖は糖代謝の異常によるもので，補正速度とは無関係．","images":[],"stem_images":[]},{"number":13,"section":"D-8-S04　68歳男性・脱力と不整脈","question":"（1/4）68歳の男性．2日前から手足に力が入らず，本日は動悸もするという．慢性腎臓病で通院中である．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から手指が朝にこわばりますか．"},{"letter":"B","text":"血圧や心臓の薬を教えてください．"},{"letter":"C","text":"カリウムのサプリを使いますか．"},{"letter":"D","text":"下痢や嘔吐はありますか．"},{"letter":"E","text":"尿量が減っていませんか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性関節症状は今回の電解質異常の緊急評価では優先度が低い．\n- A：慢性関節症状は今回の電解質異常の緊急評価では優先度が低い．この設問で選ぶ肢．\n- B：カリウムに影響する薬剤を確認．\n- C：過剰摂取を確認．\n- D：電解質喪失との鑑別に有用．\n- E：カリウム排泄低下を検討．","images":[],"stem_images":[]},{"number":14,"section":"D-8-S04　68歳男性・脱力と不整脈","question":"（2/4）68歳の男性．2日前から手足に力が入らず，本日は動悸もするという．慢性腎臓病で通院中である．アンジオテンシン変換酵素阻害薬とスピロノラクトンを内服しているという．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査の施行"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"12誘導心電図の記録"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["C"],"multi":false,"explanation":"解説：カリウム値そのものより心電図変化の有無が緊急度を決める．テント状T波，P波の平低化，PQ延長，QRS幅の増大と進み，最終的にはサインカーブとなって心停止に至る．\n- A：呼吸機能検査は換気障害の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：緊急度の判定に直結し正しい．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":15,"section":"D-8-S04　68歳男性・脱力と不整脈","question":"（3/4）68歳の男性．2日前から手足に力が入らず，本日は動悸もするという．慢性腎臓病で通院中である．アンジオテンシン変換酵素阻害薬とスピロノラクトンを内服しているという．12誘導心電図でテント状T波とQRS幅の増大を認めた．血清カリウムは7.4mEq/Lであった．まず投与すべきなのはどれか．","options":[{"letter":"A","text":"生理食塩水の急速投与"},{"letter":"B","text":"グルコン酸カルシウムの静注"},{"letter":"C","text":"副腎皮質ステロイドの静注"},{"letter":"D","text":"抗菌薬の全身投与"},{"letter":"E","text":"鎮痛薬の静脈内投与"}],"answer":["B"],"multi":false,"explanation":"解説：カルシウムは血清カリウム値を下げないが，心筋細胞膜の閾値を上げて致死性不整脈を防ぐ．続いてグルコース・インスリン療法やβ2刺激薬で細胞内へ移動させ，陽イオン交換樹脂や透析で体外へ除く．\n- A：生理食塩水だけではカリウムは十分に下がらない．\n- B：心筋の保護を即座に行え正しい．\n- C：ステロイドはカリウム異常の治療ではない．\n- D：抗菌薬は感染症の治療．\n- E：鎮痛薬は本例の病態に作用しない．","images":[],"stem_images":[]},{"number":16,"section":"D-8-S04　68歳男性・脱力と不整脈","question":"（4/4）68歳の男性．2日前から手足に力が入らず，本日は動悸もするという．慢性腎臓病で通院中である．アンジオテンシン変換酵素阻害薬とスピロノラクトンを内服しているという．12誘導心電図でテント状T波とQRS幅の増大を認めた．血清カリウムは7.4mEq/Lであった．逆にカリウムが低下したときに予想される心電図所見はどれか．","options":[{"letter":"A","text":"テント状の尖鋭なT波"},{"letter":"B","text":"全誘導での著明なST上昇"},{"letter":"C","text":"鋸歯状のF波の出現"},{"letter":"D","text":"幅広いQRS波の連発"},{"letter":"E","text":"U波の出現とST低下"}],"answer":["E"],"multi":false,"explanation":"解説：低カリウム血症では再分極が遅れ，T波の平低化に続いてU波が目立ち，ST低下とQT延長をきたす．筋力低下・便秘・多尿・ジギタリス中毒の増悪も伴い，torsades de pointes の危険がある．\n- A：テント状T波は高カリウム血症．\n- B：全誘導のST上昇は急性心膜炎．\n- C：鋸歯状F波は心房粗動．\n- D：幅広いQRS波の連発は心室頻拍．\n- E：低カリウム血症の典型的な所見で正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-8-S05　64歳女性・多飲多尿と便秘","question":"（1/4）64歳の女性．3か月前から喉が渇いて水をよく飲み，尿の回数も増えたという．便秘も強くなった．血清カルシウム12.8mg/dLであった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"尿路結石の経験はありますか．"},{"letter":"B","text":"長く寝たきりでしたか．"},{"letter":"C","text":"ビタミンDやカルシウムを飲みますか．"},{"letter":"D","text":"以前からいびきをかきますか．"},{"letter":"E","text":"体重減少や骨痛はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性いびきは高カルシウム血症の原因検索では優先度が低い．\n- A：持続性高カルシウム血症の徴候を確認．\n- B：不動に伴う骨吸収を検討．\n- C：薬剤・サプリによる上昇を検討．\n- D：慢性いびきは高カルシウム血症の原因検索では優先度が低い．この設問で選ぶ肢．\n- E：悪性疾患を疑う症状を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-8-S05　64歳女性・多飲多尿と便秘","question":"（2/4）64歳の女性．3か月前から喉が渇いて水をよく飲み，尿の回数も増えたという．便秘も強くなった．血清カルシウム12.8mg/dLであった．体重減少も骨の痛みもないという．多尿の機序はどれか．","options":[{"letter":"A","text":"腎尿細管での水再吸収の障害"},{"letter":"B","text":"浸透圧利尿による水の喪失"},{"letter":"C","text":"抗利尿ホルモンの過剰分泌"},{"letter":"D","text":"糸球体濾過量の急激な増加"},{"letter":"E","text":"膀胱の排尿筋の過活動"}],"answer":["A"],"multi":false,"explanation":"解説：高カルシウム血症は集合管での抗利尿ホルモンへの反応を妨げ，腎性尿崩症の状態をつくる．尿を濃縮できず多尿となり，脱水がさらに高カルシウム血症を悪化させる悪循環に入る．\n- A：腎性尿崩症の機序で正しい．\n- B：浸透圧利尿は高血糖や高窒素血症で起こる．\n- C：抗利尿ホルモンの過剰分泌ではむしろ乏尿と低ナトリウム血症になる．\n- D：糸球体濾過量の増加では説明がつかない．\n- E：排尿筋過活動は頻尿をきたすが，1回量の多い多尿にはならない．","images":[],"stem_images":[]},{"number":19,"section":"D-8-S05　64歳女性・多飲多尿と便秘","question":"（3/4）64歳の女性．3か月前から喉が渇いて水をよく飲み，尿の回数も増えたという．便秘も強くなった．血清カルシウム12.8mg/dLであった．体重減少も骨の痛みもなく，服用中の薬やサプリメントもないという．次に測定すべきなのはどれか．","options":[{"letter":"A","text":"血中アンモニアの値"},{"letter":"B","text":"血清アミラーゼの値"},{"letter":"C","text":"副甲状腺ホルモンの値"},{"letter":"D","text":"呼気中一酸化窒素濃度"},{"letter":"E","text":"血清クレアチンキナーゼ"}],"answer":["C"],"multi":false,"explanation":"解説：高カルシウム血症に対して副甲状腺ホルモンが抑制されず正常〜高値なら原発性副甲状腺機能亢進症を示す．抑制されていれば悪性腫瘍や活性型ビタミンD過剰を考え，鑑別の方向が分かれる．\n- A：アンモニアは肝性脳症の指標．\n- B：アミラーゼは膵疾患の指標．\n- C：鑑別の分岐点となり正しい．\n- D：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- E：クレアチンキナーゼは筋傷害の指標．","images":[],"stem_images":[]},{"number":20,"section":"D-8-S05　64歳女性・多飲多尿と便秘","question":"（4/4）64歳の女性．3か月前から喉が渇いて水をよく飲み，尿の回数も増えたという．便秘も強くなった．血清カルシウム12.8mg/dLであった．体重減少も骨の痛みもなく，服用中の薬やサプリメントもないという．副甲状腺ホルモンは高値であった．逆にカルシウムが低下したときにみられる所見はどれか．","options":[{"letter":"A","text":"深部腱反射の全般的な消失"},{"letter":"B","text":"上腕を圧迫すると手が攣縮する"},{"letter":"C","text":"安静時の粗大な振戦の出現"},{"letter":"D","text":"眼球結膜の著明な黄染"},{"letter":"E","text":"腹壁全体の板状硬と反跳痛"}],"answer":["B"],"multi":false,"explanation":"解説：血圧計のマンシェットで上腕を加圧すると助産師手位の攣縮が出るのがTrousseau徴候，耳前部を叩くと顔面筋が収縮するのがChvostek徴候で，いずれも神経筋の被刺激性亢進を示す．QT延長も伴う．\n- A：腱反射の全般的消失は末梢神経障害．\n- B：低カルシウム血症の代表的な誘発試験で正しい．\n- C：安静時の粗大な振戦はParkinson病．\n- D：眼球結膜の黄染は黄疸．\n- E：板状硬と反跳痛は汎発性腹膜炎．","images":[],"stem_images":[]},{"number":21,"section":"D-8-S06　8歳男児・コーラ色の尿","question":"（1/4）8歳の男児．昨日から尿の色が濃い茶色になり，まぶたが腫れているという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"頭痛や吐き気はありますか．"},{"letter":"B","text":"数週間前にのどが痛みましたか．"},{"letter":"C","text":"最近，とびひがありましたか．"},{"letter":"D","text":"尿の量が減りましたか．"},{"letter":"E","text":"乳歯は何本抜けましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．歯の生え替わりは急性腎炎症状の評価では優先度が低い．\n- A：高血圧に伴う症状を確認．\n- B：先行感染を確認．\n- C：皮膚感染の先行を確認．\n- D：腎障害と体液貯留を評価．\n- E：歯の生え替わりは急性腎炎症状の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":22,"section":"D-8-S06　8歳男児・コーラ色の尿","question":"（2/4）8歳の男児．昨日から尿の色が濃い茶色になり，まぶたが腫れているという．3週間前に発熱とのどの痛みがあり，抗菌薬を数日飲んだという．認められる所見はどれか．","options":[{"letter":"A","text":"起立性の著明な低血圧"},{"letter":"B","text":"皮膚のツルゴールの低下"},{"letter":"C","text":"血圧の上昇と眼瞼の浮腫"},{"letter":"D","text":"甲状腺のびまん性の腫大"},{"letter":"E","text":"腹部の板状硬と反跳痛"}],"answer":["C"],"multi":false,"explanation":"解説：糸球体の濾過が落ちてナトリウムと水が貯留するため，循環血漿量が増えて血圧が上がり，浮腫が出る．血尿・浮腫・高血圧の三徴が揃うのがこの疾患の典型像である．\n- A：起立性低血圧は体液量減少を示し，本例とは逆の病態．\n- B：ツルゴール低下も脱水の所見．\n- C：体液貯留を反映し正しい．\n- D：甲状腺腫大はBasedow病や橋本病．\n- E：板状硬と反跳痛は汎発性腹膜炎．","images":[],"stem_images":[]},{"number":23,"section":"D-8-S06　8歳男児・コーラ色の尿","question":"（3/4）8歳の男児．昨日から尿の色が濃い茶色になり，まぶたが腫れているという．3週間前に発熱とのどの痛みがあり，抗菌薬を数日飲んだという．血圧136/88mmHg．尿検査で潜血3+，蛋白2+，赤血球円柱を認める．予想される血液検査所見はどれか．","options":[{"letter":"A","text":"血清IgAの著明な上昇"},{"letter":"B","text":"抗核抗体の著明な高値"},{"letter":"C","text":"抗好中球細胞質抗体の陽性"},{"letter":"D","text":"血清C3の低下とASO上昇"},{"letter":"E","text":"抗ミトコンドリア抗体の陽性"}],"answer":["D"],"multi":false,"explanation":"解説：免疫複合体が糸球体に沈着して補体が消費されるため血清C3が低下し，先行感染の証拠としてASOやASK抗体が上昇する．C3は経過とともに6〜8週で回復するのが特徴である．\n- A：血清IgAの上昇はIgA腎症の一部でみられる．\n- B：抗核抗体の高値はループス腎炎．\n- C：抗好中球細胞質抗体はANCA関連血管炎．\n- D：この疾患に特徴的な組合せで正しい．\n- E：抗ミトコンドリア抗体は原発性胆汁性胆管炎．","images":[],"stem_images":[]},{"number":24,"section":"D-8-S06　8歳男児・コーラ色の尿","question":"（4/4）8歳の男児．昨日から尿の色が濃い茶色になり，まぶたが腫れているという．3週間前に発熱とのどの痛みがあり，抗菌薬を数日飲んだという．血圧136/88mmHg．尿検査で潜血3+，蛋白2+，赤血球円柱を認める．血清C3が低下しASOが上昇していた．最も適切な対応はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドを直ちに開始"},{"letter":"B","text":"塩分と水分を制限し安静とする"},{"letter":"C","text":"免疫抑制薬の導入を検討する"},{"letter":"D","text":"直ちに血液透析を導入する"},{"letter":"E","text":"高蛋白食で栄養状態を改善する"}],"answer":["B"],"multi":false,"explanation":"解説：小児例の大半は自然に軽快するため，塩分・水分の制限と安静，必要に応じた降圧薬と利尿薬で経過をみる．血尿は数か月残ることがあるが，腎機能は多くが正常化する．\n- A：ステロイドは一般に不要で，自然経過が良好である．\n- B：この疾患の標準的な対応で正しい．\n- C：免疫抑制薬も通常は適応にならない．\n- D：透析が必要になる例はまれである．\n- E：高蛋白食は糸球体への負荷を増やす．","images":[],"stem_images":[]},{"number":25,"section":"D-8-S07　24歳男性・健診で血尿と蛋白尿","question":"（1/4）24歳の男性．健康診断で尿潜血2+，尿蛋白1+を指摘され来院した．自覚症状はない．肉眼的血尿と上気道感染の時期的関係を確認する質問はどれか．","options":[{"letter":"A","text":"排尿時に痛みがありますか．"},{"letter":"B","text":"激しい運動の後に出ますか．"},{"letter":"C","text":"風邪をひくと尿が赤くなりますか．"},{"letter":"D","text":"血の塊が尿に混じりますか．"},{"letter":"E","text":"家族にも血尿がありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：上気道感染と同時か1〜2日以内に肉眼的血尿が出るなら，本邦で最多の慢性糸球体腎炎を強く疑う．感染から1〜3週遅れて発症する溶連菌感染後急性糸球体腎炎との時間差が鑑別の核になる．\n- A：尿路の刺激症状に関する情報．\n- B：運動との関係に関する情報．\n- C：感染との時間関係を確かめ有用．\n- D：血尿の性状に関する情報．\n- E：家族歴に関する情報．","images":[],"stem_images":[]},{"number":26,"section":"D-8-S07　24歳男性・健診で血尿と蛋白尿","question":"（2/4）24歳の男性．健康診断で尿潜血2+，尿蛋白1+を指摘され来院した．自覚症状はない．風邪をひいた日や翌日に尿が赤くなることが年に数回あるという．尿沈渣で予想される所見はどれか．","options":[{"letter":"A","text":"変形赤血球と赤血球円柱"},{"letter":"B","text":"白血球円柱と細菌の多数"},{"letter":"C","text":"六角形の結晶の多数"},{"letter":"D","text":"扁平上皮細胞のみの増加"},{"letter":"E","text":"卵円形脂肪体の多数出現"}],"answer":["A"],"multi":false,"explanation":"解説：糸球体基底膜を通り抜ける際に変形した赤血球と，尿細管内で固まった赤血球円柱は糸球体性の血尿を示す．均一な形の赤血球であれば尿路系からの出血を考えることになる．\n- A：糸球体性血尿を示し正しい．\n- B：白血球円柱と細菌は腎盂腎炎．\n- C：六角形の結晶はシスチン尿症．\n- D：扁平上皮細胞の増加は検体の汚染．\n- E：卵円形脂肪体はネフローゼ症候群．","images":[],"stem_images":[]},{"number":27,"section":"D-8-S07　24歳男性・健診で血尿と蛋白尿","question":"（3/4）24歳の男性．健康診断で尿潜血2+，尿蛋白1+を指摘され来院した．自覚症状はない．風邪をひいた日や翌日に尿が赤くなることが年に数回あるという．尿沈渣で変形赤血球と赤血球円柱を認め，血清クレアチニンは0.9mg/dLであった．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"腹部単純エックス線撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"腎生検の施行"}],"answer":["E"],"multi":false,"explanation":"解説：蛍光抗体法でメサンギウム領域にIgAが主体に沈着することを示して確定する．光学顕微鏡でのメサンギウム細胞増多と基質増加，予後因子となる硬化や半月体の割合も同時に評価する．\n- A：腹部単純写真は結石や腸閉塞の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：確定診断に不可欠で正しい．","images":[],"stem_images":[]},{"number":28,"section":"D-8-S07　24歳男性・健診で血尿と蛋白尿","question":"（4/4）24歳の男性．健康診断で尿潜血2+，尿蛋白1+を指摘され来院した．自覚症状はない．風邪をひいた日や翌日に尿が赤くなることが年に数回あるという．尿沈渣で変形赤血球と赤血球円柱を認め，血清クレアチニンは0.9mg/dLであった．腎生検でメサンギウム領域へのIgA沈着を認めた．この疾患の経過として正しいのはどれか．","options":[{"letter":"A","text":"数週で自然に完全治癒する"},{"letter":"B","text":"全例が急速に腎不全へ進む"},{"letter":"C","text":"血尿のみで蛋白尿は出ない"},{"letter":"D","text":"一部は長期に腎機能が低下する"},{"letter":"E","text":"感染のたびに完全に治癒する"}],"answer":["D"],"multi":false,"explanation":"解説：長い経過で一部が末期腎不全に至るため，蛋白尿の量と腎機能，組織の硬化の程度で予後を層別化する．レニンアンジオテンシン系阻害薬，扁桃摘出とステロイドパルス療法などで進行を抑える．\n- A：完全治癒する経過ではなく慢性に経過する．\n- B：急速に進行するのは一部の症例にとどまる．\n- C：蛋白尿も出現し，その量が予後を左右する．\n- D：慢性糸球体腎炎としての経過で正しい．\n- E：感染ごとの肉眼的血尿は消えるが，基礎の病変は残る．","images":[],"stem_images":[]},{"number":29,"section":"D-8-S08　58歳男性・全身の浮腫","question":"（1/4）58歳の男性．2週間前から足のむくみが強くなり，まぶたも腫れるという．尿が泡立つようになった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"息苦しさはありますか．"},{"letter":"B","text":"以前から乗り物酔いをしますか．"},{"letter":"C","text":"最近，新しい薬を飲みましたか．"},{"letter":"D","text":"体重はどれだけ増えましたか．"},{"letter":"E","text":"糖尿病や膠原病はありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．乗り物酔いは浮腫と蛋白尿の原因検索では優先度が低い．\n- A：肺うっ血や胸水の影響を確認．\n- B：乗り物酔いは浮腫と蛋白尿の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：薬剤性腎障害を検討．\n- D：体液貯留の程度を確認．\n- E：蛋白尿の背景疾患を確認．","images":[],"stem_images":[]},{"number":30,"section":"D-8-S08　58歳男性・全身の浮腫","question":"（2/4）58歳の男性．2週間前から足のむくみが強くなり，まぶたも腫れるという．尿が泡立つようになった．2週間で体重が7kg増えたという．予想される検査所見の組合せはどれか．","options":[{"letter":"A","text":"高度蛋白尿と血清アルブミン高値"},{"letter":"B","text":"血尿主体で蛋白尿はごく軽度"},{"letter":"C","text":"血清総コレステロールの著明な低下"},{"letter":"D","text":"尿蛋白は陰性で血清アルブミン低値"},{"letter":"E","text":"高度蛋白尿と低アルブミン血症"}],"answer":["E"],"multi":false,"explanation":"解説：1日3.5g以上の蛋白尿と血清アルブミン3.0g/dL以下が診断の必須項目で，浮腫と脂質異常を伴う．肝でのリポ蛋白合成が代償性に増えるため，総コレステロールはむしろ上昇する．\n- A：アルブミンは尿へ失われて低下する．\n- B：血尿主体は腎炎症候群の型．\n- C：コレステロールは上昇する．\n- D：尿蛋白が陰性ならこの病態にあたらない．\n- E：診断の必須項目そのもので正しい．","images":[],"stem_images":[]},{"number":31,"section":"D-8-S08　58歳男性・全身の浮腫","question":"（3/4）58歳の男性．2週間前から足のむくみが強くなり，まぶたも腫れるという．尿が泡立つようになった．2週間で体重が7kg増えたという．尿蛋白8.2g/日，血清アルブミン1.9g/dL，総コレステロール342mg/dLであった．腎生検を行った．成人の一次性で最も多い組織型はどれか．","options":[{"letter":"A","text":"微小変化型のネフローゼ症候群"},{"letter":"B","text":"半月体形成性の糸球体腎炎"},{"letter":"C","text":"アミロイドの糸球体沈着"},{"letter":"D","text":"膜性腎症"},{"letter":"E","text":"糖尿病性の結節性病変"}],"answer":["D"],"multi":false,"explanation":"解説：糸球体基底膜の上皮側に免疫複合体が沈着して基底膜がびまん性に肥厚する．成人の一次性ネフローゼでは最も頻度が高く，悪性腫瘍・薬剤・感染に伴う二次性の検索も必要になる．\n- A：微小変化型は小児に多く，成人でも起こるが一次性の最多ではない．\n- B：半月体形成性糸球体腎炎は急速進行性腎炎症候群の型．\n- C：アミロイド沈着は全身性アミロイドーシスによる二次性．\n- D：成人一次性の最多であり正しい．\n- E：結節性病変は糖尿病性腎症．","images":[],"stem_images":[]},{"number":32,"section":"D-8-S08　58歳男性・全身の浮腫","question":"（4/4）58歳の男性．2週間前から足のむくみが強くなり，まぶたも腫れるという．尿が泡立つようになった．2週間で体重が7kg増えたという．尿蛋白8.2g/日，血清アルブミン1.9g/dL，総コレステロール342mg/dLであった．腎生検で膜性腎症と診断された．最も警戒すべき合併症はどれか．","options":[{"letter":"A","text":"溶血発作を繰り返すこと"},{"letter":"B","text":"急性膵炎を発症すること"},{"letter":"C","text":"甲状腺機能が亢進すること"},{"letter":"D","text":"静脈血栓塞栓症を起こすこと"},{"letter":"E","text":"上行性の弛緩性麻痺が出ること"}],"answer":["D"],"multi":false,"explanation":"解説：アンチトロンビンなどの凝固制御因子が尿中へ失われ，血液が濃縮して凝固しやすくなる．とくに膜性腎症では腎静脈血栓症と肺血栓塞栓症の危険が高く，突然の側腹部痛や呼吸困難に注意する．\n- A：溶血発作の反復は自己免疫性溶血性貧血など．\n- B：急性膵炎は胆石やアルコールが主因．\n- C：甲状腺機能亢進はこの病態と関連しない．\n- D：この病態の代表的な合併症で正しい．\n- E：上行性の弛緩性麻痺はGuillain-Barré症候群．","images":[],"stem_images":[]},{"number":33,"section":"D-8-S09　28歳女性・発熱と側腹部痛","question":"（1/4）28歳の女性．3日前から排尿時の痛みと頻尿があり，本日から39℃の発熱と右の背中の痛みが出たという．検査・薬剤の選択に先立ち生殖に関して確認する質問はどれか．","options":[{"letter":"A","text":"抗菌薬のアレルギーはありますか．"},{"letter":"B","text":"腎臓の機能が低いと言われましたか．"},{"letter":"C","text":"尿路結石の経験はありますか．"},{"letter":"D","text":"最近，抗菌薬を使いましたか．"},{"letter":"E","text":"妊娠している可能性はありますか．"}],"answer":["E"],"multi":false,"explanation":"解説：妊娠では尿管の拡張と蠕動低下により上行感染を起こしやすく，重症化すると早産の危険がある．画像検査と抗菌薬の選択の両方が変わるため，若年女性では必ず最初に確認する．\n- A：薬剤選択に関わるアレルギー歴に関する情報．\n- B：腎機能に関する情報．\n- C：閉塞性病変に関する情報．\n- D：耐性菌のリスクに関する情報．\n- E：検査と治療の選択を左右し有用．","images":[],"stem_images":[]},{"number":34,"section":"D-8-S09　28歳女性・発熱と側腹部痛","question":"（2/4）28歳の女性．3日前から排尿時の痛みと頻尿があり，本日から39℃の発熱と右の背中の痛みが出たという．妊娠の可能性はないという．認められる所見はどれか．","options":[{"letter":"A","text":"右の肋骨脊柱角の叩打痛"},{"letter":"B","text":"右季肋部の吸気で止まる圧痛"},{"letter":"C","text":"右下腹部の圧痛と反跳痛"},{"letter":"D","text":"臍周囲の拍動性腫瘤の触知"},{"letter":"E","text":"左下腹部の限局した圧痛"}],"answer":["A"],"multi":false,"explanation":"解説：腎が炎症で腫大して被膜が伸展するため，背部の肋骨と脊柱のなす角を軽く叩くと響くような痛みが出る．膀胱炎では発熱もこの叩打痛もなく，上行感染の有無を分ける所見になる．\n- A：腎実質の炎症を示し正しい．\n- B：吸気で止まる右季肋部の圧痛は急性胆嚢炎．\n- C：右下腹部の圧痛と反跳痛は急性虫垂炎．\n- D：拍動性腫瘤は腹部大動脈瘤．\n- E：左下腹部の限局した圧痛は大腸憩室炎．","images":[],"stem_images":[]},{"number":35,"section":"D-8-S09　28歳女性・発熱と側腹部痛","question":"（3/4）28歳の女性．3日前から排尿時の痛みと頻尿があり，本日から39℃の発熱と右の背中の痛みが出たという．妊娠の可能性はないという．体温39.2℃，脈拍104/分．右の肋骨脊柱角に叩打痛を認める．まず行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査の施行"},{"letter":"B","text":"尿検査と尿培養の提出"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["B"],"multi":false,"explanation":"解説：膿尿と細菌尿を確認し，抗菌薬投与前に培養を提出して起因菌と感受性を押さえる．発熱があるので血液培養も併せて採り，重症例では閉塞の有無を画像で確かめる．\n- A：呼吸機能検査は換気障害の評価．\n- B：診断と起因菌の同定に直結し正しい．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":36,"section":"D-8-S09　28歳女性・発熱と側腹部痛","question":"（4/4）28歳の女性．3日前から排尿時の痛みと頻尿があり，本日から39℃の発熱と右の背中の痛みが出たという．妊娠の可能性はないという．体温39.2℃，脈拍104/分．右の肋骨脊柱角に叩打痛を認める．尿検査で白血球多数と細菌を認め，尿培養からグラム陰性桿菌が検出された．発熱がなく排尿時痛と頻尿だけの段階の病態はどれか．","options":[{"letter":"A","text":"腎実質まで炎症が及んだ状態"},{"letter":"B","text":"尿管が結石で閉塞した状態"},{"letter":"C","text":"膀胱粘膜に限局した炎症"},{"letter":"D","text":"腎に膿瘍が形成された状態"},{"letter":"E","text":"前立腺に炎症が及んだ状態"}],"answer":["C"],"multi":false,"explanation":"解説：膀胱に限局している間は発熱も肋骨脊柱角の叩打痛もなく，排尿痛・頻尿・残尿感・尿意切迫が主症状になる．ここから上行すると発熱と側腹部痛が加わり，腎盂腎炎の像になる．\n- A：腎実質への波及が本例の現在の状態である．\n- B：結石による閉塞では疝痛と血尿が前景に立つ．\n- C：発熱を欠く段階の病態として正しい．\n- D：腎膿瘍では抗菌薬に反応しない持続する発熱をきたす．\n- E：前立腺炎は男性の病態で，本例には当てはまらない．","images":[],"stem_images":[]},{"number":37,"section":"D-8-S10　62歳男性・糖尿病経過中の蛋白尿","question":"（1/4）62歳の男性．15年前から2型糖尿病で通院している．最近の検査で尿蛋白1+，血清クレアチニン1.3mg/dLと指摘された．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"子どもの頃に中耳炎がありましたか．"},{"letter":"B","text":"最近，薬が変わりましたか．"},{"letter":"C","text":"血糖の経過はどうですか．"},{"letter":"D","text":"眼底の検査を受けていますか．"},{"letter":"E","text":"血尿が出たことはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．小児期の中耳炎は現在の蛋白尿の評価では優先度が低い．\n- A：小児期の中耳炎は現在の蛋白尿の評価では優先度が低い．この設問で選ぶ肢．\n- B：薬剤と腎機能の関係を確認．\n- C：糖尿病の管理状況を確認．\n- D：他の細小血管合併症を確認．\n- E：糖尿病以外の腎疾患を検討．","images":[],"stem_images":[]},{"number":38,"section":"D-8-S10　62歳男性・糖尿病経過中の蛋白尿","question":"（2/4）62歳の男性．15年前から2型糖尿病で通院している．最近の検査で尿蛋白1+，血清クレアチニン1.3mg/dLと指摘された．5年前から増殖前網膜症で眼科に通院しているという．この病変の最も早期の指標はどれか．","options":[{"letter":"A","text":"血清クレアチニンの上昇"},{"letter":"B","text":"尿沈渣の赤血球円柱"},{"letter":"C","text":"尿中微量アルブミンの増加"},{"letter":"D","text":"血清アルブミンの低下"},{"letter":"E","text":"尿浸透圧の著明な低下"}],"answer":["C"],"multi":false,"explanation":"解説：試験紙で蛋白尿が検出される前の段階でアルブミンの漏出が始まっており，これを定量することで早期に介入できる．年1回以上の測定が糖尿病の標準的な管理項目になっている．\n- A：クレアチニンの上昇はかなり進んでからしか現れない．\n- B：赤血球円柱は糸球体腎炎を示唆し，本病変の早期指標ではない．\n- C：早期発見の指標として正しい．\n- D：アルブミン低下はネフローゼに至ってから現れる．\n- E：尿濃縮力の低下も進行期の所見．","images":[],"stem_images":[]},{"number":39,"section":"D-8-S10　62歳男性・糖尿病経過中の蛋白尿","question":"（3/4）62歳の男性．15年前から2型糖尿病で通院している．最近の検査で尿蛋白1+，血清クレアチニン1.3mg/dLと指摘された．5年前から増殖前網膜症で眼科に通院しているという．尿中アルブミンは450mg/gCrであった．腎生検を行った場合に予想される所見はどれか．","options":[{"letter":"A","text":"半月体の広範な形成"},{"letter":"B","text":"メサンギウム領域へのIgA沈着"},{"letter":"C","text":"基底膜上皮側への免疫複合体沈着"},{"letter":"D","text":"結節性の糸球体硬化"},{"letter":"E","text":"糸球体にほとんど異常を認めない"}],"answer":["D"],"multi":false,"explanation":"解説：メサンギウム基質が結節状に増生してKimmelstiel-Wilson結節と呼ばれる病変をつくり，基底膜のびまん性肥厚と輸入・輸出細動脈の硝子化を伴う．この所見は糖尿病に比較的特異的である．\n- A：半月体の広範な形成は急速進行性腎炎症候群．\n- B：メサンギウムへのIgA沈着はIgA腎症．\n- C：基底膜上皮側への沈着は膜性腎症．\n- D：糖尿病性腎症の特徴的な病変で正しい．\n- E：光学顕微鏡で異常を認めないのは微小変化型．","images":[],"stem_images":[]},{"number":40,"section":"D-8-S10　62歳男性・糖尿病経過中の蛋白尿","question":"（4/4）62歳の男性．15年前から2型糖尿病で通院している．最近の検査で尿蛋白1+，血清クレアチニン1.3mg/dLと指摘された．5年前から増殖前網膜症で眼科に通院しているという．尿中アルブミンは450mg/gCrで，血圧は148/86mmHg，HbA1cは8.4%であった．腎保護のために優先すべき治療はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの内服"},{"letter":"B","text":"レニンアンジオテンシン系阻害薬"},{"letter":"C","text":"抗菌薬の長期予防的な投与"},{"letter":"D","text":"免疫抑制薬の導入を行う"},{"letter":"E","text":"水分摂取を1日500mLに制限"}],"answer":["B"],"multi":false,"explanation":"解説：輸出細動脈を拡張させて糸球体内圧を下げ，蛋白尿を減らして進行を遅らせる．血糖と血圧の厳格な管理，SGLT2阻害薬の併用，減塩と禁煙を組み合わせるのが標準的な腎保護となる．\n- A：ステロイドは糖尿病を悪化させ，この病変には無効．\n- B：蛋白尿の減少と腎保護に直結し正しい．\n- C：抗菌薬は感染症の治療．\n- D：免疫抑制薬は免疫介在性の糸球体疾患に用いる．\n- E：水分制限は脱水と腎前性障害を招く．","images":[],"stem_images":[]},{"number":41,"section":"D-8-S11　42歳男性・突然の側腹部痛","question":"（1/4）42歳の男性．早朝に突然左の脇腹が激しく痛み，じっとしていられないという．悪心と嘔吐を伴う．側腹部痛の放散先を明らかにする質問はどれか．","options":[{"letter":"A","text":"痛みは波のように強まりますか．"},{"letter":"B","text":"じっとしていると楽ですか．"},{"letter":"C","text":"発熱や悪寒はありますか．"},{"letter":"D","text":"痛みはどこへ広がりますか．"},{"letter":"E","text":"同じ痛みを経験しましたか．"}],"answer":["D"],"multi":false,"explanation":"解説：結石の位置により関連痛の広がり方が変わり，上部尿管なら側腹部から腰背部へ，下部尿管なら鼠径部や陰嚢・大陰唇へ放散する．体をよじって痛がる様子は，安静を好む腹膜炎との対比になる．\n- A：痛みの時間的性状に関する情報．\n- B：体動との関係に関する情報．\n- C：感染の合併に関する情報．\n- D：病変の位置推定に直結し有用．\n- E：再発歴に関する情報．","images":[],"stem_images":[]},{"number":42,"section":"D-8-S11　42歳男性・突然の側腹部痛","question":"（2/4）42歳の男性．早朝に突然左の脇腹が激しく痛み，じっとしていられないという．悪心と嘔吐を伴う．痛みは左の鼠径部から陰嚢にかけて広がるという．予想される尿所見はどれか．","options":[{"letter":"A","text":"白血球円柱と多数の細菌"},{"letter":"B","text":"顕微鏡的血尿の出現"},{"letter":"C","text":"卵円形脂肪体の多数出現"},{"letter":"D","text":"尿蛋白のみが高度に陽性"},{"letter":"E","text":"尿検査に異常を認めない"}],"answer":["B"],"multi":false,"explanation":"解説：結石が尿路の粘膜を傷つけるため，肉眼的または顕微鏡的な血尿が高率にみられる．ただし完全閉塞では血尿が出ないこともあり，血尿がないことは診断の否定にならない．\n- A：白血球円柱と細菌は腎盂腎炎．\n- B：この病態で最も多い尿所見で正しい．\n- C：卵円形脂肪体はネフローゼ症候群．\n- D：高度の蛋白尿のみは糸球体疾患．\n- E：多くの症例で血尿が検出される．","images":[],"stem_images":[]},{"number":43,"section":"D-8-S11　42歳男性・突然の側腹部痛","question":"（3/4）42歳の男性．早朝に突然左の脇腹が激しく痛み，じっとしていられないという．悪心と嘔吐を伴う．痛みは左の鼠径部から陰嚢にかけて広がるという．尿潜血2+を認める．体温36.5℃で，腹部を押しても圧痛はない．診断に最も感度の高い検査はどれか．","options":[{"letter":"A","text":"腹部単純エックス線撮影"},{"letter":"B","text":"上部消化管内視鏡の施行"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"骨シンチグラフィの撮影"},{"letter":"E","text":"腹部単純CTの撮影"}],"answer":["E"],"multi":false,"explanation":"解説：尿酸結石のようにエックス線に写らない結石も含めてほぼすべてを描出でき，結石の位置・大きさと水腎症の程度を同時に評価できる．他の急性腹症の除外にも使える．\n- A：単純写真では尿酸結石や小さな結石は写らない．\n- B：内視鏡は消化管疾患の評価．\n- C：呼吸機能検査は換気障害の評価．\n- D：骨シンチグラフィは骨病変の検索．\n- E：最も感度が高く正しい．","images":[],"stem_images":[]},{"number":44,"section":"D-8-S11　42歳男性・突然の側腹部痛","question":"（4/4）42歳の男性．早朝に突然左の脇腹が激しく痛み，じっとしていられないという．悪心と嘔吐を伴う．痛みは左の鼠径部から陰嚢にかけて広がるという．尿潜血2+を認める．体温36.5℃で，腹部を押しても圧痛はない．腹部単純CTで左尿管下部に5mmの結石と軽度の水腎症を認めた．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに開腹して結石を摘出する"},{"letter":"B","text":"抗菌薬を長期に予防投与する"},{"letter":"C","text":"鎮痛と補水で自然排石を待つ"},{"letter":"D","text":"水分摂取を1日500mLに制限する"},{"letter":"E","text":"副腎皮質ステロイドを開始する"}],"answer":["C"],"multi":false,"explanation":"解説：10mm未満の結石は多くが自然に排石されるため，非ステロイド性抗炎症薬による鎮痛と十分な飲水で経過をみる．排石を促す薬剤を併用し，発熱や腎機能悪化があれば速やかに泌尿器科へつなぐ．\n- A：この大きさで緊急の外科的摘出は適応にならない．\n- B：感染を伴わない限り抗菌薬は不要．\n- C：標準的な保存的対応で正しい．\n- D：水分制限は結石の排出を妨げ再発も招く．\n- E：ステロイドはこの病態の治療ではない．","images":[],"stem_images":[]},{"number":45,"section":"D-8-S12　58歳女性・尿もれ","question":"（1/4）58歳の女性．1年前から尿が漏れるようになり，外出が億劫だという．出産は3回ある．尿失禁の病型を分けるために尋ねる質問はどれか．","options":[{"letter":"A","text":"一日に何回漏れますか．"},{"letter":"B","text":"一回にどのくらい漏れますか．"},{"letter":"C","text":"パッドを何枚使いますか．"},{"letter":"D","text":"いつから尿もれがありますか．"},{"letter":"E","text":"どんなときに漏れますか．"}],"answer":["E"],"multi":false,"explanation":"解説：咳・くしゃみ・重量物挙上など腹圧がかかった瞬間に漏れるのが腹圧性，急に強い尿意が来て間に合わないのが切迫性である．この区別で治療法が根本的に変わるため最初に確かめる．\n- A：失禁の頻度に関する情報．\n- B：失禁の量に関する情報．\n- C：生活への影響に関する情報．\n- D：発症時期に関する情報．\n- E：病型の決定に直結し有用．","images":[],"stem_images":[]},{"number":46,"section":"D-8-S12　58歳女性・尿もれ","question":"（2/4）58歳の女性．1年前から尿が漏れるようになり，外出が億劫だという．出産は3回ある．咳やくしゃみをした瞬間に漏れ，急に強い尿意が来ることはないという．この病型の背景にあるのはどれか．","options":[{"letter":"A","text":"排尿筋の不随意な収縮"},{"letter":"B","text":"骨盤底筋群の支持の低下"},{"letter":"C","text":"膀胱の知覚神経の過敏化"},{"letter":"D","text":"尿道の完全な閉塞"},{"letter":"E","text":"中枢神経の脱髄病変"}],"answer":["B"],"multi":false,"explanation":"解説：妊娠・分娩や加齢，肥満で骨盤底の支持組織が緩み，腹圧の上昇が膀胱にだけかかって尿道には十分に伝わらなくなる．そのため一瞬の圧較差で尿が漏れ出る．\n- A：排尿筋の不随意収縮は切迫性尿失禁の機序．\n- B：腹圧性尿失禁の機序として正しい．\n- C：知覚の過敏化は膀胱痛症候群や切迫性の一因．\n- D：尿道の閉塞では溢流性尿失禁や尿閉となる．\n- E：中枢の脱髄病変は神経因性膀胱の原因．","images":[],"stem_images":[]},{"number":47,"section":"D-8-S12　58歳女性・尿もれ","question":"（3/4）58歳の女性．1年前から尿が漏れるようになり，外出が億劫だという．出産は3回ある．咳やくしゃみをした瞬間に漏れ，急に強い尿意が来ることはないという．残尿は20mLで神経学的異常もない．最初に勧めるべき治療はどれか．","options":[{"letter":"A","text":"直ちに人工尿道括約筋を植込む"},{"letter":"B","text":"抗コリン薬を長期に内服する"},{"letter":"C","text":"抗菌薬を長期に予防投与する"},{"letter":"D","text":"骨盤底筋訓練を指導する"},{"letter":"E","text":"尿道カテーテルを留置する"}],"answer":["D"],"multi":false,"explanation":"解説：骨盤底筋を意識的に収縮させる訓練を継続すると，多くの症例で漏れの頻度と量が改善する．減量と便秘の改善も併せて指導し，無効例では手術やデバイスによる治療を検討する．\n- A：侵襲的な治療は保存療法が無効な場合の選択肢．\n- B：抗コリン薬は切迫性尿失禁の治療で，本病型には効かない．\n- C：抗菌薬は感染症の治療．\n- D：第一選択の保存療法で正しい．\n- E：カテーテル留置はむしろ感染と機能低下を招く．","images":[],"stem_images":[]},{"number":48,"section":"D-8-S12　58歳女性・尿もれ","question":"（4/4）58歳の女性．1年前から尿が漏れるようになり，外出が億劫だという．出産は3回ある．咳やくしゃみをした瞬間に漏れ，急に強い尿意が来ることはないという．残尿は20mLで神経学的異常もなく，尿検査にも異常を認めない．骨盤底筋訓練を3か月続けて改善傾向にある．仮にこの患者に脊髄病変があり，残尿が400mLで少量ずつ漏れ続ける場合の病態はどれか．","options":[{"letter":"A","text":"骨盤底の支持が緩んだ状態"},{"letter":"B","text":"膀胱が過活動になった状態"},{"letter":"C","text":"尿道が瘢痕で狭窄した状態"},{"letter":"D","text":"神経因性膀胱による溢流"},{"letter":"E","text":"膀胱に結石が形成された状態"}],"answer":["D"],"multi":false,"explanation":"解説：排尿筋の収縮不全や排尿筋括約筋協調不全により膀胱が空にならず，限界を超えた分が少量ずつ漏れ出る．残尿の増加は水腎症と腎機能低下を招くので，導尿による管理が必要になる．\n- A：骨盤底の緩みでは残尿は増えない．\n- B：過活動膀胱では切迫性尿失禁となり残尿も少ない．\n- C：尿道狭窄も溢流をきたすが，神経学的背景がある本例では神経因性を考える．\n- D：残尿増加と持続的な漏れを説明し正しい．\n- E：膀胱結石では血尿と排尿時痛，尿線の途絶が主症状．","images":[],"stem_images":[]},{"number":49,"section":"D-8-S13　2歳女児・反復する発熱","question":"（1/4）2歳の女児．この1年で4回目の38℃を超える発熱で来院した．明らかな上気道症状はなく，毎回の尿検査で白血球と細菌を多数認めたという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"家族に腎尿路の病気はありますか．"},{"letter":"B","text":"乳歯は何本生えていますか．"},{"letter":"C","text":"胎児期に腎臓の拡大がありましたか．"},{"letter":"D","text":"前回の菌と薬はわかりますか．"},{"letter":"E","text":"便秘や排尿の我慢はありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．歯の本数は反復性尿路感染の原因検索では優先度が低い．\n- A：先天性・家族性の背景を確認．\n- B：歯の本数は反復性尿路感染の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：先天性尿路異常を検討．\n- D：再燃や耐性菌の可能性を評価．\n- E：膀胱直腸機能の問題を検討．","images":[],"stem_images":[]},{"number":50,"section":"D-8-S13　2歳女児・反復する発熱","question":"（2/4）2歳の女児．この1年で4回目の38℃を超える発熱で来院した．明らかな上気道症状はなく，毎回の尿検査で白血球と細菌を多数認めたという．母も幼少期に腎盂腎炎を繰り返したという．診断のために行うべき検査はどれか．","options":[{"letter":"A","text":"排尿時膀胱尿道造影の施行"},{"letter":"B","text":"上部消化管内視鏡の施行"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"骨シンチグラフィの撮影"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["A"],"multi":false,"explanation":"解説：膀胱に造影剤を満たして排尿させ，尿管や腎盂へ逆流するかを直接観察する．逆流の到達範囲と尿管・腎盂の拡張の程度でグレードを決め，治療方針と予後の見通しを立てる．\n- A：逆流を直接証明でき正しい．\n- B：内視鏡は消化管疾患の評価．\n- C：呼吸機能検査は換気障害の評価．\n- D：骨シンチグラフィは骨病変の検索．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":51,"section":"D-8-S13　2歳女児・反復する発熱","question":"（3/4）2歳の女児．この1年で4回目の38℃を超える発熱で来院した．明らかな上気道症状はなく，毎回の尿検査で白血球と細菌を多数認めたという．母も幼少期に腎盂腎炎を繰り返したという．排尿時膀胱尿道造影で両側の尿管と腎盂への逆流を認めた．併せて評価すべきなのはどれか．","options":[{"letter":"A","text":"骨密度と骨代謝マーカー"},{"letter":"B","text":"呼気中一酸化窒素濃度"},{"letter":"C","text":"腎の瘢痕の有無と分腎機能"},{"letter":"D","text":"血清アミラーゼとリパーゼ"},{"letter":"E","text":"神経伝導速度と筋電図"}],"answer":["C"],"multi":false,"explanation":"解説：逆流に伴う感染の反復で腎実質に瘢痕ができ，将来の高血圧と腎機能低下につながる．核医学検査で瘢痕の有無と左右の腎機能の割合を評価し，長期の経過観察の基礎とする．\n- A：骨密度は骨粗鬆症の評価．\n- B：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- C：長期予後を規定する評価で正しい．\n- D：アミラーゼとリパーゼは膵疾患の指標．\n- E：神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":52,"section":"D-8-S13　2歳女児・反復する発熱","question":"（4/4）2歳の女児．この1年で4回目の38℃を超える発熱で来院した．明らかな上気道症状はなく，毎回の尿検査で白血球と細菌を多数認めたという．母も幼少期に腎盂腎炎を繰り返したという．排尿時膀胱尿道造影で両側の尿管と腎盂への逆流を認めた．核医学検査で右腎に瘢痕を認めた．長期的に警戒すべきなのはどれか．","options":[{"letter":"A","text":"血尿のみが持続すること"},{"letter":"B","text":"尿管に結石が形成されること"},{"letter":"C","text":"膀胱の容量が増大すること"},{"letter":"D","text":"高血圧と腎機能の低下"},{"letter":"E","text":"尿道が瘢痕で狭窄すること"}],"answer":["D"],"multi":false,"explanation":"解説：腎瘢痕からのレニン分泌亢進により高血圧をきたし，瘢痕が広範なら慢性腎臓病へ進む．小児期に診断がついた例では，成人期まで血圧と腎機能を継続して追う必要がある．\n- A：血尿の持続はこの病態の主要な帰結ではない．\n- B：結石形成は尿路の停滞や代謝異常が背景にある．\n- C：膀胱容量の増大は神経因性膀胱などでみられる．\n- D：逆流性腎症の長期予後として正しい．\n- E：尿道狭窄は外傷や炎症の後遺．","images":[],"stem_images":[]},{"number":53,"section":"D-8-S14　26歳男性・排尿時痛と尿道分泌物","question":"（1/4）26歳の男性．3日前から排尿時に強く痛み，尿道から膿のような分泌物が出るという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"性器以外との接触はありましたか．"},{"letter":"B","text":"最後の性交渉はいつですか．"},{"letter":"C","text":"昔からくしゃみで尿が漏れますか．"},{"letter":"D","text":"相手にも症状がありますか．"},{"letter":"E","text":"精巣の痛みや発熱はありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．慢性の腹圧性尿失禁は膿性分泌物の原因検索では優先度が低い．\n- A：咽頭・直腸などの感染部位を検討．\n- B：潜伏期間と感染機会を確認．\n- C：慢性の腹圧性尿失禁は膿性分泌物の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：接触者の感染を検討．\n- E：上行感染と合併症を確認．","images":[],"stem_images":[]},{"number":54,"section":"D-8-S14　26歳男性・排尿時痛と尿道分泌物","question":"（2/4）26歳の男性．3日前から排尿時に強く痛み，尿道から膿のような分泌物が出るという．4日前に新しいパートナーと性交渉があったという．分泌物のGram染色で予想される所見はどれか．","options":[{"letter":"A","text":"グラム陽性の連鎖球菌"},{"letter":"B","text":"細胞内のグラム陰性双球菌"},{"letter":"C","text":"らせん状のグラム陰性桿菌"},{"letter":"D","text":"分節した真菌の菌糸"},{"letter":"E","text":"抗酸染色で赤く染まる桿菌"}],"answer":["B"],"multi":false,"explanation":"解説：好中球の細胞質内に取り込まれたそら豆型のグラム陰性双球菌が見えれば淋菌性を強く示唆する．迅速で特異度が高いが，クラミジアは染まらないため核酸増幅法の併用が必要になる．\n- A：グラム陽性連鎖球菌は咽頭炎や皮膚感染の起因菌．\n- B：淋菌性尿道炎の典型像で正しい．\n- C：らせん状のグラム陰性桿菌はCampylobacterやHelicobacter．\n- D：真菌の菌糸は皮膚真菌症やカンジダ症．\n- E：抗酸菌は結核や非結核性抗酸菌症．","images":[],"stem_images":[]},{"number":55,"section":"D-8-S14　26歳男性・排尿時痛と尿道分泌物","question":"（3/4）26歳の男性．3日前から排尿時に強く痛み，尿道から膿のような分泌物が出るという．4日前に新しいパートナーと性交渉があったという．Gram染色で好中球内にそら豆型のグラム陰性双球菌を多数認めた．併せて必ず行うべきなのはどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"クラミジアの核酸増幅検査"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["C"],"multi":false,"explanation":"解説：淋菌とクラミジアは重複感染が多く，淋菌だけ治療するとクラミジアによる尿道炎が残る．同一検体で両者を同時に検出できる核酸増幅法を用い，検出されれば双方を治療する．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：重複感染の見落としを防ぎ正しい．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":56,"section":"D-8-S14　26歳男性・排尿時痛と尿道分泌物","question":"（4/4）26歳の男性．3日前から排尿時に強く痛み，尿道から膿のような分泌物が出るという．4日前に新しいパートナーと性交渉があったという．Gram染色で好中球内にそら豆型のグラム陰性双球菌を多数認め，クラミジアの核酸増幅検査も陽性であった．治療とあわせて行うべきなのはどれか．","options":[{"letter":"A","text":"水分摂取を1日500mLに制限する"},{"letter":"B","text":"抗菌薬を半年以上続けて内服する"},{"letter":"C","text":"骨盤底筋の訓練を毎日指導する"},{"letter":"D","text":"副腎皮質ステロイドを併用する"},{"letter":"E","text":"パートナーの検査と治療を勧める"}],"answer":["E"],"multi":false,"explanation":"解説：パートナーを治療しないと再感染を繰り返す．同時に梅毒血清反応とHIV抗体を含む他の性感染症の検索を行い，コンドームの使用と治癒確認までの性交渉の回避を具体的に指導する．\n- A：水分制限は排尿による洗い流しを妨げ逆効果．\n- B：長期内服は不要で，規定された短期の投与で治療できる．\n- C：骨盤底筋訓練は尿失禁の治療．\n- D：ステロイドは感染を悪化させうる．\n- E：再感染の防止に不可欠で正しい．","images":[],"stem_images":[]},{"number":57,"section":"D-8-S15　19歳男性・交通外傷後の血尿","question":"（1/4）19歳の男性．バイクで転倒し左の脇腹を強打して搬送された．意識は清明で，尿が赤いという．出血による循環不全を評価するための情報はどれか．","options":[{"letter":"A","text":"血圧と脈拍の推移"},{"letter":"B","text":"尿中赤血球の形態の確認"},{"letter":"C","text":"腰背部の叩打痛の確認"},{"letter":"D","text":"尿道口からの出血の有無"},{"letter":"E","text":"以前の血清クレアチニン値"}],"answer":["A"],"multi":false,"explanation":"解説：外傷例では血行動態の安定性が治療方針を決める最大の因子になる．安定していれば保存的加療が基本で，不安定なら緊急の血管内治療や手術へ進む．経時的な推移を追うことが要点である．\n- A：治療方針を直接規定し有用．\n- B：出血部位の推定に関する情報．\n- C：局所の症状に関する情報．\n- D：尿道損傷の徴候に関する情報．\n- E：基礎の腎機能に関する情報．","images":[],"stem_images":[]},{"number":58,"section":"D-8-S15　19歳男性・交通外傷後の血尿","question":"（2/4）19歳の男性．バイクで転倒し左の脇腹を強打して搬送された．意識は清明で，尿が赤いという．血圧118/72mmHg，脈拍88/分で経過中も安定している．次に行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査の施行"},{"letter":"B","text":"造影CTの撮影"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["B"],"multi":false,"explanation":"解説：腎実質の裂傷の深さ，血腫の範囲，造影剤の血管外漏出，腎茎部や尿路の損傷を一度に評価できる．この所見に基づいて損傷の程度を分類し，保存的加療か介入かを決める．\n- A：呼吸機能検査は換気障害の評価．\n- B：損傷の程度と合併損傷を評価でき正しい．\n- C：骨シンチグラフィは骨病変の検索．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":59,"section":"D-8-S15　19歳男性・交通外傷後の血尿","question":"（3/4）19歳の男性．バイクで転倒し左の脇腹を強打して搬送された．意識は清明で，尿が赤いという．血圧118/72mmHg，脈拍88/分で経過中も安定している．造影CTで左腎に実質の裂傷と腎周囲の血腫を認めたが，造影剤の血管外漏出や尿の漏れはなかった．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに患側の腎を摘出する"},{"letter":"B","text":"直ちに血管内塞栓術を行う"},{"letter":"C","text":"安静と経過観察で保存的に治す"},{"letter":"D","text":"尿道カテーテルを永久留置する"},{"letter":"E","text":"直ちに血液透析を導入する"}],"answer":["C"],"multi":false,"explanation":"解説：血行動態が安定し血管外漏出もない損傷は，安静・補液・血算と血圧の経時的な監視で多くが自然に止血する．腎の温存が原則で，再出血や感染の徴候があれば介入に切り替える．\n- A：安易な腎摘出は機能の喪失を招く．\n- B：塞栓術は活動性出血が確認された場合の選択肢．\n- C：血行動態が安定した例の標準的対応で正しい．\n- D：カテーテルの永久留置は適応がない．\n- E：腎機能は保たれており透析の適応にならない．","images":[],"stem_images":[]},{"number":60,"section":"D-8-S15　19歳男性・交通外傷後の血尿","question":"（4/4）19歳の男性．バイクで転倒し左の脇腹を強打して搬送された．意識は清明で，尿が赤いという．血圧118/72mmHg，脈拍88/分で経過中も安定している．造影CTで左腎に実質の裂傷と腎周囲の血腫を認めたが，造影剤の血管外漏出や尿の漏れはなかった．保存的加療中に注意すべき変化はどれか．","options":[{"letter":"A","text":"血圧低下とHb値の急な低下"},{"letter":"B","text":"血清カルシウムの急な上昇"},{"letter":"C","text":"呼気中一酸化窒素濃度の上昇"},{"letter":"D","text":"血糖値の緩やかな上昇"},{"letter":"E","text":"骨密度の経時的な低下"}],"answer":["A"],"multi":false,"explanation":"解説：受傷後しばらくしてから仮性動脈瘤の破綻などで再出血することがある．血圧低下・頻脈・ヘモグロビンの低下・側腹部痛の増強は再出血の徴候で，造影CTの再検と血管内治療を考える．\n- A：再出血を示す徴候で正しい．\n- B：血清カルシウムの上昇はこの病態と関係しない．\n- C：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- D：血糖の緩やかな上昇は侵襲に伴う反応で，緊急性は低い．\n- E：骨密度の低下は長期臥床の問題で急性期の指標にならない．","images":[],"stem_images":[]}],"seed":null},{"id":"D-9_生殖機能","name":"D-9_生殖機能.md","label":"D-9 生殖機能","count":32,"sourceHash":"8c7dac97a255","questions":[{"number":1,"section":"D-9-S01　38歳男性・陰嚢の痛みと発熱","question":"（1/4）38歳の男性．3日前から左の陰嚢が痛み，次第に腫れてきたという．38℃台の発熱を伴う．急性陰嚢痛の発症速度を明らかにする質問はどれか．","options":[{"letter":"A","text":"痛みは何時間で最強になりましたか．"},{"letter":"B","text":"排尿すると痛みますか．"},{"letter":"C","text":"性交渉はいつでしたか．"},{"letter":"D","text":"以前も同じ痛みがありましたか．"},{"letter":"E","text":"陰嚢を打ったことはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：急性陰嚢症では発症から最強に達するまでの時間が病型を分ける．数分から数時間で突然最強となるなら捻転を，数日かけて増強し発熱を伴うなら炎症性を考えることになる．\n- A：捻転と炎症を分ける核心で有用．\n- B：尿路感染症状に関する情報．\n- C：感染への曝露に関する情報．\n- D：再発歴に関する情報．\n- E：外傷に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-9-S01　38歳男性・陰嚢の痛みと発熱","question":"（2/4）38歳の男性．3日前から左の陰嚢が痛み，次第に腫れてきたという．38℃台の発熱を伴う．痛みは3日かけて少しずつ強くなったという．認められる所見はどれか．","options":[{"letter":"A","text":"患側の精巣挙筋反射が消失する"},{"letter":"B","text":"患側の精巣が高位に横向きとなる"},{"letter":"C","text":"陰嚢を挙上すると痛みが和らぐ"},{"letter":"D","text":"陰嚢の皮膚に黒色の壊死斑が出る"},{"letter":"E","text":"陰嚢内に腸管の蠕動音を聴取する"}],"answer":["C"],"multi":false,"explanation":"解説：陰嚢を持ち上げると炎症を起こした精巣上体への牽引が減り，痛みが軽くなる．これがPrehn徴候陽性で，挙上しても変わらないか増悪する捻転との鑑別に使われる．\n- A：精巣挙筋反射の消失は捻転を示唆する．\n- B：高位横位も捻転の所見．\n- C：炎症性を示し正しい．\n- D：陰嚢の黒色壊死斑はFournier壊疽．\n- E：陰嚢内の蠕動音は鼠径ヘルニアの嵌頓．","images":[],"stem_images":[]},{"number":3,"section":"D-9-S01　38歳男性・陰嚢の痛みと発熱","question":"（3/4）38歳の男性．3日前から左の陰嚢が痛み，次第に腫れてきたという．38℃台の発熱を伴う．痛みは3日かけて少しずつ強くなったという．陰嚢を挙上すると痛みが和らぐ．左の精巣上体に強い圧痛と腫脹を認め，精巣そのものの圧痛は軽い．行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"尿検査と淋菌・クラミジア検査"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["B"],"multi":false,"explanation":"解説：35歳未満では淋菌とクラミジアが，それ以上では大腸菌など腸内細菌が主な起因菌になる．年齢と性交渉歴に応じて検査と抗菌薬を選び，性感染症であればパートナーの治療も行う．\n- A：骨シンチグラフィは骨病変の検索．\n- B：起因菌の同定と抗菌薬の選択に直結し正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":4,"section":"D-9-S01　38歳男性・陰嚢の痛みと発熱","question":"（4/4）38歳の男性．3日前から左の陰嚢が痛み，次第に腫れてきたという．38℃台の発熱を伴う．痛みは3日かけて少しずつ強くなったという．陰嚢を挙上すると痛みが和らぐ．左の精巣上体に強い圧痛と腫脹を認め，精巣そのものの圧痛は軽い．同じ経路の感染が前立腺に及んだ場合の診察上の注意はどれか．","options":[{"letter":"A","text":"直腸診では強く圧迫しない"},{"letter":"B","text":"陰嚢を強く圧迫して確認する"},{"letter":"C","text":"尿道に器具を挿入して確かめる"},{"letter":"D","text":"腹部を深く圧迫して確認する"},{"letter":"E","text":"会陰部を繰り返し叩打する"}],"answer":["A"],"multi":false,"explanation":"解説：急性前立腺炎では前立腺が熱感を持ち強く圧痛を示すが，マッサージや強い圧迫は細菌を血中に押し出して菌血症を起こす危険がある．触れて熱感と圧痛を確認するにとどめる．\n- A：菌血症の誘発を避ける配慮で正しい．\n- B：強い圧迫は不要な苦痛を与えるだけである．\n- C：急性期の尿道への器具挿入は感染を悪化させる．\n- D：深い腹部圧迫は前立腺の評価にならない．\n- E：会陰部の叩打も診断的価値がない．","images":[],"stem_images":[]},{"number":5,"section":"D-9-S02　14歳男子・突然の陰嚢痛","question":"（1/4）14歳の男子．2時間前に突然左の陰嚢が激しく痛み出し，嘔吐も伴うという．発熱はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"痛みが始まった時刻はいつですか．"},{"letter":"B","text":"精巣の位置の異常を治療されましたか．"},{"letter":"C","text":"以前も同じ痛みがありましたか．"},{"letter":"D","text":"以前から夜に尿もれをしますか．"},{"letter":"E","text":"排尿痛や分泌物はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性夜尿は急性陰嚢痛の緊急評価では優先度が低い．\n- A：虚血時間と緊急性を評価．\n- B：停留精巣などの背景を確認．\n- C：捻転・自然解除の反復を検討．\n- D：慢性夜尿は急性陰嚢痛の緊急評価では優先度が低い．この設問で選ぶ肢．\n- E：感染性疾患との鑑別に有用．","images":[],"stem_images":[]},{"number":6,"section":"D-9-S02　14歳男子・突然の陰嚢痛","question":"（2/4）14歳の男子．2時間前に突然左の陰嚢が激しく痛み出し，嘔吐も伴うという．発熱はない．幼少期に左の停留精巣で手術を受けたという．認められる所見はどれか．","options":[{"letter":"A","text":"陰嚢を挙上すると痛みが和らぐ"},{"letter":"B","text":"患側の精巣挙筋反射が消失する"},{"letter":"C","text":"精巣上体だけに限局した圧痛"},{"letter":"D","text":"陰嚢の皮膚に黒色の壊死斑が出る"},{"letter":"E","text":"陰嚢内に腸管の蠕動音を聴取する"}],"answer":["B"],"multi":false,"explanation":"解説：捻転すると精索が短縮して精巣が高位に横向きとなり，大腿内側を擦っても精巣が挙上しない．挙上で痛みが変わらないか増悪するPrehn徴候陰性も併せて確認する．\n- A：挙上で軽快するのは精巣上体炎．\n- B：捻転を示す所見で正しい．\n- C：精巣上体に限局した圧痛も炎症性．\n- D：黒色の壊死斑はFournier壊疽．\n- E：陰嚢内の蠕動音は鼠径ヘルニアの嵌頓．","images":[],"stem_images":[]},{"number":7,"section":"D-9-S02　14歳男子・突然の陰嚢痛","question":"（3/4）14歳の男子．2時間前に突然左の陰嚢が激しく痛み出し，嘔吐も伴うという．発熱はない．幼少期に左の停留精巣で手術を受けたという．左精巣は高位に横向きで，精巣挙筋反射は消失し，陰嚢を挙上しても痛みは和らがない．最も適切な対応はどれか．","options":[{"letter":"A","text":"抗菌薬を投与して翌日再診とする"},{"letter":"B","text":"鎮痛薬のみで経過をみる"},{"letter":"C","text":"冷罨法で腫れが引くのを待つ"},{"letter":"D","text":"造影CTの結果を待って判断する"},{"letter":"E","text":"直ちに緊急手術の準備をする"}],"answer":["E"],"multi":false,"explanation":"解説：発症から6〜8時間を過ぎると精巣の救済率が急落するため，臨床所見で強く疑った時点で泌尿器科へ連絡し手術に進む．超音波は補助にとどめ，検査のために手術を遅らせない．\n- A：抗菌薬は炎症性の治療で，翌日では手遅れになる．\n- B：鎮痛だけでは精巣が壊死する．\n- C：冷罨法も時間の浪費になる．\n- D：造影CTは適応がなく，画像を待つこと自体が不利益．\n- E：時間が精巣の予後を決め正しい．","images":[],"stem_images":[]},{"number":8,"section":"D-9-S02　14歳男子・突然の陰嚢痛","question":"（4/4）14歳の男子．2時間前に突然左の陰嚢が激しく痛み出し，嘔吐も伴うという．発熱はない．幼少期に左の停留精巣で手術を受けたという．左精巣は高位に横向きで，精巣挙筋反射は消失し，陰嚢を挙上しても痛みは和らがない．緊急手術で捻転を解除し精巣を温存した．同時に行うべき処置はどれか．","options":[{"letter":"A","text":"対側の精巣も固定する"},{"letter":"B","text":"対側の精巣を摘出する"},{"letter":"C","text":"尿道カテーテルを永久留置する"},{"letter":"D","text":"副腎皮質ステロイドを開始する"},{"letter":"E","text":"抗菌薬を半年以上続ける"}],"answer":["A"],"multi":false,"explanation":"解説：捻転を起こす解剖学的な素因は両側性であることが多いため，同じ手術で対側も精巣固定術を行って再発を防ぐ．温存できなかった場合も，対側の固定は必ず行う．\n- A：対側の発症予防として標準的で正しい．\n- B：健常な対側を摘出する理由はない．\n- C：カテーテルの永久留置は適応がない．\n- D：ステロイドはこの病態の治療ではない．\n- E：長期の抗菌薬投与も適応がない．","images":[],"stem_images":[]},{"number":9,"section":"D-9-S03　72歳男性・排尿の勢いの低下","question":"（1/4）72歳の男性．2年前から尿の勢いが弱くなり，夜に2〜3回起きるという．出始めるまで時間もかかる．下部尿路症状が生活の質に及ぼす影響を確認する質問はどれか．","options":[{"letter":"A","text":"一日に何回排尿しますか．"},{"letter":"B","text":"尿が途切れることはありますか．"},{"letter":"C","text":"症状で生活がどれだけ困っていますか．"},{"letter":"D","text":"排尿後も残った感じがありますか．"},{"letter":"E","text":"強い尿意を我慢しにくいですか．"}],"answer":["C"],"multi":false,"explanation":"解説：この疾患の治療適応は数値ではなく困窮度で決まる．国際前立腺症状スコアと生活の質のスコアで定量し，本人が困っていなければ経過観察でよい．困窮度の把握が方針を直接決める．\n- A：症状の頻度に関する情報．\n- B：排尿症状に関する情報．\n- C：治療適応の判断に直結し有用．\n- D：残尿感に関する情報．\n- E：蓄尿症状に関する情報．","images":[],"stem_images":[]},{"number":10,"section":"D-9-S03　72歳男性・排尿の勢いの低下","question":"（2/4）72歳の男性．2年前から尿の勢いが弱くなり，夜に2〜3回起きるという．出始めるまで時間もかかる．外出時に困ることが増えたという．直腸診で予想される所見はどれか．","options":[{"letter":"A","text":"石様硬で表面が結節状の腫大"},{"letter":"B","text":"強い熱感と圧痛を伴う腫大"},{"letter":"C","text":"直腸粘膜に潰瘍を伴う硬結"},{"letter":"D","text":"前立腺がまったく触れない"},{"letter":"E","text":"弾性硬で表面平滑な腫大"}],"answer":["E"],"multi":false,"explanation":"解説：内腺が左右対称にゆっくり肥大するため，弾性硬で表面が滑らかに触れ，中央溝は浅くなる．石様硬で表面不整なら癌を，熱感と強い圧痛があれば急性前立腺炎を疑うことになる．\n- A：石様硬で結節状の腫大は前立腺癌．\n- B：熱感と圧痛を伴う腫大は急性前立腺炎．\n- C：直腸粘膜の潰瘍を伴う硬結は直腸の病変．\n- D：高齢男性で前立腺が触れないことはない．\n- E：この疾患の典型的な所見で正しい．","images":[],"stem_images":[]},{"number":11,"section":"D-9-S03　72歳男性・排尿の勢いの低下","question":"（3/4）72歳の男性．2年前から尿の勢いが弱くなり，夜に2〜3回起きるという．出始めるまで時間もかかる．外出時に困ることが増え，国際前立腺症状スコアは21点であった．直腸診で弾性硬・表面平滑な腫大を認める．併せて行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"残尿測定とPSAの測定"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：残尿量は下部尿路の閉塞の程度を示し，多ければ水腎症や腎機能低下の危険がある．PSAは前立腺癌の除外に必要で，直腸診の所見だけでは癌を否定できない．\n- A：骨シンチグラフィは骨転移の検索で，この段階では不要．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：閉塞の程度と癌の除外を同時に行え正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":12,"section":"D-9-S03　72歳男性・排尿の勢いの低下","question":"（4/4）72歳の男性．2年前から尿の勢いが弱くなり，夜に2〜3回起きるという．出始めるまで時間もかかる．外出時に困ることが増え，国際前立腺症状スコアは21点であった．直腸診で弾性硬・表面平滑な腫大を認める．残尿60mL，PSA 2.4ng/mLであった．第一選択の薬剤はどれか．","options":[{"letter":"A","text":"抗コリン薬の内服"},{"letter":"B","text":"α1遮断薬の内服"},{"letter":"C","text":"副腎皮質ステロイドの内服"},{"letter":"D","text":"抗菌薬の長期予防的投与"},{"letter":"E","text":"利尿薬の連日内服"}],"answer":["B"],"multi":false,"explanation":"解説：前立腺と膀胱頸部の平滑筋を弛緩させて尿道抵抗を下げ，速やかに症状を改善する．前立腺が大きい例では5α還元酵素阻害薬を併用して体積そのものを縮小させる．\n- A：抗コリン薬は過活動膀胱に用いるが，単独では尿閉を招きうる．\n- B：即効性があり標準的で正しい．\n- C：ステロイドはこの病態の治療ではない．\n- D：抗菌薬は感染症の治療．\n- E：利尿薬は夜間頻尿をむしろ悪化させうる．","images":[],"stem_images":[]},{"number":13,"section":"D-9-S04　28歳女性・月経時の強い下腹部痛","question":"（1/4）28歳の女性．数年前から月経のたびに下腹部が強く痛み，年々ひどくなっているという．鎮痛薬が効きにくくなった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"妊娠を希望していますか．"},{"letter":"B","text":"以前から近視ですか．"},{"letter":"C","text":"月経以外の日も痛みますか．"},{"letter":"D","text":"不正出血や発熱はありますか．"},{"letter":"E","text":"性交時や排便時も痛みますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．屈折異常は月経痛の原因検索では優先度が低い．\n- A：評価と治療の方針に関わる．\n- B：屈折異常は月経痛の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：痛みの周期性を確認．\n- D：他の婦人科疾患を検討．\n- E：子宮内膜症を示唆する症状を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-9-S04　28歳女性・月経時の強い下腹部痛","question":"（2/4）28歳の女性．数年前から月経のたびに下腹部が強く痛み，年々ひどくなっているという．鎮痛薬が効きにくくなった．性交時と月経時の排便時にも痛むという．内診で予想される所見はどれか．","options":[{"letter":"A","text":"子宮が全体にびまん性に腫大する"},{"letter":"B","text":"子宮頸部を動かすと強く痛む"},{"letter":"C","text":"子宮の表面に硬い結節を多発する"},{"letter":"D","text":"Douglas窩に圧痛と硬結を触れる"},{"letter":"E","text":"腟壁に有痛性の小水疱が多発する"}],"answer":["D"],"multi":false,"explanation":"解説：Douglas窩や仙骨子宮靱帯に病変が生着すると，双合診で硬結として触れ強い圧痛を伴う．子宮が後屈して可動性が低下することも多い．内診所見は病変の局在を示す重要な手がかりになる．\n- A：子宮全体のびまん性腫大は子宮腺筋症．\n- B：頸部の可動時痛は骨盤内炎症性疾患．\n- C：表面の硬い結節は子宮筋腫．\n- D：この疾患の好発部位に一致し正しい．\n- E：腟壁の有痛性小水疱は性器ヘルペス．","images":[],"stem_images":[]},{"number":15,"section":"D-9-S04　28歳女性・月経時の強い下腹部痛","question":"（3/4）28歳の女性．数年前から月経のたびに下腹部が強く痛み，年々ひどくなっているという．鎮痛薬が効きにくくなった．性交時と月経時の排便時にも痛むという．Douglas窩に圧痛と硬結を触れる．経腟超音波で予想される所見はどれか．","options":[{"letter":"A","text":"子宮筋層内の境界明瞭な結節"},{"letter":"B","text":"子宮内腔に突出する有茎性腫瘤"},{"letter":"C","text":"卵巣に内部が均一な低輝度の嚢胞"},{"letter":"D","text":"子宮内膜の著明な肥厚のみ"},{"letter":"E","text":"付属器に管状に拡張した液体貯留"}],"answer":["C"],"multi":false,"explanation":"解説：卵巣内に生着した組織が周期的に出血して古い血液が貯留し，内部が均一な微細高エコーを示す嚢胞となる．これがチョコレート嚢胞で，破裂や卵巣癌化の危険もあるため経過観察が要る．\n- A：筋層内の境界明瞭な結節は子宮筋腫．\n- B：内腔に突出する有茎性腫瘤は粘膜下筋腫や内膜ポリープ．\n- C：この疾患に特徴的な所見で正しい．\n- D：内膜の肥厚のみは内膜増殖症や内膜癌．\n- E：管状の液体貯留は卵管留水腫．","images":[],"stem_images":[]},{"number":16,"section":"D-9-S04　28歳女性・月経時の強い下腹部痛","question":"（4/4）28歳の女性．数年前から月経のたびに下腹部が強く痛み，年々ひどくなっているという．鎮痛薬が効きにくくなった．性交時と月経時の排便時にも痛むという．Douglas窩に圧痛と硬結を触れる．経腟超音波で左卵巣に内部が均一な低輝度の嚢胞を認めた．この疾患が閉経後に縮小する理由はどれか．","options":[{"letter":"A","text":"免疫機能が加齢で低下するため"},{"letter":"B","text":"骨盤内の血流が減少するため"},{"letter":"C","text":"プロゲステロンが増加するため"},{"letter":"D","text":"腹圧が加齢で低下するため"},{"letter":"E","text":"エストロゲンの分泌が止まるため"}],"answer":["E"],"multi":false,"explanation":"解説：異所性に生着した内膜組織もエストロゲンに依存して増殖と出血を繰り返すため，閉経で卵巣機能が止まると病変は萎縮し症状も軽くなる．薬物療法もこの依存性を利用して行われる．\n- A：免疫機能の低下は病変の縮小を説明しない．\n- B：骨盤内血流の変化は主因ではない．\n- C：閉経後はプロゲステロンも低下する．\n- D：腹圧の変化とこの病変の増殖は無関係．\n- E：ホルモン依存性という本質を示し正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-9-S05　44歳女性・過多月経と貧血","question":"（1/4）44歳の女性．1年前から月経の量が増え，レバー状の塊が出るという．健診でHb 8.8g/dLと指摘された．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"息切れや動悸はありますか．"},{"letter":"B","text":"何日間，どの程度出血しますか．"},{"letter":"C","text":"幼少期に中耳炎がありましたか．"},{"letter":"D","text":"鼻血やあざも増えましたか．"},{"letter":"E","text":"月経以外にも出血しますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．小児期の中耳炎は過多月経の評価では優先度が低い．\n- A：貧血の症状と重症度を評価．\n- B：出血量と持続期間を確認．\n- C：小児期の中耳炎は過多月経の評価では優先度が低い．この設問で選ぶ肢．\n- D：全身の出血傾向を検討．\n- E：出血の様式を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-9-S05　44歳女性・過多月経と貧血","question":"（2/4）44歳の女性．1年前から月経の量が増え，レバー状の塊が出るという．健診でHb 8.8g/dLと指摘された．夜用ナプキンを2時間ごとに替える日が3日続くという．内診で予想される所見はどれか．","options":[{"letter":"A","text":"Douglas窩の圧痛と硬結"},{"letter":"B","text":"腟壁に有痛性の小水疱が多発"},{"letter":"C","text":"表面が凹凸のある硬い子宮腫大"},{"letter":"D","text":"子宮頸部を動かすと強く痛む"},{"letter":"E","text":"子宮も付属器も異常を認めない"}],"answer":["C"],"multi":false,"explanation":"解説：筋層内に境界明瞭な腫瘤が多発するため，子宮は凹凸のある硬い腫大として触れる．子宮全体がびまん性に球状に腫大し圧痛を伴うなら子宮腺筋症を考えることになる．\n- A：Douglas窩の圧痛と硬結は子宮内膜症．\n- B：腟壁の有痛性小水疱は性器ヘルペス．\n- C：この疾患の典型的な内診所見で正しい．\n- D：頸部の可動時痛は骨盤内炎症性疾患．\n- E：過多月経と貧血がある以上，器質的原因を探す．","images":[],"stem_images":[]},{"number":19,"section":"D-9-S05　44歳女性・過多月経と貧血","question":"（3/4）44歳の女性．1年前から月経の量が増え，レバー状の塊が出るという．健診でHb 8.8g/dLと指摘された．夜用ナプキンを2時間ごとに替える日が3日続くという．内診で表面が凹凸のある硬い子宮腫大を認めた．過多月経を最も強く起こすのはどれか．","options":[{"letter":"A","text":"子宮の外側へ向かって育つ腫瘤"},{"letter":"B","text":"子宮内腔に突出して育つ腫瘤"},{"letter":"C","text":"子宮頸部にできた小さな腫瘤"},{"letter":"D","text":"卵巣の表面にできた腫瘤"},{"letter":"E","text":"骨盤壁に癒着した腫瘤"}],"answer":["B"],"multi":false,"explanation":"解説：内腔に突出する粘膜下筋腫は内膜面積を増やして出血させ，子宮の収縮も妨げるため，小さくても過多月経の原因になる．漿膜下筋腫は大きくなっても出血症状は乏しい．\n- A：外側へ育つ漿膜下筋腫は圧迫症状が主体で出血は少ない．\n- B：発育方向と症状の関係を示し正しい．\n- C：頸部の小さな腫瘤は過多月経の主因になりにくい．\n- D：卵巣の腫瘤は月経量に直接影響しない．\n- E：骨盤壁への癒着は疼痛の原因にはなるが出血量は増やさない．","images":[],"stem_images":[]},{"number":20,"section":"D-9-S05　44歳女性・過多月経と貧血","question":"（4/4）44歳の女性．1年前から月経の量が増え，レバー状の塊が出るという．健診でHb 8.8g/dLと指摘された．夜用ナプキンを2時間ごとに替える日が3日続くという．内診で表面が凹凸のある硬い子宮腫大を認め，経腟超音波で子宮内腔に突出する腫瘤を認めた．この腫瘤の閉経後の経過はどれか．","options":[{"letter":"A","text":"閉経後に急速に増大していく"},{"letter":"B","text":"閉経後も大きさは変化しない"},{"letter":"C","text":"閉経後に石灰化して硬くなり増大"},{"letter":"D","text":"閉経後に縮小することが多い"},{"letter":"E","text":"閉経後に高率で悪性化する"}],"answer":["D"],"multi":false,"explanation":"解説：エストロゲン依存性に発育するため，卵巣機能が止まると多くは縮小して症状も軽くなる．閉経後に増大する腫瘤は子宮肉腫を疑うべきで，画像と経過で慎重に鑑別する．\n- A：閉経後の増大はむしろ悪性を疑う所見．\n- B：ホルモン依存性である以上，変化しないわけではない．\n- C：石灰化はしうるが増大はしない．\n- D：ホルモン依存性の帰結として正しい．\n- E：悪性化はまれで，高率ではない．","images":[],"stem_images":[]},{"number":21,"section":"D-9-S06　51歳女性・のぼせと発汗","question":"（1/4）51歳の女性．半年前から突然顔がほてって汗が噴き出ることが1日に何度もあり，夜も眠れないという．閉経移行期との関連を判断する質問はどれか．","options":[{"letter":"A","text":"食欲や体重は変わりましたか．"},{"letter":"B","text":"動悸や手の震えはありますか．"},{"letter":"C","text":"新しく飲み始めた薬はありますか．"},{"letter":"D","text":"月経の状況はどうなっていますか．"},{"letter":"E","text":"発熱は続いていますか．"}],"answer":["D"],"multi":false,"explanation":"解説：月経周期の乱れから最終月経までの経過が，卵巣機能の低下を裏づける．同じほてりと発汗でも甲状腺機能亢進症では月経は保たれることが多く，この情報が鑑別の起点になる．\n- A：代謝の変化に関する情報．\n- B：甲状腺などの症状に関する情報．\n- C：薬剤の影響に関する情報．\n- D：卵巣機能の状態を示し有用．\n- E：感染などの全身症状に関する情報．","images":[],"stem_images":[]},{"number":22,"section":"D-9-S06　51歳女性・のぼせと発汗","question":"（2/4）51歳の女性．半年前から突然顔がほてって汗が噴き出ることが1日に何度もあり，夜も眠れないという．月経は不順になり，前回は5か月前だったという．予想されるホルモン所見はどれか．","options":[{"letter":"A","text":"FSH低値でエストラジオール高値"},{"letter":"B","text":"FSHもエストラジオールも高値"},{"letter":"C","text":"FSH高値でエストラジオール低値"},{"letter":"D","text":"FSHもエストラジオールも正常"},{"letter":"E","text":"TSH低値で遊離T4高値"}],"answer":["C"],"multi":false,"explanation":"解説：卵巣からのエストロゲン分泌が落ちると，負のフィードバックが外れて下垂体からのFSHが上昇する．このFSH高値とエストラジオール低値の組合せが卵巣機能の低下を示す．\n- A：この組合せは卵巣機能が保たれている状態．\n- B：両者が高値になるのは排卵前の一時期など．\n- C：閉経期のホルモン動態として正しい．\n- D：症状と月経の変化がある以上，正常とは考えにくい．\n- E：TSH低値と遊離T4高値は甲状腺機能亢進症．","images":[],"stem_images":[]},{"number":23,"section":"D-9-S06　51歳女性・のぼせと発汗","question":"（3/4）51歳の女性．半年前から突然顔がほてって汗が噴き出ることが1日に何度もあり，夜も眠れないという．月経は不順になり，前回は5か月前だったという．FSHは高値でエストラジオールは低値であった．症状の改善に最も有効な治療はどれか．","options":[{"letter":"A","text":"抗菌薬の長期予防的な投与"},{"letter":"B","text":"副腎皮質ステロイドの連日内服"},{"letter":"C","text":"甲状腺ホルモンの補充療法"},{"letter":"D","text":"抗コリン薬の連日内服"},{"letter":"E","text":"エストロゲンの補充療法"}],"answer":["E"],"multi":false,"explanation":"解説：不足しているホルモンを補うことでほてり・発汗・不眠が改善し，骨量減少と腟の萎縮も抑えられる．子宮があればプロゲスチンを併用し，内膜癌の危険を減らす．\n- A：抗菌薬は感染症の治療．\n- B：ステロイドはこの症状に作用しない．\n- C：甲状腺ホルモンの補充は甲状腺機能低下症の治療．\n- D：抗コリン薬は過活動膀胱などに用いる．\n- E：病態に直接対応し正しい．","images":[],"stem_images":[]},{"number":24,"section":"D-9-S06　51歳女性・のぼせと発汗","question":"（4/4）51歳の女性．半年前から突然顔がほてって汗が噴き出ることが1日に何度もあり，夜も眠れないという．月経は不順になり，前回は5か月前だったという．FSHは高値でエストラジオールは低値であった．子宮は温存されており，骨密度は若年成人平均の78%であった．ホルモン補充療法を検討するうえで禁忌にあたるのはどれか．","options":[{"letter":"A","text":"乳癌の既往がある"},{"letter":"B","text":"骨密度が低下している"},{"letter":"C","text":"血清脂質が高い"},{"letter":"D","text":"高血圧で内服治療中である"},{"letter":"E","text":"不眠が続いている"}],"answer":["A"],"multi":false,"explanation":"解説：エストロゲン依存性に増殖する腫瘍の既往は絶対的な禁忌になる．原因不明の性器出血，重篤な肝障害，血栓塞栓症の既往，冠動脈疾患や脳卒中の既往も同様に投与できない．\n- A：絶対禁忌にあたり正しい．\n- B：骨密度低下はむしろ治療の利益が期待される状態．\n- C：脂質異常は禁忌ではなく，経過をみながら治療できる．\n- D：高血圧も管理されていれば禁忌にならない．\n- E：不眠は治療対象となる症状そのもの．","images":[],"stem_images":[]},{"number":25,"section":"D-9-S07　24歳女性・下腹部痛と発熱","question":"（1/4）24歳の女性．3日前から下腹部が痛み，38℃台の発熱とおりものの増加があるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"性交渉の状況を伺えますか．"},{"letter":"B","text":"最終月経はいつでしたか．"},{"letter":"C","text":"不正出血はありますか．"},{"letter":"D","text":"排尿痛や頻尿もありますか．"},{"letter":"E","text":"以前から手元が見えにくいですか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．近見困難は今回の下腹部痛の初期鑑別では優先度が低い．\n- A：性感染症への曝露を確認．\n- B：妊娠関連疾患を検討．\n- C：子宮頸管・子宮病変を検討．\n- D：尿路感染との鑑別に有用．\n- E：近見困難は今回の下腹部痛の初期鑑別では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":26,"section":"D-9-S07　24歳女性・下腹部痛と発熱","question":"（2/4）24歳の女性．3日前から下腹部が痛み，38℃台の発熱とおりものの増加があるという．半年前から新しいパートナーがおり，コンドームは使っていないという．内診で予想される所見はどれか．","options":[{"letter":"A","text":"Douglas窩に硬い結節を触れる"},{"letter":"B","text":"子宮頸部を動かすと強く痛む"},{"letter":"C","text":"表面が凹凸のある硬い子宮腫大"},{"letter":"D","text":"子宮も付属器もまったく正常"},{"letter":"E","text":"腟壁に白色の斑状付着物が多い"}],"answer":["B"],"multi":false,"explanation":"解説：子宮頸部を持ち上げるように動かすと，炎症を起こした付属器と骨盤腹膜が牽引されて強い痛みが出る．付属器の圧痛と子宮の圧痛と併せ，この疾患の診断基準の中核をなす所見である．\n- A：Douglas窩の硬い結節は子宮内膜症．\n- B：この疾患の中核的な所見で正しい．\n- C：凹凸のある硬い子宮腫大は子宮筋腫．\n- D：発熱と下腹部痛がある以上，正常とは考えにくい．\n- E：腟壁の白色斑状付着物は腟カンジダ症．","images":[],"stem_images":[]},{"number":27,"section":"D-9-S07　24歳女性・下腹部痛と発熱","question":"（3/4）24歳の女性．3日前から下腹部が痛み，38℃台の発熱とおりものの増加があるという．半年前から新しいパートナーがおり，コンドームは使っていないという．子宮頸部の可動時痛と両側付属器の圧痛を認める．体温38.4℃，白血球14600/μL．治療を遅らせた場合の後遺症はどれか．","options":[{"letter":"A","text":"子宮内膜が過剰に増殖する"},{"letter":"B","text":"卵巣にホルモン産生腫瘍ができる"},{"letter":"C","text":"卵管が閉塞して不妊や異所性妊娠"},{"letter":"D","text":"子宮が全体にびまん性に腫大する"},{"letter":"E","text":"腟の粘膜が萎縮して乾燥する"}],"answer":["C"],"multi":false,"explanation":"解説：卵管の粘膜と線毛が破壊されて瘢痕性に閉塞し，不妊と異所性妊娠の危険が高まる．慢性骨盤痛も残るため，疑った時点で広域の抗菌薬を開始して重症化を防ぐことが重要になる．\n- A：内膜の過剰増殖は内膜増殖症で，機序が異なる．\n- B：ホルモン産生腫瘍はこの感染の後遺症ではない．\n- C：この疾患の代表的な後遺症で正しい．\n- D：びまん性の子宮腫大は子宮腺筋症．\n- E：腟粘膜の萎縮はエストロゲン低下による．","images":[],"stem_images":[]},{"number":28,"section":"D-9-S07　24歳女性・下腹部痛と発熱","question":"（4/4）24歳の女性．3日前から下腹部が痛み，38℃台の発熱とおりものの増加があるという．半年前から新しいパートナーがおり，コンドームは使っていないという．子宮頸部の可動時痛と両側付属器の圧痛を認める．体温38.4℃，白血球14600/μL．同じ感染経路で外陰部に有痛性の集簇性小水疱と潰瘍をきたす疾患はどれか．","options":[{"letter":"A","text":"尖圭コンジローマ"},{"letter":"B","text":"伝染性軟属腫"},{"letter":"C","text":"腟カンジダ症"},{"letter":"D","text":"性器ヘルペス"},{"letter":"E","text":"細菌性腟症"}],"answer":["D"],"multi":false,"explanation":"解説：初感染では強い疼痛を伴う多発性の水疱と潰瘍，鼠径リンパ節腫脹，発熱をきたす．抗ウイルス薬を早期に開始し，神経節に潜伏したウイルスが再発することを説明しておく．\n- A：尖圭コンジローマは無痛性の鶏冠状の隆起．\n- B：伝染性軟属腫は中央が臍窩状にくぼむ丘疹．\n- C：腟カンジダ症は白色の酒粕様帯下と掻痒．\n- D：有痛性の集簇性小水疱と潰瘍に合致し正しい．\n- E：細菌性腟症は魚臭を伴う灰白色の帯下で疼痛は乏しい．","images":[],"stem_images":[]},{"number":29,"section":"D-9-S08　妊婦健診での感染症スクリーニング","question":"（1/4）28歳の初産婦．妊娠10週で妊婦健診を受けた．自覚症状はなく，経過は順調である．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"辛い料理は好きですか．"},{"letter":"B","text":"猫のふんや土に触れますか．"},{"letter":"C","text":"発疹や発熱のある人と接しましたか．"},{"letter":"D","text":"乳幼児の唾液や尿に触れますか．"},{"letter":"E","text":"加熱不十分な肉を食べますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．辛味の嗜好だけでは感染への曝露評価に役立たない．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：辛味の嗜好だけでは感染への曝露評価に役立たない．この設問で選ぶ肢．\n- B：トキソプラズマへの曝露を検討．\n- C：胎児に影響する感染への曝露を確認．\n- D：サイトメガロウイルスへの曝露を検討．\n- E：食品を介するトキソプラズマ感染を検討．","images":[],"stem_images":[]},{"number":30,"section":"D-9-S08　妊婦健診での感染症スクリーニング","question":"（2/4）28歳の初産婦．妊娠10週で妊婦健診を受けた．自覚症状はなく，経過は順調である．猫を飼っており，庭の手入れもするという．この妊婦に指導すべきなのはどれか．","options":[{"letter":"A","text":"猫を直ちに手放すこと"},{"letter":"B","text":"水分摂取を1日500mLに制限する"},{"letter":"C","text":"抗菌薬を妊娠中ずっと内服する"},{"letter":"D","text":"直射日光をまったく浴びないこと"},{"letter":"E","text":"生肉を避け土いじりは手袋をする"}],"answer":["E"],"multi":false,"explanation":"解説：猫を手放す必要はなく，糞便の処理を他人に任せるか手袋を使い，加熱不十分な食肉と未殺菌乳を避け，土や砂に触れるときは手袋をして最後に手を洗う，という具体的な行動が予防になる．\n- A：猫そのものより糞便の扱いが問題で，手放す必要はない．\n- B：水分制限は妊娠中に有害．\n- C：予防的な抗菌薬の長期内服は適応がない．\n- D：日光の回避はこの感染と無関係．\n- E：実行可能で有効な予防行動で正しい．","images":[],"stem_images":[]},{"number":31,"section":"D-9-S08　妊婦健診での感染症スクリーニング","question":"（3/4）28歳の初産婦．妊娠10週で妊婦健診を受けた．自覚症状はなく，経過は順調である．猫を飼っており，庭の手入れもするという．生肉を避け土いじりには手袋を使うよう指導した．スクリーニング検査で梅毒血清反応が陽性であった．治療を行わなかった場合の児への影響はどれか．","options":[{"letter":"A","text":"白内障と心奇形と難聴の三徴"},{"letter":"B","text":"骨軟骨炎と鼻閉と皮疹をきたす"},{"letter":"C","text":"小頭症と脳内石灰化をきたす"},{"letter":"D","text":"水頭症と脈絡網膜炎をきたす"},{"letter":"E","text":"全身に多発する水疱をきたす"}],"answer":["B"],"multi":false,"explanation":"解説：胎盤を通って感染すると，早期先天梅毒では鼻閉を伴う鼻炎，水疱性の皮疹，骨軟骨炎による仮性麻痺，肝脾腫をきたす．遅発型ではHutchinson歯・実質性角膜炎・内耳性難聴の三徴が出る．\n- A：白内障・心奇形・難聴の三徴は先天性風疹症候群．\n- B：先天梅毒の所見として正しい．\n- C：小頭症と脳内石灰化はサイトメガロウイルス感染症で目立つ．\n- D：水頭症と脈絡網膜炎はトキソプラズマ．\n- E：全身の多発水疱は新生児ヘルペスや水痘．","images":[],"stem_images":[]},{"number":32,"section":"D-9-S08　妊婦健診での感染症スクリーニング","question":"（4/4）28歳の初産婦．妊娠10週で妊婦健診を受けた．自覚症状はなく，経過は順調である．猫を飼っており，庭の手入れもするという．生肉を避け土いじりには手袋を使うよう指導した．スクリーニング検査で梅毒血清反応が陽性で，トレポネーマ検査も陽性であった．直ちに行うべき対応はどれか．","options":[{"letter":"A","text":"妊娠の中断を勧める"},{"letter":"B","text":"分娩まで経過観察とする"},{"letter":"C","text":"ペニシリンによる治療を始める"},{"letter":"D","text":"出生後に児だけを治療する"},{"letter":"E","text":"抗ウイルス薬の投与を始める"}],"answer":["C"],"multi":false,"explanation":"解説：妊娠中にペニシリンで治療すれば胎児への感染をほぼ防げる．早いほど効果が高いので診断した時点で開始し，パートナーの検査と治療も同時に進める．治療後は抗体価で効果を確認する．\n- A：治療可能であり妊娠の中断を勧める根拠はない．\n- B：経過観察している間に胎児感染が成立する．\n- C：母子ともに救える治療で正しい．\n- D：出生後の治療では既に生じた臓器障害を戻せない．\n- E：抗ウイルス薬はウイルス感染の治療で，本例には無効．","images":[],"stem_images":[]}],"seed":null},{"id":"D-10_妊娠と分娩","name":"D-10_妊娠と分娩.md","label":"D-10 妊娠と分娩","count":32,"sourceHash":"de9723de7168","questions":[{"number":1,"section":"D-10-S01　29歳女性・無月経後の下腹部痛","question":"（1/4）29歳の女性．下腹部痛を主訴に来院した．2日前から痛みがあり，少量の性器出血もあるという．妊娠の可能性と妊娠週数を推定するための質問はどれか．","options":[{"letter":"A","text":"前の妊娠で問題はありましたか．"},{"letter":"B","text":"性感染症にかかったことはありますか．"},{"letter":"C","text":"最終月経はいつでしたか．"},{"letter":"D","text":"痛みは左右どちらが強いですか．"},{"letter":"E","text":"出血はどのくらいありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：生殖年齢の女性の下腹部痛では，まず妊娠の可能性を評価する．最終月経から無月経の有無を確かめ，妊娠反応を行うことが，緊急性の高い病態を見逃さないための第一歩になる．\n- A：産科既往に関する情報．\n- B：卵管病変の背景に関する情報．\n- C：妊娠の可能性の評価に直結し有用．\n- D：腹痛の局在に関する情報．\n- E：出血の重症度に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-10-S01　29歳女性・無月経後の下腹部痛","question":"（2/4）29歳の女性．下腹部痛を主訴に来院した．2日前から痛みがあり，少量の性器出血もあるという．最終月経は8週前で，その後は来ていないという．次に行うべき検査はどれか．","options":[{"letter":"A","text":"尿中hCGと経腟超音波検査"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"上部消化管内視鏡と生検"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["A"],"multi":false,"explanation":"解説：妊娠反応で妊娠の成立を確かめ，経腟超音波で子宮内に胎嚢があるかを見る．hCGが陽性なのに子宮内に胎嚢が見えない場合は，異所性妊娠か超早期の妊娠かを区別する必要がある．\n- A：緊急性の判定に直結し正しい．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":3,"section":"D-10-S01　29歳女性・無月経後の下腹部痛","question":"（3/4）29歳の女性．下腹部痛を主訴に来院した．2日前から痛みがあり，少量の性器出血もあるという．最終月経は8週前で，その後は来ていないという．尿中hCGは陽性だが，経腟超音波で子宮内に胎嚢を認めない．血中hCGは4200mIU/mLであった．左付属器領域に腫瘤像を認める．最も考えられるのはどれか．","options":[{"letter":"A","text":"稽留流産となっている"},{"letter":"B","text":"正常な子宮内妊娠の初期"},{"letter":"C","text":"胞状奇胎が形成されている"},{"letter":"D","text":"子宮内膜症の増悪である"},{"letter":"E","text":"卵管に着床した妊娠である"}],"answer":["E"],"multi":false,"explanation":"解説：血中hCGが1500〜2000mIU/mLを超えれば子宮内の胎嚢が見えるはずで，見えないのに付属器に腫瘤があれば異所性妊娠を強く疑う．着床部位は卵管膨大部が最も多い．\n- A：稽留流産では子宮内に胎嚢が確認できる．\n- B：このhCG値で子宮内に胎嚢が見えないのは正常ではない．\n- C：胞状奇胎では子宮が大きく，超音波で嚢胞状の多数の小嚢胞を認める．\n- D：子宮内膜症では妊娠反応は陽性にならない．\n- E：所見の組合せから最も考えられ正しい．","images":[],"stem_images":[]},{"number":4,"section":"D-10-S01　29歳女性・無月経後の下腹部痛","question":"（4/4）29歳の女性．下腹部痛を主訴に来院した．2日前から痛みがあり，少量の性器出血もあるという．最終月経は8週前で，その後は来ていないという．尿中hCGは陽性だが，経腟超音波で子宮内に胎嚢を認めない．血中hCGは4200mIU/mLであった．左付属器領域に腫瘤像を認める．診察中に強い腹痛を訴え，血圧が72/44mmHgへ低下し左肩も痛むという．この所見が示すのはどれか．","options":[{"letter":"A","text":"卵管が破裂し腹腔内出血をきたした"},{"letter":"B","text":"子宮内膜が急激に肥厚したこと"},{"letter":"C","text":"尿管に結石が嵌頓したこと"},{"letter":"D","text":"卵巣に良性の嚢胞ができたこと"},{"letter":"E","text":"子宮が感染で強い炎症を起こしたこと"}],"answer":["A"],"multi":false,"explanation":"解説：腹腔内に貯留した血液が横隔膜を刺激し，横隔神経を介して左肩へ関連痛が放散する．出血性ショックを伴うため，直ちに輸液と輸血を始めながら緊急手術に進む．\n- A：ショックと肩への放散痛を説明し正しい．\n- B：内膜の肥厚では急性のショックは起こらない．\n- C：尿管結石では疝痛と血尿が主症状．\n- D：良性嚢胞ではこの急激な血圧低下を説明できない．\n- E：子宮内感染では発熱と圧痛が前景に立つ．","images":[],"stem_images":[]},{"number":5,"section":"D-10-S02　26歳女性・妊娠初期の嘔吐","question":"（1/4）26歳の女性．妊娠9週．2週間前から嘔吐が続き，水分もとれないという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"尿量は減っていませんか．"},{"letter":"B","text":"体重はどれだけ減りましたか．"},{"letter":"C","text":"ふらつきや物の二重見はありますか．"},{"letter":"D","text":"以前から月経痛は強かったですか．"},{"letter":"E","text":"何日間，食事がとれませんか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．妊娠前の月経痛は今回の嘔吐の重症度評価では優先度が低い．\n- A：脱水の程度を確認．\n- B：栄養状態への影響を評価．\n- C：ビタミンB1欠乏による神経症状を確認．\n- D：妊娠前の月経痛は今回の嘔吐の重症度評価では優先度が低い．この設問で選ぶ肢．\n- E：栄養不足の持続期間を確認．","images":[],"stem_images":[]},{"number":6,"section":"D-10-S02　26歳女性・妊娠初期の嘔吐","question":"（2/4）26歳の女性．妊娠9週．2週間前から嘔吐が続き，水分もとれないという．妊娠前より4kg減って体重は48kgで，皮膚のツルゴールも低下しているという．行うべき検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィによる全身検索"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"尿ケトン体と電解質の測定"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["C"],"multi":false,"explanation":"解説：飢餓による脂肪分解でケトン体が尿に出る．嘔吐による低カリウム血症と低塩素性代謝性アルカローシスも起こるため，電解質と酸塩基平衡を確かめて補正の方針を立てる．\n- A：骨シンチグラフィによる全身検索は骨病変の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：重症度と補正すべき異常を同時に評価でき正しい．\n- D：内視鏡は消化管疾患の評価だが，本例の第一選択ではない．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":7,"section":"D-10-S02　26歳女性・妊娠初期の嘔吐","question":"（3/4）26歳の女性．妊娠9週．2週間前から嘔吐が続き，水分もとれないという．妊娠前より4kg減って体重は48kgだという．尿ケトン体3+，血清カリウム3.1mEq/L，血清ナトリウム131mEq/Lであった．入院のうえ補液を開始する際に必ず加えるべきなのはどれか．","options":[{"letter":"A","text":"副腎皮質ステロイド"},{"letter":"B","text":"ビタミンB1の補充"},{"letter":"C","text":"鉄剤の静脈内投与"},{"letter":"D","text":"抗菌薬の全身投与"},{"letter":"E","text":"免疫グロブリン製剤"}],"answer":["B"],"multi":false,"explanation":"解説：長期の嘔吐でビタミンB1が枯渇している状態にブドウ糖を負荷すると，糖代謝に消費されて欠乏が顕在化し，眼球運動障害・失調・意識障害を三徴とする脳症を起こす．\n- A：ステロイドは難治例で検討されるが，必須ではない．\n- B：脳症の予防に不可欠で正しい．\n- C：鉄剤は鉄欠乏性貧血の治療．\n- D：抗菌薬は感染症の治療．\n- E：免疫グロブリンはこの病態の治療ではない．","images":[],"stem_images":[]},{"number":8,"section":"D-10-S02　26歳女性・妊娠初期の嘔吐","question":"（4/4）26歳の女性．妊娠9週．2週間前から嘔吐が続き，水分もとれないという．妊娠前より4kg減って体重は48kgだという．尿ケトン体3+，血清カリウム3.1mEq/L，血清ナトリウム131mEq/Lであった．入院して補液を開始した．症状が通常より重くなる背景として考えるべきなのはどれか．","options":[{"letter":"A","text":"多胎妊娠や胞状奇胎の存在"},{"letter":"B","text":"子宮筋腫が合併していること"},{"letter":"C","text":"妊娠前から高血圧があること"},{"letter":"D","text":"骨盤が狭いこと"},{"letter":"E","text":"血液型がRh陰性であること"}],"answer":["A"],"multi":false,"explanation":"解説：hCGの産生量が多いほど症状が重くなるため，多胎妊娠や胞状奇胎では嘔吐が強く遷延する．超音波で胎児数と子宮内の所見を確かめ，必要ならhCG値も評価する．\n- A：hCG過剰という共通機序があり正しい．\n- B：子宮筋腫は嘔吐の程度に直接影響しない．\n- C：妊娠前からの高血圧は妊娠高血圧症候群の危険因子．\n- D：狭骨盤は分娩期の問題．\n- E：Rh陰性は血液型不適合妊娠の問題．","images":[],"stem_images":[]},{"number":9,"section":"D-10-S03　31歳女性・妊娠9週の性器出血","question":"（1/4）31歳の女性．妊娠9週．昨日から少量の性器出血があり来院した．軽い下腹部の張りを感じるという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"出血はどのくらいありますか．"},{"letter":"B","text":"子宮内の胎嚢は確認済みですか．"},{"letter":"C","text":"塊や組織が出ましたか．"},{"letter":"D","text":"腹痛は強くなっていますか．"},{"letter":"E","text":"妊娠前から腰がこりますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性腰部症状は今回の性器出血の初期評価では優先度が低い．\n- A：出血の重症度を確認．\n- B：異所性妊娠を除外できるか確認．\n- C：妊娠組織の排出を確認．\n- D：病状の進行を評価．\n- E：慢性腰部症状は今回の性器出血の初期評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":10,"section":"D-10-S03　31歳女性・妊娠9週の性器出血","question":"（2/4）31歳の女性．妊娠9週．昨日から少量の性器出血があり来院した．軽い下腹部の張りを感じるという．出血は少量で組織の排出はないという．次に確認すべきなのはどれか．","options":[{"letter":"A","text":"骨盤の大きさと形態"},{"letter":"B","text":"子宮口の開大と胎児心拍"},{"letter":"C","text":"血清アルブミンの値"},{"letter":"D","text":"骨密度と骨代謝マーカー"},{"letter":"E","text":"呼気中一酸化窒素濃度"}],"answer":["B"],"multi":false,"explanation":"解説：子宮口が閉じていて胎児心拍が確認できれば切迫流産で，妊娠の継続が期待できる．子宮口が開大していれば進行流産，心拍が確認できず胎嚢内で発育が止まっていれば稽留流産になる．\n- A：骨盤の評価は分娩期の問題．\n- B：病型の決定に直結し正しい．\n- C：アルブミンは栄養状態の指標．\n- D：骨密度は骨粗鬆症の評価．\n- E：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．","images":[],"stem_images":[]},{"number":11,"section":"D-10-S03　31歳女性・妊娠9週の性器出血","question":"（3/4）31歳の女性．妊娠9週．昨日から少量の性器出血があり来院した．軽い下腹部の張りを感じるという．出血は少量で組織の排出はないという．内診で子宮口は閉鎖し，経腟超音波で胎嚢内に胎芽と心拍を確認できた．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに子宮内容除去術を行う"},{"letter":"B","text":"抗菌薬を長期に予防投与する"},{"letter":"C","text":"副腎皮質ステロイドを開始する"},{"letter":"D","text":"再診の目安を説明し経過観察する"},{"letter":"E","text":"子宮収縮薬を投与して排出を促す"}],"answer":["D"],"multi":false,"explanation":"解説：胎児心拍が確認できる少量出血では，症状と超音波所見を経過観察する．出血増加，強い腹痛，失神などでは早めの再診を指示する．流産予防のための一律の臥床安静には有効性の根拠がない．\n- A：胎児が生存しており内容除去は適応がない．\n- B：感染徴候がなく抗菌薬は不要．\n- C：ステロイドはこの病態の治療ではない．\n- D：胎児心拍があり，出血や腹痛の増悪時に再評価する．\n- E：子宮収縮薬は流産を進めてしまう．","images":[],"stem_images":[]},{"number":12,"section":"D-10-S03　31歳女性・妊娠9週の性器出血","question":"（4/4）31歳の女性．妊娠9週．昨日から少量の性器出血があり来院した．軽い下腹部の張りを感じるという．出血は少量で組織の排出はないという．内診で子宮口は閉鎖し，経腟超音波で胎嚢内に胎芽と心拍を確認できたため，再診の目安を説明して経過観察とした．仮に心拍が確認できず胎芽の発育も止まっていた場合，その最も多い原因はどれか．","options":[{"letter":"A","text":"母体の過労と精神的な緊張"},{"letter":"B","text":"母体の軽度の貧血"},{"letter":"C","text":"胎児の染色体異常"},{"letter":"D","text":"母体の軽い運動の継続"},{"letter":"E","text":"母体の性交渉の継続"}],"answer":["C"],"multi":false,"explanation":"解説：妊娠初期の流産では胎児の染色体異常が最も多い原因である．通常の運動や性交を原因と決めつけず，患者の自責感に配慮して説明する．\n- A：過労やストレスが主因という科学的根拠はない．\n- B：軽度の貧血が初期流産の主因になることはない．\n- C：初期流産の最多の原因で正しい．\n- D：通常の運動は流産の原因にならない．\n- E：性交渉も初期流産の原因とはされない．","images":[],"stem_images":[]},{"number":13,"section":"D-10-S04　34歳女性・妊娠34週の血圧上昇","question":"（1/4）34歳の女性．妊娠34週．定期健診で血圧162/104mmHg，尿蛋白2+を指摘された．初産である．高血圧に伴う中枢神経症状を確認する質問はどれか．","options":[{"letter":"A","text":"頭痛や目のちらつきはありますか．"},{"letter":"B","text":"右の肋骨の下が痛みますか．"},{"letter":"C","text":"息苦しさはありますか．"},{"letter":"D","text":"尿量が減っていませんか．"},{"letter":"E","text":"胎動が減っていませんか．"}],"answer":["A"],"multi":false,"explanation":"解説：頭痛・視覚異常・心窩部痛は子癇発作やHELLP症候群の前兆で，これらがあれば重症と判断して速やかに妊娠の終了を検討する．無症状でも重症域の血圧なら管理を強化する．\n- A：重症化の徴候を拾え有用．\n- B：肝被膜伸展などの症状に関する情報．\n- C：肺水腫の症状に関する情報．\n- D：腎障害の症状に関する情報．\n- E：胎児の状態に関する情報．","images":[],"stem_images":[]},{"number":14,"section":"D-10-S04　34歳女性・妊娠34週の血圧上昇","question":"（2/4）34歳の女性．妊娠34週．定期健診で血圧162/104mmHg，尿蛋白2+を指摘された．初産である．2日前から強い頭痛があり，目の前がチカチカするという．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査の施行"},{"letter":"B","text":"骨シンチグラフィによる全身検索"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"血算・肝機能・凝固と胎児評価"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：血小板減少・肝逸脱酵素の上昇・溶血が揃えばHELLP症候群である．同時に胎児心拍モニタリングと超音波で胎児の発育と羊水量を評価し，母児双方の緊急度を判定する．\n- A：呼吸機能検査は換気障害の評価．\n- B：骨シンチグラフィによる全身検索は骨病変の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：母児の緊急度を同時に判定でき正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":15,"section":"D-10-S04　34歳女性・妊娠34週の血圧上昇","question":"（3/4）34歳の女性．妊娠34週．定期健診で血圧162/104mmHg，尿蛋白2+を指摘された．初産である．2日前から強い頭痛があり，目の前がチカチカするという．血小板8.2万/μL，AST 186IU/L，LDH 628IU/Lであった．胎児心拍モニタリングでは遅発一過性徐脈を認める．けいれんの予防に用いるのはどれか．","options":[{"letter":"A","text":"抗菌薬の全身投与"},{"letter":"B","text":"副腎皮質ステロイドの内服"},{"letter":"C","text":"硫酸マグネシウムの静注"},{"letter":"D","text":"鉄剤の静脈内投与"},{"letter":"E","text":"抗ヒスタミン薬の内服"}],"answer":["C"],"multi":false,"explanation":"解説：硫酸マグネシウムは子癇発作の予防と治療の第一選択である．投与中は膝蓋腱反射の消失・呼吸抑制・尿量低下といった中毒徴候を監視し，過量時はグルコン酸カルシウムで拮抗する．\n- A：抗菌薬は感染症の治療．\n- B：ステロイドは胎児肺成熟の目的で用いるが，けいれん予防ではない．\n- C：この病態の標準治療で正しい．\n- D：鉄剤は鉄欠乏性貧血の治療．\n- E：抗ヒスタミン薬はアレルギー疾患の治療．","images":[],"stem_images":[]},{"number":16,"section":"D-10-S04　34歳女性・妊娠34週の血圧上昇","question":"（4/4）34歳の女性．妊娠34週．定期健診で血圧162/104mmHg，尿蛋白2+を指摘された．初産である．2日前から強い頭痛があり，目の前がチカチカするという．血小板8.2万/μL，AST 186IU/L，LDH 628IU/Lであった．胎児心拍モニタリングでは遅発一過性徐脈を認める．この病態の根本的な治療はどれか．","options":[{"letter":"A","text":"長期の床上安静を続けること"},{"letter":"B","text":"塩分を完全に絶つこと"},{"letter":"C","text":"利尿薬で浮腫を取り除くこと"},{"letter":"D","text":"水分摂取を1日500mLに制限"},{"letter":"E","text":"妊娠を終了させること"}],"answer":["E"],"multi":false,"explanation":"解説：原因は胎盤にあるため，娩出しない限り病態は改善しない．週数と母児の状態を秤にかけ，重症例や臓器障害の進行例では在胎週数にかかわらず妊娠の終了を選ぶ．\n- A：安静だけでは病態は改善しない．\n- B：極端な塩分制限は循環血漿量をさらに減らし有害とされる．\n- C：利尿薬も循環血漿量を減らすため原則用いない．\n- D：水分制限も同様に推奨されない．\n- E：唯一の根本治療で正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-10-S05　30歳女性・妊娠30週の規則的な腹緊","question":"（1/4）30歳の女性．妊娠30週．昨日から下腹部の張りを繰り返し感じるという．少量の水様のおりものもある．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"発熱や帯下の悪臭はありますか．"},{"letter":"B","text":"胎動は普段どおりありますか．"},{"letter":"C","text":"張りは何分おきに起こりますか．"},{"letter":"D","text":"妊娠前から鼻炎がありますか．"},{"letter":"E","text":"水のような液が流れ続けますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．慢性鼻炎は切迫早産・破水の緊急評価では優先度が低い．\n- A：子宮内感染を検討．\n- B：胎児の状態を確認．\n- C：子宮収縮の規則性を確認．\n- D：慢性鼻炎は切迫早産・破水の緊急評価では優先度が低い．この設問で選ぶ肢．\n- E：破水を検討．","images":[],"stem_images":[]},{"number":18,"section":"D-10-S05　30歳女性・妊娠30週の規則的な腹緊","question":"（2/4）30歳の女性．妊娠30週．昨日から下腹部の張りを繰り返し感じるという．少量の水様のおりものもある．張りは8分おきに規則的に来るという．水様のおりものについて確認すべきなのはどれか．","options":[{"letter":"A","text":"血糖値が上がっていないか"},{"letter":"B","text":"骨密度が下がっていないか"},{"letter":"C","text":"呼気中の一酸化窒素の濃度"},{"letter":"D","text":"血清アミラーゼの値の推移"},{"letter":"E","text":"破水しているかどうかの確認"}],"answer":["E"],"multi":false,"explanation":"解説：破水していれば上行感染と臍帯脱出の危険があり，管理が大きく変わる．腟内容のpH測定や癌胎児性フィブロネクチン，インスリン様成長因子結合蛋白の検査で羊水の混入を確かめる．\n- A：血糖は妊娠糖尿病の評価．\n- B：骨密度は骨粗鬆症の評価．\n- C：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- D：アミラーゼは膵疾患の指標．\n- E：管理方針を大きく変え最も重要．","images":[],"stem_images":[]},{"number":19,"section":"D-10-S05　30歳女性・妊娠30週の規則的な腹緊","question":"（3/4）30歳の女性．妊娠30週．昨日から下腹部の張りを繰り返し感じるという．少量の水様のおりものもある．張りは8分おきに規則的に来るという．破水は否定された．経腟超音波で子宮頸管長は18mmと短縮していた．胎児心拍は良好である．胎児のために直ちに行うべきなのはどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの母体投与"},{"letter":"B","text":"母体への鉄剤の静脈内での投与"},{"letter":"C","text":"母体への抗ヒスタミン薬投与"},{"letter":"D","text":"母体への利尿薬の静脈内投与"},{"letter":"E","text":"母体への免疫グロブリン投与"}],"answer":["A"],"multi":false,"explanation":"解説：ベタメタゾンなどを母体に投与すると胎児のサーファクタント産生が促され，呼吸窮迫症候群・脳室内出血・壊死性腸炎の頻度が下がる．効果が出るまでの時間を収縮抑制薬で稼ぐ．\n- A：早産児の予後を直接改善し正しい．\n- B：鉄剤は母体の貧血治療で，胎児の肺成熟には関わらない．\n- C：抗ヒスタミン薬はアレルギー疾患の治療．\n- D：利尿薬は循環血漿量を減らし胎盤血流に不利．\n- E：免疫グロブリンはこの状況の治療ではない．","images":[],"stem_images":[]},{"number":20,"section":"D-10-S05　30歳女性・妊娠30週の規則的な腹緊","question":"（4/4）30歳の女性．妊娠30週．昨日から下腹部の張りを繰り返し感じるという．少量の水様のおりものもある．張りは8分おきに規則的に来るという．破水は否定された．経腟超音波で子宮頸管長は18mmと短縮していた．胎児心拍は良好である．副腎皮質ステロイドを投与し子宮収縮抑制薬を開始した．この時期に出生した児で最も警戒すべきなのはどれか．","options":[{"letter":"A","text":"生後まもなくの高血糖"},{"letter":"B","text":"呼吸窮迫症候群の発症"},{"letter":"C","text":"胎便の排泄が早すぎること"},{"letter":"D","text":"出生体重が過大になること"},{"letter":"E","text":"生後の体温が上がりすぎること"}],"answer":["B"],"multi":false,"explanation":"解説：サーファクタントが不足して肺胞が虚脱し，生後まもなく多呼吸・呻吟・陥没呼吸・チアノーゼをきたす．胸部エックス線で網状顆粒状陰影と気管支透亮像を認め，人工サーファクタントを投与する．\n- A：早産児はむしろ低血糖になりやすい．\n- B：この週数の児で最も頻度が高く正しい．\n- C：胎便の排泄遅延はありうるが，最優先の警戒対象ではない．\n- D：早産児は出生体重が小さい．\n- E：早産児は体温を保てず低体温になりやすい．","images":[],"stem_images":[]},{"number":21,"section":"D-10-S06　33歳女性・妊娠33週の持続する腹痛","question":"（1/4）33歳の女性．妊娠33週．2時間前から下腹部が持続して強く痛み，少量の暗赤色の出血があるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"胎動が減っていませんか．"},{"letter":"B","text":"腹部を打ったことはありますか．"},{"letter":"C","text":"妊娠前の月経周期は何日でしたか．"},{"letter":"D","text":"痛みは持続しますか．"},{"letter":"E","text":"高血圧を指摘されていますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．週数が判明した現時点の緊急評価では優先度が低い．\n- A：胎児状態の変化を確認．\n- B：外傷を契機とする病変を検討．\n- C：週数が判明した現時点の緊急評価では優先度が低い．この設問で選ぶ肢．\n- D：陣痛との性状の違いを確認．\n- E：胎盤早期剝離の危険因子を確認．","images":[],"stem_images":[]},{"number":22,"section":"D-10-S06　33歳女性・妊娠33週の持続する腹痛","question":"（2/4）33歳の女性．妊娠33週．2時間前から下腹部が持続して強く痛み，少量の暗赤色の出血があるという．痛みは波がなく続いているという．認められる所見はどれか．","options":[{"letter":"A","text":"子宮は収縮の合間に十分軟らかくなる"},{"letter":"B","text":"子宮口が全開大している"},{"letter":"C","text":"子宮が板のように硬く圧痛が強い"},{"letter":"D","text":"子宮底が臍下3横指に下がっている"},{"letter":"E","text":"子宮がまったく触知できない"}],"answer":["C"],"multi":false,"explanation":"解説：剝離した部位に血液が貯留して子宮筋層に浸潤し，子宮は持続的に収縮して板のように硬くなる．強い圧痛を伴い，胎児部分が触れにくくなる．胎児心拍の異常も高率に伴う．\n- A：収縮の合間に軟らかくなるのは正常な陣痛．\n- B：子宮口の全開大は分娩第1期の終了を示す所見．\n- C：この病態に特徴的で正しい．\n- D：子宮底の下降は児頭の下降に伴う正常の変化．\n- E：妊娠33週で子宮が触知できないことはない．","images":[],"stem_images":[]},{"number":23,"section":"D-10-S06　33歳女性・妊娠33週の持続する腹痛","question":"（3/4）33歳の女性．妊娠33週．2時間前から下腹部が持続して強く痛み，少量の暗赤色の出血があるという．痛みは波がなく続いているという．子宮は板状に硬く強い圧痛を認める．外出血は少量だが血圧は88/52mmHg，脈拍122/分である．胎児心拍は徐脈が持続している．外出血の量と重症度が一致しない理由はどれか．","options":[{"letter":"A","text":"出血が尿路へ流れ込むため"},{"letter":"B","text":"出血が消化管内に貯留するため"},{"letter":"C","text":"出血が皮下組織に広がるため"},{"letter":"D","text":"血液が子宮内に貯留するため"},{"letter":"E","text":"出血が胸腔内へ流入するため"}],"answer":["D"],"multi":false,"explanation":"解説：剝離面からの出血の多くは胎盤の後方に
