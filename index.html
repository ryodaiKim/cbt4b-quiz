      }));
    }

    if (path === "/api/status") {
      if (method === "GET") return Promise.resolve(jsonResponse(statusFor(current)));
      if (method === "POST") {
        let payload = {};
        try { payload = JSON.parse((init && init.body) || "{}"); } catch (e) { /* keep empty */ }
        const ok = saveStatus(current, payload);
        return Promise.resolve(jsonResponse({ ok: ok }, ok ? 200 : 507));
      }
    }

    // This build has nowhere to put uploaded note images; the paste zone is
    // hidden by offline.css, and a stray drop gets a clear message instead.
    if (path.indexOf("/api/note-images") === 0) {
      if (method === "DELETE") return Promise.resolve(jsonResponse({ ok: true }));
      return Promise.resolve(jsonResponse(
        { error: "image notes are not available in the offline build" }, 501));
    }

    if (nativeFetch) return nativeFetch(input, init);
    return Promise.reject(new Error("offline build: " + path));
  };

  // app.js flushes a pending save through sendBeacon on unload.
  const nativeBeacon = navigator.sendBeacon ? navigator.sendBeacon.bind(navigator) : null;
  navigator.sendBeacon = function (url, data) {
    if (pathOf(url) === "/api/status") {
      if (typeof data === "string") {
        try { saveStatus(current, JSON.parse(data)); } catch (e) { /* drop */ }
      } else if (data && typeof data.text === "function") {
        data.text().then(txt => {
          try { saveStatus(current, JSON.parse(txt)); } catch (e) { /* drop */ }
        }).catch(() => {});
      }
      return true;
    }
    return nativeBeacon ? nativeBeacon(url, data) : false;
  };

  // iOS often suspends the page without firing beforeunload; nudge app.js to
  // flush whatever it has debounced.
  function flush() {
    try { window.dispatchEvent(new Event("beforeunload")); } catch (e) { /* ignore */ }
  }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flush();
  });

  // iPadOS Safari has no Element.requestFullscreen; keep the button inert
  // instead of letting it throw.
  if (!Element.prototype.requestFullscreen) {
    Element.prototype.requestFullscreen =
      Element.prototype.webkitRequestFullscreen || function () { return Promise.resolve(); };
  }

  // --- injected UI ---------------------------------------------------------
  function el(tag, attrs, text) {
    const node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(k => node.setAttribute(k, attrs[k]));
    if (text != null) node.textContent = text;
    return node;
  }

  function switchDeck(id) {
    if (id === current.id) return;
    flush();
    write(LAST_DECK, id);
    window.location.hash = "deck=" + encodeURIComponent(id);
    window.location.reload();
  }

  function exportPayload() {
    const out = {
      kind: "quiz-runner-progress",
      version: 1,
      exported: new Date().toISOString(),
      decks: {},
    };
    decks.forEach(deck => {
      const saved = read(statusKey(deck));
      if (saved && saved.questions) out.decks[deck.name] = saved;
    });
    return out;
  }

  function exportFilename() {
    const t = new Date();
    const p = n => String(n).padStart(2, "0");
    return "quiz-progress-" + t.getFullYear() + p(t.getMonth() + 1) + p(t.getDate())
      + "-" + p(t.getHours()) + p(t.getMinutes()) + ".json";
  }

  function importPayload(raw, say) {
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      say("読み込めません: JSONとして壊れています。", true);
      return;
    }
    const incoming = (parsed && parsed.decks) || null;
    if (!incoming || typeof incoming !== "object") {
      say("読み込めません: decks が見つかりません。", true);
      return;
    }
    let applied = 0;
    const skipped = [];
    Object.keys(incoming).forEach(name => {
      const deck = decks.find(d => d.name === name || d.id === name);
      const blob = incoming[name];
      if (!deck || !blob || !blob.questions) {
        skipped.push(name);
        return;
      }
      if (write(statusKey(deck), blob)) applied += 1;
      else skipped.push(name);
    });
    let msg = applied + " 件のデッキを読み込みました。";
    if (skipped.length) msg += " 対象外: " + skipped.join(", ");
    say(msg, applied === 0);
    if (applied) setTimeout(() => window.location.reload(), 900);
  }

  function openPanel() {
    const backdrop = el("div", { class: "prog-backdrop" });
    const panel = el("div", { class: "prog-panel", role: "dialog", "aria-modal": "true" });
    backdrop.appendChild(panel);

    panel.appendChild(el("h2", {}, "進捗の保存"));
    const withProgress = decks.filter(hasProgress).length;
    panel.appendChild(el("p", {}, persistent
      ? "このブラウザに保存されています（" + withProgress + " / " + decks.length + " デッキ）。Macの .status.json に戻すには書き出してください。"
      : "進捗はこのページを閉じると消えます。"));

    if (!persistent) {
      panel.appendChild(el("div", { class: "prog-warn" },
        "このブラウザでは保存領域が使えません（file:// を直接開いた場合に起きます）。"
        + "Webサーバ経由かホーム画面に追加した状態で開くか、こまめに書き出してください。"));
    }
    if (quotaHit) {
      panel.appendChild(el("div", { class: "prog-warn" },
        "保存容量の上限に達しました。書き出して、不要なデッキの進捗を消してください。"));
    }

    const msg = el("div", { class: "prog-msg" });
    const say = (text, isErr) => {
      msg.textContent = text;
      msg.classList.toggle("err", !!isErr);
    };

    const row = el("div", { class: "prog-row" });

    const exportBtn = el("button", { type: "button", class: "primary" }, "書き出す");
    exportBtn.addEventListener("click", () => {
      flush();
      const text = JSON.stringify(exportPayload(), null, 1);
      try {
        const blob = new Blob([text], { type: "application/json" });
        const a = el("a", { download: exportFilename() });
        a.href = URL.createObjectURL(blob);
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 2000);
        say("書き出しました（" + Math.round(text.length / 1024) + " KB）。保存先を選べない場合は下のテキストをコピーしてください。");
      } catch (e) {
        say("ダウンロードできませんでした。下のテキストをコピーしてください。", true);
      }
      area.value = text;
      details.open = true;
    });
    row.appendChild(exportBtn);

    const fileLabel = el("label", { class: "prog-file" }, "読み込む");
    const fileInput = el("input", { type: "file", accept: "application/json,.json" });
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importPayload(String(reader.result || ""), say);
      reader.onerror = () => say("ファイルを読めませんでした。", true);
      reader.readAsText(f);
    });
    fileLabel.appendChild(fileInput);
    row.appendChild(fileLabel);

    const clearBtn = el("button", { type: "button", class: "danger" }, "このデッキを消す");
    clearBtn.addEventListener("click", () => {
      if (!window.confirm(current.label + " の進捗を消します。よろしいですか？")) return;
      try { store.removeItem(statusKey(current)); } catch (e) { /* ignore */ }
      say("消しました。再読み込みします。");
      setTimeout(() => window.location.reload(), 600);
    });
    row.appendChild(clearBtn);

    const closeBtn = el("button", { type: "button" }, "閉じる");
    closeBtn.addEventListener("click", () => backdrop.remove());
    row.appendChild(closeBtn);

    panel.appendChild(row);
    panel.appendChild(msg);

    const details = el("details", { class: "prog-note" });
    details.appendChild(el("summary", {}, "コピー用テキスト（ダウンロードが使えないとき）"));
    const area = el("textarea", { readonly: "readonly", spellcheck: "false" });
    details.appendChild(area);
    panel.appendChild(details);

    backdrop.addEventListener("click", e => {
      if (e.target === backdrop) backdrop.remove();
    });
    document.body.appendChild(backdrop);
  }

  function injectControls() {
    const header = document.querySelector(".header");
    const title = document.getElementById("source-title");
    if (!header || !title) return;

    const select = el("select", { class: "deck-select", id: "deck-select", "aria-label": "Deck" });
    decks.forEach(deck => {
      const opt = el("option", { value: deck.id }, deck.label + " (" + deck.count + ")");
      if (deck.id === current.id) opt.setAttribute("selected", "selected");
      select.appendChild(opt);
    });
    select.value = current.id;
    select.addEventListener("change", () => switchDeck(select.value));

    const progBtn = el("button", { class: "hd-btn", type: "button", id: "prog-btn", title: "Progress" });
    progBtn.appendChild(el("span", { class: "icon" }, "⇅"));
    progBtn.appendChild(el("span", { class: "lbl" }, "Progress"));
    progBtn.addEventListener("click", openPanel);

    header.insertBefore(select, title);
    header.insertBefore(progBtn, select);

    document.title = current.label + " — Quiz Runner";
  }

  document.addEventListener("DOMContentLoaded", injectControls);
})();

</script>
  <script>
(function () {
  "use strict";

  const state = {
    questions: [],
    statuses: {},
    source: "",
    sourceHash: "",
    currentIdx: 0,
    selected: new Set(),
    submitted: false,
    saveTimer: null,
    filter: { all: true, learning: false, reviewing: false, mastered: false },
  };

  async function init() {
    try {
      const qRes = await fetch("/api/questions");
      const q = await qRes.json();
      state.questions = q.questions || [];
      state.source = q.source || "";
      state.sourceHash = q.sourceHash || "";

      const sRes = await fetch("/api/status");
      const s = await sRes.json();
      state.statuses = (s && s.questions) || {};
    } catch (err) {
      document.body.innerHTML = "<p style='padding:40px'>Failed to load: " + escapeHtml(String(err)) + "</p>";
      return;
    }

    state.questions.forEach((_, i) => {
      const k = String(i + 1);
      state.statuses[k] = normalizeQuestionStatus(state.statuses[k]);
    });

    document.getElementById("source-title").textContent = state.source;
    document.getElementById("source-title").title = state.source;

    bindUI();
    renderFilterBar();
    renderMain();
  }

  function currentKey() { return String(state.currentIdx + 1); }
  function currentQ() { return state.questions[state.currentIdx]; }
  function statusForKey(key) {
    state.statuses[key] = normalizeQuestionStatus(state.statuses[key]);
    return state.statuses[key];
  }
  function currentStatus() { return statusForKey(currentKey()); }
  function isMulti(q) { return q.multi || (q.answer && q.answer.length > 1); }

  function defaultQuestionStatus() {
    return {
      status: "unanswered",
      marked: false,
      attempts: 0,
      correctAttempts: 0,
      notes: { text: "", images: [] },
    };
  }

  function normalizeQuestionStatus(s) {
    const out = (s && typeof s === "object") ? s : defaultQuestionStatus();
    if (!out.status) out.status = "unanswered";
    if (typeof out.marked !== "boolean") out.marked = false;
    if (typeof out.attempts !== "number") out.attempts = 0;
    if (typeof out.correctAttempts !== "number") out.correctAttempts = 0;
    if (!out.notes || typeof out.notes !== "object") out.notes = { text: "", images: [] };
    if (typeof out.notes.text !== "string") out.notes.text = "";
    if (!Array.isArray(out.notes.images)) out.notes.images = [];
    out.notes.images = out.notes.images.filter(img => img && typeof img === "object");
    return out;
  }

  function currentNotes() {
    return currentStatus().notes;
  }

  function notesForKey(key) {
    return statusForKey(key).notes;
  }

  function hasQuestionNotes(s) {
    const notes = s && s.notes;
    return !!(notes && (
      (notes.text || "").trim() ||
      (Array.isArray(notes.images) && notes.images.some(img => !!noteImageSrc(img)))
    ));
  }

  function isVisible(i) {
    if (state.filter.all) return true;
    const s = state.statuses[String(i + 1)] || {};
    return !!state.filter[s.status];
  }

  function visibleIndices() {
    const out = [];
    for (let i = 0; i < state.questions.length; i++) if (isVisible(i)) out.push(i);
    return out;
  }

  function renderSidebar() {
    const sb = document.getElementById("sidebar-list");
    sb.innerHTML = "";
    let shown = 0;
    state.questions.forEach((q, i) => {
      if (!isVisible(i)) return;
      shown++;
      const key = String(i + 1);
      const s = normalizeQuestionStatus(state.statuses[key]);
      const hasNotes = hasQuestionNotes(s);
      const row = document.createElement("div");
      row.className = "sb-row" + (i === state.currentIdx ? " active" : "") + (s.marked ? " marked" : "") + (hasNotes ? " has-notes" : "");
      if (hasNotes) row.title = "Has notes";
      row.addEventListener("click", () => gotoQuestion(i));

      const icon = document.createElement("span");
      icon.className = "sb-icon";
      if (s.lastCorrect === true) { icon.textContent = "✓"; icon.classList.add("ok"); }
      else if (s.lastCorrect === false) { icon.textContent = "✗"; icon.classList.add("bad"); }
      else { icon.textContent = "•"; icon.classList.add("none"); }
      row.appendChild(icon);

      const num = document.createElement("span");
      num.className = "sb-num";
      num.textContent = i + 1;
      row.appendChild(num);

      const pill = document.createElement("span");
      pill.className = "sb-pill";
      if (s.status === "learning") pill.classList.add("learning");
      else if (s.status === "reviewing") pill.classList.add("reviewing");
      else if (s.status === "mastered") pill.classList.add("mastered");
      row.appendChild(pill);

      const noteMark = document.createElement("span");
      noteMark.className = "sb-note";
      noteMark.textContent = hasNotes ? "N" : "";
      row.appendChild(noteMark);

      sb.appendChild(row);
    });
    if (shown === 0) {
      const empty = document.createElement("div");
      empty.className = "sb-empty";
      empty.textContent = "No questions match the current filter.";
      sb.appendChild(empty);
    }
    const active = sb.querySelector(".active");
    if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function renderFilterBar() {
    document.querySelectorAll("#sb-filter .flt-btn").forEach(b => {
      b.classList.toggle("active", !!state.filter[b.dataset.flt]);
    });
  }

  function toggleFilter(name) {
    if (name === "all") {
      state.filter = { all: true, learning: false, reviewing: false, mastered: false };
    } else {
      state.filter.all = false;
      state.filter[name] = !state.filter[name];
      if (!state.filter.learning && !state.filter.reviewing && !state.filter.mastered) {
        state.filter.all = true;
      }
    }
    renderFilterBar();
    renderSidebar();
  }

  function renderMain() {
    const q = currentQ();
    if (!q) return;
    document.getElementById("item-counter").textContent =
      `Item: ${state.currentIdx + 1} of ${state.questions.length}`;
    document.getElementById("section-label").textContent = q.section || "";

    const qs = currentStatus();
    document.getElementById("mark-checkbox").checked = !!qs.marked;

    document.getElementById("question-text").textContent = q.question;
    renderStemImages(q);

    state.selected = new Set();
    state.submitted = false;
    if (Array.isArray(qs.lastAnswer) && qs.lastAnswer.length) {
      qs.lastAnswer.forEach(l => state.selected.add(l));
      state.submitted = true;
    }

    const list = document.getElementById("options-list");
    list.innerHTML = "";
    const multi = isMulti(q);
    q.options.forEach((opt, i) => {
      const row = document.createElement("div");
      row.className = "opt-row";
      row.dataset.letter = opt.letter;

      const ctrl = document.createElement("span");
      ctrl.className = "opt-control " + (multi ? "check" : "radio");
      row.appendChild(ctrl);

      const lbl = document.createElement("span");
      lbl.className = "opt-label";
      lbl.innerHTML = `<b>${opt.letter}.</b>${escapeHtml(opt.text)} <span class="opt-key">[${i + 1}]</span>`;
      row.appendChild(lbl);

      if (state.selected.has(opt.letter)) row.classList.add("selected");
      row.addEventListener("click", () => toggleOption(opt.letter));
      list.appendChild(row);
    });

    const note = document.getElementById("multi-note");
    if (multi) {
      note.textContent = `（${q.answer.length || 2}つ選択）`;
      note.style.display = "";
    } else {
      note.style.display = "none";
    }

    renderSubmitState();
    renderExplanation();
    renderStatusButtons();
    renderNotes();
    renderSidebar();
  }

  function toggleOption(letter) {
    if (state.submitted) {
      state.submitted = false;
      state.selected = new Set();
      document.querySelectorAll(".opt-row").forEach(r => {
        r.classList.remove("selected", "correct", "wrong");
      });
      document.getElementById("explanation-box").hidden = true;
    }
    const q = currentQ();
    if (isMulti(q)) {
      if (state.selected.has(letter)) state.selected.delete(letter);
      else state.selected.add(letter);
    } else {
      state.selected.clear();
      state.selected.add(letter);
    }
    document.querySelectorAll(".opt-row").forEach(r => {
      r.classList.toggle("selected", state.selected.has(r.dataset.letter));
    });
    renderSubmitState();
  }

  function renderSubmitState() {
    const btn = document.getElementById("submit-btn");
    const resetBtn = document.getElementById("reset-btn");
    const has = state.selected.size > 0;
    if (state.submitted) {
      btn.textContent = "Submitted";
      btn.disabled = true;
      btn.classList.remove("active");
      resetBtn.hidden = false;
    } else {
      btn.textContent = "Submit [C]";
      btn.disabled = !has;
      btn.classList.toggle("active", has);
      resetBtn.hidden = true;
    }
  }

  function resetAnswer() {
    const s = currentStatus();
    delete s.lastAnswer;
    delete s.lastCorrect;
    delete s.lastAnsweredAt;
    state.submitted = false;
    state.selected = new Set();
    persistSoon();
    renderMain();
  }

  function submitAnswer() {
    if (state.submitted || state.selected.size === 0) return;
    const q = currentQ();
    const picked = Array.from(state.selected).sort();
    const correctSet = new Set(q.answer);
    const correct =
      picked.length === correctSet.size &&
      picked.every(l => correctSet.has(l));

    const s = currentStatus();
    s.attempts = (s.attempts || 0) + 1;
    if (correct) s.correctAttempts = (s.correctAttempts || 0) + 1;
    s.lastAnswer = picked;
    s.lastCorrect = correct;
    s.lastAnsweredAt = new Date().toISOString();
    state.submitted = true;
    persistSoon();
    renderSubmitState();
    renderExplanation();
    renderSidebar();
  }

  function renderExplanation() {
    const box = document.getElementById("explanation-box");
    if (!state.submitted) { box.hidden = true; return; }
    const q = currentQ();
    const s = currentStatus();
    box.hidden = false;
    const verdict = s.lastCorrect
      ? `<span class="verdict correct">正解</span>`
      : `<span class="verdict wrong">不正解</span>`;
    const correctAns = q.answer.join(", ");
    const yourAns = (s.lastAnswer || []).join(", ") || "—";
    box.innerHTML = `
      <div class="verdict-row">${verdict}<span>正解: <b>${escapeHtml(correctAns)}</b>　あなたの回答: <b>${escapeHtml(yourAns)}</b></span></div>
      <div class="explanation-text">${escapeHtml(q.explanation || "(解説なし)")}</div>
    `;
    renderQuestionSlides(box, q);
    const correct = new Set(q.answer);
    document.querySelectorAll(".opt-row").forEach(r => {
      const l = r.dataset.letter;
      if (correct.has(l)) r.classList.add("correct");
      if (state.selected.has(l) && !correct.has(l)) r.classList.add("wrong");
    });
  }

  function appendSlides(parent, images, title) {
    if (!Array.isArray(images) || !images.length) return false;
    const wrap = document.createElement("div");
    wrap.className = "q-slides";
    if (title) {
      const t = document.createElement("div");
      t.className = "q-slides-title";
      t.textContent = title;
      wrap.appendChild(t);
    }
    images.forEach(img => {
      const src = imageAssetUrl(img.path);
      if (!src) return;
      const fig = document.createElement("figure");
      fig.className = "q-slide";
      const image = document.createElement("img");
      image.src = src;
      image.alt = img.caption || "slide";
      image.loading = "lazy";
      fig.appendChild(image);
      if (img.caption) {
        const cap = document.createElement("figcaption");
        cap.textContent = img.caption;
        fig.appendChild(cap);
      }
      fig.addEventListener("click", () => showImagePreview(src, img.caption || ""));
      wrap.appendChild(fig);
    });
    parent.appendChild(wrap);
    return true;
  }

  // Reference slides shown with the explanation, after submitting.
  function renderQuestionSlides(box, q) {
    appendSlides(box, q.images, "参考スライド");
  }

  // Stem images (e.g. an exam figure the question refers to), shown with the
  // question before answering. Hidden entirely when a question has none.
  function renderStemImages(q) {
    const el = document.getElementById("stem-images");
    if (!el) return;
    el.innerHTML = "";
    el.hidden = !appendSlides(el, q.stem_images, "");
  }

  function renderStatusButtons() {
    const box = document.getElementById("status-buttons");
    const s = currentStatus();
    ["learning", "reviewing", "mastered"].forEach(v => {
      const b = box.querySelector(`[data-status="${v}"]`);
      if (b) b.classList.toggle("active", s.status === v);
    });
  }

  function renderNotes() {
    const notes = currentNotes();
    const text = document.getElementById("note-text");
    const list = document.getElementById("note-images");
    const empty = document.getElementById("note-empty");
    const zone = document.getElementById("note-image-zone");

    text.value = notes.text || "";
    list.innerHTML = "";
    notes.images.forEach((img, idx) => {
      const src = noteImageSrc(img);
      if (!src) return;

      const fig = document.createElement("figure");
      fig.className = "note-image";

      const image = document.createElement("img");
      image.src = src;
      image.alt = img.name || "note image";
      image.loading = "lazy";
      image.title = "Preview";
      fig.appendChild(image);
      fig.addEventListener("click", () => showNotePreview(img));

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "note-image-remove";
      remove.title = "Remove image";
      remove.textContent = "×";
      remove.addEventListener("click", (e) => {
        e.stopPropagation();
        removeNoteImage(idx);
      });
      fig.appendChild(remove);

      const caption = document.createElement("figcaption");
      caption.textContent = img.name || img.id || "image";
      fig.appendChild(caption);

      list.appendChild(fig);
    });

    const hasImages = list.childElementCount > 0;
    empty.hidden = hasImages;
    zone.classList.toggle("has-images", hasImages);
    setNoteMessage("");
    updateNoteControls();
  }

  function updateNoteControls() {
    document.getElementById("note-clear-btn").hidden = !hasQuestionNotes(currentStatus());
  }

  function noteImageSrc(img) {
    const src = (img && (img.url || img.dataUrl)) || "";
    if (src.startsWith("/api/note-images/") || src.startsWith("data:image/")) return src;
    return "";
  }

  function showNotePreview(img) {
    showImagePreview(noteImageSrc(img), img.name || img.id || "");
  }

  function showImagePreview(src, caption) {
    if (!src) return;
    const preview = document.getElementById("note-preview");
    const image = document.getElementById("note-preview-image");
    const cap = document.getElementById("note-preview-caption");
    image.src = src;
    image.alt = caption || "";
    cap.textContent = caption || "";
    preview.hidden = false;
    document.body.classList.add("preview-open");
    document.getElementById("note-preview-close").focus();
  }

  function imageAssetUrl(path) {
    if (!path) return "";
    if (/^(https?:|data:|\/\/|\/api\/)/.test(path)) return path;
    return "/api/asset/" + path.split("/").map(encodeURIComponent).join("/");
  }

  function closeNotePreview() {
    const preview = document.getElementById("note-preview");
    if (preview.hidden) return;
    preview.hidden = true;
    document.body.classList.remove("preview-open");
    document.getElementById("note-preview-image").removeAttribute("src");
  }

  function syncNoteTextFromTextarea() {
    const s = currentStatus();
    const hadNotes = hasQuestionNotes(s);
    s.notes.text = document.getElementById("note-text").value;
    persistSoon();
    updateNoteControls();
    if (hadNotes !== hasQuestionNotes(s)) renderSidebar();
  }

  async function addNoteImages(files) {
    const imageFiles = Array.from(files).filter(f => f && (f.type || "").startsWith("image/"));
    if (!imageFiles.length) return;

    const key = currentKey();
    const s = statusForKey(key);
    const hadNotes = hasQuestionNotes(s);
    setNoteMessage("Saving image...");
    try {
      for (const file of imageFiles) {
        const uploaded = await uploadNoteImage(file, key);
        notesForKey(key).images.push(uploaded);
      }
      persistSoon();
      if (key === currentKey()) renderNotes();
      else setNoteMessage("");
      if (hadNotes !== hasQuestionNotes(statusForKey(key))) renderSidebar();
    } catch (err) {
      console.error("image upload failed", err);
      if (key === currentKey()) setNoteMessage("Image save failed.", true);
    }
  }

  async function uploadNoteImage(file, key) {
    const res = await fetch(`/api/note-images?question=${encodeURIComponent(key)}`, {
      method: "POST",
      headers: { "Content-Type": file.type || "image/png" },
      body: file,
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function removeNoteImage(idx) {
    const notes = currentNotes();
    const removed = notes.images.splice(idx, 1)[0];
    persistSoon();
    renderNotes();
    renderSidebar();
    deleteNoteImageFile(removed);
  }

  function clearCurrentNotes() {
    const notes = currentNotes();
    const images = notes.images.slice();
    notes.text = "";
    notes.images = [];
    document.getElementById("note-text").value = "";
    persistSoon();
    renderNotes();
    renderSidebar();
    images.forEach(deleteNoteImageFile);
  }

  function deleteNoteImageFile(img) {
    const src = noteImageSrc(img);
    if (!src.startsWith("/api/note-images/")) return;
    fetch(src, { method: "DELETE" }).catch(err => console.warn("image delete failed", err));
  }

  function setNoteMessage(text, error) {
    const msg = document.getElementById("note-message");
    msg.textContent = text || "";
    msg.hidden = !text;
    msg.classList.toggle("error", !!error);
  }

  function clipboardImageFiles(data) {
    if (!data) return [];
    const out = [];
    if (data.items) {
      Array.from(data.items).forEach(item => {
        if (item.kind === "file" && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) out.push(file);
        }
      });
    }
    if (!out.length && data.files) {
      Array.from(data.files).forEach(file => {
        if ((file.type || "").startsWith("image/")) out.push(file);
      });
    }
    return out;
  }

  function insertTextAtCursor(el, text) {
    const start = el.selectionStart ?? el.value.length;
    const end = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    const pos = start + text.length;
    el.selectionStart = pos;
    el.selectionEnd = pos;
  }

  function handleNotePaste(e) {
    const files = clipboardImageFiles(e.clipboardData);
    if (!files.length) return;

    e.preventDefault();
    const text = e.clipboardData.getData("text/plain");
    if (text && e.target.id === "note-text") {
      insertTextAtCursor(e.target, text);
      syncNoteTextFromTextarea();
    }
    addNoteImages(files);
  }

  function handleNoteDrop(e) {
    const files = Array.from(e.dataTransfer.files || []).filter(file => (file.type || "").startsWith("image/"));
    if (!files.length) return;
    e.preventDefault();
    addNoteImages(files);
  }

  function setStatus(status) {
    const s = currentStatus();
    if (status === "clear") s.status = "unanswered";
    else s.status = (s.status === status) ? "unanswered" : status;
    persistSoon();
    renderStatusButtons();
    renderSidebar();
  }

  function toggleMark() {
    const s = currentStatus();
    s.marked = !s.marked;
    document.getElementById("mark-checkbox").checked = s.marked;
    persistSoon();
    renderSidebar();
  }

  function gotoQuestion(i) {
    if (i < 0 || i >= state.questions.length) return;
    state.currentIdx = i;
    renderMain();
  }

  function stepVisible(delta) {
    const vis = visibleIndices();
    if (vis.length === 0) return;
    if (!vis.includes(state.currentIdx)) {
      gotoQuestion(vis[0]);
      return;
    }
    const pos = vis.indexOf(state.currentIdx);
    const next = pos + delta;
    if (next < 0 || next >= vis.length) return;
    gotoQuestion(vis[next]);
  }

  function persistSoon() {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(persist, 200);
  }

  async function persist() {
    state.saveTimer = null;
    try {
      await fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(statusPayload()),
      });
    } catch (e) {
      console.error("persist failed", e);
    }
  }

  function statusPayload() {
    return {
      version: 1,
      source: state.source,
      sourceHash: state.sourceHash,
      questions: state.statuses,
    };
  }

  function persistBeforeUnload() {
    if (!state.saveTimer) return;
    clearTimeout(state.saveTimer);
    state.saveTimer = null;
    const body = JSON.stringify(statusPayload());
    if (navigator.sendBeacon) {
      navigator.sendBeacon("/api/status", new Blob([body], { type: "application/json" }));
    } else {
      persist();
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }

  function bindUI() {
    document.getElementById("prev-btn").addEventListener("click", () => stepVisible(-1));
    document.getElementById("next-btn").addEventListener("click", () => stepVisible(1));
    document.getElementById("submit-btn").addEventListener("click", submitAnswer);
    document.getElementById("reset-btn").addEventListener("click", resetAnswer);
    document.getElementById("prev-btn-inline").addEventListener("click", () => stepVisible(-1));
    document.getElementById("next-btn-inline").addEventListener("click", () => stepVisible(1));
    document.getElementById("fs-btn").addEventListener("click", toggleFullscreen);
    document.getElementById("mark-checkbox").addEventListener("change", toggleMark);
    document.getElementById("note-text").addEventListener("input", syncNoteTextFromTextarea);
    document.getElementById("note-clear-btn").addEventListener("click", clearCurrentNotes);
    document.getElementById("notes-panel").addEventListener("paste", handleNotePaste);
    document.getElementById("note-image-zone").addEventListener("dragover", (e) => e.preventDefault());
    document.getElementById("note-image-zone").addEventListener("drop", handleNoteDrop);
    document.getElementById("note-preview-close").addEventListener("click", closeNotePreview);
    document.getElementById("note-preview").addEventListener("click", (e) => {
      if (e.target.id === "note-preview") closeNotePreview();
    });
    window.addEventListener("beforeunload", persistBeforeUnload);
    document.querySelectorAll("#status-buttons button").forEach(b => {
      b.addEventListener("click", () => setStatus(b.dataset.status));
    });
    document.querySelectorAll("#sb-filter .flt-btn").forEach(b => {
      b.addEventListener("click", () => toggleFilter(b.dataset.flt));
    });

    document.addEventListener("keydown", (e) => {
      if (!document.getElementById("note-preview").hidden) {
        if (e.key === "Escape") {
          closeNotePreview();
          e.preventDefault();
        }
        return;
      }
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.target.closest && e.target.closest(".notes-panel")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      const q = currentQ();
      if (!q) return;

      if (e.key >= "1" && e.key <= "9") {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= q.options.length) {
          toggleOption(q.options[n - 1].letter);
          e.preventDefault();
        }
      } else if (e.key === "Enter" || e.key.toLowerCase() === "c") {
        submitAnswer(); e.preventDefault();
      } else if (e.key.toLowerCase() === "t") {
        if (state.submitted) { resetAnswer(); e.preventDefault(); }
      } else if (e.key === "ArrowRight") {
        stepVisible(1); e.preventDefault();
      } else if (e.key === "ArrowLeft") {
        stepVisible(-1); e.preventDefault();
      } else if (e.key.toLowerCase() === "m") {
        toggleMark(); e.preventDefault();
      } else if (e.key.toLowerCase() === "l") {
        setStatus("learning"); e.preventDefault();
      } else if (e.key.toLowerCase() === "r") {
        setStatus("reviewing"); e.preventDefault();
      } else if (e.key.toLowerCase() === "g") {
        setStatus("mastered"); e.preventDefault();
      } else if (e.key.toLowerCase() === "x") {
        setStatus("clear"); e.preventDefault();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen(); e.preventDefault();
      }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
  <script>
  // Registering the worker is what makes the home-screen app work offline.
  // file:// and plain http have no secure context, so skip it there.
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost")) {
    // A redeploy ships a new worker; it claims the page as soon as it
    // activates. Reload once then, so the next launch is never a stale build.
    // Guarded on there having been a controller already, or the very first
    // registration would reload too.
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("service worker registration failed", err);
      });
    });
  }
  </script>
