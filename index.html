etter":"C","text":"好中球の過分葉"},{"letter":"D","text":"赤血球連銭形成"},{"letter":"E","text":"環状鉄芽球"}],"answer":["A"],"multi":false,"explanation":"解説：細動脈に血小板血栓が張り出し，そこを通る赤血球が機械的に断裂して破砕赤血球（schistocyte）となる．血管内溶血によりLDHと間接ビリルビンが上がり，ハプトグロビンは低下する．\n- A：微小血管障害性溶血を直接示し正しい．\n- B：標的赤血球はサラセミアや閉塞性黄疸．\n- C：好中球の過分葉は巨赤芽球性貧血．\n- D：赤血球連銭形成はM蛋白血症．\n- E：環状鉄芽球は骨髄異形成症候群．","images":[],"stem_images":[]},{"number":31,"section":"D-1-S08　41歳女性・発熱と意識の変容","question":"（3/4）41歳の女性．発熱と言動のまとまらなさを主訴に家族に連れられて来院した．3日前から微熱と倦怠感があり，本日は受け答えが噛み合わないという．四肢に点状出血を認める．症状は日内で良くなったり悪くなったりするという．血小板1.1万/μL，Hb 8.2g/dL，LDH高値，破砕赤血球を認める．血清クレアチニンは1.9mg/dLで，PTとAPTTは正常であった．欠乏しているのはどれか．","options":[{"letter":"A","text":"第VIII因子"},{"letter":"B","text":"内因子"},{"letter":"C","text":"ビタミンK"},{"letter":"D","text":"エリスロポエチン"},{"letter":"E","text":"ADAMTS13"}],"answer":["E"],"multi":false,"explanation":"解説：ADAMTS13はvon Willebrand因子の超巨大多量体を切断する酵素で，これが失われると多量体が血管内皮に残り，血小板を次々に凝集させて微小血栓を作る．PT・APTTが正常なのが播種性血管内凝固との決定的な差である．\n- A：第VIII因子欠乏は血友病AでAPTTが延長する．\n- B：内因子欠如はビタミンB12欠乏で大球性貧血．\n- C：ビタミンK欠乏ではPTが延長するが，本例は正常．\n- D：エリスロポエチン欠乏は腎性貧血で，溶血も血小板減少も起こさない．\n- E：微小血栓形成の直接の原因で正しい．","images":[],"stem_images":[]},{"number":32,"section":"D-1-S08　41歳女性・発熱と意識の変容","question":"（4/4）41歳の女性．発熱と言動のまとまらなさを主訴に家族に連れられて来院した．3日前から微熱と倦怠感があり，本日は受け答えが噛み合わないという．四肢に点状出血を認める．症状は日内で良くなったり悪くなったりするという．血小板1.1万/μL，Hb 8.2g/dL，LDH高値，破砕赤血球を認める．血清クレアチニンは1.9mg/dLで，PTとAPTTは正常であった．ADAMTS13活性は著減していた．最も適切な治療はどれか．","options":[{"letter":"A","text":"鉄剤の経口投与"},{"letter":"B","text":"予防的な血小板輸血"},{"letter":"C","text":"血漿交換"},{"letter":"D","text":"抗菌薬の投与"},{"letter":"E","text":"凝固因子製剤の補充"}],"answer":["C"],"multi":false,"explanation":"解説：血漿交換で欠損した酵素を補い，同時に自己抗体と超巨大多量体を除去する．開始の遅れが予後を大きく左右するため，疑った時点で速やかに行う．副腎皮質ステロイドやリツキシマブを併用する．\n- A：鉄剤は鉄欠乏性貧血の治療で，溶血性の貧血には無効．\n- B：血小板輸血は血栓形成の材料を追加して症状を悪化させるため原則禁忌．\n- C：欠損酵素の補充と抗体除去を同時に行え，第一選択で正しい．\n- D：抗菌薬は感染症の治療で，本例の機序には作用しない．\n- E：凝固因子製剤は凝固因子欠乏症に用いるもので，PT・APTTが正常な本例には適応がない．","images":[],"stem_images":[]},{"number":33,"section":"D-1-S09　19歳男性・発熱と全身の紫斑","question":"（1/4）19歳の男性．発熱と全身の紫斑を主訴に来院した．3週間前から倦怠感があり，1週間前から38℃台の発熱と鼻出血が続いているという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"のどや口の中が痛みますか．"},{"letter":"B","text":"便や尿にも血が混じりますか．"},{"letter":"C","text":"動くと息切れがしますか．"},{"letter":"D","text":"最近，新しい薬を飲みましたか．"},{"letter":"E","text":"以前から乗り物酔いをしますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．乗り物酔いの既往は血球異常の評価では優先度が低い．\n- A：感染巣や粘膜障害を確認．\n- B：出血の重症度を確認．\n- C：貧血症状を確認．\n- D：薬剤性の血球減少を検討．\n- E：乗り物酔いの既往は血球異常の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":34,"section":"D-1-S09　19歳男性・発熱と全身の紫斑","question":"（2/4）19歳の男性．発熱と全身の紫斑を主訴に来院した．3週間前から倦怠感があり，1週間前から38℃台の発熱と鼻出血が続いているという．階段で息切れと動悸を自覚するようになったという．認められる所見はどれか．","options":[{"letter":"A","text":"腹部の拍動性腫瘤"},{"letter":"B","text":"甲状腺のびまん性腫大"},{"letter":"C","text":"歯肉の腫脹と肝脾腫"},{"letter":"D","text":"頬部の蝶形紅斑"},{"letter":"E","text":"眼瞼下垂の日内変動"}],"answer":["C"],"multi":false,"explanation":"解説：白血病細胞は骨髄から末梢血へ出て，歯肉・皮膚・肝脾・中枢神経に浸潤する．単球系の白血病では歯肉腫脹が目立ち，肝脾腫とリンパ節腫大を伴うことが多い．胸骨の圧痛も特徴的である．\n- A：拍動性腫瘤は腹部大動脈瘤．\n- B：甲状腺腫大はBasedow病や橋本病．\n- C：白血病細胞の臓器浸潤を反映し正しい．\n- D：蝶形紅斑は全身性エリテマトーデス．\n- E：眼瞼下垂の日内変動は重症筋無力症．","images":[],"stem_images":[]},{"number":35,"section":"D-1-S09　19歳男性・発熱と全身の紫斑","question":"（3/4）19歳の男性．発熱と全身の紫斑を主訴に来院した．3週間前から倦怠感があり，1週間前から38℃台の発熱と鼻出血が続いているという．階段で息切れと動悸を自覚するようになったという．歯肉の腫脹と肝脾腫を認める．白血球2.4万/μL，Hb 6.8g/dL，血小板1.4万/μLで，末梢血に大型で核小体の目立つ幼若細胞を多数認める．診断に必須の検査はどれか．","options":[{"letter":"A","text":"頭部造影MRI"},{"letter":"B","text":"骨髄穿刺"},{"letter":"C","text":"呼吸機能検査"},{"letter":"D","text":"上部消化管内視鏡"},{"letter":"E","text":"下肢静脈超音波検査"}],"answer":["B"],"multi":false,"explanation":"解説：骨髄中の芽球の割合で診断し，形態・細胞化学染色・表面抗原・染色体・遺伝子検査で病型を決める．病型によって治療も予後も大きく変わるため，治療開始前の骨髄検体の確保が不可欠である．\n- A：頭部MRIは中枢神経浸潤を疑うときの追加検査．\n- B：診断と病型決定の根拠になり必須で正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：内視鏡は消化管の出血源検索．\n- E：下肢静脈超音波は深部静脈血栓症の検索．","images":[],"stem_images":[]},{"number":36,"section":"D-1-S09　19歳男性・発熱と全身の紫斑","question":"（4/4）19歳の男性．発熱と全身の紫斑を主訴に来院した．3週間前から倦怠感があり，1週間前から38℃台の発熱と鼻出血が続いているという．階段で息切れと動悸を自覚するようになったという．歯肉の腫脹と肝脾腫を認める．白血球2.4万/μL，Hb 6.8g/dL，血小板1.4万/μLで，末梢血に大型で核小体の目立つ幼若細胞を多数認める．骨髄は過形成で芽球が80%を占めていた．汎血球減少をきたす別の疾患と本例を分ける骨髄所見はどれか．","options":[{"letter":"A","text":"巨核球の増加"},{"letter":"B","text":"環状鉄芽球の出現"},{"letter":"C","text":"線維化によるdry tap"},{"letter":"D","text":"芽球による過形成"},{"letter":"E","text":"脂肪髄への置換"}],"answer":["D"],"multi":false,"explanation":"解説：再生不良性貧血では骨髄が低形成となり脂肪に置き換わるが，急性白血病では骨髄は過形成で芽球が正常造血を圧迫する．末梢血は同じ汎血球減少でも，骨髄の細胞密度が正反対になる．\n- A：巨核球の増加は免疫性血小板減少症で末梢破壊を示す所見．\n- B：環状鉄芽球は骨髄異形成症候群．\n- C：線維化とdry tapは原発性骨髄線維症．\n- D：本例の骨髄像そのもので，低形成との対比が鑑別の核心であり正しい．\n- E：脂肪髄への置換は再生不良性貧血の側．","images":[],"stem_images":[]},{"number":37,"section":"D-1-S10　45歳男性・健診で白血球増多","question":"（1/4）45歳の男性．健康診断で白血球6.8万/μLと指摘され来院した．自覚症状はないが，最近やや腹部が張る感じがあるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"排便で肛門が痛みますか．"},{"letter":"B","text":"ステロイドを飲んでいますか．"},{"letter":"C","text":"以前の白血球数も高いですか．"},{"letter":"D","text":"寝汗や体重減少はありますか．"},{"letter":"E","text":"発熱や咽頭痛はありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．裂肛を疑う局所症状は著明な白血球増多の原因検索では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：裂肛を疑う局所症状は著明な白血球増多の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：薬剤性白血球増多を検討．\n- C：異常の持続期間を確認．\n- D：血液腫瘍を疑う全身症状を確認．\n- E：反応性白血球増多を検討．","images":[],"stem_images":[]},{"number":38,"section":"D-1-S10　45歳男性・健診で白血球増多","question":"（2/4）45歳の男性．健康診断で白血球6.8万/μLと指摘され来院した．自覚症状はないが，最近やや腹部が張る感じがあるという．発熱や咽頭痛などの感染徴候はないという．認められる所見はどれか．","options":[{"letter":"A","text":"頸部リンパ節のびまん性腫大"},{"letter":"B","text":"腹部の拍動性腫瘤"},{"letter":"C","text":"甲状腺のびまん性腫大"},{"letter":"D","text":"眼瞼下垂の日内変動"},{"letter":"E","text":"左季肋部に及ぶ脾腫"}],"answer":["E"],"multi":false,"explanation":"解説：骨髄外造血と腫瘍細胞の浸潤により脾臓が著明に腫大し，左季肋下に硬い辺縁として触れる．腹部膨満感や早期満腹感の原因になり，白血球増多と並ぶこの疾患の二本柱の所見である．\n- A：びまん性リンパ節腫大は悪性リンパ腫や伝染性単核球症で目立つ．\n- B：拍動性腫瘤は腹部大動脈瘤．\n- C：甲状腺腫大はBasedow病や橋本病．\n- D：眼瞼下垂の日内変動は重症筋無力症．\n- E：腹部膨満の原因を説明し正しい．","images":[],"stem_images":[]},{"number":39,"section":"D-1-S10　45歳男性・健診で白血球増多","question":"（3/4）45歳の男性．健康診断で白血球6.8万/μLと指摘され来院した．自覚症状はないが，最近やや腹部が張る感じがあるという．発熱や咽頭痛などの感染徴候はないという．左季肋下に4横指の脾腫を触知する．末梢血では骨髄球から分葉核球までの各成熟段階の顆粒球が連続して出現し，好塩基球が増加している．芽球は2%であった．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"血清フェリチンと鉄の測定"},{"letter":"B","text":"直接Coombs試験"},{"letter":"C","text":"出血時間の測定"},{"letter":"D","text":"BCR-ABL1の検出"},{"letter":"E","text":"血清ビタミンB12の測定"}],"answer":["D"],"multi":false,"explanation":"解説：第9番と第22番染色体の相互転座 t(9;22) で生じるPhiladelphia染色体と，そのBCR-ABL1融合遺伝子が診断の根拠になる．この産物である恒常活性型チロシンキナーゼが，分子標的薬の標的そのものである．\n- A：フェリチンは鉄代謝の指標．\n- B：Coombs試験は自己免疫性溶血性貧血の検査．\n- C：出血時間は一次止血の評価．\n- D：診断と治療選択の両方を規定し正しい．\n- E：ビタミンB12は結合蛋白が増えて高値になるが，診断の決め手にはならない．","images":[],"stem_images":[]},{"number":40,"section":"D-1-S10　45歳男性・健診で白血球増多","question":"（4/4）45歳の男性．健康診断で白血球6.8万/μLと指摘され来院した．自覚症状はないが，最近やや腹部が張る感じがあるという．発熱や咽頭痛などの感染徴候はないという．左季肋下に4横指の脾腫を触知する．末梢血では骨髄球から分葉核球までの各成熟段階の顆粒球が連続して出現し，好塩基球が増加している．芽球は2%であった．BCR-ABL1融合遺伝子が検出された．治療薬の作用点はどれか．","options":[{"letter":"A","text":"チロシンキナーゼ"},{"letter":"B","text":"葉酸代謝酵素"},{"letter":"C","text":"微小管の重合"},{"letter":"D","text":"プロテアソーム"},{"letter":"E","text":"トポイソメラーゼ"}],"answer":["A"],"multi":false,"explanation":"解説：イマチニブなどのチロシンキナーゼ阻害薬がBCR-ABL1の活性部位に結合し，異常な増殖シグナルを止める．分子標的治療の成功例で，慢性期に開始できれば長期生存が期待できる．\n- A：BCR-ABL1の酵素活性そのものを止め正しい．\n- B：葉酸代謝酵素はメトトレキサートの標的．\n- C：微小管はビンクリスチンやタキサン系の標的．\n- D：プロテアソームはボルテゾミブの標的で，多発性骨髄腫に用いる．\n- E：トポイソメラーゼはエトポシドやアントラサイクリン系の標的．","images":[],"stem_images":[]},{"number":41,"section":"D-1-S11　76歳男性・持続する貧血と反復する感染","question":"（1/4）76歳の男性．1年前から徐々に進行する貧血で通院している．鉄剤とビタミンB12の補充では改善せず，この半年で肺炎を2回起こしたという．治療に関連する造血障害の背景を調べる質問はどれか．","options":[{"letter":"A","text":"黒色の便は出ていますか．"},{"letter":"B","text":"肉や魚を食べていますか．"},{"letter":"C","text":"家族にも貧血がありますか．"},{"letter":"D","text":"腎臓の病気はありますか．"},{"letter":"E","text":"抗癌薬の治療歴はありますか．"}],"answer":["E"],"multi":false,"explanation":"解説：栄養素の補充に反応しない血球減少では，造血そのものの質的異常を疑う．アルキル化薬や放射線への曝露は骨髄の前駆細胞に遺伝子異常を起こし，年余を経て二次性の造血障害を招く．\n- A：消化管出血に関する情報．\n- B：栄養摂取に関する情報．\n- C：遺伝的背景に関する情報．\n- D：腎性貧血に関する情報．\n- E：造血障害の原因に直結し有用．","images":[],"stem_images":[]},{"number":42,"section":"D-1-S11　76歳男性・持続する貧血と反復する感染","question":"（2/4）76歳の男性．1年前から徐々に進行する貧血で通院している．鉄剤とビタミンB12の補充では改善せず，この半年で肺炎を2回起こしたという．10年前に悪性腫瘍に対する化学療法を受けたという．予想される血液検査所見はどれか．","options":[{"letter":"A","text":"白血球の著明な増加"},{"letter":"B","text":"血球減少と血球の異形成"},{"letter":"C","text":"好酸球の著明な増加"},{"letter":"D","text":"血小板の著明な増加"},{"letter":"E","text":"単クローン性の免疫グロブリン"}],"answer":["B"],"multi":false,"explanation":"解説：前駆細胞のクローン性異常により，成熟しても形態や機能が保てない血球が作られる．末梢血では偽Pelger-Huët核異常の好中球や大小不同の赤血球がみられ，2系統以上の減少を伴うことが多い．\n- A：白血球増多は慢性骨髄性白血病や感染症．\n- B：無効造血と異形成を反映し正しい．\n- C：好酸球増加はアレルギー疾患や寄生虫症．\n- D：血小板増加は本態性血小板血症や反応性変化．\n- E：単クローン性免疫グロブリンは多発性骨髄腫やMGUS．","images":[],"stem_images":[]},{"number":43,"section":"D-1-S11　76歳男性・持続する貧血と反復する感染","question":"（3/4）76歳の男性．1年前から徐々に進行する貧血で通院している．鉄剤とビタミンB12の補充では改善せず，この半年で肺炎を2回起こしたという．10年前に悪性腫瘍に対する化学療法を受けたという．Hb 7.8g/dL，白血球2100/μL（好中球680/μL），血小板6.2万/μLで，末梢血に偽Pelger-Huët核異常を認める．骨髄で予想される所見はどれか．","options":[{"letter":"A","text":"正〜過形成で環状鉄芽球を認める"},{"letter":"B","text":"脂肪髄への置換を認める"},{"letter":"C","text":"線維化によりdry tapとなる"},{"letter":"D","text":"芽球が80%を占める"},{"letter":"E","text":"形質細胞が30%を占める"}],"answer":["A"],"multi":false,"explanation":"解説：末梢血は減っているのに骨髄の細胞密度はむしろ保たれる，という食い違いが無効造血を示す．鉄がミトコンドリアに沈着した環状鉄芽球など，各系統の異形成所見が診断の柱になる．\n- A：無効造血と異形成を同時に示し正しい．\n- B：脂肪髄化は再生不良性貧血で，異形成を伴わない．\n- C：線維化によるdry tapは原発性骨髄線維症．\n- D：芽球80%は急性白血病．\n- E：形質細胞の増加は多発性骨髄腫．","images":[],"stem_images":[]},{"number":44,"section":"D-1-S11　76歳男性・持続する貧血と反復する感染","question":"（4/4）76歳の男性．1年前から徐々に進行する貧血で通院している．鉄剤とビタミンB12の補充では改善せず，この半年で肺炎を2回起こしたという．10年前に悪性腫瘍に対する化学療法を受けたという．Hb 7.8g/dL，白血球2100/μL（好中球680/μL），血小板6.2万/μLで，末梢血に偽Pelger-Huët核異常を認める．骨髄は正形成で環状鉄芽球と各系統の異形成を認め，芽球は6%であった．長期的に最も警戒すべき経過はどれか．","options":[{"letter":"A","text":"骨髄の線維化による肝腫大"},{"letter":"B","text":"溶血発作の反復"},{"letter":"C","text":"全身のリンパ節腫大"},{"letter":"D","text":"急性骨髄性白血病への移行"},{"letter":"E","text":"深部静脈血栓症の反復"}],"answer":["D"],"multi":false,"explanation":"解説：クローン性の造血障害は前白血病状態でもあり，芽球割合や染色体異常が悪いほど高率に急性骨髄性白血病へ移行する．芽球割合・血球減少の程度・核型でリスクを層別化し，治療強度を決める．\n- A：骨髄線維化と髄外造血は原発性骨髄線維症の経過．\n- B：溶血発作の反復は発作性夜間ヘモグロビン尿症や自己免疫性溶血性貧血．\n- C：全身のリンパ節腫大は悪性リンパ腫．\n- D：この疾患の本質的な転帰であり正しい．\n- E：血栓症の反復は抗リン脂質抗体症候群や骨髄増殖性腫瘍．","images":[],"stem_images":[]},{"number":45,"section":"D-1-S12　62歳男性・頸部の腫脹","question":"（1/4）62歳の男性．3か月前から左頸部の腫れに気づき来院した．痛みはなく，徐々に大きくなっているという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"たばこを吸っていますか．"},{"letter":"B","text":"食後に眠くなりやすいですか．"},{"letter":"C","text":"寝汗や体重減少はありますか．"},{"letter":"D","text":"ほかの場所も腫れていますか．"},{"letter":"E","text":"のどの痛みはありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．通常の食後の眠気は腫脹の鑑別では優先度が低い．\n- A：頭頸部癌の危険因子を確認．\n- B：通常の食後の眠気は腫脹の鑑別では優先度が低い．この設問で選ぶ肢．\n- C：リンパ増殖性疾患の全身症状を確認．\n- D：局所性か全身性かを判断．\n- E：感染に伴うリンパ節腫脹を検討．","images":[],"stem_images":[]},{"number":46,"section":"D-1-S12　62歳男性・頸部の腫脹","question":"（2/4）62歳の男性．3か月前から左頸部の腫れに気づき来院した．痛みはなく，徐々に大きくなっているという．夜間に寝衣が濡れるほど汗をかき，半年で6kg減ったという．認められる所見はどれか．","options":[{"letter":"A","text":"圧痛の強い軟らかいリンパ節"},{"letter":"B","text":"皮膚に発赤と熱感を伴うリンパ節"},{"letter":"C","text":"波動を触れるリンパ節"},{"letter":"D","text":"弾性硬で可動性のあるリンパ節"},{"letter":"E","text":"拍動を触れるリンパ節"}],"answer":["D"],"multi":false,"explanation":"解説：リンパ腫のリンパ節は弾性硬でゴムのような手触りをもち，初期には可動性が保たれる．圧痛を欠き，癌の転移でみられるような周囲との強固な癒着や石様硬とは異なる．\n- A：圧痛と軟らかさは反応性リンパ節炎や化膿性リンパ節炎．\n- B：発赤と熱感は細菌感染によるリンパ節炎．\n- C：波動は膿瘍形成を示す．\n- D：リンパ腫の典型的な性状で正しい．\n- E：拍動を触れるのは血管性病変や頸動脈小体腫瘍．","images":[],"stem_images":[]},{"number":47,"section":"D-1-S12　62歳男性・頸部の腫脹","question":"（3/4）62歳の男性．3か月前から左頸部の腫れに気づき来院した．痛みはなく，徐々に大きくなっているという．夜間に寝衣が濡れるほど汗をかき，半年で6kg減ったという．左頸部に3cm大の弾性硬で可動性のあるリンパ節を複数触知する．体温37.4℃．血清LDHが高値である．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"穿刺吸引細胞診"},{"letter":"B","text":"血清腫瘍マーカーの測定"},{"letter":"C","text":"頸部超音波検査"},{"letter":"D","text":"骨シンチグラフィ"},{"letter":"E","text":"リンパ節生検"}],"answer":["E"],"multi":false,"explanation":"解説：病型の決定にはリンパ節の構造が保たれた検体が要る．濾胞構造の残り方や細胞配列を見て免疫染色と遺伝子検査を加えて初めて病型が決まり，治療法が変わるため生検が必須である．\n- A：穿刺吸引細胞診では細胞は採れても組織構築が失われ，病型を決められない．\n- B：腫瘍マーカーは補助的で，確定診断にはならない．\n- C：超音波はリンパ節の形状評価には有用だが，組織診断の代わりにならない．\n- D：骨シンチグラフィは骨転移の検索．\n- E：病型決定に不可欠で正しい．","images":[],"stem_images":[]},{"number":48,"section":"D-1-S12　62歳男性・頸部の腫脹","question":"（4/4）62歳の男性．3か月前から左頸部の腫れに気づき来院した．痛みはなく，徐々に大きくなっているという．夜間に寝衣が濡れるほど汗をかき，半年で6kg減ったという．左頸部に3cm大の弾性硬で可動性のあるリンパ節を複数触知する．体温37.4℃．血清LDHが高値である．リンパ節生検でびまん性大細胞型B細胞リンパ腫と診断された．病期の決定に用いるのはどれか．","options":[{"letter":"A","text":"Fontaine分類"},{"letter":"B","text":"Killip分類"},{"letter":"C","text":"Ann Arbor分類"},{"letter":"D","text":"NYHA分類"},{"letter":"E","text":"Hugh-Jones分類"}],"answer":["C"],"multi":false,"explanation":"解説：横隔膜を境に病変が片側か両側か，節外臓器や骨髄への浸潤があるかでI〜IV期に分け，B症状の有無をAまたはBで付記する．病期が治療強度と予後予測を規定するため，PET-CTと骨髄検査で全身を評価する．\n- A：Fontaine分類は閉塞性動脈硬化症の重症度分類．\n- B：Killip分類は急性心筋梗塞の心不全重症度分類．\n- C：悪性リンパ腫の病期分類で正しい．\n- D：NYHA分類は心不全の自覚症状による重症度分類．\n- E：Hugh-Jones分類は呼吸困難の重症度分類．","images":[],"stem_images":[]},{"number":49,"section":"D-1-S13　70歳女性・腰背部痛と易疲労感","question":"（1/4）70歳の女性．3か月前からの腰背部痛と易疲労感を主訴に来院した．鎮痛薬を飲んでも痛みが続き，最近は寝返りでも痛むという．明らかな外傷歴はない．血液検査でHb 8.4g/dLであった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"尿が泡立つようになりましたか．"},{"letter":"B","text":"転倒や軽いけがはありましたか．"},{"letter":"C","text":"冷たい水で歯がしみますか．"},{"letter":"D","text":"尿が出にくくなりましたか．"},{"letter":"E","text":"最近，体重が減りましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．知覚過敏は腰背部痛と貧血の初期鑑別では優先度が低い．\n- A：蛋白尿を伴う腎障害を検討．\n- B：脆弱性骨折を含めて評価．\n- C：知覚過敏は腰背部痛と貧血の初期鑑別では優先度が低い．この設問で選ぶ肢．\n- D：脊髄・馬尾障害の警告症状を確認．\n- E：悪性疾患を疑う全身症状を確認．","images":[],"stem_images":[]},{"number":50,"section":"D-1-S13　70歳女性・腰背部痛と易疲労感","question":"（2/4）70歳の女性．3か月前からの腰背部痛と易疲労感を主訴に来院した．鎮痛薬を飲んでも痛みが続き，最近は寝返りでも痛むという．明らかな外傷歴はない．血液検査でHb 8.4g/dLであった．半年前から尿が泡立つようになったという．末梢血塗抹標本で予想される所見はどれか．","options":[{"letter":"A","text":"破砕赤血球"},{"letter":"B","text":"好中球の過分葉"},{"letter":"C","text":"標的赤血球"},{"letter":"D","text":"涙滴赤血球"},{"letter":"E","text":"赤血球連銭形成"}],"answer":["E"],"multi":false,"explanation":"解説：血漿中に大量の単クローン性免疫グロブリンが存在すると赤血球表面の負電荷が中和され，赤血球が硬貨を重ねたように連なる．赤沈の著明な亢進も同じ機序による．\n- A：破砕赤血球は血栓性微小血管症．\n- B：好中球の過分葉は巨赤芽球性貧血．\n- C：標的赤血球はサラセミアや閉塞性黄疸．\n- D：涙滴赤血球は骨髄線維症．\n- E：M蛋白の存在を示唆し正しい．","images":[],"stem_images":[]},{"number":51,"section":"D-1-S13　70歳女性・腰背部痛と易疲労感","question":"（3/4）70歳の女性．3か月前からの腰背部痛と易疲労感を主訴に来院した．鎮痛薬を飲んでも痛みが続き，最近は寝返りでも痛むという．明らかな外傷歴はない．血液検査でHb 8.4g/dLであった．半年前から尿が泡立つようになったという．末梢血で赤血球の連銭形成を認め，血清総蛋白9.8g/dL，血清カルシウム11.6mg/dL，血清クレアチニン2.1mg/dLであった．次に行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査"},{"letter":"B","text":"血清蛋白分画"},{"letter":"C","text":"下肢静脈超音波検査"},{"letter":"D","text":"神経伝導速度の測定"},{"letter":"E","text":"24時間食道pHモニタリング"}],"answer":["B"],"multi":false,"explanation":"解説：総蛋白が高いのにアルブミンは高くないという乖離があり，蛋白分画でγ分画に鋭いM峰が出るかを確かめる．免疫固定法で単クローン性を証明し，尿中の遊離軽鎖（Bence Jones蛋白）も測る．\n- A：呼吸機能検査は換気障害の評価．\n- B：M蛋白の証明に直結し正しい．\n- C：下肢静脈超音波は深部静脈血栓症の検索．\n- D：神経伝導速度は末梢神経障害の評価．\n- E：食道pHモニタリングは胃食道逆流症の検査．","images":[],"stem_images":[]},{"number":52,"section":"D-1-S13　70歳女性・腰背部痛と易疲労感","question":"（4/4）70歳の女性．3か月前からの腰背部痛と易疲労感を主訴に来院した．鎮痛薬を飲んでも痛みが続き，最近は寝返りでも痛むという．明らかな外傷歴はない．血液検査でHb 8.4g/dLであった．半年前から尿が泡立つようになったという．末梢血で赤血球の連銭形成を認め，血清総蛋白9.8g/dL，血清カルシウム11.6mg/dL，血清クレアチニン2.1mg/dLであった．血清蛋白分画でγ分画にM峰を認めた．頭蓋骨エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"骨膜反応による層状陰影"},{"letter":"B","text":"骨端線の早期閉鎖"},{"letter":"C","text":"境界明瞭な打ち抜き像"},{"letter":"D","text":"びまん性の骨硬化"},{"letter":"E","text":"頭蓋縫合の離開"}],"answer":["C"],"multi":false,"explanation":"解説：腫瘍細胞が破骨細胞を活性化して局所的に骨を溶かすため，辺縁が鋭く硬化を伴わない円形の透亮像（punched-out lesion）が多発する．骨形成が伴わないので骨シンチグラフィでは描出されにくい．\n- A：層状の骨膜反応はEwing肉腫や骨髄炎．\n- B：骨端線の早期閉鎖は内分泌疾患や外傷後．\n- C：溶骨性病変の典型像で正しい．\n- D：びまん性骨硬化は骨硬化症や前立腺癌の骨転移．\n- E：頭蓋縫合の離開は乳児の頭蓋内圧亢進．","images":[],"stem_images":[]},{"number":53,"section":"D-1-S14　18歳男性・発熱と咽頭痛","question":"（1/4）18歳の男性．5日前からの発熱と咽頭痛を主訴に来院した．体温38.6℃．両側の扁桃に白苔を認め，頸部リンパ節が腫脹している．局所症状に加えて全身症の持続を確認する質問はどれか．","options":[{"letter":"A","text":"飲み込むと喉が痛みますか．"},{"letter":"B","text":"片側の耳まで痛みが響きますか．"},{"letter":"C","text":"声がこもって聞こえますか．"},{"letter":"D","text":"口を開けにくいですか．"},{"letter":"E","text":"強い倦怠感が続いていますか．"}],"answer":["E"],"multi":false,"explanation":"解説：滲出性扁桃炎に数週続く強い倦怠感を伴う場合は，伝染性単核球症などの全身感染を考える．倦怠感だけで病原体は確定できず，リンパ節・肝脾腫や血液所見を併せて判断する．\n- A：局所の炎症症状に関する情報．\n- B：局所痛の放散に関する情報．\n- C：咽頭周囲の腫脹に関する情報．\n- D：局所の膿瘍を疑う症状に関する情報．\n- E：全身性のウイルス感染を示唆し有用．","images":[],"stem_images":[]},{"number":54,"section":"D-1-S14　18歳男性・発熱と咽頭痛","question":"（2/4）18歳の男性．5日前からの発熱と咽頭痛を主訴に来院した．体温38.6℃．両側の扁桃に白苔を認め，頸部リンパ節が腫脹している．2週間前から強い倦怠感が続いているという．認められる所見はどれか．","options":[{"letter":"A","text":"頬部の蝶形紅斑"},{"letter":"B","text":"腹部の拍動性腫瘤"},{"letter":"C","text":"肝脾腫"},{"letter":"D","text":"眼瞼下垂の日内変動"},{"letter":"E","text":"甲状腺のびまん性腫大"}],"answer":["C"],"multi":false,"explanation":"解説：EBウイルスに感染したB細胞に反応して細胞傷害性T細胞が増殖し，リンパ組織が全身で腫大する．脾腫は約半数にみられ，腫大した脾臓は軽い外力で破裂しうるため，接触を伴う運動を控えさせる．\n- A：蝶形紅斑は全身性エリテマトーデス．\n- B：拍動性腫瘤は腹部大動脈瘤．\n- C：全身のリンパ網内系の反応を反映し正しい．\n- D：眼瞼下垂の日内変動は重症筋無力症．\n- E：甲状腺腫大はBasedow病や橋本病．","images":[],"stem_images":[]},{"number":55,"section":"D-1-S14　18歳男性・発熱と咽頭痛","question":"（3/4）18歳の男性．5日前からの発熱と咽頭痛を主訴に来院した．体温38.6℃．両側の扁桃に白苔を認め，頸部リンパ節が腫脹している．2週間前から強い倦怠感が続いているという．肝脾腫を認める．血液検査で白血球1.4万/μL，異型リンパ球18%，AST 186IU/L，ALT 224IU/Lであった．診断に有用な検査はどれか．","options":[{"letter":"A","text":"骨髄穿刺"},{"letter":"B","text":"抗EBウイルス抗体"},{"letter":"C","text":"血清フェリチン"},{"letter":"D","text":"腹部血管造影"},{"letter":"E","text":"血清クレアチンキナーゼ"}],"answer":["B"],"multi":false,"explanation":"解説：VCA-IgM陽性かつEBNA抗体陰性なら初感染と判定できる．異型リンパ球の増加と肝逸脱酵素の上昇という組合せは，この疾患で高率にみられる肝障害を反映している．\n- A：骨髄穿刺は血球産生の異常を疑うときの検査で，本例では不要．\n- B：初感染の証明に直結し正しい．\n- C：フェリチンは鉄代謝と炎症の指標．\n- D：血管造影は血管病変や出血源の評価．\n- E：クレアチンキナーゼは筋傷害の指標．","images":[],"stem_images":[]},{"number":56,"section":"D-1-S14　18歳男性・発熱と咽頭痛","question":"（4/4）18歳の男性．5日前からの発熱と咽頭痛を主訴に来院した．体温38.6℃．両側の扁桃に白苔を認め，頸部リンパ節が腫脹している．2週間前から強い倦怠感が続いているという．肝脾腫を認める．血液検査で白血球1.4万/μL，異型リンパ球18%，AST 186IU/L，ALT 224IU/Lであった．抗EBウイルス抗体でVCA-IgMが陽性であった．投与を避けるべき薬剤はどれか．","options":[{"letter":"A","text":"アンピシリン"},{"letter":"B","text":"アセトアミノフェン"},{"letter":"C","text":"生理食塩水"},{"letter":"D","text":"含嗽薬"},{"letter":"E","text":"去痰薬"}],"answer":["A"],"multi":false,"explanation":"解説：この疾患にアミノペニシリン系を投与すると高率に全身性の斑状丘疹性皮疹が出る．溶連菌性咽頭炎と誤ってペニシリン系を処方しないよう，異型リンパ球と肝障害の有無を確かめてから抗菌薬を選ぶ．\n- A：特徴的な薬疹を誘発するため避けるべきで正しい．\n- B：アセトアミノフェンは解熱鎮痛に用いてよい．\n- C：生理食塩水は脱水時の補液として問題ない．\n- D：含嗽薬は咽頭痛の対症療法として用いられる．\n- E：去痰薬も対症療法として支障ない．","images":[],"stem_images":[]}],"seed":null},{"id":"D-2_神経系","name":"D-2_神経系.md","label":"D-2 神経系","count":80,"sourceHash":"79db8c556d38","questions":[{"number":1,"section":"D-2-S01　66歳男性・突然の右片麻痺","question":"（1/4）66歳の男性．仕事中に突然右手足が動かなくなり救急搬送された．発症は40分前で，頭痛と嘔吐を伴う．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"血を固まりにくくする薬を飲んでいますか．"},{"letter":"B","text":"以前から寝言を言いますか．"},{"letter":"C","text":"最後に普段どおりだったのはいつですか．"},{"letter":"D","text":"頭を打ったことはありますか．"},{"letter":"E","text":"血圧の治療を受けていますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性の寝言は突然の片麻痺の緊急評価では優先度が低い．\n- A：出血リスクと治療適応を確認．\n- B：慢性の寝言は突然の片麻痺の緊急評価では優先度が低い．この設問で選ぶ肢．\n- C：発症時刻を確認し治療適応を判断．\n- D：外傷性頭蓋内病変を検討．\n- E：脳血管障害の背景を確認．","images":[],"stem_images":[]},{"number":2,"section":"D-2-S01　66歳男性・突然の右片麻痺","question":"（2/4）66歳の男性．仕事中に突然右手足が動かなくなり救急搬送された．発症は40分前で，頭痛と嘔吐を伴う．10年前から高血圧を指摘されているが通院を中断していたという．認められる所見はどれか．","options":[{"letter":"A","text":"両側の縮瞳と発汗"},{"letter":"B","text":"下肢のみの対麻痺"},{"letter":"C","text":"両眼の上方への偏位"},{"letter":"D","text":"左方向への共同偏視"},{"letter":"E","text":"眼瞼下垂の日内変動"}],"answer":["D"],"multi":false,"explanation":"解説：被殻出血では病巣側を向く共同偏視が起こる．左被殻の出血なら右片麻痺とともに両眼が左を向く．前頭眼野が障害されて対側へ眼球を向ける働きが失われるためで，「病巣をにらむ」と表現される．\n- A：両側縮瞳と発汗は橋出血や有機リン中毒．\n- B：対麻痺は脊髄病変や前大脳動脈領域の両側梗塞．\n- C：上方への偏位は間脳・中脳背側の病変や全身性けいれん時．\n- D：被殻出血に特徴的で正しい．\n- E：眼瞼下垂の日内変動は重症筋無力症．","images":[],"stem_images":[]},{"number":3,"section":"D-2-S01　66歳男性・突然の右片麻痺","question":"（3/4）66歳の男性．仕事中に突然右手足が動かなくなり救急搬送された．発症は40分前で，頭痛と嘔吐を伴う．10年前から高血圧を指摘されているが通院を中断していたという．血圧212/118mmHg．右上下肢は完全麻痺で，両眼は左方へ共同偏視している．まず行うべき検査はどれか．","options":[{"letter":"A","text":"脳波検査"},{"letter":"B","text":"頸動脈超音波検査"},{"letter":"C","text":"頭部単純CT"},{"letter":"D","text":"腰椎穿刺"},{"letter":"E","text":"呼吸機能検査"}],"answer":["C"],"multi":false,"explanation":"解説：単純CTは数分で撮れ，出血を発症直後から高吸収域として明瞭に描出する．出血か梗塞かで治療が正反対になるため，この一次鑑別を最短で終えることが急性期対応の出発点になる．\n- A：脳波はてんかんの評価で，急性期の病型決定にならない．\n- B：頸動脈超音波は動脈硬化の評価で，緊急性がない．\n- C：出血と梗塞を最速で分けられ最優先．\n- D：頭蓋内圧が高い状態での腰椎穿刺は脳ヘルニアを招きうる．\n- E：呼吸機能検査は換気障害の評価．","images":[],"stem_images":[]},{"number":4,"section":"D-2-S01　66歳男性・突然の右片麻痺","question":"（4/4）66歳の男性．仕事中に突然右手足が動かなくなり救急搬送された．発症は40分前で，頭痛と嘔吐を伴う．10年前から高血圧を指摘されているが通院を中断していたという．血圧212/118mmHg．右上下肢は完全麻痺で，両眼は左方へ共同偏視している．頭部単純CTで左被殻に高吸収域を認めた．この部位に好発する理由はどれか．","options":[{"letter":"A","text":"静脈洞の血栓化"},{"letter":"B","text":"動静脈の先天的な異常吻合"},{"letter":"C","text":"穿通枝の細動脈壊死"},{"letter":"D","text":"髄膜の炎症性肥厚"},{"letter":"E","text":"頸動脈の粥状硬化"}],"answer":["C"],"multi":false,"explanation":"解説：被殻を養うレンズ核線条体動脈は中大脳動脈から直角に分岐する穿通枝で，高い血圧が直接かかる．慢性的な負荷で細動脈壊死と微小動脈瘤が生じ，これが破綻して出血する．\n- A：静脈洞血栓症は頭蓋内圧亢進とけいれんをきたすが，被殻に限局しない．\n- B：動静脈の先天的な異常吻合は脳動静脈奇形で，若年者の出血原因．\n- C：高血圧性脳出血の機序そのもので正しい．\n- D：髄膜の炎症性肥厚は髄膜炎や肥厚性硬膜炎．\n- E：頸動脈の粥状硬化は塞栓源となり脳梗塞を起こす．","images":[],"stem_images":[]},{"number":5,"section":"D-2-S02　52歳女性・突然の激しい頭痛","question":"（1/4）52歳の女性．突然の激しい頭痛を主訴に救急搬送された．発症は1時間前で，嘔吐を伴う．意識は清明である．雷鳴頭痛かどうかを判断するための質問はどれか．","options":[{"letter":"A","text":"痛みは何秒で最強になりましたか．"},{"letter":"B","text":"痛みは片側にありますか．"},{"letter":"C","text":"光や音がつらいですか．"},{"letter":"D","text":"家族にも頭痛持ちがいますか．"},{"letter":"E","text":"頭痛薬を月に何日使いますか．"}],"answer":["A"],"multi":false,"explanation":"解説：発症から最強に達するまでの時間が頭痛の鑑別を決める．数秒から1分以内に最大となる雷鳴頭痛はくも膜下出血を第一に疑うべきで，緩徐に増強する頭痛とは緊急度がまったく異なる．\n- A：発症様式を確かめるもので有用．\n- B：痛みの部位に関する情報．\n- C：感覚過敏に関する情報．\n- D：家族歴に関する情報．\n- E：薬剤の使用頻度に関する情報．","images":[],"stem_images":[]},{"number":6,"section":"D-2-S02　52歳女性・突然の激しい頭痛","question":"（2/4）52歳の女性．突然の激しい頭痛を主訴に救急搬送された．発症は1時間前で，嘔吐を伴う．意識は清明である．痛みは数秒で最強になり，これまで経験したことのない強さだったという．認められる所見はどれか．","options":[{"letter":"A","text":"項部硬直"},{"letter":"B","text":"Babinski徴候の陽性"},{"letter":"C","text":"歯車様筋強剛"},{"letter":"D","text":"腱反射の全般的消失"},{"letter":"E","text":"舌の線維束攣縮"}],"answer":["A"],"multi":false,"explanation":"解説：くも膜下腔に広がった血液が髄膜を刺激し，項部硬直やKernig徴候といった髄膜刺激徴候を生じる．ただし発症直後には出ないことがあり，陰性でも否定の根拠にはならない．\n- A：髄膜刺激徴候として正しい．\n- B：Babinski徴候は錐体路障害を示し，本例で必発ではない．\n- C：歯車様筋強剛はParkinson病．\n- D：腱反射の全般的消失はGuillain-Barré症候群．\n- E：舌の線維束攣縮は筋萎縮性側索硬化症．","images":[],"stem_images":[]},{"number":7,"section":"D-2-S02　52歳女性・突然の激しい頭痛","question":"（3/4）52歳の女性．突然の激しい頭痛を主訴に救急搬送された．発症は1時間前で，嘔吐を伴う．意識は清明である．痛みは数秒で最強になり，これまで経験したことのない強さだったという．項部硬直を認める．頭部単純CTで脳底槽にヒトデ型の高吸収域を認めた．次に行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査"},{"letter":"B","text":"上部消化管内視鏡"},{"letter":"C","text":"脳血管造影"},{"letter":"D","text":"骨シンチグラフィ"},{"letter":"E","text":"腰椎穿刺"}],"answer":["C"],"multi":false,"explanation":"解説：出血源である脳動脈瘤の部位・形状・頸部の大きさを確かめ，開頭クリッピングか血管内コイル塞栓かを決める．CTアンギオグラフィや脳血管造影を用い，多発動脈瘤の有無も同時に評価する．\n- A：呼吸機能検査は換気障害の評価．\n- B：内視鏡は消化管疾患の評価．\n- C：治療方針の決定に直結し正しい．\n- D：骨シンチグラフィは骨病変の検索．\n- E：CTで診断がついた以上，腰椎穿刺は不要で危険を伴う．","images":[],"stem_images":[]},{"number":8,"section":"D-2-S02　52歳女性・突然の激しい頭痛","question":"（4/4）52歳の女性．突然の激しい頭痛を主訴に救急搬送された．発症は1時間前で，嘔吐を伴う．意識は清明である．痛みは数秒で最強になり，これまで経験したことのない強さだったという．項部硬直を認める．頭部単純CTで脳底槽にヒトデ型の高吸収域を認めた．脳血管造影で前交通動脈に嚢状の動脈瘤を認めた．発症後72時間以内に最も警戒すべきなのはどれか．","options":[{"letter":"A","text":"正常圧水頭症"},{"letter":"B","text":"深部静脈血栓症"},{"letter":"C","text":"消化管穿孔"},{"letter":"D","text":"再出血"},{"letter":"E","text":"脳血管攣縮"}],"answer":["D"],"multi":false,"explanation":"解説：再出血は発症24時間以内に最も多く，起これば致死率が跳ね上がる．鎮痛・鎮静と降圧で管理しつつ，発症48〜72時間以内に動脈瘤の根治術を行うのが原則である．\n- A：正常圧水頭症は数週以降の慢性期合併症．\n- B：深部静脈血栓症は臥床に伴う合併症だが，最優先の警戒対象ではない．\n- C：消化管穿孔はストレス潰瘍の合併症としてありうるが頻度が低い．\n- D：この時期に最も生命を脅かし正しい．\n- E：脳血管攣縮は発症4〜14日に起こる遅発性の合併症．","images":[],"stem_images":[]},{"number":9,"section":"D-2-S03　74歳男性・一過性の右上肢脱力","question":"（1/4）74歳の男性．本日午前，突然右手に力が入らなくなり，20分で完全に元に戻ったという．受診時に神経学的異常を認めない．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"若い頃から肩がこりますか．"},{"letter":"B","text":"血糖を下げる薬を使っていますか．"},{"letter":"C","text":"言葉も出にくくなりましたか．"},{"letter":"D","text":"同じ症状を繰り返していますか．"},{"letter":"E","text":"動悸を感じることはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性の肩こりは今回の局所症状の評価では優先度が低い．\n- A：慢性の肩こりは今回の局所症状の評価では優先度が低い．この設問で選ぶ肢．\n- B：低血糖による類似症状を検討．\n- C：神経症状の分布を確認．\n- D：再発性の一過性脳虚血を検討．\n- E：塞栓源となる不整脈を検討．","images":[],"stem_images":[]},{"number":10,"section":"D-2-S03　74歳男性・一過性の右上肢脱力","question":"（2/4）74歳の男性．本日午前，突然右手に力が入らなくなり，20分で完全に元に戻ったという．受診時に神経学的異常を認めない．2週間前にも同じ症状が5分ほど続いたという．認められる所見はどれか．","options":[{"letter":"A","text":"歯車様筋強剛"},{"letter":"B","text":"舌の線維束攣縮"},{"letter":"C","text":"眼瞼下垂の日内変動"},{"letter":"D","text":"腱反射の全般的消失"},{"letter":"E","text":"頸部の血管雑音"}],"answer":["E"],"multi":false,"explanation":"解説：内頸動脈起始部に高度狭窄があると乱流が生じ，下顎角の高さで収縮期の血管雑音を聴取する．同部のプラークから飛んだ微小塞栓が，同側の一過性の巣症状を繰り返し起こす．\n- A：歯車様筋強剛はParkinson病．\n- B：舌の線維束攣縮は筋萎縮性側索硬化症．\n- C：眼瞼下垂の日内変動は重症筋無力症．\n- D：腱反射の全般的消失はGuillain-Barré症候群．\n- E：塞栓源を示唆し正しい．","images":[],"stem_images":[]},{"number":11,"section":"D-2-S03　74歳男性・一過性の右上肢脱力","question":"（3/4）74歳の男性．本日午前，突然右手に力が入らなくなり，20分で完全に元に戻ったという．受診時に神経学的異常を認めない．2週間前にも同じ症状が5分ほど続いたという．左頸部に収縮期の血管雑音を聴取する．塞栓源の評価に最も適した検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査"},{"letter":"B","text":"頸動脈超音波検査"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"上部消化管内視鏡"},{"letter":"E","text":"腰椎穿刺"}],"answer":["B"],"multi":false,"explanation":"解説：頸動脈超音波はプラークの性状と狭窄率を非侵襲的に測れ，繰り返し評価できる．頭部MRIの拡散強調像で無症候性の新鮮梗塞を探し，心電図で心房細動の有無も併せて確認する．\n- A：呼吸機能検査は換気障害の評価．\n- B：塞栓源の同定に最も適し正しい．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：腰椎穿刺は髄膜炎やくも膜下出血を疑うときの検査．","images":[],"stem_images":[]},{"number":12,"section":"D-2-S03　74歳男性・一過性の右上肢脱力","question":"（4/4）74歳の男性．本日午前，突然右手に力が入らなくなり，20分で完全に元に戻ったという．受診時に神経学的異常を認めない．2週間前にも同じ症状が5分ほど続いたという．左頸部に収縮期の血管雑音を聴取する．頸動脈超音波で左内頸動脈に80%の狭窄と潰瘍性プラークを認めた．心電図は洞調律であった．直ちに開始すべきなのはどれか．","options":[{"letter":"A","text":"副腎皮質ステロイド"},{"letter":"B","text":"抗てんかん薬"},{"letter":"C","text":"抗血小板薬"},{"letter":"D","text":"鉄剤の補充"},{"letter":"E","text":"経過観察"}],"answer":["C"],"multi":false,"explanation":"解説：非心原性の一過性脳虚血発作では抗血小板薬を速やかに開始する．発症直後が最も脳梗塞を起こしやすいため入院での管理を考え，高度狭窄には頸動脈内膜剥離術やステント留置術を検討する．\n- A：ステロイドは炎症性疾患の治療で，血栓予防にならない．\n- B：抗てんかん薬はけいれん発作の治療．\n- C：脳梗塞への進展を防ぎ正しい．\n- D：鉄剤は鉄欠乏性貧血の治療．\n- E：最も脳梗塞を起こしやすい時期であり経過観察は許されない．","images":[],"stem_images":[]},{"number":13,"section":"D-2-S04　78歳女性・物忘れの進行","question":"（1/4）78歳の女性．物忘れを心配した家族に連れられて来院した．2年ほど前から同じことを何度も尋ねるようになったという．本人は困っていないと話す．家族に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"段階的に悪くなりましたか．"},{"letter":"B","text":"気分の落ち込みはありますか．"},{"letter":"C","text":"辛い料理は好きですか．"},{"letter":"D","text":"眠剤などの薬を飲んでいますか．"},{"letter":"E","text":"買い物や支払いはできますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．嗜好だけでは認知機能低下の鑑別に役立ちにくい．\n- A：血管性の経過を検討．\n- B：抑うつに伴う認知症状を検討．\n- C：嗜好だけでは認知機能低下の鑑別に役立ちにくい．この設問で選ぶ肢．\n- D：薬剤性の認知機能低下を検討．\n- E：日常生活機能への影響を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-2-S04　78歳女性・物忘れの進行","question":"（2/4）78歳の女性．物忘れを心配した家族に連れられて来院した．2年ほど前から同じことを何度も尋ねるようになったという．本人は困っていないと話す．症状は切れ目なくゆっくり進んでいるという．認められる所見はどれか．","options":[{"letter":"A","text":"具体的な人物の幻視"},{"letter":"B","text":"近時記憶の選択的な障害"},{"letter":"C","text":"安静時振戦と小刻み歩行"},{"letter":"D","text":"一側の痙性片麻痺"},{"letter":"E","text":"腱反射の全般的消失"}],"answer":["B"],"multi":false,"explanation":"解説：海馬を中心とする側頭葉内側が早期から障害されるため，数分から数日前の出来事を覚えられない近時記憶障害が前景に立つ．遠隔記憶や手続き記憶は比較的よく保たれる．\n- A：具体的な幻視はLewy小体型認知症に特徴的．\n- B：この疾患の中核症状で正しい．\n- C：安静時振戦と小刻み歩行はパーキンソニズムで，Lewy小体型やParkinson病．\n- D：痙性片麻痺は脳血管障害の後遺症．\n- E：腱反射の全般的消失は末梢神経障害．","images":[],"stem_images":[]},{"number":15,"section":"D-2-S04　78歳女性・物忘れの進行","question":"（3/4）78歳の女性．物忘れを心配した家族に連れられて来院した．2年ほど前から同じことを何度も尋ねるようになったという．本人は困っていないと話す．症状は切れ目なくゆっくり進んでいるという．改訂長谷川式簡易知能評価スケールは16点で，近時記憶の障害が目立つ．麻痺や不随意運動はない．画像検査で予想される所見はどれか．","options":[{"letter":"A","text":"脳室周囲白質の卵円形病変"},{"letter":"B","text":"被殻の高吸収域"},{"letter":"C","text":"側頭葉内側の萎縮"},{"letter":"D","text":"三日月型の低吸収域"},{"letter":"E","text":"リング状に増強される腫瘤"}],"answer":["C"],"multi":false,"explanation":"解説：MRIの冠状断で海馬と海馬傍回の萎縮が左右対称に進み，側脳室下角が拡大する．脳血流シンチグラフィでは頭頂側頭葉と後部帯状回の血流低下がみられ，補助診断に用いられる．\n- A：脳室周囲白質の卵円形病変は多発性硬化症．\n- B：被殻の高吸収域は高血圧性脳出血．\n- C：この疾患の画像上の特徴で正しい．\n- D：三日月型の病変は慢性硬膜下血腫．\n- E：リング状増強は脳膿瘍や転移性脳腫瘍．","images":[],"stem_images":[]},{"number":16,"section":"D-2-S04　78歳女性・物忘れの進行","question":"（4/4）78歳の女性．物忘れを心配した家族に連れられて来院した．2年ほど前から同じことを何度も尋ねるようになったという．本人は困っていないと話す．症状は切れ目なくゆっくり進んでいるという．改訂長谷川式簡易知能評価スケールは16点で，近時記憶の障害が目立つ．麻痺や不随意運動はない．MRIで側頭葉内側の萎縮を認めた．脳内に蓄積している物質はどれか．","options":[{"letter":"A","text":"アミロイドβ蛋白"},{"letter":"B","text":"銅イオン"},{"letter":"C","text":"ヘモジデリン"},{"letter":"D","text":"グリコーゲン顆粒"},{"letter":"E","text":"尿酸塩結晶"}],"answer":["A"],"multi":false,"explanation":"解説：アミロイドβが細胞外に沈着して老人斑を作り，リン酸化タウが細胞内に蓄積して神経原線維変化を生じる．この二つの病理所見が神経細胞の脱落とシナプスの減少をもたらす．\n- A：老人斑の主成分で正しい．\n- B：銅イオンの蓄積はWilson病．\n- C：ヘモジデリンとしての鉄の過剰蓄積はヘモクロマトーシス．\n- D：グリコーゲン顆粒の蓄積は糖原病．\n- E：尿酸塩結晶の沈着は痛風．","images":[],"stem_images":[]},{"number":17,"section":"D-2-S05　68歳男性・動作の緩慢と手の震え","question":"（1/4）68歳の男性．1年前から右手が震えるようになり，動作が遅くなったという．歩き出しの一歩が出にくいと家族が話す．振戦を安静時型と動作時型に分けるための質問はどれか．","options":[{"letter":"A","text":"震えは何をしているときに出ますか．"},{"letter":"B","text":"震えは左右どちらが強いですか．"},{"letter":"C","text":"家族にも震える人がいますか．"},{"letter":"D","text":"薬を飲み始めてから出ましたか．"},{"letter":"E","text":"お酒で震えが軽くなりますか．"}],"answer":["A"],"multi":false,"explanation":"解説：振戦は出現する状況で鑑別が決まる．じっとしているときに強く，動かすと軽くなるのが安静時振戦で，これはパーキンソニズムの特徴である．姿勢時・動作時に出る本態性振戦とは逆になる．\n- A：振戦の型を確かめるもので有用．\n- B：左右差に関する情報．\n- C：家族歴に関する情報．\n- D：薬剤との時間関係に関する情報．\n- E：飲酒への反応に関する情報．","images":[],"stem_images":[]},{"number":18,"section":"D-2-S05　68歳男性・動作の緩慢と手の震え","question":"（2/4）68歳の男性．1年前から右手が震えるようになり，動作が遅くなったという．歩き出しの一歩が出にくいと家族が話す．震えはじっとしているときに強く，何かをつかむと軽くなるという．認められる所見はどれか．","options":[{"letter":"A","text":"眼瞼下垂の日内変動"},{"letter":"B","text":"腱反射の全般的消失"},{"letter":"C","text":"舌の線維束攣縮"},{"letter":"D","text":"歯車様の筋強剛"},{"letter":"E","text":"手袋靴下型の感覚障害"}],"answer":["D"],"multi":false,"explanation":"解説：他動的に手関節や肘を動かすと，一定の抵抗がカクカクと断続して感じられる．これが歯車現象で，安静時振戦・無動・姿勢反射障害とともに四徴を構成する．発症時は左右差があるのが通例である．\n- A：眼瞼下垂の日内変動は重症筋無力症．\n- B：腱反射の全般的消失はGuillain-Barré症候群．\n- C：舌の線維束攣縮は筋萎縮性側索硬化症．\n- D：錐体外路症状として正しい．\n- E：手袋靴下型の感覚障害は多発ニューロパチー．","images":[],"stem_images":[]},{"number":19,"section":"D-2-S05　68歳男性・動作の緩慢と手の震え","question":"（3/4）68歳の男性．1年前から右手が震えるようになり，動作が遅くなったという．歩き出しの一歩が出にくいと家族が話す．震えはじっとしているときに強く，何かをつかむと軽くなるという．右上肢に歯車様の筋強剛を認め，表情は乏しく，歩行は小刻みで前傾姿勢である．頭部MRIで異常を認めない．診断に有用な検査はどれか．","options":[{"letter":"A","text":"神経伝導速度の測定"},{"letter":"B","text":"反復刺激試験"},{"letter":"C","text":"ドパミントランスポータシンチ"},{"letter":"D","text":"髄液のオリゴクローナルバンド検索"},{"letter":"E","text":"骨格筋の生検"}],"answer":["C"],"multi":false,"explanation":"解説：線条体のドパミン神経終末を画像化し，取り込みの低下で黒質線条体路の変性を確かめる．本態性振戦や薬剤性パーキンソニズムでは正常に保たれるため，鑑別に有用である．\n- A：神経伝導速度は末梢神経障害の評価．\n- B：反復刺激試験は神経筋接合部の障害を調べる検査．\n- C：黒質線条体路の変性を直接示し正しい．\n- D：オリゴクローナルバンドは多発性硬化症．\n- E：骨格筋の生検は筋炎や筋ジストロフィーの診断．","images":[],"stem_images":[]},{"number":20,"section":"D-2-S05　68歳男性・動作の緩慢と手の震え","question":"（4/4）68歳の男性．1年前から右手が震えるようになり，動作が遅くなったという．歩き出しの一歩が出にくいと家族が話す．震えはじっとしているときに強く，何かをつかむと軽くなるという．右上肢に歯車様の筋強剛を認め，表情は乏しく，歩行は小刻みで前傾姿勢である．ドパミントランスポータシンチで線条体の集積が低下していた．最も有効な治療はどれか．","options":[{"letter":"A","text":"コリンエステラーゼ阻害薬"},{"letter":"B","text":"L-ドパの投与"},{"letter":"C","text":"副腎皮質ステロイド"},{"letter":"D","text":"免疫グロブリン大量療法"},{"letter":"E","text":"抗てんかん薬"}],"answer":["B"],"multi":false,"explanation":"解説：不足したドパミンを補う置換療法で，症状は劇的に改善する．この反応性の良さ自体が診断を支持する所見にもなる．長期使用でウェアリングオフやジスキネジアが出るため，開始時期と量を調整する．\n- A：コリンエステラーゼ阻害薬はAlzheimer型認知症や重症筋無力症に用いる．\n- B：病態の中心であるドパミン欠乏を直接補い正しい．\n- C：ステロイドは炎症性・自己免疫性疾患の治療．\n- D：免疫グロブリン大量療法はGuillain-Barré症候群や重症筋無力症．\n- E：抗てんかん薬はけいれん発作の治療．","images":[],"stem_images":[]},{"number":21,"section":"D-2-S06　76歳男性・日によって変わる物忘れ","question":"（1/4）76歳の男性．1年前からの物忘れを主訴に家族と来院した．しっかりしている日と，ぼんやりして会話が成り立たない日があるという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"いない人や動物が見えますか．"},{"letter":"B","text":"最近，薬が変わりましたか．"},{"letter":"C","text":"歩幅が小さくなりましたか．"},{"letter":"D","text":"眠っている間に大声や動作が出ますか．"},{"letter":"E","text":"歯に冷水がしみますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．歯の知覚過敏は認知機能の変動の評価では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：具体的な幻視の有無を確認．\n- B：薬剤やせん妄の要因を確認．\n- C：パーキンソニズムを検討．\n- D：レム睡眠行動異常を確認．\n- E：歯の知覚過敏は認知機能の変動の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":22,"section":"D-2-S06　76歳男性・日によって変わる物忘れ","question":"（2/4）76歳の男性．1年前からの物忘れを主訴に家族と来院した．しっかりしている日と，ぼんやりして会話が成り立たない日があるという．部屋の隅に子どもが座っているとしばしば訴えるという．認められる所見はどれか．","options":[{"letter":"A","text":"舌の線維束攣縮"},{"letter":"B","text":"手袋靴下型の感覚障害"},{"letter":"C","text":"腱反射の全般的消失"},{"letter":"D","text":"動作緩慢と筋強剛"},{"letter":"E","text":"眼瞼下垂の日内変動"}],"answer":["D"],"multi":false,"explanation":"解説：大脳皮質と脳幹の広い範囲にLewy小体が出現するため，認知症とパーキンソニズムが並行して現れる．認知症状が運動症状に先行するか1年以内に続くことが，Parkinson病に伴う認知症との区別になる．\n- A：舌の線維束攣縮は筋萎縮性側索硬化症．\n- B：手袋靴下型の感覚障害は多発ニューロパチー．\n- C：腱反射の全般的消失はGuillain-Barré症候群．\n- D：Lewy小体病理を反映し正しい．\n- E：眼瞼下垂の日内変動は重症筋無力症．","images":[],"stem_images":[]},{"number":23,"section":"D-2-S06　76歳男性・日によって変わる物忘れ","question":"（3/4）76歳の男性．1年前からの物忘れを主訴に家族と来院した．しっかりしている日と，ぼんやりして会話が成り立たない日があるという．部屋の隅に子どもが座っているとしばしば訴えるという．動作は緩慢で四肢に筋強剛を認める．睡眠中に大声を出して手足を動かすことがあるという．介護者に伝えるべき注意はどれか．","options":[{"letter":"A","text":"水分摂取を厳しく制限する"},{"letter":"B","text":"抗精神病薬に過敏性がある"},{"letter":"C","text":"蛋白質の摂取を禁止する"},{"letter":"D","text":"毎日の全力疾走を勧める"},{"letter":"E","text":"直射日光を完全に避ける"}],"answer":["B"],"multi":false,"explanation":"解説：この疾患では抗精神病薬に対する過敏性があり，少量でもパーキンソニズムの悪化や意識障害，悪性症候群を起こしうる．幻視への対応はまず環境調整で行い，薬物は慎重に選ぶ．\n- A：水分制限は脱水を招き，かえってせん妄を悪化させる．\n- B：安全に直結する最も重要な注意で正しい．\n- C：蛋白制限は肝性脳症や腎不全の食事療法で，本例には無関係．\n- D：高齢でパーキンソニズムがあり，転倒の危険が高い．\n- E：直射日光の回避はポルフィリン症などの指導．","images":[],"stem_images":[]},{"number":24,"section":"D-2-S06　76歳男性・日によって変わる物忘れ","question":"（4/4）76歳の男性．1年前からの物忘れを主訴に家族と来院した．しっかりしている日と，ぼんやりして会話が成り立たない日があるという．部屋の隅に子どもが座っているとしばしば訴えるという．動作は緩慢で四肢に筋強剛を認める．睡眠中に大声を出して手足を動かすことがあるという．脳梗塞の再発ごとに段階的に悪化する認知症と本例を分けるのはどれか．","options":[{"letter":"A","text":"連続して進行すること"},{"letter":"B","text":"高齢者に多いこと"},{"letter":"C","text":"記憶障害をきたすこと"},{"letter":"D","text":"介護負担が大きいこと"},{"letter":"E","text":"根本的な治療法が確立していないこと"}],"answer":["A"],"multi":false,"explanation":"解説：脳血管性認知症は梗塞のたびに階段状に悪化し，麻痺や構音障害といった巣症状と画像上の血管性病変を伴う．本例は血管イベントなしに連続して進む変性疾患で，経過の形が決定的な差になる．\n- A：経過の形そのもので，鑑別の決め手として正しい．\n- B：どちらも高齢者に多く区別できない．\n- C：記憶障害は認知症に共通する症状．\n- D：介護負担はどちらでも大きい．\n- E：根本的な治療法がない点も共通しており，鑑別にならない．","images":[],"stem_images":[]},{"number":25,"section":"D-2-S07　58歳男性・進行する手の筋力低下","question":"（1/4）58歳の男性．半年前から右手に力が入らず，箸が使いにくくなったという．次第に両手に広がり，最近は階段で足がもつれるようになった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"季節によってくしゃみが出ますか．"},{"letter":"B","text":"手足のしびれはありますか．"},{"letter":"C","text":"尿が出にくくなりましたか．"},{"letter":"D","text":"横になると息苦しいですか．"},{"letter":"E","text":"飲み込みにくさはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．季節性鼻炎は進行性筋力低下の局在判断では優先度が低い．\n- A：季節性鼻炎は進行性筋力低下の局在判断では優先度が低い．この設問で選ぶ肢．\n- B：感覚障害の有無で局在を絞る．\n- C：脊髄病変との鑑別に有用．\n- D：呼吸筋力低下を検討．\n- E：球症状と誤嚥リスクを確認．","images":[],"stem_images":[]},{"number":26,"section":"D-2-S07　58歳男性・進行する手の筋力低下","question":"（2/4）58歳の男性．半年前から右手に力が入らず，箸が使いにくくなったという．次第に両手に広がり，最近は階段で足がもつれるようになった．しびれや感覚の鈍さはまったくないという．認められる所見はどれか．","options":[{"letter":"A","text":"左右対称の手袋靴下型感覚障害"},{"letter":"B","text":"具体的な人物の幻視"},{"letter":"C","text":"歯車様の筋強剛"},{"letter":"D","text":"両側の視神経萎縮"},{"letter":"E","text":"筋萎縮と腱反射亢進の共存"}],"answer":["E"],"multi":false,"explanation":"解説：下位運動ニューロン障害による筋萎縮・線維束攣縮と，上位運動ニューロン障害による腱反射亢進・Babinski徴候が同じ肢に同居する．本来なら相反するこの組合せが診断の核心になる．\n- A：左右対称の手袋靴下型感覚障害は多発ニューロパチーで，感覚が保たれる本例と矛盾する．\n- B：具体的な幻視はLewy小体型認知症．\n- C：歯車様筋強剛はParkinson病．\n- D：視神経萎縮は視神経炎の後遺や緑内障．\n- E：上位・下位両ニューロンの障害を同時に示し正しい．","images":[],"stem_images":[]},{"number":27,"section":"D-2-S07　58歳男性・進行する手の筋力低下","question":"（3/4）58歳の男性．半年前から右手に力が入らず，箸が使いにくくなったという．次第に両手に広がり，最近は階段で足がもつれるようになった．しびれや感覚の鈍さはまったくないという．両手の母指球筋に萎縮と線維束攣縮を認め，四肢の腱反射は亢進しBabinski徴候が陽性である．診断に有用な検査はどれか．","options":[{"letter":"A","text":"針筋電図"},{"letter":"B","text":"髄液のオリゴクローナルバンド検索"},{"letter":"C","text":"頸動脈超音波検査"},{"letter":"D","text":"骨シンチグラフィ"},{"letter":"E","text":"24時間食道pHモニタリング"}],"answer":["A"],"multi":false,"explanation":"解説：脱神経を示す線維自発電位や陽性鋭波と，再支配を示す高振幅長持続の運動単位電位を，症状のない部位も含めて複数領域で確認する．頸椎症性脊髄症を除外するため頸椎MRIも併せて行う．\n- A：下位運動ニューロン障害の広がりを示し正しい．\n- B：オリゴクローナルバンドは多発性硬化症．\n- C：頸動脈超音波は動脈硬化の評価．\n- D：骨シンチグラフィは骨病変の検索．\n- E：食道pHモニタリングは胃食道逆流症の検査．","images":[],"stem_images":[]},{"number":28,"section":"D-2-S07　58歳男性・進行する手の筋力低下","question":"（4/4）58歳の男性．半年前から右手に力が入らず，箸が使いにくくなったという．次第に両手に広がり，最近は階段で足がもつれるようになった．しびれや感覚の鈍さはまったくないという．両手の母指球筋に萎縮と線維束攣縮を認め，四肢の腱反射は亢進しBabinski徴候が陽性である．針筋電図で広範な脱神経所見を認めた．この疾患で末期まで保たれやすいのはどれか．","options":[{"letter":"A","text":"嚥下機能"},{"letter":"B","text":"眼球運動"},{"letter":"C","text":"呼吸筋の力"},{"letter":"D","text":"舌の運動"},{"letter":"E","text":"上肢の巧緻運動"}],"answer":["B"],"multi":false,"explanation":"解説：外眼筋を支配する運動ニューロン，眼球運動・膀胱直腸機能・感覚・褥瘡が末期まで保たれやすく，陰性四徴と呼ばれる．人工呼吸器で生存期間が延びると，これらも侵されうる．\n- A：球麻痺が進むと嚥下障害をきたし，誤嚥性肺炎の原因になる．\n- B：陰性四徴のひとつとして正しい．\n- C：呼吸筋麻痺は生命予後を直接規定する．\n- D：舌の萎縮と線維束攣縮は球麻痺の代表的所見．\n- E：上肢の巧緻運動障害は本例の初発症状そのもの．","images":[],"stem_images":[]},{"number":29,"section":"D-2-S08　34歳男性・発熱と意識障害","question":"（1/4）34歳の男性．発熱と頭痛を主訴に来院した．2日前から38℃台の発熱と頭痛があり，本日は呼びかけへの反応が鈍いと家族が話す．家族に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"同居人にも発熱がありますか．"},{"letter":"B","text":"以前から乗り物酔いをしますか．"},{"letter":"C","text":"いつから言動が変わりましたか．"},{"letter":"D","text":"最近，薬が増えましたか．"},{"letter":"E","text":"けいれんは起きましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．乗り物酔いの既往は今回の意識障害の緊急評価では優先度が低い．\n- A：感染への曝露状況を確認．\n- B：乗り物酔いの既往は今回の意識障害の緊急評価では優先度が低い．この設問で選ぶ肢．\n- C：中枢神経症状の経過を確認．\n- D：薬剤性意識障害を検討．\n- E：脳炎や発作後状態を検討．","images":[],"stem_images":[]},{"number":30,"section":"D-2-S08　34歳男性・発熱と意識障害","question":"（2/4）34歳の男性．発熱と頭痛を主訴に来院した．2日前から38℃台の発熱と頭痛があり，本日は呼びかけへの反応が鈍いと家族が話す．昨日から同じ話を繰り返し，家族の名前を間違えるようになったという．まず行うべき検査はどれか．","options":[{"letter":"A","text":"頭部CTと腰椎穿刺"},{"letter":"B","text":"呼吸機能検査"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"頸動脈超音波検査"},{"letter":"E","text":"24時間食道pHモニタリング"}],"answer":["A"],"multi":false,"explanation":"解説：頭部CTで占拠性病変と頭蓋内圧亢進がないことを確かめてから腰椎穿刺を行う．髄液の細胞数と分画，糖，蛋白が細菌性かウイルス性かを分け，病原体検索の検体にもなる．\n- A：病型決定に直結し最優先で正しい．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：頸動脈超音波は動脈硬化の評価．\n- E：食道pHモニタリングは胃食道逆流症の検査．","images":[],"stem_images":[]},{"number":31,"section":"D-2-S08　34歳男性・発熱と意識障害","question":"（3/4）34歳の男性．発熱と頭痛を主訴に来院した．2日前から38℃台の発熱と頭痛があり，本日は呼びかけへの反応が鈍いと家族が話す．昨日から同じ話を繰り返し，家族の名前を間違えるようになったという．項部硬直を認める．髄液は初圧220mmH2O，細胞数180/μL（単核球優位），糖は血糖の70%，蛋白82mg/dLであった．考えられるのはどれか．","options":[{"letter":"A","text":"細菌性髄膜炎"},{"letter":"B","text":"結核性の髄膜炎"},{"letter":"C","text":"クリプトコックス髄膜炎"},{"letter":"D","text":"肝性脳症"},{"letter":"E","text":"ウイルス性の脳炎"}],"answer":["E"],"multi":false,"explanation":"解説：単核球優位の細胞増多で糖が保たれるのはウイルス性の特徴である．細菌性では多核球優位で糖が著明に低下し，結核性・真菌性では単核球優位だが糖が低下し蛋白が著増する．\n- A：細菌性なら多核球優位で糖が著減する．\n- B：結核性では糖の低下と蛋白の著増を伴い，経過も亜急性．\n- C：クリプトコックス髄膜炎も糖が低下し，墨汁染色や抗原検査で診断する．\n- D：肝性脳症では髄液は正常で，発熱も髄膜刺激徴候も伴わない．\n- E：髄液所見と経過に合致し正しい．","images":[],"stem_images":[]},{"number":32,"section":"D-2-S08　34歳男性・発熱と意識障害","question":"（4/4）34歳の男性．発熱と頭痛を主訴に来院した．2日前から38℃台の発熱と頭痛があり，本日は呼びかけへの反応が鈍いと家族が話す．昨日から同じ話を繰り返し，家族の名前を間違えるようになったという．項部硬直を認める．髄液は初圧220mmH2O，細胞数180/μL（単核球優位），糖は血糖の70%，蛋白82mg/dLであった．頭部MRIで両側側頭葉内側に異常信号を認めた．直ちに開始すべき治療はどれか．","options":[{"letter":"A","text":"抗結核薬の4剤併用"},{"letter":"B","text":"抗真菌薬の点滴"},{"letter":"C","text":"ラクツロースの投与"},{"letter":"D","text":"アシクロビルの点滴"},{"letter":"E","text":"血漿交換"}],"answer":["D"],"multi":false,"explanation":"解説：側頭葉内側に偏る病変と精神症状から単純ヘルペス脳炎を疑い，PCRの結果を待たずにアシクロビルを開始する．治療開始の遅れが後遺症と死亡率を大きく左右するため，疑った時点で投与する．\n- A：抗結核薬は結核性髄膜炎の治療で，髄液糖が保たれる本例に合わない．\n- B：抗真菌薬は真菌性髄膜炎の治療．\n- C：ラクツロースは肝性脳症の治療．\n- D：疑った時点での投与が原則で正しい．\n- E：血漿交換は血栓性血小板減少性紫斑病や重症のGuillain-Barré症候群．","images":[],"stem_images":[]},{"number":33,"section":"D-2-S09　45歳男性・発熱と頭痛","question":"（1/4）45歳の男性．1週間前からの頭痛と38℃台の発熱を主訴に来院した．3日前から左手が動かしにくいという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"以前から寝つきが悪いですか．"},{"letter":"B","text":"耳や鼻の炎症はありましたか．"},{"letter":"C","text":"免疫を抑える薬を使っていますか．"},{"letter":"D","text":"心臓の弁の病気はありますか．"},{"letter":"E","text":"歯の感染や治療はありましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．慢性不眠は今回の感染源検索では優先度が低い．\n- A：慢性不眠は今回の感染源検索では優先度が低い．この設問で選ぶ肢．\n- B：頭蓋内への感染波及を検討．\n- C：日和見感染の危険を確認．\n- D：血行性の感染源を検討．\n- E：歯性感染の波及を検討．","images":[],"stem_images":[]},{"number":34,"section":"D-2-S09　45歳男性・発熱と頭痛","question":"（2/4）45歳の男性．1週間前からの頭痛と38℃台の発熱を主訴に来院した．3日前から左手が動かしにくいという．2週間前に副鼻腔炎で抗菌薬を処方されたという．最も適切な検査はどれか．","options":[{"letter":"A","text":"頸動脈超音波検査"},{"letter":"B","text":"呼吸機能検査"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"上部消化管内視鏡"},{"letter":"E","text":"頭部造影MRI"}],"answer":["E"],"multi":false,"explanation":"解説：造影MRIでは被膜がリング状に濃染し，拡散強調像で内部が高信号を示す．この拡散制限は膿の粘稠度を反映し，同じくリング状に濃染する転移性脳腫瘍や膠芽腫との鑑別に有用である．\n- A：頸動脈超音波は動脈硬化の評価．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：病変の性状と局在を同時に示し正しい．","images":[],"stem_images":[]},{"number":35,"section":"D-2-S09　45歳男性・発熱と頭痛","question":"（3/4）45歳の男性．1週間前からの頭痛と38℃台の発熱を主訴に来院した．3日前から左手が動かしにくいという．2週間前に副鼻腔炎で抗菌薬を処方されたという．頭部造影MRIで右前頭葉に3cm大のリング状に増強される病変を認め，拡散強調像で内部が高信号を呈した．周囲に強い浮腫を伴う．避けるべき検査はどれか．","options":[{"letter":"A","text":"血液培養"},{"letter":"B","text":"胸部エックス線撮影"},{"letter":"C","text":"腰椎穿刺"},{"letter":"D","text":"心エコー検査"},{"letter":"E","text":"副鼻腔CT"}],"answer":["C"],"multi":false,"explanation":"解説：占拠性病変と強い浮腫で頭蓋内圧が上がっている状態で髄液を抜くと，圧較差により脳幹が下方に押し出され脳ヘルニアを起こす．髄液検査の情報より危険が大きく，禁忌に近い．\n- A：血液培養は起因菌の同定に有用で行うべき検査．\n- B：胸部エックス線は肺の感染巣や膿胸の検索に役立つ．\n- C：脳ヘルニアを招く危険があり正しい．\n- D：心エコーは感染性心内膜炎という塞栓源の検索に有用．\n- E：副鼻腔CTは原発巣の評価として適切．","images":[],"stem_images":[]},{"number":36,"section":"D-2-S09　45歳男性・発熱と頭痛","question":"（4/4）45歳の男性．1週間前からの頭痛と38℃台の発熱を主訴に来院した．3日前から左手が動かしにくいという．2週間前に副鼻腔炎で抗菌薬を処方されたという．頭部造影MRIで右前頭葉に3cm大のリング状に増強される病変を認め，拡散強調像で内部が高信号を呈した．周囲に強い浮腫を伴う．最も適切な治療はどれか．","options":[{"letter":"A","text":"血栓溶解療法"},{"letter":"B","text":"定位的ドレナージと抗菌薬"},{"letter":"C","text":"抗てんかん薬の単独投与"},{"letter":"D","text":"副腎皮質ステロイドの単独投与"},{"letter":"E","text":"経過観察"}],"answer":["B"],"multi":false,"explanation":"解説：膿を排出して起因菌を同定し，移行性の良い抗菌薬を長期に投与する．同時に副鼻腔の原発巣も処置する．ステロイドは浮腫の軽減に補助的に用いるが，単独では感染を制御できない．\n- A：血栓溶解療法は脳梗塞の治療で，本例では出血の危険を増すだけである．\n- B：排膿と起因菌に基づく抗菌薬が治療の柱で正しい．\n- C：抗てんかん薬はけいれんの予防に併用するが，原因治療にならない．\n- D：ステロイド単独では感染が悪化しうる．\n- E：放置すれば脳室穿破や脳ヘルニアに至る．","images":[],"stem_images":[]},{"number":37,"section":"D-2-S10　29歳女性・片眼の視力低下","question":"（1/4）29歳の女性．3日前からの左眼の視力低下を主訴に来院した．眼を動かすと奥が痛むという．過去にも別の神経領域の症状があったかを確認する質問はどれか．","options":[{"letter":"A","text":"眼を動かすと痛みますか．"},{"letter":"B","text":"目や口が乾きますか．"},{"letter":"C","text":"物がゆがんで見えますか．"},{"letter":"D","text":"以前に手足のしびれが出ましたか．"},{"letter":"E","text":"片側の目が赤いですか．"}],"answer":["D"],"multi":false,"explanation":"解説：若年女性の球後視神経炎では，時間的にも空間的にも離れた神経症状の既往があるかどうかが決定的である．数か月前の一過性のしびれや複視が，中枢神経の別部位の病変を示していることがある．\n- A：現在の眼痛に関する情報．\n- B：乾燥症状に関する情報．\n- C：現在の変視症に関する情報．\n- D：時間的・空間的多発を確かめるもので有用．\n- E：現在の充血に関する情報．","images":[],"stem_images":[]},{"number":38,"section":"D-2-S10　29歳女性・片眼の視力低下","question":"（2/4）29歳の女性．3日前からの左眼の視力低下を主訴に来院した．眼を動かすと奥が痛むという．半年前に右手のしびれが2週間続いて自然に消えたことがあるという．認められる所見はどれか．","options":[{"letter":"A","text":"網膜全体に広がる火炎状出血"},{"letter":"B","text":"中心暗点と相対的瞳孔反応異常"},{"letter":"C","text":"眼圧の著明な上昇と充血"},{"letter":"D","text":"角膜中央の混濁"},{"letter":"E","text":"水晶体の後嚢下混濁"}],"answer":["B"],"multi":false,"explanation":"解説：視神経の伝導障害により中心視野が抜け，患眼に光を当てたときの直接対光反射が健眼を介した間接反射より弱くなる．発症早期は眼底が正常に見えることが多く，「患者も医師も何も見えない」と表現される．\n- A：網膜全体に広がる火炎状出血は高血圧性網膜症や網膜静脈閉塞症．\n- B：視神経障害を示す所見として正しい．\n- C：眼圧上昇と充血は緑内障発作．\n- D：角膜中央の混濁は角膜炎や外傷の後遺．\n- E：後嚢下混濁はステロイド性白内障．","images":[],"stem_images":[]},{"number":39,"section":"D-2-S10　29歳女性・片眼の視力低下","question":"（3/4）29歳の女性．3日前からの左眼の視力低下を主訴に来院した．眼を動かすと奥が痛むという．半年前に右手のしびれが2週間続いて自然に消えたことがあるという．左眼に中心暗点と相対的瞳孔反応異常を認める．眼底は正常である．診断に最も有用な検査はどれか．","options":[{"letter":"A","text":"頭部MRIと髄液検査"},{"letter":"B","text":"頸部血管の超音波検査"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"上部消化管内視鏡"}],"answer":["A"],"multi":false,"explanation":"解説：MRIで脳室周囲白質・脳梁・脊髄に卵円形の脱髄斑を探し，造影される新しい病変と造影されない古い病変が混在すれば時間的多発を画像で示せる．髄液のオリゴクローナルバンドとIgG指数の上昇も支持所見になる．\n- A：時間的・空間的多発の証明に直結し正しい．\n- B：頸部血管の超音波検査は動脈硬化の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：呼吸機能検査は換気障害の評価．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":40,"section":"D-2-S10　29歳女性・片眼の視力低下","question":"（4/4）29歳の女性．3日前からの左眼の視力低下を主訴に来院した．眼を動かすと奥が痛むという．半年前に右手のしびれが2週間続いて自然に消えたことがあるという．左眼に中心暗点と相対的瞳孔反応異常を認める．眼底は正常である．頭部MRIで脳室周囲白質に複数の卵円形病変を認め，髄液にオリゴクローナルバンドを検出した．入浴で症状が一時的に悪化する現象の機序はどれか．","options":[{"letter":"A","text":"頭蓋内圧の急激な上昇"},{"letter":"B","text":"眼圧の上昇"},{"letter":"C","text":"網膜血流の一過性減少"},{"letter":"D","text":"房水産生の過剰な増加"},{"letter":"E","text":"体温上昇による伝導障害"}],"answer":["E"],"multi":false,"explanation":"解説：脱髄した軸索は温度が上がると伝導が途絶えやすくなり，入浴・発熱・運動で一時的に症状が悪化する．これをUhthoff現象といい，新しい再発ではないので冷却すれば元に戻る．\n- A：頭蓋内圧の急激な上昇では頭痛・嘔吐・うっ血乳頭をきたす．\n- B：眼圧上昇は緑内障の病態．\n- C：網膜血流の一過性減少は一過性黒内障で，突然の高度視力低下をきたす．\n- D：房水産生の過剰は眼圧に関わるが，脱髄とは無関係．\n- E：脱髄軸索の温度依存性を反映し正しい．","images":[],"stem_images":[]},{"number":41,"section":"D-2-S11　22歳男性・転倒後の意識障害","question":"（1/4）22歳の男性．自転車で転倒し左側頭部を強打した．直後に短時間意識を失ったが，救急隊到着時には会話ができていた．搬送中に再び反応が鈍くなった．意識清明期の有無を判断するために確認する情報はどれか．","options":[{"letter":"A","text":"受傷から意識が悪化するまでの経過"},{"letter":"B","text":"受傷時の衝撃の方向と強さ"},{"letter":"C","text":"救急隊到着時の血圧と脈拍"},{"letter":"D","text":"搬送中の左右瞳孔径の差"},{"letter":"E","text":"けいれん発作の有無と長さ"}],"answer":["A"],"multi":false,"explanation":"解説：受傷直後の意識消失，その後の意識清明期，再度の意識障害という三相性の経過は，動脈性の出血が徐々に貯留して脳を圧迫していることを示す．この時間経過が病型と緊急度を決める．\n- A：病型を直接示し有用．\n- B：外傷の機転に関する情報．\n- C：循環の状態に関する情報．\n- D：局所神経徴候に関する情報．\n- E：発作の合併に関する情報．","images":[],"stem_images":[]},{"number":42,"section":"D-2-S11　22歳男性・転倒後の意識障害","question":"（2/4）22歳の男性．自転車で転倒し左側頭部を強打した．直後に短時間意識を失ったが，救急隊到着時には会話ができていた．搬送中に再び反応が鈍くなった．受傷から約1時間の意識清明期があったという．認められる所見はどれか．","options":[{"letter":"A","text":"四肢腱反射の全般的な消失"},{"letter":"B","text":"左瞳孔の散大と対光反射消失"},{"letter":"C","text":"両側の縮瞳と発汗過多"},{"letter":"D","text":"舌の萎縮と線維束攣縮"},{"letter":"E","text":"手袋靴下型の感覚障害"}],"answer":["B"],"multi":false,"explanation":"解説：血腫が増大して側頭葉内側がテント切痕に嵌入すると，同側の動眼神経が圧迫される．副交感線維が表層を走るため対光反射がまず失われ，血腫と同じ側の瞳孔が散大する．\n- A：四肢腱反射の全般的な消失はGuillain-Barré症候群．\n- B：テント切痕ヘルニアを示す所見で正しい．\n- C：両側縮瞳と発汗は橋出血や有機リン中毒．\n- D：舌の萎縮と線維束攣縮は筋萎縮性側索硬化症．\n- E：手袋靴下型の感覚障害は多発ニューロパチー．","images":[],"stem_images":[]},{"number":43,"section":"D-2-S11　22歳男性・転倒後の意識障害","question":"（3/4）22歳の男性．自転車で転倒し左側頭部を強打した．直後に短時間意識を失ったが，救急隊到着時には会話ができていた．搬送中に再び反応が鈍くなった．受傷から約1時間の意識清明期があったという．左瞳孔が散大し対光反射が消失している．頭部単純CTで予想される所見はどれか．","options":[{"letter":"A","text":"脳底槽のヒトデ型高吸収域"},{"letter":"B","text":"脳室周囲白質の卵円形病変"},{"letter":"C","text":"縫合線を越えて広がる三日月型"},{"letter":"D","text":"縫合線を越えない凸レンズ型"},{"letter":"E","text":"リング状に増強される腫瘤"}],"answer":["D"],"multi":false,"explanation":"解説：硬膜は縫合部で頭蓋骨に強く癒着しているため，硬膜外に漏れた血液は縫合線を越えられず，境界の明瞭な凸レンズ型（biconvex）に貯留する．側頭骨骨折による中硬膜動脈の破綻が典型である．\n- A：脳底槽のヒトデ型高吸収域はくも膜下出血．\n- B：脳室周囲白質の卵円形病変は多発性硬化症．\n- C：縫合線を越えて広がる三日月型は硬膜下血腫．\n- D：硬膜外の貯留形式を反映し正しい．\n- E：リング状増強は脳膿瘍や転移性脳腫瘍．","images":[],"stem_images":[]},{"number":44,"section":"D-2-S11　22歳男性・転倒後の意識障害","question":"（4/4）22歳の男性．自転車で転倒し左側頭部を強打した．直後に短時間意識を失ったが，救急隊到着時には会話ができていた．搬送中に再び反応が鈍くなった．受傷から約1時間の意識清明期があったという．左瞳孔が散大し対光反射が消失している．頭部単純CTで左側頭部に凸レンズ型の高吸収域と側頭骨の骨折線を認めた．最も適切な対応はどれか．","options":[{"letter":"A","text":"抗てんかん薬を投与し経過をみる"},{"letter":"B","text":"血栓溶解療法を直ちに開始する"},{"letter":"C","text":"腰椎穿刺で髄液圧を下げる"},{"letter":"D","text":"抗血小板薬の投与を開始する"},{"letter":"E","text":"緊急開頭血腫除去術を行う"}],"answer":["E"],"multi":false,"explanation":"解説：この病型は脳実質そのものの損傷が軽いことが多く，圧迫を早く解除できれば予後が良い．瞳孔不同が出た時点で分単位の対応が要り，速やかな血腫除去が転帰を決める．\n- A：抗てんかん薬は補助的で，血腫による圧迫は解除できない．\n- B：血栓溶解療法は出血を助長し禁忌．\n- C：頭蓋内圧が高い状態での腰椎穿刺は脳ヘルニアを招く．\n- D：抗血小板薬も出血を増悪させる．\n- E：圧迫の解除が唯一の根本治療で正しい．","images":[],"stem_images":[]},{"number":45,"section":"D-2-S12　79歳男性・1か月で進んだ物忘れ","question":"（1/4）79歳の男性．1か月前から物忘れが目立ち，歩行がふらつくようになったと家族が話す．会話中に眠り込むこともあるという．家族に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"片側の手足が動かしにくいですか．"},{"letter":"B","text":"冷たい物で歯がしみますか．"},{"letter":"C","text":"最近，頭を打ちましたか．"},{"letter":"D","text":"血を固まりにくくする薬を飲みますか．"},{"letter":"E","text":"新たな頭痛はありますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．知覚過敏は今回の神経症状の評価では優先度が低い．\n- A：局所神経症状を確認．\n- B：知覚過敏は今回の神経症状の評価では優先度が低い．この設問で選ぶ肢．\n- C：遅発性の頭蓋内出血を検討．\n- D：出血リスクを確認．\n- E：頭蓋内病変の随伴症状を確認．","images":[],"stem_images":[]},{"number":46,"section":"D-2-S12　79歳男性・1か月で進んだ物忘れ","question":"（2/4）79歳の男性．1か月前から物忘れが目立ち，歩行がふらつくようになったと家族が話す．会話中に眠り込むこともあるという．2か月前に風呂場で転倒し後頭部を打ったという．認められる所見はどれか．","options":[{"letter":"A","text":"具体的な人物の幻視"},{"letter":"B","text":"舌の萎縮と線維束攣縮"},{"letter":"C","text":"歯車様の筋強剛と小刻み歩行"},{"letter":"D","text":"一側上下肢の軽い不全麻痺"},{"letter":"E","text":"手袋靴下型の感覚障害"}],"answer":["D"],"multi":false,"explanation":"解説：血腫が大脳半球を圧迫するため，反対側の上下肢に軽い不全麻痺が出る．認知機能低下・歩行障害・片麻痺が数週かけて揃うのが特徴で，日内や日々で程度が変動することもある．\n- A：具体的な幻視はLewy小体型認知症．\n- B：舌の萎縮と線維束攣縮は筋萎縮性側索硬化症．\n- C：歯車様筋強剛と小刻み歩行はParkinson病．\n- D：一側性の圧迫を反映し正しい．\n- E：手袋靴下型の感覚障害は多発ニューロパチー．","images":[],"stem_images":[]},{"number":47,"section":"D-2-S12　79歳男性・1か月で進んだ物忘れ","question":"（3/4）79歳の男性．1か月前から物忘れが目立ち，歩行がふらつくようになったと家族が話す．会話中に眠り込むこともあるという．2か月前に風呂場で転倒し後頭部を打ったという．右上下肢に軽い不全麻痺を認める．頭部単純CTで予想される所見はどれか．","options":[{"letter":"A","text":"被殻の限局した高吸収域"},{"letter":"B","text":"側頭葉内側の左右対称な萎縮"},{"letter":"C","text":"縫合線を越えない凸レンズ型の像"},{"letter":"D","text":"脳底槽のヒトデ型高吸収域"},{"letter":"E","text":"縫合線を越える三日月型の像"}],"answer":["E"],"multi":false,"explanation":"解説：硬膜下腔は縫合線で仕切られていないため，血腫は大脳半球の表面に沿って広く三日月型に広がる．時間が経つと内容は等吸収から低吸収に変化し，被膜を形成する．\n- A：被殻の高吸収域は高血圧性脳出血．\n- B：側頭葉内側の萎縮はAlzheimer型認知症．\n- C：凸レンズ型は硬膜外血腫．\n- D：脳底槽のヒトデ型高吸収域はくも膜下出血．\n- E：硬膜下腔の広がり方を反映し正しい．","images":[],"stem_images":[]},{"number":48,"section":"D-2-S12　79歳男性・1か月で進んだ物忘れ","question":"（4/4）79歳の男性．1か月前から物忘れが目立ち，歩行がふらつくようになったと家族が話す．会話中に眠り込むこともあるという．2か月前に風呂場で転倒し後頭部を打ったという．右上下肢に軽い不全麻痺を認める．頭部単純CTで左大脳半球表面に三日月型の低吸収域を認め，穿頭ドレナージ術を行った．症状は速やかに改善したが，注意の持続と段取りの障害が残った．この後遺症はどれか．","options":[{"letter":"A","text":"髄膜刺激徴候の遷延"},{"letter":"B","text":"末梢神経の再生不全"},{"letter":"C","text":"高次脳機能の障害"},{"letter":"D","text":"脊髄の伝導障害"},{"letter":"E","text":"神経筋接合部の伝達障害"}],"answer":["C"],"multi":false,"explanation":"解説：注意障害・記憶障害・遂行機能障害・社会的行動障害は外見からは分かりにくく，復職や生活で初めて問題になる．神経心理学的検査で定量し，環境調整と代償手段の訓練で支援する．\n- A：髄膜刺激徴候は髄膜の炎症や出血によるもので，圧迫解除後の高次機能の問題を説明しない．\n- B：末梢神経の再生不全は末梢神経損傷の後遺．\n- C：外傷性脳損傷後の代表的な後遺症で正しい．高次脳機能の障害がこれにあたる．\n- D：脊髄の伝導障害では対麻痺や感覚障害をきたす．\n- E：神経筋接合部の障害は重症筋無力症．","images":[],"stem_images":[]},{"number":49,"section":"D-2-S13　32歳男性・両下肢から広がる脱力","question":"（1/4）32歳の男性．4日前から両下肢に力が入らず，本日は階段を昇れなくなったという．しびれを伴い，症状は足から上へ広がっている．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から花粉で鼻水が出ますか．"},{"letter":"B","text":"尿が出にくくなりましたか．"},{"letter":"C","text":"数週間以内に下痢をしましたか．"},{"letter":"D","text":"息苦しさはありますか．"},{"letter":"E","text":"飲み込みにくさはありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．季節性鼻炎の既往は急な上行性脱力の評価では優先度が低い．\n- A：季節性鼻炎の既往は急な上行性脱力の評価では優先度が低い．この設問で選ぶ肢．\n- B：自律神経障害や脊髄病変を検討．\n- C：先行感染を確認．\n- D：呼吸筋障害の進行を確認．\n- E：球麻痺の合併を確認．","images":[],"stem_images":[]},{"number":50,"section":"D-2-S13　32歳男性・両下肢から広がる脱力","question":"（2/4）32歳の男性．4日前から両下肢に力が入らず，本日は階段を昇れなくなったという．しびれを伴い，症状は足から上へ広がっている．2週間前に発熱を伴う下痢があったという．認められる所見はどれか．","options":[{"letter":"A","text":"Babinski徴候の陽性"},{"letter":"B","text":"歯車様の筋強剛"},{"letter":"C","text":"一側のみの痙性片麻痺"},{"letter":"D","text":"具体的な人物の幻視"},{"letter":"E","text":"腱反射の左右対称な消失"}],"answer":["E"],"multi":false,"explanation":"解説：末梢神経の髄鞘が免疫学的に障害されるため，反射弓が絶たれて腱反射が早期から左右対称に消失する．麻痺は弛緩性で，錐体路徴候は陰性であることが上位運動ニューロン障害との違いになる．\n- A：Babinski徴候は錐体路障害を示し，末梢神経障害では陰性．\n- B：歯車様筋強剛はParkinson病．\n- C：一側性の痙性片麻痺は脳血管障害．\n- D：具体的な幻視はLewy小体型認知症．\n- E：末梢神経の脱髄を反映し正しい．","images":[],"stem_images":[]},{"number":51,"section":"D-2-S13　32歳男性・両下肢から広がる脱力","question":"（3/4）32歳の男性．4日前から両下肢に力が入らず，本日は階段を昇れなくなったという．しびれを伴い，症状は足から上へ広がっている．2週間前に発熱を伴う下痢があったという．四肢の腱反射は左右対称に消失し，Babinski徴候は陰性である．髄液検査で予想される所見はどれか．","options":[{"letter":"A","text":"多核球が優位を占める細胞増多"},{"letter":"B","text":"細胞数は正常で蛋白のみ高値"},{"letter":"C","text":"糖の著明な低下"},{"letter":"D","text":"キサントクロミー"},{"letter":"E","text":"墨汁染色での莢膜酵母"}],"answer":["B"],"multi":false,"explanation":"解説：神経根の炎症により蛋白が髄液中に漏れる一方，細胞数はほとんど増えない．この蛋白細胞解離は発症から1週ほどで明らかになるため，早期に陰性でも否定はできない．\n- A：多核球優位の細胞増多は細菌性髄膜炎．\n- B：この疾患に特徴的な所見で正しい．\n- C：糖の著明な低下は細菌性・結核性・真菌性の髄膜炎．\n- D：キサントクロミーはくも膜下出血の亜急性期．\n- E：墨汁染色での莢膜酵母はクリプトコックス髄膜炎．","images":[],"stem_images":[]},{"number":52,"section":"D-2-S13　32歳男性・両下肢から広がる脱力","question":"（4/4）32歳の男性．4日前から両下肢に力が入らず，本日は階段を昇れなくなったという．しびれを伴い，症状は足から上へ広がっている．2週間前に発熱を伴う下痢があったという．四肢の腱反射は左右対称に消失し，Babinski徴候は陰性である．髄液は細胞数3/μL，蛋白98mg/dLであった．入院後に最も注意して監視すべきなのはどれか．","options":[{"letter":"A","text":"眼圧の日内変動"},{"letter":"B","text":"空腹時血糖の推移"},{"letter":"C","text":"血清カルシウムの値"},{"letter":"D","text":"努力性肺活量と嚥下"},{"letter":"E","text":"骨密度と骨代謝マーカー"}],"answer":["D"],"multi":false,"explanation":"解説：麻痺が上行して呼吸筋と球麻痺に及ぶと，短時間で人工呼吸管理が必要になる．努力性肺活量を繰り返し測り，低下傾向と嚥下障害の出現を早期に捉えることが生命予後を左右する．\n- A：眼圧の日内変動は緑内障の管理．\n- B：血糖の推移は糖尿病の管理で，本例の急変とは直結しない．\n- C：血清カルシウムは副甲状腺疾患の管理．\n- D：生命に直結する変化を捉えるもので正しい．\n- E：骨密度と骨代謝マーカーは骨粗鬆症の評価．","images":[],"stem_images":[]},{"number":53,"section":"D-2-S14　62歳男性・足底のしびれ","question":"（1/4）62歳の男性．1年前から両足の裏がしびれ，砂利の上を歩いているような感じがするという．左右差はない．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"子どもの頃に鼻血が出ましたか．"},{"letter":"B","text":"血糖が高いと言われましたか．"},{"letter":"C","text":"お酒を毎日多く飲みますか．"},{"letter":"D","text":"抗癌薬で治療されましたか．"},{"letter":"E","text":"胃の手術を受けましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．小児期の鼻出血は現在の対称性しびれの原因検索では優先度が低い．\n- A：小児期の鼻出血は現在の対称性しびれの原因検索では優先度が低い．この設問で選ぶ肢．\n- B：糖尿病性神経障害を検討．\n- C：アルコール関連の神経障害を検討．\n- D：薬剤性末梢神経障害を検討．\n- E：ビタミンB12欠乏を検討．","images":[],"stem_images":[]},{"number":54,"section":"D-2-S14　62歳男性・足底のしびれ","question":"（2/4）62歳の男性．1年前から両足の裏がしびれ，砂利の上を歩いているような感じがするという．左右差はない．10年前から2型糖尿病で通院しているという．認められる所見はどれか．","options":[{"letter":"A","text":"一側上下肢の痙性麻痺"},{"letter":"B","text":"舌の萎縮と線維束攣縮"},{"letter":"C","text":"アキレス腱反射の消失"},{"letter":"D","text":"具体的な人物の幻視"},{"letter":"E","text":"左瞳孔の散大と対光反射消失"}],"answer":["C"],"multi":false,"explanation":"解説：最も長い神経から障害されるため，下肢遠位の反射から失われる．アキレス腱反射の消失と振動覚の低下が早期所見で，膝蓋腱反射は比較的保たれる．\n- A：一側性の痙性麻痺は脳血管障害．\n- B：舌の萎縮と線維束攣縮は筋萎縮性側索硬化症．\n- C：長さ依存性の障害を反映し正しい．\n- D：具体的な幻視はLewy小体型認知症．\n- E：瞳孔散大と対光反射消失は動眼神経の圧迫．","images":[],"stem_images":[]},{"number":55,"section":"D-2-S14　62歳男性・足底のしびれ","question":"（3/4）62歳の男性．1年前から両足の裏がしびれ，砂利の上を歩いているような感じがするという．左右差はない．10年前から2型糖尿病で通院しているという．両側のアキレス腱反射が消失し，足趾の振動覚が低下している．筋力は保たれている．診断の裏づけに有用な検査はどれか．","options":[{"letter":"A","text":"頭部造影MRIの撮影"},{"letter":"B","text":"髄液のオリゴクローナルバンド検索"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"神経伝導速度の測定"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["D"],"multi":false,"explanation":"解説：感覚神経活動電位の振幅低下と伝導速度の遅延を定量し，長さ依存性の分布を確かめる．同時にビタミンB12・葉酸・甲状腺機能・M蛋白を調べ，糖尿病以外の原因を除外する．\n- A：頭部造影MRIは中枢神経病変の評価．\n- B：オリゴクローナルバンドは多発性硬化症．\n- C：骨シンチグラフィは骨病変の検索．\n- D：末梢神経障害の分布と性状を定量でき正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":56,"section":"D-2-S14　62歳男性・足底のしびれ","question":"（4/4）62歳の男性．1年前から両足の裏がしびれ，砂利の上を歩いているような感じがするという．左右差はない．10年前から2型糖尿病で通院しているという．両側のアキレス腱反射が消失し，足趾の振動覚が低下している．筋力は保たれている．神経伝導速度で下肢優位の伝導遅延を認めた．この患者への指導で最も重要なのはどれか．","options":[{"letter":"A","text":"蛋白質の摂取を厳しく制限する"},{"letter":"B","text":"直射日光を完全に避けて生活する"},{"letter":"C","text":"水分摂取を1日500mLに制限する"},{"letter":"D","text":"毎日の全力疾走を日課にする"},{"letter":"E","text":"毎日足を観察し傷を早く見つける"}],"answer":["E"],"multi":false,"explanation":"解説：痛覚が鈍ると靴ずれや低温熱傷に気づかず，潰瘍から壊疽・切断に至る．毎日の足の観察，適切な靴の選択，深爪を避けること，熱源に直接触れないことを具体的に指導する．\n- A：蛋白制限は腎不全の食事療法で，神経障害の管理にならない．\n- B：直射日光の回避はポルフィリン症などの指導．\n- C：厳しい水分制限は脱水と高血糖を悪化させる．\n- D：知覚の低下した足への高負荷は潰瘍の原因になる．\n- E：切断という最悪の転帰を防ぎ最も重要．","images":[],"stem_images":[]},{"number":57,"section":"D-2-S15　41歳男性・片側の顔面のゆがみ","question":"（1/4）41歳の男性．今朝起きたら右の口角から水がこぼれ，右目が閉じにくいことに気づいて来院した．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"めまいや難聴はありますか．"},{"letter":"B","text":"歩くと膝が痛みますか．"},{"letter":"C","text":"耳痛や耳鳴りはありますか．"},{"letter":"D","text":"手足の力も入りにくいですか．"},{"letter":"E","text":"味がわかりにくくなりましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性の膝痛は顔面麻痺の局在判断では優先度が低い．\n- A：内耳神経症状の合併を確認．\n- B：慢性の膝痛は顔面麻痺の局在判断では優先度が低い．この設問で選ぶ肢．\n- C：耳の病変を伴う末梢性麻痺を検討．\n- D：中枢性病変の警告症状を確認．\n- E：顔面神経の障害範囲を確認．","images":[],"stem_images":[]},{"number":58,"section":"D-2-S15　41歳男性・片側の顔面のゆがみ","question":"（2/4）41歳の男性．今朝起きたら右の口角から水がこぼれ，右目が閉じにくいことに気づいて来院した．右の耳が強く痛み，音が響いて聞こえるという．認められる所見はどれか．","options":[{"letter":"A","text":"右の額のしわ寄せができない"},{"letter":"B","text":"右上下肢の腱反射が亢進する"},{"letter":"C","text":"右の視野が半分欠けている"},{"letter":"D","text":"舌の右半分が萎縮している"},{"letter":"E","text":"右手の振動覚が低下している"}],"answer":["A"],"multi":false,"explanation":"解説：前頭筋は両側の大脳半球から支配を受けるため，中枢性の麻痺では額のしわ寄せが保たれる．末梢性では顔面神経核より末梢が障害され，同側の顔面全体が麻痺して額のしわが消える．\n- A：末梢性であることを示す所見で正しい．\n- B：腱反射亢進は錐体路障害の所見．\n- C：同名半盲は視放線や後頭葉の病変．\n- D：舌の半側萎縮は舌下神経麻痺．\n- E：振動覚の低下は後索障害や末梢神経障害．","images":[],"stem_images":[]},{"number":59,"section":"D-2-S15　41歳男性・片側の顔面のゆがみ","question":"（3/4）41歳の男性．今朝起きたら右の口角から水がこぼれ，右目が閉じにくいことに気づいて来院した．右の耳が強く痛み，音が響いて聞こえるという．右の額のしわ寄せができず，右の閉眼も不完全である．次に確認すべき所見はどれか．","options":[{"letter":"A","text":"両側の足底反射の性状"},{"letter":"B","text":"腹壁反射の左右差"},{"letter":"C","text":"右の外耳道と耳介の皮膚"},{"letter":"D","text":"両側の膝蓋腱反射"},{"letter":"E","text":"両手の指鼻試験"}],"answer":["C"],"multi":false,"explanation":"解説：外耳道や耳介に小水疱があればRamsay Hunt症候群と診断できる．水疱は麻痺に遅れて出ることや，まったく出ない無疱疹型もあるため，出ていなくても否定はできない．\n- A：足底反射は錐体路障害の評価で，末梢性麻痺の病型は分からない．\n- B：腹壁反射も中枢神経系の評価．\n- C：病型を決める決定的な所見で正しい．\n- D：膝蓋腱反射は下肢の反射弓の評価．\n- E：指鼻試験は小脳失調の評価．","images":[],"stem_images":[]},{"number":60,"section":"D-2-S15　41歳男性・片側の顔面のゆがみ","question":"（4/4）41歳の男性．今朝起きたら右の口角から水がこぼれ，右目が閉じにくいことに気づいて来院した．右の耳が強く痛み，音が響いて聞こえるという．右の額のしわ寄せができず，右の閉眼も不完全である．右の外耳道に小水疱を認め，聴力検査で右の感音難聴を認めた．同時に投与すべき薬剤はどれか．","options":[{"letter":"A","text":"抗菌薬の経口投与"},{"letter":"B","text":"抗てんかん薬の内服"},{"letter":"C","text":"免疫グロブリン大量療法"},{"letter":"D","text":"抗ウイルス薬の全身投与"},{"letter":"E","text":"コリンエステラーゼ阻害薬"}],"answer":["D"],"multi":false,"explanation":"解説：水痘帯状疱疹ウイルスの再活性化が原因なので，副腎皮質ステロイドに加えてアシクロビルなどの抗ウイルス薬を早期から全身投与する．閉眼不全に対する角膜保護も同時に始める．\n- A：抗菌薬は細菌感染の治療で，本例の原因には作用しない．\n- B：抗てんかん薬はけいれん発作の治療．\n- C：免疫グロブリン大量療法はGuillain-Barré症候群など．\n- D：原因ウイルスを直接標的とし正しい．\n- E：コリンエステラーゼ阻害薬は重症筋無力症やAlzheimer型認知症．","images":[],"stem_images":[]},{"number":61,"section":"D-2-S16　64歳男性・声のかすれ","question":"（1/4）64歳の男性．2か月前から声がかすれ，改善しないため来院した．咽頭痛や発熱はない．喫煙は30本/日を40年間続けている．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"夜間に足がつりますか．"},{"letter":"B","text":"首や胸の手術を受けましたか．"},{"letter":"C","text":"痰に血が混じりますか．"},{"letter":"D","text":"飲み込みにくさはありますか．"},{"letter":"E","text":"最近，体重が減りましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．こむら返りは嗄声の原因検索では優先度が低い．\n- A：こむら返りは嗄声の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：神経損傷の背景を確認．\n- C：気道の腫瘍性病変を検討．\n- D：咽喉頭・食道病変を検討．\n- E：悪性疾患を疑う全身症状を確認．","images":[],"stem_images":[]},{"number":62,"section":"D-2-S16　64歳男性・声のかすれ","question":"（2/4）64歳の男性．2か月前から声がかすれ，改善しないため来院した．咽頭痛や発熱はない．喫煙は30本/日を40年間続けている．1か月前から血痰が出ることがあるという．喉頭内視鏡で予想される所見はどれか．","options":[{"letter":"A","text":"声帯の全周性の発赤と腫脹"},{"letter":"B","text":"左声帯が正中位で動かない"},{"letter":"C","text":"喉頭蓋の著明な腫脹と発赤"},{"letter":"D","text":"両側声帯の白色の肥厚"},{"letter":"E","text":"声帯遊離縁の小さな結節"}],"answer":["B"],"multi":false,"explanation":"解説：反回神経が麻痺すると同側の声帯が固定し，発声時に閉鎖できないため気息性の嗄声となる．走行が長い左側が障害されやすく，誤嚥や咳嗽力の低下も生じる．\n- A：全周性の発赤と腫脹は急性喉頭炎．\n- B：神経麻痺による声帯固定で正しい．\n- C：喉頭蓋の腫脹と発赤は急性喉頭蓋炎で，気道閉塞の危険がある．\n- D：両側声帯の白色肥厚は白板症や喉頭角化症．\n- E：声帯遊離縁の結節は声帯結節や声帯ポリープ．","images":[],"stem_images":[]},{"number":63,"section":"D-2-S16　64歳男性・声のかすれ","question":"（3/4）64歳の男性．2か月前から声がかすれ，改善しないため来院した．咽頭痛や発熱はない．喫煙は30本/日を40年間続けている．1か月前から血痰が出ることがあるという．喉頭内視鏡で左声帯の固定を認めた．次に行うべき検査はどれか．","options":[{"letter":"A","text":"頭部造影MRIの撮影"},{"letter":"B","text":"上部消化管内視鏡の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"腰椎穿刺による髄液検査"},{"letter":"E","text":"胸部造影CTの撮影"}],"answer":["E"],"multi":false,"explanation":"解説：左反回神経は大動脈弓を後方から回るため，肺門・縦隔の病変で障害される．胸部造影CTで肺門部腫瘤，縦隔リンパ節腫大，大動脈瘤の有無を確かめるのが次の一手になる．\n- A：頭部MRIは中枢性病変を疑う場合で，本例の走行上の病変は写らない．\n- B：内視鏡は消化管疾患の評価．\n- C：骨シンチグラフィは骨転移の検索で，原発巣の同定にならない．\n- D：腰椎穿刺は髄膜炎やくも膜下出血を疑うときの検査．\n- E：反回神経の走行に沿った病変を捉え正しい．","images":[],"stem_images":[]},{"number":64,"section":"D-2-S16　64歳男性・声のかすれ","question":"（4/4）64歳の男性．2か月前から声がかすれ，改善しないため来院した．咽頭痛や発熱はない．喫煙は30本/日を40年間続けている．1か月前から血痰が出ることがあるという．喉頭内視鏡で左声帯の固定を認めた．胸部造影CTで左肺門部に4cm大の腫瘤と縦隔リンパ節腫大を認めた．右側ではなく左に起こりやすい理由はどれか．","options":[{"letter":"A","text":"左肺のほうが容積が大きいため"},{"letter":"B","text":"左反回神経は大動脈弓を回り走行が長い"},{"letter":"C","text":"左の胸膜が厚く癒着しやすいため"},{"letter":"D","text":"左横隔膜の位置が右より高いため"},{"letter":"E","text":"左の気管支が右より太く短いため"}],"answer":["B"],"multi":false,"explanation":"解説：右反回神経は鎖骨下動脈を回って比較的短く上行するのに対し，左は大動脈弓を回り込むため縦隔内の走行が長い．この解剖学的な差が左側に麻痺が多い理由である．\n- A：肺容積はむしろ心臓の分だけ左が小さい．\n- B：解剖学的な走行の差を正しく述べている．\n- C：胸膜の厚さに左右差はなく，神経麻痺とも関係しない．\n- D：横隔膜は肝臓のある右のほうが高い．\n- E：右主気管支のほうが太く短く，誤嚥物が入りやすい．","images":[],"stem_images":[]},{"number":65,"section":"D-2-S17　63歳女性・発作性の顔面の痛み","question":"（1/4）63歳の女性．3か月前から右の頬に激しい痛みが走るという．痛みは数秒でおさまるが，1日に何度も繰り返す．短時間の顔面痛を誘発する刺激を確認する質問はどれか．","options":[{"letter":"A","text":"一回の痛みは何秒続きますか．"},{"letter":"B","text":"痛みは頬のどこに走りますか．"},{"letter":"C","text":"洗顔や歯磨きで痛みが出ますか．"},{"letter":"D","text":"発作の間もしびれますか．"},{"letter":"E","text":"耳鳴りを伴いますか．"}],"answer":["C"],"multi":false,"explanation":"解説：洗顔・歯磨き・咀嚼・冷風といった軽い刺激が引き金となり，電撃痛が走るのがこの疾患の特徴である．引き金帯の存在は，持続性の歯痛や副鼻腔炎による顔面痛との決定的な違いになる．\n- A：持続時間に関する情報．\n- B：分布に関する情報．\n- C：引き金の有無を確かめるもので有用．\n- D：持続性の感覚障害に関する情報．\n- E：耳症状に関する情報．","images":[],"stem_images":[]},{"number":66,"section":"D-2-S17　63歳女性・発作性の顔面の痛み","question":"（2/4）63歳の女性．3か月前から右の頬に激しい痛みが走るという．痛みは数秒でおさまるが，1日に何度も繰り返す．洗顔や歯磨きのたびに痛みが誘発されるという．認められる所見はどれか．","options":[{"letter":"A","text":"右の角膜反射が消失している"},{"letter":"B","text":"右の額のしわ寄せができない"},{"letter":"C","text":"右の頬に明らかな感覚脱失がある"},{"letter":"D","text":"右の咬筋に萎縮を認める"},{"letter":"E","text":"神経学的な脱落所見を認めない"}],"answer":["E"],"multi":false,"explanation":"解説：典型的な症例では発作間欠期に神経学的異常をまったく認めない．感覚脱失・角膜反射消失・咀嚼筋の萎縮といった脱落所見があれば，腫瘍や多発性硬化症による二次性を疑って精査する．\n- A：角膜反射の消失は三叉神経第1枝の器質的障害を示す．\n- B：額のしわ寄せができないのは末梢性顔面神経麻痺．\n- C：明らかな感覚脱失は二次性を示唆する所見．\n- D：咬筋の萎縮も三叉神経運動枝の器質的障害．\n- E：典型例の特徴として正しい．","images":[],"stem_images":[]},{"number":67,"section":"D-2-S17　63歳女性・発作性の顔面の痛み","question":"（3/4）63歳の女性．3か月前から右の頬に激しい痛みが走るという．痛みは数秒でおさまるが，1日に何度も繰り返す．洗顔や歯磨きのたびに痛みが誘発されるという．発作の合間はまったく無症状で，神経学的な脱落所見も認めない．二次性を除外するために行うべき検査はどれか．","options":[{"letter":"A","text":"頸動脈の超音波検査"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"上部消化管内視鏡の施行"},{"letter":"D","text":"頭部MRIの撮影"},{"letter":"E","text":"呼吸機能検査の施行"}],"answer":["D"],"multi":false,"explanation":"解説：三叉神経根の血管による圧迫を描出し，同時に小脳橋角部の腫瘍や多発性硬化症の脱髄斑を除外する．圧迫血管が同定できれば，薬物抵抗例に対する神経血管減圧術の適応判断にも使える．\n- A：頸動脈超音波は動脈硬化の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：内視鏡は消化管疾患の評価．\n- D：原因と二次性の除外を同時に行え正しい．\n- E：呼吸機能検査は換気障害の評価．","images":[],"stem_images":[]},{"number":68,"section":"D-2-S17　63歳女性・発作性の顔面の痛み","question":"（4/4）63歳の女性．3か月前から右の頬に激しい痛みが走るという．痛みは数秒でおさまるが，1日に何度も繰り返す．洗顔や歯磨きのたびに痛みが誘発されるという．発作の合間はまったく無症状で，神経学的な脱落所見も認めない．頭部MRIで右三叉神経根に接する血管を認めたが，腫瘍や脱髄斑はなかった．第一選択の薬剤はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの内服"},{"letter":"B","text":"カルバマゼピンの内服"},{"letter":"C","text":"コリンエステラーゼ阻害薬"},{"letter":"D","text":"免疫グロブリン大量療法"},{"letter":"E","text":"抗ウイルス薬の全身投与"}],"answer":["B"],"multi":false,"explanation":"解説：ナトリウムチャネルを抑えて異常な発火を鎮め，多くの症例で著効する．効果があること自体が診断を支持する．重篤な皮膚障害と汎血球減少に注意し，無効例には神経血管減圧術を検討する．\n- A：ステロイドは炎症性・自己免疫性疾患の治療で，本症には無効．\n- B：発作性の神経痛に対する標準治療で正しい．\n- C：コリンエステラーゼ阻害薬は重症筋無力症やAlzheimer型認知症．\n- D：免疫グロブリン大量療法はGuillain-Barré症候群など．\n- E：抗ウイルス薬は帯状疱疹やRamsay Hunt症候群に用いる．","images":[],"stem_images":[]},{"number":69,"section":"D-2-S18　36歳女性・夕方のまぶたの重さ","question":"（1/4）36歳の女性．2か月前から夕方になるとまぶたが重くなり，物が二重に見えるという．朝は比較的楽だと話す．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"使い続けると力が落ちますか．"},{"letter":"B","text":"息苦しさはありますか．"},{"letter":"C","text":"飲み込みにくさはありますか．"},{"letter":"D","text":"手の関節は朝に腫れますか．"},{"letter":"E","text":"休むと症状が軽くなりますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．関節炎の問診はこの眼症状と筋力変動の初期評価では優先度が低い．\n- A：易疲労性を確認．\n- B：呼吸筋障害を確認．\n- C：球症状を確認．\n- D：関節炎の問診はこの眼症状と筋力変動の初期評価では優先度が低い．この設問で選ぶ肢．\n- E：休息による回復を確認．","images":[],"stem_images":[]},{"number":70,"section":"D-2-S18　36歳女性・夕方のまぶたの重さ","question":"（2/4）36歳の女性．2か月前から夕方になるとまぶたが重くなり，物が二重に見えるという．朝は比較的楽だと話す．階段を昇り続けると足が上がらなくなり，休むと回復するという．診察で行うべき手技はどれか．","options":[{"letter":"A","text":"足底を擦って母趾の動きをみる"},{"letter":"B","text":"頸部を前屈させて抵抗をみる"},{"letter":"C","text":"上方を注視させ続けて眼瞼をみる"},{"letter":"D","text":"手関節を他動的に屈伸させる"},{"letter":"E","text":"足関節を背屈させて腓腹部をみる"}],"answer":["C"],"multi":false,"explanation":"解説：上方注視を1分ほど続けさせると眼瞼下垂が進行する（疲労試験）．冷却により症状が改善するアイステストや，塩酸エドロホニウムによる改善も同じ易疲労性を利用した診察法である．\n- A：足底を擦るのはBabinski徴候の診察で，錐体路障害の評価．\n- B：頸部前屈は髄膜刺激徴候の診察．\n- C：易疲労性を可視化する手技で正しい．\n- D：他動的な屈伸は筋強剛（歯車現象）の診察．\n- E：足関節背屈はHomans徴候の診察で，深部静脈血栓症の評価．","images":[],"stem_images":[]},{"number":71,"section":"D-2-S18　36歳女性・夕方のまぶたの重さ","question":"（3/4）36歳の女性．2か月前から夕方になるとまぶたが重くなり，物が二重に見えるという．朝は比較的楽だと話す．階段を昇り続けると足が上がらなくなり，休むと回復するという．上方注視を続けさせると眼瞼下垂が進行した．診断に有用な検査はどれか．","options":[{"letter":"A","text":"髄液のオリゴクローナルバンド検索"},{"letter":"B","text":"頸動脈の超音波検査"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"抗アセチルコリン受容体抗体"}],"answer":["E"],"multi":false,"explanation":"解説：神経筋接合部の後シナプス膜にある受容体に対する自己抗体が病因で，全身型の8〜9割で陽性となる．陰性例では抗MuSK抗体を測り，反復刺激試験の漸減現象も併せて確認する．\n- A：オリゴクローナルバンドは多発性硬化症．\n- B：頸動脈超音波は動脈硬化の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：内視鏡は消化管疾患の評価．\n- E：病因を直接示し正しい．","images":[],"stem_images":[]},{"number":72,"section":"D-2-S18　36歳女性・夕方のまぶたの重さ","question":"（4/4）36歳の女性．2か月前から夕方になるとまぶたが重くなり，物が二重に見えるという．朝は比較的楽だと話す．階段を昇り続けると足が上がらなくなり，休むと回復するという．上方注視を続けさせると眼瞼下垂が進行した．抗アセチルコリン受容体抗体が陽性であった．併せて検索すべき病変はどれか．","options":[{"letter":"A","text":"副腎皮質の腺腫の有無"},{"letter":"B","text":"下垂体の腫瘍の有無"},{"letter":"C","text":"胸腺の腫大や腫瘍の有無"},{"letter":"D","text":"甲状腺の結節の有無"},{"letter":"E","text":"膵臓の内分泌腫瘍の有無"}],"answer":["C"],"multi":false,"explanation":"解説：約15%に胸腺腫が合併し，非合併例でも胸腺過形成が多い．胸部CTで評価し，胸腺腫があれば摘除する．若年発症の全身型では胸腺腫がなくても胸腺摘除が症状改善につながることがある．\n- A：副腎皮質腺腫はCushing症候群や原発性アルドステロン症．\n- B：下垂体腫瘍は先端巨大症やCushing病．\n- C：この疾患に特異的な合併病変で正しい．\n- D：甲状腺機能異常の合併はありうるが，画像で結節を探す優先度は低い．\n- E：膵内分泌腫瘍は多発性内分泌腫瘍症で問題になる．","images":[],"stem_images":[]},{"number":73,"section":"D-2-S19　24歳男性・意識消失とけいれん","question":"（1/4）24歳の男性．職場で突然倒れ全身がけいれんしたため搬送された．来院時には意識が回復しているが，ぼんやりしている．発作の重症度を評価するため，目撃者に確認する質問はどれか．","options":[{"letter":"A","text":"直前に睡眠不足がありましたか．"},{"letter":"B","text":"発作の前に動悸がありましたか．"},{"letter":"C","text":"過去にも同じ発作がありましたか．"},{"letter":"D","text":"家族に同じ病気の人はいますか．"},{"letter":"E","text":"けいれんはどれくらい続きましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：本人は発作中を記憶していないので，この質問には付き添いの目撃者が答えることになる．持続時間・四肢の動き方・眼球の向き・顔色・失禁の有無・回復までの時間が，てんかん発作と失神を分ける決め手になる．\n- A：誘因に関する情報．\n- B：失神との鑑別に関する情報．\n- C：再発歴に関する情報．\n- D：家族歴に関する情報．\n- E：目撃者から得られる診断の一次資料そのもので有用．","images":[],"stem_images":[]},{"number":74,"section":"D-2-S19　24歳男性・意識消失とけいれん","question":"（2/4）24歳の男性．職場で突然倒れ全身がけいれんしたため搬送された．来院時には意識が回復しているが，ぼんやりしている．目撃者によると，全身が硬直した後にガクガクと震え，2分ほど続いたという．認められる所見はどれか．","options":[{"letter":"A","text":"両側の膝蓋腱反射が消失している"},{"letter":"B","text":"両手に規則正しい安静時振戦がある"},{"letter":"C","text":"頸部前屈で強い抵抗を認める"},{"letter":"D","text":"舌の側縁に咬傷を認める"},{"letter":"E","text":"両側の足背動脈が触知できない"}],"answer":["D"],"multi":false,"explanation":"解説：強直相で下顎が強く閉じるため，舌の側縁が歯で挟まれて咬傷ができる．尿失禁，発作後のもうろう状態や筋肉痛と併せ，失神との鑑別を支える身体所見になる．\n- A：腱反射の消失は末梢神経障害．\n- B：安静時振戦はParkinson病．\n- C：頸部前屈での抵抗は髄膜刺激徴候．\n- D：強直間代発作を裏づける所見で正しい．\n- E：足背動脈の触知不能は閉塞性動脈硬化症．","images":[],"stem_images":[]},{"number":75,"section":"D-2-S19　24歳男性・意識消失とけいれん","question":"（3/4）24歳の男性．職場で突然倒れ全身がけいれんしたため搬送された．来院時には意識が回復しているが，ぼんやりしている．目撃者によると，全身が硬直した後にガクガクと震え，2分ほど続いたという．舌の側縁に咬傷を認め，尿失禁があった．次に行うべき検査の組合せはどれか．","options":[{"letter":"A","text":"呼吸機能検査と胸部CT"},{"letter":"B","text":"骨シンチグラフィと骨密度"},{"letter":"C","text":"脳波検査と頭部MRI"},{"letter":"D","text":"上部消化管内視鏡と腹部CT"},{"letter":"E","text":"下肢静脈超音波とDダイマー"}],"answer":["C"],"multi":false,"explanation":"解説：脳波で棘波や鋭波といった突発性異常波を捉え，頭部MRIで海馬硬化・皮質形成異常・腫瘍・血管奇形といった器質的病変を探す．同時に血糖・電解質など誘発因子も確認する．\n- A：呼吸機能検査と胸部CTは呼吸器疾患の評価．\n- B：骨シンチグラフィと骨密度は骨病変の評価．\n- C：発作の起源と原因を同時に調べられ正しい．\n- D：内視鏡と腹部CTは消化器疾患の評価．\n- E：下肢静脈超音波とDダイマーは静脈血栓症の評価．","images":[],"stem_images":[]},{"number":76,"section":"D-2-S19　24歳男性・意識消失とけいれん","question":"（4/4）24歳の男性．職場で突然倒れ全身がけいれんしたため搬送された．来院時には意識が回復しているが，ぼんやりしている．目撃者によると，全身が硬直した後にガクガクと震え，2分ほど続いたという．舌の側縁に咬傷を認め，尿失禁があった．脳波で左側頭部に棘波を認め，頭部MRIで左海馬の萎縮と信号異常を認めた．この患者への生活指導として適切なのはどれか．","options":[{"letter":"A","text":"水分摂取を1日500mLに制限する"},{"letter":"B","text":"直射日光を完全に避けて生活する"},{"letter":"C","text":"蛋白質の摂取を厳しく制限する"},{"letter":"D","text":"発作が抑制されるまで運転を控える"},{"letter":"E","text":"毎日の全力疾走を日課にする"}],"answer":["D"],"multi":false,"explanation":"解説：意識障害を伴う発作がある間の運転は法令上も禁じられ，一定期間発作が抑制されて初めて可能になる．入浴・水泳・高所作業の注意，服薬の継続，睡眠不足と飲酒の回避も併せて指導する．\n- A：厳しい水分制限は脱水を招き，発作閾値を下げうる．\n- B：直射日光の回避はポルフィリン症などの指導．\n- C：蛋白制限は腎不全の食事療法．\n- D：本人と第三者の安全に直結し正しい．\n- E：過度の運動と睡眠不足はむしろ発作の誘因になる．","images":[],"stem_images":[]},{"number":77,"section":"D-2-S20　28歳女性・繰り返す頭痛","question":"（1/4）28歳の女性．学生時代から月に2〜3回，強い頭痛を繰り返すという．鎮痛薬でしのいできたが，最近は仕事を休むこともあり来院した．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"頭痛薬を月に何日使いますか．"},{"letter":"B","text":"動くと頭痛が悪化しますか．"},{"letter":"C","text":"以前から足の爪が厚いですか．"},{"letter":"D","text":"痛みが突然最強になりますか．"},{"letter":"E","text":"頭痛のとき吐き気がありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．慢性の爪病変は反復性頭痛の評価では優先度が低い．\n- A：薬剤の使用過多を確認．\n- B：片頭痛の性状を確認．\n- C：慢性の爪病変は反復性頭痛の評価では優先度が低い．この設問で選ぶ肢．\n- D：二次性頭痛の警告徴候を確認．\n- E：随伴症状から頭痛の型を絞る．","images":[],"stem_images":[]},{"number":78,"section":"D-2-S20　28歳女性・繰り返す頭痛","question":"（2/4）28歳の女性．学生時代から月に2〜3回，強い頭痛を繰り返すという．鎮痛薬でしのいできたが，最近は仕事を休むこともあり来院した．頭痛の最中は階段を上るだけで響き，暗い部屋で横になりたくなるという．随伴する可能性が高いのはどれか．","options":[{"letter":"A","text":"片側の眼瞼下垂と縮瞳"},{"letter":"B","text":"頸部を前屈すると強く抵抗する"},{"letter":"C","text":"発作中に片側の顔面が麻痺する"},{"letter":"D","text":"両側の下肢の腱反射が消失する"},{"letter":"E","text":"光や音を不快に感じる"}],"answer":["E"],"multi":false,"explanation":"解説：光過敏・音過敏・悪心・嘔吐を伴い，発作は4〜72時間続く．片側性で拍動性の中等度以上の痛みという性状と合わせ，これらの随伴症状が診断基準の柱になる．\n- A：眼瞼下垂と縮瞳はHorner症候群で，群発頭痛に伴うことがある．\n- B：頸部前屈での抵抗は髄膜刺激徴候で，くも膜下出血や髄膜炎．\n- C：顔面麻痺は末梢性顔面神経麻痺や脳血管障害．\n- D：腱反射の消失は末梢神経障害．\n- E：診断基準に含まれる随伴症状で正しい．","images":[],"stem_images":[]},{"number":79,"section":"D-2-S20　28歳女性・繰り返す頭痛","question":"（3/4）28歳の女性．学生時代から月に2〜3回，強い頭痛を繰り返すという．鎮痛薬でしのいできたが，最近は仕事を休むこともあり来院した．頭痛の最中は階段を上るだけで響き，暗い部屋で横になりたくなるという．発作中は光や音が不快で，悪心を伴う．発作の20分前からギザギザした光が視野に広がるという．この先行症状はどれか．","options":[{"letter":"A","text":"緑内障発作による霧視"},{"letter":"B","text":"網膜動脈の一過性閉塞"},{"letter":"C","text":"硝子体の混濁による飛蚊症"},{"letter":"D","text":"閃輝暗点とよばれる前兆"},{"letter":"E","text":"眼精疲労による一時的な霧視"}],"answer":["D"],"multi":false,"explanation":"解説：後頭葉皮質を広がる抑制の波が視覚症状を生む．ギザギザした光の線が視野の中心から周辺へ数十分かけて広がり，その後に頭痛が始まる．前兆のある片頭痛は虚血性脳卒中の危険をやや高める．\n- A：緑内障発作では眼痛・充血・眼圧上昇を伴う．\n- B：網膜動脈の一過性閉塞は一過性黒内障で，片眼が暗くなり数分で回復する．\n- C：飛蚊症は硝子体の混濁による浮遊物の自覚で，頭痛に先行しない．\n- D：片頭痛の前兆として正しい．\n- E：眼精疲労による霧視は数十分で広がる陽性徴候にならない．","images":[],"stem_images":[]},{"number":80,"section":"D-2-S20　28歳女性・繰り返す頭痛","question":"（4/4）28歳の女性．学生時代から月に2〜3回，強い頭痛を繰り返すという．鎮痛薬でしのいできたが，最近は仕事を休むこともあり来院した．頭痛の最中は階段を上るだけで響き，暗い部屋で横になりたくなるという．発作中は光や音が不快で，悪心を伴う．発作の20分前からギザギザした光が視野に広がるという．神経学的所見と頭部MRIに異常はない．発作時に用いる薬剤はどれか．","options":[{"letter":"A","text":"カルバマゼピンの内服"},{"letter":"B","text":"副腎皮質ステロイドの点滴"},{"letter":"C","text":"コリンエステラーゼ阻害薬"},{"letter":"D","text":"抗ウイルス薬の全身投与"},{"letter":"E","text":"トリプタン製剤の内服"}],"answer":["E"],"multi":false,"explanation":"解説：セロトニン受容体に作用して拡張した頭蓋内血管を収縮させ，神経原性炎症を抑える．発作初期に服用するほど効果が高い．月に複数回起こる例では予防薬の併用も検討する．\n- A：カルバマゼピンは三叉神経痛やてんかんの治療．\n- B：ステロイドは炎症性・自己免疫性疾患の治療．\n- C：コリンエステラーゼ阻害薬は重症筋無力症やAlzheimer型認知症．\n- D：抗ウイルス薬は帯状疱疹やヘルペス脳炎の治療．\n- E：片頭痛発作の特異的治療薬で正しい．","images":[],"stem_images":[]}],"seed":null},{"id":"D-3_皮膚系","name":"D-3_皮膚系.md","label":"D-3 皮膚系","count":36,"sourceHash":"0a13285e0e3d","questions":[{"number":1,"section":"D-3-S01　68歳男性・全身の赤みとかゆみ","question":"（1/4）68歳の男性．2か月前から全身が赤くなり，強いかゆみと皮膚のポロポロした剝がれが続くという．体重は3kg減った．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"以前から乗り物酔いをしますか．"},{"letter":"B","text":"新しく飲み始めた薬はありますか．"},{"letter":"C","text":"熱や寒気を伴いますか．"},{"letter":"D","text":"以前から皮膚病がありますか．"},{"letter":"E","text":"首やわきが腫れていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．乗り物酔いは全身性紅斑の原因検索では優先度が低い．\n- A：乗り物酔いは全身性紅斑の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：薬疹の原因を確認．\n- C：全身への影響を評価．\n- D：湿疹や乾癬の増悪を検討．\n- E：リンパ増殖性疾患を検討．","images":[],"stem_images":[]},{"number":2,"section":"D-3-S01　68歳男性・全身の赤みとかゆみ","question":"（2/4）68歳の男性．2か月前から全身が赤くなり，強いかゆみと皮膚のポロポロした剝がれが続くという．体重は3kg減った．3か月前から痛風に対して新しい薬を飲み始めたという．全身管理で最も注意すべきなのはどれか．","options":[{"letter":"A","text":"眼圧の急激な上昇"},{"letter":"B","text":"骨密度低下"},{"letter":"C","text":"低体温と脱水"},{"letter":"D","text":"血糖の急上昇"},{"letter":"E","text":"尿酸値の急な低下"}],"answer":["C"],"multi":false,"explanation":"解説：体表のほぼ全体が紅斑となると皮膚血流が増えて熱が奪われ，角層のバリアが壊れて水分と蛋白が大量に失われる．低体温・脱水・低アルブミン血症・高拍出性心不全が全身管理の要点になる．\n- A：眼圧の急激な上昇は緑内障発作の問題で，皮膚のバリア破綻とは関係しない．\n- B：骨密度低下はステロイド長期投与の合併症．\n- C：バリア破綻による喪失を反映し正しい．\n- D：血糖の急上昇はステロイド使用時に問題となるが，本例の主な脅威ではない．\n- E：尿酸値が急に下がること自体は生命を脅かさない．","images":[],"stem_images":[]},{"number":3,"section":"D-3-S01　68歳男性・全身の赤みとかゆみ","question":"（3/4）68歳の男性．2か月前から全身が赤くなり，強いかゆみと皮膚のポロポロした剝がれが続くという．体重は3kg減った．3か月前から痛風に対して新しい薬を飲み始めたという．体表の約90%に紅斑と落屑を認め，体温は35.4℃である．原因の特定に最も有用な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査"},{"letter":"C","text":"上部消化管内視鏡の施行"},{"letter":"D","text":"頸動脈の超音波検査"},{"letter":"E","text":"皮膚生検と病理診断"}],"answer":["E"],"multi":false,"explanation":"解説：組織像で乾癬様か湿疹様か，異型リンパ球の表皮内浸潤があるかを見る．薬剤性・乾癬・皮膚T細胞リンパ腫の区別は臨床像だけでは難しく，治療方針が大きく変わるため生検が要る．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：内視鏡は消化管疾患の評価．\n- D：頸動脈超音波は動脈硬化の評価．\n- E：皮膚生検と病理診断は原因の鑑別に直結し正しい．","images":[],"stem_images":[]},{"number":4,"section":"D-3-S01　68歳男性・全身の赤みとかゆみ","question":"（4/4）68歳の男性．2か月前から全身が赤くなり，強いかゆみと皮膚のポロポロした剝がれが続くという．体重は3kg減った．3か月前から痛風に対して新しい薬を飲み始めたという．体表の約90%に紅斑と落屑を認め，体温は35.4℃である．皮膚生検で薬剤性の変化と判断された．皮疹を伴わない全身のかゆみだけが続く場合に考えるべきなのはどれか．","options":[{"letter":"A","text":"白癬菌の表皮角層への寄生"},{"letter":"B","text":"内臓疾患に伴うそう痒"},{"letter":"C","text":"ヒゼンダニの寄生"},{"letter":"D","text":"接触抗原による感作"},{"letter":"E","text":"紫外線による光線過敏"}],"answer":["B"],"multi":false,"explanation":"解説：皮疹がないのに全身がかゆいときは，胆汁うっ滞・慢性腎不全・甲状腺機能異常・鉄欠乏・悪性リンパ腫などの全身疾患を探す．高齢者では皮脂欠乏によるものが最多だが，これらの除外が要る．\n- A：白癬菌の角層への寄生は環状の鱗屑性紅斑という皮疹を伴う．\n- B：皮疹を欠くそう痒の鑑別として正しい．\n- C：疥癬は指間の疥癬トンネルと丘疹という皮疹を伴う．\n- D：接触皮膚炎は接触部位に一致した湿疹性の皮疹が出る．\n- E：光線過敏では露光部に限局した皮疹が出る．","images":[],"stem_images":[]},{"number":5,"section":"D-3-S02　45歳男性・足趾の皮むけとかゆみ","question":"（1/4）45歳の男性．半年前から両足の趾の間が白くふやけて皮がむけ，かゆいという．夏になると悪化する．皮疹の見え方や検査結果を変える外用歴を確認する質問はどれか．","options":[{"letter":"A","text":"家族にも同じ皮疹がありますか．"},{"letter":"B","text":"普段どんな靴を履きますか．"},{"letter":"C","text":"糖尿病を指摘されていますか．"},{"letter":"D","text":"市販の塗り薬を使っていますか．"},{"letter":"E","text":"足の爪も変化していますか．"}],"answer":["D"],"multi":false,"explanation":"解説：市販のステロイド外用薬を塗ると真菌が増えて皮疹の形が変わり，直接鏡検でも菌が見つけにくくなる．検査前に外用歴を確認し，必要なら数日中止してから採取する．\n- A：接触状況に関する情報．\n- B：局所の蒸れに関する情報．\n- C：基礎疾患に関する情報．\n- D：診断の精度を直接左右するため有用．\n- E：病変の広がりに関する情報．","images":[],"stem_images":[]},{"number":6,"section":"D-3-S02　45歳男性・足趾の皮むけとかゆみ","question":"（2/4）45歳の男性．半年前から両足の趾の間が白くふやけて皮がむけ，かゆいという．夏になると悪化する．市販の塗り薬は使っていないという．診断のために行うべき検査はどれか．","options":[{"letter":"A","text":"皮疹部のパッチテストの施行"},{"letter":"B","text":"苛性カリによる直接鏡検"},{"letter":"C","text":"血清IgE値の測定"},{"letter":"D","text":"皮内反応試験の施行"},{"letter":"E","text":"皮膚の生検と免疫染色"}],"answer":["B"],"multi":false,"explanation":"解説：鱗屑を採取して苛性カリで角層を溶かし，顕微鏡で菌糸や分節胞子を確認する．数分でできて確実性が高く，これを省いて湿疹と誤りステロイドを塗ると悪化する．\n- A：パッチテストは接触皮膚炎の原因抗原の同定．\n- B：迅速で確実な診断法として正しい．\n- C：血清IgEはアトピー素因の評価．\n- D：皮内反応試験は即時型アレルギーの評価．\n- E：生検は腫瘍性疾患や診断困難例で考慮する．","images":[],"stem_images":[]},{"number":7,"section":"D-3-S02　45歳男性・足趾の皮むけとかゆみ","question":"（3/4）45歳の男性．半年前から両足の趾の間が白くふやけて皮がむけ，かゆいという．夏になると悪化する．市販の塗り薬は使っていないという．苛性カリ直接鏡検で分節した菌糸を認めた．足趾の爪も白く厚く濁り，一部は先端から浮き上がっている．爪の病変に対する治療はどれか．","options":[{"letter":"A","text":"経口抗真菌薬の投与"},{"letter":"B","text":"抗菌薬の外用"},{"letter":"C","text":"副腎皮質ステロイドの外用"},{"letter":"D","text":"抗ヒスタミン薬の内服"},{"letter":"E","text":"尿素軟膏の外用"}],"answer":["A"],"multi":false,"explanation":"解説：爪甲の内部まで外用薬は届きにくいため，テルビナフィンやイトラコナゾールの内服で爪の伸長とともに置き換える．肝機能障害と薬物相互作用に注意し，治療前後で肝機能を確認する．\n- A：爪内部に薬剤を到達させる唯一の方法で正しい．\n- B：抗菌薬は細菌感染の治療で真菌には無効．\n- C：ステロイドは真菌の増殖を助長する．\n- D：抗ヒスタミン薬はかゆみを抑えるが原因を治さない．\n- E：尿素軟膏は角質を柔らかくするが，真菌そのものは除けない．","images":[],"stem_images":[]},{"number":8,"section":"D-3-S02　45歳男性・足趾の皮むけとかゆみ","question":"（4/4）45歳の男性．半年前から両足の趾の間が白くふやけて皮がむけ，かゆいという．夏になると悪化する．市販の塗り薬は使っていないという．苛性カリ直接鏡検で分節した菌糸を認めた．足趾の爪も白く厚く濁り，一部は先端から浮き上がっている．同じ真菌が増えて生じる別の病態はどれか．","options":[{"letter":"A","text":"頬に広がる境界明瞭な紅斑"},{"letter":"B","text":"手掌足底の丘疹性紅斑"},{"letter":"C","text":"帯状に並ぶ集簇性小水疱"},{"letter":"D","text":"中央が臍窩状にくぼむ丘疹"},{"letter":"E","text":"体幹の環状の鱗屑性紅斑"}],"answer":["E"],"multi":false,"explanation":"解説：体部白癬は中心が治癒して辺縁が堤防状に隆起する環状の鱗屑性紅斑をつくる．股部では陰股部白癬となり，頭部では脱毛を伴う．いずれも直接鏡検で菌糸を確認して診断す ges":[],"stem_images":[]},{"number":12,"section":"D-3-S03　27歳男性・手掌足底の皮疹","question":"（4/4）27歳の男性．2週間前から体幹と手のひら・足の裏に赤い発疹が出たという．かゆみはなく，微熱と倦怠感を伴う．2か月前に陰部に痛くないしこりができ，放置したら消えたという．全身のリンパ節が無痛性に腫脹している．梅毒血清反応は2種類とも陽性であった．この時期の皮疹を放置した場合の経過はどれか．","options":[{"letter":"A","text":"皮疹が潰瘍化して瘢痕を残していく"},{"letter":"B","text":"自然に消えて潜伏梅毒になる"},{"letter":"C","text":"全身が紅皮症状態に移行する"},{"letter":"D","text":"数日で水疱化して痂皮になる"},{"letter":"E","text":"環状に拡大し続ける"}],"answer":["B"],"multi":false,"explanation":"解説：第2期の皮疹は治療しなくても数週から数か月で消え，無症候の潜伏梅毒となる．治ったわけではなく，年余を経て心血管梅毒や神経梅毒に進みうるため，この時期の診断と治療が重要になる．\n- A：潰瘍化して瘢痕を残すのは第3期のゴム腫．\n- B：自然消退して潜伏期に入るのが正しい経過．\n- C：紅皮症への移行は薬疹や乾癬，皮膚リンパ腫の経過．\n- D：水疱化して痂皮になるのは水痘や帯状疱疹．\n- E：環状に拡大し続けるのは体部白癬．","images":[],"stem_images":[]},{"number":13,"section":"D-3-S04　62歳男性・片側の痛みと水疱","question":"（1/4）62歳の男性．4日前から右の脇腹がピリピリと痛み，昨日から同じ場所に赤い発疹と小さな水ぶくれが出てきたという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"免疫を抑える薬を使っていますか．"},{"letter":"B","text":"以前から歩くと膝が痛みますか．"},{"letter":"C","text":"痛みと発疹のどちらが先ですか．"},{"letter":"D","text":"ほかの場所にも水疱がありますか．"},{"letter":"E","text":"発疹は片側だけに出ていますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性の膝痛は水疱性皮疹の評価では優先度が低い．\n- A：重症化の背景を確認．\n- B：慢性の膝痛は水疱性皮疹の評価では優先度が低い．この設問で選ぶ肢．\n- C：神経痛が先行したか確認．\n- D：播種性病変の可能性を評価．\n- E：皮疹の分布を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-3-S04　62歳男性・片側の痛みと水疱","question":"（2/4）62歳の男性．4日前から右の脇腹がピリピリと痛み，昨日から同じ場所に赤い発疹と小さな水ぶくれが出てきたという．発疹は右側だけで背中から前胸部へ帯状に並んでいるという．認められる所見はどれか．","options":[{"letter":"A","text":"中央が臍窩状にくぼむ丘疹"},{"letter":"B","text":"指間にできる線状の皮疹"},{"letter":"C","text":"紅斑上に集簇する小水疱"},{"letter":"D","text":"環状に広がる鱗屑性紅斑"},{"letter":"E","text":"頬に広がる境界明瞭な紅斑"}],"answer":["C"],"multi":false,"explanation":"解説：浮腫性の紅斑の上に，米粒ほどの小水疱が集まって並ぶ．新旧の水疱が同じ皮疹群にまとまって出るのが特徴で，やがて膿疱化し痂皮となる．デルマトームに沿って帯状に配列する．\n- A：中央が臍窩状にくぼむ丘疹は伝染性軟属腫．\n- B：指間にできる線状の皮疹は疥癬．\n- C：この疾患の典型的な皮疹で正しい．\n- D：環状に広がる鱗屑性紅斑は体部白癬．\n- E：頬に広がる境界明瞭な紅斑は伝染性紅斑．","images":[],"stem_images":[]},{"number":15,"section":"D-3-S04　62歳男性・片側の痛みと水疱","question":"（3/4）62歳の男性．4日前から右の脇腹がピリピリと痛み，昨日から同じ場所に赤い発疹と小さな水ぶくれが出てきたという．発疹は右側だけで背中から前胸部へ帯状に並んでいるという．右第9〜10胸髄領域に紅斑上の集簇性小水疱を認める．直ちに開始すべき治療はどれか．","options":[{"letter":"A","text":"抗菌薬の内服による治療"},{"letter":"B","text":"副腎皮質ステロイドの外用"},{"letter":"C","text":"抗真菌薬の外用による治療"},{"letter":"D","text":"抗ウイルス薬の全身投与"},{"letter":"E","text":"抗ヒスタミン薬の内服のみ"}],"answer":["D"],"multi":false,"explanation":"解説：発疹出現から72時間以内にアシクロビルなどを開始すると，皮疹の治癒が早まり帯状疱疹後神経痛の頻度も下がる．腎機能に応じた減量が要る．疼痛管理も並行して行う．\n- A：抗菌薬は細菌感染の治療で，ウイルスには無効．\n- B：ステロイド外用は単独では病勢を抑えられない．\n- C：抗真菌薬は真菌症の治療．\n- D：発症早期の投与が予後を変え正しい．\n- E：抗ヒスタミン薬はかゆみ対策で，原因治療にならない．","images":[],"stem_images":[]},{"number":16,"section":"D-3-S04　62歳男性・片側の痛みと水疱","question":"（4/4）62歳の男性．4日前から右の脇腹がピリピリと痛み，昨日から同じ場所に赤い発疹と小さな水ぶくれが出てきたという．発疹は右側だけで背中から前胸部へ帯状に並んでいるという．右第9〜10胸髄領域に紅斑上の集簇性小水疱を認め，皮疹は正中を越えていない．同じウイルスが顔面の特定の枝に再活性化したときに最も警戒すべきなのはどれか．","options":[{"letter":"A","text":"難聴が永続すること"},{"letter":"B","text":"嗅覚が完全に失われること"},{"letter":"C","text":"味覚が左右で異なること"},{"letter":"D","text":"咀嚼の力が弱くなること"},{"letter":"E","text":"角膜潰瘍から視力を失うこと"}],"answer":["E"],"multi":false,"explanation":"解説：三叉神経第1枝領域に出ると角膜炎・虹彩毛様体炎を起こし，放置すれば視力を失う．鼻背や鼻尖に皮疹が出る場合は鼻毛様体神経が侵されており眼合併症の危険が高い．眼科との連携が要る．\n- A：難聴は耳介の皮疹を伴うRamsay Hunt症候群で問題になるが，第1枝領域の合併症ではない．\n- B：嗅覚脱失は嗅神経の障害で，この疾患の典型的合併症ではない．\n- C：味覚障害も顔面神経が侵された場合に起こる．\n- D：咀嚼筋の筋力低下は三叉神経運動枝の障害で，頻度が低い．\n- E：不可逆的な視力障害につながり最も警戒すべきで正しい．","images":[],"stem_images":[]},{"number":17,"section":"D-3-S05　5歳男児・発熱と全身の発疹","question":"（1/4）5歳の男児．4日前から38℃台の発熱，咳，鼻汁，眼の充血が続き，本日いったん下がった熱が再び上がって全身に発疹が出たという．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"同じ症状の人と接しましたか．"},{"letter":"B","text":"水分はとれていますか．"},{"letter":"C","text":"乳歯が何本抜けていますか．"},{"letter":"D","text":"予防接種は受けていますか．"},{"letter":"E","text":"発疹が出る前に薬を飲みましたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．歯の生え替わりは急性発疹性疾患の評価では優先度が低い．\n- A：曝露と流行状況を確認．\n- B：脱水と全身状態を評価．\n- C：歯の生え替わりは急性発疹性疾患の評価では優先度が低い．この設問で選ぶ肢．\n- D：ワクチン歴から感染症を絞る．\n- E：薬疹との鑑別に有用．","images":[],"stem_images":[]},{"number":18,"section":"D-3-S05　5歳男児・発
