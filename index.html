．\n- A：下肢に症状が出る点は両者に共通で鑑別にならない．\n- B：どちらも高齢者に多く区別できない．\n- C：歩行で誘発される点も共通である．\n- D：喫煙は動脈硬化の危険因子だが，脊柱管狭窄症でも喫煙者は多く決め手にならない．\n- E：血管性と神経性を分ける所見で正しい．","images":[],"stem_images":[]},{"number":73,"section":"D-5-S19　58歳女性・長時間移動後の片側下肢腫脹","question":"（1/4）58歳の女性．左下肢の腫れを主訴に来院した．2日前から左のふくらはぎが太くなり，重苦しいという．発赤や外傷はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"最近，手術を受けましたか．"},{"letter":"B","text":"女性ホルモンの薬を使っていますか．"},{"letter":"C","text":"以前から近くの字が見えにくいですか．"},{"letter":"D","text":"息切れや胸痛もありますか．"},{"letter":"E","text":"長時間座ったままでしたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．慢性の近見困難は急な片脚腫脹の評価では優先度が低い．\n- A：静脈血栓症の危険因子を確認．\n- B：血栓リスクのある薬剤を確認．\n- C：慢性の近見困難は急な片脚腫脹の評価では優先度が低い．この設問で選ぶ肢．\n- D：肺塞栓症の合併を評価．\n- E：静脈うっ滞の誘因を確認．","images":[],"stem_images":[]},{"number":74,"section":"D-5-S19　58歳女性・長時間移動後の片側下肢腫脹","question":"（2/4）58歳の女性．左下肢の腫れを主訴に来院した．2日前から左のふくらはぎが太くなり，重苦しいという．発赤や外傷はない．4日前に12時間の長距離バス移動をしたという．認められる所見はどれか．","options":[{"letter":"A","text":"両側の眼瞼浮腫"},{"letter":"B","text":"腹部の拍動性腫瘤"},{"letter":"C","text":"頸静脈の大砲A波"},{"letter":"D","text":"前傾で増強する摩擦音"},{"letter":"E","text":"足背屈での腓腹部痛"}],"answer":["E"],"multi":false,"explanation":"解説：足関節を背屈させると腓腹部に痛みが出るHomans徴候は深部静脈血栓症を示唆する．左右の周径差，腓腹部の把握痛，表在静脈の怒張とあわせて評価するが，いずれも感度・特異度は高くない．\n- A：両側眼瞼浮腫は腎性浮腫で，片側性の下肢腫脹とは分布が異なる．\n- B：拍動性腫瘤は腹部大動脈瘤．\n- C：大砲A波は完全房室ブロック．\n- D：前傾で増強する摩擦音は急性心膜炎．\n- E：深部静脈血栓症を示唆する所見で正しい．","images":[],"stem_images":[]},{"number":75,"section":"D-5-S19　58歳女性・長時間移動後の片側下肢腫脹","question":"（3/4）58歳の女性．左下肢の腫れを主訴に来院した．2日前から左のふくらはぎが太くなり，重苦しいという．発赤や外傷はない．4日前に12時間の長距離バス移動をしたという．左右の下腿周径差は4cmで，左の腓腹部に把握痛とHomans徴候を認める．確定診断に最も有用な検査はどれか．","options":[{"letter":"A","text":"腰椎MRI"},{"letter":"B","text":"骨シンチグラフィ"},{"letter":"C","text":"神経伝導速度"},{"letter":"D","text":"下肢静脈超音波検査"},{"letter":"E","text":"上部消化管内視鏡検査"}],"answer":["D"],"multi":false,"explanation":"解説：静脈の圧迫で内腔が虚脱しないこと，血栓の直接描出，血流信号の欠損により診断する．非侵襲的で繰り返せるため第一選択となる．D-ダイマーは陰性なら除外に使えるが，陽性でも確定にはならない．\n- A：腰椎MRIは神経根や馬尾の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：神経伝導速度は末梢神経障害の評価．\n- D：血栓を直接描出でき確定診断に最も有用で正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":76,"section":"D-5-S19　58歳女性・長時間移動後の片側下肢腫脹","question":"（4/4）58歳の女性．左下肢の腫れを主訴に来院した．2日前から左のふくらはぎが太くなり，重苦しいという．発赤や外傷はない．4日前に12時間の長距離バス移動をしたという．左右の下腿周径差は4cmで，左の腓腹部に把握痛とHomans徴候を認める．下肢静脈超音波検査で左大腿静脈に血栓を認めた．最も警戒すべき合併症はどれか．","options":[{"letter":"A","text":"心タンポナーデ"},{"letter":"B","text":"脳出血"},{"letter":"C","text":"肺血栓塞栓症"},{"letter":"D","text":"消化管穿孔"},{"letter":"E","text":"急性膵炎"}],"answer":["C"],"multi":false,"explanation":"解説：下肢深部静脈の血栓が遊離すると下大静脈から右心を経て肺動脈を閉塞する．突然の呼吸困難・胸痛・頻呼吸・低酸素血症をきたし，広範型ではショックや心停止に至るため抗凝固療法を速やかに開始する．\n- A：心タンポナーデは心嚢液の急速な貯留で生じ，静脈血栓とは機序が異なる．\n- B：脳出血は抗凝固療法の合併症としては重要だが，血栓そのものの自然経過ではない．\n- C：静脈血栓の最も重大な転帰で正しい．\n- D：消化管穿孔は潰瘍や憩室炎の合併症．\n- E：急性膵炎は胆石やアルコールが主因．","images":[],"stem_images":[]},{"number":77,"section":"D-5-S20　45歳男性・健診で持続する血圧高値","question":"（1/4）45歳の男性．健康診断で3年続けて血圧高値を指摘され来院した．自覚症状はない．来院時の血圧は168/104mmHgであった．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"塩分や飲酒量は多いですか．"},{"letter":"B","text":"いびきや日中の眠気はありますか．"},{"letter":"C","text":"家族に高血圧の人はいますか．"},{"letter":"D","text":"子どもの頃に中耳炎がありましたか．"},{"letter":"E","text":"漢方薬や鎮痛薬を飲んでいますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．小児期の中耳炎は現在の高血圧の原因検索では優先度が低い．\n- A：生活習慣による要因を確認．\n- B：睡眠時無呼吸を検討．\n- C：家族性の背景を確認．\n- D：小児期の中耳炎は現在の高血圧の原因検索では優先度が低い．この設問で選ぶ肢．\n- E：薬剤による血圧上昇を検討．","images":[],"stem_images":[]},{"number":78,"section":"D-5-S20　45歳男性・健診で持続する血圧高値","question":"（2/4）45歳の男性．健康診断で3年続けて血圧高値を指摘され来院した．自覚症状はない．来院時の血圧は168/104mmHgであった．父と兄が高血圧で内服治療中という．臓器障害の評価として行うべき検査はどれか．","options":[{"letter":"A","text":"骨密度測定"},{"letter":"B","text":"神経伝導速度"},{"letter":"C","text":"血清アミラーゼ"},{"letter":"D","text":"呼吸機能検査"},{"letter":"E","text":"眼底検査と尿蛋白"}],"answer":["E"],"multi":false,"explanation":"解説：高血圧は無症状のまま細小動脈を障害する．眼底の細動脈狭細化・交叉現象，尿蛋白と推算糸球体濾過量，心電図・心エコーでの左室肥大が，治療強度を決める臓器障害の指標になる．\n- A：骨密度は骨粗鬆症の評価．\n- B：神経伝導速度は末梢神経障害の評価．\n- C：血清アミラーゼは膵疾患の指標．\n- D：呼吸機能検査は換気障害の評価．\n- E：高血圧性臓器障害を直接評価でき正しい．","images":[],"stem_images":[]},{"number":79,"section":"D-5-S20　45歳男性・健診で持続する血圧高値","question":"（3/4）45歳の男性．健康診断で3年続けて血圧高値を指摘され来院した．自覚症状はない．来院時の血圧は168/104mmHgであった．父と兄が高血圧で内服治療中という．眼底に細動脈の狭細化を認め，尿蛋白は陰性であった．3剤の降圧薬を十分量用いても血圧が150/95mmHg未満に下がらない．追加で確認すべきなのはどれか．","options":[{"letter":"A","text":"便潜血"},{"letter":"B","text":"骨シンチグラフィ"},{"letter":"C","text":"血清カリウム値"},{"letter":"D","text":"血清ビリルビン値"},{"letter":"E","text":"呼吸機能検査"}],"answer":["C"],"multi":false,"explanation":"解説：治療抵抗性高血圧では二次性高血圧の検索に進む．低カリウム血症と代謝性アルカローシスは原発性アルドステロン症を示唆し，血漿アルドステロン・レニン活性比の測定へつなぐ．\n- A：便潜血は消化管出血のスクリーニング．\n- B：骨シンチグラフィは骨病変の検索．\n- C：内分泌性二次性高血圧の最初の手がかりで正しい．\n- D：ビリルビンは肝胆道疾患や溶血の指標．\n- E：呼吸機能検査は換気障害の評価だが，睡眠時無呼吸の検索には睡眠ポリグラフィを用いる．","images":[],"stem_images":[]},{"number":80,"section":"D-5-S20　45歳男性・健診で持続する血圧高値","question":"（4/4）45歳の男性．健康診断で3年続けて血圧高値を指摘され来院した．自覚症状はない．来院時の血圧は168/104mmHgであった．父と兄が高血圧で内服治療中という．眼底に細動脈の狭細化を認め，尿蛋白は陰性であった．3剤の降圧薬を十分量用いても血圧が150/95mmHg未満に下がらない．血清カリウムは3.1mEq/Lと低値であった．次に測定すべきなのはどれか．","options":[{"letter":"A","text":"副甲状腺ホルモン"},{"letter":"B","text":"血中カテコラミン分画"},{"letter":"C","text":"血清コルチゾール日内変動"},{"letter":"D","text":"アルドステロン・レニン比"},{"letter":"E","text":"甲状腺刺激ホルモン"}],"answer":["D"],"multi":false,"explanation":"解説：アルドステロンが自律的に過剰分泌されるとナトリウム再吸収とカリウム排泄が進み，レニンは抑制される．アルドステロン・レニン活性比の上昇が原発性アルドステロン症のスクリーニング指標になる．\n- A：副甲状腺ホルモンは高カルシウム血症の鑑別に用いるもので，低カリウム血症は説明できない．\n- B：カテコラミン分画は褐色細胞腫の検査だが，発作性の高血圧・頭痛・動悸・発汗を欠く．\n- C：コルチゾール日内変動はCushing症候群の検査で，中心性肥満や皮膚線条などの身体所見を伴う．\n- D：低カリウム血症を伴う治療抵抗性高血圧の次の一手で正しい．\n- E：甲状腺刺激ホルモンは甲状腺機能の評価で，収縮期高血圧の鑑別にはなるが本例の所見と合わない．","images":[],"stem_images":[]},{"number":81,"section":"D-5-S21　80歳男性・立ち上がったときのふらつき","question":"（1/4）80歳の男性．ふらつきを主訴に来院した．1か月前から症状があり，朝に強いという．転倒には至っていない．ふらつきと体位変換の関係を確認する質問はどれか．","options":[{"letter":"A","text":"一回の症状は何分続きますか．"},{"letter":"B","text":"耳鳴りも伴いますか．"},{"letter":"C","text":"目の前が回って見えますか．"},{"letter":"D","text":"家族に失神する人はいますか．"},{"letter":"E","text":"どんな動作のときに起こりますか．"}],"answer":["E"],"multi":false,"explanation":"解説：症状が起こる動作を特定することが，めまい・ふらつきの鑑別の出発点である．臥位や坐位から立ち上がった直後に限って起こるなら起立性低血圧を，頭位変換で誘発されるなら良性発作性頭位めまい症を考える．\n- A：持続時間に関する情報．\n- B：蝸牛症状に関する情報．\n- C：めまいの性状に関する情報．\n- D：家族歴に関する情報．\n- E：症状の誘発状況が病態を直接示し有用．","images":[],"stem_images":[]},{"number":82,"section":"D-5-S21　80歳男性・立ち上がったときのふらつき","question":"（2/4）80歳の男性．ふらつきを主訴に来院した．1か月前から症状があり，朝に強いという．転倒には至っていない．布団から起き上がって立った直後に眼前が暗くなり，10秒ほどで治まるという．次に確認すべきなのはどれか．","options":[{"letter":"A","text":"家族の身長"},{"letter":"B","text":"服用中の薬剤"},{"letter":"C","text":"最近の渡航歴"},{"letter":"D","text":"予防接種の履歴"},{"letter":"E","text":"学生時代の運動歴"}],"answer":["B"],"multi":false,"explanation":"解説：降圧薬，α遮断薬，利尿薬，硝酸薬，抗Parkinson病薬，三環系抗うつ薬などは起立性低血圧の頻度の高い原因である．高齢者では多剤併用が背景にあることが多く，減量・中止で改善しうる．\n- A：家族の身長は内分泌疾患の問診で本例と無関係．\n- B：是正可能な原因を直接拾えるため正しい．\n- C：渡航歴は感染症の問診．\n- D：予防接種歴は感染症の免疫状態の確認．\n- E：過去の運動歴は本例の症状の説明にならない．","images":[],"stem_images":[]},{"number":83,"section":"D-5-S21　80歳男性・立ち上がったときのふらつき","question":"（3/4）80歳の男性．ふらつきを主訴に来院した．1か月前から症状があり，朝に強いという．転倒には至っていない．布団から起き上がって立った直後に眼前が暗くなり，10秒ほどで治まるという．前立腺肥大症でα遮断薬を，高血圧で利尿薬を内服しているという．診断のために行うべき検査はどれか．","options":[{"letter":"A","text":"脳波検査"},{"letter":"B","text":"呼吸機能検査"},{"letter":"C","text":"骨シンチグラフィ"},{"letter":"D","text":"臥位と立位の血圧測定"},{"letter":"E","text":"上部消化管内視鏡検査"}],"answer":["D"],"multi":false,"explanation":"解説：臥位で安静にした後に起立させ，1分後と3分後の血圧を測る．収縮期血圧が20mmHg以上，または拡張期血圧が10mmHg以上低下すれば起立性低血圧と診断する．必要に応じてヘッドアップチルト試験を行う．\n- A：脳波はてんかんの評価で，起立時のみに起こる本例には合わない．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：診断基準そのものを満たすか調べる検査で正しい．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":84,"section":"D-5-S21　80歳男性・立ち上がったときのふらつき","question":"（4/4）80歳の男性．ふらつきを主訴に来院した．1か月前から症状があり，朝に強いという．転倒には至っていない．布団から起き上がって立った直後に眼前が暗くなり，10秒ほどで治まるという．前立腺肥大症でα遮断薬を，高血圧で利尿薬を内服しているという．臥位血圧は142/82mmHg，起立3分後は108/68mmHgであった．起立時の脈拍は72/分から76/分とほとんど変化しなかった．この所見が示唆するのはどれか．","options":[{"letter":"A","text":"循環血漿量の減少"},{"letter":"B","text":"弁膜の狭窄"},{"letter":"C","text":"冠動脈の攣縮"},{"letter":"D","text":"心房内の血栓"},{"letter":"E","text":"圧受容器反射の障害"}],"answer":["E"],"multi":false,"explanation":"解説：健常なら起立時の血圧低下を圧受容器が感知し，代償性に心拍数が増える．血圧が下がっても脈拍がほとんど増えないのは自律神経障害を示し，Parkinson病・多系統萎縮症・糖尿病性自律神経障害などを考える．\n- A：脱水など循環血漿量減少では代償性頻脈が明瞭に出るため，この所見と合わない．\n- B：弁膜の狭窄は労作時の失神をきたすが，起立直後に限る症状は説明できない．\n- C：冠攣縮は安静時の胸痛とST上昇をきたす．\n- D：心房内血栓は塞栓症の原因で，起立時のふらつきとは無関係．\n- E：代償性頻脈を欠く点から神経原性と判断でき正しい．","images":[],"stem_images":[]}],"seed":{"version":1,"source":"D-5_循環器系.md","sourceHash":"44a0ed5ab8ea","questions":{"1":{"status":"unanswered","marked":false,"attempts":2,"correctAttempts":1,"notes":{"text":"","images":[]},"lastAnswer":["B"],"lastCorrect":true,"lastAnsweredAt":"2026-09-14T01:17:15.477Z"},"2":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"3":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"4":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"5":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"6":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"7":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"8":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"9":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"10":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"11":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"12":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"13":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"14":{"status":"unanswered","marked":false,"attempts":0,"correctAttempts":0,"notes":{"text":"","images":[]}},"15":{"status":"unanswered","marked":false,"atte 4歳の男性．呼吸困難で救急搬送され，搬送中に酸素を投与されたところ反応が鈍くなったという．喫煙は40本/日を45年間続けていた．数年前から平地歩行でも息切れがあったという．手指に羽ばたき振戦を認める．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡の施行"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"頸動脈の超音波検査"},{"letter":"D","text":"呼吸機能検査の施行"},{"letter":"E","text":"動脈血ガス分析の実施"}],"answer":["E"],"multi":false,"explanation":"解説：動脈血ガス分析でPaO2・PaCO2・pHを確認し，低酸素血症と換気不全を評価する．高PaCO2を伴うアシデミアは急性の換気不全を示す．酸素投与中のPaO2だけでは投与前の呼吸不全を否定できない．\n- A：内視鏡は消化管疾患の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：頸動脈超音波は動脈硬化の評価．\n- D：呼吸機能検査は安定期の気流制限の評価で，意識障害のある急性期には行えない．\n- E：病型と緊急度を同時に決め正しい．","images":[],"stem_images":[]},{"number":4,"section":"D-6-S01　74歳男性・傾眠と呼吸困難","question":"（4/4）74歳の男性．呼吸困難で救急搬送され，搬送中に酸素を投与されたところ反応が鈍くなったという．喫煙は40本/日を45年間続けていた．数年前から平地歩行でも息切れがあったという．手指に羽ばたき振戦を認める．動脈血ガス分析でpH 7.21，PaO2 118Torr，PaCO2 88Torr，HCO3- 34mEq/Lであった．意識が悪化した機序はどれか．","options":[{"letter":"A","text":"酸素投与に伴う二酸化炭素蓄積"},{"letter":"B","text":"気道の可逆的な狭窄の進行"},{"letter":"C","text":"肺胞毛細血管の透過性亢進"},{"letter":"D","text":"肺動脈が血栓で閉塞したこと"},{"letter":"E","text":"胸腔内に空気が貯留したこと"}],"answer":["A"],"multi":false,"explanation":"解説：過剰な酸素投与に伴う高CO2血症には換気血流不均等の増悪やHaldane効果などが関与し，呼吸刺激の低下だけでは説明できない．酸素を一律に止めず，血液ガスと呼吸状態に応じて酸素・換気を調整する．\n- A：換気血流不均等の増悪などでPaCO2が上がり，意識障害をきたす．\n- B：可逆的な気道狭窄は気管支喘息の病態．\n- C：透過性亢進型の肺水腫は急性呼吸窮迫症候群．\n- D：肺血栓塞栓症ではPaCO2はむしろ低下する．\n- E：気胸では患側の呼吸音減弱と打診鼓音を伴う．","images":[],"stem_images":[]},{"number":5,"section":"D-6-S02　28歳男性・発熱とのどの痛み","question":"（1/4）28歳の男性．2日前から38℃台の発熱とのどの痛みがあり来院した．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"咳や鼻水は出ていますか．"},{"letter":"B","text":"周囲に同じ症状の人はいますか．"},{"letter":"C","text":"唾液を飲み込めますか．"},{"letter":"D","text":"息苦しさはありますか．"},{"letter":"E","text":"以前からいびきをかきますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性いびきは今回の急な咽頭痛の鑑別では優先度が低い．\n- A：ウイルス性上気道炎を検討．\n- B：感染への曝露を確認．\n- C：嚥下障害と重症病変を評価．\n- D：上気道狭窄の危険を確認．\n- E：慢性いびきは今回の急な咽頭痛の鑑別では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":6,"section":"D-6-S02　28歳男性・発熱とのどの痛み","question":"（2/4）28歳の男性．2日前から38℃台の発熱とのどの痛みがあり来院した．咳も鼻水もまったく出ていないという．食事を飲み込むときに強く痛むという．認められる所見はどれか．","options":[{"letter":"A","text":"前頸部リンパ節の有痛性腫脹"},{"letter":"B","text":"耳後部リンパ節の無痛性腫脹"},{"letter":"C","text":"両側の眼瞼結膜の充血"},{"letter":"D","text":"頬粘膜の白色の小斑点"},{"letter":"E","text":"手掌と足底の丘疹性紅斑"}],"answer":["A"],"multi":false,"explanation":"解説：扁桃の発赤・腫大と白苔，前頸部リンパ節の圧痛を伴う腫脹が細菌性を示唆する．咳がないこと，38℃以上の発熱と併せた4項目がCentor基準で，点数が高いほど細菌性の確率が上がる．\n- A：細菌性咽頭炎を示唆し正しい．\n- B：耳後部リンパ節の無痛性腫脹は風疹．\n- C：眼瞼結膜の充血は麻疹やアデノウイルス感染症．\n- D：頬粘膜の白色小斑点は麻疹のKoplik斑．\n- E：手掌足底の丘疹性紅斑は第2期梅毒．","images":[],"stem_images":[]},{"number":7,"section":"D-6-S02　28歳男性・発熱とのどの痛み","question":"（3/4）28歳の男性．2日前から38℃台の発熱とのどの痛みがあり来院した．咳も鼻水もまったく出ていないという．両側の扁桃が発赤腫大して白苔が付着し，前頸部リンパ節に圧痛を伴う腫脹を認める．次に行うべき検査はどれか．","options":[{"letter":"A","text":"胸部エックス線撮影の施行"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"咽頭ぬぐい液の迅速抗原検査"},{"letter":"D","text":"呼吸機能検査の施行"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["C"],"multi":false,"explanation":"解説：A群溶血性レンサ球菌の迅速抗原検査は数分で結果が出て特異度が高い．陽性なら抗菌薬の適応が決まり，陰性でも臨床的に疑いが強ければ培養で確認する．\n- A：胸部エックス線は肺炎を疑う場合の検査で，咽頭所見が主体の本例では優先しない．\n- B：骨シンチグラフィは骨病変の検索．\n- C：抗菌薬の適応判断に直結し正しい．\n- D：呼吸機能検査は気流制限の評価．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":8,"section":"D-6-S02　28歳男性・発熱とのどの痛み","question":"（4/4）28歳の男性．2日前から38℃台の発熱とのどの痛みがあり来院した．咳も鼻水もまったく出ていないという．両側の扁桃が発赤腫大して白苔が付着し，前頸部リンパ節に圧痛を伴う腫脹を認める．体温38.4℃で，咳は一度も出ていない．迅速抗原検査が陽性であった．抗菌薬を投与する最大の理由はどれか．","options":[{"letter":"A","text":"症状の期間を大幅に短縮するため"},{"letter":"B","text":"中耳炎の発症を完全に防ぐため"},{"letter":"C","text":"咳の出現を予防するため"},{"letter":"D","text":"急性リウマチ熱の発症を防ぐため"},{"letter":"E","text":"発熱の再燃を確実に防ぐため"}],"answer":["D"],"multi":false,"explanation":"解説：適切な抗菌薬を10日間投与すると，続発するリウマチ熱を予防できる．症状そのものの短縮効果は1日程度にとどまるため，合併症の予防こそが投与の主目的になる．\n- A：症状短縮の効果は限定的で，主目的にはならない．\n- B：化膿性合併症の減少は期待できるが，完全に防げるわけではない．\n- C：咳はこの疾患の主症状ではない．\n- D：抗菌薬投与の最大の根拠で正しい．\n- E：再燃の防止は投与目的として位置づけられていない．","images":[],"stem_images":[]},{"number":9,"section":"D-6-S03　68歳男性・発熱と咳と膿性痰","question":"（1/4）68歳の男性．3日前から悪寒を伴う発熱と咳があり，錆びたような色の痰が出るという．息切れも自覚している．耐性菌のリスクを評価するために確認する質問はどれか．","options":[{"letter":"A","text":"入院や施設入所はありましたか．"},{"letter":"B","text":"食事中にむせますか．"},{"letter":"C","text":"鳥を飼っていますか．"},{"letter":"D","text":"歯や歯ぐきの病気はありますか．"},{"letter":"E","text":"痰に血が混じりますか．"}],"answer":["A"],"multi":false,"explanation":"解説：発症の場が市中か医療介護関連かで想定される起因菌と抗菌薬の選択が変わる．入院歴・施設入所・透析・化学療法の有無は，耐性菌を考慮すべきかどうかを決める分岐点になる．\n- A：起因菌の想定と初期抗菌薬を左右し有用．\n- B：誤嚥のリスクに関する情報．\n- C：感染・吸入抗原への曝露に関する情報．\n- D：口腔内の感染源に関する情報．\n- E：喀痰の性状に関する情報．","images":[],"stem_images":[]},{"number":10,"section":"D-6-S03　68歳男性・発熱と咳と膿性痰","question":"（2/4）68歳の男性．3日前から悪寒を伴う発熱と咳があり，錆びたような色の痰が出るという．息切れも自覚している．入院歴も施設入所もなく，自宅で生活しているという．認められる所見はどれか．","options":[{"letter":"A","text":"患側の打診での鼓音"},{"letter":"B","text":"両肺野のびまん性の呼気性喘鳴"},{"letter":"C","text":"吸気終末の捻髪音が両下肺背側に"},{"letter":"D","text":"患側の呼吸音減弱と声音振盪低下"},{"letter":"E","text":"患側の気管支呼吸音と声音振盪亢進"}],"answer":["E"],"multi":false,"explanation":"解説：肺胞が滲出液で満たされると音が伝わりやすくなり，末梢でも気管支呼吸音が聴こえ，声音振盪と声音伝導が亢進する．打診は濁音となり，同部にcoarse cracklesを伴う．\n- A：打診鼓音は気胸．\n- B：びまん性の呼気性喘鳴は気管支喘息やCOPD．\n- C：両下肺背側の捻髪音は間質性肺炎．\n- D：呼吸音減弱と声音振盪低下は胸水や気胸．\n- E：肺胞の含気が失われ実質化した状態を示し正しい．","images":[],"stem_images":[]},{"number":11,"section":"D-6-S03　68歳男性・発熱と咳と膿性痰","question":"（3/4）68歳の男性．3日前から悪寒を伴う発熱と咳があり，錆びたような色の痰が出るという．息切れも自覚している．入院歴も施設入所もなく，自宅で生活しているという．右下肺野で気管支呼吸音と声音振盪の亢進を認める．体温38.9℃．胸部エックス線写真で右下葉に気管支透亮像を伴う浸潤影を認めた．起因菌の推定に最も有用な検査はどれか．","options":[{"letter":"A","text":"血清アミラーゼの測定"},{"letter":"B","text":"喀痰のGram染色と培養"},{"letter":"C","text":"骨密度の測定"},{"letter":"D","text":"神経伝導速度の測定"},{"letter":"E","text":"24時間食道pHモニタリング"}],"answer":["B"],"multi":false,"explanation":"解説：良質な喀痰をGram染色すると，グラム陽性の莢膜をもつ双球菌が多数の好中球とともに見える．同時に培養で感受性を確認し，尿中肺炎球菌抗原も併用すると迅速に推定できる．\n- A：アミラーゼは膵疾患の指標．\n- B：起因菌の推定と抗菌薬の選択に直結し正しい．\n- C：骨密度は骨粗鬆症の評価．\n- D：神経伝導速度は末梢神経障害の評価．\n- E：食道pHモニタリングは胃食道逆流症の検査．","images":[],"stem_images":[]},{"number":12,"section":"D-6-S03　68歳男性・発熱と咳と膿性痰","question":"（4/4）68歳の男性．3日前から悪寒を伴う発熱と咳があり，錆びたような色の痰が出るという．息切れも自覚している．入院歴も施設入所もなく，自宅で生活しているという．右下肺野で気管支呼吸音と声音振盪の亢進を認める．体温38.9℃．胸部エックス線写真で右下葉に気管支透亮像を伴う浸潤影を認めた．喀痰のGram染色でグラム陽性双球菌を多数認めた．回復後に勧めるべきなのはどれか．","options":[{"letter":"A","text":"抗菌薬を予防的に長期内服する"},{"letter":"B","text":"気管支拡張薬を毎日吸入する"},{"letter":"C","text":"肺炎球菌ワクチンの接種"},{"letter":"D","text":"副腎皮質ステロイドの連日内服"},{"letter":"E","text":"水分摂取を1日500mLに制限する"}],"answer":["C"],"multi":false,"explanation":"解説：高齢者・慢性心肺疾患・糖尿病・脾摘後では侵襲性感染症の危険が高く，肺炎球菌ワクチンの接種が勧められる．インフルエンザワクチンの併用と禁煙も再発予防として重要である．\n- A：抗菌薬の予防的長期内服は耐性菌を生むだけで適応がない．\n- B：気管支拡張薬はCOPDや喘息の治療．\n- C：再発と重症化の予防として正しい．\n- D：ステロイドの連日内服は易感染性を高める．\n- E：水分制限は脱水と喀痰の粘稠化を招く．","images":[],"stem_images":[]},{"number":13,"section":"D-6-S04　52歳男性・2か月続く咳と微熱","question":"（1/4）52歳の男性．2か月前から咳が続き，37℃台の微熱と寝汗があるという．体重が5kg減った．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"免疫を抑える薬を使っていますか．"},{"letter":"B","text":"痰に血が混じりますか．"},{"letter":"C","text":"幼少期に乗り物酔いをしましたか．"},{"letter":"D","text":"たばこを吸っていますか．"},{"letter":"E","text":"周囲に長く咳をする人はいますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．過去の乗り物酔いは慢性咳嗽の原因検索では優先度が低い．\n- A：感染の発症リスクを確認．\n- B：肺の感染や腫瘍を検討．\n- C：過去の乗り物酔いは慢性咳嗽の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：悪性疾患を含む背景を確認．\n- E：結核などへの曝露を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-6-S04　52歳男性・2か月続く咳と微熱","question":"（2/4）52歳の男性．2か月前から咳が続き，37℃台の微熱と寝汗があるという．体重が5kg減った．同じ職場で昨年，同様の症状で長期入院した人がいるという．胸部エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"両肺門部を中心とする蝶形陰影"},{"letter":"B","text":"右上肺野の空洞を伴う浸潤影"},{"letter":"C","text":"両下肺野の網状影と蜂巣肺"},{"letter":"D","text":"片側の肺紋理消失と虚脱"},{"letter":"E","text":"両側びまん性の粒状影のみ"}],"answer":["B"],"multi":false,"explanation":"解説：酸素分圧が高く菌が増えやすい上葉の後上区や下葉の上区に好発する．空洞形成と周囲への気管支散布影が特徴で，治癒後は硬化像や石灰化を残す．\n- A：両肺門部の蝶形陰影は心原性肺水腫．\n- B：この疾患の好発部位と所見で正しい．\n- C：下肺野の網状影と蜂巣肺は特発性肺線維症．\n- D：片側の肺紋理消失と虚脱は気胸．\n- E：びまん性粒状影のみは粟粒結核やじん肺などでみられるが，本例の典型像ではない．","images":[],"stem_images":[]},{"number":15,"section":"D-6-S04　52歳男性・2か月続く咳と微熱","question":"（3/4）52歳の男性．2か月前から咳が続き，37℃台の微熱と寝汗があるという．体重が5kg減った．同じ職場で昨年，同様の症状で長期入院した人がいるという．胸部エックス線写真で右上肺野に空洞を伴う浸潤影を認めた．直ちに行うべき対応はどれか．","options":[{"letter":"A","text":"標準予防策のみで外来通院とする"},{"letter":"B","text":"接触感染予防策だけを追加する"},{"letter":"C","text":"飛沫感染予防策だけで十分である"},{"letter":"D","text":"血液媒介感染への対策を優先する"},{"letter":"E","text":"陰圧個室に収容しN95を着用する"}],"answer":["E"],"multi":false,"explanation":"解説：この病原体は飛沫核となって空中に長く漂うため，サージカルマスクでは防げない．陰圧個室での管理と医療者のN95着用，患者自身のサージカルマスク着用が同時に要る．\n- A：標準予防策だけでは空気感染を防げない．\n- B：接触感染対策は主な経路に対応していない．\n- C：飛沫感染対策のみでも飛沫核は防げない．\n- D：血液媒介感染はB型肝炎やHIV感染症で問題になる．\n- E：感染経路に見合った対策で正しい．","images":[],"stem_images":[]},{"number":16,"section":"D-6-S04　52歳男性・2か月続く咳と微熱","question":"（4/4）52歳の男性．2か月前から咳が続き，37℃台の微熱と寝汗があるという．体重が5kg減った．同じ職場で昨年，同様の症状で長期入院した人がいるという．胸部エックス線写真で右上肺野に空洞を伴う浸潤影を認めた．喀痰の抗酸菌塗抹検査が陽性であった．治療の原則として正しいのはどれか．","options":[{"letter":"A","text":"多剤併用と服薬確認を行う"},{"letter":"B","text":"単剤を短期間だけ投与する"},{"letter":"C","text":"症状が消えたら中止してよい"},{"letter":"D","text":"経過をみて必要なら投与する"},{"letter":"E","text":"発熱時のみ内服すればよい"}],"answer":["A"],"multi":false,"explanation":"解説：単剤では耐性菌が選択されるため，初期2か月は4剤を併用し，以後2剤で計6か月続ける．服薬の中断が耐性化の最大の原因なので，直接服薬確認療法で完遂を支える．\n- A：耐性化を防ぐ治療原則で正しい．\n- B：単剤短期投与は耐性菌を生む典型的な誤りである．\n- C：症状消失後も菌は残っており，途中中止は再燃と耐性化を招く．\n- D：塗抹陽性である以上，経過観察は許されない．\n- E：間欠的な内服は血中濃度が保てず耐性化につながる．","images":[],"stem_images":[]},{"number":17,"section":"D-6-S05　70歳男性・労作時の息切れと慢性の咳","question":"（1/4）70歳の男性．5年前から坂道で息切れし，朝に痰の絡む咳が続くという．喫煙は20本/日を50年間続けている．慢性の呼吸症状の進行速度を把握する質問はどれか．","options":[{"letter":"A","text":"横になると息苦しいですか．"},{"letter":"B","text":"季節で症状が変わりますか．"},{"letter":"C","text":"仕事で粉じんを吸いますか．"},{"letter":"D","text":"息切れは何年で進みましたか．"},{"letter":"E","text":"痰は何色ですか．"}],"answer":["D"],"multi":false,"explanation":"解説：年単位で緩徐に進行する労作時呼吸困難は不可逆的な気流制限を示唆する．発作性で日や時間により変動する喘息とは経過が異なり，この一点が病型を大きく分ける．\n- A：体位との関係に関する情報．\n- B：季節変動に関する情報．\n- C：職業性曝露に関する情報．\n- D：進行の速さが病型を分けるため有用．\n- E：喀痰の性状に関する情報．","images":[],"stem_images":[]},{"number":18,"section":"D-6-S05　70歳男性・労作時の息切れと慢性の咳","question":"（2/4）70歳の男性．5年前から坂道で息切れし，朝に痰の絡む咳が続くという．喫煙は20本/日を50年間続けている．息切れは5年かけて少しずつ進んだという．認められる所見はどれか．","options":[{"letter":"A","text":"口すぼめ呼吸とビール樽状胸郭"},{"letter":"B","text":"患側の打診での鼓音と気管偏位"},{"letter":"C","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"D","text":"心尖部の拡張期ランブル"},{"letter":"E","text":"頸静脈の大砲A波"}],"answer":["A"],"multi":false,"explanation":"解説：気道の虚脱を防ごうと呼気時に口をすぼめ，肺の過膨張で胸郭が前後に膨らむ．横隔膜は平低化して呼吸音は減弱し，打診は過共鳴音となる．呼気の延長も特徴的である．\n- A：肺の過膨張と気流制限を反映し正しい．\n- B：打診鼓音と気管偏位は緊張性気胸．\n- C：下肺背側の捻髪音は間質性肺炎．\n- D：拡張期ランブルは僧帽弁狭窄症．\n- E：大砲A波は完全房室ブロック．","images":[],"stem_images":[]},{"number":19,"section":"D-6-S05　70歳男性・労作時の息切れと慢性の咳","question":"（3/4）70歳の男性．5年前から坂道で息切れし，朝に痰の絡む咳が続くという．喫煙は20本/日を50年間続けている．息切れは5年かけて少しずつ進んだという．口すぼめ呼吸をしており，胸郭は前後に膨らみ打診は過共鳴音である．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"睡眠ポリグラフィの施行"},{"letter":"B","text":"胸部造影CTの撮影"},{"letter":"C","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"D","text":"喀痰の抗酸菌塗抹検査"},{"letter":"E","text":"心エコー検査の施行"}],"answer":["C"],"multi":false,"explanation":"解説：気管支拡張薬を吸入した後でも1秒率が70%未満なら，可逆性の乏しい気流制限と判定できる．この不可逆性の証明が診断の要件で，喘息との区別もここで決まる．\n- A：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- B：胸部造影CTは肺血管や腫瘍の評価．\n- C：診断の要件そのもので正しい．\n- D：抗酸菌塗抹は結核を疑う場合の検査．\n- E：心エコーは心機能の評価で，気流制限は測れない．","images":[],"stem_images":[]},{"number":20,"section":"D-6-S05　70歳男性・労作時の息切れと慢性の咳","question":"（4/4）70歳の男性．5年前から坂道で息切れし，朝に痰の絡む咳が続くという．喫煙は20本/日を50年間続けている．息切れは5年かけて少しずつ進んだという．口すぼめ呼吸をしており，胸郭は前後に膨らみ打診は過共鳴音である．気管支拡張薬吸入後の1秒率は56%であった．最も優先すべき介入はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの連日内服"},{"letter":"B","text":"禁煙の支援を行うこと"},{"letter":"C","text":"抗菌薬を予防的に長期投与する"},{"letter":"D","text":"終日の床上安静を指示する"},{"letter":"E","text":"水分摂取を1日500mLに制限する"}],"answer":["B"],"multi":false,"explanation":"解説：禁煙だけが呼吸機能の低下速度を緩やかにでき，生命予後を改善する．薬物療法と呼吸リハビリテーションは症状と増悪を減らすが，病期の進行そのものを止めるのは禁煙である．\n- A：経口ステロイドの連日投与は副作用が大きく，安定期の標準治療ではない．\n- B：唯一の疾患修飾的介入で正しい．\n- C：抗菌薬の予防的長期投与は耐性菌を招く．\n- D：床上安静は廃用を進め，運動療法とは逆の方向．\n- E：水分制限は喀痰の喀出を妨げる．","images":[],"stem_images":[]},{"number":21,"section":"D-6-S06　23歳女性・夜間の呼吸困難と喘鳴","question":"（1/4）23歳の女性．半年前から夜中に息苦しくなって目が覚め，ヒューヒューという音がするという．日中は何ともないことが多い．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"鼻炎や湿疹の既往はありますか．"},{"letter":"B","text":"症状のない日もありますか．"},{"letter":"C","text":"幼少期の中耳炎は何回ですか．"},{"letter":"D","text":"鎮痛薬で息苦しくなりますか．"},{"letter":"E","text":"運動や冷気で症状が出ますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．過去の中耳炎回数は反復性喘鳴の初期評価では優先度が低い．\n- A：アトピー素因を確認．\n- B：気道症状の変動を確認．\n- C：過去の中耳炎回数は反復性喘鳴の初期評価では優先度が低い．この設問で選ぶ肢．\n- D：薬剤による増悪を検討．\n- E：発作の誘因を確認．","images":[],"stem_images":[]},{"number":22,"section":"D-6-S06　23歳女性・夜間の呼吸困難と喘鳴","question":"（2/4）23歳の女性．半年前から夜中に息苦しくなって目が覚め，ヒューヒューという音がするという．日中は何ともないことが多い．症状のまったくない日が続くこともあるという．発作時に予想される所見はどれか．","options":[{"letter":"A","text":"患側の呼吸音減弱と打診濁音"},{"letter":"B","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"C","text":"右下肺野の気管支呼吸音の聴取"},{"letter":"D","text":"心尖部のI音亢進と拡張期雑音"},{"letter":"E","text":"両肺野のびまん性の呼気性喘鳴"}],"answer":["E"],"multi":false,"explanation":"解説：末梢気道が狭くなると呼気時に気流が乱れ，両肺野にわたって連続性の高調な副雑音が聴こえる．呼気が延長し，重症では呼吸音そのものが減弱して喘鳴が消える（silent chest）ため注意を要する．\n- A：呼吸音減弱と打診濁音は胸水．\n- B：下肺背側の捻髪音は間質性肺炎．\n- C：限局した気管支呼吸音は肺炎による実質化．\n- D：心尖部のI音亢進と拡張期雑音は僧帽弁狭窄症．\n- E：末梢気道の狭窄を反映し正しい．","images":[],"stem_images":[]},{"number":23,"section":"D-6-S06　23歳女性・夜間の呼吸困難と喘鳴","question":"（3/4）23歳の女性．半年前から夜中に息苦しくなって目が覚め，ヒューヒューという音がするという．日中は何ともないことが多い．症状のまったくない日が続くこともあるという．来院時は無症状で聴診も正常である．診断に有用な検査はどれか．","options":[{"letter":"A","text":"喀痰の抗酸菌塗抹検査"},{"letter":"B","text":"ピークフローの日内変動の測定"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"骨シンチグラフィの撮影"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["B"],"multi":false,"explanation":"解説：朝と夕のピークフローを記録して変動率を求めると，気流制限の可逆性と日内変動を客観的に示せる．気管支拡張薬による改善の確認や，呼気中一酸化窒素濃度の測定も診断を支持する．\n- A：抗酸菌塗抹は結核を疑う場合の検査．\n- B：可変性を客観的に示し正しい．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：骨シンチグラフィは骨病変の検索．\n- E：内視鏡は消化管疾患の評価だが，胃食道逆流は慢性咳嗽の鑑別にはなる．","images":[],"stem_images":[]},{"number":24,"section":"D-6-S06　23歳女性・夜間の呼吸困難と喘鳴","question":"（4/4）23歳の女性．半年前から夜中に息苦しくなって目が覚め，ヒューヒューという音がするという．日中は何ともないことが多い．症状のまったくない日が続くこともあるという．来院時は無症状で聴診も正常である．ピークフローの日内変動が25%と大きく，呼気中一酸化窒素濃度も高値であった．長期管理の中心となる薬剤はどれか．","options":[{"letter":"A","text":"経口の副腎皮質ステロイド"},{"letter":"B","text":"抗菌薬の長期予防投与"},{"letter":"C","text":"短時間作用型β2刺激薬の頓用"},{"letter":"D","text":"吸入副腎皮質ステロイド"},{"letter":"E","text":"抗ヒスタミン薬の連日内服"}],"answer":["D"],"multi":false,"explanation":"解説：本態は慢性の好酸球性気道炎症なので，炎症そのものを抑える吸入ステロイドが長期管理の柱になる．長時間作用型β2刺激薬との配合剤を用い，発作時の薬だけに頼らせないことが重要である．\n- A：経口ステロイドは急性増悪時に短期間用いるもので，長期管理の中心ではない．\n- B：抗菌薬は細菌感染の治療で，慢性の気道炎症には作用しない．\n- C：短時間作用型β2刺激薬は発作時の対症薬で，使用頻度が増えること自体が管理不良の指標．\n- D：気道炎症を直接抑え正しい．\n- E：抗ヒスタミン薬は鼻炎や蕁麻疹に用いる．","images":[],"stem_images":[]},{"number":25,"section":"D-6-S07　66歳男性・乾いた咳と労作時息切れ","question":"（1/4）66歳の男性．1年前から痰の出ない咳が続き，階段で息切れするようになったという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"冷たい物で歯がしみますか．"},{"letter":"B","text":"鳥を飼ったことがありますか．"},{"letter":"C","text":"仕事で粉じんを吸いましたか．"},{"letter":"D","text":"服用中の薬を教えてください．"},{"letter":"E","text":"関節痛や手指の色の変化はありますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．知覚過敏は慢性呼吸症状の原因検索では優先度が低い．\n- A：知覚過敏は慢性呼吸症状の原因検索では優先度が低い．この設問で選ぶ肢．\n- B：吸入抗原への曝露を確認．\n- C：職業性肺障害を検討．\n- D：薬剤性肺障害や咳嗽を検討．\n- E：膠原病に伴う肺障害を検討．","images":[],"stem_images":[]},{"number":26,"section":"D-6-S07　66歳男性・乾いた咳と労作時息切れ","question":"（2/4）66歳の男性．1年前から痰の出ない咳が続き，階段で息切れするようになったという．粉じんや鳥との接触はなく，膠原病を示す症状もないという．認められる所見はどれか．","options":[{"letter":"A","text":"両肺野のびまん性の呼気性喘鳴"},{"letter":"B","text":"患側の呼吸音減弱と打診鼓音"},{"letter":"C","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"D","text":"心尖部の全収縮期雑音の聴取"},{"letter":"E","text":"頸静脈の怒張と肝頸静脈逆流"}],"answer":["C"],"multi":false,"explanation":"解説：線維化で硬くなった末梢気道が吸気の終わりに一気に開くため，マジックテープを剝がすような細かい断続性ラ音が両下肺の背側で聴かれる．長期例ではばち指を伴う．\n- A：びまん性の呼気性喘鳴は気管支喘息やCOPD．\n- B：呼吸音減弱と打診鼓音は気胸．\n- C：間質の線維化を反映し正しい．\n- D：心尖部の全収縮期雑音は僧帽弁閉鎖不全症．\n- E：頸静脈怒張と肝頸静脈逆流は右心不全．","images":[],"stem_images":[]},{"number":27,"section":"D-6-S07　66歳男性・乾いた咳と労作時息切れ","question":"（3/4）66歳の男性．1年前から痰の出ない咳が続き，階段で息切れするようになったという．粉じんや鳥との接触はなく，膠原病を示す症状もないという．両下肺背側に吸気終末の捻髪音を聴取し，ばち指を認める．呼吸機能検査で予想される所見はどれか．","options":[{"letter":"A","text":"1秒率の低下と残気量の増加"},{"letter":"B","text":"肺活量は正常で1秒率のみ低下"},{"letter":"C","text":"気管支拡張薬で1秒量が著明に改善"},{"letter":"D","text":"肺活量の低下と拡散能の低下"},{"letter":"E","text":"呼吸機能検査に異常は出ない"}],"answer":["D"],"multi":false,"explanation":"解説：肺が硬くなって広がりにくくなるため肺活量が減り，拘束性換気障害を示す．肺胞壁の線維化でガス交換の効率も落ち，一酸化炭素拡散能が低下する．1秒率はむしろ保たれる．\n- A：1秒率低下と残気量増加は閉塞性換気障害．\n- B：1秒率のみの低下も閉塞性障害の型．\n- C：気管支拡張薬による著明な改善は気管支喘息．\n- D：拘束性障害と拡散障害を示し正しい．\n- E：この時点で明らかな症状と所見があり，異常が出ないことはない．","images":[],"stem_images":[]},{"number":28,"section":"D-6-S07　66歳男性・乾いた咳と労作時息切れ","question":"（4/4）66歳の男性．1年前から痰の出ない咳が続き，階段で息切れするようになったという．粉じんや鳥との接触はなく，膠原病を示す症状もないという．両下肺背側に吸気終末の捻髪音を聴取し，ばち指を認める．呼吸機能検査で%肺活量64%，1秒率82%，拡散能の低下を認めた．高分解能CTで予想される所見はどれか．","options":[{"letter":"A","text":"両肺門部を中心とする蝶形陰影"},{"letter":"B","text":"右上肺野の空洞を伴う浸潤影"},{"letter":"C","text":"気管支の不可逆的な拡張像"},{"letter":"D","text":"片側の肺紋理消失と虚脱"},{"letter":"E","text":"胸膜直下・下肺優位の蜂巣肺"}],"answer":["E"],"multi":false,"explanation":"解説：胸膜直下と下肺野に強い網状影と牽引性気管支拡張があり，小さな嚢胞が積み重なる蜂巣肺を呈するのが典型である．この所見が揃えば，生検なしに診断できる場合がある．\n- A：両肺門部の蝶形陰影は心原性肺水腫．\n- B：上肺野の空洞を伴う浸潤影は肺結核．\n- C：気管支の不可逆的拡張は気管支拡張症．\n- D：肺紋理消失と虚脱は気胸．\n- E：この疾患の典型的な画像所見で正しい．","images":[],"stem_images":[]},{"number":29,"section":"D-6-S08　48歳男性・日中の強い眠気","question":"（1/4）48歳の男性．半年前から日中に強い眠気があり，会議中や運転中にも眠ってしまうという．身長170cm，体重94kg．睡眠中の呼吸障害を同居家族に確認する質問はどれか．","options":[{"letter":"A","text":"普段は何時間眠りますか．"},{"letter":"B","text":"いびきの途中で呼吸が止まりますか．"},{"letter":"C","text":"眠り込む前に幻覚がありますか．"},{"letter":"D","text":"笑うと急に力が抜けますか．"},{"letter":"E","text":"眠る前に脚がむずむずしますか．"}],"answer":["B"],"multi":false,"explanation":"解説：本人は眠っているので自覚がなく，同居者からの情報が診断の出発点になる．大きないびきの途中で呼吸が止まり，あえぐように再開するという目撃情報は特異性が高い．\n- A：睡眠時間に関する情報．\n- B：同居者が目撃した無呼吸は睡眠中の呼吸障害を疑う手がかりになる．\n- C：入眠時幻覚に関する情報．\n- D：情動脱力発作に関する情報．\n- E：むずむず脚症状に関する情報．","images":[],"stem_images":[]},{"number":30,"section":"D-6-S08　48歳男性・日中の強い眠気","question":"（2/4）48歳の男性．半年前から日中に強い眠気があり，会議中や運転中にも眠ってしまうという．身長170cm，体重94kg．妻から大きないびきと呼吸の止まりを指摘されているという．認められる所見はどれか．","options":[{"letter":"A","text":"舌の萎縮と線維束攣縮"},{"letter":"B","text":"両下肢の腱反射の全般的消失"},{"letter":"C","text":"甲状腺のびまん性の圧痛"},{"letter":"D","text":"短い下顎と肥大した口蓋扁桃"},{"letter":"E","text":"頬部の蝶形紅斑と光線過敏"}],"answer":["D"],"multi":false,"explanation":"解説：上気道が狭くなる解剖学的な素因を診察で確かめる．肥満による頸部軟部組織の増加に加え，小顎・下顎後退・扁桃肥大・軟口蓋の低位・舌根の肥大が閉塞の場となる．\n- A：舌の萎縮と線維束攣縮は筋萎縮性側索硬化症．\n- B：腱反射の全般的消失は末梢神経障害．\n- C：甲状腺のびまん性の圧痛は亜急性甲状腺炎．\n- D：上気道の狭窄素因を示し正しい．\n- E：蝶形紅斑は全身性エリテマトーデス．","images":[],"stem_images":[]},{"number":31,"section":"D-6-S08　48歳男性・日中の強い眠気","question":"（3/4）48歳の男性．半年前から日中に強い眠気があり，会議中や運転中にも眠ってしまうという．身長170cm，体重94kg．妻から大きないびきと呼吸の止まりを指摘されているという．下顎は小さく口蓋扁桃が肥大している．血圧158/96mmHg．診断の確定に必要な検査はどれか．","options":[{"letter":"A","text":"睡眠ポリグラフィの施行"},{"letter":"B","text":"喀痰の抗酸菌塗抹検査"},{"letter":"C","text":"気管支拡張薬吸入後の呼吸機能検査"},{"letter":"D","text":"骨シンチグラフィの撮影"},{"letter":"E","text":"上部消化管内視鏡の施行"}],"answer":["A"],"multi":false,"explanation":"解説：脳波・眼球運動・筋電図・気流・胸腹部の動き・酸素飽和度を同時に記録し，1時間あたりの無呼吸低呼吸指数を算出する．この指数と症状の程度が重症度と治療適応を決める．\n- A：重症度を定量し治療適応を決め正しい．\n- B：抗酸菌塗抹は結核を疑う場合の検査．\n- C：呼吸機能検査は気流制限の評価で，睡眠中の事象は捉えられない．\n- D：骨シンチグラフィは骨病変の検索．\n- E：内視鏡は消化管疾患の評価．","images":[],"stem_images":[]},{"number":32,"section":"D-6-S08　48歳男性・日中の強い眠気","question":"（4/4）48歳の男性．半年前から日中に強い眠気があり，会議中や運転中にも眠ってしまうという．身長170cm，体重94kg．妻から大きないびきと呼吸の止まりを指摘されているという．下顎は小さく口蓋扁桃が肥大している．血圧158/96mmHg．睡眠ポリグラフィで無呼吸低呼吸指数が42回/時であった．最も適切な治療はどれか．","options":[{"letter":"A","text":"抗菌薬の長期予防投与を行う"},{"letter":"B","text":"副腎皮質ステロイドを連日内服する"},{"letter":"C","text":"吸入気管支拡張薬を毎日用いる"},{"letter":"D","text":"抗ヒスタミン薬を就寝前に内服する"},{"letter":"E","text":"経鼻的持続陽圧呼吸療法を導入する"}],"answer":["E"],"multi":false,"explanation":"解説：気道に陽圧をかけて虚脱を防ぐ治療で，中等症以上の第一選択になる．眠気が改善し，高血圧や心血管イベントの危険も下がる．減量・側臥位睡眠・飲酒制限も並行して指導する．\n- A：抗菌薬は感染症の治療で適応がない．\n- B：ステロイドの連日内服は肥満を悪化させ逆効果．\n- C：気管支拡張薬は下気道の狭窄に用いるもので，上気道の閉塞には作用しない．\n- D：抗ヒスタミン薬は眠気を強め，筋弛緩作用で閉塞を悪化させうる．\n- E：閉塞を物理的に解除し正しい．","images":[],"stem_images":[]},{"number":33,"section":"D-6-S09　56歳女性・長年続く大量の痰","question":"（1/4）56歳の女性．20年来，毎日コップ半分ほどの膿性痰が出る咳が続いているという．年に数回発熱を伴う悪化があり，血の混じった痰が出たこともある．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"鼻づまりや膿性鼻汁も続きますか．"},{"letter":"B","text":"子どもの頃に重い肺炎がありましたか．"},{"letter":"C","text":"昔，手首を骨折したことがありますか．"},{"letter":"D","text":"最近，痰の量や色が ,"answer":["B"],"multi":false,"explanation":"解説：感染と炎症で気管支の弾性線維と軟骨が壊れて拡張し，分泌物が貯留してさらに感染を招くという悪循環が起こる．拡張そのものは元に戻らないため，排痰と感染制御が管理の中心になる．\n- A：可逆的な気道狭窄は気管支喘息．\n- B：この疾患の本質で正しい．\n- C：肺胞壁の線維化は間質性肺炎．\n- D：静水圧上昇は心原性肺水腫．\n- E：胸腔内への空気の漏出は気胸．","images":[],"stem_images":[]},{"number":37,"section":"D-6-S10　62歳男性・敗血症治療中の低酸素血症","question":"（1/4）62歳の男性．消化管穿孔による腹膜炎の術後2日目．本日から呼吸数が増え，酸素投与量を上げても酸素化が改善しないという．心原性肺水腫との鑑別のために確認する情報はどれか．","options":[{"letter":"A","text":"体液の出納と心機能の評価"},{"letter":"B","text":"気道内の膿性分泌物の有無"},{"letter":"C","text":"下腿周径の左右差の有無"},{"letter":"D","text":"血清Dダイマーの測定"},{"letter":"E","text":"左右の呼吸音の差の確認"}],"answer":["A"],"multi":false,"explanation":"解説：術後の低酸素血症では，まず輸液過多や心不全による静水圧性の肺水腫を除外する．それで説明できない両側性陰影と低酸素血症であれば，透過性亢進型の病態を考えることになる．\n- A：病型の分岐を決め有用．\n- B：気道感染に関する情報．\n- C：深部静脈血栓症に関する情報．\n- D：凝固線溶の亢進に関する情報．\n- E：局所的な換気障害に関する情報．","images":[],"stem_images":[]},{"number":38,"section":"D-6-S10　62歳男性・敗血症治療中の低酸素血症","question":"（2/4）62歳の男性．消化管穿孔による腹膜炎の術後2日目．本日から呼吸数が増え，酸素投与量を上げても酸素化が改善しないという．中心静脈圧は正常で，心エコーでも心機能は保たれていた．胸部エックス線写真で予想される所見はどれか．","options":[{"letter":"A","text":"右上肺野の空洞を伴う浸潤影"},{"letter":"B","text":"片側の肺紋理消失と虚脱"},{"letter":"C","text":"気管支の不可逆的な拡張像"},{"letter":"D","text":"両側性のびまん性浸潤影"},{"letter":"E","text":"心拡大を伴う片側の胸水"}],"answer":["D"],"multi":false,"explanation":"解説：肺毛細血管の透過性が上がって蛋白に富む液が肺胞へ漏れるため，両側性にびまん性の浸潤影が広がる．心拡大を伴わない点が心原性肺水腫との画像上の違いになる．\n- A：空洞を伴う浸潤影は肺結核．\n- B：肺紋理消失と虚脱は気胸．\n- C：気管支の不可逆的拡張は気管支拡張症．\n- D：透過性亢進型の肺水腫を反映し正しい．\n- E：心拡大を伴う胸水は心不全．","images":[],"stem_images":[]},{"number":39,"section":"D-6-S10　62歳男性・敗血症治療中の低酸素血症","question":"（3/4）62歳の男性．消化管穿孔による腹膜炎の術後2日目．本日から呼吸数が増え，酸素投与量を上げても酸素化が改善しないという．中心静脈圧は正常で，心エコーでも心機能は保たれていた．胸部エックス線写真で両側性のびまん性浸潤影を認める．PEEP 8cmH2Oの人工呼吸管理下で，吸入酸素濃度60%，動脈血酸素分圧96Torrであった．この病態はどれか．","options":[{"letter":"A","text":"気道抵抗の可逆的な増大"},{"letter":"B","text":"P/F比160の中等度酸素化障害"},{"letter":"C","text":"肺胞低換気による二酸化炭素貯留"},{"letter":"D","text":"肺動脈の血栓による血流遮断"},{"letter":"E","text":"胸腔内圧の上昇による静脈還流低下"}],"answer":["B"],"multi":false,"explanation":"解説：動脈血酸素 分ける．滲出性なら細胞分画・アデノシンデアミナーゼ・細胞診・培養で，結核性・悪性・肺炎随伴性を鑑別していく．\n- A：骨シンチグラフィは骨病変の検索．\n- B：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- C：内視鏡は消化管疾患の評価．\n- D：病因の鑑別に直結し正しい．\n- E：呼吸機能検査は気流制限の評価．","images":[],"stem_images":[]},{"number":52,"section":"D-6-S13　58歳男性・深呼吸で増す胸痛","question":"（4/4）58歳の男性．1週間前から右の胸が痛み，深く息を吸うと強くなるという．微熱と咳も伴う．痛みは体を動かしても姿勢を変えても強さが変わり，息を止めると和らぐという．右下胸部に胸膜摩擦音を聴取していたが，本日は同部の呼吸音が減弱し打診で濁音を認める．胸水は黄色透明で，胸水蛋白/血清蛋白比0.62，胸水LDH/血清LDH比0.8，リンパ球優位であった．次に測定すべきなのはどれか．","options":[{"letter":"A","text":"胸水のアデノシンデアミナーゼ"},{"letter":"B","text":"血清アミラーゼの値"},{"letter":"C","text":"骨密度の測定値"},{"letter":"D","text":"呼気中一酸化窒素濃度"},{"letter":"E","text":"神経伝導速度の値"}],"answer":["A"],"multi":false,"explanation":"解説：Lightの基準を満たす滲出性で，リンパ球優位という組合せでは結核性胸膜炎と悪性胸水が二大鑑別になる．アデノシンデアミナーゼの高値は結核性を強く支持し，細胞診と併せて判断する．\n- A：この場面の鑑別に直結し正しい．\n- B：アミラーゼの上昇は膵疾患や食道穿孔に伴う胸水で意味をもつが，本例の第一候補ではない．\n- C：骨密度は骨粗鬆症の評価．\n- D：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- E：神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":53,"section":"D-6-S14　21歳男性・突然の片側胸痛","question":"（1/4）21歳の男性．講義中に突然右胸が痛くなり息苦しくなったという．身長184cm，体重58kgとやせ型である．同様の胸痛発作の再発歴を確認する質問はどれか．","options":[{"letter":"A","text":"直前に激しい運動をしましたか．"},{"letter":"B","text":"喫煙していますか．"},{"letter":"C","text":"胸をぶつけましたか．"},{"letter":"D","text":"咳や発熱がありますか．"},{"letter":"E","text":"同じことが以前にもありましたか．"}],"answer":["E"],"multi":false,"explanation":"解説：この病態は再発率が高く，反復の有無が治療方針を変える．初回なら脱気やドレナージで様子をみるが，再発例では胸腔鏡下の手術による根治を検討することになる．\n- A：発作の契機に関する情報．\n- B：危険因子に関する情報．\n- C：外傷に関する情報．\n- D：感染症状に関する情報．\n- E：治療方針を直接左右し有用．","images":[],"stem_images":[]},{"number":54,"section":"D-6-S14　21歳男性・突然の片側胸痛","question":"（2/4）21歳の男性．講義中に突然右胸が痛くなり息苦しくなったという．身長184cm，体重58kgとやせ型である．2年前にも同じ症状で入院したことがあるという．認められる所見はどれか．","options":[{"letter":"A","text":"右下肺野の気管支呼吸音の亢進"},{"letter":"B","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"C","text":"右の呼吸音減弱と打診での鼓音"},{"letter":"D","text":"心尖部の全収縮期雑音の聴取"},{"letter":"E","text":"両肺野のびまん性の呼気性喘鳴"}],"answer":["C"],"multi":false,"explanation":"解説：胸腔に漏れた空気が肺を虚脱させるため，患側の呼吸音が減弱し，声音振盪も低下する．空気は音をよく通すので打診は鼓音（過共鳴音）になる．患側の胸郭の動きも小さくなる．\n- A：気管支呼吸音の亢進は肺炎による実質化．\n- B：吸気終末の捻髪音は間質性肺炎．\n- C：胸腔内の空気貯留を反映し正しい．\n- D：心尖部の全収縮期雑音は僧帽弁閉鎖不全症．\n- E：びまん性の呼気性喘鳴は気管支喘息．","images":[],"stem_images":[]},{"number":55,"section":"D-6-S14　21歳男性・突然の片側胸痛","question":"（3/4）21歳の男性．講義中に突然右胸が痛くなり息苦しくなったという．身長184cm，体重58kgとやせ型である．2年前にも同じ症状で入院したことがあるという．右の呼吸音が減弱し打診で鼓音を認める．その後に血圧が82/50mmHgへ低下し，頸静脈が怒張して気管が左へ偏位してきた．直ちに行うべきなのはどれか．","options":[{"letter":"A","text":"胸部造影CTを撮影して確認する"},{"letter":"B","text":"気管支拡張薬を吸入させる"},{"letter":"C","text":"副腎皮質ステロイドを点滴する"},{"letter":"D","text":"抗菌薬の全身投与を開始する"},{"letter":"E","text":"患側胸腔への緊急脱気"}],"answer":["E"],"multi":false,"explanation":"解説：一方向弁のように空気が入り続けると胸腔内圧が上がり，静脈還流が妨げられて閉塞性ショックに至る．画像を待たず，患側の鎖骨中線第2肋間などから直ちに穿刺して減圧する．\n- A：画像を待つ間に心停止に至りうる．\n- B：気管支拡張薬は気道狭窄の治療で無効．\n- C：ステロイドはこの病態に作用しない．\n- D：抗菌薬は感染症の治療．\n- E：閉塞性ショックを解除する唯一の処置で正しい．","images":[],"stem_images":[]},{"number":56,"section":"D-6-S14　21歳男性・突然の片側胸痛","question":"（4/4）21歳の男性．講義中に突然右胸が痛くなり息苦しくなったという．身長184cm，体重58kgとやせ型である．2年前にも同じ症状で入院したことがあるという．右の呼吸音が減弱し打診で鼓音を認める．その後に血圧が82/50mmHgへ低下し，頸静脈が怒張して気管が左へ偏位してきた．緊急脱気で血圧は回復した．再発予防のために勧めるべきなのはどれか．","options":[{"letter":"A","text":"禁煙と胸腔鏡下の肺嚢胞切除"},{"letter":"B","text":"抗菌薬の長期予防投与"},{"letter":"C","text":"吸入副腎皮質ステロイドの継続"},{"letter":"D","text":"終日の床上安静を続けること"},{"letter":"E","text":"水分摂取を1日500mLに制限する"}],"answer":["A"],"multi":false,"explanation":"解説：肺尖部のブレブ・ブラの破裂が原因なので，これを切除して胸膜癒着を加えると再発率が大きく下がる．喫煙は発症と再発の危険因子なので，禁煙指導を必ず併せて行う．\n- A：原因病変の除去と危険因子の管理で正しい．\n- B：抗菌薬は感染症の治療で適応がない．\n- C：吸入ステロイドは気道炎症の治療．\n- D：床上安静は再発予防にならず廃用を招く．\n- E：水分制限はこの病態と無関係．","images":[],"stem_images":[]},{"number":57,"section":"D-6-S15　35歳女性・急な高熱と関節痛","question":"（1/4）35歳の女性．昨日の午後から突然38.9℃の高熱が出て，頭痛と全身の筋肉痛，強い倦怠感があるという．1月中旬である．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"咳や咽頭痛はありますか．"},{"letter":"B","text":"数年前から爪が厚くなっていますか．"},{"letter":"C","text":"妊娠の可能性はありますか．"},{"letter":"D","text":"周囲に同じ症状の人はいますか．"},{"letter":"E","text":"水分はとれていますか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．慢性爪病変は急性発熱の評価では優先度が低い．\n- A：呼吸器症状の合併を確認．\n- B：慢性爪病変は急性発熱の評価では優先度が低い．この設問で選ぶ肢．\n- C：重症化背景と治療選択に関わる．\n- D：流行と感染への曝露を確認．\n- E：脱水と全身状態を評価．","images":[],"stem_images":[]},{"number":58,"section":"D-6-S15　35歳女性・急な高熱と関節痛","question":"（2/4）35歳の女性．昨日の午後から突然38.9℃の高熱が出て，頭痛と全身の筋肉痛，強い倦怠感があるという．1月中旬である．職場で同じ症状の人が数人いるという．発症から18時間後に受診した．迅速抗原検査が陰性であった場合の解釈はどれか．","options":[{"letter":"A","text":"陰性なので確実に否定できる"},{"letter":"B","text":"陰性なら細菌感染症と確定する"},{"letter":"C","text":"検査の誤りなので機器を替える"},{"letter":"D","text":"抗菌薬を直ちに開始すべきである"},{"letter":"E","text":"早期では偽陰性がありうる"}],"answer":["E"],"multi":false,"explanation":"解説：ウイルス量が十分になるのは発症後半日から1日ほどかかるため，発症直後の検査は偽陰性になりやすい．流行状況と典型的な症状が揃えば，陰性でも臨床診断として扱ってよい．\n- A：陰性でも否定できないことがこの検査の限界である．\n- B：陰性は細菌感染を意味しない．\n- C：機器の問題ではなく，検査特性による現象．\n- D：抗菌薬はウイルス感染そのものには無効．\n- E：検査特性の正しい理解にあたる．","images":[],"stem_images":[]},{"number":59,"section":"D-6-S15　35歳女性・急な高熱と関節痛","question":"（3/4）35歳の女性．昨日の午後から突然38.9℃の高熱が出て，頭痛と全身の筋肉痛，強い倦怠感があるという．1月中旬である．職場で同じ症状の人が数人いるという．発症から18時間後に受診した．迅速抗原検査は陰性であったが臨床的に診断された．最も適切な対応はどれか．","options":[{"letter":"A","text":"経過観察のみで再診を指示する"},{"letter":"B","text":"抗菌薬の内服を直ちに始める"},{"letter":"C","text":"副腎皮質ステロイドを点滴する"},{"letter":"D","text":"抗ウイルス薬の投与を始める"},{"letter":"E","text":"気管支拡張薬の吸入を始める"}],"answer":["D"],"multi":false,"explanation":"解説：発症48時間以内に始めると有熱期間を約1日短縮でき，重症化の危険が高い人では合併症も減らせる．解熱鎮痛薬にはアセトアミノフェンを選び，サリチル酸系は小児で避ける．\n- A：発症48時間という治療の窓を逃すことになる．\n- B：抗菌薬はウイルスに無効で，二次性細菌性肺炎を合併したときに用いる．\n- C：ステロイドの定型的な投与は推奨されない．\n- D：発症早期の投与が有効で正しい．\n- E：気管支拡張薬は気道狭窄の治療．","images":[],"stem_images":[]},{"number":60,"section":"D-6-S15　35歳女性・急な高熱と関節痛","question":"（4/4）35歳の女性．昨日の午後から突然38.9℃の高熱が出て，頭痛と全身の筋肉痛，強い倦怠感があるという．1月中旬である．職場で同じ症状の人が数人いるという．発症から18時間後に受診した．迅速抗原検査は陰性であったが臨床的に診断され，抗ウイルス薬を開始した．いったん解熱した3日後に再び高熱と膿性痰が出た場合に考えるべきなのはどれか．","options":[{"letter":"A","text":"抗ウイルス薬の副作用による発熱"},{"letter":"B","text":"二次性の細菌性肺炎の合併"},{"letter":"C","text":"薬剤アレルギーによる発熱"},{"letter":"D","text":"検査の偽陰性による誤診"},{"letter":"E","text":"脱水による体温調節の破綻"}],"answer":["B"],"multi":false,"explanation":"解説：気道上皮が傷害されて細菌が付着しやすくなり，肺炎球菌や黄色ブドウ球菌による二次感染を起こす．いったん解熱した後の再発熱と膿性痰は典型的な経過で，胸部画像と喀痰検査を行う．\n- A：薬剤性発熱はまれで，膿性痰は説明できない．\n- B：二峰性の経過として典型的で正しい．\n- C：薬疹を伴わない薬剤アレルギーだけでは膿性痰は出ない．\n- D：いったん解熱している以上，誤診とは考えにくい．\n- E：脱水では膿性痰も新たな高熱も説明できない．","images":[],"stem_images":[]}],"seed":null},{"id":"D-7_消化器系","name":"D-7_消化器系.md","label":"D-7 消化器系","count":68,"sourceHash":"027e28936cda","questions":[{"number":1,"section":"D-7-S01　54歳男性・胸やけと呑酸","question":"（1/4）54歳の男性．半年前から胸やけと，酸っぱいものが上がってくる感じが続くという．身長168cm，体重82kg．逆流症状と食事・体位の関係を確認する質問はどれか．","options":[{"letter":"A","text":"食後や臥床で悪化しますか．"},{"letter":"B","text":"食べ物がつかえる感じはありますか．"},{"letter":"C","text":"黒い便が出ていますか．"},{"letter":"D","text":"体重が減っていませんか．"},{"letter":"E","text":"痛み止めを常用しますか．"}],"answer":["A"],"multi":false,"explanation":"解説：食後・臥位・前屈で胃内容が食道へ逆流しやすくなるため症状が強まる．この姿勢依存性が逆流によるものかを分ける手がかりで，労作で誘発される狭心症との区別にも役立つ．\n- A：症状の誘発条件から病態を絞れ有用．\n- B：嚥下困難に関する情報．\n- C：消化管出血に関する情報．\n- D：警告症状に関する情報．\n- E：薬剤性粘膜障害に関する情報．","images":[],"stem_images":[]},{"number":2,"section":"D-7-S01　54歳男性・胸やけと呑酸","question":"（2/4）54歳の男性．半年前から胸やけと，酸っぱいものが上がってくる感じが続くという．身長168cm，体重82kg．食後と就寝時に症状が強く，前かがみになると悪化するという．症状を悪化させる因子はどれか．","options":[{"letter":"A","text":"就寝前に上体を高くすること"},{"letter":"B","text":"就寝直前に食事をとること"},{"letter":"C","text":"1日の食事を少量頻回にすること"},{"letter":"D","text":"体重を5kg減らすこと"},{"letter":"E","text":"禁煙を続けること"}],"answer":["B"],"multi":false,"explanation":"解説：就寝直前の食事は胃内容が多い状態で臥位になるため逆流を招く．肥満・脂肪食・アルコール・喫煙・前屈姿勢も下部食道括約筋の圧を下げるか腹圧を上げて悪化させる．\n- A：上体挙上は逆流を減らす対策で，悪化因子ではない．\n- B：胃内容の残存と臥位が重なり最も悪化させる．\n- C：少量頻回は胃内圧を下げる工夫．\n- D：減量は腹圧を下げ症状を改善させる．\n- E：禁煙は下部食道括約筋の機能を保つ．","images":[],"stem_images":[]},{"number":3,"section":"D-7-S01　54歳男性・胸やけと呑酸","question":"（3/4）54歳の男性．半年前から胸やけと，酸っぱいものが上がってくる感じが続くという．身長168cm，体重82kg．食後と就寝時に症状が強く，前かがみになると悪化するという．就寝直前に食事をとる習慣があった．診断のために行うべき検査はどれか．","options":[{"letter":"A","text":"腹部単純エックス線撮影"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"上部消化管内視鏡の施行"},{"letter":"D","text":"呼吸機能検査の施行"},{"letter":"E","text":"神経伝導速度の測定"}],"answer":["C"],"multi":false,"explanation":"解説：食道下部の粘膜傷害の有無と程度をLos Angeles分類で評価し，同時に食道裂孔ヘルニア，Barrett食道，悪性腫瘍を除外する．症状があっても粘膜傷害を欠く非びらん性の型もある．\n- A：腹部単純写真は腸閉塞や結石の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：粘膜傷害の評価と悪性腫瘍の除外を同時に行え正しい．\n- D：呼吸機能検査は換気障害の評価．\n- E：神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":4,"section":"D-7-S01　54歳男性・胸やけと呑酸","question":"（4/4）54歳の男性．半年前から胸やけと，酸っぱいものが上がってくる感じが続くという．身長168cm，体重82kg．食後と就寝時に症状が強く，前かがみになると悪化するという．就寝直前に食事をとる習慣があった．上部消化管内視鏡で食道下部に縦走するびらんを認めた．第一選択の薬剤はどれか．","options":[{"letter":"A","text":"抗菌薬の全身投与"},{"letter":"B","text":"副腎皮質ステロイドの内服"},{"letter":"C","text":"抗ヒスタミン薬の連日内服"},{"letter":"D","text":"プロトンポンプ阻害薬"},{"letter":"E","text":"気管支拡張薬の吸入"}],"answer":["D"],"multi":false,"explanation":"解説：胃酸分泌を強力に抑えて粘膜傷害を治し，症状も改善する．生活指導（減量・就寝前の食事回避・上体挙上・禁煙）を併せて行い，難治例では手術も検討する．\n- A：抗菌薬は細菌感染の治療で，本例には適応がない．\n- B：ステロイドは炎症性疾患の治療で，酸逆流には作用しない．\n- C：抗ヒスタミン薬のうちH1拮抗薬はアレルギー疾患に用いるもので，胃酸分泌は抑えない．\n- D：酸分泌を直接抑え正しい．\n- E：気管支拡張薬は気道狭窄の治療．","images":[],"stem_images":[]},{"number":5,"section":"D-7-S02　48歳男性・空腹時の心窩部痛","question":"（1/4）48歳の男性．1か月前から心窩部が痛むという．体重の減少や嘔吐はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"痛みは食事と関係しますか．"},{"letter":"B","text":"痛み止めを飲んでいますか．"},{"letter":"C","text":"便が黒くなっていませんか．"},{"letter":"D","text":"歩くと痛みが出ますか．"},{"letter":"E","text":"排尿回数が増えていますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．尿路症状は今回の限局した心窩部痛の評価では優先度が低い．\n- A：消化性潰瘍などの性状を確認．\n- B：薬剤性の胃粘膜障害を検討．\n- C：消化管出血を確認．\n- D：心筋虚血との鑑別に有用．\n- E：尿路症状は今回の限局した心窩部痛の評価では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":6,"section":"D-7-S02　48歳男性・空腹時の心窩部痛","question":"（2/4）48歳の男性．1か月前から心窩部が痛むという．体重の減少や嘔吐はない．空腹時と夜間に痛みが強く，何か食べると楽になるという．併せて確認すべきなのはどれか．","options":[{"letter":"A","text":"鎮痛薬を常用していないか"},{"letter":"B","text":"幼少期の予防接種の履歴"},{"letter":"C","text":"学生時代に続けていた競技種目"},{"letter":"D","text":"家族に高血圧の人がいるか"},{"letter":"E","text":"昨晩の食事の内容と摂取時刻"}],"answer":["A"],"multi":false,"explanation":"解説：非ステロイド性抗炎症薬はプロスタグランジン産生を抑えて粘膜防御を弱め，潰瘍を作る．Helicobacter pylori感染と並ぶ二大成因で，中止や胃粘膜保護薬の併用という具体的な対応につながる．\n- A：是正可能な原因を直接拾え最も重要．\n- B：予防接種歴は感染症の免疫状態の確認．\n- C：過去の競技種目は臨床判断に寄与しない．\n- D：家族歴は本例の病態を変えない．\n- E：昨晩の食事内容だけでは1か月続く症状を説明できない．","images":[],"stem_images":[]},{"number":7,"section":"D-7-S02　48歳男性・空腹時の心窩部痛","question":"（3/4）48歳の男性．1か月前から心窩部が痛むという．体重の減少や嘔吐はない．空腹時と夜間に痛みが強く，何か食べると楽になるという．鎮痛薬は使っていないという．上部消化管内視鏡で十二指腸球部に潰瘍を認めた．次に行うべき検査はどれか．","options":[{"letter":"A","text":"血清アミラーゼの測定"},{"letter":"B","text":"骨密度と骨代謝マーカー"},{"letter":"C","text":"呼気中一酸化窒素濃度"},{"letter":"D","text":"神経伝導速度の測定"},{"letter":"E","text":"ピロリ菌の感染検査"}],"answer":["E"],"multi":false,"explanation":"解説：尿素呼気試験・便中抗原・迅速ウレアーゼ試験などで感染を確認する．陽性なら除菌することで潰瘍の再発率が著しく下がり，胃癌の発症も減らせるため，潰瘍を見たら必ず調べる．\n- A：アミラーゼは膵疾患の指標．\n- B：骨密度と骨代謝マーカーは骨粗鬆症の評価．\n- C：呼気中一酸化窒素濃度は好酸球性気道炎症の指標．\n- D：神経伝導速度は末梢神経障害の評価．\n- E：Helicobacter pylori の除菌は再発予防と発癌予防に直結し正しい．","images":[],"stem_images":[]},{"number":8,"section":"D-7-S02　48歳男性・空腹時の心窩部痛","question":"（4/4）48歳の男性．1か月前から心窩部が痛むという．体重の減少や嘔吐はない．空腹時と夜間に痛みが強く，何か食べると楽になるという．鎮痛薬は使っていないという．上部消化管内視鏡で十二指腸球部に潰瘍を認めた．尿素呼気試験が陽性であった．治療中に突然の激しい腹痛が出現した場合に予想される所見はどれか．","options":[{"letter":"A","text":"腹壁全体の板状硬と反跳痛"},{"letter":"B","text":"腸雑音の金属性の亢進"},{"letter":"C","text":"右季肋部のMurphy徴候"},{"letter":"D","text":"臍周囲の拍動性腫瘤"},{"letter":"E","text":"左下腹部の限局した圧痛"}],"answer":["A"],"multi":false,"explanation":"解説：潰瘍が穿孔すると消化液が腹腔へ漏れて汎発性腹膜炎となり，腹壁が板のように硬くなる．立位腹部単純写真で横隔膜下の遊離ガスを確認し，緊急手術を考慮する．\n- A：穿孔による汎発性腹膜炎の所見で正しい．\n- B：金属性腸雑音は腸閉塞．\n- C：Murphy徴候は急性胆嚢炎．\n- D：拍動性腫瘤は腹部大動脈瘤．\n- E：左下腹部の限局した圧痛は大腸憩室炎．","images":[],"stem_images":[]},{"number":9,"section":"D-7-S03　22歳男性・移動する腹痛","question":"（1/4）22歳の男性．昨夜から心窩部が重く痛み，本日になって痛みの場所が変わったという．食欲がなく，軽い吐き気もある．腹痛の時間的な移動を明らかにする質問はどれか．","options":[{"letter":"A","text":"痛みは波のように強くなりますか．"},{"letter":"B","text":"痛みはどこからどこへ移りましたか．"},{"letter":"C","text":"吐き気は痛みより先でしたか．"},{"letter":"D","text":"下痢や血便はありますか．"},{"letter":"E","text":"食事で痛みが変わりますか．"}],"answer":["B"],"multi":false,"explanation":"解説：最初は内臓痛として心窩部や臍周囲に漠然と感じられ，炎症が漿膜に及ぶと体性痛となって病変部へ限局する．心窩部から右下腹部へという移動は，この機序を反映する特徴的な経過である．\n- A：疝痛の有無に関する情報．\n- B：痛みの移動が診断の核で有用．\n- C：症状の出現順序に関する情報．\n- D：随伴症状に関する情報．\n- E：食事との関係に関する情報．","images":[],"stem_images":[]},{"number":10,"section":"D-7-S03　22歳男性・移動する腹痛","question":"（2/4）22歳の男性．昨夜から心窩部が重く痛み，本日になって痛みの場所が変わったという．食欲がなく，軽い吐き気もある．痛みは心窩部から右下腹部へ移ったという．認められる所見はどれか．","options":[{"letter":"A","text":"腸雑音の金属性の亢進"},{"letter":"B","text":"右季肋部のMurphy徴候"},{"letter":"C","text":"臍周囲の拍動性腫瘤"},{"letter":"D","text":"左下腹部の限局した圧痛"},{"letter":"E","text":"右下腹部の圧痛と反跳痛"}],"answer":["E"],"multi":false,"explanation":"解説：McBurney点の圧痛に加え，手を離したときに痛みが強まる反跳痛と腹壁の筋性防御は腹膜刺激徴候を示す．左下腹部を圧迫すると右下腹部が痛むRovsing徴候も参考になる．\n- A：金属性腸雑音は腸閉塞．\n- B：Murphy徴候は急性胆嚢炎．\n- C：拍動性腫瘤は腹部大動脈瘤．\n- D：左下腹部の限局した圧痛は大腸憩室炎．\n- E：右下腹部の腹膜刺激徴候として正しい．","images":[],"stem_images":[]},{"number":11,"section":"D-7-S03　22歳男性・移動する腹痛","question":"（3/4）22歳の男性．昨夜から心窩部が重く痛み，本日になって痛みの場所が変わったという．食欲がなく，軽い吐き気もある．痛みは心窩部から右下腹部へ移ったという．右下腹部に圧痛と反跳痛を認める．体温37.8℃．白血球14200/μL，CRP 6.4mg/dL．次に行うべき検査はどれか．","options":[{"letter":"A","text":"呼吸機能検査の施行"},{"letter":"B","text":"骨シンチグラフィの撮影"},{"letter":"C","text":"腹部超音波検査または造影CT"},{"letter":"D","text":"上部消化管内視鏡の施行"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["C"],"multi":false,"explanation":"解説：腫大した虫垂の描出，糞石，周囲の脂肪織濃度上昇，膿瘍形成の有無を確認する．若年者ではまず超音波を用い，判定できなければCTへ進むことで被曝を抑えられる．\n- A：呼吸機能検査は換気障害の評価．\n- B：骨シンチグラフィは骨病変の検索．\n- C：診断の確定と穿孔・膿瘍の評価を同時に行え正しい．\n- D：内視鏡は上部消化管の評価で，本例の病変は見えない．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":12,"section":"D-7-S03　22歳男性・移動する腹痛","question":"（4/4）22歳の男性．昨夜から心窩部が重く痛み，本日になって痛みの場所が変わったという．食欲がなく，軽い吐き気もある．痛みは心窩部から右下腹部へ移ったという．右下腹部に圧痛と反跳痛を認める．体温37.8℃．白血球14200/μL，CRP 6.4mg/dL．造影CTで腫大した虫垂と糞石を認め，膿瘍はなかった．最も適切な治療はどれか．","options":[{"letter":"A","text":"経過観察のみで帰宅させる"},{"letter":"B","text":"虫垂切除術を行う"},{"letter":"C","text":"止痢薬を投与して様子をみる"},{"letter":"D","text":"プロトンポンプ阻害薬を投与する"},{"letter":"E","text":"浣腸により排便を促す"}],"answer":["B"],"multi":false,"explanation":"解説：腹膜刺激徴候があり穿孔の危険が高いため，腹腔鏡下または開腹での虫垂切除が標準治療になる．膿瘍を形成している場合はドレナージと抗菌薬で鎮静化させてから待機手術とすることもある．\n- A：穿孔すれば汎発性腹膜炎となり，経過観察は許されない．\n- B：標準治療として正しい．\n- C：止痢薬は本例の病態に作用しない．\n- D：プロトンポンプ阻害薬は酸関連疾患の治療．\n- E：浣腸は腸管内圧を上げ穿孔を誘発しうるため禁忌に近い．","images":[],"stem_images":[]},{"number":13,"section":"D-7-S04　26歳女性・粘血便と下痢","question":"（1/4）26歳の女性．3か月前から1日5〜6回の下痢が続き，血液と粘液が混じるという．排便後も残便感がある．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"関節痛や目の充血はありますか．"},{"letter":"B","text":"以前から乗り物酔いをしますか．"},{"letter":"C","text":"抗菌薬を飲んでいましたか．"},{"letter":"D","text":"夜中にも下痢で目が覚めますか．"},{"letter":"E","text":"最近，海外へ行きましたか．"}],"answer":["B"],"multi":false,"explanation":"解説：Bが正答．乗り物酔いの既往は慢性粘血便の原因検索では優先度が低い．\n- A：腸管外症状を確認．\n- B：乗り物酔いの既往は慢性粘血便の原因検索では優先度が低い．この設問で選ぶ肢．\n- C：抗菌薬関連腸炎を検討．\n- D：器質性疾患を示す症状を確認．\n- E：感染性腸炎への曝露を確認．","images":[],"stem_images":[]},{"number":14,"section":"D-7-S04　26歳女性・粘血便と下痢","question":"（2/4）26歳の女性．3か月前から1日5〜6回の下痢が続き，血液と粘液が混じるという．排便後も残便感がある．半年前から左膝の痛みがあり，時々目が充血するという．大腸内視鏡で予想される所見はどれか．","options":[{"letter":"A","text":"直腸から連続する粘膜のびまん性炎症"},{"letter":"B","text":"非連続性に散在する縦走潰瘍"},{"letter":"C","text":"敷石像を伴う全層性の狭窄"},{"letter":"D","text":"憩室開口部の周囲に限局した発赤"},{"letter":"E","text":"隆起性病変からの易出血"}],"answer":["A"],"multi":false,"explanation":"解説：直腸から口側へ連続して広がり，粘膜と粘膜下層に限局したびまん性の炎症を起こす．血管透見の消失，細顆粒状粘膜，易出血性，膿性粘液の付着が特徴で，重症では広範な潰瘍となる．\n- A：この疾患の分布と深達度を示し正しい．\n- B：非連続性の縦走潰瘍はCrohn病．\n- C：敷石像と全層性の狭窄もCrohn病．\n- D：憩室開口部周囲の発赤は憩室炎．\n- E：隆起性病変からの易出血は大腸癌．","images":[],"stem_images":[]},{"number":15,"section":"D-7-S04　26歳女性・粘血便と下痢","question":"（3/4）26歳の女性．3か月前から1日5〜6回の下痢が続き，血液と粘液が混じるという．排便後も残便感がある．半年前から左膝の痛みがあり，時々目が充血するという．大腸内視鏡で直腸からS状結腸に連続するびまん性の炎症を認めた．生検で予想される所見はどれか．","options":[{"letter":"A","text":"全層性の炎症と非乾酪性肉芽腫"},{"letter":"B","text":"粘膜固有層の炎症と陰窩膿瘍"},{"letter":"C","text":"粘膜の腺管構造の破壊と異型"},{"letter":"D","text":"血管壁のフィブリノイド壊死"},{"letter":"E","text":"アミロイドの沈着と血管の肥厚"}],"answer":["B"],"multi":false,"explanation":"解説：炎症が粘膜と粘膜下層に限局し，陰窩内に好中球が集まる陰窩膿瘍と杯細胞の減少がみられる．全層性の炎症や非乾酪性肉芽腫はCrohn病を示唆するので，これらがあれば診断を見直す．\n- A：全層性炎症と非乾酪性肉芽腫はCrohn病．\n- B：この疾患の病理像として正しい．\n- C：腺管構造の破壊と異型は腫瘍性病変．\n- D：フィブリノイド壊死は血管炎．\n- E：アミロイド沈着はアミロイドーシス．","images":[],"stem_images":[]},{"number":16,"section":"D-7-S04　26歳女性・粘血便と下痢","question":"（4/4）26歳の女性．3か月前から1日5〜6回の下痢が続き，血液と粘液が混じるという．排便後も残便感がある．半年前から左膝の痛みがあり，時々目が充血するという．大腸内視鏡で直腸からS状結腸に連続するびまん性の炎症を認め，生検で陰窩膿瘍を認めた．長期経過で最も警戒すべきなのはどれか．","options":[{"letter":"A","text":"小腸の瘻孔形成が進むこと"},{"letter":"B","text":"肛門周囲に膿瘍ができること"},{"letter":"C","text":"大腸癌の発生が増えること"},{"letter":"D","text":"腸間膜の脂肪が増生すること"},{"letter":"E","text":"全層性の狭窄が起こること"}],"answer":["C"],"multi":false,"explanation":"解説：全大腸炎型で罹病期間が長いほど，慢性炎症を背景とした癌化の危険が高まる．発症から一定期間を経たら定期的な大腸内視鏡でのサーベイランスを行い，異形成を早期に見つける．\n- A：瘻孔形成は全層性炎症を起こすCrohn病の合併症．\n- B：肛門周囲膿瘍もCrohn病に特徴的．\n- C：この疾患の長期合併症として正しい．\n- D：腸間膜脂肪の増生（fat wrapping）はCrohn病の所見．\n- E：全層性の狭窄もCrohn病でみられる．","images":[],"stem_images":[]},{"number":17,"section":"D-7-S05　3歳女児・排便の間隔が空く","question":"（1/4）3歳の女児．排便が4〜5日に1回となり，硬い便を痛がって出すという．半年前から続いている．保護者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"髪は何か月ごとに切りますか．"},{"letter":"B","text":"嘔吐や体重増加の不良はありますか．"},{"letter":"C","text":"排便を我慢する様子はありますか．"},{"letter":"D","text":"生まれてすぐ便が出ましたか．"},{"letter":"E","text":"食事や水分はとれていますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．整髪の頻度は便秘の評価に役立たない．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：整髪の頻度は便秘の評価に役立たない．この設問で選ぶ肢．\n- B：器質性疾患の警告徴候を確認．\n- C：便保持行動を確認．\n- D：先天性の排便障害を検討．\n- E：摂取状況を確認．","images":[],"stem_images":[]},{"number":18,"section":"D-7-S05　3歳女児・排便の間隔が空く","question":"（2/4）3歳の女児．排便が4〜5日に1回となり，硬い便を痛がって出すという．半年前から続いている．胎便は生後12時間以内に出て，乳児期の排便も順調だったという．成長曲線は正常である．この状態が続く機序はどれか．","options":[{"letter":"A","text":"腸管神経節細胞が欠如すること"},{"letter":"B","text":"甲状腺ホルモンが不足すること"},{"letter":"C","text":"排便時痛を恐れて我慢すること"},{"letter":"D","text":"腸管が全層性に狭窄すること"},{"letter":"E","text":"腸管に瘻孔が形成されること"}],"answer":["C"],"multi":false,"explanation":"解説：硬い便で痛い思いをすると子どもは排便を我慢するようになり，直腸に便が溜まってさらに硬く大きくなるという悪循環に入る．この悪循環を断つことが治療の目標になる．\n- A：神経節細胞の欠如はHirschsprung病で，新生児期から症状が出る．\n- B：甲状腺機能低下症では成長障害や活気低下を伴う．\n- C：機能性便秘の中心的な機序で正しい．\n- D：全層性の狭窄はCrohn病．\n- E：瘻孔形成もCrohn病の合併症．","images":[],"stem_images":[]},{"number":19,"section":"D-7-S05　3歳女児・排便の間隔が空く","question":"（3/4）3歳の女児．排便が4〜5日に1回となり，硬い便を痛がって出すという．半年前から続いている．胎便は生後12時間以内に出て，乳児期の排便も順調だったという．成長曲線は正常で，腹部は軟らかく膨隆もない．診察で確認すべきなのはどれか．","options":[{"letter":"A","text":"頸部リンパ節の腫脹の有無"},{"letter":"B","text":"甲状腺のびまん性腫大の有無"},{"letter":"C","text":"心尖部の収縮期雑音の有無"},{"letter":"D","text":"下腹部に触れる便塊の有無"},{"letter":"E","text":"両側足背動脈の拍動の有無"}],"answer":["D"],"multi":false,"explanation":"解説：直腸から下行結腸にかけて硬い便塊が触れるかどうかを確かめる．肛門周囲の視診で裂肛や位置異常も併せて見る．便塊が溜まっていれば，まず摘便や浣腸で取り除いてから維持療法に移る．\n- A：頸部リンパ節腫脹は感染症や悪性リンパ腫．\n- B：甲状腺腫大は甲状腺機能異常を疑うときに診るが，成長が正常な本例では優先度が下がる．\n- C：心尖部の収縮期雑音は弁膜症や短絡性心疾患．\n- D：便塊の貯留を直接確かめ正しい．\n- E：足背動脈の拍動は末梢動脈疾患の評価．","images":[],"stem_images":[]},{"number":20,"section":"D-7-S05　3歳女児・排便の間隔が空く","question":"（4/4）3歳の女児．排便が4〜5日に1回となり，硬い便を痛がって出すという．半年前から続いている．胎便は生後12時間以内に出て，乳児期の排便も順調だったという．成長曲線は正常で，腹部は軟らかく膨隆もない．下腹部に硬い便塊を触知し，肛門周囲に浅い裂創を認めた．治療方針として適切なのはどれか．","options":[{"letter":"A","text":"直ちに大腸内視鏡で精査する"},{"letter":"B","text":"便塊を除去してから緩下薬を続ける"},{"letter":"C","text":"止痢薬を投与して便を固める"},{"letter":"D","text":"水分摂取を1日500mLに制限する"},{"letter":"E","text":"食物繊維を完全に除いた食事にする"}],"answer":["B"],"multi":false,"explanation":"解説：まず貯留した便塊を浣腸や経口薬で取り除き，その後は便を柔らかく保つ緩下薬を数か月以上続けて排便の成功体験を積ませる．早期に中止すると再燃するため，十分な期間の維持が要る．\n- A：器質性を疑う所見がなく，まず治療を優先する．\n- B：悪循環を断つ標準的な進め方で正しい．\n- C：止痢薬は便秘を悪化させる．\n- D：水分制限は便をさらに硬くする．\n- E：食物繊維の除去も便量を減らし逆効果．","images":[],"stem_images":[]},{"number":21,"section":"D-7-S06　34歳男性・急な下痢と発熱","question":"（1/4）34歳の男性．2日前から水様下痢が1日8回あり，38℃台の発熱と腹痛を伴うという．本日は便に血が混じった．食品を介した感染への曝露を確認する質問はどれか．","options":[{"letter":"A","text":"発症前に何を食べましたか．"},{"letter":"B","text":"抗菌薬を飲んでいましたか．"},{"letter":"C","text":"海外へ行きましたか．"},{"letter":"D","text":"下痢の人の介護をしましたか．"},{"letter":"E","text":"川や池で泳ぎましたか．"}],"answer":["A"],"multi":false,"explanation":"解説：食歴と発症までの潜伏期の組合せが起因菌を絞る最大の手がかりになる．鶏肉と1〜7日ならCampylobacter，生卵と6〜48時間ならSalmonella，生の牛肉なら腸管出血性大腸菌を考える．\n- A：起因菌の推定に直結し有用．\n- B：薬剤性腸炎に関する情報．\n- C：渡航関連感染に関する情報．\n- D：人からの感染に関する情報．\n- E：環境水への曝露に関する情報．","images":[],"stem_images":[]},{"number":22,"section":"D-7-S06　34歳男性・急な下痢と発熱","question":"（2/4）34歳の男性．2日前から水様下痢 er":"B","text":"心尖部の拡張期ランブル"},{"letter":"C","text":"手掌紅斑とくも状血管腫"},{"letter":"D","text":"両下肺背側の吸気終末の捻髪音"},{"letter":"E","text":"甲状腺のびまん性の圧痛"}],"answer":["C"],"multi":false,"explanation":"解説：肝でのエストロゲン代謝が低下して末梢血管が拡張し，母指球・小指球の紅斑と，中心の細動脈から放射状に広がる血管腫が現れる．女性化乳房や睾丸萎縮も同じ機序による．\n- A：大砲A波は完全房室ブロック．\n- B：拡張期ランブルは僧帽弁狭窄症．\n- C：エストロゲン過剰を反映し正しい．\n- D：吸気終末の捻髪音は間質性肺炎．\n- E：甲状腺の圧痛は亜急性甲状腺炎．","images":[],"stem_images":[]},{"number":35,"section":"D-7-S09　58歳男性・腹部膨満と黄疸","question":"（3/4）58歳の男性．3か月前から腹が張り，最近は白目が黄色いと言われるという．下腿もむくむ．日本酒を毎日3合，30年間続けているという．手掌紅斑とくも状血管腫，腹水と脾腫を認める．血小板7.2万/μL，アルブミン2.6g/dL，総ビリルビン3.8mg/dL，プロトロンビン時間58%であった．直ちに行うべき検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡の施行"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"神経伝導速度の測定"}],"answer":["A"],"multi":false,"explanation":"解説：門脈圧亢進により食道胃静脈瘤が形成され，破裂すれば大量出血となる．内視鏡で静脈瘤の有無と出血の危険度（発赤所見）を評価し，必要なら予防的に結紮術や薬物療法を行う．\n- A：致死的合併症の予防に直結し正しい．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":36,"section":"D-7-S09　58歳男性・腹部膨満と黄疸","question":"（4/4）58歳の男性．3か月前から腹が張り，最近は白目が黄色いと言われるという．下腿もむくむ．日本酒を毎日3合，30年間続けているという．手掌紅斑とくも状血管腫，腹水と脾腫を認める．血小板7.2万/μL，アルブミン2.6g/dL，総ビリルビン3.8mg/dL，プロトロンビン時間58%であった．入院後に会話がかみ合わなくなり，手に羽ばたき振戦が出現した．直ちに開始すべき治療はどれか．","options":[{"letter":"A","text":"抗菌薬の全身投与のみ行う"},{"letter":"B","text":"副腎皮質ステロイドを点滴する"},{"letter":"C","text":"ラクツロースの投与を始める"},{"letter":"D","text":"高蛋白の栄養を積極的に与える"},{"letter":"E","text":"気管支拡張薬の吸入を始める"}],"answer":["C"],"multi":false,"explanation":"解説：腸内で酸性化とアンモニア産生菌の抑制が起こり，アンモニアの吸収が減る．誘因となる便秘・消化管出血・感染・脱水・電解質異常の検索と是正を同時に行う．分岐鎖アミノ酸の補充も用いる．\n- A：感染は誘因として重要だが，抗菌薬単独では本症状に対処できない．\n- B：ステロイドはこの病態の治療ではない．\n- C：肝性脳症に対する標準治療で正しい．\n- D：過剰な蛋白負荷はアンモニアを増やし症状を悪化させる．\n- E：気管支拡張薬は気道狭窄の治療．","images":[],"stem_images":[]},{"number":37,"section":"D-7-S10　56歳男性・連日の飲酒と肝障害","question":"（1/4）56歳の男性．健康診断でAST 128IU/L，ALT 62IU/L，γ-GTP 380IU/Lと指摘され来院した．身長170cm，体重88kg．アルコール摂取量を定量的に把握する質問はどれか．","options":[{"letter":"A","text":"飲酒で顔が赤くなりますか．"},{"letter":"B","text":"朝から飲みたくなりますか．"},{"letter":"C","text":"家族から飲酒を注意されますか．"},{"letter":"D","text":"週に何日，どれだけ飲みますか．"},{"letter":"E","text":"飲まないと手が震えますか．"}],"answer":["D"],"multi":false,"explanation":"解説：ASTがALTを上回りγ-GTPが著明に高い組合せはアルコール性を強く示唆する．飲酒量を純アルコール量として定量することで診断が支持され，断酒という治療方針にも直結する．\n- A：アルコールへの体質に関する情報．\n- B：依存に関する症状に関する情報．\n- C：周囲への影響に関する情報．\n- D：診断と治療の両方を規定し有用．\n- E：離脱症状に関する情報．","images":[],"stem_images":[]},{"number":38,"section":"D-7-S10　56歳男性・連日の飲酒と肝障害","question":"（2/4）56歳の男性．健康診断でAST 128IU/L，ALT 62IU/L，γ-GTP 380IU/Lと指摘され来院した．身長170cm，体重88kg．毎日ビール1Lと焼酎を飲み，休肝日はないという．ウイルスマーカーはすべて陰性であった．3か月の断酒後に予想される変化はどれか．","options":[{"letter":"A","text":"AST・ALTがさらに上昇する"},{"letter":"B","text":"γ-GTPは変化せず高値が続く"},{"letter":"C","text":"肝の線維化が不可逆的に進行する"},{"letter":"D","text":"黄疸が新たに出現してくる"},{"letter":"E","text":"AST・γ-GTPが明らかに低下する"}],"answer":["E"],"multi":false,"explanation":"解説：断酒によりγ-GTPは数週から数か月で半減し，トランスアミナーゼも下がる．改善が乏しければ他の原因の合併を考える．断酒後も改善しない線維化があれば非アルコール性の要因も評価する．\n- A：飲酒を止めれば肝逸脱酵素は下がる．\n- B：γ-GTPは断酒への反応が最も鋭敏な指標である．\n- C：脂肪肝や肝炎の段階なら断酒で可逆的に改善しうる．\n- D：改善する経過であり，黄疸の新規出現は予想されない．\n- E：断酒の効果として正しい．","images":[],"stem_images":[]},{"number":39,"section":"D-7-S10　56歳男性・連日の飲酒と肝障害","question":"（3/4）56歳の男性．健康診断でAST 128IU/L，ALT 62IU/L，γ-GTP 380IU/Lと指摘され来院した．身長170cm，体重88kg．毎日ビール1Lと焼酎を飲み，休肝日はないという．ウイルスマーカーはすべて陰性であった．断酒3か月でAST 48IU/L，γ-GTP 92IU/Lまで低下したが，ALTは58IU/Lと残った．空腹時血糖126mg/dL，中性脂肪248mg/dLである．残存する肝障害の背景はどれか．","options":[{"letter":"A","text":"自己免疫による胆管の破壊"},{"letter":"B","text":"銅の肝細胞内への蓄積"},{"letter":"C","text":"鉄の過剰な沈着"},{"letter":"D","text":"薬剤による直接の肝毒性"},{"letter":"E","text":"肥満と代謝異常に伴う脂肪化"}],"answer":["E"],"multi":false,"explanation":"解説：肥満・耐糖能異常・脂質異常を背景に肝へ脂肪が蓄積し，ALT優位の肝障害が続く．線維化が進めば肝硬変や肝細胞癌に至るため，減量と運動による生活習慣の是正が治療の中心になる．\n- A：自己免疫による胆管破壊は原発性胆汁性胆管炎で，ALP・γ-GTP優位になる．\n- B：銅の蓄積はWilson病で，若年発症と神経症状を伴う．\n- C：鉄の過剰沈着はヘモクロマトーシスで，皮膚色素沈着と糖尿病を伴う．\n- D：薬剤性は服薬との時間関係が明らかで，中止により改善する．\n- E：代謝因子が揃っており正しい．","images":[],"stem_images":[]},{"number":40,"section":"D-7-S10　56歳男性・連日の飲酒と肝障害","question":"（4/4）56歳の男性．健康診断でAST 128IU/L，ALT 62IU/L，γ-GTP 380IU/Lと指摘され来院した．身長170cm，体重88kg．毎日ビール1Lと焼酎を飲み，休肝日はないという．ウイルスマーカーはすべて陰性であった．断酒3か月でAST 48IU/L，γ-GTP 92IU/Lまで低下したが，ALTは58IU/Lと残った．空腹時血糖126mg/dL，中性脂肪248mg/dLである．最も優先すべき介入はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドの内服"},{"letter":"B","text":"減量と運動療法の継続"},{"letter":"C","text":"抗ウイルス薬の内服開始"},{"letter":"D","text":"抗菌薬の長期予防投与"},{"letter":"E","text":"水分摂取を1日500mLに制限"}],"answer":["B"],"multi":false,"explanation":"解説：体重の7〜10%の減量で肝の脂肪化と炎症が改善し，線維化の進行も抑えられる．有酸素運動とレジスタンス運動を組み合わせ，糖尿病と脂質異常の管理を並行して行う．\n- A：ステロイドは自己免疫性肝炎の治療．\n- B：この病態に対する最も確実な介入で正しい．\n- C：ウイルスマーカーが陰性であり抗ウイルス薬の適応はない．\n- D：抗菌薬は細菌感染の治療．\n- E：水分制限は脱水を招き，肝にも腎にも不利．","images":[],"stem_images":[]},{"number":41,"section":"D-7-S11　52歳女性・かゆみと肝機能異常","question":"（1/4）52歳の女性．1年前から全身のかゆみが続き，血液検査でALP 486IU/L，γ-GTP 268IU/L，AST 42IU/L，ALT 38IU/Lと指摘された．皮疹はない．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"腹痛や発熱はありますか．"},{"letter":"B","text":"便が白っぽくなりましたか．"},{"letter":"C","text":"目や口の乾きはありますか．"},{"letter":"D","text":"薬やサプリを飲んでいますか．"},{"letter":"E","text":"以前から足の爪が厚いですか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．爪の局所病変は胆汁うっ滞の原因検索では優先度が低い．\n- A：胆道感染・閉塞を検討．\n- B：胆汁排泄障害を確認．\n- C：自己免疫疾患の合併を検討．\n- D：薬剤性胆汁うっ滞を検討．\n- E：爪の局所病変は胆汁うっ滞の原因検索では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":42,"section":"D-7-S11　52歳女性・かゆみと肝機能異常","question":"（2/4）52歳の女性．1年前から全身のかゆみが続き，血液検査でALP 486IU/L，γ-GTP 268IU/L，AST 42IU/L，ALT 38IU/Lと指摘された．皮疹はない．目と口の乾燥があり，眼科でドライアイと言われたという．次に測定すべき自己抗体はどれか．","options":[{"letter":"A","text":"抗アセチルコリン受容体抗体"},{"letter":"B","text":"抗好中球細胞質抗体"},{"letter":"C","text":"抗基底膜抗体"},{"letter":"D","text":"抗ミトコンドリア抗体"},{"letter":"E","text":"抗デスモグレイン抗体"}],"answer":["D"],"multi":false,"explanation":"解説：小葉間胆管が自己免疫機序で破壊される疾患に特異性が高く，9割以上で陽性となる．診断は胆汁うっ滞型の検査所見，この抗体，肝生検の組織像のうち2つを満たすことで行う．\n- A：抗アセチルコリン受容体抗体は重症筋無力症．\n- B：抗好中球細胞質抗体はANCA関連血管炎．\n- C：抗基底膜抗体はGoodpasture症候群．\n- D：この疾患に特異性が高く正しい．\n- E：抗デスモグレイン抗体は天疱瘡．","images":[],"stem_images":[]},{"number":43,"section":"D-7-S11　52歳女性・かゆみと肝機能異常","question":"（3/4）52歳の女性．1年前から全身のかゆみが続き，血液検査でALP 486IU/L，γ-GTP 268IU/L，AST 42IU/L，ALT 38IU/Lと指摘された．皮疹はない．目と口の乾燥があり，眼科でドライアイと言われたという．抗ミトコンドリア抗体が陽性であった．第一選択の治療はどれか．","options":[{"letter":"A","text":"直接作用型抗ウイルス薬の内服"},{"letter":"B","text":"抗菌薬の長期予防的投与"},{"letter":"C","text":"ウルソデオキシコール酸の内服"},{"letter":"D","text":"免疫グロブリン大量療法の実施"},{"letter":"E","text":"血漿交換を繰り返し行う"}],"answer":["C"],"multi":false,"explanation":"解説：親水性の胆汁酸が疎水性胆汁酸による細胞傷害を減らし，胆汁分泌も促す．早期から続けると生化学的な改善が得られ，肝移植までの期間を延ばせる．掻痒には別に対症薬を用いる．\n- A：抗ウイルス薬はウイルス性肝炎の治療．\n- B：抗菌薬は細菌感染の治療．\n- C：この疾患の標準治療で正しい．\n- D：免疫グロブリン大量療法はGuillain-Barré症候群などに用いる．\n- E：血漿交換は血栓性血小板減少性紫斑病などの治療．","images":[],"stem_images":[]},{"number":44,"section":"D-7-S11　52歳女性・かゆみと肝機能異常","question":"（4/4）52歳の女性．1年前から全身のかゆみが続き，血液検査でALP 486IU/L，γ-GTP 268IU/L，AST 42IU/L，ALT 38IU/Lと指摘された．皮疹はない．目と口の乾燥があり，眼科でドライアイと言われたという．抗ミトコンドリア抗体が陽性であった．同じく自己免疫機序で起こるが，AST・ALT優位でIgG高値と抗核抗体陽性を示す肝疾患の治療はどれか．","options":[{"letter":"A","text":"直接作用型抗ウイルス薬"},{"letter":"B","text":"断酒と栄養療法のみ"},{"letter":"C","text":"副腎皮質ステロイド"},{"letter":"D","text":"鉄キレート薬の投与"},{"letter":"E","text":"銅キレート薬の投与"}],"answer":["C"],"multi":false,"explanation":"解説：自己免疫性肝炎は中年女性に多く，肝細胞障害型のパターンと高IgG血症，抗核抗体や抗平滑筋抗体の陽性を示す．ステロイドが著効し，効果があること自体が診断を支持する．\n- A：抗ウイルス薬はウイルス性肝炎の治療．\n- B：断酒と栄養療法はアルコール性肝障害の対応．\n- C：この疾患の第一選択で正しい．\n- D：鉄キレート薬はヘモクロマトーシスや鉄過剰症．\n- E：銅キレート薬はWilson病．","images":[],"stem_images":[]},{"number":45,"section":"D-7-S12　38歳女性・解熱薬内服後の肝障害","question":"（1/4）38歳の女性．10日前から発熱と咽頭痛で市販薬を飲んでいたが，本日の血液検査でAST 486IU/L，ALT 612IU/Lと著明な上昇を認めた．薬剤性肝障害の原因薬を特定するための質問はどれか．","options":[{"letter":"A","text":"毎日のお酒の量はどのくらいですか．"},{"letter":"B","text":"家族に肝臓病の人はいますか．"},{"letter":"C","text":"生肉を食べましたか．"},{"letter":"D","text":"飲んだ薬とサプリを教えてください．"},{"letter":"E","text":"海外へ行きましたか．"}],"answer":["D"],"multi":false,"explanation":"解説：処方薬だけでなく市販薬・健康食品・漢方・サプリメントが原因になる．開始時期と肝障害の出現時期の関係，過去の同薬での反応を確かめることが診断の柱で，被疑薬の中止が治療そのものになる．\n- A：飲酒関連肝障害に関する情報．\n- B：家族内感染などの背景に関する情報．\n- C：経口感染に関する情報．\n- D：原因の特定と治療に直結し有用．\n- E：渡航関連感染に関する情報．","images":[],"stem_images":[]},{"number":46,"section":"D-7-S12　38歳女性・解熱薬内服後の肝障害","question":"（2/4）38歳の女性．10日前から発熱と咽頭痛で市販薬を飲んでいたが，本日の血液検査でAST 486IU/L，ALT 612IU/Lと著明な上昇を認めた．市販の総合感冒薬と健康食品を併用していたという．この肝障害の型はどれか．","options":[{"letter":"A","text":"胆汁うっ滞型の肝障害"},{"letter":"B","text":"混合型の肝障害"},{"letter":"C","text":"血管閉塞型の肝障害"},{"letter":"D","text":"肉芽腫型の肝障害"},{"letter":"E","text":"肝細胞障害型の肝障害"}],"answer":["E"],"multi":false,"explanation":"解説：ALPに比してALTの上昇が著しい場合は肝細胞障害型に分類される．ALP優位なら胆汁うっ滞型，両者が同程度なら混合型で，型により経過と予後の見通しが変わる．\n- A：胆汁うっ滞型はALP・γ-GTPが優位に上がる．\n- B：混合型は両者が同程度に上がる．\n- C：血管閉塞型は肝類洞閉塞症候群など特殊な病態．\n- D：肉芽腫型は組織学的な分類で，検査値の型ではない．\n- E：ALT優位の著明な上昇に合致し正しい．","images":[],"stem_images":[]},{"number":47,"section":"D-7-S12　38歳女性・解熱薬内服後の肝障害","question":"（3/4）38歳の女性．10日前から発熱と咽頭痛で市販薬を飲んでいたが，本日の血液検査でAST 486IU/L，ALT 612IU/Lと著明な上昇を認めた．市販の総合感冒薬と健康食品を併用していたという．最も重要な対応はどれか．","options":[{"letter":"A","text":"副腎皮質ステロイドを直ちに開始する"},{"letter":"B","text":"被疑薬を中止して経過をみる"},{"letter":"C","text":"抗ウイルス薬の投与を開始する"},{"letter":"D","text":"抗菌薬の全身投与を開始する"},{"letter":"E","text":"経過をみて再度同じ薬を試す"}],"answer":["B"],"multi":false,"explanation":"解説：原因薬剤の中止が唯一かつ最大の治療で，多くは数週で改善する．改善しない場合や黄疸・凝固能低下が進む場合は重症化を疑い，専門施設での管理を考える．\n- A：ステロイドはアレルギー機序が強く疑われる重症例で検討するもので，まず中止が先．\n- B：原因除去にあたり正しい．\n- C：ウイルス性を除外したうえでの薬剤性であり，抗ウイルス薬は無効．\n- D：抗菌薬は細菌感染の治療で，むしろ肝障害を起こしうる．\n- E：再投与は重篤な肝障害を誘発する危険があり，診断目的でも原則行わない．","images":[],"stem_images":[]},{"number":48,"section":"D-7-S12　38歳女性・解熱薬内服後の肝障害","question":"（4/4）38歳の女性．10日前から発熱と咽頭痛で市販薬を飲んでいたが，本日の血液検査でAST 486IU/L，ALT 612IU/Lと著明な上昇を認めた．市販の総合感冒薬と健康食品を併用していたという．被疑薬をすべて中止した．2週後も改善せず，総ビリルビン8.2mg/dL，プロトロンビン時間34%となり意識が混濁してきた．この病態はどれか．","options":[{"letter":"A","text":"慢性肝炎への移行"},{"letter":"B","text":"胆道の完全な閉塞"},{"letter":"C","text":"門脈圧亢進による脳症"},{"letter":"D","text":"急性肝不全への進展"},{"letter":"E","text":"単なる検査値の変動"}],"answer":["D"],"multi":false,"explanation":"解説：プロトロンビン時間40%以下と肝性脳症の出現は急性肝不全を意味する．人工肝補助と全身管理を行いつつ，肝移植の適応を早期に評価する必要がある重篤な状態である．\n- A：慢性肝炎は6か月以上続く経過を指し，本例の急激な悪化とは異なる．\n- B：胆道閉塞では直接ビリルビンとALPが上がり，凝固能はここまで落ちない．\n- C：門脈圧亢進による脳症は肝硬変の経過で起こる．\n- D：凝固能低下と脳症の出現から正しい．\n- E：凝固能低下と意識障害は明らかな臓器不全の徴候である．","images":[],"stem_images":[]},{"number":49,"section":"D-7-S13　58歳女性・食後の右季肋部痛","question":"（1/4）58歳の女性．昨夜，揚げ物を食べた2時間後から右の肋骨の下が強く痛み，右肩にも響いたという．同様のことが過去にもあった．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"痛みは何時間続きましたか．"},{"letter":"B","text":"脂っこい食事の後に繰り返しますか．"},{"letter":"C","text":"発熱や悪寒はありますか．"},{"letter":"D","text":"尿が濃くなりましたか．"},{"letter":"E","text":"排便後に肛門が痛みますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．肛門局所症状は右季肋部痛の初期鑑別では優先度が低い．\n- A：一過性の疝痛と持続性炎症を区別．\n- B：発作の誘因と反復性を確認．\n- C：胆道感染の合併を確認．\n- D：胆道閉塞に伴う黄疸を検討．\n- E：肛門局所症状は右季肋部痛の初期鑑別では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":50,"section":"D-7-S13　58歳女性・食後の右季肋部痛","question":"（2/4）58歳の女性．昨夜，揚げ物を食べた2時間後から右の肋骨の下が強く痛み，右肩にも響いたという．同様のことが過去にもあった．今回は12時間続いており，38.6℃の発熱を伴う．認められる所見はどれか．","options":[{"letter":"A","text":"左下腹部の限局した圧痛"},{"letter":"B","text":"腸雑音の金属性の亢進"},{"letter":"C","text":"臍周囲の拍動性腫瘤"},{"letter":"D","text":"吸気時に止まる右季肋部の圧痛"},{"letter":"E","text":"右下腹部の圧痛と反跳痛"}],"answer":["D"],"multi":false,"explanation":"解説：右季肋部を圧迫しながら深呼吸させると，炎症を起こした胆嚢底が指に当たって痛みで吸気が止まる．これがMurphy徴候で，発熱と白血球増多と併せて急性胆嚢炎の診断を支える．\n- A：左下腹部の限局した圧痛は大腸憩室炎．\n- B：金属性腸雑音は腸閉塞．\n- C：拍動性腫瘤は腹部大動脈瘤．\n- D：胆嚢の炎症を示し正しい．\n- E：右下腹部の圧痛と反跳痛は急性虫垂炎．","images":[],"stem_images":[]},{"number":51,"section":"D-7-S13　58歳女性・食後の右季肋部痛","question":"（3/4）58歳の女性．昨夜，揚げ物を食べた2時間後から右の肋骨の下が強く痛み，右肩にも響いたという．同様のことが過去にもあった．今回は12時間続いており，38.6℃の発熱を伴う．Murphy徴候が陽性である．白血球15800/μL，CRP 9.2mg/dL．まず行うべき検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡の施行"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"腹部超音波検査の施行"}],"answer":["E"],"multi":false,"explanation":"解説：胆嚢の腫大，壁の肥厚，結石とその音響陰影，胆嚢周囲の液体貯留を非侵襲的に描出できる．プローブで圧迫しながら痛みを確認する超音波Murphy徴候も併せて評価できる．\n- A：内視鏡は上部消化管の評価で，胆嚢は見えない．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：この病態の第一選択の画像検査で正しい．","images":[],"stem_images":[]},{"number":52,"section":"D-7-S13　58歳女性・食後の右季肋部痛","question":"（4/4）58歳の女性．昨夜，揚げ物を食べた2時間後から右の肋骨の下が強く痛み，右肩にも響いたという．同様のことが過去にもあった．今回は12時間続いており，38.6℃の発熱を伴う．Murphy徴候が陽性である．白血球15800/μL，CRP 9.2mg/dL．腹部超音波で胆嚢の腫大と壁肥厚，内部に結石を認めた．この患者に黄疸が加わった場合に考えるべきなのはどれか．","options":[{"letter":"A","text":"胃の出口が腫瘍で閉塞したこと"},{"letter":"B","text":"膵管が狭窄して膵炎を起こしたこと"},{"letter":"C","text":"虫垂が穿孔して膿瘍を作ったこと"},{"letter":"D","text":"結石が総胆管に落ちて胆管炎になったこと"},{"letter":"E","text":"大腸の憩室が穿孔したこと"}],"answer":["D"],"multi":false,"explanation":"解説：発熱・黄疸・右季肋部痛のCharcot三徴が揃えば急性胆管炎で，これに意識障害とショックが加わればReynolds五徴となり致死的である．内視鏡的胆道ドレナージを急ぐ必要がある．\n- A：胃の出口の閉塞では嘔吐が主症状で，黄疸は説明できない．\n- B：膵炎では上腹部痛が背部に放散し，膵酵素が上昇する．\n- C：虫垂穿孔では右下腹部の腹膜刺激徴候が前景に立つ．\n- D：既存の結石と黄疸の組合せから最も考えられ正しい．\n- E：憩室穿孔では左下腹部痛と腹膜刺激徴候をきたす．","images":[],"stem_images":[]},{"number":53,"section":"D-7-S14　64歳男性・黄疸と発熱","question":"（1/4）64歳の男性．3日前から尿が濃くなり，本日は白目が黄色く，39℃の発熱と上腹部痛があるという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"胆石と言われたことがありますか．"},{"letter":"B","text":"強い悪寒や震えはありますか．"},{"letter":"C","text":"数年前から食後に胸やけがしますか．"},{"letter":"D","text":"便が白っぽくなりましたか．"},{"letter":"E","text":"意識や尿量に変化はありますか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．慢性胸やけは急な黄疸と高熱の緊急評価では優先度が低い．\n- A：胆道閉塞の背景を確認．\n- B：菌血症を疑う症状を確認．\n- C：慢性胸やけは急な黄疸と高熱の緊急評価では優先度が低い．この設問で選ぶ肢．\n- D：胆汁排泄障害を確認．\n- E：臓器障害と重症度を評価．","images":[],"stem_images":[]},{"number":54,"section":"D-7-S14　64歳男性・黄疸と発熱","question":"（2/4）64歳の男性．3日前から尿が濃くなり，本日は白目が黄色く，39℃の発熱と上腹部痛があるという．便は灰白色になったという．予想される検査所見はどれか．","options":[{"letter":"A","text":"間接ビリルビン優位の上昇"},{"letter":"B","text":"ハプトグロビンの著明な低下"},{"letter":"C","text":"網赤血球の著明な増加"},{"letter":"D","text":"直接ビリルビンとALPの上昇"},{"letter":"E","text":"血清アンモニアの著明な上昇"}],"answer":["D"],"multi":false,"explanation":"解説：肝で抱合された後に排泄が妨げられるため直接ビリルビンが上がり，胆管上皮由来のALPとγ-GTPも上昇する．肝細胞障害型に比べAST・ALTの上昇は相対的に軽い．\n- A：間接ビリルビン優位の上昇は溶血性黄疸や体質性黄疸．\n- B：ハプトグロビンの低下は血管内溶血．\n- C：網赤血球の増加も溶血に対する骨髄の反応．\n- D：閉塞性黄疸の典型的な所見で正しい．\n- E：アンモニアの著明な上昇は肝性脳症．","images":[],"stem_images":[]},{"number":55,"section":"D-7-S14　64歳男性・黄疸と発熱","question":"（3/4）64歳の男性．3日前から尿が濃くなり，本日は白目が黄色く，39℃の発熱と上腹部痛があるという．便は灰白色になったという．総ビリルビン7.8mg/dL（直接6.2mg/dL），ALP 682IU/L，γ-GTP 412IU/L．腹部超音波で総胆管の拡張を認めた．閉塞の原因の描出に最も有用な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"睡眠ポリグラフィの施行"},{"letter":"D","text":"神経伝導速度の測定"},{"letter":"E","text":"磁気共鳴胆管膵管撮影"}],"answer":["E"],"multi":false,"explanation":"解説：造影剤を使わずに胆管と膵管の走行を立体的に描出でき，結石・腫瘍・狭窄の部位と数を非侵襲的に評価できる．治療が必要なら内視鏡的逆行性胆管膵管造影に進んで処置を行う．\n- A：骨シンチグラフィは骨病変の検索．\n- B：呼吸機能検査は換気障害の評価．\n- C：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- D：神経伝導速度は末梢神経障害の評価．\n- E：胆管内の閉塞原因を非侵襲的に描出でき正しい．","images":[],"stem_images":[]},{"number":56,"section":"D-7-S14　64歳男性・黄疸と発熱","question":"（4/4）64歳の男性．3日前から尿が濃くなり，本日は白目が黄色く，39℃の発熱と上腹部痛があるという．便は灰白色になったという．総ビリルビン7.8mg/dL（直接6.2mg/dL），ALP 682IU/L，γ-GTP 412IU/L．腹部超音波で総胆管の拡張を認めた．磁気共鳴胆管膵管撮影で総胆管に結石を認めた．血圧は82/48mmHgで意識も混濁してきた．直ちに行うべきなのはどれか．","options":[{"letter":"A","text":"経過観察のうえ待機手術とする"},{"letter":"B","text":"抗菌薬のみで数日様子をみる"},{"letter":"C","text":"鎮痛薬を増量して疼痛を抑える"},{"letter":"D","text":"内視鏡的な胆道ドレナージ"},{"letter":"E","text":"大量輸液のみで血圧を維持する"}],"answer":["D"],"multi":false,"explanation":"解説：閉塞した胆道内の圧が上がって細菌が血中へ移行し，敗血症性ショックに至っている．抗菌薬と全身管理を行いつつ，速やかに胆道の圧を下げるドレナージを行うことが救命につながる．\n- A：待機している間にショックが進行する．\n- B：閉塞を解除しない限り抗菌薬だけでは制御できない．\n- C：鎮痛では原因が解決しない．\n- D：閉塞の解除が救命の鍵で正しい．\n- E：輸液は支持療法で，減圧の代わりにはならない．","images":[],"stem_images":[]},{"number":57,"section":"D-7-S15　46歳男性・背部に抜ける上腹部痛","question":"（1/4）46歳の男性．昨夜から上腹部が持続して痛み，背中にも抜けるという．嘔吐を伴い，前かがみになると少し楽だという．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"胆石と言われたことがありますか．"},{"letter":"B","text":"痛みは突然最強になりましたか．"},{"letter":"C","text":"尿量が減っていませんか．"},{"letter":"D","text":"普段のお酒の量はどのくらいですか．"},{"letter":"E","text":"以前から排便時に肛門が痛みますか．"}],"answer":["E"],"multi":false,"explanation":"解説：Eが正答．慢性肛門痛は今回の上腹部痛の緊急鑑別では優先度が低い．\n- A：胆石性膵炎の背景を確認．\n- B：大血管病変などとの鑑別に有用．\n- C：脱水や循環不全を評価．\n- D：膵炎の誘因を検討．\n- E：慢性肛門痛は今回の上腹部痛の緊急鑑別では優先度が低い．この設問で選ぶ肢．","images":[],"stem_images":[]},{"number":58,"section":"D-7-S15　46歳男性・背部に抜ける上腹部痛","question":"（2/4）46歳の男性．昨夜から上腹部が持続して痛み，背中にも抜けるという．嘔吐を伴い，前かがみになると少し楽だという．日本酒を毎日4合，20年間飲んでいるという．最も上昇している可能性が高い検査値はどれか．","options":[{"letter":"A","text":"血中アンモニアの値"},{"letter":"B","text":"心筋トロポニンTの値"},{"letter":"C","text":"血清クレアチンキナーゼ"},{"letter":"D","text":"血清アミラーゼとリパーゼ"},{"letter":"E","text":"直接ビリルビンの値"}],"answer":["D"],"multi":false,"explanation":"解説：膵の腺房細胞が破壊されて消化酵素が血中へ漏れ出る．リパーゼのほうが特異度が高く上昇も長く続く．アミラーゼは唾液腺疾患や腸管穿孔でも上がるため，画像所見と合わせて判断する．\n- A：アンモニアの上昇は肝性脳症．\n- B：トロポニンの上昇は心筋傷害．\n- C：クレアチンキナーゼは骨格筋や心筋の傷害．\n- D：膵の逸脱酵素として正しい．\n- E：直接ビリルビンの上昇は閉塞性黄疸．","images":[],"stem_images":[]},{"number":59,"section":"D-7-S15　46歳男性・背部に抜ける上腹部痛","question":"（3/4）46歳の男性．昨夜から上腹部が持続して痛み，背中にも抜けるという．嘔吐を伴い，前かがみになると少し楽だという．日本酒を毎日4合，20年間飲んでいるという．血清アミラーゼ1280IU/L，リパーゼ982IU/L．重症度の判定と合併症の評価に最も有用な検査はどれか．","options":[{"letter":"A","text":"上部消化管内視鏡の施行"},{"letter":"B","text":"呼吸機能検査の施行"},{"letter":"C","text":"骨シンチグラフィの撮影"},{"letter":"D","text":"腹部造影CTの撮影"},{"letter":"E","text":"睡眠ポリグラフィの施行"}],"answer":["D"],"multi":false,"explanation":"解説：造影されない壊死領域の範囲，膵周囲の液体貯留，炎症の広がりを評価して重症度を判定する．臓器不全の有無と併せて重症例を拾い上げ，集中治療と大量輸液の方針を決める．\n- A：内視鏡は胆石性の場合の処置には関わるが，重症度判定にはならない．\n- B：呼吸機能検査は換気障害の評価．\n- C：骨シンチグラフィは骨病変の検索．\n- D：壊死範囲と局所合併症を評価でき正しい．\n- E：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．","images":[],"stem_images":[]},{"number":60,"section":"D-7-S15　46歳男性・背部に抜ける上腹部痛","question":"（4/4）46歳の男性．昨夜から上腹部が持続して痛み，背中にも抜けるという．嘔吐を伴い，前かがみになると少し楽だという．日本酒を毎日4合，20年間飲んでいるという．血清アミラーゼ1280IU/L，リパーゼ982IU/L．腹部造影CTで膵の腫大と周囲の液体貯留を認めた．飲酒を続けた場合に至る慢性の病態はどれか．","options":[{"letter":"A","text":"膵に石灰化が生じ脂肪便と糖尿病"},{"letter":"B","text":"胆管が瘢痕で狭窄し黄疸が続く"},{"letter":"C","text":"食道の粘膜が扁平上皮化生する"},{"letter":"D","text":"大腸の憩室が多発して出血する"},{"letter":"E","text":"肝内に銅が沈着して神経症状が出る"}],"answer":["A"],"multi":false,"explanation":"解説：炎症の反復で膵実質が線維化・石灰化し，外分泌不全による脂肪便と体重減少，内分泌不全による膵性糖尿病をきたす．疼痛管理と消化酵素の補充，断酒の徹底が管理の柱になる．\n- A：慢性化した場合の帰結として正しい．\n- B：胆管の瘢痕性狭窄は原発性硬化性胆管炎や術後に起こる．\n- C：食道の扁平上皮化生ではなく円柱上皮化生（Barrett食道）が胃食道逆流症で起こる．\n- D：大腸憩室の多発は加齢と食生活が背景で，膵炎とは無関係．\n- E：肝内の銅沈着はWilson病．","images":[],"stem_images":[]},{"number":61,"section":"D-7-S16　68歳男性・左下腹部痛と発熱","question":"（1/4）68歳の男性．2日前から左下腹部が痛み，38℃台の発熱があるという．便通は普段から不規則だという．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"便に血が混じっていますか．"},{"letter":"B","text":"同じ痛みが以前にもありましたか．"},{"letter":"C","text":"下痢や便秘が増えましたか．"},{"letter":"D","text":"食後に胸やけがしますか．"},{"letter":"E","text":"排尿痛や頻尿はありますか．"}],"answer":["D"],"multi":false,"explanation":"解説：Dが正答．逆流症状は発熱を伴う左下腹部痛の初期鑑別では優先度が低い．他の4項目は，この段階で鑑別や重症度を判断するために確認する．\n- A：虚血性・炎症性腸疾患を検討．\n- B：反復性の炎症を検討．\n- C：便通の変化を確認．\n- D：逆流症状は発熱を伴う左下腹部痛の初期鑑別では優先度が低い．この設問で選ぶ肢．\n- E：尿路疾患や周囲への炎症波及を検討．","images":[],"stem_images":[]},{"number":62,"section":"D-7-S16　68歳男性・左下腹部痛と発熱","question":"（2/4）68歳の男性．2日前から左下腹部が痛み，38℃台の発熱があるという．便通は普段から不規則だという．5年前の大腸内視鏡でS状結腸に多数の憩室を指摘されたという．認められる所見はどれか．","options":[{"letter":"A","text":"右季肋部の吸気時に止まる圧痛"},{"letter":"B","text":"腸雑音の金属性の亢進"},{"letter":"C","text":"臍周囲の拍動性腫瘤"},{"letter":"D","text":"右下腹部の圧痛と反跳痛"},{"letter":"E","text":"左下腹部の限局した圧痛"}],"answer":["E"],"multi":false,"explanation":"解説：炎症を起こした憩室の部位に一致して限局した圧痛があり，進行すれば同部に腫瘤様の硬結を触れる．腹膜刺激徴候が広がっていれば穿孔や膿瘍形成を疑って画像で確かめる．\n- A：吸気時に止まる右季肋部の圧痛は急性胆嚢炎のMurphy徴候．\n- B：金属性腸雑音は腸閉塞．\n- C：拍動性腫瘤は腹部大動脈瘤．\n- D：右下腹部の圧痛と反跳痛は急性虫垂炎．\n- E：病変部位に一致し正しい．","images":[],"stem_images":[]},{"number":63,"section":"D-7-S16　68歳男性・左下腹部痛と発熱","question":"（3/4）68歳の男性．2日前から左下腹部が痛み，38℃台の発熱があるという．便通は普段から不規則だという．5年前の大腸内視鏡でS状結腸に多数の憩室を指摘されたという．左下腹部に限局した圧痛を認める．白血球13400/μL，CRP 7.8mg/dL．この時期に避けるべき検査はどれか．","options":[{"letter":"A","text":"腹部造影CTの撮影"},{"letter":"B","text":"血液培養の採取"},{"letter":"C","text":"大腸内視鏡の施行"},{"letter":"D","text":"腹部超音波検査の施行"},{"letter":"E","text":"尿検査の実施"}],"answer":["C"],"multi":false,"explanation":"解説：急性期は腸管壁が脆弱で，送気による内圧上昇が穿孔を招く危険がある．炎症が落ち着いてから大腸癌の除外を兼ねて行うのが原則で，急性期の評価はCTで代替する．\n- A：造影CTは膿瘍や穿孔の評価に必須で，行うべき検査．\n- B：血液培養は菌血症の評価として妥当．\n- C：急性期の送気は穿孔の危険があり正しい．\n- D：腹部超音波も非侵襲的で問題ない．\n- E：尿路感染との鑑別に尿検査は有用．","images":[],"stem_images":[]},{"number":64,"section":"D-7-S16　68歳男性・左下腹部痛と発熱","question":"（4/4）68歳の男性．2日前から左下腹部が痛み，38℃台の発熱があるという．便通は普段から不規則だという．5年前の大腸内視鏡でS状結腸に多数の憩室を指摘されたという．左下腹部に限局した圧痛を認める．白血球13400/μL，CRP 7.8mg/dL．造影CTで憩室周囲の脂肪織濃度上昇を認めたが，膿瘍や遊離ガスはなかった．最も適切な治療はどれか．","options":[{"letter":"A","text":"直ちに開腹して腸管を切除する"},{"letter":"B","text":"止痢薬で便通を止めて安静にする"},{"letter":"C","text":"大量の食物繊維を直ちに追加する"},{"letter":"D","text":"絶食と補液，抗菌薬で保存的に治す"},{"letter":"E","text":"浣腸で腸管内容を排出させる"}],"answer":["D"],"multi":false,"explanation":"解説：膿瘍も穿孔もない単純性の炎症は，腸管の安静と抗菌薬で多くが軽快する．改善後に大腸内視鏡で悪性腫瘍を除外し，再発予防として食物繊維の摂取と便通の管理を指導する．\n- A：合併症のない例に緊急手術の適応はない．\n- B：止痢薬は腸管内圧を上げ，炎症の局在化を妨げうる．\n- C：急性期の食物繊維追加は腸管を刺激する．落ち着いてから再発予防として行う．\n- D：標準的な保存療法で正しい．\n- E：浣腸は腸管内圧を上げ穿孔を誘発しうる．","images":[],"stem_images":[]},{"number":65,"section":"D-7-S17　32歳女性・繰り返す腹痛と便通異常","question":"（1/4）32歳の女性．2年前から下腹部の痛みと，下痢と便秘を繰り返す便通異常が続くという．仕事が忙しい時期に悪化する．腹痛と排便の関連を評価するための質問はどれか．","options":[{"letter":"A","text":"痛む場所はいつも同じですか．"},{"letter":"B","text":"夜中に痛みで起きますか．"},{"letter":"C","text":"何を食べると悪化しますか．"},{"letter":"D","text":"体重が減っていませんか．"},{"letter":"E","text":"痛みは排便で変わりますか．"}],"answer":["E"],"multi":false,"explanation":"解説：排便によって腹痛が軽快する，あるいは排便の頻度や便形状の変化と関連して腹痛が起こることが，この病態の診断基準の中核をなす．器質的疾患ではこの関連が明確でないことが多い．\n- A：痛みの部位に関する情報．\n- B：警告症状に関する情報．\n- C：食事との関係に関する情報．\n- D：警告症状に関する情報．\n- E：診断基準の中核を確かめ有用．","images":[],"stem_images":[]},{"number":66,"section":"D-7-S17　32歳女性・繰り返す腹痛と便通異常","question":"（2/4）32歳の女性．2年前から下腹部の痛みと，下痢と便秘を繰り返す便通異常が続くという．仕事が忙しい時期に悪化する．腹痛は排便すると軽くなるという．器質的疾患を疑うべき所見はどれか．","options":[{"letter":"A","text":"症状が仕事の忙しさで変動すること"},{"letter":"B","text":"下痢と便秘を交互に繰り返すこと"},{"letter":"C","text":"腹痛が排便で軽快すること"},{"letter":"D","text":"夜間に目が覚めるほどの症状と体重減少"},{"letter":"E","text":"排便後に残便感が残ること"}],"answer":["D"],"multi":false,"explanation":"解説：夜間症状・体重減少・血便・発熱・貧血・50歳以上での新規発症・大腸癌の家族歴は赤旗徴候で，これらがあれば機能性と決めつけず器質的疾患の検索に進む．\n- A：ストレスによる変動は機能性に典型的である．\n- B：下痢と便秘の交代も機能性でよくみられる．\n- C：排便による軽快は診断基準そのもの．\n- D：器質的疾患を示唆する赤旗徴候で正しい．\n- E：残便感も機能性の症状の一つ．","images":[],"stem_images":[]},{"number":67,"section":"D-7-S17　32歳女性・繰り返す腹痛と便通異常","question":"（3/4）32歳の女性．2年前から下腹部の痛みと，下痢と便秘を繰り返す便通異常が続くという．仕事が忙しい時期に悪化する．腹痛は排便すると軽くなるという．夜間の症状も体重減少もなく，血液検査と便潜血に異常を認めない．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに開腹手術を計画する"},{"letter":"B","text":"抗菌薬を長期に予防投与する"},{"letter":"C","text":"副腎皮質ステロイドを開始する"},{"letter":"D","text":"生活指導と食事療法から始める"},{"letter":"E","text":"免疫抑制薬の導入を検討する"}],"answer":["D"],"multi":false,"explanation":"解説：規則正しい食事と睡眠，運動，発酵性の糖質を減らす食事の工夫から始め，必要に応じて消化管運動調節薬やプロバイオティクスを加える．症状と病態を説明して安心させること自体が治療になる．\n- A：器質的病変がなく手術の適応はない．\n- B：抗菌薬の長期投与は腸内細菌叢を乱すだけである．\n- C：ステロイドは炎症性腸疾患の治療．\n- D：この病態の標準的な初期対応で正しい．\n- E：免疫抑制薬も炎症性腸疾患などに用いる．","images":[],"stem_images":[]},{"number":68,"section":"D-7-S17　32歳女性・繰り返す腹痛と便通異常","question":"（4/4）32歳の女性．2年前から下腹部の痛みと，下痢と便秘を繰り返す便通異常が続くという．仕事が忙しい時期に悪化する．腹痛は排便すると軽くなるという．夜間の症状も体重減少もなく，血液検査と便潜血に異常を認めない．仮にこの患者が顔面紅潮と水様下痢を反復し，尿中5-HIAAが高値であった場合に考えるべきなのはどれか．","options":[{"letter":"A","text":"甲状腺機能が亢進していること"},{"letter":"B","text":"消化管の神経内分泌腫瘍"},{"letter":"C","text":"副腎皮質の機能が低下すること"},{"letter":"D","text":"下垂体の腫瘍があること"},{"letter":"E","text":"副甲状腺の機能が亢進すること"}],"answer":["B"],"multi":false,"explanation":"解説：セロトニンなどの生理活性物質を産生する腫瘍が，顔面紅潮・水様下痢・喘鳴・右心系の弁膜症をきたす．代謝産物である5-HIAAの尿中排泄が増えるため，機能性との鑑別の手がかりになる．\n- A：甲状腺機能亢進症では頻脈・体重減少・振戦が前景に立つ．\n- B：5-HIAA高値と症状の組合せに合致し正しい．\n- C：副腎皮質機能低下症では低血圧・色素沈着・低ナトリウム血症をきたす．\n- D：下垂体腫瘍では視野障害やホルモン過剰・欠乏の症状が出る．\n- E：副甲状腺機能亢進症では高カルシウム血症による症状が出る．","images":[],"stem_images":[]}],"seed":null},{"id":"D-8_腎尿路系","name":"D-8_腎尿路系.md","label":"D-8 腎尿路系","count":60,"sourceHash":"577137006993","questions":[{"number":1,"section":"D-8-S01　72歳男性・尿量の減少","question":"（1/4）72歳の男性．3日前から尿量が減り，だるさが続くという．先週から発熱と下痢で食事がとれていなかった．この患者に聞くべきことを4つ選んだときに残るのはどれか．","options":[{"letter":"A","text":"現在の薬を教えてください．"},{"letter":"B","text":"尿意があっても出ませんか．"},{"letter":"C","text":"以前から遠くの字が見えにくいですか．"},{"letter":"D","text":"水分はどれくらいとれますか．"},{"letter":"E","text":"以前の腎機能はどうでしたか．"}],"answer":["C"],"multi":false,"explanation":"解説：Cが正答．屈折異常は乏尿の原因検索では優先度が低い．\n- A：腎血流や腎実質に影響する薬剤を確認．\n- B：尿路閉塞を検討．\n- C：屈折異常は乏尿の原因検索では優先度が低い．この設問で選ぶ肢．\n- D：体液喪失と補給を評価．\n- E：急性変化と慢性障害を区別．","images":[],"stem_images":[]},{"number":2,"section":"D-8-S01　72歳男性・尿量の減少","question":"（2/4）72歳の男性．3日前から尿量が減り，だるさが続くという．先週から発熱と下痢で食事がとれていなかった．高血圧でアンジオテンシン受容体拮抗薬を，腰痛で非ステロイド性抗炎症薬を内服していたという．認められる所見はどれか．","options":[{"letter":"A","text":"下腿の圧痕性浮腫と頸静脈怒張"},{"letter":"B","text":"腹部全体の板状硬と反跳痛"},{"letter":"C","text":"腋窩の乾燥とツルゴールの低下"},{"letter":"D","text":"甲状腺のびまん性の圧痛"},{"letter":"E","text":"両下肢の腱反射の全般的消失"}],"answer":["C"],"multi":false,"explanation":"解説：下痢と食事摂取不良で細胞外液が減っており，口腔粘膜と腋窩の乾燥，皮膚のツルゴール低下，頻脈，起立性低血圧がみられる．体液量の評価が腎前性か腎性かを分ける最初の手がかりになる．\n- A：浮腫と頸静脈怒張は体液量の増加を示し，心不全や腎性の体液貯留．\n- B：板状硬と反跳痛は汎発性腹膜炎．\n- C：細胞外液の減少を反映し正しい．\n- D：甲状腺の圧痛は亜急性甲状腺炎．\n- E：腱反射の全般的消失は末梢神経障害．","images":[],"stem_images":[]},{"number":3,"section":"D-8-S01　72歳男性・尿量の減少","question":"（3/4）72歳の男性．3日前から尿量が減り，だるさが続くという．先週から発熱と下痢で食事がとれていなかった．高血圧でアンジオテンシン受容体拮抗薬を，腰痛で非ステロイド性抗炎症薬を内服していたという．腋窩は乾燥し皮膚のツルゴールが低下している．血清クレアチニン2.8mg/dL（前回0.9mg/dL）．鑑別に最も有用な検査はどれか．","options":[{"letter":"A","text":"骨シンチグラフィの撮影"},{"letter":"B","text":"尿中ナトリウムと尿浸透圧"},{"letter":"C","text":"呼吸機能検査の施行"},{"letter":"D","text":"睡眠ポリグラフィの施行"},{"letter":"E","text":"神経伝導速度の測定"}],"answer":["B"],"multi":false,"explanation":"解説：腎前性では尿細管が必死にナトリウムと水を再吸収するため，尿中Naは低く尿浸透圧は高くなる．ナトリウム排泄分画が1%未満なら腎前性を示唆する．腎性では再吸収能が落ちて両者が逆になる．\n- A：骨シンチグラフィは骨病変の検索．\n- B：腎前性と腎性を分ける指標で正しい．\n- C：呼吸機能検査は換気障害の評価．\n- D：睡眠ポリグラフィは睡眠時無呼吸症候群の検査．\n- E：神経伝導速度は末梢神経障害の評価．","images":[],"stem_images":[]},{"number":4,"section":"D-8-S01　72歳男性・尿量の減少","question":"（4/4）72歳の男性．3日前から尿量が減り，だるさが続くという．先週から発熱と下痢で食事がとれていなかった．高血圧でアンジオテンシン受容体拮抗薬を，腰痛で非ステロイド性抗炎症薬を内服していたという．腋窩は乾燥し皮膚のツルゴールが低下している．血清クレアチニン2.8mg/dL（前回0.9mg/dL）．尿中Na 12mEq/L，尿浸透圧620mOsm/kg，腎超音波で水腎症はなかった．最も適切な対応はどれか．","options":[{"letter":"A","text":"直ちに血液透析を導入する"},{"letter":"B","text":"利尿薬を増量して尿量を確保する"},{"letter":"C","text":"被疑薬を中止し細胞外液を補充する"},{"letter":"D","text":"蛋白質の摂取を大幅に増やす"},{"letter":"E","text":"水分摂取を1日500mLに制限する"}],"answer":["C"],"multi":false,"explanation":"解説：原因薬剤を止めて有効循環血漿量を戻せば腎機能は回復する．非ステロイド性抗炎症薬は輸入細動脈を，レニンアンジオテンシン系阻害薬は輸出細動脈を収縮・拡張させ，脱水下で糸球体濾過圧を保てなくする．\n- A：この時点で透析の絶対適応はなく，可逆的な要因の是正が先．\n- B：利尿薬はさらに循環血漿量を減らし悪化させる．\n- C：原因の除去と体液の補充で正しい．\n- D：過剰な蛋白負荷は窒素負荷を増やす．\n- E：水分制限は脱水を悪化させる．","images":[],"stem_images":[]},{"number":5,"section":"D-8-S02　66歳男性・健診で腎機能低下","question":"（1/4）66歳の男性．健康診断で血清クレアチニン1.9mg/dL，eGFR 29mL/分/1.73m2と指摘され来院した．自覚症状はない．この時点の医療面接で優先度が最も低い質問はどれか．","options":[{"letter":"A","text":"子どもの頃に鼻血が出ましたか．"},{"letter":"B","text":"糖尿病や高血圧はありますか．"},{"letter":"C","text":"尿が出にくくなりましたか．"},{"letter":"D","text":"以前の腎機能検査はありますか．"},{"letter":"E","text":"鎮痛薬やサプリを使いますか．"}],"answer":["A"],"multi":false,"explanation":"解説：Aが正答．過去の鼻出血は現在の腎機能低下の初期評価では優先度が低い．\n- A：過去の鼻出血は現在の腎機能低下の初期評価では優先度が低い．この設問で選ぶ肢．\n- B：頻度の高い原因疾患を確認．\n- C：閉塞性の原因を検討．\n- D：慢性か急性かを区別．\n- E：腎毒性のある薬剤を確認．","images":[],"stem_images":[]},{"number":6,"section":"D-8-S02　66歳男性・健診で腎機能低下","question":"（2/4）66歳の男性．健康診断で血清クレアチニン1.9mg/dL，eGFR 29mL/分/1.73m2と指摘され来院した．自覚症状はない．20年前から高血圧で治療中だが，通院は不規則だったという．予想される血液検査所見はどれか．","options":[{"letter":"A","text":"小球性低色素性の貧血"},{"letter":"B","text":"網赤血球の著明な増加"},{"letter":"C","text":"血清カリウムの著明な低下"},{"letter":"D","text":"正球性正色素性の貧血"},{"letter":"E","text":"直接ビリルビンの著明な上昇"}],"answer":["D"],"multi":false,"explanation":"解説：腎の間質でつくられるエリスロポエチンが減り，赤血球の産生が落ちる．鉄やビタミンの欠乏がなければ大きさも色調も正常な貧血となり，腎機能の低下とともに進む．\n- A：小球性低色素性は鉄欠乏性貧血．\n- B：網赤血球の増加は溶血や出血への骨髄の反応．\n- C：腎不全ではカリウムはむしろ貯留して上昇する．\n- D：腎性貧血の性状として正しい．\n- E：直接ビリルビンの上昇は閉塞性黄疸．","images":[],"stem_images":[]},{"number":7,"section":"D-8-S02　66歳男性・健診で腎機能低下","question":"（3/4）66歳の男性．健康診断で血清クレアチニン1.9mg/dL，eGFR 29mL/分/1.73m2と指摘され来院した．自覚症状はない．20年前から高血圧で治療中だが，通院は不規則だったという．Hb 9.4g/dLで正球性正色素性であった．併せて測定すべきなのはどれか．","options":[{"letter":"A","text":"血清アミラーゼとリパーゼ"},{"letter":"B","text":"呼気中一酸化窒素濃度"},{"letter":"C","text":"血清クレアチンキナーゼ"},{"letter":"D","text":"血中アンモニアの値"},{"letter":"E","text":"血清リンと副甲状腺ホルモン"}],"answer":["E"],"multi":false,"explanation":"解説：腎からのリン排泄が落ちて高リン血症となり，活性型ビタミンDの産生低下で低カルシウム血症が加わって副甲状腺ホルモンが上昇する．この骨・ミネラル代
